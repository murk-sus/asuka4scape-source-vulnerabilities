          s = open(p).read()
          s = s.replace('-lxpf -lchoma -L"$(SRCROOT)/natsuk1/External" -lgrabkernel2 -lpartial ', '')
          s = re.sub(r'^\s*LIBRARY_SEARCH_PATHS:.*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*SWIFT_INCLUDE_PATHS:.*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*- path: natsuk1/External/libgrabkernel2\.h\n\s*buildPhase: none\n', '', s, flags=re.M)
          s = re.sub(r'^\s*- path: natsuk1/External/partial\.h\n\s*buildPhase: none\n', '', s, flags=re.M)
          s = re.sub(r'^\s*- path: natsuk1/External/xpf\.h\n\s*buildPhase: none\n', '', s, flags=re.M)
          s = re.sub(r'^\s*- path: natsuk1/Resources/Offsets\.json\n\s*buildPhase: resources\n', '', s, flags=re.M)
          s = re.sub(r'^\s*- path: Offsets\n\s*type: folder\n\s*buildPhase: resources\n', '', s, flags=re.M)
          marker = '      - path: natsuk1/Resources/Assets.xcassets\n        buildPhase: resources\n'
          addition = marker + '      - path: natsuk1/Offsets\n        type: folder\n        buildPhase: resources\n'
          if '      - path: natsuk1/Offsets\n' not in s:
              s = s.replace(marker, addition)
          open(p, "w").write(s)

          print("cleanup OK")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Cleanup: drop dead primitives, versioned Offsets"
          git push
