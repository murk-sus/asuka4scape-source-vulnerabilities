                                  .fontWeight(.semibold)
                          }
                      }
                  }
              }
          }
          NKEOF

      - name: Patch Offsets JSON
        run: |
          python3 <<'PYEOF'
          import json

          p = "natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json"
          data = json.load(open(p))
          data["defaults"].pop("off_kernel_entry", None)
          for g in data["groups"]:
              g["items"] = [x for x in g["items"] if x != "off_kernel_entry"]
          data["groups"] = [g for g in data["groups"] if g["items"]]
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("offsets patched")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Silent-audio keep alive, haptics, short About, fix log menu"
          git push
