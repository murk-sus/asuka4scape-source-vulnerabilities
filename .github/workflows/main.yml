name: Cleanup repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete unused files
        run: |
          set -euo pipefail
          rm -rf natsuk1/External/choma
          for f in \
            CachePatching.h CSBlob.h CodeDirectory.h DER.h DyldSharedCache.h \
            Entitlements.h Fat.h FileStream.h Host.h MachO.h MachOByteOrder.h \
            MachOLoadCommand.h MemoryStream.h PatchFinder.h PatchFinder_arm64.h \
            Util.h arm64.h Base64.h BufferedStream.h dyld_cache_format.h \
            fixup-chains.h \
            libgrabkernel2.h partial.h xpf.h; do
            rm -f "natsuk1/External/$f"
          done
          rm -f natsuk1/Helpers/KernelcacheFetcher.swift
          rm -f natsuk1/Helpers/KernelcacheParser.swift
          rm -f natsuk1/Exploit/nk_sptm.c
          rm -f natsuk1/Exploit/nk_sptm.h

      - name: Apply source edits
        run: |
          python3 <<'PYEOF'
          import json, re, os

          def remove_swift_func(src, name):
              marker = f"    func {name}("
              idx = src.find(marker)
              if idx == -1:
                  return src
              brace_idx = src.find("{", idx)
              depth = 1
              i = brace_idx + 1
              while i < len(src) and depth > 0:
                  if src[i] == '{':
                      depth += 1
                  elif src[i] == '}':
                      depth -= 1
                  i += 1
              end = i
              while end < len(src) and src[end] == '\n':
                  end += 1
              return src[:idx] + src[end:]

          def remove_swift_section_containing(src, marker):
              idx = src.find(marker)
              if idx == -1:
                  return src
              sec_idx = src.rfind("Section {", 0, idx)
              if sec_idx == -1:
                  return src
              brace_idx = src.find("{", sec_idx)
              depth = 1
              i = brace_idx + 1
              while i < len(src) and depth > 0:
                  if src[i] == '{':
                      depth += 1
                  elif src[i] == '}':
                      depth -= 1
                  i += 1
              end = i
              while end < len(src) and src[end] == '\n':
                  end += 1
              return src[:sec_idx] + src[end:]

          p = "natsuk1/Exploit/nk_api.c"
          if os.path.exists(p):
              s = open(p).read()
              s = s.replace('#include "nk_sptm.h"\n', '')
              s = s.replace('    nk_sptm_targets();\n    nk_rule();\n\n', '')
              open(p, "w").write(s)

          p = "natsuk1/Exploit/nk_offsets.h"
          if os.path.exists(p):
              s = open(p).read()
              for name in ("NK_G_CHROOT", "NK_G_CS_ENFORCEMENT", "NK_G_KALLOC_TYPE",
                           "NK_G_MAC_POLICY", "NK_G_PROC_FIND", "NK_G_SET_BSDTASK",
                           "NK_G_SWAP_TASK_MAP", "NK_G_TASK_FOR_PID", "NK_G_TASK_INIT",
                           "NK_G_VM_MAP_KERNEL", "NK_G_VM_PAGE_ALLOC"):
                  s = re.sub(rf'^#define\s+{re.escape(name)}\s+.*\n', '', s, flags=re.M)
              s = re.sub(r'\n{3,}', '\n\n', s)
              open(p, "w").write(s)

          p = "natsuk1/Resources/Offsets.json"
          if os.path.exists(p):
              data = json.load(open(p))
              confirmed = {
                  "off_kernel_base", "off_kernel_entry", "off_sysent_base",
                  "off_sysent_count", "off_sysent_stride", "off_mach_trap_table",
                  "off_g_kernproc", "off_g_kernel_task", "off_g_zone_map",
                  "off_g_task_list", "off_g_kernel_map", "off_g_allproc",
                  "off_fn_copyin", "off_fn_copyout", "off_fn_kalloc_ext",
                  "off_fn_kfree_ext",
                  "off_proc_p_pid", "off_proc_ro_p_ucred",
                  "off_thread_task_threads_next", "off_task_bsd_info",
                  "off_task_itk_space", "off_task_map",
                  "off_zone_data_kalloc", "off_zone_early_kalloc",
                  "off_zone_kalloc_type_var", "off_zone_site_struct_task",
                  "off_zone_site_struct_proc", "off_zone_site_struct_thread",
                  "off_zone_site_struct_ucred", "off_zone_site_struct_ipc_port",
                  "off_zone_site_struct_ipc_entry", "off_zone_site_struct_fileproc",
                  "off_zone_site_struct_fileglob", "off_zone_site_struct_vnode",
                  "off_zone_site_struct_mount", "off_zone_site_struct_socket",
                  "off_zone_site_struct_inpcb", "off_zone_site_struct_pipe",
                  "off_zone_site_struct_vm_page",
                  "off_sptm_base", "off_sptm_ctrr_lock_boot",
                  "off_sptm_cpu_lock_system_registers",
                  "off_sptm_determine_kernel_ctrr", "off_sptm_bootstrap",
                  "off_sptm_map", "off_sptm_region", "off_sptm_panic",
                  "off_sptm_page_table",
              }
              data["defaults"] = {k: v for k, v in data["defaults"].items() if k in confirmed}
              for g in data["groups"]:
                  g["items"] = [x for x in g["items"] if x in confirmed]
              data["groups"] = [g for g in data["groups"] if g["items"]]
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")

          p = "natsuk1/Resources/natsuk1.entitlements"
          if os.path.exists(p):
              open(p, "w").write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
                  '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
                  '<plist version="1.0">\n'
                  '<dict>\n'
                  '    <key>com.apple.private.skip-library-validation</key><true/>\n'
                  '</dict>\n'
                  '</plist>\n'
              )

          p = "project.yml"
          if os.path.exists(p):
              s = open(p).read()
              s = s.replace('-lxpf -lchoma -L"$(SRCROOT)/natsuk1/External" -lgrabkernel2 -lpartial ', '')
              s = re.sub(r'^\s*LIBRARY_SEARCH_PATHS:.*\n', '', s, flags=re.M)
              s = re.sub(r'^\s*SWIFT_INCLUDE_PATHS:.*\n', '', s, flags=re.M)
              s = re.sub(r'^\s*- path: natsuk1/External/libgrabkernel2\.h\n\s*buildPhase: none\n', '', s, flags=re.M)
              s = re.sub(r'^\s*- path: natsuk1/External/partial\.h\n\s*buildPhase: none\n', '', s, flags=re.M)
              s = re.sub(r'^\s*- path: natsuk1/External/xpf\.h\n\s*buildPhase: none\n', '', s, flags=re.M)
              open(p, "w").write(s)

          p = "natsuk1/natsuk1.swift"
          if os.path.exists(p):
              s = open(p).read()
              for name in ("fetchKernelcache", "parseKernelcache", "fetchImages"):
                  s = remove_swift_func(s, name)
              s = s.replace('    @Published var kernelcachePath: String?\n', '')
              s = s.replace('    @Published var fetchingKernelcache: Bool = false\n', '')
              s = s.replace('    @Published var parsingKernelcache: Bool = false\n', '')
              s = s.replace('        self.kernelcachePath = UserDefaults.standard.string(forKey: "kernelcache_path")\n', '')
              open(p, "w").write(s)

          p = "natsuk1/Views/SettingsView.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = remove_swift_section_containing(s, 'Label("Kernelcache", systemImage: "shippingbox")')
              s = re.sub(
                  r'\n\s*private var kernelcacheStatus: String \{.*?\n    \}\n',
                  '\n',
                  s,
                  flags=re.DOTALL,
              )
              open(p, "w").write(s)

          print("cleanup OK")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Cleanup: remove unused files, unconfirmed offsets, fix build"
          git push
