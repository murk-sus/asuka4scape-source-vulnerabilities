      - name: Patch Info.plist
        run: |
          python3 <<'PYEOF'
          import re

          p = "natsuk1/Resources/Info.plist"
          s = open(p).read()

          s = re.sub(r'<key>MinimumOSVersion</key>\s*<string>[^<]*</string>',
                     '<key>MinimumOSVersion</key><string>27.0</string>', s)

          if "NSLocationAlwaysAndWhenInUseUsageDescription" not in s:
              insert = (
                  "    <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>\n"
                  "    <string>Keeps the app running in the background.</string>\n"
                  "    <key>NSLocationWhenInUseUsageDescription</key>\n"
                  "    <string>Keeps the app running in the background.</string>\n"
              )
              s = s.replace("</dict>\n</plist>", insert + "</dict>\n</plist>")

          if "UIBackgroundModes" not in s:
              insert = (
                  "    <key>UIBackgroundModes</key>\n"
                  "    <array>\n"
                  "        <string>audio</string>\n"
                  "        <string>location</string>\n"
                  "    </array>\n"
              )
              s = s.replace("</dict>\n</plist>", insert + "</dict>\n</plist>")

          open(p, "w").write(s)
          PYEOF

      - name: Patch project.yml
        run: |
          python3 <<'PYEOF'
          import re

          p = "project.yml"
          s = open(p).read()

          s = re.sub(r'(^\s*iOS:\s*)"[^"]*"', r'\1"27.0"', s, flags=re.M)
          s = re.sub(r'(IPHONEOS_DEPLOYMENT_TARGET:\s*)"[^"]*"', r'\1"27.0"', s, flags=re.M)

          s = re.sub(r'^\s*SWIFT_DISABLE_SAFETY_CHECKS:.*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*SWIFT_ENFORCE_EXCLUSIVE_ACCESS:.*\n', '', s, flags=re.M)

          deps_old = re.compile(
              r'    dependencies:\n'
              r'(?:      - sdk: [^\n]*\n)+',
              re.M
          )
          deps_new = (
              "    dependencies:\n"
              "      - sdk: Foundation.framework\n"
              "      - sdk: UIKit.framework\n"
              "      - sdk: WebKit.framework\n"
              "      - sdk: AVFoundation.framework\n"
              "      - sdk: CoreLocation.framework\n"
          )
          s = deps_old.sub(deps_new, s, count=1)

          s = re.sub(
              r'^\s*OTHER_LDFLAGS:.*$',
              '        OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz',
              s, flags=re.M
          )

          if "STRIPFLAGS" not in s:
              s = re.sub(
                  r'(^\s*STRIP_STYLE:\s*all\n)',
                  r'\1        STRIPFLAGS: "-S -x"\n',
                  s, flags=re.M
              )

          open(p, "w").write(s)
          PYEOF

      - name: Rewrite natsuk1.yml
        run: |
          cat > .github/workflows/natsuk1.yml <<'NKEOF'
          name: build and release

          on:
            push:
              branches: [ main ]
              paths-ignore:
                - 'README.md'
                - 'LICENSE'
                - 'natsuk1.png'
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: ios-release-development
            cancel-in-progress: true

          jobs:
            build-and-release:
              runs-on: macos-latest

              steps:
                - name: checkout
                  uses: actions/checkout@v4

                - name: select latest xcode
                  uses: maxim-lobanov/setup-xcode@v1
                  with:
                    xcode-version: latest-stable

                - name: cache homebrew
                  uses: actions/cache@v4
                  with:
                    path: ~/Library/Caches/Homebrew
                    key: brew-${{ runner.os }}-${{ hashFiles('project.yml') }}
                    restore-keys: |
                      brew-${{ runner.os }}-

                - name: install tools
                  run: |
                    brew install xcodegen ldid
                    brew link --overwrite xcodegen ldid

                - name: generate xcodeproj
                  run: xcodegen generate

                - name: build
                  run: |
                    set -euo pipefail
                    xcodebuild \
                      -project natsuk1.xcodeproj \
                      -scheme natsuk1 \
                      -configuration Release \
                      -sdk iphoneos \
                      -destination 'generic/platform=iOS' \
                      -derivedDataPath build \
                      -parallelizeTargets \
                      -jobs "$(sysctl -n hw.ncpu)" \
                      CODE_SIGNING_ALLOWED=NO \
                      build -quiet

                    APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
                    BIN_PATH="$APP_PATH/natsuk1"

                    strip -S -x "$BIN_PATH" || true
                    ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN_PATH"

                    rm -rf Payload natsuk1.ipa
                    mkdir -p Payload
                    cp -R "$APP_PATH" Payload/
                    ditto -c -k --norsrc --keepParent Payload natsuk1.ipa
                    rm -rf Payload

                    ls -lh natsuk1.ipa

                - name: release
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    set -euo pipefail

                    if gh release view development >/dev/null 2>&1; then
                      gh release delete development --yes --cleanup-tag
                    fi

                    NOTES="$(git log -5 --pretty=format:'- %h %s')"

                    gh release create development natsuk1.ipa \
                      --target "${GITHUB_SHA}" \
                      --title "Development" \
                      --prerelease \
                      --latest=false \
                      --notes "automated build from ${GITHUB_SHA}

                    ${NOTES}"
          NKEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "iOS 27 only, keep-alive, lean Exploit, smaller IPA, latest Xcode"
          git push
