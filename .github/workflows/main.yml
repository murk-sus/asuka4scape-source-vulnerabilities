name: Add kread/kwrite primitives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Write nk_krw.c
        run: |
          printf '%s\n' \
            '#include "nk_krw.h"' \
            '#include "nk_api.h"' \
            '#include <string.h>' \
            '#include <stdint.h>' \
            '' \
            'static int g_ready = 0;' \
            '' \
            'int nk_krw_init(void) {' \
            '    if (g_ready) return 0;' \
            '    int rc = nk_full_exploit();' \
            '    if (rc == 0) g_ready = 1;' \
            '    return rc;' \
            '}' \
            '' \
            'int nk_kread(uint64_t addr, void *buf, size_t size) {' \
            '    if (!g_ready) {' \
            '        if (nk_krw_init() != 0) return -1;' \
            '    }' \
            '    return nk_read_kernel(addr, buf, size);' \
            '}' \
            '' \
            'int nk_kwrite(uint64_t addr, const void *buf, size_t size) {' \
            '    if (!g_ready) {' \
            '        if (nk_krw_init() != 0) return -1;' \
            '    }' \
            '    return nk_write_kernel(addr, buf, size);' \
            '}' \
            '' \
            'uint64_t nk_kread64(uint64_t addr) {' \
            '    uint64_t v = 0;' \
            '    nk_kread(addr, &v, sizeof(v));' \
            '    return v;' \
            '}' \
            '' \
            'int nk_kwrite64(uint64_t addr, uint64_t value) {' \
            '    return nk_kwrite(addr, &value, sizeof(value));' \
            '}' \
            > natsuk1/Exploit/nk_krw.c
          cat natsuk1/Exploit/nk_krw.c

      - name: Write nk_krw.h
        run: |
          printf '%s\n' \
            '#ifndef NK_KRW_H' \
            '#define NK_KRW_H' \
            '' \
            '#include <stdint.h>' \
            '#include <stddef.h>' \
            '' \
            'int nk_krw_init(void);' \
            'int nk_kread(uint64_t addr, void *buf, size_t size);' \
            'int nk_kwrite(uint64_t addr, const void *buf, size_t size);' \
            'uint64_t nk_kread64(uint64_t addr);' \
            'int nk_kwrite64(uint64_t addr, uint64_t value);' \
            '' \
            '#endif' \
            > natsuk1/Exploit/nk_krw.h
          cat natsuk1/Exploit/nk_krw.h

      - name: Update bridging.h
        run: |
          printf '%s\n' \
            '#ifndef NATSUK1_BRIDGING_H' \
            '#define NATSUK1_BRIDGING_H' \
            '' \
            '#include <stdint.h>' \
            '#include "Exploit/nk_api.h"' \
            '#include "Exploit/nk_krw.h"' \
            '#import "External/libgrabkernel2.h"' \
            '#import "xpf.h"' \
            '' \
            '#endif' \
            > natsuk1/bridging.h
          cat natsuk1/bridging.h

      - name: Write KernelRW.swift
        run: |
          printf '%s\n' \
            'import Foundation' \
            '' \
            'final class KernelRW {' \
            '' \
            '    static let shared = KernelRW()' \
            '    private init() {}' \
            '' \
            '    private(set) var ready = false' \
            '' \
            '    @discardableResult' \
            '    func bootstrap() -> Bool {' \
            '        let rc = nk_krw_init()' \
            '        ready = (rc == 0)' \
            '        return ready' \
            '    }' \
            '' \
            '    func read64(_ addr: UInt64) -> UInt64? {' \
            '        guard ready else { return nil }' \
            '        let v = nk_kread64(addr)' \
            '        return v == 0 ? nil : v' \
            '    }' \
            '' \
            '    func write64(_ addr: UInt64, _ value: UInt64) -> Bool {' \
            '        guard ready else { return false }' \
            '        return nk_kwrite64(addr, value) == 0' \
            '    }' \
            '' \
            '    func read(_ addr: UInt64, size: Int) -> Data? {' \
            '        guard ready else { return nil }' \
            '        var buf = [UInt8](repeating: 0, count: size)' \
            '        let rc = nk_kread(addr, &buf, size)' \
            '        guard rc == 0 else { return nil }' \
            '        return Data(buf)' \
            '    }' \
            '' \
            '    func write(_ addr: UInt64, data: Data) -> Bool {' \
            '        guard ready else { return false }' \
            '        let bytes = [UInt8](data)' \
            '        return nk_kwrite(addr, bytes, bytes.count) == 0' \
            '    }' \
            '' \
            '    func testRoundTrip() -> String {' \
            '        guard let path = UserDefaults.standard.string(forKey: "kernelcache_path"),' \
            '              FileManager.default.fileExists(atPath: path) else {' \
            '            return "no kernelcache loaded"' \
            '        }' \
            '' \
            '        guard bootstrap() else {' \
            '            return "bootstrap failed"' \
            '        }' \
            '' \
            '        let base = OffsetsStore.shared.value(for: "off_kernel_base")' \
            '        guard let baseAddr = UInt64(base.dropFirst(2), radix: 16) else {' \
            '            return "bad kernel_base value"' \
            '        }' \
            '' \
            '        let original = nk_kread64(baseAddr)' \
            '        guard original != 0 else {' \
            '            return "read at kernel_base returned 0"' \
            '        }' \
            '' \
            '        guard nk_kwrite64(baseAddr, original) == 0 else {' \
            '            return "write at kernel_base failed"' \
            '        }' \
            '' \
            '        let verify = nk_kread64(baseAddr)' \
            '        if verify == original {' \
            '            return String(format: "OK - read 0x%llX, write-back identical", original)' \
            '        } else {' \
            '            return String(format: "MISMATCH - wrote 0x%llX, read 0x%llX", original, verify)' \
            '        }' \
            '    }' \
            '}' \
            > natsuk1/Helpers/KernelRW.swift
          cat natsuk1/Helpers/KernelRW.swift

      - name: Add Test R/W button to SettingsView
        run: |
          if grep -q "Test R/W" natsuk1/Views/SettingsView.swift; then
            echo "already patched"
            exit 0
          fi
          python3 - <<'PYEOF'
          import re
          path = 'natsuk1/Views/SettingsView.swift'
          with open(path) as f:
              src = f.read()

          button_block = '''                    Button {
                        let result = KernelRW.shared.testRoundTrip()
                        state.append("[/] Test R/W: \\(result)")
                    } label: {
                        HStack(spacing: 10) {
                            Image(systemName: "checkmark.shield")
                                .foregroundStyle(.tint)
                                .frame(width: 20)
                            Text("Test R/W")
                                .foregroundStyle(.tint)
                            Spacer(minLength: 8)
                        }
                        .contentShape(Rectangle())
                    }
                    .buttonStyle(.plain)

'''
          marker = '                    Button {\n                        state.fetchImages()'
          if marker not in src:
              print('marker not found')
              raise SystemExit(1)
          src = src.replace(marker, button_block + marker, 1)
          with open(path, 'w') as f:
              f.write(src)
          print('patched')
          PYEOF
          grep -n "Test R/W" natsuk1/Views/SettingsView.swift || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Test build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/nk_krw.c natsuk1/Exploit/nk_krw.h natsuk1/bridging.h natsuk1/Helpers/KernelRW.swift natsuk1/Views/SettingsView.swift
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add kread/kwrite primitive wrapper"
          git push
