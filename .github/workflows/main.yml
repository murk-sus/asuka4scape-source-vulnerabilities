name: Bump to iOS 27.0 and restore presentationBackground

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump deployment target
        run: |
          python3 <<'PYEOF'
          import re

          p = "project.yml"
          s = open(p).read()
          s = s.replace('    iOS: "16.0"', '    iOS: "27.0"')
          s = s.replace('IPHONEOS_DEPLOYMENT_TARGET: "16.0"', 'IPHONEOS_DEPLOYMENT_TARGET: "27.0"')
          open(p, "w").write(s)

          p = "natsuk1/Resources/Info.plist"
          s = open(p).read()
          s = re.sub(
              r'<key>MinimumOSVersion</key>\s*<string>[^<]*</string>',
              '<key>MinimumOSVersion</key><string>27.0</string>',
              s,
          )
          open(p, "w").write(s)
          PYEOF

      - name: Rewrite ContentView
        run: |
          cat > natsuk1/Views/ContentView.swift <<'NKEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState
              @AppStorage("verbose")  private var verbose: Bool = true
              @AppStorage("auto_run") private var auto_run: Bool = false

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 10) {
                                      Image(systemName: "bolt.fill")
                                          .foregroundStyle(.secondary)
                                          .frame(width: 20)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                          .foregroundStyle(.primary)
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                                  .contentShape(Rectangle())
                              }
                              .buttonStyle(.plain)
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Actions", "Действия"), systemImage: "play.circle")
                          } footer: {
                              Text(state.t("Runs kernel exploit, prints offsets and reference data.",
                                           "Запускает эксплойт, выводит оффсеты и справочные данные."))
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                                  .contentShape(Rectangle())
                              }
                              .buttonStyle(.plain)
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                              .buttonStyle(.plain)
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 0) {
                              Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                                  .font(.system(size: 10, design: .monospaced))
                                  .multilineTextAlignment(.leading)
                                  .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                                  .frame(maxWidth: .infinity, alignment: .leading)

                              Spacer(minLength: 0)
                                  .id(0)
                          }
                          .frame(maxWidth: .infinity, minHeight: 240, alignment: .topLeading)
                          .contentShape(Rectangle())
                      }
                      .tint(Color(UIColor.systemGray))
                      .contextMenu {
                          Button {
                              UIPasteboard.general.string = state.log
                          } label: {
                              Label("Copy Output", systemImage: "doc.on.doc")
                          }

                          Button(role: .destructive) {
                              state.clear()
                          } label: {
                              Label("Clear", systemImage: "trash")
                          }
                      }
                      .onChange(of: state.log) { _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          NKEOF

      - name: Rewrite OffsetsView
        run: |
          cat > natsuk1/Views/OffsetsView.swift <<'NKEOF'
          import SwiftUI
          import UIKit

          struct OffsetsView: View {
              @EnvironmentObject var store: OffsetsStore
              @State private var query = ""
              @State private var editing: String? = nil
              @State private var showResetAll = false
              @State private var showExport = false

              var body: some View {
                  List {
                      Section {
                          HStack {
                              Text("Filled")
                              Spacer()
                              Text("\(store.filledCount()) / \(store.totalCount())")
                                  .font(.system(.body, design: .monospaced))
                                  .foregroundColor(.secondary)
                          }
                      }

                      ForEach(filteredGroups, id: \.title) { group in
                          Section {
                              ForEach(group.items, id: \.self) { name in
                                  Button {
                                      editing = name
                                  } label: {
                                      OffsetRow(name: name, value: store.value(for: name))
                                  }
                                  .buttonStyle(.plain)
                              }
                          } header: {
                              Text(group.title)
                          }
                      }
                  }
                  .listStyle(.insetGrouped)
                  .scrollContentBackground(.hidden)
                  .background(Color(UIColor.systemGroupedBackground))
                  .searchable(text: $query, placement: .navigationBarDrawer(displayMode: .always))
                  .navigationTitle("Modify Offsets")
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .navigationBarTrailing) {
                          Menu {
                              Button { showExport = true } label: {
                                  Label("Export JSON", systemImage: "square.and.arrow.up")
                              }
                              Button(role: .destructive) { showResetAll = true } label: {
                                  Label("Reset All", systemImage: "arrow.uturn.backward")
                              }
                          } label: {
                              Image(systemName: "ellipsis.circle")
                                  .foregroundStyle(Color(UIColor.tertiaryLabel))
                          }
                      }
                  }
                  .sheet(item: Binding(
                      get: { editing.map { EditTarget(name: $0) } },
                      set: { editing = $0?.name }
                  )) { target in
                      EditOffsetView(name: target.name)
                          .environmentObject(store)
                          .presentationBackground(Color(UIColor.systemGroupedBackground))
                  }
                  .sheet(isPresented: $showExport) {
                      ExportOffsetsView()
                          .environmentObject(store)
                          .presentationBackground(Color(UIColor.systemGroupedBackground))
                  }
                  .alert("Reset All Offsets?", isPresented: $showResetAll) {
                      Button("Cancel", role: .cancel) {}
                      Button("Reset", role: .destructive) { store.reset() }
                  } message: {
                      Text("All offsets will be set to built-in defaults.")
                  }
              }

              private var filteredGroups: [OffsetsStore.Group] {
                  if query.isEmpty { return OffsetsStore.groups }
                  let q = query.lowercased()
                  return OffsetsStore.groups.compactMap { g in
                      let items = g.items.filter { $0.lowercased().contains(q) }
                      if items.isEmpty { return nil }
                      return OffsetsStore.Group(title: g.title, items: items)
                  }
              }
          }

          struct EditTarget: Identifiable {
              let name: String
              var id: String { name }
          }

          struct OffsetRow: View {
              let name: String
              let value: String

              private var valueColor: Color {
                  value == "0x0" ? Color.secondary : Color.green
              }

              var body: some View {
                  HStack(alignment: .firstTextBaseline, spacing: 8) {
                      Text(name)
                          .foregroundStyle(Color.primary)
                          .font(.system(size: 13, design: .monospaced))
                          .lineLimit(2)
                          .multilineTextAlignment(.leading)
                      Spacer(minLength: 8)
                      Text(value)
                          .font(.system(size: 13, design: .monospaced))
                          .foregroundColor(valueColor)
                  }
                  .padding(.vertical, 4)
                  .contentShape(Rectangle())
              }
          }

          struct EditOffsetView: View {
              @EnvironmentObject var store: OffsetsStore
              @Environment(\.dismiss) private var dismiss
              let name: String

              @State private var text: String = ""
              @State private var showError = false
              @State private var errorMsg = ""

              var body: some View {
                  NavigationStack {
                      Form {
                          Section {
                              Text(name)
                                  .font(.system(size: 12, design: .monospaced))
                                  .foregroundStyle(.secondary)
                          } header: {
                              Text("Offset")
                          }

                          Section {
                              TextField("Value", text: $text)
                                  .font(.system(size: 14, design: .monospaced))
                                  .autocorrectionDisabled()
                                  .textInputAutocapitalization(.never)
                                  .keyboardType(.asciiCapable)
                          } header: {
                              Text("Value")
                          } footer: {
                              Text("Hex (0x...) or decimal. Default: \(OffsetsStore.defaults[name] ?? "0x0")")
                          }

                          Section {
                              Button {
                                  store.resetOne(name)
                                  dismiss()
                              } label: {
                                  HStack {
                                      Image(systemName: "arrow.uturn.backward")
                                      Text("Restore Default")
                                  }
                              }
                          }
                      }
                      .navigationTitle("Edit")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Cancel") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Save") { save() }.fontWeight(.semibold)
                          }
                      }
                      .alert("Invalid Value", isPresented: $showError) {
                          Button("OK", role: .cancel) {}
                      } message: {
                          Text(errorMsg)
                      }
                      .onAppear { text = store.value(for: name) }
                  }
              }

              private func save() {
                  let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  if trimmed.isEmpty {
                      errorMsg = "Value cannot be empty."; showError = true; return
                  }
                  if trimmed.hasPrefix("0x") || trimmed.hasPrefix("0X") {
                      let hexPart = String(trimmed.dropFirst(2))
                      if UInt64(hexPart, radix: 16) == nil {
                          errorMsg = "Invalid hex value."; showError = true; return
                      }
                  } else if UInt64(trimmed) == nil {
                      errorMsg = "Invalid numeric value."; showError = true; return
                  }
                  store.update(name, value: trimmed)
                  dismiss()
              }
          }

          struct ExportOffsetsView: View {
              @EnvironmentObject var store: OffsetsStore
              @Environment(\.dismiss) private var dismiss
              @State private var copied = false

              private var json: String {
                  let sorted = store.values.sorted { $0.key < $1.key }
                  let dict = Dictionary(uniqueKeysWithValues: sorted)
                  if let data = try? JSONSerialization.data(
                      withJSONObject: dict,
                      options: [.prettyPrinted, .sortedKeys]
                  ), let str = String(data: data, encoding: .utf8) {
                      return str
                  }
                  return "{}"
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          Text(json)
                              .font(.system(size: 11, design: .monospaced))
                              .padding()
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .textSelection(.enabled)
                      }
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("Export")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  UIPasteboard.general.string = json
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Image(systemName: copied ? "checkmark" : "doc.on.doc")
                              }
                          }
                      }
                  }
              }
          }
          NKEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Target iOS 27.0, restore presentationBackground"
          git push
