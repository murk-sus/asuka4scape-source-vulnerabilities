name: Fix Offsets and Parser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Write Offsets.json
        run: |
          printf '%s\n' \
            '{' \
            '  "groups": [' \
            '    { "title": "Kernel", "items": ["off_kernel_base","off_kernel_entry","off_sysent_base","off_sysent_count","off_sysent_stride","off_mach_trap_table"] },' \
            '    { "title": "Globals", "items": ["off_g_kernproc","off_g_kernel_task","off_g_zone_map","off_g_task_list","off_g_kernel_map","off_g_allproc","off_g_rootvnode","off_g_cdevsw","off_g_pv_head_table","off_g_chroot","off_g_cs_enforcement","off_g_mac_policy","off_g_kalloc_type"] },' \
            '    { "title": "Primitives", "items": ["off_fn_copyin","off_fn_copyout","off_fn_kalloc_ext","off_fn_kfree_ext"] },' \
            '    { "title": "proc", "items": ["off_proc_p_pid","off_proc_ro_p_ucred","off_proc_p_list_le_next","off_proc_p_list_le_prev","off_proc_p_proc_ro","off_proc_p_fd","off_proc_p_flag","off_proc_p_textvp","off_proc_p_name","off_proc_p_task","off_proc_ro_pr_task"] },' \
            '    { "title": "task", "items": ["off_task_map","off_task_threads_next","off_task_itk_space","off_task_itk_self","off_task_bsd_info","off_task_task_exc_guard","off_task_t_flags"] },' \
            '    { "title": "thread", "items": ["off_thread_task_threads_next","off_thread_ast","off_thread_ctid","off_thread_options","off_thread_t_tro","off_thread_ro_tro_task","off_thread_ro_tro_proc","off_thread_machine_upcb","off_thread_machine_contextdata","off_thread_machine_kstackptr","off_thread_machine_jop_pid","off_thread_machine_rop_pid","off_thread_mutex_lck_mtx_data","off_thread_guard_exc_info_code","off_thread_mach_exc_info_exception_type","off_thread_mach_exc_info_code","off_thread_mach_exc_info_os_reason"] },' \
            '    { "title": "ucred / label", "items": ["off_ucred_cr_label","off_kauth_cred_uid","off_kauth_cred_gid","off_kauth_cred_ruid","off_kauth_cred_rgid","off_kauth_cred_svuid","off_kauth_cred_svgid","off_label_l_perpolicy_amfi","off_label_l_perpolicy_sandbox"] },' \
            '    { "title": "ipc", "items": ["off_ipc_space_is_table","off_ipc_space_active","off_ipc_entry_ie_object","off_ipc_port_ip_kobject","off_ipc_port_ip_receiver","off_ipc_port_ip_mscount","off_sizeof_ipc_entry"] },' \
            '    { "title": "filedesc / fileproc / fileglob", "items": ["off_filedesc_fd_ofiles","off_filedesc_fd_cdir","off_fileproc_fp_glob","off_fileproc_fp_fg","off_fileglob_fg_data","off_fileglob_fg_flag"] },' \
            '    { "title": "vnode / mount / namecache", "items": ["off_vnode_v_iocount","off_vnode_v_writecount","off_vnode_v_flag","off_vnode_v_mount","off_vnode_v_parent","off_vnode_v_data","off_vnode_v_name","off_vnode_v_usecount","off_vnode_v_ncchildren_tqh_first","off_vnode_v_nclinks_lh_first","off_mount_mnt_flag","off_namecache_nc_vp","off_namecache_nc_child_tqe_next"] },' \
            '    { "title": "vm", "items": ["off_vm_map_hdr","off_vm_map_header_nentries","off_vm_map_header_links_next","off_vm_map_entry_links_next","off_vm_map_entry_vme_object_or_delta","off_vm_map_entry_vme_alias","off_vm_object_vo_un1_vou_size","off_vm_object_ref_count","off_vm_named_entry_backing_copy","off_vm_named_entry_size","off_vm_map_pmap","smr_base","t1sz_boot","off_cpu_ttep","VM_MIN_KERNEL_ADDRESS","VM_MAX_KERNEL_ADDRESS"] },' \
            '    { "title": "socket / inpcb", "items": ["off_socket_so_usecount","off_socket_so_proto","off_socket_so_background_thread","off_inpcb_inp_list_le_next","off_inpcb_inp_pcbinfo","off_inpcb_inp_socket","off_inpcbinfo_ipi_zone","off_inpcb_inp_depend6_inp6_icmp6filt","off_inpcb_inp_depend6_inp6_chksum"] },' \
            '    { "title": "arm", "items": ["off_arm_kernel_saved_state_sp","off_arm_saved_state64_lr","off_arm_saved_state64_pc","off_arm_saved_state_us_ss_64"] },' \
            '    { "title": "kalloc", "items": ["off_kalloc_type_view_kt_zv_zv_name"] }' \
            '  ],' \
            '  "defaults": {' \
            '    "off_kernel_base": "0xFFFFFFF007004000",' \
            '    "off_kernel_entry": "0xFFFFFFF00AA4C000",' \
            '    "off_sysent_base": "0xFFFFFFF007C192A0",' \
            '    "off_sysent_count": "558",' \
            '    "off_sysent_stride": "24",' \
            '    "off_mach_trap_table": "0xFFFFFFF007BE8018",' \
            '    "off_g_kernproc": "0xFFFFFFF007BBF040",' \
            '    "off_g_kernel_task": "0xFFFFFFF00700DC70",' \
            '    "off_g_zone_map": "0xFFFFFFF00AD6A800",' \
            '    "off_g_task_list": "0xFFFFFFF0080D93F0",' \
            '    "off_g_kernel_map": "0xFFFFFFF007BBE228",' \
            '    "off_g_allproc": "0xFFFFFFF00AD74580",' \
            '    "off_g_rootvnode": "0xFFFFFFF00AD71050",' \
            '    "off_g_chroot": "0xFFFFFFF00700DD10",' \
            '    "off_g_cs_enforcement": "0xFFFFFFF008E93AC4",' \
            '    "off_g_mac_policy": "0xFFFFFFF00AE05C70",' \
            '    "off_g_kalloc_type": "0xFFFFFFF007BBF180",' \
            '    "off_fn_copyin": "0xFFFFFFF00A7B9570",' \
            '    "off_fn_copyout": "0xFFFFFFF00A2C6C28",' \
            '    "off_fn_kalloc_ext": "0xFFFFFFF00A200DCC",' \
            '    "off_fn_kfree_ext": "0xFFFFFFF00A201000",' \
            '    "off_proc_p_pid": "0x74",' \
            '    "off_proc_ro_p_ucred": "0xB8",' \
            '    "off_thread_task_threads_next": "0x50",' \
            '    "off_task_map": "0x28",' \
            '    "off_task_threads_next": "0x58",' \
            '    "off_task_itk_space": "0x300",' \
            '    "off_task_itk_self": "0x308",' \
            '    "off_task_bsd_info": "0x368",' \
            '    "off_ipc_space_is_table": "0x20",' \
            '    "off_ipc_entry_ie_object": "0x0",' \
            '    "off_ipc_port_ip_kobject": "0x68",' \
            '    "off_vnode_v_mount": "0xC8",' \
            '    "off_vnode_v_parent": "0xC0",' \
            '    "off_vnode_v_data": "0xE0",' \
            '    "off_vnode_v_name": "0xD8",' \
            '    "off_vnode_v_usecount": "0x20",' \
            '    "off_vnode_v_iocount": "0x24",' \
            '    "off_vnode_v_writecount": "0x28",' \
            '    "off_vnode_v_flag": "0x54",' \
            '    "off_mount_mnt_flag": "0x70",' \
            '    "off_socket_so_usecount": "0x2C",' \
            '    "off_socket_so_proto": "0x18",' \
            '    "off_inpcb_inp_list_le_next": "0x0",' \
            '    "off_inpcb_inp_pcbinfo": "0x38",' \
            '    "off_inpcb_inp_socket": "0x40",' \
            '    "off_kalloc_type_view_kt_zv_zv_name": "0x18",' \
            '    "VM_MIN_KERNEL_ADDRESS": "0xFFFFFFF000000000",' \
            '    "VM_MAX_KERNEL_ADDRESS": "0xFFFFFFF200000000",' \
            '    "smr_base": "0xFFFFFFF007004000",' \
            '    "t1sz_boot": "25",' \
            '    "off_arm_kernel_saved_state_sp": "0x10",' \
            '    "off_arm_saved_state64_lr": "0x108",' \
            '    "off_arm_saved_state64_pc": "0x100",' \
            '    "off_arm_saved_state_us_ss_64": "0x0"' \
            '  }' \
            '}' \
            > natsuk1/Resources/Offsets.json
          python3 -c "import json; json.load(open('natsuk1/Resources/Offsets.json')); print('JSON valid')"

      - name: Write KernelcacheParser.swift
        run: |
          printf '%s\n' \
            'import Foundation' \
            '' \
            'final class KernelcacheParser {' \
            '' \
            '    static let shared = KernelcacheParser()' \
            '    private init() {}' \
            '' \
            '    func parse(url: URL) throws -> [String: String] {' \
            '        let kernelPath = url.path' \
            '' \
            '        let docs = URL(fileURLWithPath: NSHomeDirectory()).appendingPathComponent("Documents")' \
            '        let sptmPath = docs.appendingPathComponent("images/sptm.im4p").path' \
            '        let txmPath  = docs.appendingPathComponent("images/txm.im4p").path' \
            '' \
            '        let hasSptm = FileManager.default.fileExists(atPath: sptmPath)' \
            '        let hasTxm  = FileManager.default.fileExists(atPath: txmPath)' \
            '' \
            '        let rc: Int32 = kernelPath.withCString { kp in' \
            '            if hasSptm && hasTxm {' \
            '                return sptmPath.withCString { sp in' \
            '                    txmPath.withCString { tp in' \
            '                        xpf_start_with_kernel_path(kp, sp, tp)' \
            '                    }' \
            '                }' \
            '            } else {' \
            '                return xpf_start_with_kernel_path(kp, nil, nil)' \
            '            }' \
            '        }' \
            '' \
            '        guard rc == 0 else {' \
            '            let err = String(cString: xpf_get_error())' \
            '            throw NSError(domain: "KernelcacheParser", code: 1,' \
            '                          userInfo: [NSLocalizedDescriptionKey: "xpf start error: \(err)"])' \
            '        }' \
            '' \
            '        let basePtr = strdup("base")' \
            '        let transPtr = strdup("translation")' \
            '        let structPtr = strdup("struct")' \
            '' \
            '        var sets: [UnsafePointer<CChar>?] = [' \
            '            UnsafePointer(basePtr),' \
            '            UnsafePointer(transPtr),' \
            '            UnsafePointer(structPtr),' \
            '            nil' \
            '        ]' \
            '' \
            '        _ = sets.withUnsafeMutableBufferPointer { buf -> xpc_object_t? in' \
            '            return xpf_construct_offset_dictionary(buf.baseAddress!)' \
            '        }' \
            '' \
            '        free(basePtr)' \
            '        free(transPtr)' \
            '        free(structPtr)' \
            '' \
            '        var result: [String: String] = [:]' \
            '' \
            '        let map: [(String, String)] = [' \
            '            ("kernelBase",                              "off_kernel_base"),' \
            '            ("kernelEntry",                             "off_kernel_entry"),' \
            '            ("kernelConstant.nsysent",                  "off_sysent_count"),' \
            '            ("kernelConstant.cpu_ttep",                 "off_cpu_ttep"),' \
            '            ("kernelSymbol.kernproc",                   "off_g_kernproc"),' \
            '            ("kernelSymbol.allproc",                    "off_g_allproc"),' \
            '            ("kernelSymbol.rootvnode",                  "off_g_rootvnode"),' \
            '            ("kernelSymbol.kernel_task",                "off_g_kernel_task"),' \
            '            ("kernelSymbol.zone_map",                   "off_g_zone_map"),' \
            '            ("kernelSymbol.cdevsw",                     "off_g_cdevsw"),' \
            '            ("kernelSymbol.pv_head_table",              "off_g_pv_head_table"),' \
            '            ("kernelSymbol.cs_enforcement",             "off_g_cs_enforcement"),' \
            '            ("kernelSymbol.mac_policy",                 "off_g_mac_policy"),' \
            '            ("translation.t1sz_boot",                   "t1sz_boot"),' \
            '            ("translation.gVirtBase",                   "smr_base"),' \
            '            ("kernelStruct.proc.struct_size",           "procsize"),' \
            '            ("kernelStruct.proc.p_pid",                 "off_proc_p_pid"),' \
            '            ("kernelStruct.proc.p_ucred",               "off_proc_ro_p_ucred"),' \
            '            ("kernelStruct.proc.p_list_le_next",        "off_proc_p_list_le_next"),' \
            '            ("kernelStruct.proc.p_list_le_prev",        "off_proc_p_list_le_prev"),' \
            '            ("kernelStruct.proc.p_task",                "off_proc_p_task"),' \
            '            ("kernelStruct.proc.p_fd",                  "off_proc_p_fd"),' \
            '            ("kernelStruct.proc.p_flag",                "off_proc_p_flag"),' \
            '            ("kernelStruct.task.map",                   "off_task_map"),' \
            '            ("kernelStruct.task.threads_next",          "off_task_threads_next"),' \
            '            ("kernelStruct.task.itk_space",             "off_task_itk_space"),' \
            '            ("kernelStruct.task.itk_self",              "off_task_itk_self"),' \
            '            ("kernelStruct.task.bsd_info",              "off_task_bsd_info"),' \
            '            ("kernelStruct.task.t_flags",               "off_task_t_flags"),' \
            '            ("kernelStruct.thread.threads_next",        "off_thread_task_threads_next"),' \
            '            ("kernelStruct.thread.ast",                 "off_thread_ast"),' \
            '            ("kernelStruct.thread.ctid",                "off_thread_ctid"),' \
            '            ("kernelStruct.thread.options",             "off_thread_options"),' \
            '            ("kernelStruct.thread.machine_upcb",        "off_thread_machine_upcb"),' \
            '            ("kernelStruct.thread.machine_contextdata", "off_thread_machine_contextdata"),' \
            '            ("kernelStruct.thread.machine_kstackptr",   "off_thread_machine_kstackptr"),' \
            '            ("kernelStruct.thread.machine_jop_pid",     "off_thread_machine_jop_pid"),' \
            '            ("kernelStruct.thread.machine_rop_pid",     "off_thread_machine_rop_pid"),' \
            '            ("kernelStruct.ucred.cr_label",             "off_ucred_cr_label"),' \
            '            ("kernelStruct.ipc_space.is_table",         "off_ipc_space_is_table"),' \
            '            ("kernelStruct.ipc_entry.ie_object",        "off_ipc_entry_ie_object"),' \
            '            ("kernelStruct.ipc_port.ip_kobject",        "off_ipc_port_ip_kobject"),' \
            '            ("kernelStruct.ipc_port.ip_receiver",       "off_ipc_port_ip_receiver"),' \
            '            ("kernelStruct.fileproc.fp_glob",           "off_fileproc_fp_glob"),' \
            '            ("kernelStruct.fileglob.fg_data",           "off_fileglob_fg_data"),' \
            '            ("kernelStruct.vnode.v_mount",              "off_vnode_v_mount"),' \
            '            ("kernelStruct.vnode.v_parent",             "off_vnode_v_parent"),' \
            '            ("kernelStruct.vnode.v_data",               "off_vnode_v_data"),' \
            '            ("kernelStruct.vnode.v_name",               "off_vnode_v_name"),' \
            '            ("kernelStruct.vnode.v_usecount",           "off_vnode_v_usecount"),' \
            '            ("kernelStruct.vnode.v_iocount",            "off_vnode_v_iocount"),' \
            '            ("kernelStruct.vnode.v_writecount",         "off_vnode_v_writecount"),' \
            '            ("kernelStruct.vnode.v_flag",               "off_vnode_v_flag"),' \
            '            ("kernelStruct.mount.mnt_flag",             "off_mount_mnt_flag"),' \
            '            ("kernelStruct.socket.so_usecount",         "off_socket_so_usecount"),' \
            '            ("kernelStruct.socket.so_proto",            "off_socket_so_proto"),' \
            '            ("kernelStruct.inpcb.inp_list_le_next",     "off_inpcb_inp_list_le_next"),' \
            '            ("kernelStruct.inpcb.inp_pcbinfo",          "off_inpcb_inp_pcbinfo"),' \
            '            ("kernelStruct.inpcb.inp_socket",           "off_inpcb_inp_socket")' \
            '        ]' \
            '' \
            '        for (xpfKey, ourKey) in map {' \
            '            let v = xpfKey.withCString { xpf_item_resolve($0) }' \
            '            if v != 0 {' \
            '                result[ourKey] = String(format: "0x%llX", v)' \
            '            }' \
            '        }' \
            '' \
            '        xpf_stop()' \
            '        return result' \
            '    }' \
            '}' \
            > natsuk1/Helpers/KernelcacheParser.swift
          cat natsuk1/Helpers/KernelcacheParser.swift

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Test build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Resources/Offsets.json natsuk1/Helpers/KernelcacheParser.swift
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Expand offsets and XPF parser keys"
          git push
