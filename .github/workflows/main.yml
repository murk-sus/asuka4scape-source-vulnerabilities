name: Rebuild for iOS 27, keep-alive, lean Exploit, smaller IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete old Exploit files
        run: |
          rm -f natsuk1/Exploit/nk_log.c
          rm -f natsuk1/Exploit/nk_log.h
          rm -f natsuk1/Exploit/nk_api.c
          rm -f natsuk1/Exploit/nk_api.h
          rm -f natsuk1/Exploit/nk_offsets.h

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'NKEOF'
          #ifndef NK_API_H
          #define NK_API_H

          #include <stdint.h>
          #include <stddef.h>

          typedef enum {
              NK_LOG_TRACE = 0,
              NK_LOG_DEBUG = 1,
              NK_LOG_INFO  = 2,
              NK_LOG_WARN  = 3,
              NK_LOG_ERROR = 4
          } nk_log_level_t;

          void nk_set_log(void (*fn)(const char *));
          void nk_set_log_level(nk_log_level_t lvl);
          nk_log_level_t nk_get_log_level(void);
          void nk_logx(nk_log_level_t lvl, const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);

          int nk_run(void);
          int nk_full_exploit(void);

          uint64_t nk_get_kernel_base(void);
          uint64_t nk_get_sysent_base(void);
          uint64_t nk_get_mach_trap_table(void);

          #define NK_INFO(tag, ...)  nk_logx(NK_LOG_INFO,  tag, __VA_ARGS__)
          #define NK_WARN(tag, ...)  nk_logx(NK_LOG_WARN,  tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)   nk_logx(NK_LOG_ERROR, tag, __VA_ARGS__)
          #define NK_DEBUG(tag, ...) nk_logx(NK_LOG_DEBUG, tag, __VA_ARGS__)

          #endif
          NKEOF

      - name: Write nk_api.c
        run: |
          cat > natsuk1/Exploit/nk_api.c <<'NKEOF'
          #include "nk_api.h"
          #include "nk_offsets.h"
          #include <stdarg.h>
          #include <stdio.h>
          #include <time.h>

          static void (*g_fn)(const char *) = NULL;
          static double g_t0 = 0.0;
          static nk_log_level_t g_lvl = NK_LOG_INFO;

          static double nk_now_ms(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (double)ts.tv_sec * 1000.0 + (double)ts.tv_nsec / 1e6;
          }

          void nk_set_log(void (*fn)(const char *)) {
              g_fn = fn;
              if (g_t0 == 0.0) g_t0 = nk_now_ms();
          }

          void nk_set_log_level(nk_log_level_t lvl) { g_lvl = lvl; }
          nk_log_level_t nk_get_log_level(void) { return g_lvl; }

          static const char *lvl_str(nk_log_level_t l) {
              switch (l) {
                  case NK_LOG_TRACE: return "TRC";
                  case NK_LOG_DEBUG: return "DBG";
                  case NK_LOG_INFO:  return "INF";
                  case NK_LOG_WARN:  return "WRN";
                  case NK_LOG_ERROR: return "ERR";
              }
              return "???";
          }

          void nk_logx(nk_log_level_t lvl, const char *tag, const char *fmt, ...) {
              if (lvl < g_lvl || !g_fn) return;
              char body[512];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[640];
              double t = nk_now_ms() - g_t0;
              snprintf(out, sizeof(out), "[%9.3f][%s][%-6s] %s", t, lvl_str(lvl), tag, body);
              g_fn(out);
          }

          void nk_log(const char *fmt, ...) {
              if (!g_fn) return;
              char body[512];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[640];
              double t = nk_now_ms() - g_t0;
              snprintf(out, sizeof(out), "[%9.3f][INF][MAIN  ] %s", t, body);
              g_fn(out);
          }

          void nk_rule(void) { nk_log("----"); }

          int nk_run(void) {
              nk_log("natsuk1 v5.1");
              nk_log("iOS 27.0 / 24A437 / iPhone14,5");
              nk_rule();

              NK_INFO("BASE", "kernel          0x%016llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent          0x%016llX (%d entries)",
                      (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              NK_INFO("BASE", "mach_trap_table 0x%016llX", (unsigned long long)NK_MACH_TRAP_TABLE);
              nk_rule();

              NK_INFO("PRIM", "copyin   0x%016llX", (unsigned long long)NK_FN_COPYIN);
              NK_INFO("PRIM", "copyout  0x%016llX", (unsigned long long)NK_FN_COPYOUT);
              NK_INFO("PRIM", "kalloc   0x%016llX", (unsigned long long)NK_FN_KALLOC_EXT);
              NK_INFO("PRIM", "kfree    0x%016llX", (unsigned long long)NK_FN_KFREE_EXT);
              nk_rule();

              NK_INFO("STRUCT", "proc_pid     0x%X", NK_OFF_PROC_PID);
              NK_INFO("STRUCT", "proc_ucred   0x%X", NK_OFF_PROC_UCRED);
              NK_INFO("STRUCT", "task_thread  0x%X", NK_OFF_TASK_THREAD);
              nk_rule();

              NK_WARN("STATE", "No kernel R/W primitive on iOS 27.0 (24A437).");
              NK_WARN("STATE", "Reference data only.");
              nk_rule();

              return 0;
          }

          int nk_full_exploit(void) { return nk_run(); }

          uint64_t nk_get_kernel_base(void)     { return NK_KERNEL_BASE; }
          uint64_t nk_get_sysent_base(void)     { return NK_SYSENT_BASE; }
          uint64_t nk_get_mach_trap_table(void) { return NK_MACH_TRAP_TABLE; }
          NKEOF

      - name: Write nk_offsets.h
        run: |
          cat > natsuk1/Exploit/nk_offsets.h <<'NKEOF'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H

          #define NK_KERNEL_BASE            0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE            0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT           558
          #define NK_SYSENT_STRIDE          24
          #define NK_MACH_TRAP_TABLE        0xFFFFFFF007BE8018ULL

          #define NK_FN_COPYIN              0xFFFFFFF00A7B9570ULL
          #define NK_FN_COPYOUT             0xFFFFFFF00A2C6C28ULL
          #define NK_FN_KALLOC_EXT          0xFFFFFFF00A200DCCULL
          #define NK_FN_KFREE_EXT           0xFFFFFFF00A201000ULL

          #define NK_OFF_PROC_PID           0x74
          #define NK_OFF_PROC_UCRED         0xB8
          #define NK_OFF_TASK_THREAD        0x50

          #endif
          NKEOF

      - name: Write bridging.h
        run: |
          cat > natsuk1/bridging.h <<'NKEOF'
          #ifndef NATSUK1_BRIDGING_H
          #define NATSUK1_BRIDGING_H

          #include <stdint.h>
