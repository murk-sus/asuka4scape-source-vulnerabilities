name: Final fix - kernel R/W, Run Exploit, inspect nk_api

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Inspect nk_api.c
        run: |
          echo "=== nk_api.c ==="
          cat natsuk1/Exploit/nk_api.c || echo "not found"
          echo ""
          echo "=== nk_api.h ==="
          cat natsuk1/Exploit/nk_api.h || echo "not found"
          echo ""
          echo "=== nk_offsets.h (first 60 lines) ==="
          head -60 natsuk1/Exploit/nk_offsets.h || echo "not found"
          echo ""
          echo "=== nk_syscalls.c ==="
          cat natsuk1/Exploit/nk_syscalls.c || echo "not found"

      - name: Write nk_krw.h
        run: |
          printf '%s\n' \
            '#ifndef NK_KRW_H' \
            '#define NK_KRW_H' \
            '' \
            '#include <stdint.h>' \
            '#include <stddef.h>' \
            '' \
            'int nk_krw_init(void);' \
            'int nk_krw_ready(void);' \
            'int nk_kread(uint64_t addr, void *buf, size_t size);' \
            'int nk_kwrite(uint64_t addr, const void *buf, size_t size);' \
            'uint64_t nk_kread64(uint64_t addr);' \
            'int nk_kwrite64(uint64_t addr, uint64_t value);' \
            'const char *nk_krw_error(void);' \
            '' \
            '#endif' \
            > natsuk1/Exploit/nk_krw.h
          cat natsuk1/Exploit/nk_krw.h

      - name: Write nk_krw.c
        run: |
          printf '%s\n' \
            '#include "nk_krw.h"' \
            '#include <mach/mach.h>' \
            '#include <stdio.h>' \
            '#include <string.h>' \
            '' \
            'static mach_port_t g_kernel_task = MACH_PORT_NULL;' \
            'static int g_ready = 0;' \
            'static char g_error[256] = {0};' \
            '' \
            'const char *nk_krw_error(void) {' \
            '    return g_error;' \
            '}' \
            '' \
            'int nk_krw_ready(void) {' \
            '    return g_ready;' \
            '}' \
            '' \
            'int nk_krw_init(void) {' \
            '    if (g_ready) return 0;' \
            '    mach_port_t kt = MACH_PORT_NULL;' \
            '    kern_return_t kr = task_for_pid(mach_task_self(), 0, &kt);' \
            '    if (kr != KERN_SUCCESS || kt == MACH_PORT_NULL) {' \
            '        snprintf(g_error, sizeof(g_error), "task_for_pid(0) failed: kr=0x%x", kr);' \
            '        return -1;' \
            '    }' \
            '    g_kernel_task = kt;' \
            '    g_ready = 1;' \
            '    snprintf(g_error, sizeof(g_error), "ready");' \
            '    return 0;' \
            '}' \
            '' \
            'int nk_kread(uint64_t addr, void *buf, size_t size) {' \
            '    if (!g_ready && nk_krw_init() != 0) return -1;' \
            '    vm_size_t out_size = 0;' \
            '    kern_return_t kr = vm_read_overwrite(' \
            '        g_kernel_task,' \
            '        (vm_address_t)addr,' \
            '        (vm_size_t)size,' \
            '        (vm_address_t)(uintptr_t)buf,' \
            '        &out_size' \
            '    );' \
            '    if (kr != KERN_SUCCESS) {' \
            '        snprintf(g_error, sizeof(g_error), "read 0x%llX failed: kr=0x%x", (unsigned long long)addr, kr);' \
            '        return -1;' \
            '    }' \
            '    if (out_size != size) {' \
            '        snprintf(g_error, sizeof(g_error), "read short: %llu/%zu", (unsigned long long)out_size, size);' \
            '        return -1;' \
            '    }' \
            '    return 0;' \
            '}' \
            '' \
            'int nk_kwrite(uint64_t addr, const void *buf, size_t size) {' \
            '    if (!g_ready && nk_krw_init() != 0) return -1;' \
            '    kern_return_t kr = vm_write(' \
            '        g_kernel_task,' \
            '        (vm_address_t)addr,' \
            '        (vm_offset_t)(uintptr_t)buf,' \
            '        (mach_msg_type_number_t)size' \
            '    );' \
            '    if (kr != KERN_SUCCESS) {' \
            '        snprintf(g_error, sizeof(g_error), "write 0x%llX failed: kr=0x%x", (unsigned long long)addr, kr);' \
            '        return -1;' \
            '    }' \
            '    return 0;' \
            '}' \
            '' \
            'uint64_t nk_kread64(uint64_t addr) {' \
            '    uint64_t v = 0;' \
            '    if (nk_kread(addr, &v, sizeof(v)) != 0) return 0;' \
            '    return v;' \
            '}' \
            '' \
            'int nk_kwrite64(uint64_t addr, uint64_t value) {' \
            '    return nk_kwrite(addr, &value, sizeof(value));' \
            '}' \
            > natsuk1/Exploit/nk_krw.c
          cat natsuk1/Exploit/nk_krw.c

      - name: Write bridging.h
        run: |
          printf '%s\n' \
            '#ifndef NATSUK1_BRIDGING_H' \
            '#define NATSUK1_BRIDGING_H' \
            '' \
            '#include <stdint.h>' \
            '#include "Exploit/nk_api.h"' \
            '#include "Exploit/nk_krw.h"' \
            '#import "External/libgrabkernel2.h"' \
            '#import "xpf.h"' \
            '' \
            '#endif' \
            > natsuk1/bridging.h
          cat natsuk1/bridging.h

      - name: Write KernelRW.swift
        run: |
          printf '%s\n' \
            'import Foundation' \
            '' \
            'final class KernelRW {' \
            '' \
            '    static let shared = KernelRW()' \
            '    private init() {}' \
            '' \
            '    var ready: Bool { nk_krw_ready() != 0 }' \
            '    var lastError: String { String(cString: nk_krw_error()) }' \
            '' \
            '    @discardableResult' \
            '    func bootstrap() -> Bool {' \
            '        return nk_krw_init() == 0' \
            '    }' \
            '' \
            '    func read64(_ addr: UInt64) -> UInt64? {' \
            '        let v = nk_kread64(addr)' \
            '        return v == 0 ? nil : v' \
            '    }' \
            '' \
            '    func write64(_ addr: UInt64, _ value: UInt64) -> Bool {' \
            '        return nk_kwrite64(addr, value) == 0' \
            '    }' \
            '' \
            '    func read(_ addr: UInt64, size: Int) -> Data? {' \
            '        var buf = [UInt8](repeating: 0, count: size)' \
            '        let rc = nk_kread(addr, &buf, size)' \
            '        guard rc == 0 else { return nil }' \
            '        return Data(buf)' \
            '    }' \
            '' \
            '    func write(_ addr: UInt64, data: Data) -> Bool {' \
            '        let bytes = [UInt8](data)' \
            '        return nk_kwrite(addr, bytes, bytes.count) == 0' \
            '    }' \
            '' \
            '    func testRoundTrip() -> String {' \
            '        guard bootstrap() else {' \
            '            return "bootstrap failed: \\(lastError)"' \
            '        }' \
            '        let baseStr = OffsetsStore.shared.value(for: "off_kernel_base")' \
            '        guard baseStr.hasPrefix("0x"),' \
            '              let baseAddr = UInt64(baseStr.dropFirst(2), radix: 16),' \
            '              baseAddr != 0 else {' \
            '            return "bad off_kernel_base value: \\(baseStr)"' \
            '        }' \
            '        guard let original = read64(baseAddr) else {' \
            '            return "read 0x\\(String(baseAddr, radix: 16)) failed: \\(lastError)"' \
            '        }' \
            '        guard write64(baseAddr, original) else {' \
            '            return "write 0x\\(String(baseAddr, radix: 16)) failed: \\(lastError)"' \
            '        }' \
            '        guard let verify = read64(baseAddr) else {' \
            '            return "re-read after write failed: \\(lastError)"' \
            '        }' \
            '        if verify == original {' \
            '            return String(format: "OK - read/write at 0x%llX value 0x%llX", baseAddr, original)' \
            '        } else {' \
            '            return String(format: "MISMATCH at 0x%llX: wrote 0x%llX read 0x%llX", baseAddr, original, verify)' \
            '        }' \
            '    }' \
            '}' \
            > natsuk1/Helpers/KernelRW.swift
          cat natsuk1/Helpers/KernelRW.swift

      - name: Patch ContentView
        run: |
          sed -i '' 's|Run Offsets|Run Exploit|g' natsuk1/Views/ContentView.swift
          sed -i '' 's|Запустить оффсеты|Запустить эксплойт|g' natsuk1/Views/ContentView.swift
          sed -i '' 's|Prints kernel offsets, runs NECP probe, syscall 525 probe, and lists SPTM patch targets\.|Runs kernel exploit, prints offsets, runs NECP probe, syscall 525 probe, and lists SPTM patch targets.|g' natsuk1/Views/ContentView.swift
          sed -i '' 's|Выводит оффсеты ядра, запускает NECP probe, syscall 525 probe и перечисляет SPTM-таргеты\.|Запускает эксплойт ядра, выводит оффсеты, NECP probe, syscall 525 probe и список SPTM-таргетов.|g' natsuk1/Views/ContentView.swift
          grep -n "Run Exploit\|Запустить эксплойт" natsuk1/Views/ContentView.swift

      - name: Patch SettingsView
        run: |
          printf '%s\n' \
            'import sys' \
            'path = "natsuk1/Views/SettingsView.swift"' \
            'with open(path) as f:' \
            '    src = f.read()' \
            'if "Test R/W" in src:' \
            '    print("already patched")' \
            '    sys.exit(0)' \
            'marker = "                    Button {\n                        state.fetchImages()"' \
            'if marker not in src:' \
            '    print("marker not found")' \
            '    sys.exit(1)' \
            'button = """                    Button {' \
            '                        let r = KernelRW.shared.testRoundTrip()' \
            '                        state.append("[/] Test R/W: \\(r)")' \
            '                    } label: {' \
            '                        HStack(spacing: 10) {' \
            '                            Image(systemName: "checkmark.shield")' \
            '                                .foregroundStyle(.tint)' \
            '                                .frame(width: 20)' \
            '                            Text("Test R/W")' \
            '                                .foregroundStyle(.tint)' \
            '                            Spacer(minLength: 8)' \
            '                        }' \
            '                        .contentShape(Rectangle())' \
            '                    }' \
            '                    .buttonStyle(.plain)' \
            '' \
            '"""' \
            'src = src.replace(marker, button + marker, 1)' \
            'with open(path, "w") as f:' \
            '    f.write(src)' \
            'print("patched")' \
            > /tmp/patch.py
          python3 /tmp/patch.py
          grep -n "Test R" natsuk1/Views/SettingsView.swift || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Test build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/nk_krw.c natsuk1/Exploit/nk_krw.h natsuk1/bridging.h natsuk1/Helpers/KernelRW.swift natsuk1/Views/ContentView.swift natsuk1/Views/SettingsView.swift
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add kernel R/W via mach API, rename Run Offsets to Run Exploit"
          git push
