name: Fix XPF Parser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Write project.yml
        run: |
          printf '%s\n' \
            'name: natsuk1' \
            'options:' \
            '  bundleIdPrefix: com.natsuk1' \
            '  deploymentTarget:' \
            '    iOS: "16.0"' \
            '  createIntermediateGroups: true' \
            '  groupSortPosition: top' \
            '  projectFormat: xcode15_0' \
            '  generateEmptyDirectories: false' \
            '' \
            'configs:' \
            '  Debug: debug' \
            '  Release: release' \
            '' \
            'settings:' \
            '  base:' \
            '    SWIFT_VERSION: "5.0"' \
            '    IPHONEOS_DEPLOYMENT_TARGET: "16.0"' \
            '    CLANG_ENABLE_MODULES: YES' \
            '    CLANG_MODULES_AUTOLINK: NO' \
            '    CLANG_ENABLE_OBJC_ARC: YES' \
            '    ENABLE_BITCODE: NO' \
            '    CODE_SIGN_IDENTITY: ""' \
            '    CODE_SIGNING_REQUIRED: NO' \
            '    CODE_SIGNING_ALLOWED: NO' \
            '    ENABLE_USER_SCRIPT_SANDBOXING: NO' \
            '    ENABLE_MODULE_VERIFIER: NO' \
            '    VALIDATE_PRODUCT: NO' \
            '    ALWAYS_SEARCH_USER_PATHS: NO' \
            '    CLANG_WARN_DOCUMENTATION_COMMENTS: NO' \
            '    CLANG_WARN_UNREACHABLE_CODE: NO' \
            '    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO' \
            '    GCC_WARN_UNINITIALIZED_AUTOS: NO' \
            '    GCC_WARN_UNDECLARED_SELECTOR: NO' \
            '    GCC_WARN_UNUSED_FUNCTION: NO' \
            '    GCC_WARN_UNUSED_VARIABLE: NO' \
            '    ENABLE_STRICT_OBJC_MSGSEND: NO' \
            '    MTL_ENABLE_DEBUG_INFO: NO' \
            '    MTL_FAST_MATH: YES' \
            '    SWIFT_DISABLE_SAFETY_CHECKS: YES' \
            '    GCC_NO_COMMON_BLOCKS: YES' \
            '    CLANG_LTO: NO' \
            '    LLVM_LTO: NO' \
            '' \
            '  configs:' \
            '    Debug:' \
            '      SWIFT_OPTIMIZATION_LEVEL: "-Onone"' \
            '      SWIFT_COMPILATION_MODE: singlefile' \
            '      GCC_OPTIMIZATION_LEVEL: "0"' \
            '      GCC_PREPROCESSOR_DEFINITIONS:' \
            '        - "DEBUG=1"' \
            '        - "$(inherited)"' \
            '      ONLY_ACTIVE_ARCH: YES' \
            '      DEBUG_INFORMATION_FORMAT: dwarf' \
            '      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG' \
            '      ENABLE_TESTABILITY: YES' \
            '' \
            '    Release:' \
            '      SWIFT_OPTIMIZATION_LEVEL: "-Osize"' \
            '      SWIFT_COMPILATION_MODE: wholemodule' \
            '      SWIFT_DISABLE_SAFETY_CHECKS: YES' \
            '      SWIFT_ENFORCE_EXCLUSIVE_ACCESS: unchecked' \
            '      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""' \
            '      GCC_OPTIMIZATION_LEVEL: "s"' \
            '      GCC_PREPROCESSOR_DEFINITIONS:' \
            '        - "NDEBUG=1"' \
            '        - "$(inherited)"' \
            '      ONLY_ACTIVE_ARCH: NO' \
            '      DEBUG_INFORMATION_FORMAT: dwarf' \
            '      ENABLE_NS_ASSERTIONS: NO' \
            '      ENABLE_TESTABILITY: NO' \
            '      MTL_FAST_MATH: YES' \
            '      GCC_INLINES_ARE_PRIVATE_EXTERN: YES' \
            '      GCC_SYMBOLS_PRIVATE_EXTERN: YES' \
            '      DEAD_CODE_STRIPPING: YES' \
            '      DEPLOYMENT_POSTPROCESSING: YES' \
            '      STRIP_INSTALLED_PRODUCT: YES' \
            '      STRIP_STYLE: all' \
            '      COPY_PHASE_STRIP: YES' \
            '      LLVM_LTO: YES' \
            '      LLVM_LTO_MODE: thin' \
            '' \
            'targets:' \
            '  natsuk1:' \
            '    type: application' \
            '    platform: iOS' \
            '    sources:' \
            '      - path: natsuk1/natsuk1.swift' \
            '      - path: natsuk1/bridging.h' \
            '      - path: natsuk1/Helpers' \
            '      - path: natsuk1/Views' \
            '      - path: natsuk1/Exploit' \
            '      - path: natsuk1/External/libgrabkernel2.h' \
            '        buildPhase: none' \
            '      - path: natsuk1/External/partial.h' \
            '        buildPhase: none' \
            '      - path: natsuk1/External/xpf.h' \
            '        buildPhase: none' \
            '      - path: natsuk1/Resources/Offsets.json' \
            '        buildPhase: resources' \
            '      - path: natsuk1/Resources/Assets.xcassets' \
            '        buildPhase: resources' \
            '    dependencies:' \
            '      - sdk: IOKit.framework' \
            '      - sdk: CoreFoundation.framework' \
            '      - sdk: Foundation.framework' \
            '      - sdk: Security.framework' \
            '      - sdk: UIKit.framework' \
            '      - sdk: WebKit.framework' \
            '    settings:' \
            '      base:' \
            '        PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit' \
            '        PRODUCT_NAME: natsuk1' \
            '        INFOPLIST_FILE: natsuk1/Resources/Info.plist' \
            '        CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements' \
            '        SWIFT_OBJC_BRIDGING_HEADER: natsuk1/bridging.h' \
            '        SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h' \
            '        OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer' \
            '        OTHER_LDFLAGS: -Wl,-undefined,dynamic_lookup -lpthread -framework IOKit -framework CoreFoundation -framework Security -framework UIKit -framework WebKit -lz -larchive -lcompression -lxpf -lchoma -L"$(SRCROOT)/natsuk1/External" -lgrabkernel2 -lpartial -Wl,-dead_strip -Wl,-x -Wl,-S' \
            '        HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External"' \
            '        USER_HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External $(SRCROOT)/natsuk1"' \
            '        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External"' \
            '        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/natsuk1/External"' \
            '        TARGETED_DEVICE_FAMILY: "1"' \
            '        GENERATE_INFOPLIST_FILE: NO' \
            '        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' \
            '        ASSETCATALOG_COMPILER_OPTIMIZATION: space' \
            '        ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO' \
            '        ENABLE_ONLY_ACTIVE_RESOURCES: YES' \
            > project.yml
          cat project.yml

      - name: Write KernelcacheParser.swift
        run: |
          printf '%s\n' \
            'import Foundation' \
            '' \
            'final class KernelcacheParser {' \
            '' \
            '    static let shared = KernelcacheParser()' \
            '    private init() {}' \
            '' \
            '    func parse(url: URL) throws -> [String: String] {' \
            '        let kernelPath = url.path' \
            '' \
            '        let docs = URL(fileURLWithPath: NSHomeDirectory()).appendingPathComponent("Documents")' \
            '        let sptmPath = docs.appendingPathComponent("images/sptm.im4p").path' \
            '        let txmPath  = docs.appendingPathComponent("images/txm.im4p").path' \
            '' \
            '        let hasSptm = FileManager.default.fileExists(atPath: sptmPath)' \
            '        let hasTxm  = FileManager.default.fileExists(atPath: txmPath)' \
            '' \
            '        let rc: Int32 = kernelPath.withCString { kp in' \
            '            if hasSptm && hasTxm {' \
            '                return sptmPath.withCString { sp in' \
            '                    txmPath.withCString { tp in' \
            '                        xpf_start_with_kernel_path(kp, sp, tp)' \
            '                    }' \
            '                }' \
            '            } else {' \
            '                return xpf_start_with_kernel_path(kp, nil, nil)' \
            '            }' \
            '        }' \
            '' \
            '        guard rc == 0 else {' \
            '            let err = String(cString: xpf_get_error())' \
            '            throw NSError(domain: "KernelcacheParser", code: 1,' \
            '                          userInfo: [NSLocalizedDescriptionKey: "xpf start error: \(err)"])' \
            '        }' \
            '' \
            '        let basePtr = strdup("base")' \
            '        let transPtr = strdup("translation")' \
            '        let structPtr = strdup("struct")' \
            '' \
            '        var sets: [UnsafePointer<CChar>?] = [' \
            '            UnsafePointer(basePtr),' \
            '            UnsafePointer(transPtr),' \
            '            UnsafePointer(structPtr),' \
            '            nil' \
            '        ]' \
            '' \
            '        _ = sets.withUnsafeMutableBufferPointer { buf -> xpc_object_t? in' \
            '            return xpf_construct_offset_dictionary(buf.baseAddress!)' \
            '        }' \
            '' \
            '        free(basePtr)' \
            '        free(transPtr)' \
            '        free(structPtr)' \
            '' \
            '        var result: [String: String] = [:]' \
            '' \
            '        let map: [(String, String)] = [' \
            '            ("kernelBase",                   "off_kernel_base"),' \
            '            ("kernelSymbol.sysent",          "off_sysent_base"),' \
            '            ("kernelSymbol.mach_trap_table", "off_mach_trap_table"),' \
            '            ("kernelSymbol.copyin",          "off_fn_copyin"),' \
            '            ("kernelSymbol.copyout",         "off_fn_copyout"),' \
            '            ("kernelSymbol.kalloc_ext",      "off_fn_kalloc_ext"),' \
            '            ("kernelSymbol.kfree_ext",       "off_fn_kfree_ext"),' \
            '            ("kernelSymbol.kernproc",        "off_g_kernproc"),' \
            '            ("kernelSymbol.kernel_task",     "off_g_kernel_task"),' \
            '            ("kernelSymbol.zone_map",        "off_g_zone_map"),' \
            '            ("kernelSymbol.allproc",         "off_g_allproc"),' \
            '            ("kernelSymbol.chroot",          "off_g_chroot"),' \
            '            ("kernelSymbol.cs_enforcement",  "off_g_cs_enforcement"),' \
            '            ("kernelSymbol.mac_policy",      "off_g_mac_policy"),' \
            '        ]' \
            '' \
            '        for (xpfKey, ourKey) in map {' \
            '            let v = xpfKey.withCString { xpf_item_resolve($0) }' \
            '            if v != 0 {' \
            '                result[ourKey] = String(format: "0x%llX", v)' \
            '            }' \
            '        }' \
            '' \
            '        xpf_stop()' \
            '        return result' \
            '    }' \
            '}' \
            > natsuk1/Helpers/KernelcacheParser.swift
          cat natsuk1/Helpers/KernelcacheParser.swift

      - name: Write bridging.h
        run: |
          printf '%s\n' \
            '#ifndef NATSUK1_BRIDGING_H' \
            '#define NATSUK1_BRIDGING_H' \
            '' \
            '#include <stdint.h>' \
            '#include "Exploit/nk_api.h"' \
            '#import "External/libgrabkernel2.h"' \
            '#import "xpf.h"' \
            '' \
            '#endif' \
            > natsuk1/bridging.h
          cat natsuk1/bridging.h

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Test build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.yml natsuk1/Helpers/KernelcacheParser.swift natsuk1/bridging.h
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix XPF autolink and linker flags"
          git push
