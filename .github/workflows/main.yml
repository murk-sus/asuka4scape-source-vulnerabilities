name: Cleanup repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete dead files
        run: |
          rm -f natsuk1/Exploit/nk_krw.c
          rm -f natsuk1/Exploit/nk_krw.h
          rm -f natsuk1/Exploit/nk_necp.c
          rm -f natsuk1/Exploit/nk_necp.h
          rm -f natsuk1/Exploit/nk_probe.c
          rm -f natsuk1/Exploit/nk_probe.h
          rm -f natsuk1/Exploit/nk_syscalls.c
          rm -f natsuk1/Exploit/nk_syscalls.h
          rm -f natsuk1/Exploit/nk_sptm.c
          rm -f natsuk1/Exploit/nk_sptm.h
          rm -f natsuk1/Helpers/KernelRW.swift
          rm -f natsuk1/Helpers/KernelcacheFetcher.swift
          rm -f natsuk1/Helpers/KernelcacheParser.swift
          rm -rf natsuk1/External

      - name: Write Haptics
        run: |
          cat > natsuk1/Helpers/Haptics.swift <<'NKEOF'
          import UIKit

          enum Haptics {
              static func tap() {
                  let g = UIImpactFeedbackGenerator(style: .light)
                  g.prepare()
                  g.impactOccurred()
              }

              static func soft() {
                  let g = UIImpactFeedbackGenerator(style: .soft)
                  g.prepare()
                  g.impactOccurred()
              }

              static func success() {
                  UINotificationFeedbackGenerator().notificationOccurred(.success)
              }

              static func warning() {
                  UINotificationFeedbackGenerator().notificationOccurred(.warning)
              }

              static func error() {
                  UINotificationFeedbackGenerator().notificationOccurred(.error)
              }
          }
          NKEOF

      - name: Write KeepAlive
        run: |
          cat > natsuk1/Helpers/KeepAlive.swift <<'NKEOF'
          import AVFoundation
          import Foundation

          final class KeepAlive {
              static let shared = KeepAlive()
              private var player: AVAudioPlayer?
              private var active = false

              private init() {}

              var isActive: Bool { active }

              func start() {
                  guard !active else { return }
                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(.playback, mode: .default, options: [.mixWithOthers])
                      try session.setActive(true)

                      let wav = Self.silentWavData()
                      let url = FileManager.default.temporaryDirectory
                          .appendingPathComponent("keepalive.wav")
                      try wav.write(to: url)

                      let p = try AVAudioPlayer(contentsOf: url)
                      p.numberOfLoops = -1
                      p.volume = 0.0
                      p.prepareToPlay()
                      p.play()
                      player = p
                      active = true
                  } catch {
                      NSLog("[KeepAlive] start failed: \(error)")
                      active = false
                  }
              }

              func stop() {
                  guard active else { return }
                  player?.stop()
                  player = nil
                  try? AVAudioSession.sharedInstance().setActive(false)
                  active = false
              }

              private static func silentWavData() -> Data {
                  let sampleRate: UInt32 = 8000
                  let channels: UInt16 = 1
                  let bitsPerSample: UInt16 = 16
                  let durationSec: UInt32 = 1
                  let numSamples = sampleRate * durationSec
                  let blockAlign = channels * bitsPerSample / 8
                  let byteRate = sampleRate * UInt32(blockAlign)
                  let dataSize = numSamples * UInt32(blockAlign)

                  var d = Data()
                  func u32(_ v: UInt32) {
                      var x = v.littleEndian
                      withUnsafeBytes(of: &x) { d.append(contentsOf: $0) }
                  }
                  func u16(_ v: UInt16) {
                      var x = v.littleEndian
                      withUnsafeBytes(of: &x) { d.append(contentsOf: $0) }
                  }
                  func str(_ s: String) { d.append(contentsOf: Array(s.utf8)) }

                  str("RIFF"); u32(36 + dataSize); str("WAVE")
                  str("fmt "); u32(16); u16(1); u16(channels)
                  u32(sampleRate); u32(byteRate); u16(blockAlign); u16(bitsPerSample)
                  str("data"); u32(dataSize)
                  d.append(Data(repeating: 0, count: Int(dataSize)))
                  return d
              }
          }
          NKEOF

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'NKEOF'
          import SwiftUI
          import UIKit
          import Foundation

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              AppState.shared.append(String(cString: line))
          }

          @main
          struct natsuk1App: App {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive") private var keep_alive = false

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false,
                      "lang": "en",
                  ])
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(state)
                          .environmentObject(offsets)
                          .preferredColorScheme(.dark)
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                          .onAppear {
                              nk_set_log(cCallback)
                              if state.log.isEmpty {
                                  let v = ProcessInfo.processInfo.operatingSystemVersion
                                  state.append("[*] natsuk1 v5.0")
                                  state.append("[*] iOS \(v.majorVersion).\(v.minorVersion) / arm64e")
                                  if let version = OffsetsStore.activeVersion {
                                      state.append("[*] offsets: \(version.device) / iOS \(version.ios) (\(version.build))")
                                  }
                                  state.append("")
                              }
                              if keep_alive { KeepAlive.shared.start() }
                              if auto_run {
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                                      state.run()
                                  }
                              }
                          }
                          .onChange(of: keep_alive) { value in
                              if value {
                                  KeepAlive.shared.start()
                              } else {
                                  KeepAlive.shared.stop()
                              }
                          }
                          .overlay {
                              if state.show_respring {
                                  RespringView()
                                      .brightness(-1.0)
                                      .ignoresSafeArea()
                              }
                          }
                  }
              }
          }

          final class AppState: ObservableObject {
              static let shared = AppState()

              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle:    return .secondary
                      case .running: return .orange
                      case .ok:      return .green
                      case .failed:  return .red
                      }
                  }
              }

              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false

              @Published var lang: String {
                  didSet { UserDefaults.standard.set(lang, forKey: "lang") }
              }

              private var flusher: Timer?
              private var pending: String = ""
              private let lock = NSLock()

              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }

              func t(_ en: String, _ ru: String) -> String {
                  lang == "ru" ? ru : en
              }

              private func startFlusher() {
                  DispatchQueue.main.async { [weak self] in
                      guard let self = self else { return }
                      self.flusher = Timer.scheduledTimer(withTimeInterval: 0.3, repeats: true) { [weak self] _ in
                          guard let self = self else { return }
                          self.lock.lock()
                          let chunk = self.pending
                          self.pending = ""
                          self.lock.unlock()
                          guard !chunk.isEmpty else { return }
                          var newLog = self.log
                          newLog += chunk
                          if newLog.count > 30000 {
                              newLog = String(newLog.suffix(20000))
                          }
                          self.log = newLog
                      }
                  }
              }

              func append(_ s: String) {
                  lock.lock()
                  pending += s
                  pending += "\n"
                  if pending.count > 10000 {
                      pending = String(pending.suffix(6000))
                  }
                  lock.unlock()
              }

              func run() {
                  if running { return }
                  running = true
                  status = .running
                  Haptics.tap()

                  let t = Thread { [weak self] in
                      _ = nk_full_exploit()
                      DispatchQueue.main.async {
                          guard let self = self else { return }
                          self.running = false
                          self.status = .ok
                          Haptics.success()
                      }
                  }
                  t.qualityOfService = .userInitiated
                  t.stackSize = 16 * 1024 * 1024
                  t.start()
              }

              func respring() {
                  Haptics.tap()
                  show_respring = true
              }

              func clear() {
                  lock.lock()
                  pending = ""
                  lock.unlock()
                  log = ""
              }
          }
          NKEOF

      - name: Write ContentView
        run: |
          cat > natsuk1/Views/ContentView.swift <<'NKEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState
              @AppStorage("verbose")  private var verbose: Bool = true
              @AppStorage("auto_run") private var auto_run: Bool = false

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 10) {
                                      Image(systemName: "bolt.fill")
                                          .foregroundStyle(.secondary)
                                          .frame(width: 20)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                          .foregroundStyle(.primary)
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                                  .contentShape(Rectangle())
                              }
                              .buttonStyle(.plain)
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Actions", "Действия"), systemImage: "play.circle")
                          } footer: {
                              Text(state.t("Runs kernel exploit, prints offsets and reference data.",
                                           "Запускает эксплойт, выводит оффсеты и справочные данные."))
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  Haptics.tap()
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                                  .contentShape(Rectangle())
                              }
                              .buttonStyle(.plain)
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .tint(.blue)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  Haptics.tap()
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                              .buttonStyle(.plain)
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView().environmentObject(state)
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                              .font(.system(size: 10, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .onChange(of: state.log) { _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                      .contextMenu {
                          Button {
                              UIPasteboard.general.string = state.log
                              Haptics.success()
                          } label: {
                              Label("Copy Output", systemImage: "doc.on.doc")
                          }
                          .tint(.blue)

                          Button(role: .destructive) {
                              state.clear()
                              Haptics.warning()
                          } label: {
                              Label("Clear", systemImage: "trash")
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          NKEOF

      - name: Write AboutView
