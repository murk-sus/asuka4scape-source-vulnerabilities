name: Fix Swift 6 actor isolation properly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'NKEOF'
          import SwiftUI
          import UIKit
          import Foundation

          final class LockedBuffer: @unchecked Sendable {
              private let lock = NSLock()
              private var value: String = ""

              func append(_ s: String) {
                  lock.lock()
                  value += s
                  value += "\n"
                  if value.count > 10000 {
                      value = String(value.suffix(6000))
                  }
                  lock.unlock()
              }

              func drain() -> String {
                  lock.lock()
                  let v = value
                  value = ""
                  lock.unlock()
                  return v
              }

              func clear() {
                  lock.lock()
                  value = ""
                  lock.unlock()
              }
          }

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              var bytes: [UInt8] = []
              var p = line
              while p.pointee != 0 {
                  bytes.append(UInt8(bitPattern: p.pointee))
                  p = p.advanced(by: 1)
              }
              let s = String(decoding: bytes, as: UTF8.self)
              AppState.shared.append(s)
          }

          private func osVersionString() -> String {
              let v = ProcessInfo.processInfo.operatingSystemVersion
              return "\(v.majorVersion).\(v.minorVersion)"
          }

          private var isSupportedIOS: Bool {
              ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 27
          }

          @main
          struct natsuk1App: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                  }
              }
          }

          struct RootView: View {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive_audio") private var keep_alive_audio = false
              @AppStorage("keep_alive_location") private var keep_alive_location = false

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false,
                      "keep_alive_audio": false,
                      "keep_alive_location": false,
                      "lang": "en",
                  ])
              }

              var body: some View {
                  Group {
                      if isSupportedIOS {
                          ContentView()
                              .environmentObject(state)
                              .environmentObject(offsets)
                              .onAppear {
                                  nk_set_log(cCallback)
                                  if state.log.isEmpty {
                                      state.append("[*] natsuk1 v6.0")
                                      state.append("[*] iOS \(osVersionString()) / arm64e")
                                      if let version = OffsetsStore.activeVersion {
                                          state.append("[*] offsets: \(version.device) / iOS \(version.ios) (\(version.build))")
                                      }
                                      state.append("")
                                  }
                                  if keep_alive_audio { KeepAlive.shared.startAudio() }
                                  if keep_alive_location { KeepAlive.shared.startLocation() }
                                  if auto_run {
                                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                                          state.run()
                                      }
                                  }
                              }
                              .onChange(of: keep_alive_audio) { _, value in
                                  if value { KeepAlive.shared.startAudio() } else { KeepAlive.shared.stopAudio() }
                              }
                              .onChange(of: keep_alive_location) { _, value in
                                  if value { KeepAlive.shared.startLocation() } else { KeepAlive.shared.stopLocation() }
                              }
                              .overlay {
                                  if state.show_respring {
                                      RespringView()
                                          .brightness(-1.0)
                                          .ignoresSafeArea()
                                  }
                              }
                      } else {
                          NotSupportedView(version: osVersionString())
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }

          struct NotSupportedView: View {
              let version: String

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "exclamationmark.triangle.fill")
                          .font(.system(size: 56))
                          .foregroundStyle(.orange)
                      Text("Not supported for iOS \(version)")
                          .font(.title3)
                          .fontWeight(.semibold)
                          .multilineTextAlignment(.center)
                      Text("natsuk1 runs on iOS 27 only.")
                          .font(.subheadline)
                          .foregroundColor(.secondary)
                          .multilineTextAlignment(.center)
                  }
                  .padding(40)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.black.ignoresSafeArea())
              }
          }

          @MainActor
          final class AppState: ObservableObject {
              static let shared = AppState()

              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle:    return .secondary
                      case .running: return .orange
                      case .ok:      return .green
                      case .failed:  return .red
                      }
                  }
              }

              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false

              @Published var lang: String {
                  didSet { UserDefaults.standard.set(lang, forKey: "lang") }
              }

              private let buffer = LockedBuffer()

              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }

              func t(_ en: String, _ ru: String) -> String {
                  lang == "ru" ? ru : en
              }

              private func startFlusher() {
                  Task { @MainActor [weak self] in
                      while !Task.isCancelled {
                          try? await Task.sleep(for: .milliseconds(300))
                          guard let self else { return }
                          let chunk = self.buffer.drain()
                          guard !chunk.isEmpty else { continue }
                          var newLog = self.log
                          newLog += chunk
                          if newLog.count > 30000 {
                              newLog = String(newLog.suffix(20000))
                          }
                          self.log = newLog
                      }
                  }
              }

              nonisolated func append(_ s: String) {
                  buffer.append(s)
              }

              func run() {
                  if running { return }
                  running = true
                  status = .running

                  Task.detached {
                      _ = nk_full_exploit()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }

              func respring() {
                  show_respring = true
              }

              func clear() {
                  buffer.clear()
                  log = ""
              }
          }
          NKEOF
          echo "natsuk1.swift OK"

      - name: Write KeepAlive
        run: |
          cat > natsuk1/Helpers/KeepAlive.swift <<'NKEOF'
          import AVFoundation
          import CoreLocation
          import Foundation
          import Combine

          @MainActor
          final class KeepAlive: NSObject, ObservableObject {
              static let shared = KeepAlive()

              @Published private(set) var audioActive: Bool = false
              @Published private(set) var locationActive: Bool = false

              private var player: AVAudioPlayer?
              private var locationManager: CLLocationManager?

              private override init() {
                  super.init()
              }

              func startAudio() {
                  guard !audioActive else { return }
                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(.playback, mode: .default, options: [.mixWithOthers])
                      try session.setActive(true)

                      let wav = Self.silentWavData()
                      let url = FileManager.default.temporaryDirectory
                          .appendingPathComponent("keepalive.wav")
                      try wav.write(to: url)

                      let p = try AVAudioPlayer(contentsOf: url)
                      p.numberOfLoops = -1
                      p.volume = 0.0
                      p.prepareToPlay()
                      p.play()
                      player = p
                      audioActive = true
                  } catch {
                      NSLog("[KeepAlive] audio failed: \(error)")
                      audioActive = false
                  }
              }

              func stopAudio() {
                  guard audioActive else { return }
                  player?.stop()
                  player = nil
                  audioActive = false
              }

              func startLocation() {
                  guard !locationActive else { return }
                  let m = CLLocationManager()
                  m.delegate = self
                  m.desiredAccuracy = kCLLocationAccuracyThreeKilometers
                  m.distanceFilter = 3000
                  m.pausesLocationUpdatesAutomatically = false
                  m.allowsBackgroundLocationUpdates = true
                  m.showsBackgroundLocationIndicator = false

                  let status = m.authorizationStatus
                  if status == .notDetermined {
                      m.requestAlwaysAuthorization()
                  } else if status == .authorizedAlways || status == .authorizedWhenInUse {
                      m.startUpdatingLocation()
                      locationActive = true
                  }
                  locationManager = m
              }

              func stopLocation() {
                  locationManager?.stopUpdatingLocation()
                  locationManager = nil
                  locationActive = false
              }

              nonisolated private static func silentWavData() -> Data {
                  let sampleRate: UInt32 = 8000
                  let channels: UInt16 = 1
                  let bitsPerSample: UInt16 = 16
                  let durationSec: UInt32 = 1
                  let numSamples = sampleRate * durationSec
                  let blockAlign = channels * bitsPerSample / 8
                  let byteRate = sampleRate * UInt32(blockAlign)
                  let dataSize = numSamples * UInt32(blockAlign)

                  var d = Data()
                  func u32(_ v: UInt32) {
                      var x = v.littleEndian
                      withUnsafeBytes(of: &x) { d.append(contentsOf: $0) }
                  }
                  func u16(_ v: UInt16) {
                      var x = v.littleEndian
                      withUnsafeBytes(of: &x) { d.append(contentsOf: $0) }
                  }
                  func str(_ s: String) { d.append(contentsOf: Array(s.utf8)) }

                  str("RIFF"); u32(36 + dataSize); str("WAVE")
                  str("fmt "); u32(16); u16(1); u16(channels)
                  u32(sampleRate); u32(byteRate); u16(blockAlign); u16(bitsPerSample)
                  str("data"); u32(dataSize)
                  d.append(Data(repeating: 0, count: Int(dataSize)))
                  return d
              }
          }

          extension KeepAlive: @preconcurrency CLLocationManagerDelegate {
              func locationManagerDidChangeAuthorization(_ manager: CLLocationManager) {
                  let status = manager.authorizationStatus
                  if status == .authorizedAlways || status == .authorizedWhenInUse {
                      manager.startUpdatingLocation()
                      locationActive = true
                  } else if status == .denied || status == .restricted {
                      locationActive = false
                  }
              }

              func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
              }

              func locationManager(_ manager: CLLocationManager, didFailWithError error: Error) {
                  NSLog("[KeepAlive] location error: \(error)")
              }
          }
          NKEOF
          echo "KeepAlive OK"

      - name: Write OffsetsStore
        run: |
          cat > natsuk1/Helpers/OffsetsStore.swift <<'NKEOF'
          import Foundation
          import Combine

          @MainActor
          final class OffsetsStore: ObservableObject {
              static let shared = OffsetsStore()

              struct Group: Codable {
                  let title: String
                  let items: [String]
              }

              struct VersionEntry: Codable {
                  let file: String
                  let device: String
                  let deviceName: String
                  let chip: String
                  let ios: String
                  let build: String
                  let verified: Bool
              }

              struct Index: Codable {
                  let versions: [VersionEntry]
              }

              private struct File: Codable {
                  let groups: [Group]
                  let defaults: [String: String]
              }

              nonisolated private static let bundled: File? = {
                  guard let fileURL = resolveActiveFileURL() else { return nil }
                  guard let fileData = try? Data(contentsOf: fileURL),
                        let parsed = try? JSONDecoder().decode(File.self, from: fileData)
                  else { return nil }
                  return parsed
              }()

              nonisolated static var groups: [Group] { bundled?.groups ?? [] }
              nonisolated static var defaults: [String: String] { bundled?.defaults ?? [:] }

              nonisolated static var activeVersion: VersionEntry? {
                  resolveActiveEntry()
              }

              nonisolated private static func loadIndex() -> Index? {
                  guard let url = Bundle.main.url(forResource: "index", withExtension: "json", subdirectory: "Offsets"),
                        let data = try? Data(contentsOf: url),
                        let index = try? JSONDecoder().decode(Index.self, from: data)
                  else { return nil }
                  return index
              }

              nonisolated private static func resolveActiveEntry() -> VersionEntry? {
                  guard let index = loadIndex() else { return nil }
                  let device = DeviceName.machineID()
                  let v = ProcessInfo.processInfo.operatingSystemVersion
                  let ios = "\(v.majorVersion).\(v.minorVersion)"
                  return index.versions.first(where: { $0.device == device && $0.ios == ios })
                      ?? index.versions.first(where: { $0.device == device })
              }

              nonisolated private static func resolveActiveFileURL() -> URL? {
                  guard let entry = resolveActiveEntry() else { return nil }
                  let parts = entry.file.split(separator: ".", maxSplits: 1).map(String.init)
                  let name = parts.first ?? entry.file
                  let ext  = parts.count > 1 ? parts[1] : "json"
                  return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: "Offsets")
              }

              @Published var values: [String: String] = [:]

              private let storageKey = "natsuk1_offsets_v2"

              private init() { load() }

              func load() {
                  let saved = UserDefaults.standard.dictionary(forKey: storageKey) as? [String: String]
                  var merged = Self.defaults
                  if let saved = saved {
                      for (k, v) in saved where merged[k] != nil { merged[k] = v }
                  }
                  values = merged
                  if saved == nil { save() }
              }

              func save() {
                  UserDefaults.standard.set(values, forKey: storageKey)
              }

              func reset() {
                  values = Self.defaults
                  save()
              }

              func resetOne(_ name: String) {
                  values[name] = Self.defaults[name] ?? "0x0"
                  save()
              }

              func update(_ name: String, value: String) {
                  values[name] = value
                  save()
              }

              func value(for name: String) -> String {
                  values[name] ?? Self.defaults[name] ?? "0x0"
              }

              func filledCount() -> Int {
                  values.filter { $0.value != "0x0" && !$0.value.isEmpty }.count
              }

              func totalCount() -> Int {
                  Self.groups.reduce(0) { $0 + $1.items.count }
              }
          }
          NKEOF
          echo "OffsetsStore OK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Swift 6: proper MainActor isolation, LockedBuffer for cross-thread log"
          git push
