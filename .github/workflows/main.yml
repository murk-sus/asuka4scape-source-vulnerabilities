name: Cleanup repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete dead files
        run: |
          rm -f natsuk1/Exploit/nk_krw.c
          rm -f natsuk1/Exploit/nk_krw.h
          rm -f natsuk1/Exploit/nk_necp.c
          rm -f natsuk1/Exploit/nk_necp.h
          rm -f natsuk1/Exploit/nk_probe.c
          rm -f natsuk1/Exploit/nk_probe.h
          rm -f natsuk1/Exploit/nk_syscalls.c
          rm -f natsuk1/Exploit/nk_syscalls.h
          rm -f natsuk1/Exploit/nk_sptm.c
          rm -f natsuk1/Exploit/nk_sptm.h
          rm -f natsuk1/Helpers/KernelRW.swift
          rm -f natsuk1/Helpers/KernelcacheFetcher.swift
          rm -f natsuk1/Helpers/KernelcacheParser.swift
          rm -f natsuk1/Resources/Offsets.json
          rm -rf natsuk1/External
          rm -rf Offsets

      - name: Write C sources
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'NKEOF'
          #ifndef NK_API_H
          #define NK_API_H

          #include <stdint.h>

          void nk_set_log(void (*fn)(const char *));
          int nk_run(void);
          int nk_full_exploit(void);

          uint64_t nk_get_kernel_base(void);
          uint64_t nk_get_sysent_base(void);
          uint64_t nk_get_mach_trap_table(void);

          #endif
          NKEOF

          cat > natsuk1/Exploit/nk_api.c <<'NKEOF'
          #include "nk_api.h"
          #include "nk_log.h"
          #include "nk_offsets.h"

          int nk_run(void) {
              nk_log("natsuk1 v5.0");
              nk_log("iOS 27.0 / 24A437 / iPhone14,5");
              nk_rule();

              NK_INFO("BASE", "kernel          0x%016llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent          0x%016llX (%d entries)",
                      (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              NK_INFO("BASE", "mach_trap_table 0x%016llX", (unsigned long long)NK_MACH_TRAP_TABLE);
              nk_rule();

              NK_INFO("PRIM", "copyin   0x%016llX", (unsigned long long)NK_FN_COPYIN);
              NK_INFO("PRIM", "copyout  0x%016llX", (unsigned long long)NK_FN_COPYOUT);
              NK_INFO("PRIM", "kalloc   0x%016llX", (unsigned long long)NK_FN_KALLOC_EXT);
              NK_INFO("PRIM", "kfree    0x%016llX", (unsigned long long)NK_FN_KFREE_EXT);
              nk_rule();

              NK_INFO("STRUCT", "proc_pid     0x%X", NK_OFF_PROC_PID);
              NK_INFO("STRUCT", "proc_ucred   0x%X", NK_OFF_PROC_UCRED);
              NK_INFO("STRUCT", "task_thread  0x%X", NK_OFF_TASK_THREAD);
              nk_rule();

              NK_WARN("STATE", "No kernel R/W primitive on iOS 27.0 (24A437).");
              NK_WARN("STATE", "Offsets below are reference data only.");
              nk_rule();

              return 0;
          }

          int nk_full_exploit(void) { return nk_run(); }

          uint64_t nk_get_kernel_base(void)     { return NK_KERNEL_BASE; }
          uint64_t nk_get_sysent_base(void)     { return NK_SYSENT_BASE; }
          uint64_t nk_get_mach_trap_table(void) { return NK_MACH_TRAP_TABLE; }
          NKEOF

          cat > natsuk1/Exploit/nk_offsets.h <<'NKEOF'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H

          #define NK_KERNEL_BASE            0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE            0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT           558
          #define NK_SYSENT_STRIDE          24
          #define NK_MACH_TRAP_TABLE        0xFFFFFFF007BE8018ULL

          #define NK_FN_COPYIN              0xFFFFFFF00A7B9570ULL
          #define NK_FN_COPYOUT             0xFFFFFFF00A2C6C28ULL
          #define NK_FN_KALLOC_EXT          0xFFFFFFF00A200DCCULL
          #define NK_FN_KFREE_EXT           0xFFFFFFF00A201000ULL

          #define NK_OFF_PROC_PID           0x74
          #define NK_OFF_PROC_UCRED         0xB8
          #define NK_OFF_TASK_THREAD        0x50

          #endif
          NKEOF

          cat > natsuk1/bridging.h <<'NKEOF'
          #ifndef NATSUK1_BRIDGING_H
          #define NATSUK1_BRIDGING_H

          #include <stdint.h>
          #include "Exploit/nk_api.h"

          #endif
          NKEOF

      - name: Write Swift sources
        run: |
          cat > natsuk1/Helpers/OffsetsStore.swift <<'NKEOF'
          import Foundation
          import Combine

          final class OffsetsStore: ObservableObject {
              static let shared = OffsetsStore()

              struct Group: Codable {
                  let title: String
                  let items: [String]
              }

              struct VersionEntry: Codable {
                  let file: String
                  let device: String
                  let deviceName: String
                  let chip: String
                  let ios: String
                  let build: String
                  let verified: Bool
              }

              struct Index: Codable {
                  let versions: [VersionEntry]
              }

              private struct File: Codable {
                  let groups: [Group]
                  let defaults: [String: String]
              }

              private static let bundled: File? = {
                  guard let fileURL = resolveActiveFileURL() else { return nil }
                  guard let fileData = try? Data(contentsOf: fileURL),
                        let parsed = try? JSONDecoder().decode(File.self, from: fileData)
                  else { return nil }
                  return parsed
              }()

              static var groups: [Group] { bundled?.groups ?? [] }
              static var defaults: [String: String] { bundled?.defaults ?? [:] }

              static var activeVersion: VersionEntry? {
                  resolveActiveEntry()
              }

              private static func loadIndex() -> Index? {
                  guard let url = Bundle.main.url(forResource: "index", withExtension: "json", subdirectory: "Offsets"),
                        let data = try? Data(contentsOf: url),
                        let index = try? JSONDecoder().decode(Index.self, from: data)
                  else { return nil }
                  return index
              }

              private static func resolveActiveEntry() -> VersionEntry? {
                  guard let index = loadIndex() else { return nil }
                  let device = DeviceName.machineID()
                  let v = ProcessInfo.processInfo.operatingSystemVersion
                  let ios = "\(v.majorVersion).\(v.minorVersion)"
                  return index.versions.first(where: { $0.device == device && $0.ios == ios })
                      ?? index.versions.first(where: { $0.device == device })
              }

              private static func resolveActiveFileURL() -> URL? {
                  guard let entry = resolveActiveEntry() else { return nil }
                  let parts = entry.file.split(separator: ".", maxSplits: 1).map(String.init)
                  let name = parts.first ?? entry.file
                  let ext  = parts.count > 1 ? parts[1] : "json"
                  return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: "Offsets")
              }

              @Published var values: [String: String] = [:]

              private let storageKey = "natsuk1_offsets_v2"

              private init() { load() }

              func load() {
                  let saved = UserDefaults.standard.dictionary(forKey: storageKey) as? [String: String]
                  var merged = Self.defaults
                  if let saved = saved {
                      for (k, v) in saved where merged[k] != nil { merged[k] = v }
                  }
                  values = merged
                  if saved == nil { save() }
              }

              func save() {
                  UserDefaults.standard.set(values, forKey: storageKey)
              }

              func reset() {
                  values = Self.defaults
                  save()
              }

              func resetOne(_ name: String) {
                  values[name] = Self.defaults[name] ?? "0x0"
                  save()
              }

              func update(_ name: String, value: String) {
                  values[name] = value
                  save()
              }

              func value(for name: String) -> String {
                  values[name] ?? Self.defaults[name] ?? "0x0"
              }

              func filledCount() -> Int {
                  values.filter { $0.value != "0x0" && !$0.value.isEmpty }.count
              }

              func totalCount() -> Int {
                  Self.groups.reduce(0) { $0 + $1.items.count }
              }
          }
          NKEOF

          cat > natsuk1/natsuk1.swift <<'NKEOF'
          import SwiftUI
          import UIKit
          import Foundation

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              AppState.shared.append(String(cString: line))
          }

          @main
          struct natsuk1App: App {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @AppStorage("auto_run") private var auto_run = false

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false,
                      "lang": "en",
                  ])
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(state)
                          .environmentObject(offsets)
                          .preferredColorScheme(.dark)
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                          .onAppear {
                              nk_set_log(cCallback)
                              if state.log.isEmpty {
                                  let v = ProcessInfo.processInfo.operatingSystemVersion
                                  state.append("[*] natsuk1 v5.0")
                                  state.append("[*] iOS \(v.majorVersion).\(v.minorVersion) / arm64e")
                                  if let version = OffsetsStore.activeVersion {
                                      state.append("[*] offsets: \(version.device) / iOS \(version.ios) (\(version.build))")
                                  }
                                  state.append("")
                              }
                              if auto_run {
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                                      state.run()
                                  }
                              }
                          }
                          .overlay {
                              if state.show_respring {
                                  RespringView()
                                      .brightness(-1.0)
                                      .ignoresSafeArea()
                              }
                          }
                  }
              }
          }

          final class AppState: ObservableObject {
              static let shared = AppState()

              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle:    return .secondary
                      case .running: return .orange
                      case .ok:      return .green
                      case .failed:  return .red
                      }
                  }
              }

              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false

              @Published var lang: String {
                  didSet { UserDefaults.standard.set(lang, forKey: "lang") }
              }

              private var flusher: Timer?
              private var pending: String = ""
              private let lock = NSLock()

              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }

              func t(_ en: String, _ ru: String) -> String {
                  lang == "ru" ? ru : en
              }

              private func startFlusher() {
                  DispatchQueue.main.async { [weak self] in
                      guard let self = self else { return }
                      self.flusher = Timer.scheduledTimer(withTimeInterval: 0.3, repeats: true) { [weak self] _ in
                          guard let self = self else { return }
                          self.lock.lock()
                          let chunk = self.pending
                          self.pending = ""
                          self.lock.unlock()
                          guard !chunk.isEmpty else { return }
                          var newLog = self.log
                          newLog += chunk
                          if newLog.count > 30000 {
                              newLog = String(newLog.suffix(20000))
                          }
                          self.log = newLog
                      }
                  }
              }

              func append(_ s: String) {
                  lock.lock()
                  pending += s
                  pending += "\n"
                  if pending.count > 10000 {
                      pending = String(pending.suffix(6000))
                  }
                  lock.unlock()
              }

              func run() {
                  if running { return }
                  running = true
                  status = .running

                  let t = Thread { [weak self] in
                      _ = nk_full_exploit()
                      DispatchQueue.main.async {
                          guard let self = self else { return }
                          self.running = false
                          self.status = .ok
                      }
                  }
                  t.qualityOfService = .userInitiated
                  t.stackSize = 16 * 1024 * 1024
                  t.start()
              }

              func respring() {
                  show_respring = true
              }

              func clear() {
                  lock.lock()
                  pending = ""
                  lock.unlock()
                  log = ""
              }
          }
          NKEOF

