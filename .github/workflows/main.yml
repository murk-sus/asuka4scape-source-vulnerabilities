            '            ("kernelStruct.inpcb.inp_pcbinfo",          "off_inpcb_inp_pcbinfo"),' \
            '            ("kernelStruct.inpcb.inp_socket",           "off_inpcb_inp_socket")' \
            '        ]' \
            '' \
            '        for (xpfKey, ourKey) in map {' \
            '            let v = xpfKey.withCString { xpf_item_resolve($0) }' \
            '            if v != 0 {' \
            '                result[ourKey] = String(format: "0x%llX", v)' \
            '            }' \
            '        }' \
            '' \
            '        withExtendedLifetime(dict) {' \
            '            xpf_stop()' \
            '        }' \
            '' \
            '        return result' \
            '    }' \
            '}' \
            > natsuk1/Helpers/KernelcacheParser.swift
          cat natsuk1/Helpers/KernelcacheParser.swift

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Test build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Resources/Offsets.json natsuk1/Helpers/KernelcacheParser.swift
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix offsets and XPF parser keys (remove cpu_ttep)"
          git push
