name: Fix project.yml STRIPFLAGS indent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix project.yml
        run: |
          python3 <<'PYEOF'
          import re

          p = "project.yml"
          s = open(p).read()

          s = re.sub(r'^\s*STRIPFLAGS:.*\n', '', s, flags=re.M)

          s = re.sub(
              r'^(\s*)STRIP_STYLE:\s*all\s*\n',
              r'\1STRIP_STYLE: all\n\1STRIPFLAGS: "-S -x"\n',
              s, flags=re.M
          )

          open(p, "w").write(s)

          print("---- project.yml after patch ----")
          print(s)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix STRIPFLAGS indentation in project.yml"
          git push
