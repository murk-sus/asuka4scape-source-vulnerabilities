name: Extract Offsets

on:
  push:
    branches: [main]
    paths:
      - scripts/kernel_rw.py
      - .github/workflows/extract_offsets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Install helper tools
        run: |
          set -e
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq
          command -v file >/dev/null 2>&1 || sudo apt-get install -y file

      - uses: actions/cache@v4
        id: cache-ghidra
        with:
          path: ghidra
          key: ghidra-12.1.2-jython-v4

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/g.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
          unzip -q /tmp/g.zip -d "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/ghidra_12.1.2_PUBLIC" "$GITHUB_WORKSPACE/ghidra"
          JYTHON_ZIP=$(find "$GITHUB_WORKSPACE/ghidra/Extensions/Ghidra" -maxdepth 1 -name "*Jython*.zip" | head -n1)
          test -n "$JYTHON_ZIP"
          mkdir -p "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          unzip -q "$JYTHON_ZIP" -d "$GITHUB_WORKSPACE/ghidra/Ghidra/Extensions"
          rm -f /tmp/g.zip

      - name: Set GHIDRA_ROOT
        run: echo "GHIDRA_ROOT=$GITHUB_WORKSPACE/ghidra" >> "$GITHUB_ENV"

      - name: Validate Ghidra
        run: |
          set -euo pipefail
          test -x "$GHIDRA_ROOT/support/analyzeHeadless"
          test -d "$GHIDRA_ROOT/Ghidra/Extensions/Jython"

      - uses: actions/cache@v4
        id: cache-ipsw
        with:
          path: /usr/local/bin/ipsw
          key: ipsw-3.1.716-v4

      - name: Install ipsw
        if: steps.cache-ipsw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.716/ipsw_3.1.716_linux_x86_64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/ipsw.tar.gz ipsw
          rm -f /tmp/ipsw.tar.gz

      - uses: actions/cache@v4
        id: cache-symbolicator
        with:
          path: symbolicator
          key: symbolicator-v6

      - name: Clone symbolicator
        if: steps.cache-symbolicator.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/symbolicator"
          git clone --depth 1 https://github.com/blacktop/symbolicator.git "$GITHUB_WORKSPACE/symbolicator"

      - name: Pick signature dir
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/symbolicator/kernel"
          test -d "$ROOT" || { echo "no symbolicator"; exit 1; }
          SIGDIR=""
          for V in 27.0 27.1 27.2 27.3 26.0 26.1 26.2 26.3 25.6 25.5 25.4 25.3; do
            if [ -d "$ROOT/$V" ]; then SIGDIR="$ROOT/$V"; break; fi
          done
          test -n "$SIGDIR" || { echo "no version dir"; exit 1; }
          echo "SIGDIR=$SIGDIR" >> "$GITHUB_ENV"
          echo "picked $SIGDIR"

      - uses: actions/cache@v4
        id: cache-kernelcache
        with:
          path: kernelcache
          key: kernelcache-iPhone14_5-24A437-v4

      - name: Download kernelcache
        if: steps.cache-kernelcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipsw kernelcache
          ipsw download ipsw --device iPhone14,5 --build 24A437 --output ipsw 2>&1 | tee /tmp/dl.log || true
          IPSW=$(find ipsw -name "*.ipsw" -type f | head -n1)
          test -n "$IPSW"
          test -s "$IPSW"
          ipsw extract --kernel "$IPSW" --output kernelcache
          find kernelcache -type f ! -name "kernelcache*" -delete
          find kernelcache -type d -empty -delete
          rm -rf ipsw

      - name: Locate kernel
        run: |
          set -euo pipefail
          KERNEL=$(find "$GITHUB_WORKSPACE/kernelcache" -type f -name "kernelcache*" | head -n1)
          test -n "$KERNEL"
          file "$KERNEL" | grep -qi "Mach-O"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$(dirname "$KERNEL")" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=$(basename "$KERNEL")" >> "$GITHUB_ENV"

      - name: Validate scripts
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/kernel_rw.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$GITHUB_WORKSPACE/scripts/kernel_rw.py"

      - uses: actions/cache@v4
        id: cache-symbols
        with:
          path: symbols.json
          key: symbols-24A437-v4

      - name: Symbolicate
        if: steps.cache-symbols.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/symbols.json"
          rm -f "$OUT"
          ipsw kernel symbolicate --signatures "$SIGDIR" --json "$KERNEL" > /tmp/so.txt 2> /tmp/se.txt || true
          if [ -s /tmp/so.txt ] && jq empty /tmp/so.txt 2>/dev/null; then
            cp /tmp/so.txt "$OUT"
          fi
          if [ ! -s "$OUT" ]; then
            RP=$(grep -oE "Writing symbols as JSON to .+" /tmp/se.txt 2>/dev/null | head -1 | sed 's/^.* to //' | tr -d '\r\n')
            if [ -n "$RP" ] && [ -f "$RP" ] && jq empty "$RP" 2>/dev/null; then
              cp "$RP" "$OUT"
            fi
          fi
          test -s "$OUT" || { echo "symbolication failed"; tail -20 /tmp/se.txt || true; exit 1; }
          CNT=$(jq 'if type=="array" then length elif type=="object" then (keys|length) else 0 end' "$OUT")
          echo "symbols.json: $(wc -c < "$OUT") bytes, $CNT entries"

      - uses: actions/cache@v4
        id: cache-project
        with:
          path: ghidra_project
          key: ghidra-project-24A437-v4

      - name: Run Ghidra
        env:
          _JAVA_OPTIONS: "-Xmx10g -Djava.awt.headless=true"
          SYMBOLS_JSON: ${{ github.workspace }}/symbols.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "project-cache-hit=${{ steps.cache-project.outputs.cache-hit }}"
          test -f "$SYMBOLS_JSON"
          rm -f result.txt
          JOBS=$(nproc)
          if [ "${{ steps.cache-project.outputs.cache-hit }}" = "true" ]; then
            echo "=== WARM ==="
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -process "$KERNEL_NAME" -noanalysis \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -max-cpu "$JOBS" 2>&1 | tee kernel.log | tail -40
          else
            echo "=== COLD ==="
            rm -rf ghidra_project
            mkdir -p ghidra_project
            "$GHIDRA_ROOT/support/analyzeHeadless" \
              "$GITHUB_WORKSPACE/ghidra_project" KernelProject \
              -import "$KERNEL" \
              -processor AARCH64:LE:64:AppleSilicon \
              -loader BinaryLoader \
              -loader-baseAddr 0xFFFFFFF007004000 \
              -postScript kernel_rw.py \
              -scriptPath "$GITHUB_WORKSPACE/scripts" \
              -analysisTimeoutPerFile 600 \
              -max-cpu "$JOBS" 2>&1 | tee kernel.log | tail -40
          fi

      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s result.txt
          echo "result.txt: $(wc -l < result.txt) lines"

      - name: Report tail
        if: always()
        run: |
          echo "=== kernel.log tail ==="
          tail -60 kernel.log 2>/dev/null || true
          echo "=== result.txt tail ==="
          tail -80 result.txt 2>/dev/null || echo missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-offsets
          path: |
            result.txt
            kernel.log
            symbols.json
          retention-days: 30

      - name: Commit result
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -f result.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "extract: kernel_rw [skip ci]"
          git push