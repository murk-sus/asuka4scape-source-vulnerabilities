          w("- target: iPhone14,5 (iPhone 13, A15) on iOS 27.0 build 24A437")
          w("- kernel: xnu-13432.2.10~2/RELEASE_ARM64_T8110 arm64e")
          w("- signing: ad-hoc, empty entitlements works on LiveContainer and SideStore")
          w("- license: MIT, author murk-sus")
          w("What it actually does:")
          w("- pairs the iPhone as host via RPPairing on the 10.7.0.x tunnel")
          w("- opens RSD tunnel and enumerates services including AFC ATC StreamingZip")
          w("- uploads a symlink payload via StreamingZip plus AFC to reach a target dir")
          w("- drives AirTraffic ATC sync with Grappa token AssetManifest FileComplete")
          w("- reads back a canary through the symlink target to confirm the write")
          w("- NECP probes for kernel information disclosure KASLR via op 0x0D")
          w("- no kernel read write primitive yet primitives are being mapped")
          w("Stack:")
          w("- SwiftUI app under natsuk1/natsuk1.swift Views/ Helpers/")
          w("- C kernel-touching probes under natsuk1/Exploit/necp.c nk_api.c")
          w("- Objective-C Grappa token helper GrappaHelper.m")
          w("- AirliftFFI static lib for pairing and exploit FFI")
          w("- Offsets JSON per device iOS build under natsuk1/Offsets/")
          w("Build:")
          w("- xcodegen from project.yml xcodebuild sdk iphoneos Release")
          w("- ldid sign with empty entitlements zip into natsuk1.ipa")
          w("- CI at .github/workflows/fix_and_release.yml single workflow")

          sec(1, "MANDATORY BEHAVIOR")
          w("For EVERY user message before answering:")
          w("1. Use web search. Search latest on iOS 27 kernel internals, XNU")
          w("   changelog 2026, Apple security advisories, blacktop ipsw release notes")
          w("   and CLI syntax, blacktop symbolicator signatures, Ghidra 12.x headless")
          w("   API and Jython compat, LiveContainer SideStore AltStore TrollStore")
          w("   iOS 27 status, SwiftUI iOS 27 regressions, NECP mbuf socket IOKit bugs")
          w("   2025 2026, Apple developer forums iOS 27 crash threads.")
          w("2. Use extended reasoning. Enumerate alternatives weigh tradeoffs and")
          w("   only then commit to a concrete answer.")
          w("3. If web search is unavailable say so explicitly at the top.")
          w("4. Cite source URLs for any fact that could change.")
          w("5. Never claim a version does not exist without checking.")
          w("6. Never claim an API exists without checking current syntax.")
          w("7. Never guess offsets. Only use values verified by Ghidra or extracted")
          w("   from the actual kernelcache for this exact build.")

          sec(2, "Update")
          w("- date: 2026-09-27")
          w("- device: iPhone14,5 iOS 27.0 24A437")
          w("- kernel: xnu-13432.2.10~2 RELEASE_ARM64_T8110")
          w("- signature: ad-hoc empty entitlements")
          w("- ci: fix_and_release.yml only")

          sec(3, "NECP status")
          w("Working:")
          w("- op 0x03 returns 1 byte")
          w("- op 0x04 returns 280-byte TLV")
          w("- op 0x1A returns 280-byte TLV")
          w("- op 0x0D returns user VA (KASLR leak)")
          w("Closed:")
          w("- op 0x05 copy_list returns -1")
          w("- op 0x0C copy_parameters returns -1")
          w("- op 0x0F copy_update returns -1")
          w("- op 0x18 get_signed_id empty")
          w("- op 0x19 set_signed_id returns -1")
          w("- TLV overflow rejected")
          w("- add_flow 0x24 to 0xF0 ok 0xF1 plus returns -1")
          w("- remove_flow twice ret 0 copy_result 1 byte")
          w("- copy_result_inner kptr count 0")
          w("- copy_interface 1 to 10 ret 0 no data")

          sec(4, "Caller graph")
          w("- necp_flow_alloc 0xA346E70 callers 0xA346474 0xA348180")
          w("- necp_handler_big 0xA3D91B4 caller 0xA3D9174")
          w("- necp_get_tlv 0xA4C2034 caller 0xA4C113C (9 BL)")
          w("- necp_open 0xA4E411C dispatcher BR BLR")
          w("- necp_client_action 0xA4E5C28 dispatcher BR BLR")
          w("- syscall_dispatcher 0xA6CEB84")

          sec(5, "Potential integer overflow")
          w("necp_flow_alloc 0xA346E70:")
          w("  uVar6 = min(user_count, 0x80)")
          w("  iVar1 = (uVar6 + param_3) * 0x14|0x18")
          w("  kalloc_type_necp_flow(iVar1)")
          w("  copyin(user_ptr, buf, uVar6 * 0x14|0x18)")
          w("If param_3 wraps int32 then alloc less than copyin gives heap overflow.")
          w("param_3 origin requires decompile of FUN_fffffff00a346474.")
          w("flow_alloc_overflow_attempt no longer masks with 0xFFFF.")

          sec(6, "Confirmed safe")
          w("- sooptcopyin 0xA77FD2C maxlen checked")
          w("- necp_handler_big 0xA3D91B4 uVar21 >= 0x2001")
          w("- necp_client_add_flow 0xA4E843C rejects 0xBF to 0xF0")
          w("- necp_update_cache 0xA4EBD58 user ptr via copyin only")

          sec(7, "iOS 27 runtime crashes")
