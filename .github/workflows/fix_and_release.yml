name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: nk-homebrew-v1
          restore-keys: |
            nk-homebrew-

      - uses: actions/cache@v4
        with:
          path: natsuk1.xcodeproj
          key: xcodeproj-${{ hashFiles('project.yml') }}
          restore-keys: |
            xcodeproj-

      - name: Reorganize repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          move() {
            local src="$1" dst="$2"
            if [ -e "$src" ] && [ ! -e "$dst" ]; then
              mkdir -p "$(dirname "$dst")"
              if git ls-files --error-unmatch "$src" >/dev/null 2>&1; then
                git mv "$src" "$dst"
              else
                mv "$src" "$dst"
              fi
              echo "moved $src -> $dst"
            fi
          }

          write_if_changed() {
            local dst="$1"
            local tmp
            tmp=$(mktemp)
            cat > "$tmp"
            if [ -f "$dst" ] && cmp -s "$tmp" "$dst"; then
              rm -f "$tmp"
            else
              mkdir -p "$(dirname "$dst")"
              mv "$tmp" "$dst"
              echo "wrote $dst"
            fi
          }

          # --- Layout ---
          move ai-hints.md docs/ai-hints.md
          move ai-think.md docs/ai-think.md

          move natsuk1/External/AirliftFFI.xcframework external/AirliftFFI.xcframework
          rmdir natsuk1/External 2>/dev/null || true

          move natsuk1/natsuk1.swift natsuk1/App/natsuk1.swift

          move natsuk1/Exploit/nk_api.c        natsuk1/Exploit/Core/nk_api.c
          move natsuk1/Exploit/nk_api.h        natsuk1/Exploit/Core/nk_api.h
          move natsuk1/Exploit/nk_offsets.h    natsuk1/Exploit/Core/nk_offsets.h
          move natsuk1/Exploit/necp.c          natsuk1/Exploit/NECP/necp.c
          move natsuk1/Exploit/GrappaHelper.h  natsuk1/Exploit/Airlift/GrappaHelper.h
          move natsuk1/Exploit/GrappaHelper.m  natsuk1/Exploit/Airlift/GrappaHelper.m

          move natsuk1/bridging.h natsuk1/Support/bridging.h

          # --- Cleanup ---
          rm -f natsuk1.png
          rm -f natsuk1/Views/SimpleList.swift
          rm -f ai-hints-curated.md
          rm -f natsuk1/Helpers/MobileGestalt.swift
          rm -f natsuk1/Views/MobileGestaltView.swift
          rm -f natsuk1/Views/CrashLogView.swift
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          find . -name .DS_Store -delete 2>/dev/null || true

          mkdir -p docs

          # --- bridging.h ---
          write_if_changed natsuk1/Support/bridging.h <<'EOF_BRIDGE'
          #ifndef NATSUK1_BRIDGING_H
          #define NATSUK1_BRIDGING_H

          #include <stdint.h>
          #include "nk_api.h"
          #include "GrappaHelper.h"
          #include "airlift.h"

          #endif
          EOF_BRIDGE

          # --- docs/architecture.md ---
          write_if_changed docs/architecture.md <<'EOF_ARCH'
          # Architecture

          natsuk1 — iOS kernel research toolkit.

          ## Layout

          - `natsuk1/App` — SwiftUI entry point (`natsuk1App`, `RootView`).
          - `natsuk1/Exploit/Core` — kernel primitives: `nk_api.c/h`, `nk_offsets.h`.
          - `natsuk1/Exploit/NECP` — `necp.c`, syscall-level probes (status: closed).
          - `natsuk1/Exploit/Airlift` — `GrappaHelper.m`, AirTraffic / Grappa bridge.
          - `natsuk1/Helpers` — Swift utilities (KeepAlive, CrashLog, OffsetsStore, …).
          - `natsuk1/Views` — SwiftUI screens.
          - `natsuk1/Offsets` — per-device offsets JSON.
          - `natsuk1/Resources` — Info.plist, entitlements, asset catalog.
          - `natsuk1/Support` — bridging header.
          - `external/AirliftFFI.xcframework` — prebuilt C FFI stub.
          - `docs/` — project documentation (including AI guides).

          ## Build

          - XcodeGen (`project.yml`) → `natsuk1.xcodeproj` → `xcodebuild`.
          - Ad-hoc signing via `ldid`, empty entitlements.
          - CI: `.github/workflows/fix_and_release.yml`.

          ## Status

          - NECP: closed at depth-0 sinks on this build. Kept as probe.
          EOF_ARCH

          # --- README.md ---
          write_if_changed README.md <<'EOF_README'
          # natsuk1

          iOS 27 kernel research toolkit.

          Target: iPhone14,5 / iOS 27.0 / build 24A437 / xnu-13432.2.10~2.

          ## Layout

          - `natsuk1/App` — SwiftUI entry point
          - `natsuk1/Exploit/Core` — kernel primitives (nk_api, nk_offsets)
          - `natsuk1/Exploit/NECP` — NECP probes (closed)
          - `natsuk1/Exploit/Airlift` — AirTraffic/Grappa helper
          - `natsuk1/Helpers` — Swift utilities
          - `natsuk1/Views` — UI
          - `natsuk1/Offsets` — per-device offsets JSON
          - `natsuk1/Resources` — Info.plist, entitlements, assets
          - `natsuk1/Support` — bridging header
          - `external/AirliftFFI.xcframework` — prebuilt C FFI stub
          - `docs/` — project documentation

          ## For AI researchers

          Read `docs/ai-hints.md` and `docs/ai-think.md` before answering anything.
          EOF_README

          # --- project.yml ---
          write_if_changed project.yml <<'EOF_PROJECT'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false

          configs:
            Debug: debug
            Release: release

          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              CLANG_WARN_DOCUMENTATION_COMMENTS: NO
              CLANG_WARN_UNREACHABLE_CODE: NO
              CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
              GCC_WARN_UNINITIALIZED_AUTOS: NO
              GCC_WARN_UNDECLARED_SELECTOR: NO
              GCC_WARN_UNUSED_FUNCTION: NO
              GCC_WARN_UNUSED_VARIABLE: NO
              ENABLE_STRICT_OBJC_MSGSEND: NO
              MTL_ENABLE_DEBUG_INFO: NO
              MTL_FAST_MATH: YES
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO
            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "DEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES
              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "NDEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                MTL_FAST_MATH: YES
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: YES
                LLVM_LTO_MODE: thin

          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/App
                - path: natsuk1/Exploit
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Support/bridging.h
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/Support/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/Exploit/Core $(SRCROOT)/natsuk1/Exploit/Airlift $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/Headers"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          EOF_PROJECT

          # --- Commit if changed ---
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: reorganize repo layout [skip ci]"
            git push
          fi

      - name: Verify AirliftFFI present
        run: |
          set -e
          A=external/AirliftFFI.xcframework/ios-arm64
          if [ -f "$A/Headers/airlift.h" ] && [ -f "$A/libairlift_ffi.a" ]; then
            echo "airlift stub: $(wc -c < "$A/libairlift_ffi.a") bytes"
          else
            echo "::warning::AirliftFFI missing at $A; Airlift features will fail to link."
          fi

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Generate project
        run: |
          if [ ! -d natsuk1.xcodeproj ]; then
            xcodegen generate
          else
            echo "Using cached Xcode project"
          fi

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            build -quiet

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" -name "*.dSYM" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "*.swiftmodule" -delete 2>/dev/null || true
          find "$APP" -name "*.swiftdoc" -delete 2>/dev/null || true
          find "$APP" -name "*.swiftsourceinfo" -delete 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          R="${{ github.repository }}"
          U="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          Install:
          - IPA: $U
          - LiveContainer: livecontainer://install?url=$U
          - SideStore: sidestore://install?url=$U
          - AltStore: altstore://install?url=$U
          - Scarlet: scarlet://install?url=$U
          - ESign: esign://install?url=$U

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"