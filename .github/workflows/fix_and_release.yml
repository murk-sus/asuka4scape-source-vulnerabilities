name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1/External
            build
          key: nk-v13-static
          restore-keys: |
            nk-v13-
            nk-v12-

      - name: Checkout sanity
        run: |
          set -e
          test -f ai-think.md || { echo "missing ai-think.md"; exit 1; }
          test -f ai-hints-curated.md || { echo "missing ai-hints-curated.md"; exit 1; }
          wc -c ai-think.md ai-hints-curated.md

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift
          find . -name .DS_Store -delete

      - name: Merge curated into ai-hints.md
        run: |
          python3 -c 'import io,os;c=io.open("ai-hints-curated.md").read().rstrip();ms="<!-- AI-HINTS-CURATED-START -->";me="<!-- AI-HINTS-CURATED-END -->";b=ms+"\n"+c+"\n"+me;s=io.open("ai-hints.md").read() if os.path.exists("ai-hints.md") else "";s=((s[:s.index(ms)]+b+s[s.index(me)+len(me):]) if (ms in s and me in s) else (s.rstrip()+"\n\n"+b+"\n" if s.strip() else b+"\n"));io.open("ai-hints.md","w").write(s);print("ai-hints.md",len(s.encode("utf-8")),"bytes")'

      - name: Vendor AirliftFFI
        run: |
          set -euo pipefail
          A=natsuk1/External/AirliftFFI.xcframework/ios-arm64
          if [ -f "$A/Headers/airlift.h" ] && [ -f "$A/libairlift_ffi.a" ]; then
            echo cached
            exit 0
          fi
          mkdir -p "$A/Headers"
          python3 -c 'import io,os;b="natsuk1/External/AirliftFFI.xcframework/ios-arm64";os.makedirs(b+"/Headers",exist_ok=True);h=["#ifndef AIRLIFT_H","#define AIRLIFT_H","#include <stdint.h>","#include <stddef.h>",chr(35)+"ifdef __cplusplus",chr(35)+chr(35)+"endif"];io.open(b+"/Headers/airlift.h","w").write("\n".join(h)+"\n");print("header stub written")'
          printf '%s\n' \
            '#ifndef AIRLIFT_H' \
            '#define AIRLIFT_H' \
            '#include <stdint.h>' \
            '#include <stddef.h>' \
            '#ifdef __cplusplus' \
            'extern "C" {' \
            '#endif' \
            'typedef struct {' \
            '  char *host_alt_irk_hex;' \
            '  char *device_name;' \
            '  char *pairing_file_path;' \
            '  char *error;' \
            '} ALPairResult;' \
            'typedef void (*ALLogCb)(void*, const char*);' \
            'typedef void (*ALPairReadyCb)(void*, const char*, uint16_t, const char**, const char**, size_t);' \
            'typedef void (*ALPairPinCb)(const char*, void*);' \
            'void al_log_init(ALLogCb, void*);' \
            'int32_t al_pairing_run_host(const char*, uint16_t, const char*, const char*, const char*, const char*, ALPairReadyCb, ALPairPinCb, void*, ALPairResult*);' \
            'void al_pairing_result_free(ALPairResult*);' \
            'int32_t al_exploit_run(const char*, const char*, const char*, const char*, char**, char**);' \
            'int32_t al_find_app_container(const char*, const char*, const char*, const char*, char**, char**);' \
            'int32_t al_device_respring(const char*, const char*, const char*, char**);' \
            'void al_string_free(char*);' \
            '#ifdef __cplusplus' \
            '}' \
            '#endif' \
            '#endif' \
            > "$A/Headers/airlift.h"
          printf '%s\n' \
            '#include "airlift.h"' \
            '#include <stdlib.h>' \
            '#include <string.h>' \
            'static char* D(const char*s){if(!s)return 0;size_t n=strlen(s)+1;char*p=malloc(n);if(p)memcpy(p,s,n);return p;}' \
            'static void E(char**o,const char*m){if(o)*o=D(m);}' \
            'void al_log_init(ALLogCb c,void*x){(void)c;(void)x;}' \
            'int32_t al_pairing_run_host(const char*b,uint16_t p,const char*n,const char*m,const char*o,const char*i,ALPairReadyCb r,ALPairPinCb q,void*x,ALPairResult*y){(void)b;(void)p;(void)n;(void)m;(void)o;(void)i;(void)r;(void)q;(void)x;if(y){y->host_alt_irk_hex=0;y->device_name=0;y->pairing_file_path=0;y->error=D("stub");}return -1;}' \
            'void al_pairing_result_free(ALPairResult*r){if(!r)return;free(r->host_alt_irk_hex);free(r->device_name);free(r->pairing_file_path);free(r->error);}' \
            'int32_t al_exploit_run(const char*a,const char*b,const char*c,const char*d,char**j,char**e){(void)a;(void)b;(void)c;(void)d;if(j)*j=0;E(e,"stub");return -1;}' \
            'int32_t al_find_app_container(const char*a,const char*b,const char*c,const char*d,char**o,char**e){(void)a;(void)b;(void)c;(void)d;if(o)*o=0;E(e,"stub");return -1;}' \
            'int32_t al_device_respring(const char*a,const char*b,const char*c,char**e){(void)a;(void)b;(void)c;E(e,"rule14");return -1;}' \
            'void al_string_free(char*s){free(s);}' \
            > /tmp/airlift_stub.c
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -Oz -isysroot "$SDK" -c /tmp/airlift_stub.c -o /tmp/airlift_stub.o
          xcrun libtool -static -o "$A/libairlift_ffi.a" /tmp/airlift_stub.o 2>/dev/null || xcrun ar rcs "$A/libairlift_ffi.a" /tmp/airlift_stub.o
          xcrun strip -S "$A/libairlift_ffi.a" || true

      - name: Patch sources
        run: |
          python3 -c 'import io,os;P="natsuk1/Helpers/AirliftBridge.swift";s=io.open(P).read() if os.path.exists(P) else "";k="        guard UserDefaults.standard.bool(forKey: \"allow_device_respring\") else {";i=s.find(k);j=s.find("        }\n",i) if i>=0 else -1;t=(s[:i]+s[j+10:]) if i>=0 and j>=0 else s;io.open(P,"w").write(t) if t!=s else None;print("airliftbridge", "ok" if t!=s else "noop")'
          python3 -c 'import io,os;P="natsuk1/Views/SettingsView.swift";s=io.open(P).read() if os.path.exists(P) else "";a="    @AppStorage(\"allow_device_respring\") private var r: Bool = false\n";b="                    Toggle(\"Allow device respring\", isOn: $r)\n";t=s.replace(a,"",1).replace(b,"",1);io.open(P,"w").write(t) if t!=s else None;print("settings", "ok" if t!=s else "noop")'
          python3 -c 'import io,os;P="natsuk1/Exploit/necp.c";s=io.open(P).read() if os.path.exists(P) else "";a="        size_t sz = test_sizes[i] & 0xFFFF;\n";b="        size_t sz = (size_t)test_sizes[i];\n";t=s.replace(a,b,1);io.open(P,"w").write(t) if t!=s else None;print("necp", "ok" if t!=s else "noop")'
          python3 -c 'import io,os;P="natsuk1/Helpers/OffsetsStore.swift";s=io.open(P).read() if os.path.exists(P) else "";a="return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: \"Offsets\")\n";b=a+"                ?? Bundle.main.url(forResource: name, withExtension: ext)\n";t=s.replace(a,b,1) if "?? Bundle.main.url(forResource: name" not in s else s;io.open(P,"w").write(t) if t!=s else None;print("offsets", "ok" if t!=s else "noop")'
          python3 -c 'import io,os;P="natsuk1/Exploit/GrappaHelper.m";s=io.open(P).read() if os.path.exists(P) else "";T=["01012ba6a01f2ccf66a02613d5b72e0bc916004058a001a6874d18b5bd7b3395e25d79fa3ffcc67e718106d485c51540b828d1620e9f94f582d3bcc6f97e9088c923095ad8d36ab568fb45df61e286d25354b04c","0101efa33b1586f410087474b2ccaf8cdb4d0040e5aee6017fdcf774a51c1980b4238076e86218af5a5f169470df90b73f4fc893a22da94fb9745c10f23df0620cfe3f19be3f2ab37d2f7590d8597ab51ebcced0","0101aab479a6d8226f3e1d7a57a2501337e50240e54444b5f1d04101205a7a2f3d148d18440e2edef03d37fcdc7423c0bb441b4c4a355169d511d67ae3466fdf8865e69a8aed45867801ea8e1bbb48889ba0b834","010194ab2ece86e05d7313e4075a947ab3be0240c9237c46b3c519d2ec297304413dab741827016e5eb9af8792bc2b3d6f12be25397931f41bffb887d042b97057c03ed8d72a3acb72378d30f7a073e3d7590f62","01018cec0ea2c25446c90133d435eaafb0150240c6c28dd42f62f8907133c462fc8b6def05e543ab2d59952f6eb3b38e382d492cd2881beceaeaea67fc1331f77fca50fde6bed35622009670e6d6e4a36b09c088","0101243b2587f14dd812751c6710730f46d50440fe2e5e9ccfe70200487e14c131412381fd7c214241b182ca04ebe0c1f3cdd54ac17eef31705c06289e02f672fa8c0d9dff167f1c925df876d5814d3265f55b06","01016f8908f8f972bdc8fe99002f7648e86c024011a469c4320bb7e44137756dde3ecfbff08a55081e532c12a06101c6ae5283a014512d977eafad06c34b1f116422f6bf72ef56f8d734d37db287b170be7a3a82","01015c5fcc103d0460f5bbfd48c387806e8e0340e3323ed780fbeccc2908c059d9a81e75976bf058b411f62a9a6e1df7ba307f69226942373f484690799b230bc60e99036f40eae25229aff6bb31ab74820e68a9","0101f3f542aaa17252a8f81b3dc5b007adc304408d2496cee3af54113ffa9fba392b4143d4c38e4d79680e8e9feb554e450c1f89220c02375a9063b3a62bf61f62bd073991ebf215c6c2e28938d1aa53ed580c02","0101fc26f7e89d1635d86b5c886df69f526a0040038b6c33049f6bd5cc526b4ee7ccce614135d2c73f8326d9af6d28399a231510917493d4fdaa395b4d1c1e1b09bdf3fe6fb7e16ad6d5f5cc18b93730874e6f4e"];k="kAuthenticGrappaTokens[] = {";i=s.find(k);j=s.find("};",i) if i>=0 else -1;body=s[i+len(k):j] if i>=0 and j>=0 else "";M="// nk-grappa-restored";t=s if (M in s) or (i<0) or (j<0) or ("NULL" not in body and body.strip()) else s[:i+len(k)]+"\n"+M+"\n"+"".join(["    \""+x+"\",\n" for x in T])+"    NULL\n"+s[j:];io.open(P,"w").write(t) if t!=s else None;print("grappa", "ok" if t!=s else "noop")'

      - name: Entitlements
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '</dict>' '</plist>' > natsuk1/Resources/natsuk1.entitlements

      - name: Update README
        run: |
          printf '%s\n' '# natsuk1' '' 'iOS 27 kernel research toolkit.' '' 'AI researchers read ai-hints.md and ai-think.md before answering anything.' > README.md
          wc -c README.md

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=minimal SWIFT_APPROACHABLE_CONCURRENCY=NO SWIFT_OPTIMIZATION_LEVEL=-Osize GCC_OPTIMIZATION_LEVEL=s DEAD_CODE_STRIPPING=YES COPY_PHASE_STRIP=YES STRIP_INSTALLED_PRODUCT=YES STRIP_STYLE=all OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" -UseModernBuildSystem=YES build -quiet

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" -name "*.dSYM" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "*.swiftmodule" -delete 2>/dev/null || true
          find "$APP" -name "*.swiftdoc" -delete 2>/dev/null || true
          find "$APP" -name "*.swiftsourceinfo" -delete 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          COPYFILE_DISABLE=1 zip -9 -qry natsuk1.ipa Payload
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          R="${{ github.repository }}"
          U="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v13.0 ($((SIZE/1024)) KB)

          Install:
          - IPA: $U
          - LiveContainer: livecontainer://install?url=$U
          - SideStore: sidestore://install?url=$U
          - AltStore: altstore://install?url=$U
          - Scarlet: scarlet://install?url=$U
          - ESign: esign://install?url=$U

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa --target "${{ github.sha }}" --title "Development" --prerelease --latest=false --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "v13.0: single-line python patches, external ai files [skip ci]"
          git push