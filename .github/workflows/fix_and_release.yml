name: Pairing Fix and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release tag, e.g. v1.0.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
         fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
         xcode-version: "26.5"

      - name: Install tools
        run: |
         set -e
         command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
         command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Write CarrierLabCompat.swift
        run: |
         set -euo pipefail
         cat > natsuk1/CarrierLab/CarrierLabCompat.swift <<'COMPAT_EOF'
         import Foundation

         extension CarrierLabBridge {
             static let carrierUserRoot = "/var/mobile/Library/Carrier Bundles"
             static let carrierRoot = "/var/mobile/Library/Carrier Bundles/iPhone"
             static let defaultSlots = ["Carrier1Bundle.bundle", "Operator1Bundle.bundle"]
         }

         extension PairingGenerator {
             static func cancelMinting() {
                 LockdownPair.requestCancel()
                 PairingController.shared.pairingStatus = "Cancelling..."
             }
         }

         final class CarrierLabSlots: @unchecked Sendable {
             static let shared = CarrierLabSlots()
             private init() {}

             struct Outcome {
                 let ok: Bool
                 let message: String
                 let slots: [String]
             }

             func pairingPath() -> String? {
                 let fm = FileManager.default
                 let canonical = PairingController.pairingFilePath()
                 if fm.fileExists(atPath: canonical) { return canonical }
                 guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return nil }
                 for name in ["natsuk1_pairing.plist", "ALTPairingFile.mobiledevicepairing"] {
                     let candidate = docs.appendingPathComponent(name).path
                     if fm.fileExists(atPath: candidate) { return candidate }
                 }
                 return nil
             }

             func sourcePath() -> String {
                 Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/CarrierLab.bundle").path
             }

             private func fileCount(_ path: String) -> Int {
                 let fm = FileManager.default
                 var isDirectory: ObjCBool = false
                 guard fm.fileExists(atPath: path, isDirectory: &isDirectory), isDirectory.boolValue else { return 0 }
                 guard let walker = fm.enumerator(at: URL(fileURLWithPath: path),
                                                 includingPropertiesForKeys: [.isRegularFileKey]) else { return 0 }
                 var files = 0
                 for case let url as URL in walker {
                     if (try? url.resourceValues(forKeys: [.isRegularFileKey]))?.isRegularFile == true { files += 1 }
                 }
                 return files
             }

             func status() -> String {
                 guard let path = pairingPath() else { return "no pairing file, pair from Tools / Airlift" }
                 let kind = PairingFileKind.of(path: path)
                 if kind.hasLockdown { return "ready" }
                 if kind.hasRemotePairing { return "needs a lockdown record, press Pair Lockdown Record" }
                 return "pairing file is not an RPPairing plist"
             }

             @discardableResult
             func ensureLockdownRecord() -> String? {
                 guard let path = pairingPath() else { return "No pairing file. Pair from Tools / Airlift first." }
                 let kind = PairingFileKind.of(path: path)
                 if kind.hasLockdown { return nil }
                 guard kind.isUsable else { return "Pairing file is not a plist." }
                 guard kind.hasRemotePairing else {
                     return "No public_key/private_key in the pairing file, pair again from Airlift."
                 }

                 PairingController.shared.pairingStatus = "Minting lockdown record, tap Trust on the iPhone..."
                 do {
                     let record = try LockdownPair.mintRecord(
                         hosts: LockdownPair.candidateHosts(),
                         hostID: CompositePairingFile.hostID,
                         systemBUID: CompositePairingFile.systemBUID,
                         hostName: "natsuk1")
                     let rpp = try Data(contentsOf: URL(fileURLWithPath: path))
                     let merged = try CompositePairingFile.merge(lockdown: record, rpPairing: rpp, udid: kind.udid)
                     CompositePairingFile.storeLockdownRecord(record, forUDID: kind.udid)
                     let canonical = PairingController.syncCanonicalPairingFile(from: path)
                     try merged.write(to: URL(fileURLWithPath: canonical), options: .atomic)
                     guard PairingFileKind.of(path: canonical).hasLockdown else {
                         return "Minted \(record.count) bytes but the merged file still has no DeviceCertificate."
                     }
                     PairingController.shared.pairingStatus = "Lockdown record stored"
                     return nil
                 } catch {
                     let text = (error as? LocalizedError)?.errorDescription ?? String(describing: error)
                     PairingController.shared.pairingStatus = text
                     return text
                 }
             }

             private func inject(source: String, parent: String, name: String) -> Bool {
                 guard let pairing = pairingPath(), fileCount(source) > 0 else { return false }
                 var rc: Int32 = -1
                 pairing.withCString { pc in
                     source.withCString { sc in
                         parent.withCString { tc in
                             name.withCString { nc in
                                 rc = al_exploit_inject_folder(pc, sc, tc, nc, nil, nil, nil)
                             }
                         }
                     }
                 }
                 return rc == 0
             }

             func install(slots: [String]) -> Outcome {
                 if let problem = ensureLockdownRecord() {
                     return Outcome(ok: false, message: problem, slots: [])
                 }
                 let source = sourcePath()
                 guard fileCount(source) > 0 else {
                     return Outcome(ok: false, message: "no files in directory: \(source)", slots: [])
                 }
                 var written: [String] = []
                 for slot in slots where inject(source: source, parent: CarrierLabBridge.carrierUserRoot, name: slot) {
                     written.append(slot)
                 }
                 guard written.count == slots.count else {
                     return Outcome(ok: false, message: "injected \(written.count)/\(slots.count): \(written.joined(separator: ","))", slots: written)
                 }
                 let trigger = Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/Docomo_jp.bundle").path
                 if fileCount(trigger) > 0 {
                     _ = inject(source: trigger, parent: CarrierLabBridge.carrierRoot, name: "Docomo_jp.bundle")
                 }
                 return Outcome(ok: true, message: "written into \(written.joined(separator: ","))", slots: written)
             }
         }
         COMPAT_EOF

      - name: Write CarrierLabView.swift
        run: |
         set -euo pipefail
         cat > natsuk1/CarrierLab/CarrierLabView.swift <<'CLVIEW_EOF'
         import SwiftUI
         import UIKit

         struct CarrierLabView: View {
             @ObservedObject private var state = CarrierLabState.shared
             @EnvironmentObject private var appState: AppState

             @State private var slotText = ""
             @State private var copied = false

             var body: some View {
                 List {
                     Section {
                         HStack {
                             Text("Session")
                             Spacer()
                             Text(state.session?.status.rawValue ?? "clean").font(.system(.body, design: .monospaced))
                         }
                         if let error = state.session?.lastError {
                             Text(error).font(.footnote).foregroundStyle(.red)
                         }
                     } header: { Label("CarrierLab", systemImage: "shippingbox") }

                     Section {
                         TextField("Carrier1Bundle.bundle", text: $slotText)
                             .font(.system(.footnote, design: .monospaced))
                             .autocorrectionDisabled()
                         Button("Apply Slots") { applySlots() }
                         Button("Reset Slots To Default") {
                             slotText = CarrierLabBridge.defaultSlots.joined(separator: ", ")
                             applySlots()
                         }
                     } header: { Label("Targets", systemImage: "folder.badge.gearshape") }
                     footer: { Text("Contents go into these existing bundles under \(CarrierLabBridge.carrierUserRoot).").font(.caption2) }

                     Section {
                         Button("Check") { run("check") { CarrierLabSlots.shared.status() } }
                         Button("Pair Lockdown Record") { run("pair") { CarrierLabSlots.shared.ensureLockdownRecord() ?? "lockdown record stored" } }
                         Button("Install") { run("install") { install() } }
                         Button("Reload") { run("reload") { install() } }
                         Button("Respring") { appState.respring() }
                     } header: { Label("Actions", systemImage: "wrench") }

                     if !state.logText.isEmpty {
                         Section {
                             ScrollView {
                                 Text(state.logText).font(.system(size: 10, design: .monospaced)).frame(maxWidth: .infinity, alignment: .leading)
                             }
                             .frame(minHeight: 120, maxHeight: 300)
                             Button(copied ? "Copied" : "Copy All") {
                                 UIPasteboard.general.string = state.logText
                                 copied = true
                                 DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { copied = false }
                             }
                             Button("Clear", role: .destructive) { state.clearLog() }
                         } header: { Label("Log", systemImage: "terminal") }
                     }
                 }
                 .listStyle(.insetGrouped)
                 .navigationTitle("CarrierLab")
                 .navigationBarTitleDisplayMode(.inline)
                 .onAppear { slotText = state.slots.joined(separator: ", ") }
             }

             private func applySlots() {
                 state.setSlots(slotText.split(separator: ",").map { String($0).trimmingCharacters(in: .whitespaces) })
                 state.appendLog("[slots] \(state.slots.joined(separator: ","))")
             }

             private func install() -> String {
                 let slots = CarrierLabState.shared.slots
                 let outcome = CarrierLabSlots.shared.install(slots: slots)
                 CarrierLabState.shared.save(CarrierLabState.Session(
                     status: outcome.ok ? .placed : .failed,
                     startedAt: Date(),
                     carrierBundlePath: CarrierLabSlots.shared.sourcePath(),
                     originalBackupPath: nil,
                     ipccTriggerPath: nil,
                     lastError: outcome.ok ? nil : outcome.message,
                     aliases: nil,
                     slots: outcome.slots))
                 return outcome.ok ? outcome.message : "failed: \(outcome.message)"
             }

             private func run(_ name: String, _ work: @escaping () -> String) {
                 if state.busy { return }
                 state.setBusy(true)
                 DispatchQueue.global(qos: .userInitiated).async {
                     let text = work()
                     CarrierLabState.shared.appendLog("[\(name)] \(text)")
                     CarrierLabState.shared.setBusy(false)
                 }
             }
         }
         CLVIEW_EOF

      - name: Write PairingGenerator.swift
        run: |
         set -euo pipefail
         cat > natsuk1/Helpers/PairingGenerator.swift <<'PAIRINGGEN_EOF'
         import Foundation

         struct PairingError: LocalizedError {
             let message: String
             var errorDescription: String? { message }
         }

         final class PairingGenerator {
             static let shared = PairingGenerator()
             private init() {}

             private let hostName = "natsuk1"

             @discardableResult
             func generateMergedPairing(rppPath: String, outputPath: String) throws -> String {
                 LockdownPair.resetCancel()

                 guard let rpp = try? Data(contentsOf: URL(fileURLWithPath: rppPath)), !rpp.isEmpty else {
                     throw PairingError(message: "pairing record missing at \(rppPath)")
                 }
                 let kind = PairingFileKind.of(data: rpp)
                 guard kind.hasRemotePairing else {
                     throw PairingError(message: "not an RPPairing record, pair again from Airlift")
                 }
                 if kind.hasLockdown {
                     return try write(rpp, outputPath: outputPath, sourcePath: rppPath)
                 }

                 var lockdown = CompositePairingFile.cachedLockdownRecord(forUDID: kind.udid)
                 if lockdown == nil {
                     PairingController.shared.pairingStatus = "Minting lockdown record..."
                     do {
                         let record = try LockdownPair.mintRecord(
                             hosts: LockdownPair.candidateHosts(),
                             hostID: CompositePairingFile.hostID,
                             systemBUID: CompositePairingFile.systemBUID,
                             hostName: hostName)
                         CompositePairingFile.storeLockdownRecord(record, forUDID: kind.udid)
                         lockdown = record
                     } catch {
                         if LockdownPair.cancelled { throw PairingError(message: "cancelled") }
                         throw PairingError(message: (error as? LocalizedError)?.errorDescription
                                            ?? String(describing: error))
                     }
                 }
                 guard let lockdown else {
                     throw PairingError(message: "lockdown record unavailable")
                 }

                 let merged = try CompositePairingFile.merge(lockdown: lockdown, rpPairing: rpp, udid: kind.udid)
                 let canonical = try write(merged, outputPath: outputPath, sourcePath: rppPath)
                 PairingController.shared.pairingStatus = "Pairing file ready"
                 return canonical
             }

             private func write(_ data: Data, outputPath: String, sourcePath: String) throws -> String {
                 if outputPath != sourcePath {
                     try? data.write(to: URL(fileURLWithPath: outputPath), options: .atomic)
                 }
                 let canonical = PairingController.syncCanonicalPairingFile(from: sourcePath)
                 do {
                     try data.write(to: URL(fileURLWithPath: canonical), options: .atomic)
                 } catch {
                     throw PairingError(message: error.localizedDescription)
                 }
                 return canonical
             }
         }
         PAIRINGGEN_EOF

      - name: Verify sources
        run: |
         set -euo pipefail
         fail() { echo "::error::$1"; exit 1; }
         grep -q 'static func cancelMinting' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: static func cancelMinting'
         grep -q 'al_exploit_inject_folder' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: al_exploit_inject_folder'
         grep -q 'Copy All' natsuk1/CarrierLab/CarrierLabView.swift || fail 'natsuk1/CarrierLab/CarrierLabView.swift is stale: Copy All'
         grep -q 'Pair Lockdown Record' natsuk1/CarrierLab/CarrierLabView.swift || fail 'natsuk1/CarrierLab/CarrierLabView.swift is stale: Pair Lockdown Record'
         grep -q 'func ensureLockdownRecord' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: func ensureLockdownRecord'
         grep -q 'LockdownPair.mintRecord' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: LockdownPair.mintRecord'
         grep -q 'CompositePairingFile.merge' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: CompositePairingFile.merge'
         grep -q 'LockdownPair.mintRecord' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift is stale: LockdownPair.mintRecord'
         grep -q 'func mintRecord' natsuk1/Helpers/LockdownPair.swift || fail 'natsuk1/Helpers/LockdownPair.swift is stale: func mintRecord'
         grep -q 'static func merge' natsuk1/Helpers/CompositePairingFile.swift || fail 'natsuk1/Helpers/CompositePairingFile.swift is stale: static func merge'
         grep -q 'LockdownPair.cancelled' natsuk1/Helpers/AirliftBridge.swift || fail 'natsuk1/Helpers/AirliftBridge.swift is stale: LockdownPair.cancelled'
         grep -q 'idevice_shim.h' natsuk1/Support/bridging.h || fail 'natsuk1/Support/bridging.h is stale: idevice_shim.h'
         ! grep -q 'lockdownd_connect_rsd' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift still has lockdownd_connect_rsd'
         ! grep -q 'static func cancelMinting' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift still has static func cancelMinting'
         ! grep -q 'CarrierLabInstaller' natsuk1/CarrierLab/CarrierLabView.swift || fail 'natsuk1/CarrierLab/CarrierLabView.swift still has CarrierLabInstaller'
         ! grep -q 'Task' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift still has Task'

      - name: Commit
        run: |
         set -euo pipefail
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add -A
         if git diff --cached --quiet; then echo "no changes"; exit 0; fi
         git commit -q -m "fix: on-device lockdown record minting [skip ci]"
         git push || true

      - name: Generate project
        run: |
         set -euo pipefail
         rm -rf natsuk1.xcodeproj
         xcodegen generate

      - name: Build
        run: |
         set -euo pipefail
         xcodebuild \
           -project natsuk1.xcodeproj \
           -scheme natsuk1 \
           -configuration Release \
           -destination "generic/platform=iOS" \
           -derivedDataPath build \
           SWIFT_STRICT_CONCURRENCY=minimal \
           OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
           build -quiet

      - name: Package and Publish
        env:
         GH_TOKEN: ${{ github.token }}
        run: |
         set -euo pipefail
         APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
         test -n "$APP"
         ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP/natsuk1"
         xcrun strip -S -x "$APP/natsuk1" || true
         rm -rf Payload natsuk1.ipa
         mkdir -p Payload
         cp -R "$APP" Payload/
         ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
         rm -rf Payload
         TAG="${{ inputs.version }}"
         if [ -n "$TAG" ]; then
           gh release create "$TAG" natsuk1.ipa --target "${{ github.sha }}" --title "natsuk1 $TAG" --latest
         else
           gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
           gh release create development natsuk1.ipa --target "${{ github.sha }}" --title "Development" --prerelease --latest=false --notes "natsuk1 development"
         fi
