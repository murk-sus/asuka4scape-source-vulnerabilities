## WHAT A PRIMITIVE LOOKS LIKE

A real kernel primitive requires ALL of:
1. user-controlled size in a kalloc_type / kalloc_zone call
2. no pre-validation between decode of that size and the allocation
3. copyin / copyout / memmove with a size that does NOT match the
   allocated size

Common patterns that look like primitives but are not:
- size decoded from ioctl cmd >> 16 AND mask, then capped at 0x1fff before alloc
- size = user value, but if (size > CONST) return error immediately before
- size = (user_a + user_b) * CONST with CARRY4 / CARRY8 overflow check
- stack buffer fixed at N, size checked against N, copyin(N) — safe
- SoftwareBreakpoint(0x5519) on the size mismatch path — this is Apple's
  hardening trap, not a vulnerability (unless the trap is bypassable)

## TAINT METHOD (kernel_rw.py approach)

Sources: functions whose parameters are user-controlled (syscall handlers,
NECP op handlers, IOKit traps).

Sinks: kalloc_type, kalloc_zone, copyin, copyout, memmove, memset.

Propagation:
1. For each function, get HighFunction from DecompInterface
2. Get parameter varnodes via hf.getLocalSymbolMap() — NOT via
   getFunctionPrototype().getStorage(); that path gives descriptors, not
   SSA varnodes and silently returns 0 matches
3. Compare varnodes by key addr.toString() plus colon plus str(size) —
   NOT by Java object identity
4. Iterate over hf.getPcodeOps(): if any input is tainted, output is
   tainted. Loop until no change.
5. For each PcodeOp.CALL, resolve target via getInput(0).isAddress().
   If target is a sink, check if the size-arg varnode is tainted. If yes,
   record finding. Otherwise recurse into callee with tainted arg indices.
6. Cap depth, cap worklist size, cap total time.

## HOW TO WRITE GHIDRA JYTHON SCRIPTS THAT ACTUALLY RUN

Follow every point. Each one cost hours to find.

### String handling — never use plus between quotes and identifiers

Bad:
    log("[-] " + str(e))

The editor or AI copy-paste mangles quotes. Use percent formatting:

Good:
    log("[-] %s" % e)

Every log line. No exceptions.

### Tuple literals — never put 0x at position 0

Bad:
    TARGETS = [
        (0xFFFFFFF00A4E843C, "necp_client_add_flow"),
    ]

Editor inserts a quote before 0x, breaking the tuple. Use named constants:

Good:
    A_ADD_FLOW = int("FFFFFFF00A4E843C", 16)
    TARGETS = [
        (A_ADD_FLOW, "necp_client_add_flow"),
    ]

### Dictionary access — use get(), not bracket

Bad:
    sname, sidx = SINK_MAP[target]

Use:
    v = SINK_MAP.get(target)
    if v is not None:
        sname = v[0]
        sidx = v[1]

### PcodeOp address — getSeqnum().getTarget()

PcodeOpAST returned by HighFunction.getPcodeOps() does NOT have
getAddress(). Use:

    pc = op.getSeqnum().getTarget().getOffset()

### Function boundaries — call ensure_function for un-decompiled addresses

Ghidra does not always create a function boundary at a kernel symbol's
entry. Symptoms: getFunctionAt(addr) is None, getFunctionContaining
returns a wrapper or None. Fix with DisassembleCommand then
CreateFunctionCmd, or fall back to FunctionManager.createFunction.

### Parameter varnodes — getLocalSymbolMap() is the only correct path

Bad, returns 0 matches silently:
    proto = hf.getFunctionPrototype()
    storage = proto.getParam(i).getStorage()

Correct:
    lsm = hf.getLocalSymbolMap()
    syms = lsm.getSymbols()
    while syms.hasNext():
        sym = syms.next()
        if not sym.isParameter():
            continue
        cat = sym.getCategoryIndex()
        hv = sym.getHighVariable()
        for vn in hv.getInstances():
            result.setdefault(cat, set()).add(vn_key(vn))

### Varnode identity — compare by key, not by identity

Bad:
    if vn in tainted:

Correct:
    def vn_key(vn):
        a = vn.getAddress()
        return a.toString() + ":" + str(vn.getSize())

    tainted = set()
    tainted.add(vn_key(vn))
    if vn_key(vn) in tainted:
        ...

### Imports — wrap Ghidra commands in try/except

Some Ghidra API classes are not present in every version. If an import
fails at module load, the entire script dies. Wrap:

    try:
        from ghidra.app.cmd.disassemble import DisassembleCommand
        HAS_DISASM = True
    except Exception:
        HAS_DISASM = False

### Decompiler instance — reuse one DecompInterface

Bad: create a new DecompInterface on every function.
Correct: instantiate once, cache in a module-level global.

### Timeouts — always

decompileFunction(f, sec, monitor) where sec is a hard cap. 30-45 sec for
medium functions, 90 sec for 40000 plus ops functions. Without a cap, one
pathological function hangs the whole CI job.

### Crash-proof main

Wrap main() in try/except, and in the except write a FATAL line plus
traceback to the output file. This guarantees test -s result.txt passes
even when the script dies early.

### Final validation

Before pushing the script to CI, run locally:

    python3 -c "import ast,sys; ast.parse(open('scripts/kernel_rw.py').read()); print('ok')"

If this fails, the CI step Validate scripts will fail identically.

## WORKFLOW

### Workflow files

- fix_and_release.yml — builds IPA, signs, generates ai-hints.md, commits
- extract_offsets.yml — runs scripts/kernel_rw.py under Ghidra headless

Only these two. No fix_and_test.yml, no build_and_release.yml.

### Cache strategy

Separate caches for ghidra, ipsw, symbolicator, kernelcache, ghidra_project.
Warm run 3-6 min, cold run 40-90 min. Never use hashFiles on kernelcache.
Never delete cached dirs in cleanup.

### Output conventions

kernel_rw.py writes exactly ONE file: result.txt. No offsets.json, no
primitives.json, no dump.txt. Everything goes into result.txt (diagnostics
plus findings plus summary plus decompile of hot targets).

### Ghidra headless invocation

    analyzeHeadless <project_dir> <project_name> \
      -process <kernelcache_name> -noanalysis \
      -scriptPath <repo>/scripts \
      -postScript kernel_rw.py

-process on cached project = warm. -import = cold, only needed once.

## COMMON ERRORS AND FIXES

| Error | Cause | Fix |
|-------|-------|-----|
| SyntaxError: unterminated string literal | editor inserted quote before 0x | use int() constants |
| SyntaxError on quote plus identifier | plus between quotes and identifier | use percent formatting |
| SyntaxError: unmatched close paren | bracket after identifier | use get() |
| PcodeOpAST has no attribute getAddress | wrong API | op.getSeqnum().getTarget() |
| seed=0 on every source | getFunctionPrototype path | hf.getLocalSymbolMap() |
| tainted=0 after seed greater than 0 | Java object identity | compare vn_key strings |
| no func for a known symbol | no function boundary | ensure_function plus DisassembleCommand |
| parsed unpacked: 0 | wrong PAC formula | KERNEL_BASE plus low32 |
| Grappa rc=-5 after patch | token array collapsed | restore 10 tokens with marker |
| SyncFailed at ATC | transient | ignore if readback succeeds |

## GRAPPA / RPPAIRING CONFIRMED WORKING

Pipeline (iOS 27, empty entitlements):
- tunnel up on 10.7.0.1:49152 via raw RPPairing
- RSD publishes around 85 services
- AFC connects, StreamingZip extracts
- ATC: Capabilities, InstalledAssets, AssetMetrics, SyncAllowed
- Grappa: 84 bytes generated from static fallback
- ReadyForSync, AssetManifest, FileComplete 3/3
- canary readback via AFC matches
- cleanup restores original Books.plist

Do NOT collapse kAuthenticGrappaTokens to NULL. Do NOT expect host-side
Grappa to work on iOS. Do NOT treat SyncFailed as fatal.

## UI / SWIFTUI iOS 27

- overlay(RespringView()) causes CA UAF and SIGSEGV. Use UIHostingController
- List with conditional Section else Section crashes
- scaleEffect inside if breaks ConditionalContent
- Published mutation from Task causes race and UAF
- RuntimeView must not show green when slide or base equal default dash
- respring button lives only in ToolsView, not AirliftView

## NEXT STEPS

1. Dump sysent[490..540] to find real NECP cluster and resolve index
   anomaly. If NECP is truly at 503/504, all earlier NECP analysis was
   done on the wrong syscalls and must be redone.
2. If confirmed at 503/504, rewrite necp.c constants and rerun.
3. Scan IOKit per-driver externalMethod dispatch tables.
4. Scan MIG Mach-routine handlers (mach_msg_trap dispatcher).
5. If all closed statically, pivot to concurrency analysis (lock/unlock
   pairs, refcount bugs, TOCTOU) — needs targeted manual review.

Do not spend more than 2-3 attempts on the same primitive.

## WHAT NOT TO DO

- Do not create fix_and_test.yml or build_and_release.yml
- Do not use hashFiles on kernelcache in cache keys
- Do not run blind syscall sweeps
- Do not call proc_info, csops, task_info sweep, mach_port_names with
  count greater than 32 (AMFI kills on ad-hoc)
- Do not use non-empty entitlements
- Do not mutate Published from Task
- Do not put RespringView in the SwiftUI tree
- Do not commit natsuk1.xcodeproj
- Do not trust offsets without Ghidra verification
- Do not answer without web search first
- Do not delete ghidra / ghidra_project / kernelcache / symbolicator
  in cleanup
- Do not collapse the Grappa token array to NULL
- Do not use plus between string literals and identifiers in Jython
- Do not use bracket access on dict or list in assignment position
- Do not put 0x literals at position 0 of a tuple
