      - name: Move legacy entry point
        run: |
          set -euo pipefail
          mkdir -p natsuk1/App
          if [ -f natsuk1/natsuk1.swift ] && [ ! -f natsuk1/App/natsuk1.swift ]; then
            git mv natsuk1/natsuk1.swift natsuk1/App/natsuk1.swift
          fi
          test -f natsuk1/App/natsuk1.swift

      - name: Verify sources
        run: |
          set -euo pipefail
          test -f natsuk1/App/natsuk1.swift
          test -f natsuk1/Resources/Info.plist
          test -f natsuk1/Resources/natsuk1.entitlements
          grep -q 'probeTimeoutMS' natsuk1/Helpers/LockdownPair.swift
          grep -q 'perHostTimeout' natsuk1/Helpers/LockdownPair.swift
          grep -q 'totalTimeout' natsuk1/Helpers/LockdownPair.swift
          grep -q 'isProtectedDataAvailable' natsuk1/Helpers/LockdownPair.swift
          grep -q 'func requestCancel' natsuk1/Helpers/LockdownPair.swift
          grep -q 'lockdownd_pair' natsuk1/Helpers/LockdownPair.swift
          grep -q 'idevice_pairing_file_serialize' natsuk1/Helpers/LockdownPair.swift
          grep -q 'func cancelMinting' natsuk1/Helpers/PairingGenerator.swift
          grep -q 'LockdownPair.cancelled' natsuk1/Helpers/AirliftBridge.swift
          grep -q 'hasLockdown' natsuk1/Helpers/AirliftBridge.swift
          grep -q 'defaultSlots' natsuk1/CarrierLab/CarrierLabBridge.swift
          grep -q 'no files in directory' natsuk1/CarrierLab/CarrierLabBridge.swift
          grep -q 'slotsWritten' natsuk1/CarrierLab/CarrierLabInstaller.swift
          grep -q 'func diagnose' natsuk1/CarrierLab/CarrierLabInstaller.swift
          grep -q 'slots' natsuk1/CarrierLab/CarrierLabState.swift
          grep -q 'Copy All' natsuk1/CarrierLab/CarrierLabView.swift
          grep -q 'logActionsSection' natsuk1/CarrierLab/CarrierLabView.swift
          grep -q 'idevice_shim.h' natsuk1/Support/bridging.h
          grep -q 'NATSUK1_IDEVICE_SHIM_H' natsuk1/Support/idevice_shim.h
          grep -q 'sdk: Network.framework' project.yml
          grep -q 'SRCROOT)/natsuk1/Support' project.yml
          grep -q 'lc++' project.yml
          grep -q 'libairlift_ffi.a' project.yml
          ! grep -q 'Task' natsuk1/Helpers/AirliftBridge.swift
          ! grep -q 'Task' natsuk1/Helpers/PairingGenerator.swift
          ! grep -q 'al_device_respring' natsuk1/Helpers/AirliftBridge.swift
          ! grep -q 'al_find_app_container' natsuk1/Helpers/AirliftBridge.swift
          ! grep -q 'lockdownd_pair_record_free' natsuk1/Helpers/PairingGenerator.swift
          ! grep -q '_silgen_name' natsuk1/Helpers/LockdownPair.swift
          ! grep -q 'natsuk1/External' project.yml

      - name: Validate project.yml
        run: |
          set -euo pipefail
          if command -v ruby >/dev/null 2>&1; then
            ruby -ryaml -e 'd=YAML.load_file("project.yml"); sdk=d["targets"]["natsuk1"]["dependencies"].map{|e| e["sdk"]}; need=%w[Foundation.framework UIKit.framework WebKit.framework AVFoundation.framework CoreLocation.framework Network.framework]; miss=need-sdk; abort("missing dependencies: "+miss.join(",")) unless miss.empty?; src=d["targets"]["natsuk1"]["sources"].map{|e| e["path"]}; abort("bad sources") unless src.include?("natsuk1/CarrierLab") && src.include?("natsuk1/App"); puts "project.yml ok: "+sdk.size.to_s+" frameworks"'
          else
            echo "ruby unavailable, skipping pre-parse"
          fi

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: bounded lockdown minting, CarrierLab slots and log actions [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          set -euo pipefail
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v48.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"