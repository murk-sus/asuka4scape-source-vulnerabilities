name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-v41-${{ hashFiles('project.yml') }}
          restore-keys: nk-v41-

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid     >/dev/null 2>&1 || brew install ldid

      - name: Fetch carrier assets
        run: |
          set -euo pipefail
          ROOT=natsuk1/Resources/CarrierAssets
          rm -rf "$ROOT"
          mkdir -p "$ROOT/CarrierLab.bundle/signatures" "$ROOT/Docomo_jp.bundle/signatures"
          BASE="https://raw.githubusercontent.com/VCTGomes/ios-carrier-bundle/cecd5594349df0bf51723a247028bad5f40a7965/carrier-bundles/27.0-24A437.V53_V54_V57OS"
          for f in \
            "CarrierLab.bundle/Info.plist" \
            "CarrierLab.bundle/carrier.plist" \
            "CarrierLab.bundle/overrides_V53_V54_V57.der.pri" \
            "CarrierLab.bundle/overrides_V53_V54_V57.plist" \
            "CarrierLab.bundle/signatures/common.plist" \
            "CarrierLab.bundle/signatures/overrides_V53_V54_V57.plist" \
            "Docomo_jp.bundle/Info.plist" \
            "Docomo_jp.bundle/carrier.plist" \
            "Docomo_jp.bundle/overrides_V53_V54_V57.der.pri" \
            "Docomo_jp.bundle/overrides_V53_V54_V57.plist" \
            "Docomo_jp.bundle/profile.mobileconfig" \
            "Docomo_jp.bundle/signatures/common.plist" \
            "Docomo_jp.bundle/signatures/overrides_V53_V54_V57.plist" ; do
            curl -fsSL "$BASE/$f" -o "$ROOT/$f"
            test -s "$ROOT/$f"
          done

      - name: Write project.yml
        run: |
          set -euo pipefail
          cat > project.yml <<'PROJECT_EOF'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false
          configs:
            Debug: debug
            Release: release
          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO
            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES
              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: NO
          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/App
                - path: natsuk1/CarrierLab
                - path: natsuk1/Exploit
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Support/bridging.h
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Resources/CarrierAssets
                  type: folder
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/Support/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/Exploit/Core $(SRCROOT)/natsuk1/Exploit/Airlift $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/Headers"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          PROJECT_EOF

      - name: Write PairingGenerator
        run: |
          set -euo pipefail
          mkdir -p natsuk1/Helpers
          cat > natsuk1/Helpers/PairingGenerator.swift <<'SWIFT_EOF'
          import Foundation

          final class PairingGenerator {
              static let shared = PairingGenerator()
              private init() {}

              enum GeneratorError: LocalizedError {
                  case lockdownFailed(String)
                  case mergeFailed(String)
                  case writeFailed(String)

                  var errorDescription: String? {
                      switch self {
                      case .lockdownFailed(let s): return "Lockdown handshake failed: \(s)"
                      case .mergeFailed(let s): return "Merge failed: \(s)"
                      case .writeFailed(let s): return "Write failed: \(s)"
                      }
                  }
              }

              func generateMergedPairing(rppPath: String, outputPath: String) throws {
                  guard let rppData = try? Data(contentsOf: URL(fileURLWithPath: rppPath)) else {
                      throw GeneratorError.lockdownFailed("cannot read RPP file")
                  }
                  guard let rpp = try? PropertyListSerialization.propertyList(
                      from: rppData, options: [], format: nil) as? [String: Any] else {
                      throw GeneratorError.lockdownFailed("RPP is not a plist")
                  }

                  var lockdownClient: OpaquePointer? = nil
                  let connectRC = lockdownd_connect_rsd(nil, &lockdownClient)
                  guard connectRC == 0, let client = lockdownClient else {
                      throw GeneratorError.lockdownFailed("lockdownd_connect_rsd rc=\(connectRC)")
                  }
                  defer { lockdownd_client_free(client) }

                  var lockdownRecord: OpaquePointer? = nil
                  let pairRC = lockdownd_pair(client, nil, &lockdownRecord)
                  guard pairRC == 0, let record = lockdownRecord else {
                      throw GeneratorError.lockdownFailed("lockdownd_pair rc=\(pairRC)")
                  }
                  defer { lockdownd_pair_record_free(record) }

                  var bytes: UnsafeMutablePointer<UInt8>? = nil
                  var length: Int = 0
                  let serRC = idevice_pairing_file_serialize(record, &bytes, &length)
                  guard serRC == 0, let b = bytes else {
                      throw GeneratorError.lockdownFailed("serialize rc=\(serRC)")
                  }
                  defer { free(bytes) }

                  let lockdownData = Data(bytes: b, count: length)
                  guard let lockdown = try? PropertyListSerialization.propertyList(
                      from: lockdownData, options: [], format: nil) as? [String: Any] else {
                      throw GeneratorError.lockdownFailed("lockdown record not a plist")
                  }

                  var merged = rpp
                  for (k, v) in lockdown { merged[k] = v }
                  if let udid = lockdown["UDID"] as? String { merged["UDID"] = udid }

                  guard let out = try? PropertyListSerialization.data(
                      fromPropertyList: merged, format: .xml, options: 0) else {
                      throw GeneratorError.mergeFailed("serialize")
                  }
                  do {
                      try out.write(to: URL(fileURLWithPath: outputPath), options: .atomic)
                  } catch {
                      throw GeneratorError.writeFailed(error.localizedDescription)
                  }
              }
          }
          SWIFT_EOF

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: PairingGenerator without Sendable annotation [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          set -euo pipefail
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          grep -q 'CarrierAssets' project.yml
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"