          import SwiftUI
          import UIKit

          struct DeviceInfoView: View {
              var body: some View {
                  List {
                      Section {
                          row("Model", DeviceName.friendly())
                          row("Identifier", machineID())
                          row("Chip", DeviceName.chip())
                      } header: { Label("Hardware", systemImage: "cpu") }

                      Section {
                          row("iOS", sysctlString("kern.osproductversion"))
                          row("Build", sysctlString("kern.osversion"))
                          row("Architecture", arch())
                      } header: { Label("Software", systemImage: "gear") }

                      Section {
                          row("RAM", ram())
                          row("Uptime", uptime())
                      } header: { Label("Resources", systemImage: "memorychip") }

                      Section {
                          row("Locale", localeShort())
                          row("Region", regionShort())
                      } header: { Label("Locale", systemImage: "globe") }
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Device")
                  .navigationBarTitleDisplayMode(.inline)
              }

              private func row(_ key: String, _ value: String) -> some View {
                  HStack {
                      Text(key)
                      Spacer()
                      Text(value).font(.system(.body, design: .monospaced)).foregroundStyle(.secondary)
                          .lineLimit(1).truncationMode(.middle)
                  }
              }
              private func machineID() -> String {
                  var sysinfo = utsname(); uname(&sysinfo)
                  return Mirror(reflecting: sysinfo.machine).children.reduce("") { id, el in
                      guard let v = el.value as? Int8, v != 0 else { return id }
                      return id + String(UnicodeScalar(UInt8(v)))
                  }
              }
              private func sysctlString(_ name: String) -> String {
                  var size = 0; sysctlbyname(name, nil, &size, nil, 0)
                  var buf = [CChar](repeating: 0, count: size)
                  sysctlbyname(name, &buf, &size, nil, 0)
                  let bytes = buf.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }
                  return String(decoding: bytes, as: UTF8.self)
              }
              private func ram() -> String {
                  var size: UInt64 = 0; var len = MemoryLayout<UInt64>.size
                  if sysctlbyname("hw.memsize", &size, &len, nil, 0) != 0 { return "unknown" }
                  return ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .memory)
              }
              private func arch() -> String {
                  #if arch(arm64)
                  return "arm64"
                  #else
                  return "unknown"
                  #endif
              }
              private func localeShort() -> String {
                  Locale.current.identifier.split(separator: "_").first.map(String.init)?.uppercased() ?? "—"
              }
              private func regionShort() -> String {
                  let region = Locale.current.region?.identifier ?? ""
                  return region.isEmpty ? "—" : region.uppercased()
              }
              private func uptime() -> String {
                  let t = ProcessInfo.processInfo.systemUptime
                  return "\(Int(t) / 3600)h \((Int(t) % 3600) / 60)m"
              }
          }
          EOF

      - name: Write PathAccessView.swift
        run: |
          cat > natsuk1/Views/PathAccessView.swift <<'EOF'
          import SwiftUI
          import UIKit
          import Darwin

          struct PathAccessView: View {
              struct PathResult: Identifiable {
                  let id = UUID()
                  let path: String
                  let exists: Bool
                  let isDirectory: Bool
                  let readable: Bool
                  let writable: Bool
                  let size: Int64?
              }

              @State private var results: [PathResult] = []
              @State private var busy = false

              private let paths: [String] = [
                  "/usr/lib/libMobileGestalt.dylib",
                  "/usr/lib/libMobileActivation.dylib",
                  "/usr/lib/libmis.dylib",
                  "/usr/lib/libsandbox.1.dylib",
                  "/var/mobile/Library/Preferences/com.apple.MobileGestalt.plist",
                  "/var/mobile/Library/Preferences/.GlobalPreferences.plist",
                  "/var/mobile/Library/Preferences/com.apple.springboard.plist",
                  "/var/mobile/Library/Caches",
                  "/var/mobile/Library",
                  "/var/mobile/Containers/Data/Application",
                  "/var/containers/Bundle/Application",
                  NSHomeDirectory(),
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].path,
                  FileManager.default.urls(for: .libraryDirectory, in: .userDomainMask)[0].path,
                  NSTemporaryDirectory(),
              ]

              var body: some View {
                  List {
                      Section {
                          HStack { Text("Paths"); Spacer(); Text("\(results.filter { $0.exists }.count)/\(results.count)").font(.system(.body, design: .monospaced)).foregroundStyle(.secondary) }
                          HStack { Text("Readable"); Spacer(); Text("\(results.filter { $0.readable }.count)").font(.system(.body, design: .monospaced)).foregroundStyle(.secondary) }
                          HStack { Text("Writable"); Spacer(); Text("\(results.filter { $0.writable }.count)").font(.system(.body, design: .monospaced)).foregroundStyle(.secondary) }
                          Button { scan() } label: {
                              HStack {
                                  Text(busy ? "Scanning..." : "Run Scan")
                                  Spacer()
                                  ProgressView().opacity(busy ? 1 : 0)
                              }
                          }.disabled(busy)
                      } header: {
                          Label("Summary", systemImage: "chart.bar")
                      }

                      Section {
                          ForEach(results) { r in
                              VStack(alignment: .leading, spacing: 4) {
                                  Text(r.path).font(.system(size: 11, design: .monospaced))
                                      .foregroundStyle(r.exists ? .primary : .secondary).lineLimit(2)
                                  HStack(spacing: 6) {
                                      badge(r.exists ? "exists" : "missing", color: r.exists ? .green : .red)
                                      if r.isDirectory { badge("dir", color: .blue) }
                                      if r.readable { badge("r", color: .green) }
                                      if r.writable { badge("w", color: .orange) }
                                      if let s = r.size { badge("\(s)B", color: .gray) }
                                  }
                              }
                          }
                      } header: {
                          Label("Paths", systemImage: "folder")
                      }
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Path Access")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { if results.isEmpty { scan() } }
              }

              private func badge(_ text: String, color: Color) -> some View {
                  Text(text).font(.system(size: 9, design: .monospaced))
                      .padding(.horizontal, 4).padding(.vertical, 1)
                      .background(color.opacity(0.18), in: RoundedRectangle(cornerRadius: 3))
                      .foregroundStyle(color)
              }

              private func scan() {
                  busy = true
                  let pathList = paths
                  DispatchQueue.global(qos: .userInitiated).async {
                      let fm = FileManager.default
                      var outPaths: [PathResult] = []
                      for p in pathList {
                          var isDir: ObjCBool = false
                          let exists = fm.fileExists(atPath: p, isDirectory: &isDir)
                          let readable = fm.isReadableFile(atPath: p)
                          let writable = fm.isWritableFile(atPath: p)
                          var size: Int64? = nil
                          if exists, !isDir.boolValue,
                             let attrs = try? fm.attributesOfItem(atPath: p),
                             let n = attrs[.size] as? NSNumber { size = n.int64Value }
                          outPaths.append(PathResult(path: p, exists: exists, isDirectory: isDir.boolValue,
                                                     readable: readable, writable: writable, size: size))
                      }
                      DispatchQueue.main.async {
                          self.results = outPaths; self.busy = false
                      }
                  }
              }
          }
          EOF

