          grep -q 'SRCROOT)/natsuk1/Exploit/Airlift' project.yml
          grep -q 'natsuk1/Support/bridging.h' project.yml
          grep -q 'natsuk1/CarrierLab' project.yml
          ! grep -q 'show_respring' natsuk1/App/natsuk1.swift
