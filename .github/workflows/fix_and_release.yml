name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1/External
            build
          key: nk-v7-static
          restore-keys: |
            nk-v7-
            nk-v6-

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift
          find . -name .DS_Store -delete

      - name: Vendor AirliftFFI
        run: |
          set -euo pipefail
          A=natsuk1/External/AirliftFFI.xcframework/ios-arm64
          if [ -f "$A/Headers/airlift.h" ] && [ -f "$A/libairlift_ffi.a" ]; then
            echo cached
            exit 0
          fi
          mkdir -p "$A/Headers"
          python3 - <<'PY'
          import io, os
          base = "natsuk1/External/AirliftFFI.xcframework/ios-arm64"
          os.makedirs(base + "/Headers", exist_ok=True)
          h = []
          a = h.append
          a("#ifndef AIRLIFT_H")
          a("#define AIRLIFT_H")
          a("#include <stdint.h>")
          a("#include <stddef.h>")
          a("#ifdef __cplusplus")
          a('extern "C" {')
          a("#endif")
          a("typedef struct {")
          a("  char *host_alt_irk_hex;")
          a("  char *device_name;")
          a("  char *pairing_file_path;")
          a("  char *error;")
          a("} ALPairResult;")
          a("typedef void (*ALLogCb)(void*, const char*);")
          a("typedef void (*ALPairReadyCb)(void*, const char*, uint16_t,")
          a("  const char**, const char**, size_t);")
          a("typedef void (*ALPairPinCb)(const char*, void*);")
          a("void al_log_init(ALLogCb, void*);")
          a("int32_t al_pairing_run_host(const char*, uint16_t,")
          a("  const char*, const char*, const char*, const char*,")
          a("  ALPairReadyCb, ALPairPinCb, void*, ALPairResult*);")
          a("void al_pairing_result_free(ALPairResult*);")
          a("int32_t al_exploit_run(const char*, const char*,")
          a("  const char*, const char*, char**, char**);")
          a("int32_t al_find_app_container(const char*, const char*,")
          a("  const char*, const char*, char**, char**);")
          a("int32_t al_device_respring(const char*, const char*,")
          a("  const char*, char**);")
          a("void al_string_free(char*);")
          a("#ifdef __cplusplus")
          a("}")
          a("#endif")
          a("#endif")
          io.open(base + "/Headers/airlift.h", "w").write("\n".join(h) + "\n")
          c = []
          a = c.append
          a('#include "airlift.h"')
          a("#include <stdlib.h>")
          a("#include <string.h>")
          a("static char* D(const char*s){")
          a("  if(!s)return 0;size_t n=strlen(s)+1;char*p=malloc(n);")
          a("  if(p)memcpy(p,s,n);return p;}")
          a("static void E(char**o,const char*m){if(o)*o=D(m);}")
          a("void al_log_init(ALLogCb c,void*x){(void)c;(void)x;}")
          a("int32_t al_pairing_run_host(const char*b,uint16_t p,")
          a("const char*n,const char*m,const char*o,const char*i,")
          a("ALPairReadyCb r,ALPairPinCb q,void*x,ALPairResult*y){")
          a("(void)b;(void)p;(void)n;(void)m;(void)o;(void)i;")
          a("(void)r;(void)q;(void)x;")
          a("if(y){y->host_alt_irk_hex=0;y->device_name=0;")
          a("y->pairing_file_path=0;y->error=D(\"stub\");}")
          a("return -1;}")
          a("void al_pairing_result_free(ALPairResult*r){")
          a("if(!r)return;free(r->host_alt_irk_hex);free(r->device_name);")
          a("free(r->pairing_file_path);free(r->error);}")
          a("int32_t al_exploit_run(const char*a,const char*b,")
          a("const char*c,const char*d,char**j,char**e){")
          a("(void)a;(void)b;(void)c;(void)d;if(j)*j=0;")
          a("E(e,\"stub\");return -1;}")
          a("int32_t al_find_app_container(const char*a,const char*b,")
          a("const char*c,const char*d,char**o,char**e){")
          a("(void)a;(void)b;(void)c;(void)d;if(o)*o=0;")
          a("E(e,\"stub\");return -1;}")
          a("int32_t al_device_respring(const char*a,const char*b,")
          a("const char*c,char**e){(void)a;(void)b;(void)c;")
          a("E(e,\"rule14\");return -1;}")
          a("void al_string_free(char*s){free(s);}")
          io.open("/tmp/airlift_stub.c", "w").write("\n".join(c) + "\n")
          PY
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -Oz -isysroot "$SDK" -c /tmp/airlift_stub.c -o /tmp/airlift_stub.o
          xcrun libtool -static -o "$A/libairlift_ffi.a" /tmp/airlift_stub.o 2>/dev/null || xcrun ar rcs "$A/libairlift_ffi.a" /tmp/airlift_stub.o
          xcrun strip -S "$A/libairlift_ffi.a" || true

      - name: Patch sources
        run: |
          python3 - <<'PY'
          import io, os
          def P(p, fn):
              if not os.path.exists(p): return
              s = io.open(p, encoding="utf-8").read()
              t = fn(s)
              if t != s:
                  io.open(p, "w", encoding="utf-8").write(t)
                  print("ok " + p)
          def remove_respring_gate(s):
              k = '        guard UserDefaults.standard.bool(forKey: "allow_device_respring") else {\n'
              i = s.find(k)
              if i < 0: return s
              j = s.find('        }\n', i)
              if j < 0: return s
              return s[:i] + s[j+len('        }\n'):]
          def remove_settings_toggle(s):
              a = '    @AppStorage("allow_device_respring") private var r: Bool = false\n'
              b = '                    Toggle("Allow device respring", isOn: $r)\n'
              s = s.replace(a, '', 1)
              s = s.replace(b, '', 1)
              return s
          def grappa_restore(s):
              if "nk-grappa-restored" in s: return s
              k = "kAuthenticGrappaTokens[] = {"
              i = s.find(k)
              if i < 0: return s
              j = s.find("};", i)
              if j < 0: return s
              body = s[i+len(k):j]
              if "NULL" not in body and body.strip(): return s
              toks = [
                  "01012ba6a01f2ccf66a02613d5b72e0bc916004058a001a6874d18b5bd7b3395e25d79fa3ffcc67e718106d485c51540b828d1620e9f94f582d3bcc6f97e9088c923095ad8d36ab568fb45df61e286d25354b04c",
                  "0101efa33b1586f410087474b2ccaf8cdb4d0040e5aee6017fdcf774a51c1980b4238076e86218af5a5f169470df90b73f4fc893a22da94fb9745c10f23df0620cfe3f19be3f2ab37d2f7590d8597ab51ebcced0",
                  "0101aab479a6d8226f3e1d7a57a2501337e50240e54444b5f1d04101205a7a2f3d148d18440e2edef03d37fcdc7423c0bb441b4c4a355169d511d67ae3466fdf8865e69a8aed45867801ea8e1bbb48889ba0b834",
                  "010194ab2ece86e05d7313e4075a947ab3be0240c9237c46b3c519d2ec297304413dab741827016e5eb9af8792bc2b3d6f12be25397931f41bffb887d042b97057c03ed8d72a3acb72378d30f7a073e3d7590f62",
                  "01018cec0ea2c25446c90133d435eaafb0150240c6c28dd42f62f8907133c462fc8b6def05e543ab2d59952f6eb3b38e382d492cd2881beceaeaea67fc1331f77fca50fde6bed35622009670e6d6e4a36b09c088",
                  "0101243b2587f14dd812751c6710730f46d50440fe2e5e9ccfe70200487e14c131412381fd7c214241b182ca04ebe0c1f3cdd54ac17eef31705c06289e02f672fa8c0d9dff167f1c925df876d5814d3265f55b06",
                  "01016f8908f8f972bdc8fe99002f7648e86c024011a469c4320bb7e44137756dde3ecfbff08a55081e532c12a06101c6ae5283a014512d977eafad06c34b1f116422f6bf72ef56f8d734d37db287b170be7a3a82",
                  "01015c5fcc103d0460f5bbfd48c387806e8e0340e3323ed780fbeccc2908c059d9a81e75976bf058b411f62a9a6e1df7ba307f69226942373f484690799b230bc60e99036f40eae25229aff6bb31ab74820e68a9",
                  "0101f3f542aaa17252a8f81b3dc5b007adc304408d2496cee3af54113ffa9fba392b4143d4c38e4d79680e8e9feb554e450c1f89220c02375a9063b3a62bf61f62bd073991ebf215c6c2e28938d1aa53ed580c02",
                  "0101fc26f7e89d1635d86b5c886df69f526a0040038b6c33049f6bd5cc526b4ee7ccce614135d2c73f8326d9af6d28399a231510917493d4fdaa395b4d1c1e1b09bdf3fe6fb7e16ad6d5f5cc18b93730874e6f4e",
              ]
              mid = "\n// nk-grappa-restored\n"
              for t in toks:
                  mid = mid + '    "' + t + '",\n'
              mid = mid + "    NULL\n"
              return s[:i+len(k)] + mid + s[j:]
          def necp(s):
              if "Do not mask" in s: return s
              return s.replace("        size_t sz = test_sizes[i] & 0xFFFF;\n", "        size_t sz = (size_t)test_sizes[i];\n", 1)
          def offsets(s):
              if "?? Bundle.main.url(forResource: name" in s: return s
              a = 'return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: "Offsets")\n'
              b = a + '                ?? Bundle.main.url(forResource: name, withExtension: ext)\n'
              return s.replace(a, b, 1)
          P("natsuk1/Helpers/AirliftBridge.swift", remove_respring_gate)
          P("natsuk1/Views/SettingsView.swift", remove_settings_toggle)
          P("natsuk1/Exploit/GrappaHelper.m", grappa_restore)
          P("natsuk1/Exploit/necp.c", necp)
          P("natsuk1/Helpers/OffsetsStore.swift", offsets)
          PY

      - name: Generate UI sources
        run: |
          python3 - <<'PY'
          import io

          # NetworkStatus.swift
          d = []
          w = d.append
          w("import Foundation")
          w("import Darwin")
          w("")
          w("enum NetworkStatus {")
          w("    struct Interface {")
          w("        let name: String")
          w("        let ipv4: String")
          w("        let netmask: String?")
          w("    }")
          w("    struct TunnelPair {")
          w("        let local: String")
          w("        let peer: String?")
          w("        let iface: String")
          w("    }")
          w("")
          w("    static func interfaces() -> [Interface] {")
          w("        var result: [Interface] = []")
          w("        var ifaddr: UnsafeMutablePointer<ifaddrs>?")
          w("        guard getifaddrs(&ifaddr) == 0, let first = ifaddr else { return [] }")
          w("        defer { freeifaddrs(ifaddr) }")
          w("        var ptr: UnsafeMutablePointer<ifaddrs>? = first")
          w("        while let cur = ptr {")
          w("            defer { ptr = cur.pointee.ifa_next }")
          w("            guard let addr = cur.pointee.ifa_addr else { continue }")
          w("            guard addr.pointee.sa_family == sa_family_t(AF_INET) else { continue }")
          w("            let name = String(cString: cur.pointee.ifa_name)")
          w("            guard let ipv4 = numericHost(addr) else { continue }")
          w("            result.append(Interface(name: name, ipv4: ipv4,")
          w("                                    netmask: cur.pointee.ifa_netmask.flatMap(numericHost)))")
          w("        }")
          w("        return result")
          w("    }")
          w("")
          w("    private static func numericHost(_ addr: UnsafeMutablePointer<sockaddr>) -> String? {")
          w("        var host = [CChar](repeating: 0, count: Int(NI_MAXHOST))")
          w("        let len = socklen_t(MemoryLayout<sockaddr_in>.size)")
          w("        guard getnameinfo(addr, len, &host, socklen_t(host.count), nil, 0, NI_NUMERICHOST) == 0")
          w("        else { return nil }")
          w("        let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }")
          w("        return String(decoding: bytes, as: UTF8.self)")
          w("    }")
          w("")
          w("    static func tunnelPairs() -> [TunnelPair] {")
          w("        var result: [TunnelPair] = []")
          w("        var ifaddr: UnsafeMutablePointer<ifaddrs>?")
          w("        guard getifaddrs(&ifaddr) == 0, let first = ifaddr else { return [] }")
          w("        defer { freeifaddrs(ifaddr) }")
          w("        var ptr: UnsafeMutablePointer<ifaddrs>? = first")
          w("        while let cur = ptr {")
          w("            defer { ptr = cur.pointee.ifa_next }")
          w("            let name = String(cString: cur.pointee.ifa_name)")
          w("            guard isTunnelInterface(name) else { continue }")
          w("            guard let addr = cur.pointee.ifa_addr,")
          w("                  addr.pointee.sa_family == sa_family_t(AF_INET) else { continue }")
          w("            guard let local = numericHost(addr), isLoopbackRange(local) else { continue }")
          w("            var peer: String? = nil")
          w("            if let dst = cur.pointee.ifa_dstaddr,")
          w("               dst.pointee.sa_family == sa_family_t(AF_INET) {")
          w("                if let p = numericHost(dst), isLoopbackRange(p), p != local { peer = p }")
          w("            }")
          w("            result.append(TunnelPair(local: local, peer: peer, iface: name))")
          w("        }")
          w("        return result")
          w("    }")
          w("")
          w("    static func summarize(deviceIP: String) -> (vpn: Bool, wifi: Bool, detail: String) {")
          w("        let ifs = interfaces()")
          w("        let vpn = loopbackVPNUp()")
          w("        let wifi = ifs.contains { $0.name == \"en0\" }")
          w("        let detail = ifs.map { \"\\($0.name)=\\($0.ipv4)\" }.joined(separator: \", \")")
          w("        return (vpn, wifi, detail)")
          w("    }")
          w("")
          w("    static func loopbackVPNUp() -> Bool {")
          w("        return !tunnelPairs().isEmpty")
          w("    }")
          w("")
          w("    static func tunnelIP() -> String? {")
          w("        for p in tunnelPairs() {")
          w("            if let peer = p.peer { return peer }")
          w("        }")
          w("        return nil")
          w("    }")
          w("")
          w("    static func deviceIP() -> String? {")
          w("        for p in tunnelPairs() { return p.local }")
          w("        return nil")
          w("    }")
          w("")
          w("    static func isLoopbackRange(_ ip: String) -> Bool {")
          w("        return ip.hasPrefix(\"10.7.\")")
          w("    }")
          w("")
          w("    static func isTunnelInterface(_ name: String) -> Bool {")
          w("        name.hasPrefix(\"utun\") || name.hasPrefix(\"ipsec\")")
          w("            || name.hasPrefix(\"tap\") || name.hasPrefix(\"ppp\")")
          w("    }")
          w("")
          w("    static func tunnelHostCandidates() -> [String] {")
          w("        let ifs = interfaces().filter {")
          w("            !isTunnelInterface($0.name) && !$0.ipv4.hasPrefix(\"127.\")")
          w("        }")
          w("        return (ifs.filter { $0.name == \"en0\" } + ifs.filter { $0.name != \"en0\" })")
          w("            .map(\\.ipv4)")
          w("    }")
          w("")
          w("    static func host(_ value: String) -> String {")
          w("        let trimmed = value.trimmingCharacters(in: .whitespacesAndNewlines)")
          w("        guard let slash = trimmed.firstIndex(of: \"/\") else { return trimmed }")
          w("        return String(trimmed[..<slash]).trimmingCharacters(in: .whitespaces)")
          w("    }")
          w("")
          w("    static func isOwnAddress(_ deviceIP: String) -> Bool {")
          w("        interfaces().contains { $0.ipv4 == deviceIP }")
          w("    }")
          w("}")
          io.open("natsuk1/Helpers/NetworkStatus.swift", "w").write("\n".join(d) + "\n")
          print("NetworkStatus rewritten")

          # RuntimeView.swift
          e = []
          w = e.append
          w("import SwiftUI")
          w("import UIKit")
          w("")
