      - name: Validate
        run: |
          set +e
          FAIL=0
          chk() {
            if eval "$2" >/dev/null 2>&1; then echo "  OK   $1"; else echo "  FAIL $1"; FAIL=1; fi
          }
          chk "nk_offsets.h"                      "test -s natsuk1/Exploit/nk_offsets.h"
          chk "necp.c"                            "test -s natsuk1/Exploit/necp.c"
          chk "natsuk1.swift"                     "test -s natsuk1/natsuk1.swift"
          chk "ContentView.swift"                 "test -s natsuk1/Views/ContentView.swift"
          chk "OverviewView.swift"                "test -s natsuk1/Views/OverviewView.swift"
          chk "RuntimeView.swift"                 "test -s natsuk1/Views/RuntimeView.swift"
          chk "AirliftView.swift"                 "test -s natsuk1/Views/AirliftView.swift"
          chk "SettingsView.swift"                "test -s natsuk1/Views/SettingsView.swift"
          chk "ToolsView.swift"                   "test -s natsuk1/Views/ToolsView.swift"
          chk "AboutView.swift"                   "test -s natsuk1/Views/AboutView.swift"
          chk "DeviceInfoView.swift"              "test -s natsuk1/Views/DeviceInfoView.swift"
          chk "PathAccessView.swift"              "test -s natsuk1/Views/PathAccessView.swift"
          chk "offsets json"                      "test -s natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json"
          chk "no scaleEffect"                    "! grep -rq -e 'scaleEffect' natsuk1/"
          chk "no NotSupportedView"               "! grep -q -e 'NotSupportedView' natsuk1/natsuk1.swift"
          chk "no RespringView in ContentView"    "! grep -q -e 'RespringView' natsuk1/Views/ContentView.swift"
          chk "Timer flusher (not Task)"          "grep -q -e 'Timer.scheduledTimer' natsuk1/natsuk1.swift"
          chk "no Task flusher"                   "! grep -q -e 'startFlusher.*Task' natsuk1/natsuk1.swift"
          chk "AppState @MainActor"               "grep -q -e '@MainActor' natsuk1/natsuk1.swift"
          chk "build_and_release removed"         "! test -f .github/workflows/build_and_release.yml"
          python3 -c "import json; json.load(open('natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json'))" || FAIL=1
          echo "  OK   json valid"
          if [ "$FAIL" -ne 0 ]; then echo "VERIFY FAILED"; exit 1; fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          ALTSTORE_URL="altstore://install?url=${IPA_URL}"
          SCARLET_URL="scarlet://install?url=${IPA_URL}"
          ESIGN_URL="esign://install?url=${IPA_URL}"
          NOTES="$(cat <<EOF
          ### natsuk1 — iOS 27.0 (24A437)

          v4.4 — MainActor-isolated AppState, Timer-based flusher, no @Published mutations off main thread.

          **IPA** \`${IPA_URL}\`

          AltStore: \`${ALTSTORE_URL}\`
          Scarlet:  \`${SCARLET_URL}\`
          ESign:    \`${ESIGN_URL}\`

          $(git log -5 --pretty=format:'- %h %s')
          EOF
          )"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "v4.4: MainActor AppState, Timer flusher, NonisolatedNonsending off [skip ci]"
          git push