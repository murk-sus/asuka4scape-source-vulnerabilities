name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-v7-${{ hashFiles('project.yml') }}
          restore-keys: |
            nk-v7-

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid     >/dev/null 2>&1 || brew install ldid

      - name: Cleanup
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f natsuk1/Helpers/CrashLog.swift

          sed -i '' '/CrashLog/d' natsuk1/App/natsuk1.swift
          sed -i '' 's/_ = nk_full_exploit()/let rc = nk_full_exploit()/' natsuk1/App/natsuk1.swift
          sed -i '' 's/AppState\.shared\.status = \.ok/AppState.shared.status = (rc == 0) ? .ok : .failed/' natsuk1/App/natsuk1.swift

          perl -0777 -i -pe 's/\n    func necp_run\(\) \{.*?\n    \}\n/\n/gs' natsuk1/App/natsuk1.swift

          sed -i '' 's/state\.necp_run()/state.run()/' natsuk1/Views/OverviewView.swift

          if [ -f docs/ai-hints.md ] && ! grep -q '## CURRENT STATUS' docs/ai-hints.md; then
            printf '\n## CURRENT STATUS\n\n' >> docs/ai-hints.md
            printf 'Build iPhone14,5 / iOS 27.0 / 24A437.\n\n' >> docs/ai-hints.md
            printf -- '- No kernel R/W primitive found on this build.\n' >> docs/ai-hints.md
            printf -- '- NECP closed at depth-0 sinks, code removed from repo.\n' >> docs/ai-hints.md
            printf -- '- Airlift works via static Grappa token fallback.\n' >> docs/ai-hints.md
            printf -- '- Offsets shipped with verified false, do not trust.\n' >> docs/ai-hints.md
            printf -- '- IOKit not probed beyond shallow externalMethod dispatch.\n' >> docs/ai-hints.md
            printf -- '- BSD syscalls 557 of 558 unpacked, shallow paths bounded.\n' >> docs/ai-hints.md
          fi

          if [ -f docs/ai-hints.md ] && ! grep -q '## AIRLIFTVIEW KEEP' docs/ai-hints.md; then
            printf '\n## AIRLIFTVIEW KEEP\n\n' >> docs/ai-hints.md
            printf -- '- Keep if let pin = airlift.pairPIN, Text reads pin.\n' >> docs/ai-hints.md
            printf -- '- Do not rewrite to if airlift.pairPIN != nil.\n' >> docs/ai-hints.md
          fi

          if [ -f docs/ai-hints.md ] && ! grep -q '## CI IDEMPOTENCE' docs/ai-hints.md; then
            printf '\n## CI IDEMPOTENCE\n\n' >> docs/ai-hints.md
            printf -- '- Every cleanup mutation must be idempotent.\n' >> docs/ai-hints.md
            printf -- '- Commit only if git diff --cached is non-empty.\n' >> docs/ai-hints.md
            printf -- '- Use skip ci in every commit message from CI.\n' >> docs/ai-hints.md
            printf -- '- Cache key must change when project.yml changes.\n' >> docs/ai-hints.md
            printf -- '- rm -rf natsuk1.xcodeproj before xcodegen generate.\n' >> docs/ai-hints.md
          fi

          grep -q '.swiftpm/' .gitignore 2>/dev/null || printf '\n# Swift\n*.xcworkspace\n.swiftpm/\n.build/\nPackage.resolved\n\n# Debug\n*.dSYM\n' >> .gitignore

          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: remove CrashLog, fail state, update hints [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' \
                       -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) \
                -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 \
            && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"