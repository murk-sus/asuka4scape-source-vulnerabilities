          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f docs/ai-hints.md ] && ! grep -q '## USER RULES 2026-09' docs/ai-hints.md; then
            printf '\n## USER RULES 2026-09\n\n' >> docs/ai-hints.md
            printf -- '- All code, strings, comments in English only.\n' >> docs/ai-hints.md
            printf -- '- Match existing style: @unchecked Sendable, DispatchQueue.main.async, no @MainActor.\n' >> docs/ai-hints.md
            printf -- '- Never use Task or Task.detached in views or state classes.\n' >> docs/ai-hints.md
            printf -- '- Never mutate @Published from background. Guard with Thread.isMainThread in setters.\n' >> docs/ai-hints.md
            printf -- '- Pairing is done exclusively in Tools -> Airlift. CarrierLab reads the pairing file, never writes it.\n' >> docs/ai-hints.md
            printf -- '- Do not call PairingController.runPairing or deletePairing from any view except AirliftView.\n' >> docs/ai-hints.md
            printf -- '- Do not touch AirliftBridge.swift or PairingController.swift without explicit request.\n' >> docs/ai-hints.md
            printf -- '- No "type INSTALL" confirmations. Buttons act immediately.\n' >> docs/ai-hints.md
            printf -- '- CarrierLab probe distinguishes: no VPN / no pairing / invalid pairing / FFI error.\n' >> docs/ai-hints.md
            printf -- '- Status refresh in view uses Timer.publish on main, no manual navigation.\n' >> docs/ai-hints.md
            printf -- '- Read this file before every workflow change. Remove dead steps on every run.\n' >> docs/ai-hints.md
            printf -- '- project.yml always written in full via cat heredoc, never patched with sed/perl.\n' >> docs/ai-hints.md
          fi

          if [ -f docs/ai-hints.md ] && ! grep -q '## CARRIERLAB' docs/ai-hints.md; then
            printf '\n## CARRIERLAB\n\n' >> docs/ai-hints.md
            printf 'iOS port of MTS_CARRIER_FORUM core logic.\n\n' >> docs/ai-hints.md
            printf -- '- CarrierAssets bundled under Resources/CarrierAssets.\n' >> docs/ai-hints.md
            printf -- '- check is non-blocking, dispatches to global queue, updates state via main.async.\n' >> docs/ai-hints.md
            printf -- '- install writes CarrierLab.bundle to BundleLinks and Docomo_jp.bundle to carrier root.\n' >> docs/ai-hints.md
            printf -- '- reload re-writes Docomo_jp.bundle only.\n' >> docs/ai-hints.md
            printf -- '- reset clears session, does not revert the phone.\n' >> docs/ai-hints.md
            printf -- '- view auto-refreshes every 2.5 s via Timer.publish, no need to leave menu.\n' >> docs/ai-hints.md
            printf -- '- pairing hint section appears when airliftOK is false, directs to Tools -> Airlift.\n' >> docs/ai-hints.md
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: pairing only in Airlift tab, CarrierLab shows hint [skip ci]"
            git push
          fi

      - name: Verify resources
        run: |
          set -e
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          grep -q 'CarrierAssets' project.yml

      - name: Generate project
        run: |
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Verify bundle contents
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          ls -la "$APP/CarrierAssets/CarrierLab.bundle"
          ls -la "$APP/CarrierAssets/Docomo_jp.bundle"

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' \
                       -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) \
                -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 \
            && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"