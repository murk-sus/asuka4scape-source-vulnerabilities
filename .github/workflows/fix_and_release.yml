name: Pairing Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "release tag, e.g. v1.0.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
         fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
         xcode-version: "26.5"

      - name: Install tools
        run: |
         set -e
         command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
         command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Drop stale workflow
        run: |
         set -euo pipefail
         STALE=.github/workflows/fix_and_release.yml
         if [ ! -f "$STALE" ]; then echo "no stale workflow"; exit 0; fi
         git rm -q "$STALE"
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git commit -q -m "chore: drop superseded workflow"
         git push || true
         echo "removed $STALE"

      - name: Write PairingGenerator.swift
        run: |
         set -euo pipefail
         cat > natsuk1/Helpers/PairingGenerator.swift <<'PAIRINGGEN_EOF'
         import Foundation

         final class PairingGenerator {
             static let shared = PairingGenerator()
             private init() {}

             private let hostName = "natsuk1"

             enum GeneratorError: LocalizedError {
                 case missingFile(String)
                 case notAPlist(String)
                 case noRemotePairing
                 case cancelled
                 case lockdownUnavailable(String)
                 case mergeFailed(String)
                 case writeFailed(String)

                 var errorDescription: String? {
                     switch self {
                     case let .missingFile(s):
                         return "Pairing file missing: \(s)"
                     case let .notAPlist(s):
                         return "Pairing file is not a plist: \(s)"
                     case .noRemotePairing:
                         return "The pairing record has no public_key / private_key / identifier, "
                             + "so it is not an RPPairing record. Pair again from the Airlift screen."
                     case .cancelled:
                         return "Cancelled."
                     case let .lockdownUnavailable(reason):
                         return "The classic lockdown half was not issued, so the file still lacks "
                             + "DeviceCertificate and Airlift's Lockdown fallback will fail. \(reason)"
                     case let .mergeFailed(reason):
                         return "The two pairing records could not be merged: \(reason)"
                     case let .writeFailed(reason):
                         return "Write failed: \(reason)"
                     }
                 }
             }

             private func status(_ text: String) {
                 PairingController.shared.pairingStatus = text
             }

             @discardableResult
             func generateMergedPairing(rppPath: String, outputPath: String) throws -> String {
                 LockdownPair.resetCancel()

                 let fm = FileManager.default
                 guard fm.fileExists(atPath: rppPath) else {
                     throw GeneratorError.missingFile(rppPath)
                 }
                 guard let rpp = try? Data(contentsOf: URL(fileURLWithPath: rppPath)), !rpp.isEmpty else {
                     throw GeneratorError.missingFile("empty or unreadable: \(rppPath)")
                 }
                 guard let plist = try? PropertyListSerialization.propertyList(
                     from: rpp, options: [], format: nil) as? [String: Any], !plist.isEmpty else {
                     throw GeneratorError.notAPlist(rppPath)
                 }

                 let kind = PairingFileKind.of(data: rpp)

                 if kind.hasLockdown {
                     status("Pairing file already carries a lockdown record.")
                     return try write(merged: rpp, outputPath: outputPath, sourcePath: rppPath)
                 }
                 guard kind.hasRemotePairing else {
                     throw GeneratorError.noRemotePairing
                 }

                 var lockdownRecord = CompositePairingFile.cachedLockdownRecord(forUDID: kind.udid)
                 var mintFailure: String?

                 if lockdownRecord == nil {
                     status("Minting lockdown record...")
                     do {
                         let record = try LockdownPair.mintRecord(
                             hosts: LockdownPair.candidateHosts(),
                             hostID: CompositePairingFile.hostID,
                             systemBUID: CompositePairingFile.systemBUID,
                             hostName: hostName)
                         CompositePairingFile.storeLockdownRecord(record, forUDID: kind.udid)
                         lockdownRecord = record
                         status("Lockdown record minted (\(record.count) bytes).")
                     } catch {
                         if LockdownPair.cancelled {
                             throw GeneratorError.cancelled
                         }
                         mintFailure = (error as? LocalizedError)?.errorDescription
                             ?? String(describing: error)
                     }
                 } else {
                     status("Reusing the stored lockdown record.")
                 }

                 let merged: Data
                 if let lockdownRecord {
                     do {
                         merged = try CompositePairingFile.merge(
                             lockdown: lockdownRecord, rpPairing: rpp, udid: kind.udid)
                     } catch {
                         throw GeneratorError.mergeFailed(
                             (error as? LocalizedError)?.errorDescription ?? String(describing: error))
                     }
                 } else {
                     merged = rpp
                 }

                 let canonical = try write(merged: merged, outputPath: outputPath, sourcePath: rppPath)

                 if let mintFailure {
                     throw GeneratorError.lockdownUnavailable(mintFailure)
                 }
                 return canonical
             }

             private func write(merged: Data, outputPath: String, sourcePath: String) throws -> String {
                 if outputPath != sourcePath {
                     do {
                         try merged.write(to: URL(fileURLWithPath: outputPath), options: .atomic)
                     } catch {
                         throw GeneratorError.writeFailed(error.localizedDescription)
                     }
                 }
                 let canonical = PairingController.syncCanonicalPairingFile(from: sourcePath)
                 do {
                     try merged.write(to: URL(fileURLWithPath: canonical), options: .atomic)
                 } catch {
                     throw GeneratorError.writeFailed(error.localizedDescription)
                 }
                 return canonical
             }
         }
         PAIRINGGEN_EOF

      - name: Write CompositePairingFile.swift
        run: |
         set -euo pipefail
         cat > natsuk1/Helpers/CompositePairingFile.swift <<'COMPOSITE_EOF'
         import Foundation
         struct PairingFileKind {
             let hasRemotePairing: Bool
             let hasLockdown: Bool
             let udid: String?
             var isUsable: Bool { hasRemotePairing || hasLockdown }
             static let none = PairingFileKind(hasRemotePairing: false, hasLockdown: false, udid: nil)
             static func of(path: String) -> PairingFileKind {
                 guard let data = try? Data(contentsOf: URL(fileURLWithPath: path)) else { return .none }
                 return of(data: data)
             }
             static func of(data: Data) -> PairingFileKind {
                 guard !data.isEmpty,
                       let parsed = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                       let dict = parsed as? [String: Any]
                 else { return .none }
                 let ed25519 = { (key: String) in (dict[key] as? Data)?.count == 32 }
                 let remote = ed25519("public_key") && ed25519("private_key")
                     && (dict["identifier"] as? String)?.isEmpty == false
                 let present = { (key: String) in
                     (dict[key] as? Data)?.isEmpty == false || (dict[key] as? String)?.isEmpty == false
                 }
                 let lockdown = present("HostCertificate") && present("HostPrivateKey")
                     && present("DeviceCertificate")
                 let udid = (dict["UDID"] as? String).flatMap { $0.isEmpty ? nil : $0 }
                 return PairingFileKind(hasRemotePairing: remote, hasLockdown: lockdown, udid: udid)
             }
         }
         enum CompositePairingFile {
             private static let hostIDKey = "natsuk1LockdownHostID"
             private static let systemBUIDKey = "natsuk1LockdownSystemBUID"
             private static let recordUDIDKey = "natsuk1LockdownRecordUDID"
             enum BuildError: LocalizedError {
                 case notAPlistDictionary(String)
                 var errorDescription: String? {
                     switch self {
                     case let .notAPlistDictionary(what):
                         return "The \(what) record isn't a plist dictionary."
                     }
                 }
             }
             static var hostID: String { persistentUUID(forKey: hostIDKey) }
             static var systemBUID: String { persistentUUID(forKey: systemBUIDKey) }
             private static func persistentUUID(forKey key: String) -> String {
                 if let stored = UserDefaults.standard.string(forKey: key), !stored.isEmpty {
                     return stored
                 }
                 let raw = UUID().uuidString
                 UserDefaults.standard.set(raw, forKey: key)
                 return raw
             }
             private static var documents: URL {
                 FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
             }
             static var cachedLockdownURL: URL {
                 documents.appendingPathComponent(".natsuk1_lockdown_record")
             }
             static var mergedURL: URL {
                 documents.appendingPathComponent("ALTPairingFile.mobiledevicepairing")
             }
             static func cachedLockdownRecord(forUDID udid: String?) -> Data? {
                 guard let udid, !udid.isEmpty,
                       UserDefaults.standard.string(forKey: recordUDIDKey) == udid,
                       let data = try? Data(contentsOf: cachedLockdownURL),
                       !data.isEmpty
                 else { return nil }
                 return data
             }
             static func storeLockdownRecord(_ data: Data, forUDID udid: String?) {
                 try? data.write(to: cachedLockdownURL, options: .atomic)
                 UserDefaults.standard.set(udid ?? "", forKey: recordUDIDKey)
             }
             static func clearLockdownRecord() {
                 try? FileManager.default.removeItem(at: cachedLockdownURL)
                 UserDefaults.standard.removeObject(forKey: recordUDIDKey)
             }
             static func merge(lockdown: Data, rpPairing: Data, udid: String?) throws -> Data {
                 var merged = try dictionary(from: lockdown, describing: "lockdown")
                 for (key, value) in try dictionary(from: rpPairing, describing: "RPPairing") {
                     merged[key] = value
                 }
                 if let udid, !udid.isEmpty, (merged["UDID"] as? String)?.isEmpty != false {
                     merged["UDID"] = udid
                 }
                 return try PropertyListSerialization.data(fromPropertyList: merged, format: .xml, options: 0)
             }
             private static func dictionary(from data: Data, describing what: String) throws -> [String: Any] {
                 let parsed = try PropertyListSerialization.propertyList(from: data, options: [], format: nil)
                 guard let dict = parsed as? [String: Any] else {
                     throw BuildError.notAPlistDictionary(what)
                 }
                 return dict
             }
         }
         COMPOSITE_EOF

      - name: Verify sources
        run: |
         set -euo pipefail
         fail() { echo "::error::$1"; exit 1; }
         test -f project.yml || fail 'project.yml is missing'
         test -f natsuk1/App/natsuk1.swift || fail 'natsuk1/App/natsuk1.swift is missing'
         grep -q 'LockdownPair.mintRecord' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift is stale: LockdownPair.mintRecord'
         grep -q 'CompositePairingFile.merge' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift is stale: CompositePairingFile.merge'
         grep -q 'resetCancel' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift is stale: resetCancel'
         grep -q 'static func merge' natsuk1/Helpers/CompositePairingFile.swift || fail 'natsuk1/Helpers/CompositePairingFile.swift is stale: static func merge'
         grep -q 'storeLockdownRecord' natsuk1/Helpers/CompositePairingFile.swift || fail 'natsuk1/Helpers/CompositePairingFile.swift is stale: storeLockdownRecord'
         grep -q 'static func cancelMinting' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: static func cancelMinting'
         grep -q 'static let defaultSlots' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: static let defaultSlots'
         grep -q 'func mintRecord' natsuk1/Helpers/LockdownPair.swift || fail 'natsuk1/Helpers/LockdownPair.swift is stale: func mintRecord'
         grep -q 'LockdownPair.cancelled' natsuk1/Helpers/AirliftBridge.swift || fail 'natsuk1/Helpers/AirliftBridge.swift is stale: LockdownPair.cancelled'
         grep -q 'idevice_shim.h' natsuk1/Support/bridging.h || fail 'natsuk1/Support/bridging.h is stale: idevice_shim.h'
         ! grep -q 'lockdownd_connect_rsd' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift still has lockdownd_connect_rsd'
         ! grep -q 'lockdownd_pair_record_free' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift still has lockdownd_pair_record_free'
         ! grep -q 'static func cancelMinting' natsuk1/Helpers/PairingGenerator.swift || fail 'natsuk1/Helpers/PairingGenerator.swift still has static func cancelMinting'

      - name: Generate project
        run: |
         set -euo pipefail
         rm -rf natsuk1.xcodeproj
         xcodegen generate

      - name: Build
        run: |
         set -euo pipefail
         xcodebuild \
           -project natsuk1.xcodeproj \
           -scheme natsuk1 \
           -configuration Release \
           -destination "generic/platform=iOS" \
           -derivedDataPath build \
           CODE_SIGNING_ALLOWED=NO \
           SWIFT_STRICT_CONCURRENCY=minimal \
           SWIFT_OPTIMIZATION_LEVEL=-Osize \
           DEAD_CODE_STRIPPING=YES \
           STRIP_INSTALLED_PRODUCT=YES \
           OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
           build -quiet

      - name: Package and Publish
        env:
         GH_TOKEN: ${{ github.token }}
        run: |
         set -euo pipefail
         APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
         test -n "$APP"
         ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP/natsuk1"
         xcrun strip -S -x "$APP/natsuk1" || true
         rm -rf Payload natsuk1.ipa natsuk1.ipa.sha256
         mkdir -p Payload
         cp -R "$APP" Payload/
         ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
         rm -rf Payload
         shasum -a 256 natsuk1.ipa | awk '{print $1"  natsuk1.ipa"}' > natsuk1.ipa.sha256
         cat natsuk1.ipa.sha256
         TAG="${{ inputs.version }}"
         if [ -n "$TAG" ]; then
           gh release create "$TAG" natsuk1.ipa natsuk1.ipa.sha256 --target "${{ github.sha }}" --title "natsuk1 $TAG" --generate-notes --latest
         else
           gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
           gh release create development natsuk1.ipa natsuk1.ipa.sha256 --target "${{ github.sha }}" --title "Development" --prerelease --latest=false --notes "natsuk1 development"
         fi