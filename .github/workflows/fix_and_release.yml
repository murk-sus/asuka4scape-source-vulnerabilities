name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <sys/sysctl.h>
          #include <sys/socket.h>
          #include <sys/utsname.h>
          #include <netinet/in.h>
          #include <netinet/tcp.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include "nk_api.h"
          #include "nk_offsets.h"
          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define RESBUF 65536
          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;
          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)
          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, 0x01, uuid, (size_t)16, p, (size_t)1);
          }
          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56]; memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, 0x11, (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) { memcpy(fu, req, 16); fu[9] |= 0x01; }
              return r;
          }
          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex), "%04x: %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x",
                      i, buf[i+0], buf[i+1], buf[i+2], buf[i+3], buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11], buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }
          static int scan_kptr(const char *tag, const uint8_t *buf, int len, int maxhits) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v; memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= maxhits) break;
                  }
              }
              return found;
          }
          static int step_sysinfo(void) {
              nk_log("");
              LI("A1", "uname");
              struct utsname u;
              if (uname(&u) == 0) {
                  LI("A1", "sysname=%s release=%s version=%s machine=%s",
                     u.sysname, u.release, u.version, u.machine);
              }
              const char *keys[] = {
                  "kern.osproductversion", "kern.osversion",
                  "kern.version", "kern.uuid", "kern.hostname",
                  "kern.ostype", "kern.osrelease", "kern.secure_kernel",
                  "hw.machine", "hw.model", "hw.memsize", "hw.ncpu",
                  "hw.cpufamily", "hw.cputype", "hw.cpusubtype", "hw.targettype"
              };
              for (size_t i = 0; i < sizeof(keys)/sizeof(keys[0]); i++) {
                  char val[256]; size_t sz = sizeof(val); memset(val, 0, sizeof(val));
                  if (sysctlbyname(keys[i], val, &sz, NULL, 0) == 0) {
                      LI("A2", "%s = %s", keys[i], val);
                  }
              }
              uint64_t boot = 0; size_t bs = sizeof(boot);
              if (sysctlbyname("kern.boottime", &boot, &bs, NULL, 0) == 0) {
                  LI("A3", "kern.boottime = 0x%llx", (unsigned long long)boot);
              }
              return 0;
          }
          static int step_necp_recap(void) {
              nk_log("");
              LI("B1", "NECP recap");
              int fd = nfd();
              if (fd < 0) { LE("B1", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              nadd_flow(fd, cu, fu);
              uint32_t ops[] = {0x03, 0x04, 0x10, 0x1A};
              for (size_t i = 0; i < 4; i++) {
                  uint8_t buf[2048]; memset(buf, 0, sizeof(buf));
                  int c = (int)syscall(SYS_NECP_ACTION, fd, ops[i],
                                       (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                  LI("B1", "op=0x%02x ret=%d", ops[i], c);
                  if (c > 0) {
                      hexdump("B1H", buf, c, 512);
                      scan_kptr("B1K", buf, c, 8);
                  }
              }
              int r1 = (int)syscall(SYS_NECP_ACTION, fd, 0x12, (void*)fu, (size_t)16, NULL, (size_t)0);
              int r2 = (int)syscall(SYS_NECP_ACTION, fd, 0x12, (void*)fu, (size_t)16, NULL, (size_t)0);
              LI("B2", "remove#1=%d remove#2=%d", r1, r2);
              close(fd);
              return 0;
          }
          static int is_dangerous(int n) {
              return n == 0 || n == 1 || n == 2 || n == 7 || n == 59 || n == 198;
          }
          static int step_syscall_sweep(void) {
              nk_log("");
              LI("C1", "syscall sweep 0..558");
              int enosys = 0, eperm = 0, einval = 0, other = 0;
              for (int n = 0; n <= 558; n++) {
                  if (is_dangerous(n)) { continue; }
                  errno = 0;
                  long r = syscall(n, 0, 0, 0, 0, 0, 0, 0, 0);
                  int e = errno;
                  if (r == -1 && e == 78) { enosys++; }
                  else if (r == -1 && e == 1) { eperm++; }
                  else if (r == -1 && e == 22) { einval++; }
                  else {
                      other++;
                      LI("C1", "syscall %d -> r=%ld errno=%d", n, r, e);
                  }
              }
              LI("C2", "ENOSYS=%d EPERM=%d EINVAL=%d OTHER=%d",
                 enosys, eperm, einval, other);
              return 0;
          }
          static void sweep_getsockopt(int level, const char *name, int maxopt) {
              int s = socket(AF_INET, SOCK_STREAM, 0);
              if (s < 0) return;
              int hits = 0;
              for (int opt = 0; opt <= maxopt; opt++) {
                  uint8_t buf[128]; socklen_t bl = sizeof(buf); memset(buf, 0, sizeof(buf));
                  int r = getsockopt(s, level, opt, buf, &bl);
                  if (r == 0 && bl > 4) {
                      hits++;
                      LI("DS", "%s level=%d opt=%d bl=%u", name, level, opt, (unsigned)bl);
                      hexdump("DSH", buf, bl, 128);
                      int nk = scan_kptr("DSK", buf, bl, 4);
                      if (nk > 0) LO("DS", "  kptr=%d", nk);
                  }
              }
              LI("DS", "%s level=%d done, hits=%d", name, level, hits);
              close(s);
          }
          static int step_getsockopt_sweep(void) {
              nk_log("");
              LI("D1", "getsockopt sweep SOL_SOCKET=0xffff");
              sweep_getsockopt(0xffff, "SOL_SOCKET", 300);
              LI("D2", "getsockopt sweep IPPROTO_IP=0");
              sweep_getsockopt(0, "IPPROTO_IP", 300);
              LI("D3", "getsockopt sweep IPPROTO_TCP=6");
              sweep_getsockopt(6, "IPPROTO_TCP", 300);
              LI("D4", "getsockopt sweep IPPROTO_IPV6=41");
              sweep_getsockopt(41, "IPPROTO_IPV6", 200);
              LI("D5", "getsockopt sweep IPPROTO_ICMP=1");
              sweep_getsockopt(1, "IPPROTO_ICMP", 200);
              LI("D6", "getsockopt sweep IPPROTO_UDP=17");
              sweep_getsockopt(17, "IPPROTO_UDP", 200);
              return 0;
          }
          static int step_setsockopt(void) {
              nk_log("");
              LI("D7", "setsockopt probes (round-trip)");
              int levels[] = {0xffff, 0, 6, 41, 1, 17};
              const char *names[] = {"SOL_SOCKET","IPPROTO_IP","IPPROTO_TCP","IPPROTO_IPV6","IPPROTO_ICMP","IPPROTO_UDP"};
              for (size_t li = 0; li < sizeof(levels)/sizeof(levels[0]); li++) {
                  int s = socket(AF_INET, SOCK_STREAM, 0);
                  if (s < 0) continue;
                  int hits = 0;
                  for (int opt = 0; opt <= 200; opt++) {
                      uint64_t marker = 0xdeadbeefcafebabeULL;
                      int r = setsockopt(s, levels[li], opt, &marker, 8);
                      if (r == 0) {
                          uint8_t buf[128]; socklen_t bl = sizeof(buf); memset(buf, 0, sizeof(buf));
                          if (getsockopt(s, levels[li], opt, buf, &bl) == 0 && bl > 4) {
                              hits++;
                              LI("D7", "%s opt=%d bl=%u", names[li], opt, (unsigned)bl);
                              hexdump("D7H", buf, bl, 128);
                          }
                      }
                  }
                  LI("D7", "%s done, hits=%d", names[li], hits);
                  close(s);
              }
              return 0;
          }
          static int step_proc_info(void) {
              nk_log("");
              LI("D8", "proc_info flavors");
              for (int flavor = 1; flavor <= 20; flavor++) {
                  uint8_t buf[512]; memset(buf, 0, sizeof(buf));
                  int sz = 0;
                  long r = syscall(336, getpid(), flavor, buf, sizeof(buf), &sz);
                  if (r == 0 && sz > 0) {
                      LI("D8", "flavor=%d sz=%d", flavor, sz);
                      hexdump("D8H", buf, sz < 512 ? sz : 512, 512);
                      scan_kptr("D8K", buf, sz < 512 ? sz : 512, 8);
                  }
              }
              return 0;
          }
          static int step_csops(void) {
              nk_log("");
              LI("D9", "csops flavors");
              for (int op = 0; op <= 15; op++) {
                  uint8_t buf[512]; memset(buf, 0, sizeof(buf));
                  size_t sz = sizeof(buf);
                  long r = syscall(169, getpid(), op, buf, sz);
                  if (r == 0) {
                      LI("D9", "csops op=%d ok", op);
                      hexdump("D9H", buf, 512, 512);
                      scan_kptr("D9K", buf, 512, 8);
                  }
              }
              return 0;
          }
          static int step_task_info(void) {
              nk_log("");
              LI("DA", "task_info flavor sweep");
              mach_port_t task = mach_task_self();
              for (int flavor = 1; flavor <= 40; flavor++) {
                  natural_t count = 0;
                  kern_return_t kr = task_info(task, flavor, NULL, &count);
                  if (kr == KERN_SUCCESS && count > 0 && count < 1024) {
                      size_t bytes = count * sizeof(natural_t);
                      uint8_t *buf = malloc(bytes);
                      if (buf) {
                          memset(buf, 0, bytes);
                          kr = task_info(task, flavor, (task_info_t)buf, &count);
                          if (kr == KERN_SUCCESS) {
                              LI("DA", "flavor=%d count=%d bytes=%zu", flavor, count, bytes);
                              hexdump("DAH", buf, (int)bytes > 256 ? 256 : (int)bytes, 256);
                              int nk = scan_kptr("DAK", buf, (int)bytes, 8);
                              if (nk > 0) LO("DA", "  kptr=%d", nk);
                          }
                          free(buf);
                      }
                  }
              }
              return 0;
          }
          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v7.0 - FINAL RECON");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              step_sysinfo();
              step_necp_recap();
              step_syscall_sweep();
              step_getsockopt_sweep();
              step_setsockopt();
              step_proc_info();
              step_csops();
              step_task_info();
              nk_log("");
              nk_log("======== done ========");
              return 0;
          }
          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) { nk_log("[!] already running"); return 1; }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          void nk_necp_cancel(void) { g_cancel = 1; nk_log("[!] cancel requested"); }
          NECP_EOF

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .app"; exit 1; fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v7.0 final recon

          IPA: ${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"