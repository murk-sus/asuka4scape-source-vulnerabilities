      - name: Sync README
        run: |
          python3 - <<'PY'
          import io
          hints = io.open("ai-hints.md", encoding="utf-8").read()
          s = io.open("README.md", encoding="utf-8").read()
          ms = "<!-- AUTO-RULES-START -->"
          me = "<!-- AUTO-RULES-END -->"
          if ms in s and me in s:
              i = s.index(ms)
              j = s.index(me) + len(me)
              s = s[:i] + ms + "\n" + hints + "\n" + me + s[j:]
          else:
              s = s.rstrip() + "\n\n" + ms + "\n" + hints + "\n" + me + "\n"
          io.open("README.md", "w", encoding="utf-8").write(s)
          print("README: %d bytes" % len(s.encode("utf-8")))
          PY

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ]
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          R="${{ github.repository }}"
          U="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v8.4

          IPA: $U
          AltStore: altstore://install?url=$U
          Scarlet: scarlet://install?url=$U
          ESign: esign://install?url=$U

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "v8.4: restore grappa tokens + diag + 150KB ai-hints [skip ci]"
          git push