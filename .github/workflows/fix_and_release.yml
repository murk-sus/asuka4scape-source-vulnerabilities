      - name: Strip nonisolated unsafe
        run: |
          python3 - <<'PYEOF'
          import re, os
          for root, dirs, files in os.walk("natsuk1"):
              for f in files:
                  if not f.endswith(".swift"):
                      continue
                  p = os.path.join(root, f)
                  s = open(p).read()
                  s2 = re.sub(r"nonisolated\(unsafe\)\s+static\s+let\s+shared", "static let shared", s)
                  if s2 != s:
                      open(p, "w").write(s2)
                      print("patched " + p)
          PYEOF

