name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
            tools
          key: nk-v3-${{ hashFiles('project.yml') }}
          restore-keys: |
            nk-v3-

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p tools
          cd tools
          if [ ! -x xcodegen ]; then
            curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
            unzip -qq -o xcodegen.zip
            rm -f xcodegen.zip
          fi
          if [ ! -x ldid ]; then
            curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x ldid
          fi
          if [ ! -x swiftlint ]; then
            curl -fsSL -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.62.2/portable_swiftlint.zip
            unzip -qq -o swiftlint.zip
            rm -f swiftlint.zip
          fi
          if [ ! -x periphery ]; then
            curl -fsSL -o periphery.zip https://github.com/peripheryapp/periphery/releases/download/3.8.0/periphery.zip
            unzip -qq -o periphery.zip
            rm -f periphery.zip
          fi
          cd ..
          echo "$PWD/tools" >> $GITHUB_PATH

      - name: Cleanup
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f natsuk1/Exploit/NECP/necp.c
          rmdir natsuk1/Exploit/NECP 2>/dev/null || true

          for f in natsuk1/Exploit/Core/nk_api.c natsuk1/Exploit/Core/nk_api.h; do
            [ -f "$f" ] && sed -i '' '/nk_necp_cancel/d' "$f"
            [ -f "$f" ] && sed -i '' 's/nk_necp_run()/nk_run()/g' "$f"
          done

          printf '%s\n' '#ifndef NK_OFFSETS_H' '#define NK_OFFSETS_H' '#define NK_KERNEL_BASE                0xFFFFFFF007004000ULL' '#define NK_SYSENT_BASE                0xFFFFFFF007C192A0ULL' '#define NK_SYSENT_COUNT               558' '#endif' > natsuk1/Exploit/Core/nk_offsets.h

          find natsuk1 -name '*.swift' -exec sed -i '' '/nk_necp_cancel()/d' {} +
          find natsuk1 -name '*.swift' -exec sed -i '' 's/nk_necp_run()/nk_run()/g' {} +

          sed -i '' '/previousCrash/d; /showCrashLog/d; /recoverPreviousSession/d' natsuk1/App/natsuk1.swift 2>/dev/null || true

          perl -0777 -i -pe 's/\n    func recoverPreviousSession\(\)[^{]*\{.*?\n    \}\n/\n/gs' natsuk1/Helpers/CrashLog.swift 2>/dev/null || true
          perl -0777 -i -pe 's/\n    func clearPreviousCrash\(\)[^{]*\{.*?\n    \}\n/\n/gs' natsuk1/Helpers/CrashLog.swift 2>/dev/null || true
          perl -0777 -i -pe 's/\n    func respring\(\) \{.*?\n    \}\n/\n/gs' natsuk1/Helpers/AirliftBridge.swift 2>/dev/null || true
          perl -0777 -i -pe 's/\n    func findContainer\(bundleID: String\) async -> String\? \{.*?\n    \}\n/\n/gs' natsuk1/Helpers/AirliftBridge.swift 2>/dev/null || true

          NS=natsuk1/Helpers/NetworkStatus.swift
          if [ -f "$NS" ]; then
            perl -0777 -i -pe 's/Interface\(name: name, ipv4: ipv4,\s*\n\s*netmask:[^\n]*?\)\)\)/Interface(name: name, ipv4: ipv4)/g' "$NS"
            sed -i '' '/let netmask:/d' "$NS"
            perl -0777 -i -pe 's/\n\s*static func summarize\(deviceIP:[^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
            perl -0777 -i -pe 's/\n\s*static func tunnelHostCandidates\([^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
            perl -0777 -i -pe 's/\n\s*static func host\(_ value:[^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
            perl -0777 -i -pe 's/\n\s*static func isOwnAddress\(_ deviceIP:[^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
          fi

          perl -0777 -i -pe 's/\n\s*static func full\(\)[^\n]*\{.*?\n\s*\}\n/\n/gs' natsuk1/Helpers/DeviceName.swift 2>/dev/null || true
          perl -0777 -i -pe 's/\n\s*nonisolated static var activeVersion:[^\n]*\{.*?\n\s*\}\n/\n/gs' natsuk1/Helpers/OffsetsStore.swift 2>/dev/null || true
          sed -i '' 's/row("Identifier", machineID())/row("Identifier", DeviceName.machineID())/' natsuk1/Views/DeviceInfoView.swift 2>/dev/null || true

          AV=natsuk1/Views/AirliftView.swift
          if [ -f "$AV" ]; then
            if grep -q 'PIN \\(pin)' "$AV"; then
              sed -i '' 's/if airlift\.pairPIN != nil {/if let pin = airlift.pairPIN {/' "$AV"
            else
              sed -i '' 's/if let pin = airlift\.pairPIN {/if airlift.pairPIN != nil {/' "$AV"
            fi
          fi

          sed -i '' '/^natsuk1-app\.tar\.gz$/d; /^natsuk1\.ipa$/d; /^reference\/$/d' .gitignore 2>/dev/null || true
          sed -i '' '/necp\.c.*probes/d' docs/architecture.md 2>/dev/null || true

          if [ -f docs/ai-hints.md ]; then
            sed -i '' '/^## NECP STATUS$/,/^## IOKIT STATUS$/d' docs/ai-hints.md
            sed -i '' '/^## IOKIT STATUS$/,/^## BSD SYSCALL STATUS$/d' docs/ai-hints.md
            sed -i '' '/^## BSD SYSCALL STATUS$/,/^## NEW SURFACE/d' docs/ai-hints.md
            sed -i '' '/^## NEW SURFACE$/,/^## WHAT A PRIMITIVE LOOKS LIKE$/d' docs/ai-hints.md
            sed -i '' '/^## TAINT METHOD$/,/^## HOW TO WRITE GHIDRA/d' docs/ai-hints.md
            sed -i '' '/^## HOW TO WRITE GHIDRA/,/^## WORKFLOW$/d' docs/ai-hints.md
            sed -i '' '/^## LOGGING FOR EXPLOIT$/,/^## COMMON ERRORS/d' docs/ai-hints.md
            sed -i '' '/^## COMMON ERRORS/,/^## GRAPPA/d' docs/ai-hints.md
            sed -i '' '/^## GRAPPA/,/^## UI \/ SWIFTUI/d' docs/ai-hints.md
            sed -i '' '/^## NEXT STEPS$/,/^## WHAT NOT TO DO$/d' docs/ai-hints.md
            sed -i '' '/^## WHAT NOT TO DO$/,$d' docs/ai-hints.md
          fi

          if ! grep -q 'CODE AND WORKFLOW STYLE' docs/ai-hints.md 2>/dev/null; then
            printf '\n## CODE AND WORKFLOW STYLE\n\n' >> docs/ai-hints.md
            printf -- '- No comments in code or workflows.\n' >> docs/ai-hints.md
            printf -- '- Keep cleanup idempotent with sed and perl.\n' >> docs/ai-hints.md
            printf -- '- Never rewrite if let pin = airlift.pairPIN unless Text PIN pin was removed first.\n' >> docs/ai-hints.md
            printf -- '- Remove nk_necp_cancel lines with sed, do not rename.\n' >> docs/ai-hints.md
          fi

          mkdir -p docs natsuk1Tests

          if [ ! -f .swiftlint.yml ]; then
            printf 'disabled_rules:\n  - trailing_whitespace\n  - line_length\n  - identifier_name\nopt_in_rules:\n  - empty_count\n  - closure_spacing\n  - collection_alignment\nexcluded:\n  - build\n  - .build\n' > .swiftlint.yml
          fi

          if [ ! -f .periphery.yml ]; then
            printf 'project: natsuk1.xcodeproj\nschemes:\n  - natsuk1\ntargets:\n  - natsuk1\nretain_public: false\nretain_unused_protocol_func_params: true\n' > .periphery.yml
          fi

          if [ ! -f docs/offsets.md ]; then
            printf '%s\n' '# Offsets' '' 'All offsets live in `natsuk1/Offsets/`.' '' '`index.json` maps device + iOS to a version file.' 'Each version file has `groups` and `defaults`.' '' 'Currently shipped:' '' '- iPhone14,5_iOS27.0_24A437.json — `verified: false`, awaiting Ghidra pass.' '' 'Do not trust unverified offsets.' > docs/offsets.md
          fi

          if [ ! -f docs/nativeness.md ]; then
            printf '%s\n' '# Nativeness' '' 'What actually works on iOS 27 / 24A437:' '' '- Airlift (AirTraffic / Grappa) — works via static token fallback.' '- NECP — closed. All ops bounded at depth-0. Removed from repo.' '- IOKit — not probed beyond shallow externalMethod dispatch.' '- BSD syscalls — 557/558 unpacked, all shallow paths bounded.' '' 'What does not work:' '' '- Kernel R/W primitive. None found.' '- Grappa on iOS without static token.' > docs/nativeness.md
          fi

          if [ ! -f CHANGELOG.md ]; then
            printf '%s\n' '# Changelog' '' '## v22.0' '' '- Reorganize repo layout.' '- Drop NECP (closed).' '- Remove dead code.' '- Add SwiftLint and Periphery.' '- Add docs.' > CHANGELOG.md
          fi

          if [ ! -f natsuk1Tests/DeviceNameTests.swift ]; then
            printf '%s\n' 'import XCTest' '@testable import natsuk1' '' 'final class DeviceNameTests: XCTestCase {' '    func testMachineID() {' '        XCTAssertFalse(DeviceName.machineID().isEmpty)' '    }' '}' > natsuk1Tests/DeviceNameTests.swift
          fi

          if ! grep -q 'natsuk1Tests' project.yml; then
            printf '\n  natsuk1Tests:\n    type: bundle.unit-test\n    platform: iOS\n    sources:\n      - path: natsuk1Tests\n    dependencies:\n      - target: natsuk1\n    settings:\n      base:\n        PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit.tests\n        GENERATE_INFOPLIST_FILE: YES\n' >> project.yml
          fi

          if grep -q 'LLVM_LTO: YES' project.yml; then
            sed -i '' 's/LLVM_LTO: YES/LLVM_LTO: NO/' project.yml
          fi

          oxipng -o max --strip safe natsuk1/Resources/Assets.xcassets/AppIcon.appiconset/1024x1024.png 2>/dev/null || true

          grep -q '.swiftpm/' .gitignore 2>/dev/null || printf '\n# Swift\n*.xcworkspace\n.swiftpm/\n.build/\nPackage.resolved\n\n# Debug\n*.dSYM\n' >> .gitignore

          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: tools, lint, docs, tests [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Lint
        run: |
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging || true

      - name: Dead code
        run: |
          periphery scan --config .periphery.yml --disable-update-check || true

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Test
        run: |
          xcodebuild test \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet || true

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' \
                       -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) \
                -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 \
            && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"