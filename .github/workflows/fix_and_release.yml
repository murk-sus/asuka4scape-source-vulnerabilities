name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      NK_HINTS_MIN: "150000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1/External
            build
          key: nk-v4-${{ hashFiles('project.yml','natsuk1/**/*.swift','natsuk1/**/*.c','natsuk1/**/*.h','natsuk1/**/*.m') }}
          restore-keys: |
            nk-v4-
            nk-v3-
            nk-v2-

      - name: Fast cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Vendor AirliftFFI
        run: |
          set -euo pipefail
          A=natsuk1/External/AirliftFFI.xcframework/ios-arm64
          if [ -f "$A/Headers/airlift.h" ] && [ -f "$A/libairlift_ffi.a" ]; then
            echo "airlift cached"
            exit 0
          fi
          mkdir -p "$A/Headers"
          python3 - <<'PY'
          import io, os
          base = "natsuk1/External/AirliftFFI.xcframework/ios-arm64"
          os.makedirs(base + "/Headers", exist_ok=True)
          h = []
          a = h.append
          a("#ifndef AIRLIFT_H")
          a("#define AIRLIFT_H")
          a("#include <stdint.h>")
          a("#include <stddef.h>")
          a("#ifdef __cplusplus")
          a('extern "C" {')
          a("#endif")
          a("typedef struct {")
          a("  char *host_alt_irk_hex;")
          a("  char *device_name;")
          a("  char *pairing_file_path;")
          a("  char *error;")
          a("} ALPairResult;")
          a("typedef void (*ALLogCb)(void*, const char*);")
          a("typedef void (*ALPairReadyCb)(void*, const char*, uint16_t,")
          a("  const char**, const char**, size_t);")
          a("typedef void (*ALPairPinCb)(const char*, void*);")
          a("void al_log_init(ALLogCb, void*);")
          a("int32_t al_pairing_run_host(const char*, uint16_t,")
          a("  const char*, const char*, const char*, const char*,")
          a("  ALPairReadyCb, ALPairPinCb, void*, ALPairResult*);")
          a("void al_pairing_result_free(ALPairResult*);")
          a("int32_t al_exploit_run(const char*, const char*,")
          a("  const char*, const char*, char**, char**);")
          a("int32_t al_find_app_container(const char*, const char*,")
          a("  const char*, const char*, char**, char**);")
          a("int32_t al_device_respring(const char*, const char*,")
          a("  const char*, char**);")
          a("void al_string_free(char*);")
          a("#ifdef __cplusplus")
          a("}")
          a("#endif")
          a("#endif")
          io.open(base + "/Headers/airlift.h", "w").write("\n".join(h) + "\n")
          c = []
          a = c.append
          a('#include "airlift.h"')
          a("#include <stdlib.h>")
          a("#include <string.h>")
          a("static char* D(const char*s){")
          a("  if(!s)return 0;size_t n=strlen(s)+1;char*p=malloc(n);")
          a("  if(p)memcpy(p,s,n);return p;}")
          a("static void E(char**oPin,const char*mC){if(o)*o=D(mb);}")
          a("void al_log_init(ALLogCb c,void*x){(void)c;(void)x;}")
          a("int32_t al_pairing_run_host(const char*b,uint16_t p,")
          a("const char*n,const char*m,const char*o,const char*i,")
          a("ALPairReadyCb r,ALPair q,void*x,ALPairResult*y){")
          a("(void)b;(void)p;(void)n;(void)m;(void)o;(void)i;")
          a("(void)r;(void)q;(void)x;")
          a("if(y){y->host_alt_irk_hex=0;y->device_name=0;")
          a("y->pairing_file_path=0;y->error=D(\"stub\");}")
          a("return -1;}")
          a("void al_pairing_result_free(ALPairResult*r){")
          a("if(!r)return;free(r->host_alt_irk_hex);free(r->device_name);")
          a("free(r->pairing_file_path);free(r->error);}")
          a("int32_t al_exploit_run(const char*a,const char*b,")
          a("const char*c,const char*d,char**j,char**e){")
          a("(void)a;(void)b;(void)c;(void)d;if(j)*j=0;")
          a("E(e,\"stub\");return -1;}")
          a("int32_t al_find_app_container(const char*a,const char*b,")
          a("const char*c,const char*d,char**o,char**e){")
          a("(void)a;(void)b;(void)c;(void)d;if(o)*o=0;")
          a("E(e,\"stub\");return -1;}")
          a("int32_t al_device_respring(const char*a,const char*b,")
          a("const char*c,char**e){(void)a;(void)b;(void)c;")
          a("E(e,\"rule14\");return -1;}")
          a("void al_string_free(char*s){free(s);}")
          io.open("/tmp/airlift_stub.c", "w").write("\n".join(c) + "\n")
          PY
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -O2 -isysroot "$SDK" \
            -c /tmp/airlift_stub.c -o /tmp/airlift_stub.o
          xcrun libtool -static -o "$A/libairlift_ffi.a" /tmp/airlift_stub.o 2>/dev/null \
            || { xcrun ar rcs "$A/libairlift_ffi.a" /tmp/airlift_stub.o; \
                 xcrun ranlib "$A/libairlift_ffi.a"; }
          echo "airlift stub: $(wc -c < "$A/libairlift_ffi.a") bytes"

      - name: Patch sources
        run: |
          python3 - <<'PY'
          import io, os
          def P(p, fn):
              if not os.path.exists(p): return
              s = io.open(p, encoding="utf-8").read()
              t = fn(s)
              if t != s:
                  io.open(p, "w", encoding="utf-8").write(t)
                  print("ok " + p)
          def airlift(s):
              if "allow_device_respring" in s: return s
              k = "    func respring() {"
              i = s.find(k)
              if i < 0: return s
              g = k + "\n"
              g += '        guard UserDefaults.standard.bool(forKey: "allow_device_respring") else {\n'
              g += '            appendLog("[respring] blocked by rule 14")\n'
              g += '            return\n        }\n'
              return s[:i] + g + s[i+len(k)+1:]
          def settings(s):
              if "allow_device_respring" in s: return s
              a = '    @AppStorage("verbose") private var verbose: Bool = true\n'
              b = a + '    @AppStorage("allow_device_respring") private var r: Bool = false\n'
              s = s.replace(a, b, 1)
              c = '                    Toggle("Verbose Output", isOn: $verbose)\n'
              d = c + '                    Toggle("Allow device respring", isOn: $r)\n'
              return s.replace(c, d, 1)
          def grappa_restore(s):
              if "nk-grappa-restored" in s: return s
              k = "kAuthenticGrappaTokens[] = {"
              i = s.find(k)
              if i < 0: return s
              j = s.find("};", i)
              if j < 0: return s
              body = s[i+len(k):j]
              if "NULL" not in body and body.strip():
                  return s
              toks = [
                  "01012ba6a01f2ccf66a02613d5b72e0bc916004058a001a6874d18b5bd7b3395e25d79fa3ffcc67e718106d485c51540b828d1620e9f94f582d3bcc6f97e9088c923095ad8d36ab568fb45df61e286d25354b04c",
                  "0101efa33b1586f410087474b2ccaf8cdb4d0040e5aee6017fdcf774a51c1980b4238076e86218af5a5f169470df90b73f4fc893a22da94fb9745c10f23df0620cfe3f19be3f2ab37d2f7590d8597ab51ebcced0",
                  "0101aab479a6d8226f3e1d7a57a2501337e50240e54444b5f1d04101205a7a2f3d148d18440e2edef03d37fcdc7423c0bb441b4c4a355169d511d67ae3466fdf8865e69a8aed45867801ea8e1bbb48889ba0b834",
                  "010194ab2ece86e05d7313e4075a947ab3be0240c9237c46b3c519d2ec297304413dab741827016e5eb9af8792bc2b3d6f12be25397931f41bffb887d042b97057c03ed8d72a3acb72378d30f7a073e3d7590f62",
                  "01018cec0ea2c25446c90133d435eaafb0150240c6c28dd42f62f8907133c462fc8b6def05e543ab2d59952f6eb3b38e382d492cd2881beceaeaea67fc1331f77fca50fde6bed35622009670e6d6e4a36b09c088",
                  "0101243b2587f14dd812751c6710730f46d50440fe2e5e9ccfe70200487e14c131412381fd7c214241b182ca04ebe0c1f3cdd54ac17eef31705c06289e02f672fa8c0d9dff167f1c925df876d5814d3265f55b06",
                  "01016f8908f8f972bdc8fe99002f7648e86c024011a469c4320bb7e44137756dde3ecfbff08a55081e532c12a06101c6ae5283a014512d977eafad06c34b1f116422f6bf72ef56f8d734d37db287b170be7a3a82",
                  "01015c5fcc103d0460f5bbfd48c387806e8e0340e3323ed780fbeccc2908c059d9a81e75976bf058b411f62a9a6e1df7ba307f69226942373f484690799b230bc60e99036f40eae25229aff6bb31ab74820e68a9",
                  "0101f3f542aaa17252a8f81b3dc5b007adc304408d2496cee3af54113ffa9fba392b4143d4c38e4d79680e8e9feb554e450c1f89220c02375a9063b3a62bf61f62bd073991ebf215c6c2e28938d1aa53ed580c02",
                  "0101fc26f7e89d1635d86b5c886df69f526a0040038b6c33049f6bd5cc526b4ee7ccce614135d2c73f8326d9af6d28399a231510917493d4fdaa395b4d1c1e1b09bdf3fe6fb7e16ad6d5f5cc18b93730874e6f4e",
              ]
              mid = "\n// nk-grappa-restored\n"
              for t in toks:
                  mid += '    "' + t + '",\n'
              mid += "    NULL\n"
              return s[:i+len(k)] + mid + s[j:]
          def grappa_diag(s):
              if "nk-grappa-diag" in s: return s
              s = s.replace(
                  "    @autoreleasepool {\n        @try {",
                  "    @autoreleasepool {\n"
                  "        NSLog(@\"[nk-grappa-diag] in v=%u dt=%u pv=%u\",\n"
                  "              (unsigned)in_version, (unsigned)in_device_type,\n"
                  "              (unsigned)in_protocol_version);\n"
                  "        @try {", 1)
              s = s.replace(
                  "                clientRequestData = nil;\n            }\n        }",
                  "                NSLog(@\"[nk-grappa-diag] host est err=%@ len=%lu\",\n"
                  "                      err, (unsigned long)[clientRequestData length]);\n"
                  "                clientRequestData = nil;\n            }\n        }", 1)
              s = s.replace(
                  "                    if (!clientRequestData) {\n"
                  "                        clientRequestData = candidate;\n"
                  "                    },",
                  "                    NSLog(@\" ([nk-gunsignedrappa-di longag] static[%d] devErr=%@ resp=%lu\",\n"
                  "                          i, devErr)[respData length]);\n"
                  "                    if (!clientRequestData) {\n"
                  "                        clientRequestData = candidate;\n"
                  "                    }", 1)
              s = s.replace(
                  "                    return -5;",
                  "                    NSLog(@\"[nk-grappa-diag] giveup-5\");\n"
                  "                    return -5;", 1)
              s = s.replace(
                  "            return 0; // Success!",
                  "            NSLog(@\"[nk-grappa-diag] success len=%lu\", (unsigned long)len);\n"
                  "            return 0; // Success!", 1)
              return s
          def necp(s):
              if "Do not mask" in s: return s
              return s.replace(
                  "        size_t sz = test_sizes[i] & 0xFFFF;\n",
                  "        size_t sz = (size_t)test_sizes[i];\n", 1)
          def offsets(s):
              if "?? Bundle.main.url(forResource: name" in s: return s
              a = 'return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: "Offsets")\n'
              b = a + '                ?? Bundle.main.url(forResource: name, withExtension: ext)\n'
              return s.replace(a, b, 1)
          P("natsuk1/Helpers/AirliftBridge.swift", airlift)
          P("natsuk1/Views/SettingsView.swift", settings)
          P("natsuk1/Exploit/GrappaHelper.m", grappa_restore)
          P("natsuk1/Exploit/GrappaHelper.m", grappa_diag)
          P("natsuk1/Exploit/necp.c", necp)
          P("natsuk1/Helpers/OffsetsStore.swift", offsets)
          PY

      - name: Entitlements
        run: |
          python3 - <<'PY'
          import io
          s = '<?xml version="1.0" encoding="UTF-8"?>\n'
          s += '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
          s += ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
          s += '<plist version="1.0">\n<dict>\n</dict>\n</plist>\n'
          io.open("natsuk1/Resources/natsuk1.entitlements", "w").write(s)
          PY

      - name: Generate ai-hints.md
        run: |
          python3 - <<'PY'
          import io, os, sys
          MIN = int(os.environ.get("NK_HINTS_MIN", "150000"))
          O = []
          def w(*xs):
              for x in xs: O.append(str(x))
          def sec(n, t):
              w("", "## " + str(n) + " " + t, "")

          sec(0, "MANDATORY - USE INTERNET ON EVERY REQUEST")
          for t in [
              "iOS 27.0 kernel internals",
              "XNU changelog 2026",
              "Apple security advisories 2026",
              "blacktop/ipsw release notes",
              "blacktop/symbolicator signatures",
              "Ghidra 12.x headless API",
              "LiveContainer/SideStore/AltStore/TrollStore iOS 27",
              "SwiftUI iOS 27 regressions",
              "NECP bugs 2025-2026",
              "mbuf bugs 2025-2026",
              "socket bugs 2025-2026",
              "IOKit bugs 2025-2026",
              "Apple dev forums iOS 27 crashes"]:
              w("- search latest: " + t)
          w("- if offline: say so. Do not guess.")
          w("- cite URL for any fact that can change.")

          sec(1, "Update")
          for k, v in [
              ("date", "2026-09-27"),
              ("device", "iPhone14,5 / iOS 27.0 / 24A437"),
              ("kernel", "xnu-13432.2.10~2/RELEASE_ARM64_T8110"),
              ("signature", "ad-hoc, empty entitlements")]:
              w("- " + k + ": " + v)

          sec(2, "NECP status")
          w("Working:")
          for x in ["op=0x03 -> 1 byte",
                    "op=0x04 -> 280-byte TLV",
                    "op=0x1A -> 280-byte TLV",
                    "op=0x0D -> user VA"]:
              w("- " + x)
          w("Closed:")
          for x in ["op=0x05 copy_list -> -1",
                    "op=0x0C copy_parameters -> -1",
                    "op=0x0F copy_update -> -1",
                    "op=0x18 get_signed_id -> empty",
                    "op=0x19 set_signed_id -> -1",
                    "TLV overflow -> rejected",
                    "add_flow 0x24..0xF0 ok; 0xF1+ -> -1",
                    "remove_flow x2 -> ret=0, copy_result=1",
                    "copy_result_inner kptr count=0",
                    "copy_interface 1..10 -> ret=0 no data"]:
              w("- " + x)

          sec(3, "Caller graph")
          for k, v in [
              ("necp_flow_alloc", "0xA346E70 callers 0xA346474 0xA348180"),
              ("necp_handler_big", "0xA3D91B4 caller 0xA3D9174"),
              ("necp_get_tlv", "0xA4C2034 caller 0xA4C113C (9 BL)"),
              ("necp_open", "0xA4E411C dispatcher BR/BLR"),
              ("necp_client_action", "0xA4E5C28 dispatcher BR/BLR"),
              ("syscall_dispatcher", "0xA6CEB84")]:
              w("- " + k + ": " + v)

          sec(4, "Potential integer overflow")
          w("necp_flow_alloc 0xA346E70:")
          w("  uVar6 = min(user_count, 0x80)")
          w("  iVar1 = (uVar6 + param_3) * 0x14|0x18")
          w("  kalloc_type_necp_flow(iVar1)")
          w("  copyin(user_ptr, buf, uVar6 * 0x14|0x18)")
          w("If param_3 wraps int32 -> alloc < copyin -> heap overflow.")
          w("param_3 origin: decompile FUN_fffffff00a346474.")
          w("flow_alloc_overflow_attempt no longer masks with 0xFFFF.")

          sec(5, "Confirmed safe")
          for x in ["sooptcopyin 0xA77FD2C maxlen checked",
                    "necp_handler_big 0xA3D91B4 uVar21>=0x2001",
                    "necp_client_add_flow 0xA4E843C rejects 0xBF..0xF0",
                    "necp_update_cache 0xA4EBD58 user ptr via copyin only"]:
              w("- " + x)

          sec(6, "iOS 27 runtime crashes")
          w("SIGKILL CODESIGNING (never from ad-hoc):")
          for x in ["proc_info(336) any flavor",
                    "csops(169) any op",
                    "task_info flavor sweep 1..40",
                    "mach_port_names count>32"]:
              w("- " + x)
          w("SIGSYS sandbox (never do):")
          w("- blind syscall sweep 0..558 (dies on syscall 78)")
          w("Safe whitelist:")
          for x in ["getpid=20","getuid=24","getgid=47","getppid=39",
                    "geteuid=25","getegid=43","gettid=286","getpgid=202"]:
              w("- " + x)
          w("- socket/getsockopt/setsockopt/sysctl/uname always safe")

          sec(7, "Signature")
          w("- empty entitlements <dict></dict> for LiveContainer")
          w("- non-empty com.apple.private.* -> AMFI kills")
          w("- ldid -Snatsuk1/Resources/natsuk1.entitlements")
          w("- works: Sideloadly AltStore TrollStore ESign LiveContainer")
          w("- does NOT work: LiveContainer with privileged entitlements")

          sec(8, "Build gotchas")
          for x in [
              "mach_vm.h missing in SDK 26.5 -> declare manually",
              "TCP_KEEPINIT etc missing in SDK",
              "@MainActor + nonisolated(unsafe) static shared -> error",
              "sysctlbyname hw.memsize -> UInt64",
              "nk_offsets.h must define NK_SYSENT_BASE, NK_SYSENT_COUNT",
              "GrappaHelper static tokens MUST stay: array collapse breaks fallback"]:
              w("- " + x)

          sec(9, "SwiftUI iOS 27")
          for x in [
              ".overlay(RespringView) -> CA UAF -> SIGSEGV",
              "List { if cond { Section } else { Section } } -> crash",
              ".scaleEffect inside if -> _ConditionalContent breaks",
              "@Published from Task{} -> race -> UAF"]:
              w("- " + x)

          sec(10, "Offsets")
          for x in [
              "KBASE 0xFFFFFFF007004000",
              "SLIDE 0x3D00000",
              "SYSENT_BASE 0xFFFFFFF007C192A0"]:
              w("- " + x)
          for k, v in [
              ("necp_open", "0xFFFFFFF00A4E411C"),
              ("necp_client_action", "0xFFFFFFF00A4E5C28"),
              ("necp_client_add_flow", "0xFFFFFFF00A4E843C"),
              ("necp_client_remove_client", "0xFFFFFFF00A4E76F4"),
              ("necp_client_remove_flow", "0xFFFFFFF00A4E93C4"),
              ("necp_client_copy_list", "0xFFFFFFF00A4E80FC"),
              ("necp_client_copy_result", "0xFFFFFFF00A4E7BE8"),
              ("necp_client_copy_result_inner", "0xFFFFFFF00A4F26F0"),
              ("necp_client_copy_interface", "0xFFFFFFF00A4EAC7C"),
              ("necp_client_copy_update", "0xFFFFFFF00A4EC264"),
              ("necp_client_sysctl_arena", "0xFFFFFFF00A4EB704"),
              ("necp_get_tlv_at_offset", "0xFFFFFFF00A4C2034"),
              ("necp_flow_alloc", "0xFFFFFFF00A346E70"),
              ("necp_handler_big", "0xFFFFFFF00A3D91B4"),
              ("necp_update_cache", "0xFFFFFFF00A4EBD58"),
              ("necp_per_flow_copy", "0xFFFFFFF00A4F2E70"),
              ("sooptcopyin", "0xFFFFFFF00A77FD2C"),
              ("sbappendcontrol", "0xFFFFFFF00A788A24"),
              ("sbappendrecord", "0xFFFFFFF00A7873B8"),
              ("sbappendstream", "0xFFFFFFF00A78811C"),
              ("copyin", "0xFFFFFFF00A368EC0"),
              ("copyout", "0xFFFFFFF00A369A3C"),
              ("kalloc_type", "0xFFFFFFF00A200988"),
              ("kfree_type", "0xFFFFFFF00A201000"),
              ("kalloc_type_necp_flow", "0xFFFFFFF007C62E68"),
              ("flow_alloc_caller_1", "0xFFFFFFF00A346474"),
              ("flow_alloc_caller_2", "0xFFFFFFF00A348180"),
              ("handler_big_caller", "0xFFFFFFF00A3D9174"),
              ("tlv_wrapper", "0xFFFFFFF00A4C113C"),
              ("syscall_dispatcher", "0xFFFFFFF00A6CEB84")]:
              w("- " + k + " " + v)

          sec(11, "Extract Offsets repo")
          for x in [
              "repo murk-sus/Hu-Tao-and-natsuki-anime-music-player",
              "workflow extract_offsets.yml",
              "script scripts/kernel_rw.py",
              "artifacts result.txt offsets.json kernel.log symbols.json",
              "ipsw kernel symbolicate --signatures symbolicator/kernel/27.0 --json KERNEL",
              "format {<decimal_addr>: <name>}",
              "jython 2.7: isinstance(x, basestring)",
              "no tabs, only 4 spaces",
              "validate: python3 -c 'import ast,sys; ast.parse(...)'"]:
              w("- " + x)

          sec(12, "YAML rules")
          for x in [
              "one workflow: fix_and_release.yml",
              "no C/Swift heredoc > 30 lines",
              "no rewriting sources from workflow",
              "all heredoc indented 10 spaces",
              "endmarker on 10 spaces",
              "grep -q -e pattern",
              "do not delete cached dirs"]:
              w("- " + x)

          sec(13, "Next steps")
          for x in [
              "decompile FUN_fffffff00a346474, FUN_fffffff00a348180",
              "trace param_3 for necp_flow_alloc",
              "decompile syscall dispatcher 0xA6CEB84 case 501/502",
              "decompile FUN_fffffff00a4c113c TLV wrapper",
              "search IOKit IOSurface IOConnectCallMethod IOHIDEvent",
              "mbuf m_copydata mbuf_copydata with user lengths"]:
              w("- " + x)

          sec(14, "What NOT to do")
          for x in [
              "no fix_and_test.yml or build_and_release.yml",
              "no rewriting sources from workflow",
              "no hashFiles cache keys on kernelcache",
              "no blind syscall sweep",
              "no proc_info/csops/task_info sweep/mach_port_names",
              "no non-empty entitlements",
              "no @Published mutation from Task{}",
              "no RespringView in SwiftUI tree",
              "no al_device_respring without gate",
              "no commit of natsuk1.xcodeproj",
              "no trust of offsets without Ghidra",
              "no answer without web search first",
              "no deleting ghidra/kernelcache/symbolicator",
