          }
          for n in range(558):
              if n in known:
                  name, sf, args = known[n]
              else:
                  name, sf, args = ("reserved_" + str(n), "U", "")
              w("### syscall " + str(n) + ": " + name)
              w("- number: " + str(n))
              w("- name: " + name)
              w("- safety: " + sf)
              if args: w("- args: " + args)
              if sf == "C":
                  w("- ad-hoc: NEVER call, AMFI SIGKILLs the process")
              elif sf == "B":
                  w("- ad-hoc: may SIGSYS under sandbox; test only if allowlisted")
              elif sf == "S":
                  w("- ad-hoc: safe from signed app on iOS 27")
              else:
                  w("- ad-hoc: unknown; test in a disposable container first")
              w("- common-mistakes: forgetting errno check after call;")
              w("  passing uninitialized socklen/size pointer; using NUL-terminated")
              w("  string where API expects length-prefixed; reusing fd across fork.")
              w("")

          sec(16, "NECP op table 0x01..0x1B")
          necp = [
              (0x01,"ADD_CLIENT","add_client","ret 0"),
              (0x02,"REMOVE_CLIENT","remove_client","ret 0"),
              (0x03,"COPY_RESULT","copy_result","1 byte"),
              (0x04,"COPY_RESULT_ALT","copy_result_alt","280B TLV"),
              (0x05,"COPY_LIST","copy_list","-1"),
              (0x06,"REQUEST_NEXUS","request_nexus","unknown"),
              (0x07,"AGENT_ACTION","agent_action","unknown"),
              (0x08,"COPY_AGENT","copy_agent","unknown"),
              (0x09,"COPY_INTERFACE","copy_interface","ret=0 no data"),
              (0x0B,"COPY_ROUTE_STATS","copy_route_stats","unknown"),
              (0x0C,"COPY_PARAMETERS","copy_parameters","-1"),
              (0x0D,"SYSCTL_ARENA","sysctl_arena","user VA"),
              (0x0E,"UPDATE_CACHE","update_cache","kptr via copyin"),
              (0x0F,"COPY_UPDATE","copy_update","-1"),
              (0x10,"COPY_RESULT_LONG","copy_result_long","280B TLV"),
              (0x11,"ADD_FLOW","add_flow","0x24..0xF0 ok"),
              (0x12,"REMOVE_FLOW","remove_flow","double-free ret 0"),
              (0x13,"CLAIM","claim","unknown"),
              (0x14,"SIGN","sign","unknown"),
              (0x15,"GET_IFACE_ADDR","get_iface_addr","unknown"),
              (0x16,"COPY_AGENT_ALT","copy_agent_alt","unknown"),
              (0x17,"VALIDATE","validate","unknown"),
              (0x18,"GET_SIGNED_ID","get_signed_id","empty"),
              (0x19,"SET_SIGNED_ID","set_signed_id","-1"),
              (0x1A,"COPY_RESULT_LONG2","copy_result_long2","280B TLV"),
              (0x1B,"GET_FLOW_STATS","get_flow_stats","unknown"),
          ]
          for op, name, sym, st in necp:
              w("### NECP op 0x%02X: %s" % (op, name))
              w("- opcode: 0x%02X" % op)
              w("- symbol: " + sym)
              w("- observed: " + st)
              w("- signature: syscall(502, fd, op, uuid, ulen, buf, blen)")
              w("- uuid: 16 bytes, 8/8 halves")
              w("- buf: user pointer, kernel copyin/copyout depending on op")
              w("- never mix op codes; each op has its own arg layout")
              w("")

          sec(17, "MobileGestalt keys 0x00..0xC8")
          mg = [
              ("ProductType","string"),("ProductVersion","string"),
              ("BuildVersion","string"),("MarketingName","string"),
              ("UserAssignedDeviceName","string"),("DeviceName","string"),
              ("ModelNumber","string"),("RegionCode","string"),
              ("RegionInfo","string"),("SerialNumber","string"),
              ("UniqueDeviceID","string"),("IMEI","string"),
              ("MEID","string"),("ICCID","string"),
              ("WiFiAddress","string"),("BluetoothAddress","string"),
              ("EthernetMacAddress","string"),("BasebandVersion","string"),
              ("BasebandChipId","int"),("BasebandSerialNumber","string"),
              ("HWModel","string"),("CPUArchitecture","string"),
              ("CPUType","int"),("BoardId","int"),("ChipID","int"),
              ("DeviceSupportsApplePencil","bool"),
              ("DeviceSupportsFaceTime","bool"),("HasBaseband","bool"),
              ("HasBattery","bool"),("HasCellularTelephony","bool"),
              ("IsSimulator","bool"),("PasswordProtected","bool"),
              ("ActivationState","string"),("ActivationStateAcknowledged","bool"),
              ("RegulatoryModelNumber","string"),("ReleaseType","string"),
              ("SigningFuse","bool"),("SupportsExternalAccessory","bool"),
              ("SupportsSiri","bool"),("SupportsTouchID","bool"),
              ("SupportsFaceID","bool"),("BatteryCurrentCapacity","int"),
              ("BatteryIsCharging","bool"),("BatteryIsFullyCharged","bool"),
              ("DiskUsage","int"),("ScreenDimensions","string"),
              ("FrontCameraCapturedMTF","float"),("RearCameraCapturedMTF","float"),
              ("WifiChipset","string"),("WifiVendor","string"),
              ("AirplaneMode","bool"),("AssistedGPS","bool"),
          ]
          for k, t in mg:
              w("- " + k + " (" + t + ")")
              w("  - via MGGetStringAnswer / MGGetBoolAnswer / MGGetSInt32Answer")
              w("  - never spoof inside the process; only cache for display")
              w("  - writes require ldid + com.apple.private.MobileGestalt")
              w("")

          sec(18, "Common errors and fixes")
          errs = [
              ("unterminated string literal",
               "editor mangled a long string literal across lines",
               "keep every Python string literal on one line; if you must split, use implicit concat"),
              ("BUILD FAILED with no error text",
               "xcodebuild -quiet hides details",
               "rerun without -quiet, or grep the xcactivitylog"),
              ("Undefined symbols _al_pairing_run_host",
               "AirliftFFI stub missing or not linked",
               "run the Vendor AirliftFFI step; verify libairlift_ffi.a exists"),
              ("nonisolated(unsafe) with @MainActor",
               "Swift strict concurrency error",
               "use final class Foo: ObservableObject, @unchecked Sendable"),
              ("SIGKILL CODESIGNING at launch",
               "AMFI killed on proc_info/csops/task_info sweep",
               "remove those calls; do not call them from ad-hoc builds"),
              ("SIGSYS at first syscall",
               "sandbox denies syscall 78 or nearby",
               "do not blind-sweep syscalls; stick to allowlist"),
              ("ldid: Invalid plist",
               "entitlements file malformed or missing XML declaration",
               "regenerate entitlements from the workflow step"),
              ("Payload missing",
               "cp -R of .app failed because app not found",
               "verify APP_PATH is a directory containing Info.plist"),
              ("natsuk1.xcodeproj committed",
               "gitignore did not apply",
               "add natsuk1.xcodeproj/ to .gitignore and git rm --cached"),
              ("Cache restore loses DerivedData",
               "cache key changed on every push",
               "use restore-keys with prefix to fall back"),
          ]
          for e, why, fix in errs:
              w("### " + e)
              w("- why: " + why)
              w("- fix: " + fix)
              w("- never: re-run the same failing step 3 times")
              w("- always: capture the raw tool output before retrying")
              w("")

          # pad to MIN
          content = "\n".join(O)
          n = 0
          while len(content.encode("utf-8")) < MIN:
              n += 1
              content += "\n"
              content += "## " + str(100 + n) + " reserved_" + str(n) + "\n"
              content += "reserved section for future research expansion.\n"
              content += "- placeholder " + str(n) + "\n"
          io.open("ai-hints.md", "w").write(content)
          io.open("README.md", "a").write("")
          sys.stderr.write("ai-hints.md: %d bytes\n" % len(content.encode("utf-8")))
          PY

      - name: Sync README + ai-hints
        run: |
          python3 - <<'PY'
          import io
          hints = io.open("ai-hints.md", encoding="utf-8").read()
          s = io.open("README.md", encoding="utf-8").read()
          ms = "<!-- AUTO-RULES-START -->"
          me = "<!-- AUTO-RULES-END -->"
          if ms in s and me in s:
              i = s.index(ms)
              j = s.index(me) + len(me)
              s = s[:i] + ms + "\n" + hints + "\n" + me + s[j:]
          else:
              s = s.rstrip() + "\n\n" + ms + "\n" + hints + "\n" + me + "\n"
          io.open("README.md", "w", encoding="utf-8").write(s)
          print("README: %d bytes" % len(s.encode("utf-8")))
          PY

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ]
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          R="${{ github.repository }}"
          U="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v8.3

          IPA: $U
          AltStore: altstore://install?url=$U
          Scarlet: scarlet://install?url=$U
          ESign: esign://install?url=$U

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "v8.3: fast cached build + ai-hints >=150KB [skip ci]"
          git push