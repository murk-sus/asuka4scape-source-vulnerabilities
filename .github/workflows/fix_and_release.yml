name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml

      - name: Write clean entitlements
        run: |
          cat > natsuk1/Resources/natsuk1.entitlements <<'ENT_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          ENT_EOF

      - name: Write rules file
        run: |
          cat > /tmp/rules.md <<'RULES_EOF'

          ## 🤖 AUTO-GENERATED RESEARCH RULES

          Обновляется workflow при каждом push. **Читать первым делом.**

          ### Обновлено
          - date: 2026-09-26
          - device: iPhone14,5 / iOS 27.0 / 24A437
          - necp_status: **закрыт**
          - signature_status: **ad-hoc, без привилегированных entitlements**

          ### 1. NECP — ЗАКРЫТ

          **Только `op=0x04` возвращает полный TLV (280-310 байт).**
          - `op=0x03` → 1 байт (пустой header)
          - `op=0x04` → 280-310 байт (полная структура)
          - `op=0x10` → 0
          - `op=0x1A` → 0

          TLV содержит client_id (0x07), uuid (0x01), interfaces (0x06),
          flags, route stats — но kptr'ов нет.

          Проверено и закрыто:
          - `op=0x05 copy_list` → -1
          - `op=0x0C copy_parameters` → -1
          - `op=0x0D sysctl_arena` → user VA RO, COW, не kernel
          - `op=0x0F copy_update` → -1
          - `op=0x13 claim` → -1
          - `op=0x15/0x18/0x19/0x1B` → пусто/-1
          - TLV overflow → kernel отклоняет
          - double-free → flow обнуляется, UAF нет
          - `add_flow` размер 0x24..0xF0, 0xF1+ → -1

          **Вывод:** NECP — userspace API без примитивов. Больше не крутить.

          ### 2. iOS 27 sandbox — критично

          - **Blind syscall sweep 0..558** → `SIGSYS` на syscall(78).
            Whitelist только: getpid(20), getuid(24), getgid(47), getppid(39),
            geteuid(25), getegid(43), gettid(286), getpgid(202).
          - **`proc_info(336)`, `csops(169)`, `task_info` flavor sweep,
            `mach_port_names`** → `SIGKILL - CODESIGNING` от AMFI на ad-hoc.
            Не вызывать.

          ### 3. Подпись — для работы в LiveContainer

          **Привилегированные entitlements (например `com.apple.private.skip-library-validation`)
          в ad-hoc подписи дают `SIGKILL - CODESIGNING` при запуске из LC.**

          Решение: **пустой `natsuk1.entitlements`** (`<dict></dict>`).
          `ldid -S` без аргумента. Работает и в LC и через sideload.

          ### 4. Сборка — грабли

          - `#include <mach/mach_vm.h>` → **`error: mach_vm.h unsupported`** в iPhoneOS SDK.
            Extern вручную:
            ```c
            extern kern_return_t mach_vm_read_overwrite(vm_map_t, mach_vm_address_t,
                mach_vm_size_t, mach_vm_address_t, mach_vm_size_t*);
            extern kern_return_t mach_vm_write(vm_map_t, mach_vm_address_t,
                vm_offset_t, mach_msg_type_number_t);
            extern kern_return_t mach_vm_protect(vm_map_t, mach_vm_address_t,
                mach_vm_size_t, boolean_t, vm_prot_t);
            ```
          - `TCP_KEEPINIT`, `TCP_FASTOPEN_KEY`, `SO_REUSEPORT_LF` — **не в SDK**.
            Sweep только числами.
          - `@MainActor` + `nonisolated(unsafe) static let shared = Foo()` → ошибка.
            Использовать `final class Foo: ObservableObject, @unchecked Sendable`,
            `nonisolated(unsafe) static let shared`, `private init()`.
          - `sysctlbyname("hw.memsize")` возвращает UInt64, не строку.
            Читать через `uint64_t out`, не `char val[]`.

          ### 5. SwiftUI iOS 27

          - `.overlay(RespringView())` — **никогда**. WKWebView спамит GPU → CA UAF.
          - `List { if ... } else { ... } }` в корне → падает `optionalSelectionContainer`.
          - `.scaleEffect()` внутри `if` → `_ConditionalContent` ломается.
          - Мутации `@Published` из `Task {}` → race → UAF. Только `Timer`.

          ### 6. Установка — и LC и sideload

          - **Sideloadly / AltStore / TrollStore / ESign** — работают всегда.
          - **LiveContainer** — работает если entitlements пустые (см. §3).
            Ставить IPA, не .app.

          ### 7. Оффсеты (iOS 27.0 / 24A437)

          ```
          necp_open                      0xFFFFFFF00A4E411C
          necp_client_action             0xFFFFFFF00A4E5C28
          necp_client_copy_result        0xFFFFFFF00A4E7BE8
          necp_client_copy_result_inner  0xFFFFFFF00A4F26F0
          necp_client_add_flow           0xFFFFFFF00A4E843C
          necp_client_remove_flow        0xFFFFFFF00A4E93C4
          necp_client_copy_interface     0xFFFFFFF00A4EAC7C
          necp_client_sysctl_arena       0xFFFFFFF00A4EB704
          necp_client_copy_update        0xFFFFFFF00A4EC264
          necp_get_tlv_at_offset         0xFFFFFFF00A4C2034
          copyin                         0xFFFFFFF00A368EC0
          copyout                        0xFFFFFFF00A369A3C
          kalloc_type                    0xFFFFFFF00A200988
          kfree_type                     0xFFFFFFF00A201000
          kalloc_type_necp_flow          0xFFFFFFF007C62E68
          ```
          KBASE = `0xFFFFFFF007004000`, slide = `0x3D00000`.

          ### 8. Ghidra / CI

          - Jython 2.7: только 4 пробела. Валидация `python3 -c "import ast,sys; ast.parse(...)"`.
          - Warm = `-process -noanalysis` (1-3 мин). Cold = `-import` (24-90 мин).
          - Ключи кэша статические: `ghidra-project-24A437-v4`. **Никогда** `hashFiles`.
          - Символизация: `ipsw kernel symbolicate --signatures symbolicator/kernel/27.0/kexts`.
          - Kernelcache iOS 27 — уже Mach-O. Не декомпрессировать.

          ### 9. YAML

          - Один workflow: `fix_and_release.yml`.
          - C/Swift код длиннее 30 строк — в `reference/`, не в heredoc.
          - Heredoc-строки на 10 пробелах от начала файла.
          - `set +e` + `FAIL=1`, `grep -q -e "pattern"`.

          ### 10. Что дальше

          1. **mbuf / socket** — `sendmsg` + `msg_control`, неинициализированные mbuf.
          2. **IOKit** — `IOSurface`, `IOConnectCallMethod`, `IOHIDEvent`.
          3. **Ghidra** — `sbappendcontrol`, `m_copydata`, `sock_getsockopt`.

          После 2-3 попыток — менять подход.

          ### 11. Что НЕ делать

          - Не создавать `fix_and_test.yml` / `build_and_release.yml`.
          - Не пихать C/Swift в heredoc.
          - Не использовать `hashFiles('kernelcache/**')` в кэшах.
          - Не делать blind syscall sweep.
          - Не вызывать `proc_info(336)`, `csops(169)`, `task_info` sweep, `mach_port_names`.
          - Не ставить привилегированные entitlements.
          - Не мутировать `@Published` из `Task {}`.
          - Не класть `RespringView` в дерево SwiftUI.
          - Не вызывать `al_device_respring`.
          - Не коммитить `natsuk1.xcodeproj`.
          - Не доверять оффсетам без Ghidra.
          RULES_EOF

      - name: Update README
        run: |
          python3 - <<'PY_EOF'
          import re, os
          p = "README.md"
          s = open(p).read() if os.path.exists(p) else "# natsuk1\n"
          rules = open("/tmp/rules.md").read()
          ms = "<!-- AUTO-RULES-START -->"
          me = "<!-- AUTO-RULES-END -->"
          s = re.sub(re.escape(ms) + r".*?" + re.escape(me), "", s, flags=re.DOTALL)
          s = s.rstrip() + "\n\n" + ms + "\n" + rules + "\n" + me + "\n"
          open(p, "w").write(s)
          print("README size=%d" % len(s))
          PY_EOF

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <sys/sysctl.h>
          #include <sys/socket.h>
          #include <sys/utsname.h>
          #include <netinet/in.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include "nk_api.h"
          #include "nk_offsets.h"
          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;
          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)
          #define TRACE(s) LI("TRACE", ">>> " s)
          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, 0x01, uuid, (size_t)16, p, (size_t)1);
          }
          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56]; memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, 0x11, (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) { memcpy(fu, req, 16); fu[9] |= 0x01; }
              return r;
          }
          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex), "%04x: %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x",
                      i, buf[i+0], buf[i+1], buf[i+2], buf[i+3], buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11], buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }
          static int scan_kptr(const char *tag, const uint8_t *buf, int len, int maxhits) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v; memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= maxhits) break;
                  }
              }
              return found;
          }
          static void sysctl_str(const char *key) {
              char val[256]; size_t sz = sizeof(val); memset(val, 0, sizeof(val));
              if (sysctlbyname(key, val, &sz, NULL, 0) == 0) {
                  LI("A2", "%s = %s", key, val);
              }
          }
          static void sysctl_u64(const char *key) {
              uint64_t v = 0; size_t sz = sizeof(v);
              if (sysctlbyname(key, &v, &sz, NULL, 0) == 0) {
                  LI("A2", "%s = %llu", key, (unsigned long long)v);
              }
          }
          static void sysctl_u32(const char *key) {
              uint32_t v = 0; size_t sz = sizeof(v);
              if (sysctlbyname(key, &v, &sz, NULL, 0) == 0) {
                  LI("A2", "%s = %u", key, v);
              }
          }
          static int step_sysinfo(void) {
              TRACE("sysinfo");
              struct utsname u;
              if (uname(&u) == 0) {
                  LI("A1", "sysname=%s release=%s machine=%s",
                     u.sysname, u.release, u.machine);
                  LI("A1", "version=%s", u.version);
              }
              sysctl_str("kern.osproductversion");
              sysctl_str("kern.osversion");
              sysctl_str("kern.uuid");
              sysctl_str("kern.hostname");
              sysctl_str("hw.machine");
              sysctl_str("hw.model");
              sysctl_u64("hw.memsize");
              sysctl_u32("hw.ncpu");
              sysctl_u32("hw.cpufamily");
              sysctl_u32("hw.cputype");
              sysctl_u32("hw.cpusubtype");
              sysctl_str("hw.targettype");
              return 0;
          }
          static int step_necp_op04(void) {
              TRACE("necp op=0x04");
              int fd = nfd();
              if (fd < 0) { LE("B", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              nadd_flow(fd, cu, fu);
              uint8_t buf[2048]; memset(buf, 0, sizeof(buf));
              int c = (int)syscall(SYS_NECP_ACTION, fd, 0x04,
                                   (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
              LI("B", "op=0x04 ret=%d", c);
              if (c > 0 && c < 600) {
                  hexdump("BH", buf, c, 512);
                  scan_kptr("BK", buf, c, 8);
              }
              close(fd);
              return c;
          }
          static int step_necp_compare(void) {
              TRACE("necp op=0x03/0x10/0x1A");
              int fd = nfd();
              if (fd < 0) return -1;
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint32_t ops[] = {0x03, 0x10, 0x1A};
              for (size_t i = 0; i < 3; i++) {
                  uint8_t buf[2048]; memset(buf, 0, sizeof(buf));
                  int c = (int)syscall(SYS_NECP_ACTION, fd, ops[i],
                                       (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                  LI("B", "op=0x%02x ret=%d", ops[i], c);
                  if (c > 0 && c < 600) {
                      hexdump("BH", buf, c, 128);
                  }
              }
              close(fd);
              return 0;
          }
          static int step_getsockopt_hits(void) {
              TRACE("getsockopt hits");
              int s = socket(AF_INET, SOCK_STREAM, 0);
              if (s < 0) return -1;
              int levels[] = {0xffff, 0, 6, 41};
              const char *names[] = {"SOL", "IP", "TCP", "IPV6"};
              for (size_t li = 0; li < 4; li++) {
                  int hits = 0;
                  for (int opt = 0; opt <= 200; opt++) {
                      uint8_t buf[256]; socklen_t bl = sizeof(buf); memset(buf, 0, sizeof(buf));
                      if (getsockopt(s, levels[li], opt, buf, &bl) == 0 && bl > 4) {
                          hits++;
                          if (hits <= 3) {
                              LI("D", "%s opt=%d bl=%u", names[li], opt, (unsigned)bl);
                              hexdump("DH", buf, bl, 256);
                              scan_kptr("DK", buf, bl, 4);
                          }
                      }
                  }
                  LI("D", "%s hits=%d", names[li], hits);
              }
              close(s);
              return 0;
          }
          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v7.3 - FINAL");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");

              step_sysinfo();
              step_necp_op04();
              step_necp_compare();
              step_getsockopt_hits();

              TRACE("done");
              return 0;
          }
          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) { nk_log("[!] already running"); return 1; }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          void nk_necp_cancel(void) { g_cancel = 1; nk_log("[!] cancel requested"); }
          NECP_EOF

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .app"; exit 1; fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v7.3

          Empty entitlements — works in LiveContainer AND sideload.

          IPA: ${IPA_URL}
          AltStore: altstore://install?url=${IPA_URL}
          Scarlet: scarlet://install?url=${IPA_URL}
          ESign: esign://install?url=${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"

      - name: Commit README
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md natsuk1/Resources/natsuk1.entitlements
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "v7.3: empty entitlements for LiveContainer compat [skip ci]"
          git push