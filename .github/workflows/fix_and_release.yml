          w("Safe whitelist:")
          w("- getpid 20 getuid 24 getgid 47 getppid 39")
          w("- geteuid 25 getegid 43 gettid 286 getpgid 202")
          w("- socket getsockopt setsockopt sysctl uname always safe")

          sec(8, "Signature")
          w("- empty entitlements dict for LiveContainer and SideStore")
          w("- non-empty com.apple.private.* makes AMFI kill")
          w("- ldid -Snatsuk1/Resources/natsuk1.entitlements")
          w("- works Sideloadly AltStore TrollStore ESign LiveContainer SideStore")
          w("- does NOT work LiveContainer with privileged entitlements")

          sec(9, "Build gotchas")
          w("- mach_vm.h missing in SDK 26.5 declare manually")
          w("- TCP_KEEPINIT etc missing in SDK")
          w("- @MainActor plus nonisolated unsafe static shared is error")
          w("- sysctlbyname hw.memsize returns UInt64")
          w("- nk_offsets.h must define NK_SYSENT_BASE and NK_SYSENT_COUNT")
          w("- GrappaHelper 10 static tokens confirmed working never collapse")

          sec(10, "SwiftUI iOS 27")
          w("- .overlay(RespingView) CA UAF SIGSEGV")
          w("- List if cond Section else Section crash")
          w("- .scaleEffect inside if breaks _ConditionalContent")
          w("- @Published from Task race UAF")

          sec(11, "Offsets")
          w("- KBASE 0xFFFFFFF007004000")
          w("- SLIDE 0x3D00000")
          w("- SYSENT_BASE 0xFFFFFFF007C192A0")
          off = [
              ("necp_open", "0xFFFFFFF00A4E411C"),
              ("necp_client_action", "0xFFFFFFF00A4E5C28"),
              ("necp_client_add_flow", "0xFFFFFFF00A4E843C"),
              ("necp_client_remove_client", "0xFFFFFFF00A4E76F4"),
              ("necp_client_remove_flow", "0xFFFFFFF00A4E93C4"),
              ("necp_client_copy_list", "0xFFFFFFF00A4E80FC"),
              ("necp_client_copy_result", "0xFFFFFFF00A4E7BE8"),
