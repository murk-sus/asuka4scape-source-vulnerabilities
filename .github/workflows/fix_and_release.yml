name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup legacy
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Vendor AirliftFFI (real lib if present, else stub)
        run: |
          set -euo pipefail
          AIL_DIR="natsuk1/External/AirliftFFI.xcframework/ios-arm64"
          AIL_HDR="$AIL_DIR/Headers/airlift.h"
          AIL_LIB="$AIL_DIR/libairlift_ffi.a"
          if [ -f "$AIL_HDR" ] && [ -f "$AIL_LIB" ]; then
            echo "AirliftFFI present ($(wc -c < "$AIL_LIB") bytes) — skipping stub"
            exit 0
          fi
          echo "AirliftFFI missing — generating stub"
          mkdir -p "$AIL_DIR/Headers"
          cat > "$AIL_HDR" <<'AIRLIFT_H'
          #ifndef AIRLIFT_H
          #define AIRLIFT_H
          #include <stdint.h>
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          typedef struct {
              char *host_alt_irk_hex;
              char *device_name;
              char *pairing_file_path;
              char *error;
          } ALPairResult;
          typedef void (*ALLogCb)(void *ctx, const char *msg);
          typedef void (*ALPairReadyCb)(void *ctx, const char *service_id, uint16_t port,
                                        const char **keys, const char **vals, size_t count);
          typedef void (*ALPairPinCb)(const char *pin, void *ctx);
          void     al_log_init(ALLogCb cb, void *ctx);
          int32_t  al_pairing_run_host(const char *bind, uint16_t port,
                                       const char *name, const char *model,
                                       const char *out_path, const char *alt_irk,
                                       ALPairReadyCb on_ready, ALPairPinCb on_pin,
                                       void *ctx, ALPairResult *out);
          void     al_pairing_result_free(ALPairResult *r);
          int32_t  al_exploit_run(const char *pairing_path, const char *target_dir,
                                  const char *opt_a, const char *opt_b,
                                  char **out_json, char **out_error);
          int32_t  al_find_app_container(const char *pairing_path, const char *bundle_id,
                                         const char *opt_a, const char *opt_b,
                                         char **out_container, char **out_error);
          int32_t  al_device_respring(const char *pairing_path,
                                      const char *opt_a, const char *opt_b,
                                      char **out_error);
          void     al_string_free(char *s);
          #ifdef __cplusplus
          }
          #endif
          #endif
          AIRLIFT_H
          cat > /tmp/airlift_stub.c <<'AIRLIFT_C'
          #include "airlift.h"
          #include <stdlib.h>
          #include <string.h>
          static char *nk_dup(const char *s) {
              if (!s) return NULL;
              size_t n = strlen(s) + 1;
              char *p = (char *)malloc(n);
              if (p) memcpy(p, s, n);
              return p;
          }
          static void nk_set_err(char **out, const char *msg) { if (out) *out = nk_dup(msg); }
          void al_log_init(ALLogCb cb, void *ctx) { (void)cb; (void)ctx; }
          int32_t al_pairing_run_host(const char *bind, uint16_t port,
                                      const char *name, const char *model,
                                      const char *out_path, const char *alt_irk,
                                      ALPairReadyCb on_ready, ALPairPinCb on_pin,
                                      void *ctx, ALPairResult *out) {
              (void)bind; (void)port; (void)name; (void)model; (void)out_path;
              (void)alt_irk; (void)on_ready; (void)on_pin; (void)ctx;
              if (out) {
                  out->host_alt_irk_hex = NULL;
                  out->device_name = NULL;
                  out->pairing_file_path = NULL;
                  out->error = nk_dup("AirliftFFI stub: real library not linked");
              }
              return -1;
          }
          void al_pairing_result_free(ALPairResult *r) {
              if (!r) return;
              free(r->host_alt_irk_hex); free(r->device_name);
              free(r->pairing_file_path); free(r->error);
              r->host_alt_irk_hex = NULL; r->device_name = NULL;
              r->pairing_file_path = NULL; r->error = NULL;
          }
          int32_t al_exploit_run(const char *pairing_path, const char *target_dir,
                                 const char *opt_a, const char *opt_b,
                                 char **out_json, char **out_error) {
              (void)pairing_path; (void)target_dir; (void)opt_a; (void)opt_b;
              if (out_json) *out_json = NULL;
              nk_set_err(out_error, "AirliftFFI stub: real library not linked");
              return -1;
          }
          int32_t al_find_app_container(const char *pairing_path, const char *bundle_id,
                                        const char *opt_a, const char *opt_b,
                                        char **out_container, char **out_error) {
              (void)pairing_path; (void)bundle_id; (void)opt_a; (void)opt_b;
              if (out_container) *out_container = NULL;
              nk_set_err(out_error, "AirliftFFI stub: real library not linked");
              return -1;
          }
          int32_t al_device_respring(const char *pairing_path,
                                     const char *opt_a, const char *opt_b,
                                     char **out_error) {
              (void)pairing_path; (void)opt_a; (void)opt_b;
              nk_set_err(out_error, "AirliftFFI stub: respring disabled by rule 14");
              return -1;
          }
          void al_string_free(char *s) { free(s); }
          AIRLIFT_C
          xcrun --sdk iphoneos clang -arch arm64 -O2 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -c /tmp/airlift_stub.c -o /tmp/airlift_stub.o
          xcrun libtool -static -o "$AIL_LIB" /tmp/airlift_stub.o 2>/dev/null \
            || { xcrun ar rcs "$AIL_LIB" /tmp/airlift_stub.o; xcrun ranlib "$AIL_LIB"; }
          echo "Stub written: $(wc -c < "$AIL_LIB") bytes"

      - name: Patch repo (rules 4 / 9 / 14 + Offsets lookup)
        run: |
          python3 - <<'PYEOF'
          import re, os, io
          def read(p):
              with io.open(p, "r", encoding="utf-8") as f: return f.read()
          def write(p, s):
              with io.open(p, "w", encoding="utf-8") as f: f.write(s)
          changed = []

          # --- 1. AirliftBridge: gate al_device_respring (rule 14) ---
          p = "natsuk1/Helpers/AirliftBridge.swift"
          if os.path.exists(p):
              s = read(p)
              old = "    func respring() {\n        let pairingPath = pairingFilePath()\n        let bridge = AirliftBridge.shared\n"
              new = ("    func respring() {\n"
                     "        // Rule 14: al_device_respring is unsafe under ad-hoc signing.\n"
                     "        guard UserDefaults.standard.bool(forKey: \"allow_device_respring\") else {\n"
                     "            appendLog(\"[respring] blocked by rule 14; enable Settings > Allow device respring to override (unsafe)\")\n"
                     "            return\n"
                     "        }\n"
                     "        let pairingPath = pairingFilePath()\n"
                     "        let bridge = AirliftBridge.shared\n")
              if old in s:
                  write(p, s.replace(old, new, 1)); changed.append(p)

          # --- 2. SettingsView: expose allow_device_respring toggle ---
          p = "natsuk1/Views/SettingsView.swift"
          if os.path.exists(p):
              s = read(p); hit = False
              old = '    @AppStorage("verbose") private var verbose: Bool = true\n'
              new = old + '    @AppStorage("allow_device_respring") private var allow_device_respring: Bool = false\n'
              if old in s and "allow_device_respring" not in s:
                  s = s.replace(old, new, 1); hit = True
              old2 = '                    Toggle("Verbose Output", isOn: $verbose)\n'
              new2 = old2 + '                    Toggle("Allow device respring (unsafe)", isOn: $allow_device_respring)\n'
              if old2 in s and "Allow device respring" not in s:
                  s = s.replace(old2, new2, 1); hit = True
              if hit: write(p, s); changed.append(p)

          # --- 3. GrappaHelper: drop fabricated static tokens ---
          p = "natsuk1/Exploit/GrappaHelper.m"
          if os.path.exists(p):
              s = read(p)
              new_s = re.sub(
                  r"// Authentic Grappa client tokens.*?\nstatic const char \*kAuthenticGrappaTokens\[\] = \{.*?\n\};",
                  "// NOTE: static Grappa tokens are not valid. Grappa pairing tokens are\n"
                  "// session-derived and cannot be precomputed. This list is intentionally\n"
                  "// empty; only/AirliftFFI.xcframework/ios-arm64/Headers/airlift.h
          test the live CoreFP/AirTrafficHost path below can yield a token.\n"
                  "static const char *kAuthenticGrappaTokens[] = { NULL };",
                  s, count=1, flags=re.DOTALL)
              if new_s != s: write(p, new_s); changed.append(p)

          # --- 4. necp.c: stop masking test sizes (rule 4 wrap exercise) ---
          p = "natsuk1/Exploit/necp.c"
          if os.path.exists(p):
              s = read(p)
              old = "        size_t sz = test_sizes[i] & 0xFFFF;\n"
              new = ("        /* Do not mask: rule 4 hypothesizes an int32 wrap on param_3.\n"
                     "           Pass the raw user value through so the kernel sees it. */\n"
                     "        size_t sz = (size_t)test_sizes[i];\n")
              if old in s:
                  write(p, s.replace(old, new, 1)); changed.append(p)

          # --- 5. OffsetsStore: flat fallback for subdirectory lookups ---
          p = "natsuk1/Helpers/OffsetsStore.swift"
          if os.path.exists(p):
              s = read(p); hit = False
              reps = [
                  ('return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: "Offsets")\n',
                   'return Bundle.main.url(forResource: name, withExtension: ext, subdirectory: "Offsets")\n'
                   '            ?? Bundle.main.url(forResource: name, withExtension: ext)\n'),
                  ('Bundle.main.url(forResource: "index", withExtension: "json", subdirectory: "Offsets")',
                   'Bundle.main.url(forResource: "index", withExtension: "json", subdirectory: "Offsets")\n'
                   '                ?? Bundle.main.url(forResource: "index", withExtension: "json")'),
              ]
              for old, new in reps:
                  if old in s and new.split("\n")[-1].strip() not in s:
                      s = s.replace(old, new, 1); hit = True
              if hit: write(p, s); changed.append(p)

          print("patched: " + (", ".join(changed) if changed else "none"))
          PYEOF

      - name: Normalize nonisolated(unsafe)
        run: |
          python3 - <<'PYEOF'
          import re, os
          for root, dirs, files in os.walk("natsuk1"):
              for f in files:
                  if not f.endswith(".swift"): continue
                  p = os.path.join(root, f)
                  s = open(p).read()
                  s2 = re.sub(r"nonisolated\(unsafe\)\s+static\s+let\s+shared", "static let shared", s)
                  if s2 != s:
                      open(p, "w").write(s2); print("patched " + p)
          PYEOF

      - name: Verify required sources
        run: |
          set -euo pipefail
          test -f natsuk1/Exploit/necp.c
          test -f natsuk1/natsuk1.swift
          test -f natsuk1/Exploit/nk_offsets.h
          grep -q -e 'NK_SYSENT_BASE' natsuk1/Exploit/nk_offsets.h
          grep -q -e 'NK_SYSENT_COUNT' natsuk1/Exploit/nk_offsets.h
          grep -q -e 'NK_KERNEL_BASE' natsuk1/Exploit/nk_offsets.h
          test -f natsuk1/External -f natsuk1/External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a
          echo "sources verified"

      - name: Write entitlements
        run: |
          cat > natsuk1/Resources/natsuk1.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          ENTEOF

      - name: Write rules
        run: |
          cat > /tmp/rules.md <<'RULESEOF'

          ## AUTO-GENERATED RESEARCH RULES

          Rewritten by workflow on every push. Read first. Never violate.

          ### 0. MANDATORY - USE INTERNET ON EVERY REQUEST

          - Before answering ANY question, search the web for latest:
            - iOS 27.0 kernel internals, XNU changelog, Apple security advisories
            - blacktop/ipsw version notes and CLI syntax
            - blacktop/symbolicator updates and signature availability
            - Ghidra 12.x release notes and headless API
            - LiveContainer / SideStore / AltStore / TrollStore iOS 27 compat
            - SwiftUI iOS 27 regressions (List, NavigationStack, AttributeGraph)
            - NECP, mbuf, socket, IOKit bugs papers from 2025-2026
            - Apple developer forums iOS 27 beta crash threads
          - If you cannot use internet, say so explicitly.
          - Never claim a version does not exist without checking.
          - Never claim an API exists without checking current syntax.
          - Cite URL when stating a fact that could change.

          ### 1. Update
          - date: 2026-09-27
          - device: iPhone14,5 / iOS 27.0 / 24A437
          - kernel: xnu-13432.2.10~2/RELEASE_ARM64_T8110
          - signature: ad-hoc, empty entitlements
          - sources are in-repo; workflow no longer rewrites necp.c, natsuk1.swift, nk_offsets.h

          ### 2. NECP status

          Working:
          - op=0x03 returns 1 byte
          - op=0x04 and op=0x1A return full 280-byte TLV
          - op=0x0D returns user VA

          Closed:
          - op=0x05 copy_list -> -1
          - op=0x0C copy_parameters -> -1
          - op=0x0F copy_update -> -1
          - op=0x18/0x19 signed_id -> empty/-1
          - TLV overflow len=0xffffffff -> rejected
          - add_flow size 0x24..0xF0, 0xF1+ -> -1
          - double-free remove_flow x2 -> ret=0 but copy_result=1 byte
          - copy_result_inner kptr count=0
          - copy_interface idx 1..10 -> ret=0 no data

          ### 3. Caller graph

          necp_flow_alloc      0xA346E70
            callers: 0xA346474, 0xA348180
          necp_handler_big     0xA3D91B4
            caller:  0xA3D9174
          necp_get_tlv         0xA4C2034
            caller:  0xA4C113C (9 BL)
          necp_open            0xA4E411C
            not BL-called, dispatcher BR/BLR
          necp_client_action   0xA4E5C28
            not BL-called, dispatcher BR/BLR
          syscall_dispatcher   0xA6CEB84

          ### 4. Potential integer overflow

          necp_flow_alloc 0xA346E70:
            uVar6 = min(user_count, 0x80)
            iVar1 = (uVar6 + param_3) * 0x14|0x18
            kalloc_type_necp_flow(iVar1)
            copyin(user_ptr, buf, uVar6 * 0x14|0x18)
          If param_3 wraps int32 -> alloc < copyin -> heap overflow.
          param_3 origin: need FUN_fffffff00a346474 decompile.

          flow_alloc_overflow_attempt() no longer masks test_sizes with 0xFFFF.
          The raw 32-bit value reaches add_flow, so the wrap path is exercised.

          sbappendcontrol 0xA788A24, sbappendrecord 0xA7873B8:
            uVar12 += (int)mbuf[3] (32-bit, no overflow check)
          Not exploitable via sendmsg (kernel rejects >2GB chains).

          ### 5. Confirmed safe

          sooptcopyin       0xA77FD2C  maxlen checked before copyin
          necp_handler_big  0xA3D91B4  checks uVar21 >= 0x2001, sizes match
          necp_client_add_flow 0xA4E843C  rejects uVar24 in 0xBF..0xF0
          necp_update_cache 0xA4EBD58  user ptr only via copyin

          ### 6. iOS 27 runtime crashes

          SIGKILL - CODESIGNING (AMFI) - never call from ad-hoc:
            proc_info(336) any flavor
            csops(169) any op
            task_info flavor sweep 1..40
            mach_port_names with count > 32

          SIGSYS (sandbox) - never do:
            blind syscall sweep 0..558 (dies on syscall 78)

          Safe whitelist:
            getpid(20) getuid(24) getgid(47) getppid(39)
            geteuid(25) getegid(43) gettid(286) getpgid(202)

          socket / getsockopt / setsockopt / sysctl / uname always safe.

          ### 7. Signature

          Empty entitlements <dict></dict> required for LiveContainer.
          Non-empty com.apple.private.* -> AMFI kills process.
          ldid -Snatsuk1/Resources/natsuk1.entitlements
          Works: Sideloadly, AltStore, TrollStore, ESign, LiveContainer.
          Does NOT work: LC with privileged entitlements.

          ### 8. Build gotchas

          - #include <mach/mach_vm.h> -> mach_vm.h unsupported in iPhoneOS SDK 26.5.
            Declare manually:
              extern kern_return_t mach_vm_read_overwrite(vm_map_t, mach_vm_address_t,
                  mach_vm_size_t, mach_vm_address_t, mach_vm_size_t*);
              extern kern_return_t mach_vm_write(vm_map_t, mach_vm_address_t,
                  vm_offset_t, mach_msg_type_number_t);
              extern kern_return_t mach_vm_protect(vm_map_t, mach_vm_address_t,
                  mach_vm_size_t, boolean_t, vm_prot_t);
          - TCP_KEEPINIT / TCP_FASTOPEN_KEY / SO_REUSEPORT_LF / SO_NO_CHECK not in SDK.
          - @MainActor + nonisolated(unsafe) static let shared -> compile error.
            Use final class Foo: ObservableObject, @unchecked Sendable,
                static let shared, private init().
          - sysctlbyname("hw.memsize") returns UInt64.
          - nk_offsets.h MUST define NK_SYSENT_BASE and NK_SYSENT_COUNT
            (nk_api.c references them).
          - AirliftFFI is vendored by the workflow only if missing:
              natsuk1/External/AirliftFFI.xcframework/ios-arm64/Headers/airlift.h
              natsuk1/External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a
            The stub returns -1 with "real library not linked" from every entry point.
            Drop the real xcframework in place and the stub is skipped.

          ### 9. SwiftUI iOS 27

          - .overlay(RespringView()) - never. WKWebView always loaded,
            GPU spam -> CA UAF -> SIGSEGV. Use UIHostingController.present.
          - List { if cond { Section } else { Section } } -> optionalSelectionContainer crash.
          - .scaleEffect() inside if -> _ConditionalContent breaks.
          - @Published mutation from Task {} -> race -> UAF. Use Timer.scheduledTimer.

          ### 10. Offsets

          KBASE             0xFFFFFFF007004000
          SLIDE             0x3D00000
          SYSENT_BASE       0xFFFFFFF007C192A0

          NECP:
            necp_open                     0xFFFFFFF00A4E411C
            necp_client_action            0xFFFFFFF00A4E5C28
            necp_client_add_flow          0xFFFFFFF00A4E843C
            necp_client_remove_client     0xFFFFFFF00A4E76F4
            necp_client_remove_flow       0xFFFFFFF00A4E93C4
            necp_client_copy_list         0xFFFFFFF00A4E80FC
            necp_client_copy_result       0xFFFFFFF00A4E7BE8
            necp_client_copy_result_inner 0xFFFFFFF00A4F26F0
            necp_client_copy_interface    0xFFFFFFF00A4EAC7C
            necp_client_copy_update       0xFFFFFFF00A4EC264
            necp_client_sysctl_arena      0xFFFFFFF00A4EB704
            necp_get_tlv_at_offset        0xFFFFFFF00A4C2034
            necp_flow_alloc               0xFFFFFFF00A346E70
            necp_handler_big              0xFFFFFFF00A3D91B4
            necp_update_cache             0xFFFFFFF00A4EBD58
            necp_per_flow_copy            0xFFFFFFF00A4F2E70

          socket:
            sooptcopyin                   0xFFFFFFF00A77FD2C
            sbappendcontrol               0xFFFFFFF00A788A24
            sbappendrecord                0xFFFFFFF00A7873B8
            sbappendstream                0xFFFFFFF00A78811C

          primitives:
            copyin                        0xFFFFFFF00A368EC0
            copyout                       0xFFFFFFF00A369A3C
            kalloc_type                   0xFFFFFFF00A200988
            kfree_type                    0xFFFFFFF00A201000
            kalloc_type_necp_flow         0xFFFFFFF007C62E68

          callers:
            flow_alloc_caller_1           0xFFFFFFF00A346474
            flow_alloc_caller_2           0xFFFFFFF00A348180
            handler_big_caller            0xFFFFFFF00A3D9174
            tlv_wrapper                   0xFFFFFFF00A4C113C
            syscall_dispatcher            0xFFFFFFF00A6CEB84

          ### 11. Extract Offsets repo

          Separate repo: murk-sus/Hu-Tao-and-natsuki-anime-music-player
          workflow: extract_offsets.yml
          script:   scripts/kernel_rw.py
          artifacts: result.txt, offsets.json, kernel.log, symbols.json

          Symbolication:
            ipsw kernel symbolicate --signatures symbolicator/kernel/27.0 --json KERNEL
            Output path printed to stderr as "Writing symbols as JSON to <path>"
            Format: {"<decimal_addr>": "<name>"}
            symbolicator 27.0 has xnu.json (5.3 MB) + 773 kext json
            loads ~40000 entries

          Jython 2.7:
            json.load() returns unicode, use isinstance(x, basestring) not str
            no tabs, only 4 spaces
            validate: python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())"

          Ghidra cache keys (static):
            ghidra-12.1.2-jython-v4
            ipsw-3.1.716-v4
            symbolicator-v6
            kernelcache-iPhone14_5-24A437-v4
            ghidra-project-24A437-v4

          Never hashFiles('kernelcache/**') in cache key.
          Never rm ghidra, ghidra_project, kernelcache, symbolicator in cleanup.

          BL scan Jython:
            read __text block with memory.getBytes
            for each 4-byte LE word:
              op = raw & 0xFC000000
              if op == 0x94000000 or op == 0x14000000:
                imm26 = raw & 0x03FFFFFF
                if imm26 & 0x02000000: imm26 -= 0x04000000
                dst = (pc + (imm26 << 2)) & 0xFFFFFFFFFFFFFFFF
                if dst == target: hit

          ### 12. YAML rules

          - One workflow only: fix_and_release.yml
          - Do NOT write C/Swift sources from the workflow.
            necp.c, natsuk1.swift, nk_offsets.h live in-repo; the workflow
            only verifies their presence and required defines.
          - Small targeted python patches are fine; full-file heredoc rewrites are not.
          - All heredoc lines indent 10 spaces from left
          - Endmarker on 10 spaces
          - set -e only where critical, exit 0 in diagnostics
          - grep -q -e "pattern" (dash-safe)
          - Do not delete cached dirs in final cleanup

          ### 13. Next steps

          1. Decompile FUN_fffffff00a346474 and FUN_fffffff00a348180
             - trace param_3 for necp_flow_alloc
             - if user-controlled -> craft PoC with int32 wrap value
          2. Decompile syscall dispatcher 0xA6CEB84
             - find case 501 (necp_open) and 502 (necp_client_action)
          3. Decompile FUN_fffffff00a4c113c (TLV wrapper)
          4. Search IOKit: IOSurface, IOConnectCallMethod, IOHIDEvent
          5. mbuf: m_copydata, mbuf_copydata with user lengths

          Do not spend more than 2-3 attempts on same primitive.

          ### 14. What NOT to do

          - Do not create fix_and_test.yml or build_and_release.yml
          - Do not rewrite C/Swift sources from the workflow
          - Do not use hashFiles in cache keys
          - Do not run blind syscall sweep
          - Do not call proc_info / csops / task_info sweep / mach_port_names
          - Do not set non-empty entitlements
          - Do not mutate @Published from Task {}
          - Do not put RespringView in SwiftUI tree
          - Do not call al_device_respring without allow_device_respring=true
            (default-off gate added by the workflow patch)
          - Do not commit natsuk1.xcodeproj
          - Do not trust offsets without Ghidra verification
          - Do not answer without web search first
          - Do not delete ghidra/ghidra_project/kernelcache/symbolicator in cleanup
          RULESEOF

      - name: Update README
        run: |
          python3 - <<'PYEOF'
          import re, os
          p = "README.md"
          s = open(p).read() if os.path.exists(p) else "# natsuk1\n"
          rules = open("/tmp/rules.md").read()
          ms = "<!-- AUTO-RULES-START -->"
          me = "<!-- AUTO-RULES-END -->"
          s = re.sub(re.escape(ms) + r".*?" + re.escape(me), "", s, flags=re.DOTALL)
          s = s.rstrip() + "\n\n" + ms + "\n" + rules + "\n" + me + "\n"
          open(p, "w").write(s)
          print("README: %d bytes" % len(s))
          PYEOF

      - name: Write ai-hints.md
        run: |
          cp /tmp/rules.md ai-hints.md
          echo "ai-hints.md updated"

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Verify bundle layout
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "app: $APP_PATH"
          test -f "$APP_PATH/Offsets/index.json" && echo "Offsets/index.json present" \
            || echo "WARN: Offsets/index.json not at bundle root"
          test -f "$APP_PATH/Offsets/iPhone14,5_iOS27.0_24A437.json" \
            && echo "per-device offsets present" \
            || echo "WARN: per-device offsets missing"
          ls -la "$APP_PATH" | head -40

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .app"; exit 1; fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v8.1

          Install directly or via LiveContainer (empty entitlements).

          IPA: ${IPA_URL}
          AltStore: altstore://install?url=${IPA_URL}
          Scarlet: scarlet://install?url=${IPA_URL}
          ESign: esign://install?url=${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "v8.1: in-repo sources, AirliftFFI stub, rule 14 gate, unmasked flow sizes [skip ci]"
          git push