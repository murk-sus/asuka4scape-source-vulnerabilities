name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-${{ hashFiles('project.yml') }}
          restore-keys: |
            nk-

      - name: Install tools
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid     >/dev/null 2>&1 || brew install ldid
          command -v oxipng   >/dev/null 2>&1 || brew install oxipng

      - name: Cleanup
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          import re

          def drop_fn(src, sig):
              i = src.find(sig)
              if i < 0:
                  return src
              j = src.find("{", i)
              depth, k = 0, j
              while k < len(src):
                  if src[k] == "{":
                      depth += 1
                  elif src[k] == "}":
                      depth -= 1
                      if depth == 0:
                          break
                  k += 1
              end = k + 1
              while end < len(src) and src[end] == "\n":
                  end += 1
              start = i
              while start > 0 and src[start-1] == "\n":
                  start -= 1
              return src[:start] + src[end:]

          def edit(path, sigs=(), reps=()):
              try:
                  s = open(path).read()
              except FileNotFoundError:
                  return
              orig = s
              for sig in sigs:
                  s = drop_fn(s, sig)
              for old, new in reps:
                  s = s.replace(old, new)
              if s != orig:
                  open(path, "w").write(s)
                  print("edited " + path)

          edit("natsuk1/Helpers/NetworkStatus.swift",
               sigs=["static func summarize(deviceIP:",
                     "static func tunnelHostCandidates(",
                     "static func host(_ value:",
                     "static func isOwnAddress(_ deviceIP:"])

          p = "natsuk1/Helpers/NetworkStatus.swift"
          try:
              s = open(p).read()
          except FileNotFoundError:
              s = None
          if s is not None:
              orig = s
              s = re.sub(
                  r",\s*\n?\s*netmask:\s*cur\.pointee\.ifa_netmask\.flatMap\(numericHost\)\s*\)",
                  ")", s)
              s = re.sub(r"\n\s*let netmask:\s*String\?", "", s)
              if s != orig:
                  open(p, "w").write(s)
                  print("edited " + p)

          edit("natsuk1/Helpers/DeviceName.swift",
               sigs=["static func full()"])

          edit("natsuk1/Helpers/OffsetsStore.swift",
               sigs=["nonisolated static var activeVersion"])

          edit("natsuk1/Views/DeviceInfoView.swift",
               sigs=["private func machineID()"],
               reps=[('row("Identifier", machineID())',
                      'row("Identifier", DeviceName.machineID())')])

          edit("natsuk1/Views/AirliftView.swift",
               reps=[("if let pin = airlift.pairPIN {",
                      "if airlift.pairPIN != nil {")])
          PY

          oxipng -o max --strip safe natsuk1/Resources/Assets.xcassets/AppIcon.appiconset/1024x1024.png || true

          if ! grep -q '.swiftpm/' .gitignore; then
            printf '\n# Swift\n*.xcworkspace\n.swiftpm/\n.build/\nPackage.resolved\n\n# Debug\n*.dSYM\n' >> .gitignore
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: fix NetworkStatus call site, drop dead code [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          if [ ! -d natsuk1.xcodeproj ]; then
            xcodegen generate
          fi

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' \
                       -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) \
                -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 \
            && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"