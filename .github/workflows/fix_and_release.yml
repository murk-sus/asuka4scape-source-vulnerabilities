          w("                StatusDot(status: state.status)")
          w("            }")
          w("        } header: {")
          w("            Label(\"Runtime\", systemImage: \"waveform.path.ecg\")")
          w("        }")
          w("    }")
          w("")
          w("    @ViewBuilder")
          w("    private func row(label: String, value: String) -> some View {")
          w("        let isSet = value != \"-\" && value != \"—\" && !value.isEmpty")
          w("        HStack {")
          w("            Text(label)")
          w("            Spacer()")
          w("            Text(value)")
          w("                .font(.system(size: 12, design: .monospaced))")
          w("                .foregroundStyle(isSet ? Color.green : Color.secondary)")
          w("                .shadow(color: isSet ? Color.green.opacity(0.65) : Color.clear, radius: 4)")
          w("                .lineLimit(1)")
          w("                .truncationMode(.middle)")
          w("        }")
          w("    }")
          w("}")
          io.open("natsuk1/Views/RuntimeView.swift", "w").write("\n".join(e) + "\n")
          print("RuntimeView rewritten")

          # AirliftView.swift
          a = []
          w = a.append
          w("import SwiftUI")
          w("import UIKit")
          w("import Combine")
          w("")
          w("struct AirliftView: View {")
          w("    @EnvironmentObject var airlift: AirliftBridge")
          w("    @State private var loopbackVPNUp: Bool = NetworkStatus.loopbackVPNUp()")
          w("    @State private var tunnelIP: String? = NetworkStatus.tunnelIP()")
          w("    @State private var deviceIP: String? = NetworkStatus.deviceIP()")
          w("    @State private var copied = false")
          w("    @State private var pairedTick = 0")
          w("")
          w("    private let ticker = Timer.publish(every: 0.5, on: .main, in: .common).autoconnect()")
          w("")
          w("    var body: some View {")
          w("        List {")
          w("            statusSection")
          w("            sessionSection")
          w("            pairingStatusSection")
          w("            pairingButtonsSection")
          w("            targetSection")
          w("            exploitSection")
          w("            logSection")
          w("            logActionsSection")
          w("        }")
          w("        .listStyle(.insetGrouped)")
          w("        .navigationTitle(\"Airlift\")")
          w("        .navigationBarTitleDisplayMode(.inline)")
          w("        .onAppear { refresh(); pairedTick &+= 1 }")
          w("        .onReceive(ticker) { _ in refresh() }")
          w("        .onChange(of: airlift.state) { _, _ in pairedTick &+= 1 }")
          w("        .refreshable { refresh(); pairedTick &+= 1 }")
          w("    }")
          w("")
          w("    private var statusSection: some View {")
          w("        Section {")
          w("            HStack(spacing: 16) {")
          w("                ZStack {")
          w("                    Circle()")
          w("                        .fill(loopbackVPNUp ? Color.green.opacity(0.15) : Color.orange.opacity(0.15))")
          w("                        .frame(width: 72, height: 72)")
          w("                    Image(systemName: loopbackVPNUp ? \"checkmark.shield.fill\" : \"exclamationmark.shield.fill\")")
          w("                        .font(.system(size: 32, weight: .semibold))")
          w("                        .foregroundStyle(loopbackVPNUp ? .green : .orange)")
          w("                }")
          w("                VStack(alignment: .leading, spacing: 4) {")
          w("                    Text(\"LocalDevVPN\").font(.headline)")
          w("                    Text(loopbackVPNUp ? \"Connected\" : \"Not connected\")")
          w("                        .font(.subheadline)")
          w("                        .foregroundStyle(loopbackVPNUp ? .green : .orange)")
          w("                    if let t = tunnelIP {")
          w("                        Text(\"Tunnel \\(t)\")")
          w("                            .font(.system(size: 12, design: .monospaced))")
          w("                            .foregroundStyle(.secondary)")
          w("                    }")
          w("                }")
          w("                Spacer()")
          w("            }")
          w("            .padding(.vertical, 8)")
          w("        } header: {")
          w("            Label(\"Current status\", systemImage: \"shield.lefthalf.filled\")")
          w("        }")
          w("    }")
          w("")
          w("    private var sessionSection: some View {")
          w("        Section {")
          w("            HStack {")
          w("                Text(\"Tunnel IP\")")
          w("                Spacer()")
          w("                Text(tunnelIP ?? \"—\")")
          w("                    .font(.system(size: 12, design: .monospaced))")
          w("                    .foregroundStyle(tunnelIP != nil ? .green : .secondary)")
          w("                    .shadow(color: tunnelIP != nil ? Color.green.opacity(0.55) : Color.clear, radius: 3)")
          w("            }")
          w("            HStack {")
          w("                Text(\"Device IP\")")
