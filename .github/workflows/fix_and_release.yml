name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-${{ hashFiles('project.yml') }}
          restore-keys: |
            nk-

      - name: Install tools
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid     >/dev/null 2>&1 || brew install ldid
          command -v oxipng   >/dev/null 2>&1 || brew install oxipng

      - name: Cleanup
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f natsuk1/Exploit/NECP/necp.c
          rmdir natsuk1/Exploit/NECP 2>/dev/null || true

          if [ -f natsuk1/Exploit/Core/nk_api.c ]; then
            perl -i -pe 's/return nk_necp_run\(\);/return nk_run();/' natsuk1/Exploit/Core/nk_api.c
          fi
          if [ -f natsuk1/Exploit/Core/nk_api.h ]; then
            perl -i -ne 'print unless /^\s*int nk_necp_run\(void\);\s*$/ || /^\s*void nk_necp_cancel\(void\);\s*$/' natsuk1/Exploit/Core/nk_api.h
          fi

          printf '%s\n' '#ifndef NK_OFFSETS_H' '#define NK_OFFSETS_H' '#define NK_KERNEL_BASE                0xFFFFFFF007004000ULL' '#define NK_SYSENT_BASE                0xFFFFFFF007C192A0ULL' '#define NK_SYSENT_COUNT               558' '#endif' > natsuk1/Exploit/Core/nk_offsets.h

          if [ -f natsuk1/App/natsuk1.swift ]; then
            perl -i -pe 's/nk_necp_run\(\)/nk_run()/g' natsuk1/App/natsuk1.swift
            perl -i -ne 'print unless /^\s*nk_necp_cancel\(\);\s*$/' natsuk1/App/natsuk1.swift
            perl -i -ne 'print unless /\@Published var previousCrash:/ || /\@Published var showCrashLog:/ || /CrashLog\.shared\.recoverPreviousSession\(\)/' natsuk1/App/natsuk1.swift
          fi

          if [ -f natsuk1/Helpers/CrashLog.swift ]; then
            perl -0777 -i -pe 's/\n    func recoverPreviousSession\(\)[^{]*\{.*?\n    \}\n/\n/gs' natsuk1/Helpers/CrashLog.swift
            perl -0777 -i -pe 's/\n    func clearPreviousCrash\(\)[^{]*\{.*?\n    \}\n/\n/gs' natsuk1/Helpers/CrashLog.swift
          fi

          if [ -f natsuk1/Helpers/AirliftBridge.swift ]; then
            perl -0777 -i -pe 's/\n    func respring\(\) \{.*?\n    \}\n/\n/gs' natsuk1/Helpers/AirliftBridge.swift
            perl -0777 -i -pe 's/\n    func findContainer\(bundleID: String\) async -> String\? \{.*?\n    \}\n/\n/gs' natsuk1/Helpers/AirliftBridge.swift
          fi

          NS=natsuk1/Helpers/NetworkStatus.swift
          if [ -f "$NS" ]; then
            perl -0777 -i -pe 's/Interface\(name: name, ipv4: ipv4,\s*\n\s*netmask:[^\n]*?\)\)\)/Interface(name: name, ipv4: ipv4)/g' "$NS"
            perl -i -ne 'print unless /^\s+let netmask:\s*String\?$/' "$NS"
            perl -0777 -i -pe 's/\n\s*static func summarize\(deviceIP:[^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
            perl -0777 -i -pe 's/\n\s*static func tunnelHostCandidates\([^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
            perl -0777 -i -pe 's/\n\s*static func host\(_ value:[^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
            perl -0777 -i -pe 's/\n\s*static func isOwnAddress\(_ deviceIP:[^\n]*\{.*?\n\s*\}\n/\n/gs' "$NS" || true
          fi

          perl -0777 -i -pe 's/\n\s*static func full\(\)[^\n]*\{.*?\n\s*\}\n/\n/gs' natsuk1/Helpers/DeviceName.swift 2>/dev/null || true
          perl -0777 -i -pe 's/\n\s*nonisolated static var activeVersion:[^\n]*\{.*?\n\s*\}\n/\n/gs' natsuk1/Helpers/OffsetsStore.swift 2>/dev/null || true
          perl -i -pe 's/row\("Identifier", machineID\(\)\)/row("Identifier", DeviceName.machineID())/' natsuk1/Views/DeviceInfoView.swift 2>/dev/null || true

          AV=natsuk1/Views/AirliftView.swift
          if [ -f "$AV" ]; then
            perl -i -pe 's/if airlift\.pairPIN != nil \{/if let pin = airlift.pairPIN {/' "$AV"
          fi

          if [ -f .gitignore ]; then
            perl -i -ne 'print unless /^natsuk1-app\.tar\.gz$/ || /^natsuk1\.ipa$/ || /^reference\/$/' .gitignore
          fi

          perl -i -ne 'print unless /necp\.c.*probes/i' docs/architecture.md 2>/dev/null || true

          if [ -f docs/ai-hints.md ] && ! grep -q 'FIX AND RELEASE WORKFLOW' docs/ai-hints.md; then
            printf '\n## FIX AND RELEASE WORKFLOW\n\n' >> docs/ai-hints.md
            printf 'Single workflow `.github/workflows/fix_and_release.yml`.\n\n' >> docs/ai-hints.md
            printf 'Rules learned the hard way:\n\n' >> docs/ai-hints.md
            printf -- '- Never put Python or heredoc over 30 lines inside a run block.\n' >> docs/ai-hints.md
            printf -- '- Use short perl one-liners for multi-line edits.\n' >> docs/ai-hints.md
            printf -- '- Every mutation must be idempotent.\n' >> docs/ai-hints.md
            printf -- '- Commit only if git diff is non-empty, and use skip ci.\n' >> docs/ai-hints.md
            printf -- '- Release notes carry exactly one https link (direct IPA).\n\n' >> docs/ai-hints.md
            printf 'Fixes applied automatically by the workflow:\n\n' >> docs/ai-hints.md
            printf -- '- NetworkStatus: drop netmask field and argument.\n' >> docs/ai-hints.md
            printf -- '- AirliftView: if let pin = airlift.pairPIN must stay intact.\n' >> docs/ai-hints.md
            printf -- '- DeviceInfoView: use DeviceName.machineID().\n' >> docs/ai-hints.md
            printf -- '- DeviceName.full(), OffsetsStore.activeVersion removed as dead.\n' >> docs/ai-hints.md
            printf -- '- NECP removed entirely (closed).\n' >> docs/ai-hints.md
          fi

          oxipng -o max --strip safe natsuk1/Resources/Assets.xcassets/AppIcon.appiconset/1024x1024.png 2>/dev/null || true

          grep -q '.swiftpm/' .gitignore 2>/dev/null || printf '\n# Swift\n*.xcworkspace\n.swiftpm/\n.build/\nPackage.resolved\n\n# Debug\n*.dSYM\n' >> .gitignore

          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: drop NECP, remove dead code [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          [ -d natsuk1.xcodeproj ] || xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' \
                       -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) \
                -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 \
            && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"