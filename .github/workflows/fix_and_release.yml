      - name: Write CarrierLabBridge
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabBridge.swift <<'CLBRIDGE_EOF'
          import Foundation

          private let injectLogCallback: @convention(c) (UnsafeMutableRawPointer?, UnsafePointer<CChar>?) -> Void = { _, msg in
              guard let msg = msg else { return }
              CarrierLabState.shared.appendLog("[ffi] " + String(cString: msg))
          }

          final class CarrierLabBridge: @unchecked Sendable {
              static let shared = CarrierLabBridge()

              enum ProbeState {
                  case ok
                  case noVPN
                  case noPairing
                  case pairingInvalid
                  case ffiFailed(String)
              }

              struct ProbeResult {
                  let state: ProbeState
                  let detail: String
                  var ok: Bool { if case .ok = state { return true }; return false }
                  var message: String {
                      switch state {
                      case .ok: return "ready"
                      case .noVPN: return "No loopback VPN. Enable LocalDevVPN or SideStore WireGuard."
                      case .noPairing: return "No pairing file. Open Tools / Airlift and run Start Pairing."
                      case .pairingInvalid: return detail
                      case .ffiFailed(let s): return s
                      }
                  }
              }

              static let carrierUserRoot = "/var/mobile/Library/Carrier Bundles"
              static let carrierRoot = "/var/mobile/Library/Carrier Bundles/iPhone"

              static let defaultSlots = ["Carrier1Bundle.bundle", "Operator1Bundle.bundle"]

              func findPairingFile() -> String? {
                  let fm = FileManager.default
                  let canonical = PairingController.pairingFilePath()
                  if fm.fileExists(atPath: canonical) {
                      let size = (try? fm.attributesOfItem(atPath: canonical)[.size] as? Int) ?? 0
                      if size > 0 { return canonical }
                  }
                  if let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first {
                      let candidates = [
                          docs.appendingPathComponent("natsuk1_pairing.plist").path,
                          docs.appendingPathComponent("ALTPairingFile.mobiledevicepairing").path,
                      ]
                      for c in candidates {
                          if fm.fileExists(atPath: c) {
                              let size = (try? fm.attributesOfItem(atPath: c)[.size] as? Int) ?? 0
                              if size > 0 { return c }
                          }
                      }
                  }
                  return nil
              }

              func validatePairingFile(_ path: String) -> (Bool, String) {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: path) else { return (false, "missing") }
                  let size = (try? fm.attributesOfItem(atPath: path)[.size] as? Int) ?? 0
                  if size < 50 { return (false, "Pairing file too small (\(size) bytes).") }
                  let kind = PairingFileKind.of(path: path)
                  if !kind.isUsable {
                      return (false, "Pairing file is not a plist (\(size) bytes).")
                  }
                  if !kind.hasLockdown {
                      return (false, "Pairing file has the RPPairing half but no classic lockdown record "
                          + "(HostCertificate / HostPrivateKey / DeviceCertificate). Airlift's Lockdown "
                          + "fallback on port 62078 will fail with \"missing field DeviceCertificate\". "
                          + "Open Tools / Airlift, delete the pairing file and pair again so the lockdown "
                          + "record is issued.")
                  }
                  return (true, "Pairing ok (\(size) bytes)")
              }

              func probe() -> ProbeResult {
                  if !NetworkStatus.loopbackVPNUp() { return ProbeResult(state: .noVPN, detail: "no loopback VPN") }
                  guard let pairing = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "missing")
                  }
                  let (ok, msg) = validatePairingFile(pairing)
                  if !ok { return ProbeResult(state: .pairingInvalid, detail: msg) }
                  return ProbeResult(state: .ok, detail: msg)
              }

              struct TreeSummary {
                  let files: Int
                  let bytes: Int
                  let names: [String]
                  var isEmpty: Bool { files == 0 }
              }

              func localTreeSummary(_ path: String) -> TreeSummary {
                  let fm = FileManager.default
                  var isDir: ObjCBool = false
                  guard fm.fileExists(atPath: path, isDirectory: &isDir), isDir.boolValue else {
                      return TreeSummary(files: 0, bytes: 0, names: [])
                  }
                  var files = 0
                  var bytes = 0
                  var names: [String] = []
                  let root = URL(fileURLWithPath: path)
                  guard let walker = fm.enumerator(at: root, includingPropertiesForKeys: [.fileSizeKey, .isRegularFileKey]) else {
                      return TreeSummary(files: 0, bytes: 0, names: [])
                  }
                  for case let url as URL in walker {
                      let values = try? url.resourceValues(forKeys: [.fileSizeKey, .isRegularFileKey])
                      guard values?.isRegularFile == true else { continue }
                      files += 1
                      bytes += values?.fileSize ?? 0
                      if names.count < 12 {
                          names.append(url.path.replacingOccurrences(of: path + "/", with: ""))
                      }
                  }
                  return TreeSummary(files: files, bytes: bytes, names: names)
              }

              func injectFolder(sourceFolder: String,
                                targetParent: String,
                                destName: String) -> ProbeResult {
                  guard let pairing = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "no pairing path")
                  }
                  let summary = localTreeSummary(sourceFolder)
                  if summary.isEmpty {
                      return ProbeResult(state: .ffiFailed("no files in directory: \(sourceFolder) is empty or is not a directory"),
                                         detail: "no files in directory")
                  }
                  var outError: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  pairing.withCString { pc in
                      sourceFolder.withCString { sc in
                          targetParent.withCString { tc in
                              destName.withCString { nc in
                                  rc = al_exploit_inject_folder(pc, sc, tc, nc, injectLogCallback, nil, &outError)
                              }
                          }
                      }
                  }
                  let errMsg = outError.flatMap { String(cString: $0) } ?? ""
                  if let p = outError { al_string_free(p) }
                  if rc != 0 {
                      return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "inject rc=\(rc)" : errMsg), detail: errMsg)
                  }
                  return ProbeResult(state: .ok, detail: "injected \(summary.files) file(s)")
              }
          }
          CLBRIDGE_EOF

      - name: Write CarrierLabInstaller
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabInstaller.swift <<'CLINSTALLER_EOF'
          import Foundation

          final class CarrierLabInstaller: @unchecked Sendable {
              static let shared = CarrierLabInstaller()

              private let state = CarrierLabState.shared
              private let bridge = CarrierLabBridge.shared

              struct CheckResult {
                  let probe: CarrierLabBridge.ProbeResult
                  let carrierUserRootExists: Bool
                  let carrierRootExists: Bool
                  let resourcesBundled: Bool
                  let sourceFiles: Int
                  let sourceBytes: Int
                  let backupPresent: Bool
                  let status: CarrierLabState.Status
              }

              struct InstallResult {
                  let ok: Bool
                  let message: String
                  let slotsWritten: [String]
                  let failures: [String]
              }

              func carrierBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/CarrierLab.bundle")
              }

              func docomoBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/Docomo_jp.bundle")
              }

              func check() -> CheckResult {
                  let fm = FileManager.default
                  let probe = bridge.probe()
                  let tree = bridge.localTreeSummary(carrierBundleURL().path)
                  return CheckResult(
                      probe: probe,
                      carrierUserRootExists: fm.fileExists(atPath: CarrierLabBridge.carrierUserRoot),
                      carrierRootExists: fm.fileExists(atPath: CarrierLabBridge.carrierRoot),
                      resourcesBundled: fm.fileExists(atPath: carrierBundleURL().path)
                          && fm.fileExists(atPath: docomoBundleURL().path),
                      sourceFiles: tree.files,
                      sourceBytes: tree.bytes,
                      backupPresent: state.hasBackup(),
                      status: state.session?.status ?? .clean)
              }

              func diagnose() -> [String] {
                  let fm = FileManager.default
                  var lines: [String] = []
                  let pairing = bridge.findPairingFile()
                  lines.append("[diagnose] pairing=\(pairing ?? "none")")
                  if let p = pairing {
                      let size = (try? fm.attributesOfItem(atPath: p)[.size] as? Int) ?? 0
                      let kind = PairingFileKind.of(path: p)
                      lines.append("[diagnose] bytes=\(size) rpPairing=\(kind.hasRemotePairing) "
                          + "lockdown=\(kind.hasLockdown) udid=\(kind.udid ?? "-")")
                  }
                  lines.append("[diagnose] vpn=\(NetworkStatus.loopbackVPNUp()) peer=\(NetworkStatus.tunnelIP() ?? "-") "
                      + "local=\(NetworkStatus.deviceIP() ?? "-")")
                  lines.append("[diagnose] userRoot=\(CarrierLabBridge.carrierUserRoot) "
                      + "exists=\(fm.fileExists(atPath: CarrierLabBridge.carrierUserRoot))")
                  lines.append("[diagnose] iphoneRoot=\(CarrierLabBridge.carrierRoot) "
                      + "exists=\(fm.fileExists(atPath: CarrierLabBridge.carrierRoot))")
                  lines.append("[diagnose] slots=\(state.slots.joined(separator: ","))")
                  let src = carrierBundleURL().path
                  let tree = bridge.localTreeSummary(src)
                  lines.append("[diagnose] source=\(src) files=\(tree.files) bytes=\(tree.bytes)")
                  for n in tree.names { lines.append("[diagnose]   \(n)") }
                  let doc = docomoBundleURL().path
                  let docTree = bridge.localTreeSummary(doc)
                  lines.append("[diagnose] trigger=\(doc) files=\(docTree.files) bytes=\(docTree.bytes)")
                  return lines
              }

              private func preflight(_ source: String) -> String? {
                  let summary = bridge.localTreeSummary(source)
                  if summary.isEmpty {
                      return "no files in directory: \(source) is empty or is not a directory"
                  }
                  return nil
              }

              func install() -> InstallResult {
                  let fm = FileManager.default
                  let carrierBundle = carrierBundleURL()
                  let docomoBundle = docomoBundleURL()
                  guard fm.fileExists(atPath: carrierBundle.path) else {
                      return InstallResult(ok: false, message: "CarrierLab.bundle missing", slotsWritten: [], failures: [])
                  }
                  guard fm.fileExists(atPath: docomoBundle.path) else {
                      return InstallResult(ok: false, message: "Docomo_jp.bundle missing", slotsWritten: [], failures: [])
                  }
                  let pre = bridge.probe()
                  guard pre.ok else {
                      return InstallResult(ok: false, message: pre.message, slotsWritten: [], failures: [])
                  }
                  if let problem = preflight(carrierBundle.path) {
                      return InstallResult(ok: false, message: problem, slotsWritten: [], failures: [problem])
                  }

                  let slots = state.slots
                  state.save(CarrierLabState.Session(
                      status: .placing,
                      startedAt: Date(),
                      carrierBundlePath: carrierBundle.path,
                      originalBackupPath: state.backupURL().path,
                      ipccTriggerPath: docomoBundle.path,
                      lastError: nil,
                      aliases: nil,
                      slots: slots))

                  var written: [String] = []
                  var failures: [String] = []

                  for slot in slots {
                      let r = bridge.injectFolder(sourceFolder: carrierBundle.path,
                                                  targetParent: CarrierLabBridge.carrierUserRoot,
                                                  destName: slot)
                      if r.ok {
                          written.append(slot)
                          state.appendLog("[install] slot \(slot) ok")
                      } else {
                          failures.append("\(slot): \(r.message)")
                          state.appendLog("[install] slot \(slot) failed: \(r.message)")
                      }
                  }

                  if !failures.isEmpty {
                      state.save(CarrierLabState.Session(
                          status: .failed,
                          startedAt: Date(),
                          carrierBundlePath: carrierBundle.path,
                          originalBackupPath: state.backupURL().path,
                          ipccTriggerPath: docomoBundle.path,
                          lastError: failures.joined(separator: " | "),
                          aliases: nil,
                          slots: written))
                      return InstallResult(ok: false,
                                           message: failures.joined(separator: " | "),
                                           slotsWritten: written,
                                           failures: failures)
                  }

                  let trigger = bridge.injectFolder(sourceFolder: docomoBundle.path,
                                                    targetParent: CarrierLabBridge.carrierRoot,
                                                    destName: "Docomo_jp.bundle")
                  if !trigger.ok {
                      state.save(CarrierLabState.Session(
                          status: .failed,
                          startedAt: Date(),
                          carrierBundlePath: carrierBundle.path,
                          originalBackupPath: state.backupURL().path,
                          ipccTriggerPath: docomoBundle.path,
                          lastError: trigger.message,
                          aliases: nil,
                          slots: written))
                      return InstallResult(ok: false, message: trigger.message, slotsWritten: written, failures: [trigger.message])
                  }

                  state.save(CarrierLabState.Session(
                      status: .placed,
                      startedAt: Date(),
                      carrierBundlePath: carrierBundle.path,
                      originalBackupPath: state.backupURL().path,
                      ipccTriggerPath: docomoBundle.path,
                      lastError: nil,
                      aliases: nil,
                      slots: written))
                  state.appendLog("[install] placed into \(written.joined(separator: ","))")
                  return InstallResult(ok: true, message: "installed", slotsWritten: written, failures: [])
              }

              func reload() -> InstallResult {
                  guard let s = state.session, s.status == .placed || s.status == .finished else {
                      return InstallResult(ok: false, message: "Nothing to reload. Install first.",
                                           slotsWritten: [], failures: [])
                  }
                  let trigger = bridge.injectFolder(sourceFolder: docomoBundleURL().path,
                                                    targetParent: CarrierLabBridge.carrierRoot,
                                                    destName: "Docomo_jp.bundle")
                  state.appendLog(trigger.ok ? "[reload] trigger ok" : "[reload] trigger failed: \(trigger.message)")
                  return InstallResult(ok: trigger.ok, message: trigger.message,
                                       slotsWritten: s.slots ?? [], failures: trigger.ok ? [] : [trigger.message])
              }

              func finish() {
                  guard let s = state.session else { return }
                  var done = s
                  done.status = .finished
                  state.save(done)
              }

              func reset() {
                  state.clear()
              }
          }
          CLINSTALLER_EOF

      - name: Write CarrierLabState
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabState.swift <<'CLSTATE_EOF'
          import Foundation
          import Combine

          final class CarrierLabState: ObservableObject, @unchecked Sendable {
              static let shared = CarrierLabState()

              enum Status: String, Codable { case clean, placing, placed, finished, failed }

              struct Session: Codable {
                  var status: Status
                  var startedAt: Date
                  var carrierBundlePath: String?
                  var originalBackupPath: String?
                  var ipccTriggerPath: String?
                  var lastError: String?
                  var aliases: [String]?
                  var slots: [String]?
              }

              @Published private(set) var session: Session?
              @Published private(set) var airliftOK: Bool = false
              @Published private(set) var airliftMessage: String = "Checking..."
              @Published private(set) var resourcesOK: Bool = false
              @Published private(set) var busy: Bool = false
              @Published private(set) var logText: String = ""
              @Published private(set) var slots: [String] = CarrierLabBridge.defaultSlots

              private let root: URL
              private let stateURL: URL
              private let backupDir: URL
              private let slotsKey = "natsuk1_carrierlab_slots"

              private init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first
                      ?? URL(fileURLWithPath: NSTemporaryDirectory())
                  root = docs.appendingPathComponent("carrierlab", isDirectory: true)
                  stateURL = root.appendingPathComponent("state.json")
                  backupDir = root.appendingPathComponent("backup", isDirectory: true)
                  try? FileManager.default.createDirectory(at: backupDir, withIntermediateDirectories: true)
                  if let stored = UserDefaults.standard.array(forKey: slotsKey) as? [String], !stored.isEmpty {
                      slots = stored
                  }
                  load()
              }

              func load() {
                  guard let data = try? Data(contentsOf: stateURL),
                        let s = try? JSONDecoder().decode(Session.self, from: data) else {
                      DispatchQueue.main.async { self.session = nil }
                      return
                  }
                  DispatchQueue.main.async { self.session = s }
              }

              func save(_ s: Session) {
                  DispatchQueue.main.async {
                      self.session = s
                      let enc = JSONEncoder()
                      enc.outputFormatting = [.prettyPrinted, .sortedKeys]
                      enc.dateEncodingStrategy = .iso8601
                      if let d = try? enc.encode(s) {
                          try? d.write(to: self.stateURL, options: .atomic)
                      }
                  }
              }

              func clear() {
                  DispatchQueue.main.async {
                      self.session = nil
                      try? FileManager.default.removeItem(at: self.stateURL)
                  }
              }

              func hasBackup() -> Bool {
                  guard let s = session, let p = s.originalBackupPath else { return false }
                  return FileManager.default.fileExists(atPath: p)
              }

              func setAirlift(ok: Bool, message: String) {
                  DispatchQueue.main.async {
                      self.airliftOK = ok
                      self.airliftMessage = message
                  }
              }

              func setResources(_ ok: Bool) {
                  DispatchQueue.main.async { self.resourcesOK = ok }
              }

              func setBusy(_ v: Bool) {
                  DispatchQueue.main.async { self.busy = v }
              }

              func setSlots(_ v: [String]) {
                  let cleaned = v.map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }
                      .filter { !$0.isEmpty }
                  let unique = cleaned.reduce(into: [String]()) { acc, s in if !acc.contains(s) { acc.append(s) } }
                  DispatchQueue.main.async {
                      self.slots = unique.isEmpty ? CarrierLabBridge.defaultSlots : unique
                      UserDefaults.standard.set(self.slots, forKey: self.slotsKey)
                  }
              }

              func appendLog(_ s: String) {
                  DispatchQueue.main.async {
                      self.logText += s + "\n"
                      if self.logText.count > 20000 { self.logText = String(self.logText.suffix(15000)) }
                  }
              }

              func clearLog() {
                  DispatchQueue.main.async { self.logText = "" }
              }

              func backupURL() -> URL { backupDir }
          }
          CLSTATE_EOF

      - name: Write CarrierLabView
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabView.swift <<'CLVIEW_EOF'
          import SwiftUI

          struct CarrierLabView: View {
              @ObservedObject private var clState = CarrierLabState.shared
              @EnvironmentObject private var appState: AppState

              @State private var slotText: String = ""
              @State private var sourceInfo: String = ""

              private let ticker = Timer.publish(every: 5.0, on: .main, in: .common).autoconnect()

              var body: some View {
                  List {
                      airliftSection
                      pairingHintSection
                      resourcesSection
                      targetsSection
                      statusSection
                      actionsSection
                      logSection
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("CarrierLab")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear {
                      slotText = clState.slots.joined(separator: ", ")
                      runCheck()
                  }
                  .onReceive(ticker) { _ in
                      if !clState.busy { runCheck(silent: true) }
                  }
              }

              private var airliftSection: some View {
                  Section {
                      HStack(spacing: 12) {
                          Image(systemName: clState.airliftOK ? "checkmark.circle.fill" : "exclamationmark.circle.fill")
                              .font(.system(size: 22))
                              .foregroundStyle(clState.airliftOK ? .green : .orange)
                          VStack(alignment: .leading, spacing: 3) {
                              Text("Airlift")
                              Text(clState.airliftOK ? "Connected" : "Not ready")
                                  .font(.subheadline)
                                  .foregroundStyle(clState.airliftOK ? .green : .orange)
                              if !clState.airliftOK {
                                  Text(clState.airliftMessage)
                                      .font(.footnote)
                                      .foregroundStyle(.secondary)
                                      .lineLimit(6)
                              }
                          }
                          Spacer()
                      }
                      .padding(.vertical, 4)
                  } header: { Label("Airlift", systemImage: "antenna.radiowaves.left.and.right") }
              }

              @ViewBuilder
              private var pairingHintSection: some View {
                  if !clState.airliftOK {
                      Section {
                          VStack(alignment: .leading, spacing: 6) {
                              Label("Pairing is done in Airlift only", systemImage: "info.circle")
                                  .font(.footnote)
                                  .foregroundStyle(.secondary)
                              Text("CarrierLab never creates a pairing file. Open Tools / Airlift, run Start Pairing, then return here.")
                                  .font(.caption)
                                  .foregroundStyle(.secondary)
                              Text("The file must contain the classic lockdown record. If Install stays blocked, tap Delete Pairing in Airlift, then Start Pairing again and approve both the PIN and the Trust prompt.")
                                  .font(.caption2)
                                  .foregroundStyle(.orange)
                          }
                      }
                  }
              }

              private var resourcesSection: some View {
                  Section {
                      HStack {
                          Text("CarrierAssets")
                          Spacer()
                          Text(clState.resourcesOK ? "Bundled" : "Missing")
                              .foregroundStyle(clState.resourcesOK ? .green : .red)
                      }
                      if !sourceInfo.isEmpty {
                          Text(sourceInfo)
                              .font(.system(size: 10, design: .monospaced))
                              .foregroundStyle(.secondary)
                      }
                  } header: { Label("Resources", systemImage: "shippingbox") }
              }

              private var targetsSection: some View {
                  Section {
                      HStack {
                          Text("Slots")
                          Spacer()
                          TextField("Carrier1Bundle.bundle, ...", text: $slotText)
                              .multilineTextAlignment(.trailing)
                              .font(.system(.footnote, design: .monospaced))
                              .autocorrectionDisabled()
                              .onSubmit { applySlots() }
                      }
                      Button { applySlots() } label: { Text("Apply Slots") }
                          .disabled(clState.busy)
                      Button { slotText = CarrierLabBridge.defaultSlots.joined(separator: ", "); applySlots() } label: {
                          Text("Reset Slots To Default")
                      }
                      .disabled(clState.busy)
                  } header: { Label("Targets", systemImage: "folder.badge.gearshape") }
                  footer: {
                      Text("Contents of CarrierLab.bundle are written into these existing bundles under \(CarrierLabBridge.carrierUserRoot). The app cannot list that directory, so the names must match what is on the device.")
                          .font(.caption2)
                  }
              }

              private var statusSection: some View {
                  Section {
                      HStack {
                          Text("Status")
                          Spacer()
                          Text(statusText)
                              .font(.system(.body, design: .monospaced))
                              .foregroundStyle(statusColor)
                      }
                      if let s = clState.session {
                          HStack {
                              Text("Started")
                              Spacer()
                              Text(s.startedAt.formatted())
                                  .font(.system(.body, design: .monospaced))
                                  .foregroundStyle(.secondary)
                          }
                          if let slots = s.slots, !slots.isEmpty {
                              HStack {
                                  Text("Written")
                                  Spacer()
                                  Text(slots.joined(separator: ","))
                                      .font(.system(.footnote, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                          if let e = s.lastError {
                              Text(e)
                                  .font(.footnote)
                                  .foregroundStyle(.red)
                          }
                      }
                  } header: { Label("CarrierLab", systemImage: "shippingbox") }
              }

              private var actionsSection: some View {
                  Section {
                      Button { runCheck() } label: { Text("Check") }
                          .disabled(clState.busy)
                      Button { runDiagnose() } label: { Text("Diagnose") }
                          .disabled(clState.busy)
                      Button { runInstall() } label: { Text("Install") }
                          .disabled(clState.busy || !clState.airliftOK || !clState.resourcesOK)
                      Button { runReload() } label: { Text("Reload") }
                          .disabled(clState.busy || !clState.airliftOK || !clState.resourcesOK)
                      Button { runFinish() } label: { Text("Finish") }
                          .disabled(clState.busy)
                      Button { appState.respring() } label: { Text("Respring") }
                          .disabled(clState.busy)
                      Button(role: .destructive) { runReset() } label: { Text("Reset") }
                          .disabled(clState.busy)
                  } header: { Label("Actions", systemImage: "wrench") }
              }

              @ViewBuilder
              private var logSection: some View {
                  if !clState.logText.isEmpty {
                      Section {
                          ScrollView {
                              Text(clState.logText)
                                  .font(.system(size: 10, design: .monospaced))
                                  .frame(maxWidth: .infinity, alignment: .leading)
                          }
                          .frame(minHeight: 120, maxHeight: 300)
                      } header: { Label("Log", systemImage: "terminal") }
                  }
              }

              private var statusText: String {
                  clState.session?.status.rawValue ?? "clean"
              }

              private var statusColor: Color {
                  switch clState.session?.status {
                  case .placed, .finished: return .green
                  case .placing: return .orange
                  case .failed: return .red
                  default: return .secondary
                  }
              }

              private func applySlots() {
                  let parsed = slotText.split(separator: ",").map { String($0).trimmingCharacters(in: .whitespaces) }
                  clState.setSlots(parsed)
                  clState.appendLog("[slots] \(clState.slots.joined(separator: ","))")
              }

              private func runCheck(silent: Bool = false) {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      let r = CarrierLabInstaller.shared.check()
                      CarrierLabState.shared.setAirlift(ok: r.probe.ok, message: r.probe.message)
                      CarrierLabState.shared.setResources(r.resourcesBundled)
                      let info = "source \(r.sourceFiles) file(s), \(r.sourceBytes) bytes · userRoot=\(r.carrierUserRootExists) · iphoneRoot=\(r.carrierRootExists)"
                      DispatchQueue.main.async { sourceInfo = info }
                      if !silent {
                          CarrierLabState.shared.appendLog("[check] airlift=\(r.probe.ok) msg=\(r.probe.message)")
                          CarrierLabState.shared.appendLog("[check] \(info)")
                      }
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runDiagnose() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      for line in CarrierLabInstaller.shared.diagnose() {
                          CarrierLabState.shared.appendLog(line)
                      }
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runInstall() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      let r = CarrierLabInstaller.shared.install()
                      CarrierLabState.shared.appendLog(r.ok
                          ? "[install] ok slots=\(r.slotsWritten.joined(separator: ","))"
                          : "[install] failed: \(r.message)")
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runReload() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      let r = CarrierLabInstaller.shared.reload()
                      CarrierLabState.shared.appendLog(r.ok ? "[reload] ok" : "[reload] failed: \(r.message)")
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runFinish() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      CarrierLabInstaller.shared.finish()
                      CarrierLabState.shared.appendLog("[finish] ok")
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runReset() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      CarrierLabInstaller.shared.reset()
                      CarrierLabState.shared.clearLog()
                      CarrierLabState.shared.appendLog("[reset] ok")
                      CarrierLabState.shared.setBusy(false)
                  }
              }
          }
          CLVIEW_EOF

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: carrier slot injection, respring hardening, state-thread fixes [skip ci]"
            git push
          fi

      - name: Verify sources
        run: |
          set -euo pipefail
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          test -f natsuk1/Support/bridging.h
          test -f natsuk1/Support/idevice_shim.h
          test -f natsuk1/Helpers/PairingGenerator.swift
          test -f natsuk1/Helpers/CompositePairingFile.swift
          test -f natsuk1/Helpers/LockdownPair.swift
          test -f natsuk1/Helpers/Respring.swift
          test -f natsuk1/App/natsuk1.swift
          test -f natsuk1/Views/AirliftView.swift
          test -f natsuk1/CarrierLab/CarrierLabView.swift
          grep -q 'idevice_shim.h' natsuk1/Support/bridging.h
          grep -q 'lockdownd_pair' natsuk1/Support/idevice_shim.h
          grep -q 'lockdownd_pair' natsuk1/Helpers/LockdownPair.swift
          grep -q 'idevice_pairing_file_serialize' natsuk1/Helpers/LockdownPair.swift
          grep -q 'LockdownPair.mintRecord' natsuk1/Helpers/PairingGenerator.swift
          grep -q 'CompositePairingFile.merge' natsuk1/Helpers/PairingGenerator.swift
