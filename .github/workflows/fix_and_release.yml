name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-v23-${{ hashFiles('project.yml') }}
          restore-keys: nk-v23-

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid     >/dev/null 2>&1 || brew install ldid

      - name: Fetch carrier assets
        run: |
          set -euo pipefail
          ROOT=natsuk1/Resources/CarrierAssets
          rm -rf "$ROOT"
          mkdir -p "$ROOT/CarrierLab.bundle/signatures" "$ROOT/Docomo_jp.bundle/signatures"
          BASE="https://raw.githubusercontent.com/VCTGomes/ios-carrier-bundle/cecd5594349df0bf51723a247028bad5f40a7965/carrier-bundles/27.0-24A437.V53_V54_V57OS"
          for f in \
            "CarrierLab.bundle/Info.plist" \
            "CarrierLab.bundle/carrier.plist" \
            "CarrierLab.bundle/overrides_V53_V54_V57.der.pri" \
            "CarrierLab.bundle/overrides_V53_V54_V57.plist" \
            "CarrierLab.bundle/signatures/common.plist" \
            "CarrierLab.bundle/signatures/overrides_V53_V54_V57.plist" \
            "Docomo_jp.bundle/Info.plist" \
            "Docomo_jp.bundle/carrier.plist" \
            "Docomo_jp.bundle/overrides_V53_V54_V57.der.pri" \
            "Docomo_jp.bundle/overrides_V53_V54_V57.plist" \
            "Docomo_jp.bundle/profile.mobileconfig" \
            "Docomo_jp.bundle/signatures/common.plist" \
            "Docomo_jp.bundle/signatures/overrides_V53_V54_V57.plist" ; do
            curl -fsSL "$BASE/$f" -o "$ROOT/$f"
            test -s "$ROOT/$f"
          done

      - name: Write project.yml
        run: |
          set -euo pipefail
          cat > project.yml <<'PROJECT_EOF'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false
          configs:
            Debug: debug
            Release: release
          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO
            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES
              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: NO
          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/App
                - path: natsuk1/CarrierLab
                - path: natsuk1/Exploit
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Support/bridging.h
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Resources/CarrierAssets
                  type: folder
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/Support/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/Exploit/Core $(SRCROOT)/natsuk1/Exploit/Airlift $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/Headers"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          PROJECT_EOF

      - name: Write CarrierLab sources
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          rm -f natsuk1/CarrierLab/CarrierLabCore.swift

          cat > natsuk1/CarrierLab/CarrierLabBridge.swift <<'SWIFT_BRIDGE'
          import Foundation

          final class CarrierLabBridge: @unchecked Sendable {
              static let shared = CarrierLabBridge()

              enum ProbeState {
                  case ok
                  case noVPN
                  case noPairing
                  case pairingInvalid
                  case ffiFailed(String)
              }

              struct ProbeResult {
                  let state: ProbeState
                  let detail: String
                  var ok: Bool { if case .ok = state { return true }; return false }
                  var message: String {
                      switch state {
                      case .ok: return "ready"
                      case .noVPN: return "no loopback VPN. Enable LocalDevVPN or SideStore WireGuard."
                      case .noPairing: return "no pairing file. Open Tools -> Airlift, run Start Pairing."
                      case .pairingInvalid: return detail
                      case .ffiFailed(let s): return s
                      }
                  }
              }

              private let carrierRoot = "/var/mobile/Library/Carrier Bundles/iPhone"
              private let bundleLinks = "/var/mobile/Library/Carrier Bundles"
              private let expectedKeys = ["public_key", "private_key", "identifier", "alt_irk"]

              func carrierRootPath() -> String { carrierRoot }
              func bundleLinksPath() -> String { bundleLinks }

              private func findPairingFile() -> String? {
                  let fm = FileManager.default
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]

                  let direct = docs.appendingPathComponent("natsuk1_pairing.plist")
                  if fm.fileExists(atPath: direct.path) {
                      let size = (try? fm.attributesOfItem(atPath: direct.path)[.size] as? Int) ?? 0
                      if size > 0 { return direct.path }
                  }

                  let controller = PairingController.pairingFilePath()
                  if fm.fileExists(atPath: controller) {
                      let size = (try? fm.attributesOfItem(atPath: controller)[.size] as? Int) ?? 0
                      if size > 0 { return controller }
                  }

                  if let e = try? fm.contentsOfDirectory(atPath: docs.path) {
                      for f in e where f.hasSuffix(".plist") || f.hasSuffix(".mobilepairing") || f.hasSuffix(".mobilepair") {
                          let p = docs.appendingPathComponent(f).path
                          let size = (try? fm.attributesOfItem(atPath: p)[.size] as? Int) ?? 0
                          if size > 200 { return p }
                      }
                  }

                  let nested = docs.appendingPathComponent("Data/Application")
                  if let e = try? fm.contentsOfDirectory(atPath: nested.path) {
                      for sub in e {
                          let inner = nested.appendingPathComponent(sub).appendingPathComponent("Documents/natsuk1_pairing.plist")
                          if fm.fileExists(atPath: inner.path) {
                              let size = (try? fm.attributesOfItem(atPath: inner.path)[.size] as? Int) ?? 0
                              if size > 0 { return inner.path }
                          }
                      }
                  }

                  return nil
              }

              private func validatePairingFile(_ path: String) -> (Bool, String) {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: path) else { return (false, "missing") }
                  let attrs = try? fm.attributesOfItem(atPath: path)
                  let size = (attrs?[.size] as? Int) ?? 0
                  if size < 100 { return (false, "pairing file too small (\(size) bytes). Re-pair in Tools -> Airlift.") }
                  guard let data = try? Data(contentsOf: URL(fileURLWithPath: path)) else {
                      return (false, "pairing file unreadable")
                  }
                  guard let obj = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                        let dict = obj as? [String: Any] else {
                      return (false, "pairing file not a plist (\(size) bytes). Re-pair in Tools -> Airlift.")
                  }
                  var present: [String] = []
                  for k in expectedKeys where dict[k] != nil { present.append(k) }
                  if present.count < 3 {
                      return (false, "pairing file incomplete: \(present.count) of 4 keys (\(present.joined(separator: ","))). Re-pair in Tools -> Airlift.")
                  }
                  return (true, "pairing ok (\(size) bytes)")
              }

              func probe() -> ProbeResult {
                  if !NetworkStatus.loopbackVPNUp() { return ProbeResult(state: .noVPN, detail: "no loopback VPN") }
                  guard let pairing = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "missing")
                  }
                  let (pairOk, pairMsg) = validatePairingFile(pairing)
                  if !pairOk { return ProbeResult(state: .pairingInvalid, detail: pairMsg) }
                  let tmp = NSTemporaryDirectory() + "/carrierlab-probe-\(UUID().uuidString).txt"
                  try? "probe".data(using: .utf8)?.write(to: URL(fileURLWithPath: tmp))
                  var outJson: UnsafeMutablePointer<CChar>? = nil
                  var outErr: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  tmp.withCString { sf in
                      "/var/mobile/Library/Carrier Bundles/.carrierlab-probe".withCString { tf in
                          rc = al_exploit_run(sf, tf, nil, nil, &outJson, &outErr)
                      }
                  }
                  let errMsg = outErr.flatMap { String(cString: $0) } ?? ""
                  if let p = outJson { al_string_free(p) }
                  if let p = outErr { al_string_free(p) }
                  try? FileManager.default.removeItem(atPath: tmp)
                  if rc != 0 { return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "rc=\(rc)" : errMsg), detail: errMsg) }
                  return ProbeResult(state: .ok, detail: "ready")
              }

              func writeFile(source: String, target: String) -> ProbeResult {
                  let pre = probe()
                  guard pre.ok else { return pre }
                  var outJson: UnsafeMutablePointer<CChar>? = nil
                  var outErr: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  source.withCString { sc in
                      target.withCString { tc in
                          rc = al_exploit_run(sc, tc, nil, nil, &outJson, &outErr)
                      }
                  }
                  let errMsg = outErr.flatMap { String(cString: $0) } ?? ""
                  if let p = outJson { al_string_free(p) }
                  if let p = outErr { al_string_free(p) }
                  if rc != 0 { return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "rc=\(rc)" : errMsg), detail: errMsg) }
                  return ProbeResult(state: .ok, detail: "ok")
              }
          }
          SWIFT_BRIDGE

          cat > natsuk1/CarrierLab/CarrierLabState.swift <<'SWIFT_STATE'
          import Foundation
          import Combine

          final class CarrierLabState: ObservableObject, @unchecked Sendable {
              static let shared = CarrierLabState()

              enum Status: String, Codable { case clean, placing, placed, finished, failed }

              struct Session: Codable {
                  var status: Status
                  var startedAt: Date
                  var carrierBundlePath: String?
                  var originalBackupPath: String?
                  var ipccTriggerPath: String?
                  var lastError: String?
                  var aliases: [String]?
              }

              @Published private(set) var session: Session?
              @Published private(set) var airliftOK: Bool = false
              @Published private(set) var airliftMessage: String = "checking..."
              @Published private(set) var resourcesOK: Bool = false
              @Published private(set) var busy: Bool = false
              @Published private(set) var logText: String = ""

              private let root: URL
              private let stateURL: URL
              private let backupDir: URL

              private init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  root = docs.appendingPathComponent("carrierlab", isDirectory: true)
                  stateURL = root.appendingPathComponent("state.json")
                  backupDir = root.appendingPathComponent("backup", isDirectory: true)
                  try? FileManager.default.createDirectory(at: backupDir, withIntermediateDirectories: true)
                  load()
              }

              func load() {
                  guard let data = try? Data(contentsOf: stateURL),
                        let s = try? JSONDecoder().decode(Session.self, from: data) else {
                      session = nil
                      return
                  }
                  session = s
              }

              func save(_ s: Session) {
                  DispatchQueue.main.async {
                      self.session = s
                      let enc = JSONEncoder()
                      enc.outputFormatting = [.prettyPrinted, .sortedKeys]
                      enc.dateEncodingStrategy = .iso8601
                      if let d = try? enc.encode(s) {
                          try? d.write(to: self.stateURL, options: .atomic)
                      }
                  }
              }

              func clear() {
                  DispatchQueue.main.async {
                      self.session = nil
                      try? FileManager.default.removeItem(at: self.stateURL)
                  }
              }

              func hasBackup() -> Bool {
                  guard let s = session, let p = s.originalBackupPath else { return false }
                  return FileManager.default.fileExists(atPath: p)
              }

              func setAirlift(ok: Bool, message: String) {
                  DispatchQueue.main.async {
                      self.airliftOK = ok
                      self.airliftMessage = message
                  }
              }

              func setResources(_ ok: Bool) {
                  DispatchQueue.main.async { self.resourcesOK = ok }
              }

              func setBusy(_ v: Bool) {
                  DispatchQueue.main.async { self.busy = v }
              }

              func appendLog(_ s: String) {
                  DispatchQueue.main.async {
                      self.logText += s + "\n"
                      if self.logText.count > 20000 { self.logText = String(self.logText.suffix(15000)) }
                  }
              }

              func clearLog() {
                  DispatchQueue.main.async { self.logText = "" }
              }

              func backupURL() -> URL { backupDir }
              func rootURL() -> URL { root }
          }
          SWIFT_STATE

          cat > natsuk1/CarrierLab/CarrierLabInstaller.swift <<'SWIFT_INSTALLER'
          import Foundation

          final class CarrierLabInstaller: @unchecked Sendable {
              static let shared = CarrierLabInstaller()

              private let state = CarrierLabState.shared
              private let bridge = CarrierLabBridge.shared

              struct CheckResult {
                  let probe: CarrierLabBridge.ProbeResult
                  let carrierRootExists: Bool
                  let bundleLinksExists: Bool
                  let resourcesBundled: Bool
                  let backupPresent: Bool
                  let status: CarrierLabState.Status
              }

              func carrierBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/CarrierLab.bundle")
              }

              func docomoBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/Docomo_jp.bundle")
              }

              func check() -> CheckResult {
                  let fm = FileManager.default
                  let probe = bridge.probe()
                  return CheckResult(
                      probe: probe,
                      carrierRootExists: fm.fileExists(atPath: bridge.carrierRootPath()),
                      bundleLinksExists: fm.fileExists(atPath: bridge.bundleLinksPath()),
                      resourcesBundled: fm.fileExists(atPath: carrierBundleURL().path),
                      backupPresent: state.hasBackup(),
                      status: state.session?.status ?? .clean
                  )
              }

              func install() -> CarrierLabBridge.ProbeResult {
                  let carrierBundle = carrierBundleURL()
                  let docomoBundle = docomoBundleURL()
                  guard FileManager.default.fileExists(atPath: carrierBundle.path) else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("CarrierLab.bundle missing"), detail: "missing")
                  }
                  guard FileManager.default.fileExists(atPath: docomoBundle.path) else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("Docomo_jp.bundle missing"), detail: "missing")
                  }
                  let s = CarrierLabState.Session(
                      status: .placing,
                      startedAt: Date(),
                      carrierBundlePath: carrierBundle.path,
                      originalBackupPath: state.backupURL().path,
                      ipccTriggerPath: docomoBundle.path,
                      lastError: nil,
                      aliases: nil)
                  state.save(s)

                  let r1 = bridge.writeFile(source: carrierBundle.path, target: bridge.bundleLinksPath() + "/CarrierLab.bundle")
                  if !r1.ok {
                      var bad = s
                      bad.status = .failed
                      bad.lastError = r1.message
                      state.save(bad)
                      return r1
                  }
                  let r2 = bridge.writeFile(source: docomoBundle.path, target: bridge.carrierRootPath() + "/Docomo_jp.bundle")
                  if !r2.ok {
                      var bad = s
                      bad.status = .failed
                      bad.lastError = r2.message
                      state.save(bad)
                      return r2
                  }
                  var done = s
                  done.status = .placed
                  state.save(done)
                  return CarrierLabBridge.ProbeResult(state: .ok, detail: "installed")
              }

              func reload() -> CarrierLabBridge.ProbeResult {
                  guard let s = state.session, s.status == .placed || s.status == .finished else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("Nothing to reload. Install first."), detail: "no session")
                  }
                  _ = s
                  return bridge.writeFile(source: docomoBundleURL().path, target: bridge.carrierRootPath() + "/Docomo_jp.bundle")
              }

              func finish() {
                  guard let s = state.session else { return }
                  var done = s
                  done.status = .finished
                  state.save(done)
              }

              func reset() {
                  state.clear()
              }
          }
          SWIFT_INSTALLER

          cat > natsuk1/CarrierLab/CarrierLabView.swift <<'SWIFT_VIEW'
          import SwiftUI

          struct CarrierLabView: View {
              @ObservedObject private var clState = CarrierLabState.shared

              private let ticker = Timer.publish(every: 2.5, on: .main, in: .common).autoconnect()

              var body: some View {
                  List {
                      airliftSection
                      pairingHintSection
                      resourcesSection
                      statusSection
                      actionsSection
                      logSection
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("CarrierLab")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { runCheck() }
                  .onReceive(ticker) { _ in
                      if !clState.busy { runCheck(silent: true) }
                  }
              }

              private var airliftSection: some View {
                  Section {
                      HStack(alignment: .top, spacing: 12) {
                          Image(systemName: clState.airliftOK ? "checkmark.shield.fill" : "exclamationmark.shield.fill")
                              .font(.system(size: 22, weight: .semibold))
                              .foregroundStyle(clState.airliftOK ? .green : .orange)
                              .shadow(color: (clState.airliftOK ? Color.green : Color.orange).opacity(0.55), radius: 4)
                          VStack(alignment: .leading, spacing: 4) {
                              Text("Airlift")
                                  .font(.headline)
                              Text(clState.airliftOK ? "Connected" : "Not ready")
                                  .font(.subheadline)
                                  .foregroundStyle(clState.airliftOK ? .green : .orange)
                                  .shadow(color: (clState.airliftOK ? Color.green : Color.orange).opacity(0.55), radius: 3)
                              Text(clState.airliftMessage)
                                  .font(.system(size: 11, design: .monospaced))
                                  .foregroundStyle(.secondary)
                                  .lineLimit(5)
                          }
                          Spacer()
                      }
                      .padding(.vertical, 6)
                  } header: { Label("Airlift", systemImage: "antenna.radiowaves.left.and.right") }
              }

              @ViewBuilder
              private var pairingHintSection: some View {
                  if !clState.airliftOK {
                      Section {
                          VStack(alignment: .leading, spacing: 6) {
                              Label("Pairing is done in Airlift only", systemImage: "info.circle")
                                  .font(.footnote)
                                  .foregroundStyle(.secondary)
                              Text("CarrierLab never creates a pairing file. Open Tools -> Airlift, run Start Pairing, then return here.")
                                  .font(.caption)
                                  .foregroundStyle(.secondary)
                          }
                      }
                  }
              }

              private var resourcesSection: some View {
                  Section {
                      HStack {
                          Image(systemName: clState.resourcesOK ? "checkmark.seal.fill" : "xmark.seal.fill")
                              .foregroundStyle(clState.resourcesOK ? .green : .red)
                              .shadow(color: (clState.resourcesOK ? Color.green : Color.red).opacity(0.55), radius: 3)
                          Text("CarrierAssets in bundle")
                          Spacer()
                          Text(clState.resourcesOK ? "ok" : "missing")
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(clState.resourcesOK ? .green : .red)
                              .shadow(color: (clState.resourcesOK ? Color.green : Color.red).opacity(0.55), radius: 3)
                      }
                  } header: { Label("Resources", systemImage: "shippingbox") }
              }

              private var statusSection: some View {
                  Section {
                      HStack {
                          Text("Status")
                          Spacer()
                          Text(statusText)
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(statusColor)
                              .shadow(color: statusColor.opacity(0.55), radius: 3)
                      }
                      if let s = clState.session {
                          HStack {
                              Text("Started")
                              Spacer()
                              Text(s.startedAt.formatted())
                                  .font(.system(size: 11, design: .monospaced))
                                  .foregroundStyle(.secondary)
                          }
                          if let e = s.lastError {
                              Text(e)
                                  .font(.system(size: 11, design: .monospaced))
                                  .foregroundStyle(.red)
                                  .shadow(color: Color.red.opacity(0.55), radius: 3)
                          }
                      }
                  } header: { Label("CarrierLab", systemImage: "shippingbox") }
              }

              private var actionsSection: some View {
                  Section {
                      Button { runCheck() } label: { Text("Check") }.disabled(clState.busy)
                      Button { runInstall() } label: { Text("Install") }.disabled(clState.busy || !clState.airliftOK || !clState.resourcesOK)
                      Button { runReload() } label: { Text("Reload") }.disabled(clState.busy || !clState.airliftOK || !clState.resourcesOK)
                      Button { runFinish() } label: { Text("Finish") }.disabled(clState.busy)
                      Button(role: .destructive) { runReset() } label: { Text("Reset") }.disabled(clState.busy)
                  } header: { Label("Actions", systemImage: "wrench") }
              }

              @ViewBuilder
              private var logSection: some View {
                  if !clState.logText.isEmpty {
                      Section {
                          ScrollView {
                              Text(clState.logText)
                                  .font(.system(size: 10, design: .monospaced))
                                  .frame(maxWidth: .infinity, alignment: .leading)
                          }
                          .frame(minHeight: 120, maxHeight: 300)
                      } header: { Label("Log", systemImage: "terminal") }
                  }
              }

              private var statusText: String {
                  clState.session?.status.rawValue ?? "clean"
              }

              private var statusColor: Color {
                  switch clState.session?.status {
                  case .placed, .finished: return .green
                  case .placing: return .orange
                  case .failed: return .red
                  default: return .secondary
                  }
              }

              private func runCheck(silent: Bool = false) {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      let r = CarrierLabInstaller.shared.check()
                      CarrierLabState.shared.setAirlift(ok: r.probe.ok, message: r.probe.message)
                      CarrierLabState.shared.setResources(r.resourcesBundled)
                      if !silent {
                          let lines = [
                              "[check] airlift=\(r.probe.ok) msg=\(r.probe.message)",
                              "[check] carrierRoot=\(r.carrierRootExists) bundleLinks=\(r.bundleLinksExists) resourcesBundled=\(r.resourcesBundled) backup=\(r.backupPresent) status=\(r.status.rawValue)"
                          ]
                          for l in lines { CarrierLabState.shared.appendLog(l) }
                      }
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runInstall() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      let r = CarrierLabInstaller.shared.install()
                      let line = r.ok ? "[install] ok" : "[install] failed: \(r.message)"
                      CarrierLabState.shared.appendLog(line)
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runReload() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      let r = CarrierLabInstaller.shared.reload()
                      let line = r.ok ? "[reload] ok" : "[reload] failed: \(r.message)"
                      CarrierLabState.shared.appendLog(line)
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runFinish() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      CarrierLabInstaller.shared.finish()
                      CarrierLabState.shared.appendLog("[finish] ok")
                      CarrierLabState.shared.setBusy(false)
                  }
              }

              private func runReset() {
                  if clState.busy { return }
                  clState.setBusy(true)
                  DispatchQueue.global(qos: .userInitiated).async {
                      CarrierLabInstaller.shared.reset()
                      CarrierLabState.shared.clearLog()
                      CarrierLabState.shared.appendLog("[reset] ok")
                      CarrierLabState.shared.setBusy(false)
                  }
              }
          }
          SWIFT_VIEW

      - name: Rewrite AirliftView pairing UI
        run: |
          set -euo pipefail
          cat > natsuk1/Views/AirliftView.swift <<'SWIFT_AIRLIFT'
          import SwiftUI
          import UIKit
          import Combine

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge
              @State private var loopbackVPNUp: Bool = NetworkStatus.loopbackVPNUp()
              @State private var tunnelIP: String? = NetworkStatus.tunnelIP()
              @State private var deviceIP: String? = NetworkStatus.deviceIP()
              @State private var copied = false
              @State private var pairedTick = 0
              @State private var pinPulse = false

              private let ticker = Timer.publish(every: 0.5, on: .main, in: .common).autoconnect()

              var body: some View {
                  List {
                      statusSection
                      sessionSection
                      pairingStatusSection
                      pairingButtonsSection
                      targetSection
                      exploitSection
                      logSection
                      logActionsSection
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { refresh(); pairedTick &+= 1 }
                  .onReceive(ticker) { _ in refresh() }
                  .onChange(of: airlift.state) { _, _ in pairedTick &+= 1 }
                  .refreshable { refresh(); pairedTick &+= 1 }
              }

              private var statusSection: some View {
                  Section {
                      HStack(spacing: 16) {
                          ZStack {
                              Circle()
                                  .fill(loopbackVPNUp ? Color.green.opacity(0.15) : Color.orange.opacity(0.15))
                                  .frame(width: 72, height: 72)
                              Image(systemName: loopbackVPNUp ? "checkmark.shield.fill" : "exclamationmark.shield.fill")
                                  .font(.system(size: 32, weight: .semibold))
                                  .foregroundStyle(loopbackVPNUp ? .green : .orange)
                                  .shadow(color: (loopbackVPNUp ? Color.green : Color.orange).opacity(0.55), radius: 6)
                          }
                          VStack(alignment: .leading, spacing: 4) {
                              Text("LocalDevVPN").font(.headline)
                              Text(loopbackVPNUp ? "Connected" : "Not connected")
                                  .font(.subheadline)
                                  .foregroundStyle(loopbackVPNUp ? .green : .orange)
                                  .shadow(color: (loopbackVPNUp ? Color.green : Color.orange).opacity(0.55), radius: 3)
                              if let t = tunnelIP {
                                  Text("Tunnel \(t)")
                                      .font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.green)
                                      .shadow(color: Color.green.opacity(0.55), radius: 3)
                              }
                          }
                          Spacer()
                      }
                      .padding(.vertical, 8)
                  } header: {
                      Label("Current status", systemImage: "shield.lefthalf.filled")
                  }
              }

              private var sessionSection: some View {
                  Section {
                      HStack {
                          Text("Tunnel IP")
                          Spacer()
                          Text(tunnelIP ?? "\u{2014}")
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(tunnelIP != nil ? .green : .secondary)
                              .shadow(color: tunnelIP != nil ? Color.green.opacity(0.55) : Color.clear, radius: 3)
                      }
                      HStack {
                          Text("Device IP")
                          Spacer()
                          Text(deviceIP ?? "\u{2014}")
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(deviceIP != nil ? .green : .secondary)
                              .shadow(color: deviceIP != nil ? Color.green.opacity(0.55) : Color.clear, radius: 3)
                      }
                  } header: {
                      Label("Session details", systemImage: "network")
                  }
              }

              private var pairingStatusSection: some View {
                  Section {
                      if let pin = airlift.pairPIN {
                          pinCard(pin: pin)
                      } else {
                          HStack(spacing: 16) {
                              ZStack {
                                  Circle()
                                      .fill(pairingColor.opacity(0.15))
                                      .frame(width: 72, height: 72)
                                  Image(systemName: pairingIcon)
                                      .font(.system(size: 32, weight: .semibold))
                                      .foregroundStyle(pairingColor)
                                      .shadow(color: pairingColor.opacity(0.55), radius: 5)
                              }
                              VStack(alignment: .leading, spacing: 4) {
                                  Text(pairingTitle).font(.headline)
                                  Text(pairingSubtitle)
                                      .font(.subheadline)
                                      .foregroundStyle(pairingColor)
                                      .lineLimit(3)
                              }
                              Spacer()
                          }
                          .padding(.vertical, 8)
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }
              }

              @ViewBuilder
              private func pinCard(pin: String) -> some View {
                  VStack(spacing: 14) {
                      HStack(spacing: 8) {
                          Image(systemName: "lock.shield.fill")
                              .foregroundStyle(.orange)
                              .shadow(color: Color.orange.opacity(0.65), radius: 4)
                          Text("Enter this PIN in Settings")
                              .font(.footnote)
                              .foregroundStyle(.secondary)
                          Spacer()
                      }
                      HStack(spacing: 12) {
                          ForEach(Array(pin.enumerated()), id: \.offset) { _, ch in
                              Text(String(ch))
                                  .font(.system(size: 34, weight: .black, design: .rounded))
                                  .foregroundStyle(.orange)
                                  .shadow(color: Color.orange.opacity(pinPulse ? 0.75 : 0.35), radius: pinPulse ? 8 : 4)
                                  .frame(width: 46, height: 60)
                                  .background(Color.orange.opacity(0.12), in: RoundedRectangle(cornerRadius: 10, style: .continuous))
                          }
                          Spacer()
                      }
                      .onAppear {
                          withAnimation(.easeInOut(duration: 1.1).repeatForever(autoreverses: true)) {
                              pinPulse.toggle()
                          }
                      }
                      Button {
                          if let url = URL(string: UIApplication.openSettingsURLString) {
                              UIApplication.shared.open(url)
                          }
                      } label: {
                          HStack {
                              Image(systemName: "gear")
                              Text("Open Settings")
                          }
                          .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.borderedProminent)
                      .tint(.orange)
                      .controlSize(.large)
                      Text("Privacy & Security -> Developer Mode -> Pair with natsuk1")
                          .font(.caption2)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.center)
                  }
                  .padding(.vertical, 8)
              }

              private var pairingButtonsSection: some View {
                  Section {
                      Button { airlift.runPairing() } label: {
                          HStack {
                              Image(systemName: isPaired ? "checkmark.circle.fill" : "link.circle")
                              Text(isPaired ? "Already Paired" : "Start Pairing")
                              Spacer()
                              if isPairing {
                                  ProgressView()
                              }
                          }
                      }
                      .disabled(isPairing || isPaired)
                      Button(role: .destructive) { airlift.cancelPairing() } label: {
                          HStack {
                              Image(systemName: "xmark.circle")
                              Text("Cancel Pairing")
                          }
                      }
                      .disabled(!isPairing)
                      Button(role: .destructive) { airlift.deletePairing(); pairedTick &+= 1 } label: {
                          HStack {
                              Image(systemName: "trash")
                              Text("Delete Pairing")
                          }
                      }
                      .disabled(!isPaired)
                  }
              }

              private var targetSection: some View {
                  Section {
                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target }, set: { airlift.target = $0 }))
                              .font(.system(size: 12, design: .monospaced))
                              .multilineTextAlignment(.trailing)
                              .autocorrectionDisabled()
                              .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Target", systemImage: "scope")
                  }
              }

              private var exploitSection: some View {
                  Section {
                      Button { airlift.runExploit() } label: {
                          HStack {
                              Image(systemName: "bolt.fill")
                              Text("Run Exploit")
                              Spacer()
                              if airlift.state == .running { ProgressView() }
                          }
                      }
                      .disabled(airlift.state == .running || !loopbackVPNUp || !isPaired)
                      Button(role: .destructive) { airlift.cancelExploit() } label: {
                          HStack {
                              Image(systemName: "stop.circle")
                              Text("Cancel Exploit")
                          }
                      }
                      .disabled(airlift.state != .running)
                  } header: {
                      Label("Exploit", systemImage: "cpu")
                  }
              }

              @ViewBuilder
              private var logSection: some View {
                  if !airlift.exploitLog.isEmpty {
                      Section {
                          LogTerminal(text: airlift.exploitLog.joined(separator: "\n"))
                      } header: {
                          Label("Log", systemImage: "terminal")
                      }
                  }
              }

              @ViewBuilder
              private var logActionsSection: some View {
                  if !airlift.exploitLog.isEmpty {
                      Section {
                          Button {
                              UIPasteboard.general.string = airlift.exploitLog.joined(separator: "\n")
                              copied = true
                              DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { copied = false }
                          } label: {
                              HStack {
                                  Image(systemName: copied ? "checkmark" : "doc.on.doc")
                                  Text(copied ? "Copied!" : "Copy All")
                              }
                          }
                          Button(role: .destructive) { airlift.clearLog() } label: {
                              HStack {
                                  Image(systemName: "trash")
                                  Text("Clear")
                              }
                          }
                      } header: {
                          Label("Log Actions", systemImage: "document.on.document")
                      }
                  }
              }

              private func refresh() {
                  let vpn = NetworkStatus.loopbackVPNUp()
                  let tun = NetworkStatus.tunnelIP()
                  let dev = NetworkStatus.deviceIP()
                  if loopbackVPNUp != vpn { loopbackVPNUp = vpn }
                  if tunnelIP != tun { tunnelIP = tun }
                  if deviceIP != dev { deviceIP = dev }
              }

              private var isPairing: Bool {
                  if case .pairing = airlift.state { return true }
                  return false
              }

              private var isPaired: Bool {
                  _ = pairedTick
                  return airlift.hasPairing()
              }

              private var pairingColor: Color {
                  if isPaired { return .green }
                  if isPairing { return .orange }
                  if case .done(false, _) = airlift.state { return .red }
                  return .secondary
              }

              private var pairingIcon: String {
                  if isPaired { return "checkmark.seal.fill" }
                  if isPairing { return "link.circle.fill" }
                  if case .done(false, _) = airlift.state { return "xmark.seal.fill" }
                  return "link.circle"
              }

              private var pairingTitle: String {
                  if isPaired { return "Paired" }
                  if isPairing { return "Pairing" }
                  if case .done(false, _) = airlift.state { return "Failed" }
                  return "Not Paired"
              }

              private var pairingSubtitle: String {
                  if isPaired { return "Credentials saved" }
                  if isPairing {
                      return airlift.pairingStatus.isEmpty ? "Starting..." : airlift.pairingStatus
                  }
                  if case .done(false, let msg) = airlift.state { return msg }
                  return "Open Settings to pair"
              }
          }
          SWIFT_AIRLIFT

      - name: Update ai-hints
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f docs/ai-hints.md ] && ! grep -q '## PAIRING FILE FORMAT' docs/ai-hints.md; then
            printf '\n## PAIRING FILE FORMAT\n\n' >> docs/ai-hints.md
            printf 'AirLift pairing plist has exactly these keys:\n\n' >> docs/ai-hints.md
            printf -- '- public_key (data, 32 bytes)\n' >> docs/ai-hints.md
            printf -- '- private_key (data, 32 bytes)\n' >> docs/ai-hints.md
            printf -- '- identifier (string, UUID)\n' >> docs/ai-hints.md
            printf -- '- alt_irk (data, 16 bytes)\n\n' >> docs/ai-hints.md
            printf 'Validation: at least 3 of 4 keys present. Never check for UDID/HostCertificate/etc.\n' >> docs/ai-hints.md
            printf 'Location: Documents/natsuk1_pairing.plist OR nested Data/Application/<UUID>/Documents/.\n' >> docs/ai-hints.md
          fi

          if [ -f docs/ai-hints.md ] && ! grep -q '## USER RULES 2026-09' docs/ai-hints.md; then
            printf '\n## USER RULES 2026-09\n\n' >> docs/ai-hints.md
            printf -- '- All code, strings, comments in English only.\n' >> docs/ai-hints.md
            printf -- '- Match existing style: @unchecked Sendable, DispatchQueue.main.async, no @MainActor.\n' >> docs/ai-hints.md
            printf -- '- Never use Task or Task.detached in views or state classes.\n' >> docs/ai-hints.md
            printf -- '- Never mutate @Published from background. Always DispatchQueue.main.async unconditionally.\n' >> docs/ai-hints.md
            printf -- '- Pairing is done exclusively in Tools -> Airlift. CarrierLab reads pairing file, never writes it.\n' >> docs/ai-hints.md
            printf -- '- Highlight values with glow: .shadow(color: color.opacity(0.55), radius: 3).\n' >> docs/ai-hints.md
            printf -- '- No log spam on silent refresh. Only user actions write log.\n' >> docs/ai-hints.md
            printf -- '- No "type INSTALL" confirmations. Buttons act immediately.\n' >> docs/ai-hints.md
            printf -- '- project.yml always written in full via cat heredoc, never patched with sed/perl.\n' >> docs/ai-hints.md
          fi

          if [ -f docs/ai-hints.md ] && ! grep -q '## CARRIERLAB' docs/ai-hints.md; then
            printf '\n## CARRIERLAB\n\n' >> docs/ai-hints.md
            printf 'iOS port of MTS_CARRIER_FORUM core logic.\n\n' >> docs/ai-hints.md
            printf -- '- CarrierAssets bundled under Resources/CarrierAssets.\n' >> docs/ai-hints.md
            printf -- '- check dispatches to global queue, updates state via main.async.\n' >> docs/ai-hints.md
            printf -- '- install writes CarrierLab.bundle and Docomo_jp.bundle via al_exploit_run.\n' >> docs/ai-hints.md
            printf -- '- reload re-writes Docomo_jp.bundle only.\n' >> docs/ai-hints.md
            printf -- '- reset clears session, does not revert the phone.\n' >> docs/ai-hints.md
            printf -- '- view auto-refreshes every 2.5 s silent, no log spam.\n' >> docs/ai-hints.md
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: pairing keys, pin card, silent refresh [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          grep -q 'CarrierAssets' project.yml
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' \
                       -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) \
                -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 \
            && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"