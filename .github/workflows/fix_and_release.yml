          NECP internal:
          - necp_handler_core              0xFFFFFFF00A501454
          - necp_tlv_packer                0xFFFFFFF00A4C3558
          - necp_copy_state                0xFFFFFFF00A4ED8BC
          - necp_session_lookup            0xFFFFFFF00A4ED864
          - necp_raw_lookup                0xFFFFFFF00A4DB8D4
          - necp_release_session           0xFFFFFFF00A4E5284
          - necp_ref_dec                   0xFFFFFFF00A4E3278
          - necp_add_flow_core             0xFFFFFFF00A4E843C
          - necp_match_policy              0xFFFFFFF00A4F75D8
          - necp_session_open              0xFFFFFFF00A4B4C3C
          - necp_session_action            0xFFFFFFF00A4BD438

          IOKit:
          - iokit_user_client_trap         0xFFFFFFF00A98C2E8
          - is_io_service_open_extended    0xFFFFFFF00A988758
          - io_connect_method              0xFFFFFFF00A9AD62C

          New syscalls 27.0:
          - nexus:   0xA802220 .. 0xA803FE8
          - channel: 0xA7DACEC .. 0xA7DCF00
          - ulock:   0xA754778, 0xA755798, 0xA7547C0

          ## NECP STATUS

          Working:
          - op 0x03 returns 1 byte
          - op 0x04 and 0x1A return 280-byte TLV
          - op 0x0D returns caller VA (NOT a kernel pointer, no leak)

          Closed (bounded, no primitive):
          - op 0x05 copy_list returns -1
          - op 0x0C copy_parameters returns -1
          - op 0x0F copy_update returns -1
          - op 0x18 get_signed_id returns empty
          - op 0x19 set_signed_id returns -1
          - TLV overflow len=0xFFFFFFFF rejected
          - add_flow len in [0x24, 0xF0] accepted
          - remove_flow twice returns ret=0
          - copy_result_inner kptr count 0
          - copy_interface idx 1..10 no data

          Taint verdict (v48, v57, v58, v59, v60, v66, v71, v72, v73):
          - 24 NECP sources + 18 session_action cases scanned
          - all propagate taint, all depth-0 sinks bounded
          - both deep kalloc_type sites (0xA1C6B80, 0xA3ACA70) are internal
            packet/string parsers with CARRY4 overflow checks
          - necp_session_action cases 0x03, 0x06, 0x07, 0x0d, 0x0e, 0x10,
            0x11, 0x12 all bounded via unsigned-range-check idiom
          - necp_match_policy bounded via (uVar5 - 0x401 < 0xfffffffffffffc00)
          - NECP as user-facing primitive: CLOSED

          ## IOKIT STATUS

          - iokit_user_client_trap calls io_connect_method (0xA9AD62C)
          - param_3 in [0x18, 0x800] with CARRY8 plus cap 0x800 double-check
          - copyin to stack buffer 0x800, bounded
          - is_io_service_open_extended: no depth-0 sinks reachable
          - per-driver externalMethod dispatch tables: scanner v64 found
            only 4 candidates, all bounded via memmove wrappers
          - MIG Mach-routine handlers NOT scanned (next surface)

          ## BSD SYSCALL STATUS

          - sysent parsed via PAC unwrap: 557/558 unpacked, 117 dup aliases
          - 300 syscalls passed narg>0 filter
          - 87 sources produced findings
          - depth-0 copyin sites reviewed (9 functions), all bounded:
            0xA6CEB4C ioctl-family cap 0x1fff
            0xA78D724 recvmsg iovlen < 0x401
            0xA74BF88 ioctl-family cap 0x1fff
            0xA74EA2C / 0xA74E884 forward to kdebug loggers
            0xA70E210 cap 0x10 stack only
            0xA78AE18 / 0xA78A1E8 cap 0x80 stack
            0xA743B90 cap 0x800
          - BSD syscalls as user-facing primitive: CLOSED for shallow paths

          ## NEW SURFACE (iOS 27 additions)

          - nexus:   505..511 (open/register/deregister/create/destroy/get_opt/set_opt)
          - channel: 512..516 (open/get_info/sync/get_opt/set_opt)
          - ulock:   517..518 (wait/wake) plus 546 (wait2)
          - all closed at depth >= 6, no shallow user->sink
          - __channel_sync has kalloc_type at d=8/d=9, copyin at d=6, bounded

          ## WHAT A PRIMITIVE LOOKS LIKE

          A real primitive requires ALL of:
          1. user-controlled size in kalloc_type / kalloc_zone
          2. no pre-validation between decode and alloc
          3. copyin / copyout / memmove with size not matching allocation

          Common false positives:
          - ioctl cmd >> 16 AND mask, capped before alloc
          - if (size > CONST) return error immediately before alloc
          - (user_a + user_b) * CONST with CARRY4 / CARRY8 check
          - stack buffer fixed N, size checked against N, copyin(N)
          - unsigned-range-check idiom: (x - MIN < MAX - MIN). This is
            SAFE. Occurs everywhere in NECP. Never flag as INT_OVERFLOW.
          - SoftwareBreakpoint(0x5519) on mismatch, hardening trap not vuln

          ## TAINT METHOD

          Sources: user-controlled parameter functions. For each, treat all
          parameters as tainted, propagate through SSA.

          Sinks: kalloc_type, kalloc_zone, copyin, copyout, memmove, memset,
          kfree_type, ref_dec.

          1. Get HighFunction from DecompInterface.
          2. Get parameter varnodes via hf.getLocalSymbolMap. NOT via
             getFunctionPrototype().getStorage() which silently returns 0.
          3. Compare varnodes by key addr.toString() plus colon plus str(size).
             NOT by Java object identity.
          4. Iterate hf.getPcodeOps. If any input is tainted, output becomes
             tainted. Loop until no change.
          5. For each PcodeOp.CALL, resolve target via getInput(0).isAddress().
             If sink, check size-arg varnode. Otherwise recurse into callee
             with tainted arg indices.
          6. Cap depth (12), worklist (40000), total time (1800 sec).

          ## HOW TO WRITE GHIDRA JYTHON SCRIPTS

          String handling: never use plus between quotes and identifiers.
          Editors mangle it into invalid syntax. Use percent formatting.

          Tuple literals: never put 0x at position 0. Use named constants.

          Dictionary access: use .get() not bracket in assignment position.

          PcodeOp address: PcodeOpAST has no getAddress(). Use
          getSeqnum().getTarget().getOffset().

          Function boundaries: call ensure_function for un-decompiled
          addresses. DisassembleCommand then CreateFunctionCmd, fallback to
          FunctionManager.createFunction.

          Parameter varnodes: hf.getLocalSymbolMap() is the only correct
          path. Wrap sym.isParameter, sym.getCategoryIndex,
          sym.getHighVariable().getInstances.

          Varnode identity: compare by vn_key string addr plus colon plus
          size, never by Java object identity.

          Imports: wrap Ghidra command imports in try/except with HAS flags.

          Decompiler instance: one DecompInterface cached in module global.
          Never recreate per function.

          Timeouts: decompileFunction(f, sec, monitor). 30-45 sec medium,
          90 sec large. One uncapped function hangs the whole CI job.

          Crash-proof main: wrap main in try/except, write FATAL plus
          traceback to output file.

          Validation: python3 -c "import ast,sys; ast.parse(open(path).read())"

          ## WORKFLOW

          Two workflows only:
          - fix_and_release.yml (build)
          - extract_offsets.yml (Ghidra analysis)

          Cache keys: ghidra, ipsw, symbolicator, kernelcache,
          ghidra_project, symbols. Warm run 3-6 min. Never hashFiles on
          kernelcache. Never delete cached dirs in cleanup.

          kernel_rw.py writes exactly ONE file: result.txt, no more than
          100 KB. No offsets.json, no primitives.json, no dump.txt.

          Ghidra headless invocation:
          analyzeHeadless <proj_dir> <proj_name> -process <name> -noanalysis
            -scriptPath <repo>/scripts -postScript kernel_rw.py

          ## LOGGING FOR EXPLOIT (necp.c)

          The necp.c logging uses nk_logx tag plus message. Every line goes
          through the Swift callback into AppState.log and to CrashLog.

          Rules:
          - Log every syscall result with errno: LI(tag, fd=%d errno=%d, fd, errno)
          - Log raw return values from every NECP op with op code and ret
          - Log byte buffer length after every op
          - Log hexdumps only when ret is in range (0, 600]
          - Log kptr scans separately with offset and value
          - Wrap each probe in TRACE so log flow is visible
          - Never log more than 2048 bytes per hexdump
          - Use percent formatting everywhere, never plus
          - Every probe ends with done or error marker for grepping

          ## COMMON ERRORS AND FIXES

          unterminated string literal: editor inserted quote before 0x. Use
          int("HEX", 16) constants.

          quote-plus-identifier: use percent formatting.

          unmatched close paren: use .get() instead of bracket.

          PcodeOpAST has no getAddress: use getSeqnum().getTarget().

          seed=0 on every source: use getLocalSymbolMap().

          tainted=0 after seed>0: compare vn_key strings not Java objects.

          no func for a known symbol: ensure_function plus DisassembleCommand.

          parsed unpacked 0: wrong PAC formula, use KERNEL_BASE plus low32.

          Grappa rc=-5 after patch: restore tokens with nk-grappa-restored.

          SyncFailed at ATC: transient, ignore if readback succeeds.

          ## GRAPPA RPPAIRING CONFIRMED WORKING

          Pipeline (iOS 27, empty entitlements):
          - tunnel up on 10.7.0.1:49152 via raw RPPairing
          - RSD publishes about 85 services
          - AFC connects, StreamingZip extracts
          - ATC: Capabilities, InstalledAssets, AssetMetrics, SyncAllowed
          - Grappa: 84 bytes generated from static fallback
          - ReadyForSync, AssetManifest, FileComplete 3/3
          - canary readback via AFC matches
          - cleanup restores original Books.plist

          Do NOT collapse kAuthenticGrappaTokens to NULL. Do NOT expect
          host-side Grappa on iOS. Do NOT treat SyncFailed as fatal.

          ## UI / SWIFTUI iOS 27

          - overlay(RespringView()) causes CA UAF and SIGSEGV. Use
            UIHostingController
          - List with conditional Section else Section crashes
          - scaleEffect inside if breaks ConditionalContent
          - Published mutation from Task causes race and UAF
          - RuntimeView must not show green when slide or base equal dash
          - respring button lives only in ToolsView, not AirliftView

          ## NEXT STEPS

          1. IOKit per-driver externalMethod scanner with array filter
             (require at least 3 adjacent dispatch entries)
          2. MIG Mach-routine handlers (mach_msg_trap dispatcher)
          3. Concurrency analysis (UAF / TOCTOU) for specific lock pairs
          4. If all closed statically, pivot to dynamic fuzzing

          Do not spend more than 2-3 attempts on the same primitive.

          ## WHAT NOT TO DO

          - Do not change SYS_NECP_OPEN/ACTION in necp.c (they are correct
            at 501/502; only parser base was wrong)
          - Do not create fix_and_test.yml or build_and_release.yml
          - Do not use hashFiles on kernelcache
          - Do not run blind syscall sweeps
          - Do not call proc_info, csops, task_info sweep, mach_port_names
          - Do not use non-empty entitlements
          - Do not mutate Published from Task
          - Do not put RespringView in the SwiftUI tree
          - Do not commit natsuk1.xcodeproj
          - Do not trust offsets without Ghidra verification
          - Do not answer without web search first
          - Do not delete ghidra / ghidra_project / kernelcache / symbolicator
          - Do not collapse the Grappa token array to NULL
          - Do not use plus between string literals and identifiers in Jython
          - Do not use bracket access on dict or list in assignment position
          - Do not put 0x literals at position 0 of a tuple
          - Do not put content at column 0 inside a YAML run pipe block
          - Do not flag unsigned-range-check as INT_OVERFLOW (false positive)
          AI_HINTS_EOF
