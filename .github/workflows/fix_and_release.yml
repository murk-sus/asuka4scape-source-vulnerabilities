name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml

      - name: Write rules file
        run: |
          cat > /tmp/rules.md <<'RULES_EOF'

          ## 🤖 AUTO-GENERATED RESEARCH RULES

          Этот блок обновляется workflow при каждом push.
          **Читать первым делом. Не нарушать.**

          ### Обновлено
          - date: 2026-09-26
          - device: iPhone14,5 / iOS 27.0 / 24A437
          - necp_status: **closed** (исчерпан)

          ### 1. NECP — статус "ЗАКРЫТ"

          Проверено всё:
          - `op=0x03/0x04/0x10/0x1A` возвращают **ровно 310 байт** TLV
          - `op=0x0D` (sysctl_arena) → user VA, RO, kernel-wide singleton,
            первые 256 байт одинаковые у всех клиентов, `vm_protect(RW_COPY)`
            даёт COW-копию — **ядро наших записей не видит**
          - `op=0x05 copy_list` → ret=-1
          - `op=0x0C copy_parameters` → ret=-1
          - `op=0x0F copy_update` → ret=-1
          - `op=0x18/0x19` signed_id → пусто / -1
          - TLV overflow (`len=0xffffffff`) → kernel отклоняет
          - double-free `remove_flow x2` → ret=0, но `copy_result` = 1 байт
          - kptr count во всех dump'ах = 0

          **Вывод:** NECP — обычный userspace API. Примитивов нет.

          ### 2. iOS 27 sandbox — критично

          - **`SIGKILL - CODESIGNING` = AMFI убивает ad-hoc приложение на iOS 27**
            при вызове определённых syscall'ов:
            - `proc_info(336)` — flavors 1..20
            - `csops(169)` — ops 0..15
            - `task_info` — flavors 1..40
            - `mach_port_names` — при большом count
          - **Не вызывать их из ad-hoc подписанного приложения.**
          - **Blind syscall sweep 0..558** убивает через `SIGSYS` на `syscall(78)`.
            Whitelist: `getpid(20)`, `getuid(24)`, `getgid(47)`, `getppid(39)`,
            `geteuid(25)`, `getegid(43)`, `gettid(286)`, `getpgid(202)`.
          - `socket()`, `getsockopt()`, `setsockopt()`, `sysctl`, `uname` — **безопасны**.

          ### 3. Сборка — грабли

          - `#include <mach/mach_vm.h>` → **`error: mach_vm.h unsupported`** в iPhoneOS SDK 26.5.
            Объявлять extern вручную:
            ```c
            extern kern_return_t mach_vm_read_overwrite(vm_map_t, mach_vm_address_t,
                mach_vm_size_t, mach_vm_address_t, mach_vm_size_t*);
            extern kern_return_t mach_vm_write(vm_map_t, mach_vm_address_t,
                vm_offset_t, mach_msg_type_number_t);
            extern kern_return_t mach_vm_protect(vm_map_t, mach_vm_address_t,
                mach_vm_size_t, boolean_t, vm_prot_t);
            ```
          - `TCP_KEEPINIT`, `TCP_FASTOPEN_KEY`, `SO_REUSEPORT_LF`, `SO_NO_CHECK` — **не в SDK**.
            Sweep только по числам.
          - `@MainActor` + `nonisolated(unsafe) static let shared = Foo()` → ошибка компиляции.
            Использовать `final class Foo: ObservableObject, @unchecked Sendable`,
            `nonisolated(unsafe) static let shared = Foo()`, `private init()`.

          ### 4. SwiftUI iOS 27 — что роняет

          - `.overlay(RespringView())` — **никогда**. WKWebView спамит GPU → CA UAF → SIGSEGV.
          - `List { if cond { Section } else { Section } }` в корне → падает.
          - `.scaleEffect()` внутри `if` → `_ConditionalContent` ломается.
          - Мутации `@Published` из `Task { }` → race → UAF. Только `Timer`.

          ### 5. LiveContainer

          `SIGKILL - CODESIGNING` = LC ломает подпись embedded .app на iOS 27.
          **Ставить IPA напрямую** через Sideloadly / AltStore / TrollStore / ESign.
          Не через LiveContainer.

          ### 6. Оффсеты (iOS 27.0 / 24A437)

          ```
          necp_open                      0xFFFFFFF00A4E411C
          necp_client_action             0xFFFFFFF00A4E5C28
          necp_client_copy_result        0xFFFFFFF00A4E7BE8
          necp_client_copy_result_inner  0xFFFFFFF00A4F26F0
          necp_client_add_flow           0xFFFFFFF00A4E843C
          necp_client_remove_flow        0xFFFFFFF00A4E93C4
          necp_client_copy_interface     0xFFFFFFF00A4EAC7C
          necp_client_sysctl_arena       0xFFFFFFF00A4EB704
          necp_client_copy_update        0xFFFFFFF00A4EC264
          necp_get_tlv_at_offset         0xFFFFFFF00A4C2034
          copyin                         0xFFFFFFF00A368EC0
          copyout                        0xFFFFFFF00A369A3C
          kalloc_type                    0xFFFFFFF00A200988
          kfree_type                     0xFFFFFFF00A201000
          kalloc_type_necp_flow          0xFFFFFFF007C62E68
          ```
          KBASE = `0xFFFFFFF007004000`, slide = `0x3D00000`.

          ### 7. Ghidra / CI

          - Jython 2.7: только 4 пробела. Валидация через `ast.parse`.
          - Warm = `-process -noanalysis` (1-3 мин). Cold = `-import` (24-90 мин).
          - Ключи кэша — статические с версией. **Никогда** `hashFiles`.
          - Символизация: `ipsw kernel symbolicate --signatures symbolicator/kernel/27.0/kexts`.
          - Kernelcache iOS 27 — **уже Mach-O**. Не декомпрессировать.

          ### 8. YAML

          - **Не пихать C/Swift код в heredoc длиннее 30 строк**. Любая строка с неправильным
            отступом ломает весь YAML.
          - Все строки heredoc на 10 пробелах от начала файла.
          - `set +e` + `FAIL=1`, `grep -q -e "pattern"`.
          - Один workflow — `fix_and_release.yml`.

          ### 9. Что дальше

          1. **mbuf / socket** — `sendmsg` + `msg_control`, `setsockopt(IPPROTO_*)`, mbuf UAF.
          2. **IOKit** — `IOSurface`, `IOConnectCallMethod`, `IOHIDEvent`.
          3. **Ghidra** — `sbappendcontrol`, `m_copydata`, `sock_getsockopt`.

          После 2-3 попыток — менять подход.

          ### 10. Что НЕ делать

          - Не создавать `fixPublished_and_test.yml` / `build_and_release.yml`.
          - Не пихать C/Swift в heredoc.
          - Не использовать `hashFiles('kernelcache/**')`.
          - Не делать blind syscall sweep.
          - **Не вызывать `proc_info(336)`, `csops(169)`, `task_info` flavor sweep,
            `mach_port_names` из ad-hoc приложения — SIGKILL CODESIGNING.**
          - Не мутировать `@` из `Task {}`.
          - Не класть `RespringView` в дерево SwiftUI.
          - Не вызывать `al_device_respring`.
          - Не коммитить `natsuk1.xcodeproj`.
          - Не забывать `import Combine`.
          - Не доверять оффсетам без Ghidra.
          RULES_EOF

      - name: Update README
        run: |
          python3 - <<'PY_EOF'
          import re, os
          p = "README.md"
          s = open(p).read() if os.path.exists(p) else "# natsuk1\n"
          rules = open("/tmp/rules.md").read()
          ms = "<!-- AUTO-RULES-START -->"
          me = "<!-- AUTO-RULES-END -->"
          s = re.sub(re.escape(ms) + r".*?" + re.escape(me), "", s, flags=re.DOTALL)
          s = s.rstrip() + "\n\n" + ms + "\n" + rules + "\n" + me + "\n"
          open(p, "w").write(s)
          print("README size=%d" % len(s))
          PY_EOF
          tail -20 README.md

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <sys/sysctl.h>
          #include <sys/socket.h>
          #include <sys/utsname.h>
          #include <netinet/in.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include "nk_api.h"
          #include "nk_offsets.h"
          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define RESBUF 65536
          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;
          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)
          #define TRACE(s) LI("TRACE", ">>> " s)
          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, 0x01, uuid, (size_t)16, p, (size_t)1);
          }
          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56]; memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, 0x11, (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) { memcpy(fu, req, 16); fu[9] |= 0x01; }
              return r;
          }
          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex), "%04x: %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x",
                      i, buf[i+0], buf[i+1], buf[i+2], buf[i+3], buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11], buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }
          static int scan_kptr(const char *tag, const uint8_t *buf, int len, int maxhits) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v; memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= maxhits) break;
                  }
              }
              return found;
          }
          static int step_sysinfo(void) {
              TRACE("sysinfo");
              struct utsname u;
              if (uname(&u) == 0) {
                  LI("A1", "sysname=%s release=%s version=%s machine=%s",
                     u.sysname, u.release, u.version, u.machine);
              }
              const char *keys[] = {
                  "kern.osproductversion", "kern.osversion", "kern.version",
                  "kern.uuid", "kern.hostname", "kern.secure_kernel",
                  "hw.machine", "hw.model", "hw.memsize", "hw.ncpu",
                  "hw.cpufamily", "hw.cputype", "hw.cpusubtype", "hw.targettype"
              };
              for (size_t i = 0; i < sizeof(keys)/sizeof(keys[0]); i++) {
                  char val[256]; size_t sz = sizeof(val); memset(val, 0, sizeof(val));
                  if (sysctlbyname(keys[i], val, &sz, NULL, 0) == 0) {
                      LI("A2", "%s = %s", keys[i], val);
                  }
              }
              return 0;
          }
          static int step_necp_recap(void) {
              TRACE("necp_recap");
              int fd = nfd();
              if (fd < 0) { LE("B1", "open errno=%d", errno); return -1; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              nadd_flow(fd, cu, fu);
              uint32_t ops[] = {0x03, 0x04, 0x10, 0x1A};
              for (size_t i = 0; i < 4; i++) {
                  uint8_t buf[2048]; memset(buf, 0, sizeof(buf));
                  int c = (int)syscall(SYS_NECP_ACTION, fd, ops[i],
                                       (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                  LI("B1", "op=0x%02x ret=%d", ops[i], c);
                  if (c > 0 && c < 600) {
                      hexdump("B1H", buf, c, 512);
                      scan_kptr("B1K", buf, c, 8);
                  }
              }
              close(fd);
              return 0;
          }
          static int step_getsockopt_sweep(void) {
              TRACE("getsockopt_sweep");
              int levels[] = {0xffff, 0, 6, 41, 1, 17};
              const char *names[] = {"SOL_SOCKET","IP","TCP","IPV6","ICMP","UDP"};
              for (size_t li = 0; li < sizeof(levels)/sizeof(levels[0]); li++) {
                  int s = socket(AF_INET, SOCK_STREAM, 0);
                  if (s < 0) { LI("D1", "socket fail level=%d", levels[li]); continue; }
                  int hits = 0;
                  for (int opt = 0; opt <= 200; opt++) {
                      uint8_t buf[128]; socklen_t bl = sizeof(buf); memset(buf, 0, sizeof(buf));
                      if (getsockopt(s, levels[li], opt, buf, &bl) == 0 && bl > 4) {
                          hits++;
                          if (hits <= 5) {
                              LI("D1", "%s opt=%d bl=%u", names[li], opt, (unsigned)bl);
                              hexdump("D1H", buf, bl, 128);
                              scan_kptr("D1K", buf, bl, 4);
                          }
                      }
                  }
                  LI("D1", "%s done hits=%d", names[li], hits);
                  close(s);
              }
              return 0;
          }
          static int step_vm_region_scan(void) {
              TRACE("vm_region_scan");
              mach_port_t task = mach_task_self();
              vm_address_t addr = 0x100000000ULL;
              vm_address_t limit = 0x108000000ULL;
              int n = 0;
              while (addr < limit && n < 100) {
                  vm_size_t size = 0;
                  vm_region_basic_info_data_64_t info;
                  mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64;
                  mach_port_t obj = MACH_PORT_NULL;
                  kern_return_t kr = vm_region_64(task, &addr, &size,
                                                  VM_REGION_BASIC_INFO_64,
                                                  (vm_region_info_t)&info, &cnt, &obj);
                  if (kr != KERN_SUCCESS) { LI("DC", "stop at 0x%llx kr=%d", (unsigned long long)addr, kr); break; }
                  if (n < 20) {
                      LI("DC", "0x%llx-0x%llx size=0x%llx prot=%d",
                         (unsigned long long)addr,
                         (unsigned long long)(addr + size),
                         (unsigned long long)size, info.protection);
                  }
                  addr += size;
                  n++;
                  if (size == 0) break;
              }
              LI("DC", "total=%d", n);
              return 0;
          }
          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v7.2 - SAFE RECON (no AMFI triggers)");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");

              step_sysinfo();
              step_necp_recap();
              step_getsockopt_sweep();
              step_vm_region_scan();

              TRACE("done");
              return 0;
          }
          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) { nk_log("[!] already running"); return 1; }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          void nk_necp_cancel(void) { g_cancel = 1; nk_log("[!] cancel requested"); }
          NECP_EOF

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT=NO \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then echo "no .app"; exit 1; fi
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v7.2

          Install DIRECTLY, not via LiveContainer.

          IPA: ${IPA_URL}
          AltStore: altstore://install?url=${IPA_URL}
          Scarlet: scarlet://install?url=${IPA_URL}
          ESign: esign://install?url=${IPA_URL}

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" --prerelease --latest=false \
            --notes "$NOTES"

      - name: Commit README
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "no README changes"; exit 0; fi
          git commit -m "docs: auto-update research rules [skip ci]"
          git push