          w("                    .foregroundStyle(deviceIP != nil ? .green : .secondary)")
          w("                    .shadow(color: deviceIP != nil ? Color.green.opacity(0.55) : Color.clear, radius: 3)")
          w("            }")
          w("        } header: {")
          w("            Label(\"Session details\", systemImage: \"network\")")
          w("        }")
          w("    }")
          w("")
          w("    private var pairingStatusSection: some View {")
          w("        Section {")
          w("            HStack(spacing: 16) {")
          w("                ZStack {")
          w("                    Circle()")
          w("                        .fill(pairingColor.opacity(0.15))")
          w("                        .frame(width: 72, height: 72)")
          w("                    Image(systemName: pairingIcon)")
          w("                        .font(.system(size: 32, weight: .semibold))")
          w("                        .foregroundStyle(pairingColor)")
          w("                }")
          w("                VStack(alignment: .leading, spacing: 4) {")
          w("                    Text(pairingTitle).font(.headline)")
          w("                    Text(pairingSubtitle)")
          w("                        .font(.subheadline)")
          w("                        .foregroundStyle(pairingColor)")
          w("                        .lineLimit(2)")
          w("                    if let pin = airlift.pairPIN {")
          w("                        Text(\"PIN \\(pin)\")")
