name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-v47-${{ hashFiles('project.yml') }}
          restore-keys: nk-v47-

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Fetch carrier assets
        run: |
          set -euo pipefail
          ROOT=natsuk1/Resources/CarrierAssets
          rm -rf "$ROOT"
          mkdir -p "$ROOT/CarrierLab.bundle/signatures" "$ROOT/Docomo_jp.bundle/signatures"
          mkdir -p "$ROOT/BundleLinksSource"
          ln -sf "/var/mobile/Library/Carrier Bundles/iPhone/CarrierLab.bundle" \
            "$ROOT/BundleLinksSource/25001"
          ln -sf "/var/mobile/Library/Carrier Bundles/iPhone/CarrierLab.bundle" \
            "$ROOT/BundleLinksSource/25001_GID1-AA"
          BASE="https://raw.githubusercontent.com/VCTGomes/ios-carrier-bundle/cecd5594349df0bf51723a247028bad5f40a7965/carrier-bundles/27.0-24A437.V53_V54_V57OS"
          for f in \
            "CarrierLab.bundle/Info.plist" \
            "CarrierLab.bundle/carrier.plist" \
            "CarrierLab.bundle/overrides_V53_V54_V57.der.pri" \
            "CarrierLab.bundle/overrides_V53_V54_V57.plist" \
            "CarrierLab.bundle/signatures/common.plist" \
            "CarrierLab.bundle/signatures/overrides_V53_V54_V57.plist" \
            "Docomo_jp.bundle/Info.plist" \
            "Docomo_jp.bundle/carrier.plist" \
            "Docomo_jp.bundle/overrides_V53_V54_V57.der.pri" \
            "Docomo_jp.bundle/overrides_V53_V54_V57.plist" \
            "Docomo_jp.bundle/profile.mobileconfig" \
            "Docomo_jp.bundle/signatures/common.plist" \
            "Docomo_jp.bundle/signatures/overrides_V53_V54_V57.plist" ; do
            curl -fsSL "$BASE/$f" -o "$ROOT/$f"
            test -s "$ROOT/$f"
          done
          ls -la "$ROOT/BundleLinksSource"

      - name: Write project.yml
        run: |
          set -euo pipefail
          cat > project.yml <<'PROJECT_EOF'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false

          configs:
            Debug: debug
            Release: release

          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO
            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES
              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: NO

          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/App
                - path: natsuk1/CarrierLab
                - path: natsuk1/Exploit
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Support/bridging.h
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Resources/CarrierAssets
                  type: folder
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/Support/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -lc++ -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/Exploit/Core $(SRCROOT)/natsuk1/Exploit/Airlift $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/Headers"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          PROJECT_EOF

      - name: Write AirliftBridge
        run: |
          set -euo pipefail
          cat > natsuk1/Helpers/AirliftBridge.swift <<'SWIFT_EOF'
          import Foundation
          import Combine

          final class AirliftBridge: ObservableObject, @unchecked Sendable {
              static let shared = AirliftBridge()
              enum State: Equatable { case idle, pairing, ready(pairingPath: String), running, done(ok: Bool, message: String) }

              @Published private(set) var state: State = .idle
              @Published private(set) var pairPIN: String? = nil
              @Published private(set) var pairingStatus: String = ""
              @Published private(set) var exploitLog: [String] = []
              @Published var target: String = "/var/mobile/Library/SpringBoard"
              private var loggedLines: [String] = []

              private init() {
                  al_log_init({ _, msg in
                      guard let msg = msg else { return }
                      let line = String(cString: msg)
                      DispatchQueue.main.async { AirliftBridge.shared.appendLog(line) }
                  }, nil)
              }

              private func appendLog(_ s: String) {
                  DispatchQueue.main.async {
                      self.loggedLines.append(s)
                      if self.loggedLines.count > 800 { self.loggedLines.removeFirst(self.loggedLines.count - 600) }
                      self.exploitLog = self.loggedLines
                  }
              }

              func clearLog() {
                  DispatchQueue.main.async {
                      self.loggedLines.removeAll()
                      self.exploitLog = []
                  }
              }

              func pairingFilePath() -> String { PairingController.pairingFilePath() }

              func hasPairing() -> Bool {
                  let p = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: p) else { return false }
                  let size = (try? FileManager.default.attributesOfItem(atPath: p)[.size] as? Int) ?? 0
                  return size > 0
              }

              private func setState(_ s: State) { DispatchQueue.main.async { self.state = s } }
              private func setStatus(_ s: String) { DispatchQueue.main.async { self.pairingStatus = s } }
              private func setPIN(_ p: String?) { DispatchQueue.main.async { self.pairPIN = p } }

              func runPairing() {
                  guard !hasPairing() else {
                      setState(.ready(pairingPath: pairingFilePath()))
                      return
                  }
                  setState(.pairing)
                  setStatus("Starting host...")
                  setPIN(nil)
                  let ctrl = PairingController.shared
                  Task {
                      do {
                          let path = try await ctrl.startAndWait()
                          self.setState(.ready(pairingPath: path))
                          self.setStatus("Paired")
                          self.setPIN(nil)
                      } catch is CancellationError {
                          self.setState(.idle)
                          self.setStatus("Cancelled")
                      } catch {
                          self.setState(.idle)
                          self.setStatus("Failed: \(error.localizedDescription)")
                      }
                  }
                  Task {
                      var iterations = 0
                      while iterations < 900 {
                          let status = ctrl.pairingStatus
                          let pin = ctrl.pairingPIN
                          let running = ctrl.running
                          self.setStatus(status)
                          self.setPIN(pin)
                          if !running { break }
                          try? await Task.sleep(nanoseconds: 200_000_000)
                          iterations += 1
                      }
                  }
              }

              func cancelPairing() {
                  PairingController.shared.softCancel()
                  setState(.idle)
                  setStatus("")
                  setPIN(nil)
              }

              func deletePairing() {
                  let fm = FileManager.default
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let candidates = [
                      docs.appendingPathComponent("natsuk1_pairing.plist"),
                      docs.appendingPathComponent("ALTPairingFile.mobiledevicepairing"),
                      docs.appendingPathComponent("pairingFile.plist"),
                  ]
                  for url in candidates {
                      if fm.fileExists(atPath: url.path) { try? fm.removeItem(at: url) }
                  }
                  if let custom = PairingController.customPairingFilePath, fm.fileExists(atPath: custom) {
                      try? fm.removeItem(atPath: custom)
                  }
                  PairingController.customPairingFilePath = nil
                  if let files = try? fm.contentsOfDirectory(atPath: docs.path) {
                      for f in files {
                          guard f.hasSuffix(".plist") || f.hasSuffix(".mobilepairing") || f.hasSuffix(".mobilepair") else { continue }
                          try? fm.removeItem(at: docs.appendingPathComponent(f))
                      }
                  }
                  UserDefaults.standard.removeObject(forKey: "natsuk1PairingHostAltIRK")
                  UserDefaults.standard.removeObject(forKey: "natsuk1PairingPath")
                  setState(.idle)
                  setStatus("")
                  setPIN(nil)
              }

              func runExploit() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      setState(.done(ok: false, message: "No pairing file"))
                      return
                  }
                  setState(.running)
                  DispatchQueue.main.async {
                      self.loggedLines.removeAll()
                      self.exploitLog = []
                  }
                  let t = target
                  let bridge = self
                  bridge.appendLog("[exploit] path=\(pairingPath) target=\(t)")
                  Task.detached {
                      var outJson: UnsafeMutablePointer<CChar>? = nil
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      let rc: Int32 = pairingPath.withCString { pc in
                          t.withCString { tc in
                              al_exploit_run(pc, tc, nil, nil, &outJson, &outError)
                          }
                      }
                      let jsonStr = outJson.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                      let errStr = outError.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                      if rc == 0 {
                          let msg = jsonStr ?? "OK"
                          bridge.appendLog("[exploit] ok: \(msg)")
                          bridge.setState(.done(ok: true, message: msg))
                      } else {
                          let msg = errStr ?? "rc=\(rc)"
                          bridge.appendLog("[exploit] fail: \(msg)")
                          bridge.setState(.done(ok: false, message: msg))
                      }
                  }
              }

              func cancelExploit() {
                  appendLog("[exploit] cancel requested")
                  setState(.done(ok: false, message: "cancelled"))
              }

              func respring() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      appendLog("[respring] no pairing file")
                      return
                  }
                  let bridge = self
                  Task.detached {
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      let rc: Int32 = pairingPath.withCString { pc in
                          al_device_respring(pc, nil, nil, &outError)
                      }
                      let errStr = outError.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                      if rc == 0 {
                          bridge.appendLog("[respring] ok")
                      } else {
                          bridge.appendLog("[respring] rc=\(rc) \(errStr ?? "")")
                      }
                  }
              }

              func findContainer(bundleID: String) async -> String? {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else { return nil }
                  return await withCheckedContinuation { cont in
                      DispatchQueue.global(qos: .userInitiated).async {
                          var outContainer: UnsafeMutablePointer<CChar>? = nil
                          var outError: UnsafeMutablePointer<CChar>? = nil
                          let rc: Int32 = pairingPath.withCString { pc in
                              bundleID.withCString { bc in
                                  al_find_app_container(pc, bc, nil, nil, &outContainer, &outError)
                              }
                          }
                          let containerStr = outContainer.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                          if let p = outError { al_string_free(p) }
                          if rc == 0, let c = containerStr { cont.resume(returning: c) }
                          else { cont.resume(returning: nil) }
                      }
                  }
              }
          }
          SWIFT_EOF

      - name: Write CarrierLabBridge
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabBridge.swift <<'BRIDGE_EOF'
          import Foundation

          final class CarrierLabBridge: @unchecked Sendable {
              static let shared = CarrierLabBridge()

              enum ProbeState {
                  case ok
                  case noVPN
                  case noPairing
                  case pairingInvalid
                  case ffiFailed(String)
              }

              struct ProbeResult {
                  let state: ProbeState
                  let detail: String
                  var ok: Bool { if case .ok = state { return true }; return false }
                  var message: String {
                      switch state {
                      case .ok: return "ready"
                      case .noVPN: return "No loopback VPN. Enable LocalDevVPN or SideStore WireGuard."
                      case .noPairing: return "No pairing file. Open Tools / Airlift and run Start Pairing."
                      case .pairingInvalid: return detail
                      case .ffiFailed(let s): return s
                      }
                  }
              }

              private let carrierRoot = "/var/mobile/Library/Carrier Bundles/iPhone"
              private let bundleLinks = "/var/mobile/Library/Carrier Bundles/BundleLinks"

              func carrierRootPath() -> String { carrierRoot }
              func bundleLinksPath() -> String { bundleLinks }

              func findPairingFile() -> String? {
                  let fm = FileManager.default
                  let canonical = PairingController.pairingFilePath()
                  if fm.fileExists(atPath: canonical) {
                      let size = (try? fm.attributesOfItem(atPath: canonical)[.size] as? Int) ?? 0
                      if size > 0 { return canonical }
                  }
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let candidates = [
                      docs.appendingPathComponent("natsuk1_pairing.plist").path,
                      docs.appendingPathComponent("ALTPairingFile.mobiledevicepairing").path,
                  ]
                  for c in candidates {
                      if fm.fileExists(atPath: c) {
                          let size = (try? fm.attributesOfItem(atPath: c)[.size] as? Int) ?? 0
                          if size > 0 { return c }
                      }
                  }
                  return nil
              }

              private func validatePairingFile(_ path: String) -> (Bool, String) {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: path) else { return (false, "missing") }
                  let size = (try? fm.attributesOfItem(atPath: path)[.size] as? Int) ?? 0
                  if size < 50 { return (false, "Pairing file too small (\(size) bytes).") }
                  guard let data = try? Data(contentsOf: URL(fileURLWithPath: path)) else {
                      return (false, "Pairing file unreadable.")
                  }
                  guard let obj = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                        let dict = obj as? [String: Any] else {
                      return (false, "Pairing file not a plist (\(size) bytes).")
                  }
                  if dict.isEmpty { return (false, "Pairing plist empty.") }
                  return (true, "Pairing ok (\(size) bytes, \(dict.count) keys)")
              }

              func probe() -> ProbeResult {
                  if !NetworkStatus.loopbackVPNUp() { return ProbeResult(state: .noVPN, detail: "no loopback VPN") }
                  guard let pairing = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "missing")
                  }
                  let (ok, msg) = validatePairingFile(pairing)
                  if !ok { return ProbeResult(state: .pairingInvalid, detail: msg) }
                  return ProbeResult(state: .ok, detail: msg)
              }

              func injectFolder(sourceFolder: String, targetFolder: String, folderName: String) -> ProbeResult {
                  let pre = probe()
                  guard pre.ok else { return pre }
                  guard let pairingPath = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "no pairing path")
                  }
                  var outError: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  pairingPath.withCString { pc in
                      sourceFolder.withCString { sc in
                          targetFolder.withCString { tc in
                              folderName.withCString { nc in
                                  rc = al_exploit_inject_folder(pc, sc, tc, nc, nil, nil, &outError)
                              }
                          }
                      }
                  }
                  let errMsg = outError.flatMap { String(cString: $0) } ?? ""
                  if let p = outError { al_string_free(p) }
                  if rc != 0 {
                      return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "inject rc=\(rc)" : errMsg), detail: errMsg)
                  }
                  return ProbeResult(state: .ok, detail: "injected")
              }

              func installSymlinks(names: [String], destination: String) -> ProbeResult {
                  let pre = probe()
                  guard pre.ok else { return pre }
                  guard let pairingPath = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "no pairing path")
                  }
                  let fm = FileManager.default
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let staging = docs.appendingPathComponent("BundleLinksStaging", isDirectory: true)
                  try? fm.createDirectory(at: staging, withIntermediateDirectories: true)
                  let targetPath = carrierRoot + "/CarrierLab.bundle"
                  var lastErr = ""
                  for name in names {
                      let linkPath = staging.appendingPathComponent(name).path
                      try? fm.removeItem(atPath: linkPath)
                      do {
                          try fm.createSymbolicLink(atPath: linkPath, withDestinationPath: targetPath)
                      } catch {
                          lastErr = "symlink \(name): \(error.localizedDescription)"
                          continue
                      }
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      var rc: Int32 = -1
                      pairingPath.withCString { pc in
                          linkPath.withCString { sc in
                              destination.withCString { tc in
                                  name.withCString { nc in
                                      rc = al_exploit_inject_folder(pc, sc, tc, nc, nil, nil, &outError)
                                  }
                              }
                          }
                      }
                      let errMsg = outError.flatMap { String(cString: $0) } ?? ""
                      if let p = outError { al_string_free(p) }
                      if rc != 0 {
                          lastErr = errMsg.isEmpty ? "inject link \(name) rc=\(rc)" : errMsg
                      }
                  }
                  if !lastErr.isEmpty {
                      return ProbeResult(state: .ffiFailed(lastErr), detail: lastErr)
                  }
                  return ProbeResult(state: .ok, detail: "links installed")
              }

              func writeFile(source: String, target: String) -> ProbeResult {
                  let pre = probe()
                  guard pre.ok else { return pre }
                  guard let pairingPath = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "no pairing path")
                  }
                  var outJson: UnsafeMutablePointer<CChar>? = nil
                  var outErr: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  pairingPath.withCString { pc in
                      source.withCString { sc in
                          target.withCString { tc in
                              rc = al_exploit_run(pc, tc, nil, nil, &outJson, &outErr)
                          }
                      }
                  }
                  let errMsg = outErr.flatMap { String(cString: $0) } ?? ""
                  if let p = outJson { al_string_free(p) }
                  if let p = outErr { al_string_free(p) }
                  if rc != 0 { return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "rc=\(rc)" : errMsg), detail: errMsg) }
                  return ProbeResult(state: .ok, detail: "ok")
              }
          }
          BRIDGE_EOF

      - name: Write CarrierLabInstaller
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabInstaller.swift <<'INSTALLER_EOF'
          import Foundation

          final class CarrierLabInstaller: @unchecked Sendable {
              static let shared = CarrierLabInstaller()

              private let state = CarrierLabState.shared
              private let bridge = CarrierLabBridge.shared

              struct CheckResult {
                  let probe: CarrierLabBridge.ProbeResult
                  let carrierRootExists: Bool
                  let bundleLinksExists: Bool
                  let resourcesBundled: Bool
                  let backupPresent: Bool
                  let status: CarrierLabState.Status
              }

              func carrierBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/CarrierLab.bundle")
              }

              func docomoBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/Docomo_jp.bundle")
              }

              func check() -> CheckResult {
                  let fm = FileManager.default
                  let probe = bridge.probe()
                  return CheckResult(
                      probe: probe,
                      carrierRootExists: fm.fileExists(atPath: bridge.carrierRootPath()),
                      bundleLinksExists: fm.fileExists(atPath: bridge.bundleLinksPath()),
                      resourcesBundled: fm.fileExists(atPath: carrierBundleURL().path),
                      backupPresent: state.hasBackup(),
                      status: state.session?.status ?? .clean
                  )
              }

              func install() -> CarrierLabBridge.ProbeResult {
                  let carrierBundle = carrierBundleURL()
                  let docomoBundle = docomoBundleURL()
                  guard FileManager.default.fileExists(atPath: carrierBundle.path) else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("CarrierLab.bundle missing"), detail: "missing")
                  }
                  guard FileManager.default.fileExists(atPath: docomoBundle.path) else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("Docomo_jp.bundle missing"), detail: "missing")
                  }
                  let pre = bridge.probe()
                  guard pre.ok else { return pre }

                  let s = CarrierLabState.Session(
                      status: .placing,
                      startedAt: Date(),
                      carrierBundlePath: carrierBundle.path,
                      originalBackupPath: state.backupURL().path,
                      ipccTriggerPath: docomoBundle.path,
                      lastError: nil,
                      aliases: ["25001", "25001_GID1-AA"])
                  state.save(s)

                  let r1 = bridge.injectFolder(
                      sourceFolder: carrierBundle.path,
                      targetFolder: bridge.carrierRootPath(),
                      folderName: "CarrierLab.bundle")
                  if !r1.ok {
                      var bad = s
                      bad.status = .failed
                      bad.lastError = r1.message
                      state.save(bad)
                      return r1
                  }

                  let r2 = bridge.injectFolder(
                      sourceFolder: docomoBundle.path,
                      targetFolder: bridge.carrierRootPath(),
                      folderName: "Docomo_jp.bundle")
                  if !r2.ok {
                      var bad = s
                      bad.status = .failed
                      bad.lastError = r2.message
                      state.save(bad)
                      return r2
                  }

                  let r3 = bridge.installSymlinks(
                      names: ["25001", "25001_GID1-AA"],
                      destination: bridge.bundleLinksPath())

                  var done = s
                  done.status = r3.ok ? .placed : .failed
                  if !r3.ok { done.lastError = r3.message }
                  state.save(done)

                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.0) {
                      AirliftBridge.shared.respring()
                  }
                  return CarrierLabBridge.ProbeResult(state: .ok, detail: "installed, links=\(r3.ok)")
              }

              func reload() -> CarrierLabBridge.ProbeResult {
                  guard let s = state.session, s.status == .placed || s.status == .finished else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("Nothing to reload. Install first."), detail: "no session")
                  }
                  _ = s
                  let r = bridge.injectFolder(
                      sourceFolder: docomoBundleURL().path,
                      targetFolder: bridge.carrierRootPath(),
                      folderName: "Docomo_jp.bundle")
                  if r.ok {
                      DispatchQueue.main.asyncAfter(deadline: .now() + 1.0) {
                          AirliftBridge.shared.respring()
                      }
                  }
                  return r
              }

              func finish() {
                  guard let s = state.session else { return }
                  var done = s
                  done.status = .finished
                  state.save(done)
              }

              func reset() {
                  state.clear()
              }
          }
          INSTALLER_EOF

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: symlinks for 25001, clean respring, carrier activation [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          set -euo pipefail
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          test -L natsuk1/Resources/CarrierAssets/BundleLinksSource/25001
          test -L natsuk1/Resources/CarrierAssets/BundleLinksSource/25001_GID1-AA
          grep -q 'CarrierAssets' project.yml
          grep -q 'lc++' project.yml
          grep -q 'installSymlinks' natsuk1/CarrierLab/CarrierLabBridge.swift
          grep -q 'installSymlinks' natsuk1/CarrierLab/CarrierLabInstaller.swift
          grep -q 'AirliftBridge.shared.respring' natsuk1/CarrierLab/CarrierLabInstaller.swift
          ! grep -q 'RespringView' natsuk1/App/natsuk1.swift
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Verify symlinks in app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          echo "=== BundleLinksSource in .app ==="
          ls -la "$APP/CarrierAssets/BundleLinksSource" || echo "not present in .app"

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v47.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"