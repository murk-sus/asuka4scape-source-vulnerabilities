          grep -q 'CarrierLabBridge.defaultSlots' natsuk1/CarrierLab/CarrierLabState.swift
          grep -q 'bridge.injectFolder' natsuk1/CarrierLab/CarrierLabInstaller.swift
          grep -q 'carrierUserRoot' natsuk1/CarrierLab/CarrierLabInstaller.swift
          grep -q 'DispatchQueue.global' natsuk1/App/natsuk1.swift
          grep -q 'loadHTMLString' natsuk1/Helpers/Respring.swift
          grep -q 'backdrop-filter' natsuk1/Helpers/Respring.swift
          grep -q 'sdk: Network.framework' project.yml
          grep -q 'sdk: WebKit.framework' project.yml
          grep -q 'lc++' project.yml
          grep -q 'libairlift_ffi.a' project.yml
