name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            natsuk1.xcodeproj
          key: nk-v45-${{ hashFiles('project.yml') }}
          restore-keys: nk-v45-

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Write project.yml
        run: |
          set -euo pipefail
          cat > project.yml <<'PROJECT_EOF'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false

          configs:
            Debug: debug
            Release: release

          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO
            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES
              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: NO

          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/App
                - path: natsuk1/CarrierLab
                - path: natsuk1/Exploit
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Support/bridging.h
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Resources/CarrierAssets
                  type: folder
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/Support/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -lc++ -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/Exploit/Core $(SRCROOT)/natsuk1/Exploit/Airlift $(SRCROOT)/external/AirliftFFI.xcframework/ios-arm64/Headers"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          PROJECT_EOF

      - name: Write PairingGenerator
        run: |
          set -euo pipefail
          mkdir -p natsuk1/Helpers
          cat > natsuk1/Helpers/PairingGenerator.swift <<'PAIRING_EOF'
          import Foundation

          final class PairingGenerator {
              static let shared = PairingGenerator()
              private init() {}

              enum GeneratorError: LocalizedError {
                  case missingFile(String)
                  case notAPlist(String)
                  case writeFailed(String)

                  var errorDescription: String? {
                      switch self {
                      case .missingFile(let s): return "Pairing file missing: \(s)"
                      case .notAPlist(let s): return "Pairing file is not a plist: \(s)"
                      case .writeFailed(let s): return "Write failed: \(s)"
                      }
                  }
              }

              @discardableResult
              func generateMergedPairing(rppPath: String, outputPath: String) throws -> String {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: rppPath) else {
                      throw GeneratorError.missingFile(rppPath)
                  }
                  guard let data = try? Data(contentsOf: URL(fileURLWithPath: rppPath)), !data.isEmpty else {
                      throw GeneratorError.missingFile("empty or unreadable: \(rppPath)")
                  }
                  guard let plist = try? PropertyListSerialization.propertyList(
                      from: data, options: [], format: nil) as? [String: Any] else {
                      throw GeneratorError.notAPlist(rppPath)
                  }
                  guard !plist.isEmpty else {
                      throw GeneratorError.notAPlist("empty plist: \(rppPath)")
                  }

                  let canonical = PairingController.syncCanonicalPairingFile(from: rppPath)
                  if outputPath != canonical {
                      do {
                          try data.write(to: URL(fileURLWithPath: outputPath), options: .atomic)
                      } catch {
                          throw GeneratorError.writeFailed(error.localizedDescription)
                      }
                  }
                  return canonical
              }
          }
          PAIRING_EOF

      - name: Write CarrierLabBridge
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabBridge.swift <<'BRIDGE_EOF'
          import Foundation

          final class CarrierLabBridge: @unchecked Sendable {
              static let shared = CarrierLabBridge()

              enum ProbeState {
                  case ok
                  case noVPN
                  case noPairing
                  case pairingInvalid
                  case ffiFailed(String)
              }

              struct ProbeResult {
                  let state: ProbeState
                  let detail: String
                  var ok: Bool { if case .ok = state { return true }; return false }
                  var message: String {
                      switch state {
                      case .ok: return "ready"
                      case .noVPN: return "No loopback VPN. Enable LocalDevVPN or SideStore WireGuard."
                      case .noPairing: return "No pairing file. Open Tools / Airlift and run Start Pairing."
                      case .pairingInvalid: return detail
                      case .ffiFailed(let s): return s
                      }
                  }
              }

              private let carrierRoot = "/var/mobile/Library/Carrier Bundles/iPhone"
              private let bundleLinks = "/var/mobile/Library/Carrier Bundles"

              func carrierRootPath() -> String { carrierRoot }
              func bundleLinksPath() -> String { bundleLinks }

              func findPairingFile() -> String? {
                  let fm = FileManager.default
                  let canonical = PairingController.pairingFilePath()
                  if fm.fileExists(atPath: canonical) {
                      let size = (try? fm.attributesOfItem(atPath: canonical)[.size] as? Int) ?? 0
                      if size > 0 { return canonical }
                  }
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let candidates = [
                      docs.appendingPathComponent("natsuk1_pairing.plist").path,
                      docs.appendingPathComponent("ALTPairingFile.mobiledevicepairing").path,
                  ]
                  for c in candidates {
                      if fm.fileExists(atPath: c) {
                          let size = (try? fm.attributesOfItem(atPath: c)[.size] as? Int) ?? 0
                          if size > 0 { return c }
                      }
                  }
                  return nil
              }

              private func validatePairingFile(_ path: String) -> (Bool, String) {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: path) else { return (false, "missing") }
                  let size = (try? fm.attributesOfItem(atPath: path)[.size] as? Int) ?? 0
                  if size < 50 { return (false, "Pairing file too small (\(size) bytes).") }
                  guard let data = try? Data(contentsOf: URL(fileURLWithPath: path)) else {
                      return (false, "Pairing file unreadable.")
                  }
                  guard let obj = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                        let dict = obj as? [String: Any] else {
                      return (false, "Pairing file not a plist (\(size) bytes).")
                  }
                  if dict.isEmpty { return (false, "Pairing plist empty.") }
                  return (true, "Pairing ok (\(size) bytes, \(dict.count) keys)")
              }

              func probe() -> ProbeResult {
                  if !NetworkStatus.loopbackVPNUp() { return ProbeResult(state: .noVPN, detail: "no loopback VPN") }
                  guard let pairing = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "missing")
                  }
                  let (ok, msg) = validatePairingFile(pairing)
                  if !ok { return ProbeResult(state: .pairingInvalid, detail: msg) }
                  return ProbeResult(state: .ok, detail: msg)
              }

              func injectFolder(sourceFolder: String, targetFolder: String, folderName: String) -> ProbeResult {
                  let pre = probe()
                  guard pre.ok else { return pre }
                  guard let pairingPath = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "no pairing path")
                  }
                  var outError: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  pairingPath.withCString { pc in
                      sourceFolder.withCString { sc in
                          targetFolder.withCString { tc in
                              folderName.withCString { nc in
                                  rc = al_exploit_inject_folder(pc, sc, tc, nc, nil, nil, &outError)
                              }
                          }
                      }
                  }
                  let errMsg = outError.flatMap { String(cString: $0) } ?? ""
                  if let p = outError { al_string_free(p) }
                  if rc != 0 {
                      return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "inject rc=\(rc)" : errMsg), detail: errMsg)
                  }
                  return ProbeResult(state: .ok, detail: "injected")
              }

              func writeFile(source: String, target: String) -> ProbeResult {
                  let pre = probe()
                  guard pre.ok else { return pre }
                  guard let pairingPath = findPairingFile() else {
                      return ProbeResult(state: .noPairing, detail: "no pairing path")
                  }
                  var outJson: UnsafeMutablePointer<CChar>? = nil
                  var outErr: UnsafeMutablePointer<CChar>? = nil
                  var rc: Int32 = -1
                  pairingPath.withCString { pc in
                      source.withCString { sc in
                          target.withCString { tc in
                              rc = al_exploit_run(pc, tc, nil, nil, &outJson, &outErr)
                          }
                      }
                  }
                  let errMsg = outErr.flatMap { String(cString: $0) } ?? ""
                  if let p = outJson { al_string_free(p) }
                  if let p = outErr { al_string_free(p) }
                  if rc != 0 { return ProbeResult(state: .ffiFailed(errMsg.isEmpty ? "rc=\(rc)" : errMsg), detail: errMsg) }
                  return ProbeResult(state: .ok, detail: "ok")
              }
          }
          BRIDGE_EOF

      - name: Write CarrierLabInstaller
        run: |
          set -euo pipefail
          mkdir -p natsuk1/CarrierLab
          cat > natsuk1/CarrierLab/CarrierLabInstaller.swift <<'INSTALLER_EOF'
          import Foundation

          final class CarrierLabInstaller: @unchecked Sendable {
              static let shared = CarrierLabInstaller()

              private let state = CarrierLabState.shared
              private let bridge = CarrierLabBridge.shared

              struct CheckResult {
                  let probe: CarrierLabBridge.ProbeResult
                  let carrierRootExists: Bool
                  let bundleLinksExists: Bool
                  let resourcesBundled: Bool
                  let backupPresent: Bool
                  let status: CarrierLabState.Status
              }

              func carrierBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/CarrierLab.bundle")
              }

              func docomoBundleURL() -> URL {
                  Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/Docomo_jp.bundle")
              }

              func check() -> CheckResult {
                  let fm = FileManager.default
                  let probe = bridge.probe()
                  return CheckResult(
                      probe: probe,
                      carrierRootExists: fm.fileExists(atPath: bridge.carrierRootPath()),
                      bundleLinksExists: fm.fileExists(atPath: bridge.bundleLinksPath()),
                      resourcesBundled: fm.fileExists(atPath: carrierBundleURL().path),
                      backupPresent: state.hasBackup(),
                      status: state.session?.status ?? .clean
                  )
              }

              func install() -> CarrierLabBridge.ProbeResult {
                  let carrierBundle = carrierBundleURL()
                  let docomoBundle = docomoBundleURL()
                  guard FileManager.default.fileExists(atPath: carrierBundle.path) else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("CarrierLab.bundle missing"), detail: "missing")
                  }
                  guard FileManager.default.fileExists(atPath: docomoBundle.path) else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("Docomo_jp.bundle missing"), detail: "missing")
                  }
                  let pre = bridge.probe()
                  guard pre.ok else { return pre }

                  let s = CarrierLabState.Session(
                      status: .placing,
                      startedAt: Date(),
                      carrierBundlePath: carrierBundle.path,
                      originalBackupPath: state.backupURL().path,
                      ipccTriggerPath: docomoBundle.path,
                      lastError: nil,
                      aliases: nil)
                  state.save(s)

                  let r1 = bridge.injectFolder(
                      sourceFolder: carrierBundle.path,
                      targetFolder: bridge.bundleLinksPath(),
                      folderName: "CarrierLab.bundle")
                  if !r1.ok {
                      var bad = s
                      bad.status = .failed
                      bad.lastError = r1.message
                      state.save(bad)
                      return r1
                  }

                  let r2 = bridge.injectFolder(
                      sourceFolder: docomoBundle.path,
                      targetFolder: bridge.carrierRootPath(),
                      folderName: "Docomo_jp.bundle")
                  if !r2.ok {
                      var bad = s
                      bad.status = .failed
                      bad.lastError = r2.message
                      state.save(bad)
                      return r2
                  }

                  var done = s
                  done.status = .placed
                  state.save(done)
                  return CarrierLabBridge.ProbeResult(state: .ok, detail: "installed")
              }

              func reload() -> CarrierLabBridge.ProbeResult {
                  guard let s = state.session, s.status == .placed || s.status == .finished else {
                      return CarrierLabBridge.ProbeResult(state: .ffiFailed("Nothing to reload. Install first."), detail: "no session")
                  }
                  _ = s
                  return bridge.injectFolder(
                      sourceFolder: docomoBundleURL().path,
                      targetFolder: bridge.carrierRootPath(),
                      folderName: "Docomo_jp.bundle")
              }

              func finish() {
                  guard let s = state.session else { return }
                  var done = s
                  done.status = .finished
                  state.save(done)
              }

              func reset() {
                  state.clear()
              }
          }
          INSTALLER_EOF

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: pass-through pairing, inject_folder [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          set -euo pipefail
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          grep -q 'CarrierAssets' project.yml
          grep -q 'lc++' project.yml
          grep -q 'natsuk1/Support/bridging.h' project.yml
          grep -q 'al_exploit_inject_folder' natsuk1/CarrierLab/CarrierLabBridge.swift
          grep -q 'injectFolder' natsuk1/CarrierLab/CarrierLabInstaller.swift
          ! grep -q '_silgen_name' natsuk1/CarrierLab/CarrierLabBridge.swift
          ! grep -q '_silgen_name' natsuk1/CarrierLab/CarrierLabInstaller.swift
          ! grep -q 'lockdownd' natsuk1/Helpers/PairingGenerator.swift
          grep -q 'syncCanonicalPairingFile' natsuk1/Helpers/PairingGenerator.swift
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v45.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"