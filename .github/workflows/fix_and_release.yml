            'int32_t al_pairing_run_host(const char*, uint16_t, const char*, const char*, const char*, const char*, ALPairReadyCb, ALPairPinCb, void*, ALPairResult*);' \
            'void al_pairing_result_free(ALPairResult*);' \
            'int32_t al_exploit_run(const char*, const char*, const char*, const char*, char**, char**);' \
            'int32_t al_find_app_container(const char*, const char*, const char*, const char*, char**, char**);' \
            'int32_t al_device_respring(const char*, const char*, const char*, char**);' \
            'void al_string_free(char*);' \
            '#ifdef __cplusplus' \
            '}' \
            '#endif' \
            '#endif' \
            > "$A/Headers/airlift.h"
          printf '%s\n' \
            '#include "airlift.h"' \
            '#include <stdlib.h>' \
            '#include <string.h>' \
            'static char* D(const char*s){if(!s)return 0;size_t n=strlen(s)+1;char*p=malloc(n);if(p)memcpy(p,s,n);return p;}' \
            'static void E(char**o,const char*m){if(o)*o=D(m);}' \
            'void al_log_init(ALLogCb c,void*x){(void)c;(void)x;}' \
            'int32_t al_pairing_run_host(const char*b,uint16_t p,const char*n,const char*m,const char*o,const char*i,ALPairReadyCb r,ALPairPinCb q,void*x,ALPairResult*y){(void)b;(void)p;(void)n;(void)m;(void)o;(void)i;(void)r;(void)q;(void)x;if(y){y->host_alt_irk_hex=0;y->device_name=0;y->pairing_file_path=0;y->error=D("stub");}return -1;}' \
            'void al_pairing_result_free(ALPairResult*r){if(!r)return;free(r->host_alt_irk_hex);free(r->device_name);free(r->pairing_file_path);free(r->error);}' \
            'int32_t al_exploit_run(const char*a,const char*b,const char*c,const char*d,char**j,char**e){(void)a;(void)b;(void)c;(void)d;if(j)*j=0;E(e,"stub");return -1;}' \
            'int32_t al_find_app_container(const char*a,const char*b,const char*c,const char*d,char**o,char**e){(void)a;(void)b;(void)c;(void)d;if(o)*o=0;E(e,"stub");return -1;}' \
            'int32_t al_device_respring(const char*a,const char*b,const char*c,char**e){(void)a;(void)b;(void)c;E(e,"rule14");return -1;}' \
            'void al_string_free(char*s){free(s);}' \
            > /tmp/airlift_stub.c
