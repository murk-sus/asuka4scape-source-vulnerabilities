          import SwiftUI
          import UIKit
          import Darwin

          struct PathAccessView: View {
              struct PathResult: Identifiable {
                  let id = UUID()
                  let path: String
                  let exists: Bool
                  let isDirectory: Bool
                  let readable: Bool
                  let writable: Bool
                  let size: Int64?
              }

              @State private var results: [PathResult] = []
              @State private var busy = false

              private let paths: [String] = [
                  "/var/mobile",
                  "/var/mobile/Documents",
                  "/var/mobile/Library",
                  "/var/mobile/Library/Preferences",
                  "/var/mobile/Library/Caches",
                  "/var/mobile/Library/SpringBoard",
                  "/var/mobile/Library/SMS",
                  "/var/mobile/Library/Safari",
                  "/var/mobile/Containers",
                  "/var/mobile/Containers/Data/Application",
                  "/var/mobile/Containers/Shared/AppGroup",
                  "/var/tmp",
                  "/var/mobile/Media",
              ]

              var body: some View {
                  List {
                      Section {
                          HStack {
                              Text("Paths")
                              Spacer()
                              Text("\(results.filter { $0.exists }.count)/\(results.count)")
                                  .font(.system(.body, design: .monospaced))
                                  .foregroundStyle(.green)
                                  .shadow(color: Color.green.opacity(0.45), radius: 3)
                          }
                          HStack {
                              Text("Readable")
                              Spacer()
                              Text("\(results.filter { $0.readable }.count)")
                                  .font(.system(.body, design: .monospaced))
                                  .foregroundStyle(.green)
                                  .shadow(color: Color.green.opacity(0.45), radius: 3)
                          }
                          HStack {
                              Text("Writable")
                              Spacer()
                              Text("\(results.filter { $0.writable }.count)")
                                  .font(.system(.body, design: .monospaced))
                                  .foregroundStyle(.orange)
                                  .shadow(color: Color.orange.opacity(0.45), radius: 3)
                          }
                          Button { scan() } label: {
                              HStack {
                                  Text(busy ? "Scanning..." : "Run Scan")
                                  Spacer()
                                  ProgressView().opacity(busy ? 1 : 0)
                              }
                          }.disabled(busy)
                      } header: { Label("Summary", systemImage: "chart.bar") }
                      Section {
                          ForEach(results) { r in
                              VStack(alignment: .leading, spacing: 4) {
                                  Text(r.path)
                                      .font(.system(.footnote, design: .monospaced))
                                      .foregroundStyle(r.exists ? .primary : .secondary)
                                      .lineLimit(2)
                                  HStack(spacing: 6) {
                                      badge(r.exists ? "exists" : "missing", color: r.exists ? .green : .red)
                                      if r.isDirectory { badge("dir", color: .blue) }
                                      if r.readable { badge("r", color: .green) }
                                      if r.writable { badge("w", color: .orange) }
                                      if let s = r.size { badge("\(s)B", color: .gray) }
                                  }
                              }
                          }
                      } header: { Label("Paths", systemImage: "folder") }
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Path Access")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { if results.isEmpty { scan() } }
              }

              private func badge(_ text: String, color: Color) -> some View {
                  Text(text)
                      .font(.system(size: 9, design: .monospaced))
                      .padding(.horizontal, 4)
                      .padding(.vertical, 1)
                      .background(color.opacity(0.15), in: RoundedRectangle(cornerRadius: 3))
                      .foregroundStyle(color)
                      .shadow(color: color.opacity(0.45), radius: 3)
              }

              private func scan() {
                  busy = true
                  let pathList = paths
                  DispatchQueue.global(qos: .userInitiated).async {
                      let fm = FileManager.default
                      var outPaths: [PathResult] = []
                      for p in pathList {
                          var isDir: ObjCBool = false
                          let exists = fm.fileExists(atPath: p, isDirectory: &isDir)
                          let readable = fm.isReadableFile(atPath: p)
                          let writable = fm.isWritableFile(atPath: p)
                          var size: Int64? = nil
                          if exists, !isDir.boolValue,
                             let attrs = try? fm.attributesOfItem(atPath: p),
                             let n = attrs[.size] as? NSNumber { size = n.int64Value }
                          outPaths.append(PathResult(path: p, exists: exists, isDirectory: isDir.boolValue,
                                                     readable: readable, writable: writable, size: size))
                      }
                      DispatchQueue.main.async {
                          self.results = outPaths; self.busy = false
                      }
                  }
              }
          }
          SWIFT_EOF

      - name: Append ai-hints
        run: |
          set -euo pipefail
          cat >> docs/ai-hints.md <<'HINTS_EOF'

          ## INTERNET USAGE

          Use web search on EVERY user message, unconditionally, without being asked.
          This is a hard rule. Not "when needed". Always. Every message.
          If web search is unavailable, state that at the top of the reply.

          ## YAML SYNTAX RULES

          - Never use tabs. Only spaces.
          - Inside a run block, every content line must share the same leading indent, more than the key itself.
          - Never put content at column 0 inside a run block.
          - Heredoc markers must be at the same indent level as the rest of the block.
          - Prefer whole-file writes via cat heredoc. Never sed or perl patch project.yml.
          - Never use printf with embedded single quotes or backslash escapes in a run block.
          - One file per heredoc. Multiple heredocs in one run step are allowed if indent is uniform.
          - Validate with python3 -c "import yaml; yaml.safe_load(open(path))".

          ## MAIN THREAD RULE

          - All @Published mutations MUST go through DispatchQueue.main.async unconditionally.
          - Never check Thread.isMainThread. Always dispatch main.async. Double dispatch is safe.
          - Never use Task or Task.detached in a view or state class without main.async wrap for @Published.
          - Crash "Modifications to the layout engine must not be performed from a background thread" means a @Published setter ran on a non-main thread.

          ## PAIRING FILE FORMAT

          AirLift pairing plist keys:
          - public_key (data)
          - private_key (data)
          - identifier (string)
          - alt_irk (data)
          Validation: at least 3 of 4 keys present. Never check for UDID/HostCertificate/RootCertificate.
          Location: Documents/natsuk1_pairing.plist OR nested Documents/Data/Application/<UUID>/Documents/.
          FFI might expect .mobiledevicepairing extension. Search all candidates.
          Fallback: any .plist / .mobilepairing / .mobilepair file > 100 bytes in Documents.

          ## CARRIERLAB

          iOS port of MTS_CARRIER_FORUM core logic.
          - CarrierAssets bundled under Resources/CarrierAssets.
          - check dispatches to global queue, updates state via main.async.
          - install writes CarrierLab.bundle to BundleLinks and Docomo_jp.bundle to carrier root.
          - reload re-writes Docomo_jp.bundle only.
          - reset clears session, does not revert the phone.
          - view auto-refreshes every 5 s silent, no log spam on silent refresh.

          ## UI STYLE

          Match Apple native apps. Subtle glow everywhere: .shadow(color: c.opacity(0.45), radius: 3).
          Every value in every menu must have glow. Every button must have glow.
          Use .green / .orange / .red for statuses only.
          Section headers use Label with SF Symbols.

          ## ERROR FIX LOG

          ### cannot find 'nk_necp_cancel' in scope
          Cause: NECP was removed but a call remained in AirliftBridge.cancelExploit.
          Fix: remove the call. cancelExploit only logs and sets state to .done(ok:false).

          ### invalid yaml syntax
          Cause: nested heredoc inside printf with shell quote escapes.
          Fix: never printf strings with backslash or single-quote escapes. Use cat <<'EOF' heredocs at uniform indent.

          ### Modifications to the layout engine must not be performed from a background thread
          Cause: @Published setter called on non-main thread.
          Fix: all @Published mutations via DispatchQueue.main.async unconditionally.

          ### "failed to parse raw pairing file from bytes"
          Cause: FFI expects pairing file with specific extension (.mobiledevicepairing) or specific path.
          Fix: search all candidate paths: natsuk1_pairing.plist, ALTPairingFile.mobiledevicepairing, pairingFile.plist, any plist in Documents, nested Data/Application.
          Do not reject pairing file for missing specific keys. Only require it parses as plist and is not empty.
          HINTS_EOF

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix: pairing file discovery, delete pairing, glow everywhere [skip ci]"
            git push
          fi

      - name: Generate project
        run: |
          set -euo pipefail
          test -d natsuk1/Resources/CarrierAssets/CarrierLab.bundle
          test -f natsuk1/Resources/CarrierAssets/CarrierLab.bundle/carrier.plist
          test -f natsuk1/Resources/CarrierAssets/Docomo_jp.bundle/carrier.plist
          grep -q 'CarrierAssets' project.yml
          grep -q 'nk_necp_cancel' natsuk1/Helpers/AirliftBridge.swift && exit 1 || true
          rm -rf natsuk1.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build -quiet

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" \( -name '*.dSYM' -o -name '*.swiftmodule' -o -name '*.swiftdoc' -o -name '*.swiftsourceinfo' \) -exec rm -rf {} + 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
          R="${{ github.repository }}"
          IPA="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          **Install**

          - Direct IPA: $IPA

          **Recent commits**

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"