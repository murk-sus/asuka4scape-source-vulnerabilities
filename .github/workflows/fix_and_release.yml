name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "release tag, e.g. v1.0.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
         fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
         xcode-version: "26.5"

      - name: Install tools
        run: |
         set -e
         command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
         command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Write CarrierLabCompat.swift
        run: |
         set -euo pipefail
         cat > natsuk1/CarrierLab/CarrierLabCompat.swift <<'COMPAT_EOF'
         import Foundation

         extension CarrierLabBridge {
             static let carrierUserRoot = "/var/mobile/Library/Carrier Bundles"
             static let carrierRoot = "/var/mobile/Library/Carrier Bundles/iPhone"
             static let defaultSlots = ["Carrier1Bundle.bundle", "Operator1Bundle.bundle"]
         }

         extension PairingGenerator {
             static func cancelMinting() {
                 LockdownPair.requestCancel()
                 PairingController.shared.pairingStatus = "Cancelling..."
             }
         }

         final class CarrierLabSlots: @unchecked Sendable {
             static let shared = CarrierLabSlots()
             private init() {}

             struct Outcome {
                 let ok: Bool
                 let message: String
                 let slots: [String]
             }

             private func size(_ path: String) -> Int {
                 (try? FileManager.default.attributesOfItem(atPath: path)[.size] as? Int) ?? 0
             }

             func pairingPath() -> String? {
                 let fm = FileManager.default
                 let canonical = PairingController.pairingFilePath()
                 if fm.fileExists(atPath: canonical) && size(canonical) > 0 { return canonical }
                 guard let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first else { return nil }
                 for name in ["natsuk1_pairing.plist", "ALTPairingFile.mobiledevicepairing"] {
                     let candidate = docs.appendingPathComponent(name).path
                     if fm.fileExists(atPath: candidate) && size(candidate) > 0 { return candidate }
                 }
                 return nil
             }

             func sourcePath() -> String {
                 Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/CarrierLab.bundle").path
             }

             func triggerPath() -> String {
                 Bundle.main.bundleURL.appendingPathComponent("CarrierAssets/Docomo_jp.bundle").path
             }

             func fileCount(_ path: String) -> Int {
                 let fm = FileManager.default
                 var isDirectory: ObjCBool = false
                 guard fm.fileExists(atPath: path, isDirectory: &isDirectory), isDirectory.boolValue else { return 0 }
                 guard let walker = fm.enumerator(at: URL(fileURLWithPath: path),
                                                 includingPropertiesForKeys: [.isRegularFileKey]) else { return 0 }
                 var files = 0
                 for case let url as URL in walker {
                     if (try? url.resourceValues(forKeys: [.isRegularFileKey]))?.isRegularFile == true { files += 1 }
                 }
                 return files
             }

             func readiness() -> String? {
                 guard let path = pairingPath() else { return "No pairing file. Pair from Tools / Airlift first." }
                 let kind = PairingFileKind.of(path: path)
                 guard kind.isUsable else { return "Pairing file is not a plist." }
                 guard kind.hasLockdown else { return "No classic lockdown record, so port 62078 cannot work." }
                 return nil
             }

             private func inject(source: String, parent: String, name: String) -> String? {
                 guard let pairing = pairingPath() else { return "No pairing file." }
                 if fileCount(source) == 0 { return "no files in directory: \(source)" }
                 var outError: UnsafeMutablePointer<CChar>? = nil
                 var rc: Int32 = -1
                 pairing.withCString { pc in
                     source.withCString { sc in
                         parent.withCString { tc in
                             name.withCString { nc in
                                 rc = al_exploit_inject_folder(pc, sc, tc, nc, nil, nil, &outError)
                             }
                         }
                     }
                 }
                 let message = outError.flatMap { pointer -> String? in
                     let text = String(cString: pointer)
                     al_string_free(pointer)
                     return text
                 }
                 return rc == 0 ? nil : (message ?? "inject rc=\(rc)")
             }

             func install(slots: [String]) -> Outcome {
                 if let problem = readiness() { return Outcome(ok: false, message: problem, slots: []) }
                 let source = sourcePath()
                 if fileCount(source) == 0 {
                     return Outcome(ok: false, message: "no files in directory: \(source)", slots: [])
                 }
                 var written: [String] = []
                 var failures: [String] = []
                 for slot in slots {
                     if let error = inject(source: source, parent: CarrierLabBridge.carrierUserRoot, name: slot) {
                         failures.append("\(slot): \(error)")
                     } else {
                         written.append(slot)
                     }
                 }
                 if !failures.isEmpty {
                     return Outcome(ok: false, message: failures.joined(separator: " | "), slots: written)
                 }
                 let trigger = triggerPath()
                 if fileCount(trigger) > 0,
                    let error = inject(source: trigger, parent: CarrierLabBridge.carrierRoot, name: "Docomo_jp.bundle") {
                     return Outcome(ok: false, message: error, slots: written)
                 }
                 return Outcome(ok: true, message: "written into \(written.joined(separator: ","))", slots: written)
             }
         }
         COMPAT_EOF

      - name: Write CarrierLabView.swift
        run: |
         set -euo pipefail
         cat > natsuk1/CarrierLab/CarrierLabView.swift <<'CLVIEW_EOF'
         import SwiftUI
         import UIKit

         struct CarrierLabView: View {
             @ObservedObject private var state = CarrierLabState.shared
             @EnvironmentObject private var appState: AppState

             @State private var slotText = ""
             @State private var copied = false
             @State private var info = ""

             var body: some View {
                 List {
                     Section {
                         row("Target root", CarrierLabBridge.carrierUserRoot)
                         row("Session", state.session?.status.rawValue ?? "clean")
                         if let error = state.session?.lastError {
                             Text(error).font(.footnote).foregroundStyle(.red)
                         }
                         if !info.isEmpty {
                             Text(info).font(.system(size: 10, design: .monospaced)).foregroundStyle(.secondary)
                         }
                     } header: { Label("CarrierLab", systemImage: "shippingbox") }

                     Section {
                         HStack {
                             Text("Slots")
                             Spacer()
                             TextField("Carrier1Bundle.bundle", text: $slotText)
                                 .multilineTextAlignment(.trailing)
                                 .font(.system(.footnote, design: .monospaced))
                                 .autocorrectionDisabled()
                         }
                         Button { applySlots() } label: { Text("Apply Slots") }
                         Button {
                             slotText = CarrierLabBridge.defaultSlots.joined(separator: ", ")
                             applySlots()
                         } label: { Text("Reset Slots To Default") }
                     } header: { Label("Targets", systemImage: "folder.badge.gearshape") }
                     footer: {
                         Text("Contents of CarrierLab.bundle go into these existing bundles under the target root, not into a new folder.")
                             .font(.caption2)
                     }

                     Section {
                         Button { run("Check") { CarrierLabSlots.shared.readiness() ?? "ready" } } label: { Text("Check") }
                         Button { run("Install") { installLog() } } label: { Text("Install") }
                         Button { run("Reload") { installLog() } } label: { Text("Reload") }
                         Button { appState.respring() } label: { Text("Respring") }
                         Button(role: .destructive) { reset() } label: { Text("Reset") }
                     } header: { Label("Actions", systemImage: "wrench") }

                     if !state.logText.isEmpty {
                         Section {
                             ScrollView {
                                 Text(state.logText)
                                     .font(.system(size: 10, design: .monospaced))
                                     .frame(maxWidth: .infinity, alignment: .leading)
                             }
                             .frame(minHeight: 120, maxHeight: 300)
                         } header: { Label("Log", systemImage: "terminal") }

                         Section {
                             Button {
                                 UIPasteboard.general.string = state.logText
                                 copied = true
                                 DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { copied = false }
                             } label: { Text(copied ? "Copied" : "Copy All") }
                             Button(role: .destructive) { state.clearLog() } label: { Text("Clear") }
                         } header: { Label("Log Actions", systemImage: "document.on.document") }
                     }
                 }
                 .listStyle(.insetGrouped)
                 .navigationTitle("CarrierLab")
                 .navigationBarTitleDisplayMode(.inline)
                 .onAppear {
                     slotText = state.slots.joined(separator: ", ")
                     refresh()
                 }
             }

             private func row(_ key: String, _ value: String) -> some View {
                 HStack {
                     Text(key)
                     Spacer()
                     Text(value)
                         .font(.system(size: 10, design: .monospaced))
                         .foregroundStyle(.secondary)
                         .lineLimit(1)
                         .truncationMode(.head)
                 }
             }

             private func refresh() {
                 let files = CarrierLabSlots.shared.fileCount(CarrierLabSlots.shared.sourcePath())
                 info = "CarrierLab.bundle: \(files) file(s)"
             }

             private func applySlots() {
                 state.setSlots(slotText.split(separator: ",").map { String($0).trimmingCharacters(in: .whitespaces) })
                 state.appendLog("[slots] \(state.slots.joined(separator: ","))")
             }

             private func installLog() -> String {
                 let outcome = CarrierLabSlots.shared.install(slots: CarrierLabState.shared.slots)
                 CarrierLabState.shared.save(CarrierLabState.Session(
                     status: outcome.ok ? .placed : .failed,
                     startedAt: Date(),
                     carrierBundlePath: CarrierLabSlots.shared.sourcePath(),
                     originalBackupPath: nil,
                     ipccTriggerPath: CarrierLabSlots.shared.triggerPath(),
                     lastError: outcome.ok ? nil : outcome.message,
                     aliases: nil,
                     slots: outcome.slots))
                 return outcome.ok ? outcome.message : "failed: \(outcome.message)"
             }

             private func run(_ name: String, _ work: @escaping () -> String) {
                 if state.busy { return }
                 state.setBusy(true)
                 DispatchQueue.global(qos: .userInitiated).async {
                     let text = work()
                     CarrierLabState.shared.appendLog("[\(name.lowercased())] \(text)")
                     DispatchQueue.main.async { refresh() }
                     CarrierLabState.shared.setBusy(false)
                 }
             }

             private func reset() {
                 if state.busy { return }
                 state.setBusy(true)
                 DispatchQueue.global(qos: .userInitiated).async {
                     CarrierLabState.shared.clear()
                     CarrierLabState.shared.clearLog()
                     CarrierLabState.shared.setBusy(false)
                 }
             }
         }
         CLVIEW_EOF

      - name: Verify sources
        run: |
         set -euo pipefail
         fail() { echo "::error::$1"; exit 1; }
         test -f project.yml || fail 'project.yml is missing'
         test -f natsuk1/App/natsuk1.swift || fail 'natsuk1/App/natsuk1.swift is missing'
         test -f natsuk1/Helpers/LockdownPair.swift || fail 'LockdownPair.swift is missing'
         grep -q 'static let defaultSlots' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: static let defaultSlots'
         grep -q 'static let carrierUserRoot' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: static let carrierUserRoot'
         grep -q 'static func cancelMinting' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: static func cancelMinting'
         grep -q 'al_exploit_inject_folder' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift is stale: al_exploit_inject_folder'
         grep -q 'CarrierLabBridge.defaultSlots' natsuk1/CarrierLab/CarrierLabView.swift || fail 'natsuk1/CarrierLab/CarrierLabView.swift is stale: CarrierLabBridge.defaultSlots'
         grep -q 'Copy All' natsuk1/CarrierLab/CarrierLabView.swift || fail 'natsuk1/CarrierLab/CarrierLabView.swift is stale: Copy All'
         grep -q 'requestCancel' natsuk1/Helpers/LockdownPair.swift || fail 'natsuk1/Helpers/LockdownPair.swift is stale: requestCancel'
         grep -q 'LockdownPair.cancelled' natsuk1/Helpers/AirliftBridge.swift || fail 'natsuk1/Helpers/AirliftBridge.swift is stale: LockdownPair.cancelled'
         grep -q 'idevice_shim.h' natsuk1/Support/bridging.h || fail 'natsuk1/Support/bridging.h is stale: idevice_shim.h'
         ! grep -q 'CarrierLabInstaller' natsuk1/CarrierLab/CarrierLabView.swift || fail 'natsuk1/CarrierLab/CarrierLabView.swift must not contain CarrierLabInstaller'
         ! grep -q 'Task' natsuk1/CarrierLab/CarrierLabCompat.swift || fail 'natsuk1/CarrierLab/CarrierLabCompat.swift must not contain Task'

      - name: Generate project
        run: |
         set -euo pipefail
         rm -rf natsuk1.xcodeproj
         xcodegen generate

      - name: Build
        run: |
         set -euo pipefail
         xcodebuild \
           -project natsuk1.xcodeproj \
           -scheme natsuk1 \
           -configuration Release \
           -destination "generic/platform=iOS" \
           -derivedDataPath build \
           -jobs "$(sysctl -n hw.ncpu)" \
           CODE_SIGNING_ALLOWED=NO \
           SWIFT_STRICT_CONCURRENCY=minimal \
           SWIFT_OPTIMIZATION_LEVEL=-Osize \
           DEAD_CODE_STRIPPING=YES \
           COPY_PHASE_STRIP=YES \
           STRIP_INSTALLED_PRODUCT=YES \
           STRIP_STYLE=all \
           OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
           build -quiet

      - name: Package
        run: |
         set -euo pipefail
         APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
         test -n "$APP"
         ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP/natsuk1"
         xcrun strip -S -x "$APP/natsuk1" || true
         rm -rf Payload natsuk1.ipa natsuk1.ipa.sha256
         mkdir -p Payload
         cp -R "$APP" Payload/
         ditto -c -k --sequesterRsrc --keepParent Payload natsuk1.ipa
         rm -rf Payload
         shasum -a 256 natsuk1.ipa | awk '{print $1"  natsuk1.ipa"}' > natsuk1.ipa.sha256

      - name: Publish
        env:
         GH_TOKEN: ${{ github.token }}
        run: |
         set -euo pipefail
         TAG="${{ inputs.version }}"
         if [ -n "$TAG" ]; then
           gh release view "$TAG" >/dev/null 2>&1 && { echo "::error::release $TAG already exists"; exit 1; }
           gh release create "$TAG" natsuk1.ipa natsuk1.ipa.sha256 --target "${{ github.sha }}" --title "natsuk1 $TAG" --generate-notes --latest
           echo "published $TAG"
         else
           gh release view development >/dev/null 2>&1 && gh release delete development --yes --cleanup-tag || true
           gh release create development natsuk1.ipa natsuk1.ipa.sha256 --target "${{ github.sha }}" --title "Development" --prerelease --latest=false --notes "natsuk1 development"
           echo "refreshed development"
         fi