name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            build
          key: nk-v22-static
          restore-keys: |
            nk-v22-
            nk-v21-

      - name: Cleanup legacy
        run: |
          set -e
          rm -f .github/workflows/build_and_release.yml || true
          rm -f .github/workflows/fix_and_test.yml || true
          rm -f natsuk1/Views/SimpleList.swift || true
          rm -f ai-hints-curated.md || true
          find . -name .DS_Store -delete || true

      - name: Verify AirliftFFI present
        run: |
          set -e
          A=natsuk1/External/AirliftFFI.xcframework/ios-arm64
          test -f "$A/Headers/airlift.h" || { echo "missing airlift.h"; exit 1; }
          test -f "$A/libairlift_ffi.a" || { echo "missing libairlift_ffi.a"; exit 1; }
          echo "airlift stub: $(wc -c < "$A/libairlift_ffi.a") bytes"

      - name: Install tools
        run: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            GCC_OPTIMIZATION_LEVEL=s \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          BIN="$APP/natsuk1"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          xcrun strip -S -x "$BIN" || true
          find "$APP" -name "*.dSYM" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "*.swiftmodule" -delete 2>/dev/null || true
          find "$APP" -name "*.swiftdoc" -delete 2>/dev/null || true
          find "$APP" -name "*.swiftsourceinfo" -delete 2>/dev/null || true
          xattr -cr "$APP" || true
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          COPYFILE_DISABLE=1 zip -9 -qry natsuk1.ipa Payload
          rm -rf Payload
          SIZE=$(stat -f%z natsuk1.ipa)
          echo "IPA bytes $SIZE"
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          R="${{ github.repository }}"
          U="https://github.com/$R/releases/download/development/natsuk1.ipa"
          NOTES="natsuk1 v22.0 ($((SIZE/1024)) KB)

          Install:
          - IPA: $U
          - LiveContainer: livecontainer://install?url=$U
          - SideStore: sidestore://install?url=$U
          - AltStore: altstore://install?url=$U
          - Scarlet: scarlet://install?url=$U
          - ESign: esign://install?url=$U

          $(git log -5 --pretty=format:'- %h %s')"
          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "v22.0: build [skip ci]"
          git push