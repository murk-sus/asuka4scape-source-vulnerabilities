name: Setup XPF + ChOma

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Clone XPF
        run: |
          rm -rf /tmp/XPF
          git clone --recursive https://github.com/opa334/XPF.git /tmp/XPF
          cd /tmp/XPF
          git submodule update --init --recursive

      - name: Build ChOma static lib
        run: |
          cd /tmp/XPF/external/ChOma
          mkdir -p build/ios output/ios/lib output/ios/include/choma
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          OPENSSL=$(ls -d /opt/homebrew/Cellar/openssl@3/*/include | head -1)
          CFLAGS="-Wall -Wno-everything -fPIC -framework CoreFoundation -arch arm64 -arch arm64e -isysroot $SDK -miphoneos-version-min=11.0 -I$OPENSSL"
          for f in src/*.c; do
            name=$(basename "$f" .c)
            clang $CFLAGS -c "$f" -o "build/ios/$name.o"
          done
          libtool -static build/ios/*.o -o output/ios/lib/libchoma.a
          cp include/choma/*.h output/ios/include/choma/ 2>/dev/null || true
          ls -la output/ios/lib/

      - name: Build XPF static lib
        run: |
          cd /tmp/XPF
          mkdir -p build/ios output/ios/lib output/ios/include
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CHOMA=/tmp/XPF/external/ChOma
          CFLAGS="-Wall -Wno-everything -fPIC -framework CoreFoundation -arch arm64 -arch arm64e -isysroot $SDK -miphoneos-version-min=11.0 -I$CHOMA/output/ios/include -I$CHOMA/output/ios/include/choma -Iinclude"
          for f in src/*.c; do
            name=$(basename "$f" .c)
            clang $CFLAGS -c "$f" -o "build/ios/$name.o"
          done
          libtool -static build/ios/*.o $CHOMA/output/ios/lib/libchoma.a -o output/ios/lib/libxpf.a
          cp include/*.h output/ios/include/ 2>/dev/null || true
          ls -la output/ios/lib/

      - name: Locate artifacts
        run: |
          echo "=== .a files ==="
          find /tmp/XPF -name "*.a" -type f
          echo "=== headers ==="
          find /tmp/XPF -name "*.h" -path "*output*"
          find /tmp/XPF -name "xpf.h"

      - name: Copy artifacts
        run: |
          mkdir -p natsuk1/External
          cp /tmp/XPF/output/ios/lib/libxpf.a natsuk1/External/
          cp /tmp/XPF/external/ChOma/output/ios/lib/libchoma.a natsuk1/External/
          cp /tmp/XPF/include/xpf.h natsuk1/External/ 2>/dev/null || find /tmp/XPF -name "xpf.h" -exec cp {} natsuk1/External/ \;
          cp /tmp/XPF/include/kernel.h natsuk1/External/ 2>/dev/null || true
          cp /tmp/XPF/include/offset.h natsuk1/External/ 2>/dev/null || true
          cp -r /tmp/XPF/external/ChOma/output/ios/include/choma natsuk1/External/ 2>/dev/null || true
          ls -la natsuk1/External/

      - name: Update bridging.h
        run: |
          printf '%s\n' \
            '#ifndef NATSUK1_BRIDGING_H' \
            '#define NATSUK1_BRIDGING_H' \
            '' \
            '#include <stdint.h>' \
            '#include "Exploit/nk_api.h"' \
            '#import "External/libgrabkernel2.h"' \
            '#import "External/xpf.h"' \
            '' \
            '#endif' \
            > natsuk1/bridging.h
          echo "=== bridging.h ==="
          cat natsuk1/bridging.h

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/External/ natsuk1/bridging.h
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add XPF + ChOma static libraries"
          git push
