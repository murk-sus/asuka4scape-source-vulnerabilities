name: Setup XPF + ChOma

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone XPF
        run: |
          rm -rf /tmp/XPF
          git clone --recursive https://github.com/opa334/XPF.git /tmp/XPF
          cd /tmp/XPF
          git submodule update --init --recursive

      - name: Build ChOma
        run: |
          cd /tmp/XPF/external/ChOma
          make TARGET=ios

      - name: Build XPF
        run: |
          cd /tmp/XPF
          make TARGET=ios

      - name: Locate artifacts
        id: find
        run: |
          echo "=== .a files ==="
          find /tmp/XPF -name "*.a" -type f
          echo "=== .h files ==="
          find /tmp/XPF -name "*.h" -type f | head -50

      - name: Copy artifacts
        run: |
          mkdir -p natsuk1/External
          find /tmp/XPF -name "libxpf.a" -exec cp {} natsuk1/External/ \;
          find /tmp/XPF -name "libchoma.a" -exec cp {} natsuk1/External/ \;
          find /tmp/XPF -name "xpf.h" -exec cp {} natsuk1/External/ \;
          find /tmp/XPF -name "choma.h" -exec cp {} natsuk1/External/ \; 2>/dev/null || true
          ls -la natsuk1/External/

      - name: Update bridging.h
        run: |
          cat > natsuk1/bridging.h <<'EOF'
          #ifndef NATSUK1_BRIDGING_H
          #define NATSUK1_BRIDGING_H

          #include <stdint.h>
          #include "Exploit/nk_api.h"
          #import "External/libgrabkernel2.h"
          #import "xpf.h"

          #endif
          EOF
          cat natsuk1/bridging.h

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/External/ natsuk1/bridging.h
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add XPF + ChOma static libraries"
          git push
