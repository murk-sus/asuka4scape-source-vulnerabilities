name: 2 · Build and Release

on:
  workflow_run:
    workflows: ["1 · Fix and Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download app tarball
        uses: actions/download-artifact@v6
        with:
          name: natsuk1-app-tar
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack tarball
        id: unpack
        run: |
          set -euo pipefail

          if [ ! -f artifact/natsuk1-app.tar.gz ]; then
            echo "Tarball not found:"
            find artifact -type f
            exit 1
          fi

          mkdir -p app-out
          tar -xzf artifact/natsuk1-app.tar.gz -C app-out

          APP_PATH="$(find app-out -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app after unpack"
            find app-out -maxdepth 3
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Unpacked: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Install ldid
        run: |
          brew install ldid
          brew link --overwrite ldid || true

      - name: Sign binary
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.unpack.outputs.app_path }}"
          BIN="$APP_PATH/natsuk1"

          if [ ! -f "$BIN" ]; then
            echo "Binary missing: $BIN"
            ls -la "$APP_PATH"
            exit 1
          fi

          chmod +x "$BIN"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"

          echo "verify after ldid:"
          ls -la "$BIN"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.unpack.outputs.app_path }}"

          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload

          ls -lh natsuk1.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi

          NOTES="$(git log -5 --pretty=format:'- %h %s')"

          gh release create development natsuk1.ipa \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Automated build

          Source commit: ${{ github.event.workflow_run.head_sha || github.sha }}

          ${NOTES}"
