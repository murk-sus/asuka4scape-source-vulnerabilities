name: 2 · Build and Release

on:
  workflow_run:
    workflows: ["1 · Fix and Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.5"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Try download app tarball
        id: try-download
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: natsuk1-app-tar
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check artifact presence
        id: check
        run: |
          if [ -f artifact/natsuk1-app.tar.gz ]; then
            echo "have_artifact=true" >> "$GITHUB_OUTPUT"
            ls -lh artifact/natsuk1-app.tar.gz
          else
            echo "have_artifact=false" >> "$GITHUB_OUTPUT"
            echo "artifact missing, will build from source"
          fi

      - name: Unpack tarball
        if: steps.check.outputs.have_artifact == 'true'
        id: unpack
        run: |
          set -euo pipefail
          mkdir -p app-out
          tar -xzf artifact/natsuk1-app.tar.gz -C app-out
          APP_PATH="$(find app-out -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app after unpack"
            find app-out -maxdepth 3
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Fallback build from source
        if: steps.check.outputs.have_artifact == 'false'
        id: fallback
        run: |
          set -euo pipefail

          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/External
          rm -rf natsuk1/External/AirliftFFI.xcframework
          cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/

          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

          xcodegen generate

          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_DEFAULT_ACTOR_ISOLATION=nonisolated \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-default-isolation nonisolated -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Resolve app path
        id: app
        run: |
          if [ "${{ steps.check.outputs.have_artifact }}" = "true" ]; then
            echo "path=${{ steps.unpack.outputs.app_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.fallback.outputs.app_path }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ldid
        run: |
          brew install ldid || true
          brew link --overwrite ldid || true

      - name: Sign binary
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          BIN="$APP_PATH/natsuk1"

          if [ ! -f "$BIN" ]; then
            echo "binary missing: $BIN"
            ls -la "$APP_PATH"
            exit 1
          fi

          chmod +x "$BIN"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          ls -la "$BIN"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"

          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload

          ls -lh natsuk1.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi

          NOTES="$(git log -5 --pretty=format:'- %h %s')"
          TARGET_SHA="$(git rev-parse HEAD)"

          gh release create development natsuk1.ipa \
            --target "$TARGET_SHA" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Automated build

          Source commit: $TARGET_SHA

          ${NOTES}"
