name: 2 · Build and Release

on:
  workflow_run:
    workflows: ["1 · Fix and Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.5"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Try download app tarball
        id: try-download
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: natsuk1-app-tar
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check artifact presence
        id: check
        run: |
          if [ -f artifact/natsuk1-app.tar.gz ]; then
            echo "have_artifact=true" >> "$GITHUB_OUTPUT"
            ls -lh artifact/natsuk1-app.tar.gz
          else
            echo "have_artifact=false" >> "$GITHUB_OUTPUT"
            echo "artifact missing, will build from source"
          fi

      - name: Unpack tarball
        if: steps.check.outputs.have_artifact == 'true'
        id: unpack
        run: |
          set -euo pipefail
          mkdir -p app-out
          tar -xzf artifact/natsuk1-app.tar.gz -C app-out
          APP_PATH="$(find app-out -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app after unpack"
            find app-out -maxdepth 3
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Fallback build from source
        if: steps.check.outputs.have_artifact == 'false'
        id: fallback
        run: |
          set -euo pipefail

          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/External natsuk1/Helpers natsuk1/Exploit
          rm -rf natsuk1/External/AirliftFFI.xcframework
          cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/
          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/
          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/

          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re, os

          def clean(s):
              s = re.sub(r"nonisolated\(unsafe\)\s+", "", s)
              s = re.sub(r"\bnonisolated\s+(?![\(])", "", s)
              s = re.sub(r"@MainActor\s*", "", s)
              s = re.sub(r"@Published\s+", "", s)
              return s

          def mark_nonisolated(s, name):
              if ("nonisolated final class " + name) in s:
                  return s
              patterns = [
                  ("final class " + name + ": ObservableObject, @unchecked Sendable {",
                   "nonisolated final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": ObservableObject {",
                   "nonisolated final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject, @unchecked Sendable {",
                   "nonisolated final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject {",
                   "nonisolated final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, @unchecked Sendable {",
                   "nonisolated final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": @unchecked Sendable {",
                   "nonisolated final class " + name + ": @unchecked Sendable {"),
              ]
              for pat, repl in patterns:
                  if pat in s:
                      return s.replace(pat, repl, 1)
              return s

          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()

          s = s.replace("import AirliftFFI\n", "@preconcurrency import AirliftFFI\n")
          s = clean(s)
          s = mark_nonisolated(s, "PairingController")

          s = s.replace(
              "static var customPairingFilePath: String? = nil",
              "nonisolated(unsafe) static var customPairingFilePath: String? = nil")

          s = s.replace(
              "private let pairReadyCallback: ALPairReadyCb",
              "nonisolated(unsafe) private let pairReadyCallback: ALPairReadyCb")
          s = s.replace(
              "private let pairPinCallback: ALPairPinCb",
              "nonisolated(unsafe) private let pairPinCallback: ALPairPinCb")

          s = s.replace("AirCard-iOS", "natsuk1")

          s = s.replace(
              "Unmanaged<PairingController>.fromOpaque(ctx).release()",
              "Unmanaged<PairingController>.fromOpaque(box.ptr).release()")

          if "nonisolated final class RawPtrBox" not in s:
              if "final class RawPtrBox" in s:
                  s = s.replace(
                      "final class RawPtrBox",
                      "nonisolated final class RawPtrBox",
                      1)
              else:
                  s = s + (
                      "\n"
                      "nonisolated final class RawPtrBox: @unchecked Sendable {\n"
                      "    let ptr: UnsafeMutableRawPointer\n"
                      "    init(_ ptr: UnsafeMutableRawPointer) { self.ptr = ptr }\n"
                      "}\n")

          s = s.replace(
              "            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()",
              "            let box = RawPtrBox(ctx)\n            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()")

          open(p, "w").write(s)
          print("patched PairingController")

          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()
          s = re.sub(
              r"return String\(cString: host\)",
              "let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)",
              s)
          open(p, "w").write(s)
          print("patched NetworkStatus")

          p = "natsuk1/Helpers/KeepAlive.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = clean(s)
              s = mark_nonisolated(s, "KeepAlive")
              open(p, "w").write(s)
              print("patched KeepAlive")
          ENDSCRIPT

          python3 /tmp/patch.py

          python3 - <<'PY'
          p = "project.yml"
          s = open(p).read()
          anchor = '    SWIFT_VERSION: "6.0"\n'
          extra = (
              '    SWIFT_VERSION: "6.0"\n'
              '    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated\n'
              '    SWIFT_APPROACHABLE_CONCURRENCY: NO\n'
              '    SWIFT_STRICT_CONCURRENCY: minimal\n'
          )
          if "SWIFT_DEFAULT_ACTOR_ISOLATION" not in s and anchor in s:
              s = s.replace(anchor, extra, 1)
          tgt_anchor = "        SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h\n"
          tgt_extra = (
              "        SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h\n"
              "        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated\n"
              "        SWIFT_APPROACHABLE_CONCURRENCY: NO\n"
              "        SWIFT_STRICT_CONCURRENCY: minimal\n"
              '        OTHER_SWIFT_FLAGS: "$(inherited) -default-isolation nonisolated"\n'
          )
          if "OTHER_SWIFT_FLAGS" not in s and tgt_anchor in s:
              s = s.replace(tgt_anchor, tgt_extra, 1)
          open(p, "w").write(s)
          PY

          if grep -q "@MainActor" natsuk1/Helpers/PairingController.swift; then
            echo "PairingController still has @MainActor"
            exit 1
          fi
          if grep -q "nonisolated nonisolated" natsuk1/Helpers/PairingController.swift; then
            echo "duplicate nonisolated in PairingController"
            exit 1
          fi

          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

          xcodegen generate

          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_DEFAULT_ACTOR_ISOLATION=nonisolated \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-default-isolation nonisolated" \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Resolve app path
        id: app
        run: |
          if [ "${{ steps.check.outputs.have_artifact }}" = "true" ]; then
            echo "path=${{ steps.unpack.outputs.app_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.fallback.outputs.app_path }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ldid
        run: |
          brew install ldid || true
          brew link --overwrite ldid || true

      - name: Sign binary
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"
          BIN="$APP_PATH/natsuk1"

          if [ ! -f "$BIN" ]; then
            echo "binary missing: $BIN"
            ls -la "$APP_PATH"
            exit 1
          fi

          chmod +x "$BIN"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$BIN"
          ls -la "$BIN"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.app.outputs.path }}"

          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload

          ls -lh natsuk1.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi

          NOTES="$(git log -5 --pretty=format:'- %h %s')"
          TARGET_SHA="$(git rev-parse HEAD)"

          gh release create development natsuk1.ipa \
            --target "$TARGET_SHA" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Automated build

          Source commit: $TARGET_SHA

          ${NOTES}"
