name: 2 · Build and Release

on:
  workflow_run:
    workflows: ["1 · Fix and Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: natsuk1-app
          path: app-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-release-${{ runner.os }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install ldid
        run: |
          brew install ldid
          brew link --overwrite ldid

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail

          APP_PATH="$(find app-bundle -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in artifact"
            ls -la app-bundle
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "app_name=$(basename "$APP_PATH")" >> "$GITHUB_OUTPUT"

          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"

          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --norsrc --keepParent Payload natsuk1.ipa
          rm -rf Payload

          ls -lh natsuk1.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi

          NOTES="$(git log -5 --pretty=format:'- %h %s')"

          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Automated build

          Source commit: ${GITHUB_SHA}

          ${NOTES}"
