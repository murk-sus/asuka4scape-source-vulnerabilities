          JSON

      - name: Write offsets index
        run: |
          cat > natsuk1/Offsets/index.json <<'JSON'
          {
            "versions": [
              {
                "file": "iPhone14,5_iOS27.0_24A437.json",
                "device": "iPhone14,5",
                "deviceName": "iPhone 13",
                "chip": "A15 Bionic",
                "ios": "27.0",
                "build": "24A437",
                "verified": false
              }
            ]
          }
          JSON

      - name: Verify
        run: |
          set -euo pipefail
          F=natsuk1/Exploit/necp.c
          grep -q "natsuk1-kread-v5" "$F"
          grep -q "port_set_qlimit" "$F"
          grep -q "MACH_SEND_TIMEOUT" "$F"
          grep -q "ool_spray_count" "$F"
          grep -q "dump_buf_words" "$F"
          grep -q -e "----- attempt" "$F"
          test "$(grep -c 'static volatile int g_busy = 0;' "$F")" = "1"
          test "$(grep -c 'static int nk_necp_run_impl(void)' "$F")" = "1"
          test "$(grep -c 'int nk_necp_run(void)' "$F")" = "1"
          test "$(grep -c 'static mach_port_t port_new(void)' "$F")" = "1"
          test "$(grep -c 'static void ool_spray(mach_port_t' "$F")" = "1"
          test "$(grep -c 'static void ool_drain(mach_port_t' "$F")" = "1"
          test "$(grep -c 'static int ool_spray_count(mach_port_t' "$F")" = "1"
          test "$(grep -c 'static void dump_buf_words(const char' "$F")" = "1"
          test "$(grep -c 'static int kread_raw(uint64_t' "$F")" = "1"
          test "$(grep -c 'static int calibrate_kread(void)' "$F")" = "1"
          python3 - <<'PYEOF'
          import json
          d = json.load(open("natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json"))
          items = sum(len(g["items"]) for g in d["groups"])
          assert items == len(d["defaults"])
          assert d["defaults"]["off_proc_ro_p_ucred"] == "0x98"
          assert d["defaults"]["off_ucred_cr_uid"] == "0x18"
          print("OK: %d offsets" % items)
          PYEOF

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "kread v5: qlimit + send timeout + preflight checks"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/necp.c natsuk1/Offsets/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "kread v5: qlimit + send timeout [skip ci]"
          git push
