name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Fetch fresh sources
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/Helpers natsuk1/Exploit natsuk1/External
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/
          if [ ! -d natsuk1/External/AirliftFFI.xcframework ]; then
            cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/
          fi

      - name: Write patcher
        run: |
          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re, os

          def clean(s):
              s = re.sub(r"nonisolated\(unsafe\)\s+", "", s)
              s = re.sub(r"\bnonisolated\s+(?![\(])", "", s)
              s = re.sub(r"@MainActor\s*", "", s)
              s = re.sub(r"@Published\s+", "", s)
              return s

          def mark_sendable(s, name):
              if ("class " + name) in s and ("@unchecked Sendable" in s.split("class " + name, 1)[1].split("{", 1)[0]):
                  return s
              patterns = [
                  ("final class " + name + ": ObservableObject, @unchecked Sendable {",
                   "final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": ObservableObject {",
                   "final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject, @unchecked Sendable {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, @unchecked Sendable {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": @unchecked Sendable {",
                   "final class " + name + ": @unchecked Sendable {"),
              ]
              for pat, repl in patterns:
                  if pat in s:
                      return s.replace(pat, repl, 1)
              return s

          def protect_shared(s):
              for name in ("static let shared", "static var shared",
                           "static let sharedInstance", "static var sharedInstance"):
                  s = re.sub(
                      r"(?<!nonisolated\(unsafe\) )\b" + re.escape(name) + r"\b",
                      "nonisolated(unsafe) " + name, s)
              return s

          def add_sendable(s):
              out = []
              for line in s.split("\n"):
                  stripped = line.strip()
                  if ("ObservableObject" in stripped or "NSObject" in stripped) and (
                      stripped.startswith("final class ")
                      or stripped.startswith("class ")):
                      if stripped.endswith(" {"):
                          new_line = line
                          if "@unchecked Sendable" not in new_line:
                              new_line = new_line[:-2].rstrip().rstrip(",") + ", @unchecked Sendable {"
                          out.append(new_line)
                          continue
                  out.append(line)
              return "\n".join(out)

          # --- PairingController ---
          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()
          s = s.replace("@preconcurrency import AirliftFFI\n", "import AirliftFFI\n")
          s = clean(s)
          s = mark_sendable(s, "PairingController")
          s = protect_shared(s)
          s = s.replace(
              "static var customPairingFilePath: String? = nil",
              "nonisolated(unsafe) static var customPairingFilePath: String? = nil")
          s = s.replace(
              "private let pairReadyCallback: ALPairReadyCb",
              "nonisolated(unsafe) private let pairReadyCallback: ALPairReadyCb")
          s = s.replace(
              "private let pairPinCallback: ALPairPinCb",
              "nonisolated(unsafe) private let pairPinCallback: ALPairPinCb")
          s = s.replace("AirCard-iOS", "natsuk1")
          s = s.replace(
              "Unmanaged<PairingController>.fromOpaque(ctx).release()",
              "Unmanaged<PairingController>.fromOpaque(box.ptr).release()")
          if "final class RawPtrBox" not in s:
              s = s + (
                  "\n"
                  "final class RawPtrBox: @unchecked Sendable {\n"
                  "    let ptr: UnsafeMutableRawPointer\n"
                  "    init(_ ptr: UnsafeMutableRawPointer) { self.ptr = ptr }\n"
                  "}\n")
          s = s.replace(
              "            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()",
              "            let box = RawPtrBox(ctx)\n            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()")
          open(p, "w").write(s)
          print("patched PairingController")

          # --- NetworkStatus ---
          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()
          s = re.sub(
              r"return String\(cString: host\)",
              "let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)",
              s)
          s = protect_shared(s)
          open(p, "w").write(s)
          print("patched NetworkStatus")

          # --- KeepAlive ---
          p = "natsuk1/Helpers/KeepAlive.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = clean(s)
              s = mark_sendable(s, "KeepAlive")
              s = protect_shared(s)
              open(p, "w").write(s)
              print("patched KeepAlive")

          # --- global pass ---
          def handle(fp):
              src = open(fp).read()
              new = re.sub(r"@MainActor\s*", "", src)
              new = new.replace("@preconcurrency import AirliftFFI\n", "import AirliftFFI\n")
              new = new.replace("@preconcurrency import ", "import ")
              new = new.replace("@preconcurrency\n", "")
              new = protect_shared(new)
              new = add_sendable(new)
              if new != src:
                  open(fp, "w").write(new)
                  print("cleaned " + fp)

          for root, dirs, files in os.walk("natsuk1"):
              for f in files:
                  if not f.endswith(".swift"):
                      continue
                  handle(os.path.join(root, f))
          ENDSCRIPT

      - name: Apply patch
        run: python3 /tmp/patch.py

      - name: Rewrite AirliftBridge paths
        run: |
          python3 - <<'PY'
          import re
          p = "natsuk1/Helpers/AirliftBridge.swift"
          s = open(p).read()

          # 1. use canonical pairing path from PairingController
          s = re.sub(
              r"func pairingFilePath\(\) -> String \{.*?\n    \}",
              '''func pairingFilePath() -> String {
                  return PairingController.pairingFilePath()
              }''',
              s, count=1, flags=re.S)

          # 2. working respring with logging
          s = re.sub(
              r"func respring\(\) \{.*?\n    \}",
              '''func respring() {
                  let pairingPath = PairingController.pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      appendLog("[respring] no pairing file at \\(pairingPath)")
                      return
                  }
                  appendLog("[respring] invoking with \\(pairingPath)")
                  Task.detached { [weak self] in
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      let rc: Int32 = pairingPath.withCString { pc in
                          al_device_respring(pc, nil, nil, &outError)
                      }
                      let errStr = outError.flatMap { p -> String? in
                          let s = String(cString: p); al_string_free(p); return s
                      }
                      await MainActor.run {
                          if rc == 0 {
                              self?.appendLog("[respring] ok")
                          } else {
                              self?.appendLog("[respring] rc=\\(rc) \\(errStr ?? "")")
                          }
                      }
                  }
              }''',
              s, count=1, flags=re.S)

          open(p, "w").write(s)
          print("rewrote AirliftBridge paths + respring")
          PY

      - name: Rewrite ContentView.swift
        run: |
          cat > natsuk1/Views/ContentView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState
              @EnvironmentObject var airlift: AirliftBridge

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              NavigationLink {
                                  AirliftView().environmentObject(airlift)
                              } label: {
                                  Text(state.t("Airlift", "Airlift"))
                              }
                          } header: {
                              Label(state.t("Sandbox Escape", "Побег из песочницы"), systemImage: "bolt.shield")
                          }

                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "bolt.fill")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Exploit", "Эксплойт"), systemImage: "cpu")
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                              }
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                              } label: {
                                  Text(state.t("Copy All", "Копировать всё"))
                              }
                              .disabled(state.log.isEmpty)

                              Button(role: .destructive) {
                                  state.clear()
                              } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label(state.t("Log Actions", "Действия с логом"), systemImage: "doc.on.doc")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                              .font(.system(size: 10, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .onChange(of: state.log) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          SWIFT
          echo "wrote ContentView.swift"

      - name: Rewrite AirliftView.swift
        run: |
          cat > natsuk1/Views/AirliftView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge

              private var localDevVPNUp: Bool {
                  NetworkStatus.interfaces().contains {
                      NetworkStatus.isTunnelInterface($0.name)
                  }
              }

              var body: some View {
                  List {
                      if !localDevVPNUp {
                          Section {
                              HStack(spacing: 10) {
                                  Image(systemName: "exclamationmark.triangle.fill")
                                      .foregroundStyle(.orange)
                                  Text("LocalDevVPN is not active. Enable it before running Airlift.")
                                      .font(.subheadline)
                                      .foregroundColor(.secondary)
                              }
                          }
                      }

                      switch airlift.state {
                      case .idle, .pairing:
                          pairingSection
                      case .ready, .running, .done:
                          exploitSection
                      }

                      if !airlift.exploitLog.isEmpty {
                          Section {
                              AirliftLogView(lines: airlift.exploitLog, onClear: { airlift.clearLog() })
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label("Log", systemImage: "apple.terminal")
                          }
                      }
                  }
                  .listStyle(.insetGrouped)
                  .scrollContentBackground(.hidden)
                  .background(Color(UIColor.systemGroupedBackground))
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
              }

              @ViewBuilder
              private var pairingSection: some View {
                  Section {
                      VStack(alignment: .leading, spacing: 6) {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.shield.fill")
                                  .foregroundStyle(airlift.hasPairing() ? .green : .orange)
                              Text(airlift.hasPairing() ? "Paired" : "Not paired")
                                  .font(.subheadline.bold())
                          }
                      }
                      .padding(.vertical, 4)

                      if case .pairing = airlift.state {
                          HStack(spacing: 8) {
                              ProgressView().scaleEffect(0.85)
                              Text(airlift.pairingStatus.isEmpty ? "Starting..." : airlift.pairingStatus)
                                  .font(.subheadline)
                                  .foregroundColor(.secondary)
                          }
                      }

                      if let pin = airlift.pairPIN {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("ENTER THIS PIN")
                                  .font(.caption2.bold())
                                  .foregroundStyle(.secondary)
                              Text(pin)
                                  .font(.system(size: 36, weight: .black, design: .monospaced))
                                  .foregroundStyle(.orange)
                              Button {
                                  if let url = URL(string: UIApplication.openSettingsURLString) {
                                      UIApplication.shared.open(url)
                                  }
                              } label: {
                                  Label("Open Settings", systemImage: "arrow.up.forward.app")
                                      .frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent)
                              .tint(.orange)
                          }
                          .padding(12)
                          .background(Color.orange.opacity(0.12))
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                      }
                  } header: {
                      Label("Pairing", systemImage: "antenna.radiowaves.left.and.right")
                  }

                  Section {
                      if case .pairing = airlift.state {
                          Button(role: .destructive) {
                              airlift.cancelPairing()
                          } label: {
                              Text("Cancel Pairing")
                                  .frame(maxWidth: .infinity)
                          }
                      } else if airlift.hasPairing() {
                          Button(role: .destructive) {
                              airlift.deletePairing()
                          } label: {
                              Text("Delete Pairing")
                                  .frame(maxWidth: .infinity)
                          }
                      } else {
                          Button {
                              airlift.runPairing()
                          } label: {
                              HStack {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                  Text("Start Pairing")
                                  Spacer()
                              }
                          }
                      }
                  }
              }

              @ViewBuilder
              private var exploitSection: some View {
                  Section {
                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target },
                              set: { airlift.target = $0 }
                          ))
                          .font(.system(size: 12, design: .monospaced))
                          .multilineTextAlignment(.trailing)
                          .autocorrectionDisabled()
                          .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Exploit", systemImage: "bolt.shield")
                  }

                  Section {
                      Button {
                          airlift.runExploit()
                      } label: {
                          HStack {
                              Image(systemName: "bolt.fill")
                              Text("Run Airlift")
                              Spacer()
                          }
                      }
                      .disabled(airlift.state == .running || !localDevVPNUp)

                      Button {
                          airlift.respring()
                      } label: {
                          HStack {
                              Image(systemName: "arrow.clockwise")
                              Text("Respring (device)")
                              Spacer()
                          }
                      }
                      .disabled(airlift.state == .running)

                      Button(role: .destructive) {
                          airlift.deletePairing()
                      } label: {
                          Text("Delete Pairing")
                              .frame(maxWidth: .infinity)
                      }
                      .disabled(airlift.state == .running)
                  }
              }
          }

          struct AirliftLogView: View {
              let lines: [String]
              let onClear: () -> Void
              @State private var copied = false

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(lines.isEmpty ? "No output yet." : lines.joined(separator: "\n"))
                              .font(.system(size: 9, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(lines.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .frame(maxHeight: 260)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
                      .onChange(of: lines.count) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
                  .contextMenu {
                      Button {
                          UIPasteboard.general.string = lines.joined(separator: "\n")
                      } label: {
                          Label("Copy All", systemImage: "doc.on.doc")
                      }
                      Button(role: .destructive) {
                          onClear()
                      } label: {
                          Label("Clear", systemImage: "trash")
                      }
                  }
              }
          }
          SWIFT
          echo "wrote AirliftView.swift"

      - name: Rewrite project.yml
        run: |
          cat > project.yml <<'YAML'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false

          configs:
            Debug: debug
            Release: release

          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              CLANG_WARN_DOCUMENTATION_COMMENTS: NO
              CLANG_WARN_UNREACHABLE_CODE: NO
              CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
              GCC_WARN_UNINITIALIZED_AUTOS: NO
              GCC_WARN_UNDECLARED_SELECTOR: NO
              GCC_WARN_UNUSED_FUNCTION: NO
              GCC_WARN_UNUSED_VARIABLE: NO
              ENABLE_STRICT_OBJC_MSGSEND: NO
              MTL_ENABLE_DEBUG_INFO: NO
              MTL_FAST_MATH: YES
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO

            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "DEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES

              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "NDEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                MTL_FAST_MATH: YES
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: YES
                LLVM_LTO_MODE: thin

          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/natsuk1.swift
                - path: natsuk1/bridging.h
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Exploit
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -lc++ -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/Headers $(SRCROOT)/natsuk1/Exploit"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          YAML
          echo "wrote project.yml"

      - name: Verify
        run: |
          set -euo pipefail
          cd natsuk1/Helpers

          fail() { echo "FAIL: $1"; exit 1; }

          if grep -q "@MainActor" PairingController.swift; then fail "PairingController still has @MainActor"; fi
          if grep -q "@MainActor" KeepAlive.swift; then fail "KeepAlive still has @MainActor"; fi
          if grep -q "String(cString: host)" NetworkStatus.swift; then fail "NetworkStatus still String(cString:)"; fi
          grep -q "final class RawPtrBox" PairingController.swift || fail "RawPtrBox not declared"
          grep -q "fromOpaque(box.ptr).release()" PairingController.swift || fail "release not patched"

          grep -q "PairingController.pairingFilePath()" AirliftBridge.swift || fail "AirliftBridge not using canonical pairing path"
          grep -q "al_device_respring" AirliftBridge.swift || fail "respring not wired"

          cd ../..
          if grep -rq "@MainActor" natsuk1/ ; then
            grep -rn "@MainActor" natsuk1/ || true
            fail "@MainActor still present"
          fi
          if grep -rq "@preconcurrency" natsuk1/ ; then
            grep -rn "@preconcurrency" natsuk1/ || true
            fail "@preconcurrency still present"
          fi
          if grep -rnE "(^|[^)] )static (let|var) shared(Instance)?\b" natsuk1/ ; then
            grep -rnE "(^|[^)] )static (let|var) shared(Instance)?\b" natsuk1/ || true
            fail "static shared without nonisolated(unsafe)"
          fi

          grep -q '"Run Exploit"' natsuk1/Views/ContentView.swift || fail "ContentView missing Run Exploit"
          grep -q 'Label(state.t("Exploit"' natsuk1/Views/ContentView.swift || fail "ContentView missing Exploit section"
          if grep -q "airplane" natsuk1/Views/ContentView.swift; then
            fail "ContentView still has airplane icon"
          fi
          if grep -q '"Setup"' natsuk1/Views/ContentView.swift; then
            fail "ContentView still shows Setup"
          fi
          grep -q "localDevVPNUp" natsuk1/Views/AirliftView.swift || fail "AirliftView missing localDevVPNUp"
          grep -q "LocalDevVPN is not active" natsuk1/Views/AirliftView.swift || fail "AirliftView missing LocalDevVPN warning"

          if grep -q "SWIFT_DEFAULT_ACTOR_ISOLATION" project.yml ; then
            fail "project.yml still has SWIFT_DEFAULT_ACTOR_ISOLATION"
          fi
          if grep -q "default-isolation" project.yml ; then
            fail "project.yml still has default-isolation flag"
          fi
          grep -q 'SWIFT_VERSION: "5.0"' project.yml || fail "project.yml not in Swift 5 mode"
          grep -q "disable-dynamic-actor-isolation" project.yml || fail "missing disable-dynamic-actor-isolation"

          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app"
            exit 1
          fi
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Minimal UI, LocalDevVPN check, working respring"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/ .github/ project.yml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Minimal UI + LocalDevVPN check + working respring [skip ci]"
          git push
