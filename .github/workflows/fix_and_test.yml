name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Show before
        run: |
          echo "===== PairingController line with altIRKKey ====="
          grep -n "altIRKKey" natsuk1/Helpers/PairingController.swift || true
          echo "===== PairingController class decl ====="
          grep -n "class PairingController" natsuk1/Helpers/PairingController.swift || true
          echo "===== KeepAlive class decl ====="
          grep -n "class KeepAlive" natsuk1/Helpers/KeepAlive.swift || true
          echo "===== NetworkStatus cString ====="
          grep -n "String(cString: host)" natsuk1/Helpers/NetworkStatus.swift || true

      - name: Patch PairingController
        run: |
          set -euo pipefail
          cd natsuk1/Helpers

          perl -i -pe 's/^(\s*)private static let altIRKKey/$1nonisolated private static let altIRKKey/' PairingController.swift
          perl -i -pe 's/^(\s*)static var customPairingFilePath/$1nonisolated(unsafe) static var customPairingFilePath/' PairingController.swift
          perl -i -pe 's/^(\s*)private let pairReadyCallback/$1nonisolated(unsafe) private let pairReadyCallback/' PairingController.swift
          perl -i -pe 's/^(\s*)private let pairPinCallback/$1nonisolated(unsafe) private let pairPinCallback/' PairingController.swift
          perl -i -pe 's/final class PairingController: ObservableObject, @unchecked Sendable/final class PairingController: @unchecked Sendable/' PairingController.swift
          perl -i -pe 's/final class PairingController: ObservableObject/final class PairingController: @unchecked Sendable/' PairingController.swift
          perl -i -ne 'print unless m{^\s*\@MainActor\s*$}' PairingController.swift
          perl -i -pe 's/^@Published\s+//' PairingController.swift

      - name: Patch KeepAlive
        run: |
          set -euo pipefail
          cd natsuk1/Helpers

          perl -i -pe 's/final class KeepAlive: NSObject, ObservableObject, @unchecked Sendable/final class KeepAlive: NSObject, @unchecked Sendable/' KeepAlive.swift
          perl -i -pe 's/final class KeepAlive: NSObject, ObservableObject/final class KeepAlive: NSObject, @unchecked Sendable/' KeepAlive.swift
          perl -i -ne 'print unless m{^\s*\@MainActor\s*$}' KeepAlive.swift
          perl -i -pe 's/^@Published\s+//' KeepAlive.swift

      - name: Patch NetworkStatus
        run: |
          set -euo pipefail
          perl -i -pe 's/return String\(cString: host\)/let bytes = host.prefix { \$0 != 0 }.map { UInt8(bitPattern: \$0) }\n        return String(decoding: bytes, as: UTF8.self)/' natsuk1/Helpers/NetworkStatus.swift

      - name: Show after
        run: |
          echo "===== PairingController line with altIRKKey ====="
          grep -n "altIRKKey" natsuk1/Helpers/PairingController.swift || true
          echo "===== PairingController class decl ====="
          grep -n "class PairingController" natsuk1/Helpers/PairingController.swift || true
          echo "===== KeepAlive class decl ====="
          grep -n "class KeepAlive" natsuk1/Helpers/KeepAlive.swift || true
          echo "===== NetworkStatus cString ====="
          grep -n "String(cString: host)" natsuk1/Helpers/NetworkStatus.swift && echo "NOT FIXED" || echo "fixed"

      - name: Verify
        run: |
          set -euo pipefail
          grep -q "nonisolated private static let altIRKKey" natsuk1/Helpers/PairingController.swift || { echo "FAIL: altIRKKey not patched"; exit 1; }
          grep -q "nonisolated(unsafe) private let pairReadyCallback" natsuk1/Helpers/PairingController.swift || { echo "FAIL: pairReadyCallback not patched"; exit 1; }
          grep -q "nonisolated(unsafe) private let pairPinCallback" natsuk1/Helpers/PairingController.swift || { echo "FAIL: pairPinCallback not patched"; exit 1; }
          if grep -q "final class PairingController.*ObservableObject" natsuk1/Helpers/PairingController.swift; then echo "FAIL: PairingController still ObservableObject"; exit 1; fi
          if grep -q "final class KeepAlive.*ObservableObject" natsuk1/Helpers/KeepAlive.swift; then echo "FAIL: KeepAlive still ObservableObject"; exit 1; fi
          if grep -q "String(cString: host)" natsuk1/Helpers/NetworkStatus.swift; then echo "FAIL: NetworkStatus still String(cString:)"; exit 1; fi
          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Fix MainActor isolation"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Fix MainActor isolation via perl [skip ci]"
          git push
