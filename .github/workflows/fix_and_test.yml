name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Patch sources
        run: |
          cat > /tmp/patch.py <<'PYEOF'
          import re, os, sys

          def read(p):
              return open(p).read() if os.path.exists(p) else None

          def write(p, s):
              open(p, "w").write(s)

          def strip_comments(source):
              out = []
              i = 0
              n = len(source)
              in_string = False
              while i < n:
                  c = source[i]
                  if in_string:
                      out.append(c)
                      if c == '\\' and i + 1 < n:
                          out.append(source[i+1]); i += 2; continue
                      if c == '"':
                          in_string = False
                      i += 1
                      continue
                  if c == '"':
                      in_string = True; out.append(c); i += 1; continue
                  if c == '/' and i + 1 < n and source[i+1] == '/':
                      while i < n and source[i] != '\n': i += 1
                      continue
                  if c == '/' and i + 1 < n and source[i+1] == '*':
                      i += 2
                      while i + 1 < n and not (source[i] == '*' and source[i+1] == '/'): i += 1
                      i += 2; continue
                  out.append(c); i += 1
              return ''.join(out)

          # ---- PairingController ----
          p = "natsuk1/Helpers/PairingController.swift"
          s = read(p)
          if s:
              s = strip_comments(s)
              s = re.sub(r'\n*final\s+class\s+UnmanagedBox\b[^\n]*\n(?:\s[^\n]*\n|\}\n)*', '\n', s)

              s = re.sub(r'^[ \t]*@MainActor[ \t]*\n', '', s, flags=re.M)
              s = re.sub(r'^[ \t]*@MainActor[ \t]+(?=final\s+class)', '', s, flags=re.M)
              s = re.sub(r'^[ \t]*@Published[ \t]+', '', s, flags=re.M)
              s = re.sub(r'\bnonisolated[ \t]+(?!\()', '', s)

              s = re.sub(
                  r'final\s+class\s+PairingController\s*:\s*ObservableObject\s*,?\s*@unchecked\s+Sendable\s*\{',
                  'final class PairingController: @unchecked Sendable {', s)
              s = re.sub(
                  r'final\s+class\s+PairingController\s*:\s*ObservableObject\s*\{',
                  'final class PairingController: @unchecked Sendable {', s)

              s = re.sub(
                  r'^([ \t]*)private\s+static\s+let\s+altIRKKey\b',
                  r'\1nonisolated private static let altIRKKey',
                  s, flags=re.M)
              s = re.sub(
                  r'^([ \t]*)static\s+var\s+customPairingFilePath\b',
                  r'\1nonisolated(unsafe) static var customPairingFilePath',
                  s, flags=re.M)

              s = s.replace(
                  "    let id = String(cString: serviceID)\n    let box = UnmanagedBox(ctx)\n",
                  "    let controller = Unmanaged<PairingController>.fromOpaque(ctx).takeUnretainedValue()\n    let id = String(cString: serviceID)\n")
              s = s.replace(
                  "    DispatchQueue.main.async {\n        let controller = Unmanaged<PairingController>.fromOpaque(box.value).takeUnretainedValue()\n        controller.startAdvertising(serviceID: id, port: Int32(port), txt: txt)\n    }",
                  "    DispatchQueue.main.async {\n        controller.startAdvertising(serviceID: id, port: Int32(port), txt: txt)\n    }")
              s = s.replace(
                  "    let pinString = String(cString: pin)\n    let box = UnmanagedBox(ctx)\n",
                  "    let controller = Unmanaged<PairingController>.fromOpaque(ctx).takeUnretainedValue()\n    let pinString = String(cString: pin)\n")
              s = s.replace(
                  "    DispatchQueue.main.async {\n        let controller = Unmanaged<PairingController>.fromOpaque(box.value).takeUnretainedValue()\n        controller.presentPin(pinString)\n    }",
                  "    DispatchQueue.main.async {\n        controller.presentPin(pinString)\n    }")

              s = re.sub(r'^(private\s+let\s+pairReadyCallback)', r'nonisolated(unsafe) \1', s, flags=re.M)
              s = re.sub(r'^(private\s+let\s+pairPinCallback)', r'nonisolated(unsafe) \1', s, flags=re.M)

              write(p, s)
              print("patched PairingController")

          # ---- KeepAlive ----
          p = "natsuk1/Helpers/KeepAlive.swift"
          s = read(p)
          if s:
              s = re.sub(r'\n*final\s+class\s+UnmanagedBox\b[^\n]*\n(?:\s[^\n]*\n|\}\n)*', '\n', s)
              s = re.sub(r'^[ \t]*@MainActor[ \t]*\n', '', s, flags=re.M)
              s = re.sub(r'^[ \t]*@MainActor[ \t]+(?=final\s+class)', '', s, flags=re.M)
              s = re.sub(r'^[ \t]*@Published[ \t]+', '', s, flags=re.M)
              s = re.sub(
                  r'final\s+class\s+KeepAlive\s*:\s*NSObject\s*,\s*ObservableObject\s*,?\s*@unchecked\s+Sendable\s*\{',
                  'final class KeepAlive: NSObject, @unchecked Sendable {', s)
              s = re.sub(
                  r'final\s+class\s+KeepAlive\s*:\s*NSObject\s*,\s*ObservableObject\s*\{',
                  'final class KeepAlive: NSObject, @unchecked Sendable {', s)
              write(p, s)
              print("patched KeepAlive")

          # ---- NetworkStatus ----
          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = read(p)
          if s:
              s = re.sub(
                  r'return\s+String\(cString:\s*host\)',
                  'let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)',
                  s)
              write(p, s)
              print("patched NetworkStatus")

          # ---- Verify ----
          pc = read("natsuk1/Helpers/PairingController.swift") or ""
          problems = []
          if "ObservableObject" in pc and "PairingController" in pc:
              for m in re.finditer(r'final\s+class\s+PairingController[^\n]*', pc):
                  if "ObservableObject" in m.group(0):
                      problems.append("PairingController still conforms to ObservableObject: " + m.group(0))
          if "@MainActor" in pc:
              problems.append("PairingController still contains @MainActor")
          if re.search(r'private\s+static\s+let\s+altIRKKey(?!.*nonisolated)', pc):
              problems.append("altIRKKey is not nonisolated")

          if problems:
              for x in problems:
                  print("FAIL: " + x)
              sys.exit(1)

          print("verify OK")
          PYEOF
          python3 /tmp/patch.py

          echo "===== PairingController lines 20-45 ====="
          sed -n '20,45p' natsuk1/Helpers/PairingController.swift
          echo "===== PairingController class decl ====="
          grep -n "final class PairingController" natsuk1/Helpers/PairingController.swift || true
          echo "===== KeepAlive class decl ====="
          grep -n "final class KeepAlive" natsuk1/Helpers/KeepAlive.swift || true
          echo "===== NetworkStatus fix check ====="
          grep -n "String(cString: host)" natsuk1/Helpers/NetworkStatus.swift && echo "NOT FIXED" || echo "fixed"

      - name: Install tools
        run: |
          brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Fix MainActor isolation on callbacks + altIRKKey"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Fix Main нужноActor.

 isolation [skip ci]"
         4 git push
