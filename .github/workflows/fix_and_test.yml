name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.5"

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Write CrashLog.swift
        run: |
          cat > natsuk1/Helpers/CrashLog.swift <<'SWIFT'
          import Foundation
          import UIKit

          final class CrashLog: @unchecked Sendable {
              nonisolated(unsafe) static let shared = CrashLog()

              private let queue = DispatchQueue(label: "natsuk1.crashlog")
              private var handle: FileHandle?
              private var currentSize: Int = 0
              private let maxBytes: Int = 1024 * 1024
              private var installed = false
              private let shutdownMarker = "[SHUTDOWN]"

              private var docsDir: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
              }
              private var liveURL: URL { docsDir.appendingPathComponent("natsuk1-live.log") }
              private var crashURL: URL { docsDir.appendingPathComponent("natsuk1-crash.log") }

              private init() {}

              func install() {
                  queue.sync {
                      guard !installed else { return }
                      installed = true
                      _detectPrevCrash()
                      _open()
                      _installHandlers()
                  }
              }

              private func _detectPrevCrash() {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: liveURL.path) else { return }
                  let data = (try? Data(contentsOf: liveURL)) ?? Data()
                  guard !data.isEmpty else { return }
                  let s = String(data: data, encoding: .utf8) ?? ""
                  let tail = s.split(separator: "\n").suffix(3).joined(separator: "\n")
                  if !tail.contains(shutdownMarker) {
                      try? fm.removeItem(at: crashURL)
                      try? fm.copyItem(at: liveURL, to: crashURL)
                  }
              }

              private func _open() {
                  let fm = FileManager.default
                  try? fm.removeItem(at: liveURL)
                  fm.createFile(atPath: liveURL.path, contents: nil)
                  handle = try? FileHandle(forWritingTo: liveURL)
                  currentSize = 0
                  let stamp = ISO8601DateFormatter().string(from: Date())
                  _write("[BOOT] \(stamp)\n")
              }

              private func _installHandlers() {
                  NSSetUncaughtExceptionHandler { ex in
                      let head = "[FATAL] NSException \(ex.name.rawValue): \(ex.reason ?? "")\n"
                      let stk = ex.callStackSymbols.joined(separator: "\n") + "\n"
                      CrashLog.shared._write(head + stk)
                      CrashLog.shared._flush()
                  }
                  for sig in [SIGSEGV, SIGABRT, SIGBUS, SIGILL, SIGTRAP, SIGFPE] {
                      signal(sig, { s in
                          CrashLog.shared._write("[FATAL] signal \(s)\n")
                          CrashLog.shared._flush()
                          signal(s, SIG_DFL)
                          raise(s)
                      })
                  }
              }

              func writeLine(_ s: String) {
                  queue.async { [weak self] in
                      self?._write(s + "\n")
                  }
              }

              func markCleanShutdown() {
                  queue.async { [weak self] in
                      guard let self else { return }
                      if self.handle == nil { return }
                      self._write(self.shutdownMarker + "\n")
                      self._flush()
                  }
              }

              private func _write(_ s: String) {
                  NSLog("%@", s.trimmingCharacters(in: .newlines))
                  guard let h = handle, let d = s.data(using: .utf8) else { return }
                  _ = try? h.write(contentsOf: d)
                  currentSize += d.count
                  if currentSize > maxBytes { _rotate() }
              }

              private func _rotate() {
                  _ = try? handle?.close()
                  handle = nil
                  let fm = FileManager.default
                  try? fm.removeItem(at: liveURL)
                  fm.createFile(atPath: liveURL.path, contents: nil)
                  handle = try? FileHandle(forWritingTo: liveURL)
                  currentSize = 0
                  _write("[ROTATE]\n")
              }

              private func _flush() {
                  try? handle?.synchronize()
              }

              func recoverPreviousSession() -> String? {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: crashURL.path) else { return nil }
                  guard let data = try? Data(contentsOf: crashURL) else { return nil }
                  return String(data: data, encoding: .utf8)
              }

              func clearPreviousCrash() {
                  try? FileManager.default.removeItem(at: crashURL)
              }
          }
          SWIFT

      - name: Write RuntimeView.swift
        run: |
          cat > natsuk1/Views/RuntimeView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct RuntimeView: View {
              @EnvironmentObject var state: AppState

              private var osShort: String {
                  let v = ProcessInfo.processInfo.operatingSystemVersion
                  return "\(v.majorVersion).\(v.minorVersion)"
              }
              private var deviceLine: String {
                  "\(DeviceName.friendly()) · iOS \(osShort)"
              }

              var body: some View {
                  Section {
                      row("Slide", state.slide, hot: state.slide != "—")
                      row("Base",  state.base,  hot: state.base  != "—")
                      HStack {
                          Text("Status")
                          Spacer()
                          StatusDot(status: state.status)
                      }
                      HStack {
                          Text("Device")
                          Spacer()
                          Text(deviceLine)
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(.secondary)
                              .lineLimit(1)
                              .truncationMode(.middle)
                      }
                  } header: {
                      Label("Runtime", systemImage: "waveform.path.ecg")
                  } footer: {
                      if let crash = state.previousCrash, !crash.isEmpty {
                          Button {
                              state.showCrashLog = true
                          } label: {
                              HStack(spacing: 6) {
                                  Image(systemName: "exclamationmark.triangle.fill")
                                      .foregroundStyle(.orange)
                                  Text("Previous session crashed — tap to view")
                                      .font(.footnote)
                                  Spacer()
                                  Image(systemName: "chevron.right")
                                      .font(.caption)
                                      .foregroundStyle(.tertiary)
                              }
                          }
                      }
                  }
              }

              private func row(_ k: String, _ v: String, hot: Bool) -> some View {
                  HStack {
                      Text(k)
                      Spacer()
                      Text(v)
                          .font(.system(size: 13, design: .monospaced))
                          .foregroundStyle(hot ? Color.green : Color.secondary)
                          .lineLimit(1)
                          .truncationMode(.middle)
                  }
              }
          }
          SWIFT

      - name: Write CrashLogView.swift
        run: |
          cat > natsuk1/Views/CrashLogView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct CrashLogView: View {
              @EnvironmentObject var state: AppState
              @Environment(\.dismiss) private var dismiss
              @State private var copied = false

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          Text(state.previousCrash ?? "(empty)")
                              .font(.system(size: 11, design: .monospaced))
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .padding()
                              .textSelection(.enabled)
                      }
                      .navigationTitle("Previous crash")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  UIPasteboard.general.string = state.previousCrash ?? ""
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Image(systemName: copied ? "checkmark" : "doc.on.doc")
                              }
                          }
                      }
                  }
              }
          }
          SWIFT

      - name: Patch natsuk1.swift
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys

          P = "natsuk1/natsuk1.swift"
          with open(P) as f:
              s = f.read()

          if "natsuk1-crashlog-v1" in s:
              print("already patched, skipping")
              sys.exit(0)

          # --- 1. cCallback -> mirror to CrashLog + parse ---
          anchor = 'LockedBuffer.shared.append(String(decoding: bytes, as: UTF8.self))'
          i = s.find(anchor)
          if i < 0:
              print("FAIL step1: cCallback anchor missing")
              sys.exit(1)
          ls = s.rfind('\n', 0, i) + 1
          indent = s[ls:i]
          new_block = (indent + 'let _line = String(decoding: bytes, as: UTF8.self)\n'
                       + indent + 'LockedBuffer.shared.append(_line)\n'
                       + indent + 'CrashLog.shared.writeLine(_line)\n'
                       + indent + 'AppState.shared.parseLogLine(_line) /* natsuk1-crashlog-v1 */')
          s = s[:ls] + new_block + s[i + len(anchor):]
          print("step1 OK (cCallback)")

          # --- 2. AppState fields + parseLogLine ---
          anchor2 = 'final class AppState: ObservableObject, @unchecked Sendable {'
          i2 = s.find(anchor2)
          if i2 < 0:
              print("FAIL step2: AppState marker missing")
              sys.exit(1)
          eol = s.find('\n', i2)
          if eol < 0:
              print("FAIL step2: no EOL after AppState marker")
              sys.exit(1)
          add = '''
              @Published var slide: String = "\\u{2014}"
              @Published var base: String = "\\u{2014}"
              @Published var previousCrash: String? = nil
              @Published var showCrashLog: Bool = false

              func parseLogLine(_ line: String) {
                  if let v = Self.extractHex(line, keys: ["slide=0x", "SLIDE = 0x", "slide = 0x"]) {
                      if self.slide != v {
                          DispatchQueue.main.async { self.slide = v }
                      }
                  }
                  if let v = Self.extractHex(line, keys: ["base=0x", "BASE = 0x", "base = 0x"]) {
                      if self.base != v {
                          DispatchQueue.main.async { self.base = v }
                      }
                  }
              }

              private static func extractHex(_ s: String, keys: [String]) -> String? {
                  for k in keys {
                      if let r = s.range(of: k) {
                          var hex = ""
                          for c in s[r.upperBound...] {
                              if c.isHexDigit { hex.append(c) } else { break }
                          }
                          if !hex.isEmpty { return "0x" + hex }
                      }
                  }
                  return nil
              }'''
          s = s[:eol] + add + s[eol:]
          print("step2 OK (AppState)")

          # --- 3. onAppear: install + recovery before nk_set_log ---
          anchor3 = 'nk_set_log(cCallback)'
          i3 = s.find(anchor3)
          if i3 < 0:
              print("FAIL step3: nk_set_log(cCallback) missing")
              sys.exit(1)
          ls3 = s.rfind('\n', 0, i3) + 1
          ind3 = s[ls3:i3]
          ins3 = (ind3 + 'CrashLog.shared.install()\n'
                  + ind3 + 'if let prev = CrashLog.shared.recoverPreviousSession(), !prev.isEmpty {\n'
                  + ind3 + '    AppState.shared.previousCrash = prev\n'
                  + ind3 + '}\n')
          s = s[:ls3] + ins3 + s[ls3:]
          print("step3 OK (onAppear)")

          # --- 4. scenePhase env in RootView ---
          if 'private var scenePhase' not in s:
              anchor4 = '@AppStorage("keep_alive_location") private var keep_alive_location = false'
              i4 = s.find(anchor4)
              if i4 < 0:
                  print("FAIL step4: keep_alive_location anchor missing")
                  sys.exit(1)
              eol4 = s.find('\n', i4)
              if eol4 < 0:
                  print("FAIL step4: no EOL")
                  sys.exit(1)
              add4 = '\n    @Environment(\\.scenePhase) private var scenePhase'
              s = s[:eol4] + add4 + s[eol4:]
              print("step4 OK (scenePhase env)")
          else:
              print("step4 SKIP (scenePhase already present)")

          # --- 5. insert .sheet + .onChange(scenePhase) before .overlay ---
          anchor5 = '.overlay {'
          i5 = s.find(anchor5)
          if i5 < 0:
              print("FAIL step5: .overlay { missing")
              sys.exit(1)
          ls5 = s.rfind('\n', 0, i5) + 1
          ind5 = s[ls5:i5]
          ins5 = (ind5 + '.sheet(isPresented: $state.showCrashLog) {\n'
                  + ind5 + '    CrashLogView().environmentObject(state)\n'
                  + ind5 + '}\n'
                  + ind5 + '.onChange(of: scenePhase) { _, phase in\n'
                  + ind5 + '    if phase == .background {\n'
                  + ind5 + '        CrashLog.shared.markCleanShutdown()\n'
                  + ind5 + '    }\n'
                  + ind5 + '}\n')
          s = s[:ls5] + ins5 + s[ls5:]
          print("step5 OK (sheet + onChange)")

          # --- sanity ---
          if s.count("natsuk1-crashlog-v1") != 1:
              print("FAIL: marker count = %d" % s.count("natsuk1-crashlog-v1"))
              sys.exit(1)
          for want, label in [
              ("CrashLog.shared.install()", "install call"),
              ("recoverPreviousSession()", "recovery call"),
              ("markCleanShutdown()", "markCleanShutdown call"),
              ("parseLogLine(_line)", "parseLogLine call"),
              ("showCrashLog", "showCrashLog prop"),
          ]:
              if want not in s:
                  print("FAIL: %s missing" % label)
                  sys.exit(1)

          with open(P, "w") as f:
              f.write(s)
          print("natsuk1.swift patched OK")
          PYEOF

      - name: Patch OverviewView.swift
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys

          P = "natsuk1/Views/OverviewView.swift"
          with open(P) as f:
              s = f.read()

          if "natsuk1-crashlog-v1" in s:
              print("already patched, skipping")
              sys.exit(0)

          anchor = 'List {'
          i = s.find(anchor)
          if i < 0:
              print("FAIL: List { missing in OverviewView")
              sys.exit(1)
          ls = s.rfind('\n', 0, i) + 1
          indent = s[ls:i]
          body_indent = indent + '    '
          ins = (indent + 'List {\n'
                 + body_indent + 'RuntimeView() /* natsuk1-crashlog-v1 */\n'
                 + body_indent + '    .environmentObject(state)')
          s = s[:ls] + ins + s[i + len(anchor):]
          if s.count("natsuk1-crashlog-v1") != 1:
              print("FAIL: marker count = %d" % s.count("natsuk1-crashlog-v1"))
              sys.exit(1)
          if "RuntimeView()" not in s:
              print("FAIL: RuntimeView not inserted")
              sys.exit(1)
          with open(P, "w") as f:
              f.write(s)
          print("OverviewView.swift patched OK")
          PYEOF

      - name: Verify
        run: |
          set +e
          fail=0
          check() {
            local name="$1"
            shift
            if "$@"; then
              echo "  OK  $name"
            else
              echo "  FAIL $name"
              fail=1
            fi
          }
          echo "--- file presence ---"
          check "CrashLog.swift" test -f natsuk1/Helpers/CrashLog.swift
          check "RuntimeView.swift" test -f natsuk1/Views/RuntimeView.swift
          check "CrashLogView.swift" test -f natsuk1/Views/CrashLogView.swift

          echo "--- marker counts ---"
          echo "  natsuk1.swift marker: $(grep -c 'natsuk1-crashlog-v1' natsuk1/natsuk1.swift)"
          echo "  OverviewView.swift marker: $(grep -c 'natsuk1-crashlog-v1' natsuk1/Views/OverviewView.swift)"

          echo "--- natsuk1.swift hooks ---"
          check "install()" grep -q 'CrashLog.shared.install()' natsuk1/natsuk1.swift
          check "recoverPreviousSession" grep -q 'recoverPreviousSession' natsuk1/natsuk1.swift
          check "markCleanShutdown" grep -q 'markCleanShutdown' natsuk1/natsuk1.swift
          check "parseLogLine" grep -q 'parseLogLine' natsuk1/natsuk1.swift
          check "scenePhase env" grep -q 'private var scenePhase' natsuk1/natsuk1.swift
          check "sheet CrashLogView" grep -q 'CrashLogView().environmentObject' natsuk1/natsuk1.swift

          echo "--- OverviewView ---"
          check "RuntimeView()" grep -q 'RuntimeView()' natsuk1/Views/OverviewView.swift

          echo "--- CrashLog internals ---"
          check "NSSetUncaughtExceptionHandler" grep -q 'NSSetUncaughtExceptionHandler' natsuk1/Helpers/CrashLog.swift
          check "signal SIGSEGV" grep -q 'SIGSEGV' natsuk1/Helpers/CrashLog.swift
          check "SHUTDOWN marker" grep -q 'SHUTDOWN' natsuk1/Helpers/CrashLog.swift

          if [ "$fail" -ne 0 ]; then
            echo "VERIFY FAILED"
            exit 1
          fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "crash-log + runtime view"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            natsuk1/Helpers/CrashLog.swift \
            natsuk1/Views/RuntimeView.swift \
            natsuk1/Views/CrashLogView.swift \
            natsuk1/natsuk1.swift \
            natsuk1/Views/OverviewView.swift
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "crash-log + runtime view [skip ci]"
          git push
