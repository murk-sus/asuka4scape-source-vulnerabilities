      - name: Write AirliftView.swift
        run: |
          cat > natsuk1/Views/AirliftView.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import Combine

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge
              @State private var loopbackVPNUp: Bool = NetworkStatus.loopbackVPNUp()
              @State private var tunnelIP: String? = NetworkStatus.tunnelIP()
              @State private var deviceIP: String? = NetworkStatus.deviceIP()
              @State private var copied = false

              private let ticker = Timer.publish(every: 5.0, on: .main, in: .common).autoconnect()

              var body: some View {
                  List {
                      networkSection
                      if airlift.hasPairing() {
                          exploitSection
                      } else {
                          pairingSection
                      }
                      logSection
                      logActionsSection
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { refresh() }
                  .onReceive(ticker) { _ in refresh() }
                  .refreshable { refresh() }
              }

              private func refresh() {
                  DispatchQueue.global(qos: .utility).async {
                      let vpn = NetworkStatus.loopbackVPNUp()
                      let tun = NetworkStatus.tunnelIP()
                      let dev = NetworkStatus.deviceIP()
                      DispatchQueue.main.async {
                          if self.loopbackVPNUp != vpn { self.loopbackVPNUp = vpn }
                          if self.tunnelIP != tun { self.tunnelIP = tun }
                          if self.deviceIP != dev { self.deviceIP = dev }
                      }
                  }
              }

              @ViewBuilder
              private var networkSection: some View {
                  Section {
                      if loopbackVPNUp {
                          HStack {
                              Text("Status")
                              Spacer()
                              Text("active")
                                  .font(.system(size: 12, design: .monospaced))
                                  .foregroundStyle(.green)
                          }
                          if let t = tunnelIP {
                              HStack {
                                  Text("Tunnel")
                                  Spacer()
                                  Text(t)
                                      .font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                          if let d = deviceIP {
                              HStack {
                                  Text("Device")
                                  Spacer()
                                  Text(d)
                                      .font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                      } else {
                          HStack {
                              Text("Status")
                              Spacer()
                              Text("not active")
                                  .font(.system(size: 12, design: .monospaced))
                                  .foregroundStyle(.orange)
                          }
                          Text("Start LocalDevVPN with interface 10.7.0.x")
                              .font(.caption)
                              .foregroundStyle(.secondary)
                      }
                  } header: {
                      Label("Network", systemImage: "network")
                  }
              }

              @ViewBuilder
              private var pairingSection: some View {
                  Section {
                      HStack {
                          Text("State")
                          Spacer()
                          Text(pairingStatusText)
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(pairingStatusColor)
                      }
                      if case .pairing = airlift.state {
                          HStack(spacing: 8) {
                              ProgressView().scaleEffect(0.85)
                              Text(airlift.pairingStatus.isEmpty ? "Starting..." : airlift.pairingStatus)
                                  .font(.subheadline).foregroundStyle(.secondary)
                          }
                      }
                      if let pin = airlift.pairPIN {
                          VStack(alignment: .leading, spacing: 8) {
                              Text("ENTER PIN").font(.caption2.bold()).foregroundStyle(.secondary)
                              Text(pin).font(.system(size: 34, weight: .black, design: .monospaced))
                                  .foregroundStyle(.orange)
                              Button {
                                  if let url = URL(string: UIApplication.openSettingsURLString) {
                                      UIApplication.shared.open(url)
                                  }
                              } label: {
                                  Text("Open Settings").frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent).tint(.orange)
                          }
                          .padding(12)
                          .background(Color.orange.opacity(0.12),
                                      in: RoundedRectangle(cornerRadius: 12))
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }

                  Section {
                      if case .pairing = airlift.state {
                          Button(role: .destructive) { airlift.cancelPairing() } label: {
                              Text("Cancel Pairing").frame(maxWidth: .infinity, alignment: .leading)
                          }
                      } else {
                          Button { airlift.runPairing() } label: {
                              Text("Start Pairing").frame(maxWidth: .infinity, alignment: .leading)
                          }
                      }
                  }
              }

              private var pairingStatusText: String {
                  switch airlift.state {
                  case .pairing: return "pairing"
                  case .ready:   return "paired"
                  case .running: return "running"
                  case .done(let ok, _): return ok ? "done" : "failed"
                  default:       return "idle"
                  }
              }

              private var pairingStatusColor: Color {
                  switch airlift.state {
                  case .pairing: return .orange
                  case .ready:   return .green
                  case .running: return .orange
                  case .done(let ok, _): return ok ? .green : .red
                  default:       return .secondary
                  }
              }

              @ViewBuilder
              private var exploitSection: some View {
                  Section {
                      HStack {
                          Text("State")
                          Spacer()
                          Text(pairingStatusText)
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(pairingStatusColor)
                      }
                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target }, set: { airlift.target = $0 }))
                              .font(.system(size: 12, design: .monospaced))
                              .multilineTextAlignment(.trailing)
                              .autocorrectionDisabled()
                              .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }

                  Section {
                      Button { airlift.runExploit() } label: {
                          Text("Run Exploit").frame(maxWidth: .infinity, alignment: .leading)
                      }
                      .disabled(airlift.state == .running || !loopbackVPNUp)

                      Button(role: .destructive) { airlift.cancelExploit() } label: {
                          Text("Cancel Exploit").frame(maxWidth: .infinity, alignment: .leading)
                      }
                      .disabled(airlift.state != .running)

                      Button { respring() } label: {
                          Text("Respring").frame(maxWidth: .infinity, alignment: .leading)
                      }
                  } header: {
                      Label("Exploit", systemImage: "cpu")
                  }

                  Section {
                      Button(role: .destructive) { airlift.deletePairing() } label: {
                          Text("Delete Pairing").frame(maxWidth: .infinity, alignment: .leading)
                      }
                  }
              }

              private func respring() {
                  NotificationCenter.default.post(
                      name: Notification.Name("natsuk1.respring"),
                      object: nil
                  )
              }

              @ViewBuilder
              private var logSection: some View {
                  Section {
                      LogTerminal(text: airlift.exploitLog.isEmpty
                                  ? "No output yet."
                                  : airlift.exploitLog.joined(separator: "\n"))
                  } header: {
                      Label("Log", systemImage: "terminal")
                  }
              }

              @ViewBuilder
              private var logActionsSection: some View {
                  Section {
                      Button {
                          UIPasteboard.general.string = airlift.exploitLog.joined(separator: "\n")
                          copied = true
                          DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                              copied = false
                          }
                      } label: {
                          Text(copied ? "Copied!" : "Copy All")
                              .frame(maxWidth: .infinity, alignment: .leading)
                      }
                      .disabled(airlift.exploitLog.isEmpty)

                      Button(role: .destructive) { airlift.clearLog() } label: {
                          Text("Clear").frame(maxWidth: .infinity, alignment: .leading)
                      }
                      .disabled(airlift.exploitLog.isEmpty)
                  } header: {
                      Label("Log Actions", systemImage: "document.on.document")
                  }
              }
          }
          SWIFT

      - name: Patch natsuk1.swift
        run: |
          python3 - <<'PYEOF'
          import sys
          P = "natsuk1/natsuk1.swift"
          with open(P) as f: s = f.read()
          changed = False
          if "natsuk1-respring-v1" not in s:
              old = '.onChange(of: scenePhase) { _, phase in'
              if old not in s:
                  print("FAIL: scenePhase marker missing"); sys.exit(1)
              add = ('.onReceive(NotificationCenter.default.publisher(for: Notification.Name("natsuk1.respring"))) { _ in\n'
                     '                        state.show_respring = true /* natsuk1-respring-v1 */\n'
                     '                    }\n'
                     '                    .onChange(of: scenePhase) { _, phase in')
              s = s.replace(old, add, 1)
              if "natsuk1-respring-v1" not in s:
                  print("FAIL: respring marker missing"); sys.exit(1)
              changed = True
          if "natsuk1-cancel-v1" not in s:
              old = '    func clear() { LockedBuffer.shared.clear(); log = "" }'
              if old not in s:
                  print("FAIL: clear() marker missing"); sys.exit(1)
              add = (old + '\n'
                     '    func cancel() { /* natsuk1-cancel-v1 */\n'
                     '        nk_necp_cancel()\n'
                     '        append("[*] cancel requested")\n'
                     '    }')
              s = s.replace(old, add, 1)
              if "natsuk1-cancel-v1" not in s:
                  print("FAIL: cancel marker missing"); sys.exit(1)
              changed = True
          if changed:
              with open(P, "w") as f: f.write(s)
              print("natsuk1.swift patched")
          else:
              print("natsuk1.swift already patched")
          PYEOF

      - name: Patch AirliftBridge.swift
        run: |
          python3 - <<'PYEOF'
          import sys
          P = "natsuk1/Helpers/AirliftBridge.swift"
          with open(P) as f: s = f.read()
          if "natsuk1-cancel-v1" in s:
              print("already patched"); sys.exit(0)
          old = '    func respring() {'
          if old not in s:
              print("FAIL: respring() marker missing"); sys.exit(1)
          add = ('    func cancelExploit() { /* natsuk1-cancel-v1 */\n'
                 '        nk_necp_cancel()\n'
                 '        appendLog("[exploit] cancel requested")\n'
                 '        state = .done(ok: false, message: "cancelled")\n'
                 '    }\n\n'
                 '    func respring() {')
          s = s.replace(old, add, 1)
          if "natsuk1-cancel-v1" not in s:
              print("FAIL: cancel marker missing"); sys.exit(1)
          with open(P, "w") as f: f.write(s)
          print("AirliftBridge.swift patched")
          PYEOF

      - name: Verify
        run: |
          F=natsuk1/Exploit/necp.c
          O=natsuk1/Views/OverviewView.swift
          R=natsuk1/Views/RuntimeView.swift
          A=natsuk1/Views/AirliftView.swift
          T=natsuk1/Views/ToolsView.swift
          C=natsuk1/Views/ContentView.swift
          N=natsuk1/natsuk1.swift
          FAIL=0
          chk() {
            if eval "$2" >/dev/null 2>&1; then echo "  OK   $1"; else echo "  FAIL $1"; FAIL=1; fi
          }
          echo "--- necp.c ---"
          chk "marker v23"        "grep -q -e 'natsuk1-df-v23' $F"
          chk "socket spray"      "grep -q -e 'static int spray_sockets' $F"
          chk "local_port fix"    "grep -q -e 'h->msgh_local_port = MACH_PORT_NULL' $F || grep -q -e 'spray_sockets' $F"

          echo "--- OverviewView ---"
          chk "Exploit cpu"       "grep -q -e 'Label(\"Exploit\", systemImage: \"cpu\")' $O"
          chk "Logs terminal"     "grep -q -e 'systemImage: \"terminal\"' $O"
          chk "LogActions doc"    "grep -q -e 'Label(\"Log Actions\", systemImage: \"document.on.document\")' $O"
          chk "no row icons"      "! grep -q -e 'Image(systemName: \"bolt.fill\")' $O"

          echo "--- ContentView ---"
          chk "tab Overview grid" "grep -q -e 'square.grid.2x2' $C"
          chk "tab Tools hammer"  "grep -q -e 'systemImage: \"hammer\"' $C"

          echo "--- ToolsView ---"
          chk "Exploit memorychip" "grep -q -e 'Label(\"Exploit\", systemImage: \"memorychip\")' $T"
          chk "Device gearshape2"  "grep -q -e 'Label(\"Device\", systemImage: \"gearshape.2\")' $T"
          chk "Diag chart"         "grep -q -e 'Label(\"Diagnostics\", systemImage: \"chart.xyaxis.line\")' $T"

          echo "--- AirliftView ---"
          chk "Exploit cpu"        "grep -q -e 'Label(\"Exploit\", systemImage: \"cpu\")' $A"
          chk "LogActions doc"     "grep -q -e 'Label(\"Log Actions\", systemImage: \"document.on.document\")' $A"
          chk "no row icons"       "! grep -q -e 'Image(systemName: \"bolt.fill\")' $A"

          echo "--- RuntimeView ---"
          chk "Runtime ecg"        "grep -q -e 'Label(\"Runtime\", systemImage: \"waveform.path.ecg\")' $R"

          echo "--- natsuk1.swift / AirliftBridge.swift ---"
          chk "respring hook"      "grep -q -e 'natsuk1-respring-v1' $N"
          chk "cancel v1"          "grep -q -e 'natsuk1-cancel-v1' $N"
          chk "cancelExploit fn"   "grep -q -e 'func cancelExploit' natsuk1/Helpers/AirliftBridge.swift"

          echo "--- syntax ---"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
              -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$F" 2>&1; then
              echo "  OK   clang necp.c"
          else
              echo "  FAIL clang necp.c"
              FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then echo "VERIFY FAILED"; exit 1; fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "icons per spec, socket spray, NEXTHINT updated"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            natsuk1/Exploit/nk_api.h \
            natsuk1/Exploit/nk_api.c \
            natsuk1/Exploit/necp.c \
            natsuk1/Views/OverviewView.swift \
            natsuk1/Views/RuntimeView.swift \
            natsuk1/Views/AirliftView.swift \
            natsuk1/Views/ToolsView.swift \
            natsuk1/Views/ContentView.swift \
            natsuk1/natsuk1.swift \
            natsuk1/Helpers/AirliftBridge.swift \
            NEXTHINT.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "icons per spec + socket spray + NEXTHINT [skip ci]"
          git push