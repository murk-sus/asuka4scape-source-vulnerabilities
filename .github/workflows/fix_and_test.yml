name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Show current files
        run: |
          echo "===== PairingController ====="
          cat natsuk1/Helpers/PairingController.swift || echo "missing"
          echo "===== KeepAlive ====="
          cat natsuk1/Helpers/KeepAlive.swift || echo "missing"

      - name: Patch MainActor isolation
        run: |
          cat > /tmp/patch.py <<'PYEOF'
          import re, os

          def patch(path):
              if not os.path.exists(path):
                  print("skip missing: " + path)
                  return
              s = open(path).read()
              orig = s

              s = re.sub(r'^[ \t]*@MainActor[ \t]*\n', '', s, flags=re.M)
              s = re.sub(r'^[ \t]*@Published[ \t]+', '', s, flags=re.M)
              s = re.sub(r'\bnonisolated[ \t]+(?!\()', '', s)

              s = s.replace(
                  'final class PairingController: ObservableObject, @unchecked Sendable {',
                  'final class PairingController: @unchecked Sendable {')
              s = s.replace(
                  'final class PairingController: ObservableObject {',
                  'final class PairingController: @unchecked Sendable {')
              s = s.replace(
                  'final class KeepAlive: NSObject, ObservableObject, @unchecked Sendable {',
                  'final class KeepAlive: NSObject, @unchecked Sendable {')
              s = s.replace(
                  'final class KeepAlive: NSObject, ObservableObject {',
                  'final class KeepAlive: NSObject, @unchecked Sendable {')

              s = s.replace(
                  '    static var customPairingFilePath: String? = nil',
                  '    nonisolated(unsafe) static var customPairingFilePath: String? = nil')

              if 'UnmanagedBox' not in s:
                  s = s + (
                      "\n"
                      "final class UnmanagedBox: @unchecked Sendable {\n"
                      "    let value: UnsafeMutableRawPointer\n"
                      "    init(_ value: UnsafeMutableRawPointer) { self.value = value }\n"
                      "}\n")

              s = s.replace(
                  "    let controller = Unmanaged<PairingController>.fromOpaque(ctx).takeUnretainedValue()\n    let id = String(cString: serviceID)\n",
                  "    let id = String(cString: serviceID)\n    let box = UnmanagedBox(ctx)\n")
              s = s.replace(
                  "    DispatchQueue.main.async {\n        controller.startAdvertising(serviceID: id, port: Int32(port), txt: txt)\n    }",
                  "    DispatchQueue.main.async {\n        let controller = Unmanaged<PairingController>.fromOpaque(box.value).takeUnretainedValue()\n        controller.startAdvertising(serviceID: id, port: Int32(port), txt: txt)\n    }")
              s = s.replace(
                  "    let controller = Unmanaged<PairingController>.fromOpaque(ctx).takeUnretainedValue()\n    let pinString = String(cString: pin)\n",
                  "    let pinString = String(cString: pin)\n    let box = UnmanagedBox(ctx)\n")
              s = s.replace(
                  "    DispatchQueue.main.async {\n        controller.presentPin(pinString)\n    }",
                  "    DispatchQueue.main.async {\n        let controller = Unmanaged<PairingController>.fromOpaque(box.value).takeUnretainedValue()\n        controller.presentPin(pinString)\n    }")

              if s != orig:
                  open(path, "w").write(s)
                  print("patched " + path)
              else:
                  print("no changes: " + path)

          patch("natsuk1/Helpers/PairingController.swift")
          patch("natsuk1/Helpers/KeepAlive.swift")
          PYEOF
          python3 /tmp/patch.py

      - name: Show patched files
        run: |
          echo "===== PairingController after patch ====="
          cat natsuk1/Helpers/PairingController.swift
          echo "===== KeepAlive after patch ====="
          cat natsuk1/Helpers/KeepAlive.swift

      - name: Install tools
        run: |
          brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Fix MainActor crash"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Strip ObservableObject/MainActor from PairingController and KeepAlive [skip ci]"
          git push
