name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"
  CACHE_SALT: v8

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'CEOF'
          #ifndef NK_API_H
          #define NK_API_H

          #include <stdint.h>
          #include <stddef.h>

          void nk_set_log(void (*fn)(const char *));
          void nk_logx(const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);

          int nk_run(void);
          int nk_full_exploit(void);

          #define NK_INFO(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_WARN(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)  nk_logx(tag, __VA_ARGS__)
          #define NK_DEBUG(tag, ...) nk_logx(tag, __VA_ARGS__)

          #endif
          CEOF

      - name: Write nk_api.c
        run: |
          cat > natsuk1/Exploit/nk_api.c <<'CEOF'
          #include "nk_api.h"
          #include "nk_offsets.h"
          #include <stdarg.h>
          #include <stdio.h>
          #include <time.h>

          static void (*g_fn)(const char *) = NULL;
          static double g_t0 = 0.0;

          static double nk_now_ms(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (double)ts.tv_sec * 1000.0 + (double)ts.tv_nsec / 1e6;
          }

          void nk_set_log(void (*fn)(const char *)) {
              g_fn = fn;
              if (g_t0 == 0.0) g_t0 = nk_now_ms();
          }

          void nk_logx(const char *tag, const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              double t = nk_now_ms() - g_t0;
              snprintf(out, sizeof(out), "[%.1f][%s] %s", t, tag, body);
              g_fn(out);
          }

          void nk_log(const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              double t = nk_now_ms() - g_t0;
              snprintf(out, sizeof(out), "[%.1f][MAIN] %s", t, body);
              g_fn(out);
          }

          void nk_rule(void) { nk_log("----"); }

          int nk_run(void) {
              NK_INFO("BASE", "kernel %016llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent %016llX (%d)",
                      (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              NK_INFO("BASE", "mach_trap_table %016llX", (unsigned long long)NK_MACH_TRAP_TABLE);
              nk_rule();

              NK_INFO("PRIM", "copyin %016llX", (unsigned long long)NK_FN_COPYIN);
              NK_INFO("PRIM", "copyout %016llX", (unsigned long long)NK_FN_COPYOUT);
              NK_INFO("PRIM", "kalloc %016llX", (unsigned long long)NK_FN_KALLOC_EXT);
              NK_INFO("PRIM", "kfree %016llX", (unsigned long long)NK_FN_KFREE_EXT);
              nk_rule();

              NK_INFO("STRC", "proc_pid %X", NK_OFF_PROC_PID);
              NK_INFO("STRC", "proc_ucred %X", NK_OFF_PROC_UCRED);
              NK_INFO("STRC", "task_thread %X", NK_OFF_TASK_THREAD);
              nk_rule();

              NK_WARN("STAT", "No kernel R/W primitive.");
              NK_WARN("STAT", "Reference data only.");
              nk_rule();

              return 0;
          }

          int nk_full_exploit(void) { return nk_run(); }
          CEOF

      - name: Write nk_offsets.h
        run: |
          cat > natsuk1/Exploit/nk_offsets.h <<'CEOF'
          #ifndef NK_OFFSETS_H
          #define NK_OFFSETS_H

          #define NK_KERNEL_BASE            0xFFFFFFF007004000ULL
          #define NK_SYSENT_BASE            0xFFFFFFF007C192A0ULL
          #define NK_SYSENT_COUNT           558
          #define NK_MACH_TRAP_TABLE        0xFFFFFFF007BE8018ULL

          #define NK_FN_COPYIN              0xFFFFFFF00A7B9570ULL
          #define NK_FN_COPYOUT             0xFFFFFFF00A2C6C28ULL
          #define NK_FN_KALLOC_EXT          0xFFFFFFF00A200DCCULL
          #define NK_FN_KFREE_EXT           0xFFFFFFF00A201000ULL

          #define NK_OFF_PROC_PID           0x74
          #define NK_OFF_PROC_UCRED         0xB8
          #define NK_OFF_TASK_THREAD        0x50

          #endif
          CEOF

      - name: Write Respring
        run: |
          cat > natsuk1/Helpers/Respring.swift <<'SWIFTEOF'
          import UIKit
          import Foundation
          import WebKit
          import SwiftUI

          struct RespringView: UIViewRepresentable {
              private static let html = """
              <!DOCTYPE html>
              <html>
                  <body>
                      <iframe id="frame" srcdoc="" sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-scripts"></iframe>
                      <script>
                          const frame = document.getElementById('frame');
                          const funfun = `
                              <html>
                              <body>
                                  <script>
                                      const container = document.createElement('div');
                                      container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                                      document.body.appendChild(container);

                                      for (let i = 0; i < 500; i++) {
                                          let d = document.createElement('div');
                                          d.style.cssText = 'position: absolute; width: 100vw; height: 100vh; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); transform: translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg);';
                                          container.appendChild(d);
                                      }

                                      setInterval(() => {
                                          navigator.share({ title: 'R', text: 'R'.repeat(100000) }).catch(() => {});
                                          let x = new Uint8Array(1024 * 1024 * 10);
                                          crypto.getRandomValues(x);
                                      }, 0);
                                  <\\/script>
                              </body>
                              </html>
                          `;

                          frame.srcdoc = funfun;
                      </script>
                  </body>
              </html>
              """

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  return WKWebView(frame: .zero, configuration: config)
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  webView.loadHTMLString(Self.html, baseURL: nil)
              }
          }
          SWIFTEOF

      - name: Write DeviceName
        run: |
          cat > natsuk1/Helpers/DeviceName.swift <<'SWIFTEOF'
          import Foundation
          import UIKit

          enum DeviceName {

              private struct Device {
                  let id: String
                  let name: String
                  let chip: String
              }

              private static let devices: [Device] = [
                  Device(id: "iPhone11,2", name: "iPhone XS",           chip: "A12 Bionic"),
                  Device(id: "iPhone11,4", name: "iPhone XS Max",       chip: "A12 Bionic"),
                  Device(id: "iPhone11,6", name: "iPhone XS Max",       chip: "A12 Bionic"),
                  Device(id: "iPhone11,8", name: "iPhone XR",           chip: "A12 Bionic"),
                  Device(id: "iPhone12,1", name: "iPhone 11",           chip: "A13 Bionic"),
                  Device(id: "iPhone12,3", name: "iPhone 11 Pro",       chip: "A13 Bionic"),
                  Device(id: "iPhone12,5", name: "iPhone 11 Pro Max",   chip: "A13 Bionic"),
                  Device(id: "iPhone12,8", name: "iPhone SE (2nd gen)", chip: "A13 Bionic"),
                  Device(id: "iPhone13,1", name: "iPhone 12 mini",      chip: "A14 Bionic"),
                  Device(id: "iPhone13,2", name: "iPhone 12",           chip: "A14 Bionic"),
                  Device(id: "iPhone13,3", name: "iPhone 12 Pro",       chip: "A14 Bionic"),
                  Device(id: "iPhone13,4", name: "iPhone 12 Pro Max",   chip: "A14 Bionic"),
                  Device(id: "iPhone14,2", name: "iPhone 13 Pro",       chip: "A15 Bionic"),
                  Device(id: "iPhone14,3", name: "iPhone 13 Pro Max",   chip: "A15 Bionic"),
                  Device(id: "iPhone14,4", name: "iPhone 13 mini",      chip: "A15 Bionic"),
                  Device(id: "iPhone14,5", name: "iPhone 13",           chip: "A15 Bionic"),
                  Device(id: "iPhone14,6", name: "iPhone SE (3rd gen)", chip: "A15 Bionic"),
                  Device(id: "iPhone14,7", name: "iPhone 14",           chip: "A15 Bionic"),
                  Device(id: "iPhone14,8", name: "iPhone 14 Plus",      chip: "A15 Bionic"),
                  Device(id: "iPhone15,2", name: "iPhone 14 Pro",       chip: "A16 Bionic"),
                  Device(id: "iPhone15,3", name: "iPhone 14 Pro Max",   chip: "A16 Bionic"),
                  Device(id: "iPhone15,4", name: "iPhone 15",           chip: "A16 Bionic"),
                  Device(id: "iPhone15,5", name: "iPhone 15 Plus",      chip: "A16 Bionic"),
                  Device(id: "iPhone16,1", name: "iPhone 15 Pro",       chip: "A17 Pro"),
                  Device(id: "iPhone16,2", name: "iPhone 15 Pro Max",   chip: "A17 Pro"),
                  Device(id: "iPhone17,1", name: "iPhone 16 Pro",       chip: "A18 Pro"),
                  Device(id: "iPhone17,2", name: "iPhone 16 Pro Max",   chip: "A18 Pro"),
                  Device(id: "iPhone17,3", name: "iPhone 16",           chip: "A18"),
                  Device(id: "iPhone17,4", name: "iPhone 16 Plus",      chip: "A18"),
                  Device(id: "iPhone17,5", name: "iPhone 16e",          chip: "A18"),
                  Device(id: "iPhone18,1", name: "iPhone 17 Pro",       chip: "A19 Pro"),
                  Device(id: "iPhone18,2", name: "iPhone 17 Pro Max",   chip: "A19 Pro"),
                  Device(id: "iPhone18,3", name: "iPhone 17",           chip: "A19"),
                  Device(id: "iPhone18,4", name: "iPhone Air",          chip: "A19 Pro"),
                  Device(id: "iPhone18,5", name: "iPhone 17e",          chip: "A19"),
              ]

              private static let byID: [String: Device] = Dictionary(
                  uniqueKeysWithValues: devices.map { ($0.id, $0) }
              )

              static func friendly() -> String {
                  let id = machineID()
                  return byID[id]?.name ?? id
              }

              static func chip() -> String {
                  byID[machineID()]?.chip ?? "unknown"
              }

              static func full() -> String {
                  let v = ProcessInfo.processInfo.operatingSystemVersion
                  return "\(friendly()) · iOS \(v.majorVersion).\(v.minorVersion)"
              }

              static func machineID() -> String {
                  var info = utsname()
                  uname(&info)
                  return Mirror(reflecting: info.machine).children.reduce("") { id, el in
                      guard let v = el.value as? Int8, v != 0 else { return id }
                      return id + String(UnicodeScalar(UInt8(v)))
                  }
              }
          }
          SWIFTEOF

      - name: Write ContentView
        run: |
          cat > natsuk1/Views/ContentView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false
              @State private var copied: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "bolt.fill")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Actions", "Действия"), systemImage: "play.circle")
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                              }
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Text(copied
                                       ? state.t("Copied!", "Скопировано!")
                                       : state.t("Copy All", "Копировать всё"))
                              }

                              Button(role: .destructive) {
                                  state.clear()
                              } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label(state.t("Log Actions", "Действия с логом"), systemImage: "doc.on.doc")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                              .font(.system(size: 9, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .onChange(of: state.log) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          SWIFTEOF

      - name: Write SettingsView
        run: |
          cat > natsuk1/Views/SettingsView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct SettingsView: View {
              @Environment(\.dismiss) private var dismiss
              @EnvironmentObject var state: AppState
              @EnvironmentObject var offsets: OffsetsStore

              @AppStorage("auto_run")   private var auto_run: Bool = false
              @AppStorage("verbose")    private var verbose: Bool = true
              @AppStorage("keep_alive_audio")    private var keep_alive_audio: Bool = false
              @AppStorage("keep_alive_location") private var keep_alive_location: Bool = false

              private var appName: String {
                  Bundle.main.infoDictionary?["CFBundleDisplayName"] as? String
                      ?? Bundle.main.infoDictionary?["CFBundleName"] as? String
                      ?? "natsuk1"
              }

              private var version: String {
                  Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
              }

              private var appIcon: UIImage? {
                  if let icons = Bundle.main.infoDictionary?["CFBundleIcons"] as? [String: Any],
                     let primary = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = primary["CFBundleIconFiles"] as? [String],
                     let last = files.last {
                      return UIImage(named: last)
                  }
                  return UIImage(named: "AppIcon")
              }

              private var activeVersionLabel: String {
                  guard let v = OffsetsStore.activeVersion else { return "unknown" }
                  return "\(v.device) / iOS \(v.ios) (\(v.build))"
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              HStack(spacing: 14) {
                                  Group {
                                      if let icon = appIcon {
                                          Image(uiImage: icon)
                                              .resizable()
                                              .aspectRatio(contentMode: .fill)
                                      } else {
                                          ZStack {
                                              LinearGradient(
                                                  colors: [
                                                      Color(red: 0.65, green: 0.30, blue: 0.90),
                                                      Color(red: 0.30, green: 0.65, blue: 0.95)
                                                  ],
                                                  startPoint: .topLeading,
                                                  endPoint: .bottomTrailing
                                              )
                                              Image(systemName: "bolt.fill")
                                                  .font(.system(size: 26, weight: .semibold))
                                                  .foregroundStyle(.white)
                                          }
                                      }
                                  }
                                  .frame(width: 56, height: 56)
                                  .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))

                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(appName)
                                          .font(.title3)
                                          .fontWeight(.semibold)
                                      Text("Version \(version)")
                                          .font(.subheadline)
                                          .foregroundColor(.secondary)
                                  }
                                  Spacer(minLength: 8)
                              }
                              .padding(.vertical, 4)

                              NavigationLink {
                                  AboutView().environmentObject(state)
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "info.circle")
                                          .frame(width: 22, alignment: .center)
                                      Text("Credits")
                                      Spacer(minLength: 8)
                                  }
                              }
                          } header: {
                              Label("About", systemImage: "info.circle")
                          }

                          Section {
                              HStack(spacing: 12) {
                                  Image(systemName: "cpu")
                                      .frame(width: 22, alignment: .center)
                                      .foregroundStyle(.secondary)
                                  Text("Offsets")
                                      .foregroundStyle(.secondary)
                                  Spacer(minLength: 8)
                                  Text(activeVersionLabel)
                                      .font(.system(size: 12, design: .monospaced))
                                      .foregroundColor(.secondary)
                                      .lineLimit(1)
                                      .truncationMode(.middle)
                              }
                              .padding(.vertical, 2)

                              NavigationLink {
                                  OffsetsView().environmentObject(offsets)
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "list.number")
                                          .frame(width: 22, alignment: .center)
                                      Text("Modify Offsets")
                                      Spacer(minLength: 8)
                                      Text("\(offsets.filledCount())/\(offsets.totalCount())")
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label("Exploit", systemImage: "cpu")
                          }

                          Section {
                              Toggle(isOn: $keep_alive_audio) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Silent Audio")
                                      Text("Plays inaudible audio so iOS keeps the app running.")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                              }

                              Toggle(isOn: $keep_alive_location) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Background Location")
                                      Text("Uses low-accuracy location to stay alive when an activity needs it.")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label("Background Keep-Alive", systemImage: "waveform.circle")
                          }

                          Section {
                              Toggle("Auto Run on Launch", isOn: $auto_run)
                              Toggle("Verbose Output", isOn: $verbose)
                          } header: {
                              Label("Options", systemImage: "gearshape")
                          }

                          Section {
                              Button {
                                  state.respring()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "arrow.clockwise")
                                          .frame(width: 22, alignment: .center)
                                      Text("Respring")
                                      Spacer(minLength: 8)
                                  }
                              }
                          } header: {
                              Label("Tools", systemImage: "wrench.and.screwdriver")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { dismiss() }
                                  .fontWeight(.semibold)
                          }
                      }
                  }
              }
          }
          SWIFTEOF

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install xcodegen ldid
          brew link --overwrite xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            build/SDKStatCaches.noindex
          key: dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-${{ hashFiles('natsuk1/**/*.swift', 'natsuk1/**/*.c', 'natsuk1/**/*.h', 'project.yml') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build
        id: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package app for handoff
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          APP_DIR="$(dirname "$APP_PATH")"
          APP_NAME="$(basename "$APP_PATH")"

          COPYFILE_DISABLE=1 tar -czf natsuk1-app.tar.gz -C "$APP_DIR" "$APP_NAME"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app tarball
        uses: actions/upload-artifact@v6
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Commit fixes if any
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Cleanup: remove dead code, fix Device color, inline settings title, blur nav [skip ci]"
          git push
