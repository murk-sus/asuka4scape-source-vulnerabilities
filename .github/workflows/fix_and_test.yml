      - name: Verify
        run: |
          F=natsuk1/Exploit/necp.c
          H=natsuk1/Exploit/nk_api.h
          C=natsuk1/Exploit/nk_api.c
          O=natsuk1/Views/OverviewView.swift
          A=natsuk1/Views/AirliftView.swift
          N=natsuk1/natsuk1.swift
          B=natsuk1/Helpers/AirliftBridge.swift
          FAIL=0
          chk() {
            if eval "$2" >/dev/null 2>&1; then echo "  OK   $1"; else echo "  FAIL $1"; FAIL=1; fi
          }

          echo "--- necp.c ---"
          chk "NCF_ASN 0x20"      "grep -q -e 'NCF_ASN 0x20' $F"
          chk "marker v18"        "grep -q -e 'natsuk1-kread-v18' $F"
          chk "nk_necp_cancel"    "grep -q -e 'void nk_necp_cancel(void)' $F"
          chk "g_cancel var"      "grep -q -e 'g_cancel' $F"
          chk "cancel in impl"    "grep -q -e 'if (g_cancel)' $F"

          echo "--- nk_api.h ---"
          chk "cancel decl"       "grep -q -e 'void nk_necp_cancel(void)' $H"

          echo "--- nk_api.c ---"
          chk "v8-api marker"     "grep -q -e 'natsuk1-v8-api' $C"
          chk "full_exploit"      "grep -q -e 'int nk_full_exploit(void)' $C"

          echo "--- OverviewView ---"
          chk "cancel button"     "grep -q -e 'Cancel Exploit' $O"
          chk "cancel call"       "grep -q -e 'state.cancel()' $O"
          chk "Copied! feedback"  "grep -q -e 'Copied!' $O"

          echo "--- AirliftView ---"
          chk "import Combine"    "grep -q -e '^import Combine' $A"
          chk "ticker"            "grep -q -e 'Timer.publish' $A"
          chk "async refresh"     "grep -q -e 'DispatchQueue.global' $A"
          chk "cancelExploit"     "grep -q -e 'airlift.cancelExploit()' $A"
          chk "Cancel Exploit"    "grep -q -e 'Cancel Exploit' $A"
          chk "Copied!"           "grep -q -e 'Copied!' $A"
          chk "Copy All"          "grep -q -e 'Copy All' $A"

          echo "--- natsuk1.swift ---"
          chk "respring hook"     "grep -q -e 'natsuk1-respring-v1' $N"
          chk "cancel v1"         "grep -q -e 'natsuk1-cancel-v1' $N"
          chk "nk_necp_cancel"    "grep -q -e 'nk_necp_cancel()' $N"

          echo "--- AirliftBridge.swift ---"
          chk "cancel v1 marker"  "grep -q -e 'natsuk1-cancel-v1' $B"
          chk "cancelExploit fn"  "grep -q -e 'func cancelExploit' $B"

          echo "--- C syntax ---"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
              -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$F" 2>&1; then
              echo "  OK   clang necp.c"
          else
              echo "  FAIL clang necp.c"
              FAIL=1
          fi
          if clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
              -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$C" 2>&1; then
              echo "  OK   clang nk_api.c"
          else
              echo "  FAIL clang nk_api.c"
              FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then echo "VERIFY FAILED"; exit 1; fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "cancel exploit + copy feedback + workflow optimization"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            natsuk1/Exploit/nk_api.h \
            natsuk1/Exploit/nk_api.c \
            natsuk1/Exploit/necp.c \
            natsuk1/Views/OverviewView.swift \
            natsuk1/Views/AirliftView.swift \
            natsuk1/natsuk1.swift \
            natsuk1/Helpers/AirliftBridge.swift \
            README.md \
            .gitignore
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "cancel exploit + copy feedback + workflow optimization [skip ci]"
          git push