            fail "OverviewView still references Airlift"
          fi
          if grep -q 'show_device' natsuk1/Views/OverviewView.swift; then
            fail "OverviewView still has device sheet"
          fi
          grep -q 'DeviceName.full()' natsuk1/Views/OverviewView.swift || fail "OverviewView missing DeviceName footer"

          grep -q 'Path Access' natsuk1/Views/ToolsView.swift || fail "ToolsView missing Path Access"
          grep -q 'AirliftView' natsuk1/Views/ToolsView.swift || fail "ToolsView missing Airlift"
          grep -q 'MobileGestaltView' natsuk1/Views/ToolsView.swift || fail "ToolsView missing MobileGestalt"
          grep -q 'OffsetsView' natsuk1/Views/ToolsView.swift || fail "ToolsView missing Offsets"
          grep -q 'respring' natsuk1/Views/ToolsView.swift || fail "ToolsView missing respring"
