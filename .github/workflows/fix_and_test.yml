name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Cleanup
        run: |
          rm -f NEXTHINT.txt
          rm -f GHIDRA_HINTS.txt
          rm -f *.txt
          rm -f natsuk1-app.tar.gz
          rm -rf Payload
          echo "cleanup done"

      - name: Write SettingsView.swift
        run: |
          cat > natsuk1/Views/SettingsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct SettingsView: View {
              @EnvironmentObject var state: AppState
              @AppStorage("auto_run") private var auto_run: Bool = false
              @AppStorage("verbose") private var verbose: Bool = true
              @AppStorage("keep_alive_audio") private var keep_alive_audio: Bool = false
              @AppStorage("keep_alive_location") private var keep_alive_location: Bool = false

              private var appName: String {
                  Bundle.main.infoDictionary?["CFBundleDisplayName"] as? String
                      ?? Bundle.main.infoDictionary?["CFBundleName"] as? String ?? "natsuk1"
              }
              private var version: String {
                  Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
              }
              private var appIcon: UIImage? {
                  if let icons = Bundle.main.infoDictionary?["CFBundleIcons"] as? [String: Any],
                     let primary = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = primary["CFBundleIconFiles"] as? [String],
                     let last = files.last { return UIImage(named: last) }
                  return UIImage(named: "AppIcon")
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              HStack(spacing: 14) {
                                  Group {
                                      if let icon = appIcon {
                                          Image(uiImage: icon).resizable().aspectRatio(contentMode: .fill)
                                      } else {
                                          ZStack {
                                              LinearGradient(colors: [Color.accentColor, Color.accentColor.opacity(0.6)],
                                                             startPoint: .topLeading, endPoint: .bottomTrailing)
                                              Image(systemName: "bolt.fill").font(.system(size: 26, weight: .semibold)).foregroundStyle(.white)
                                          }
                                      }
                                  }
                                  .frame(width: 56, height: 56)
                                  .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(appName).font(.title3).fontWeight(.semibold)
                                      Text("Version \(version)").font(.subheadline).foregroundStyle(.secondary)
                                  }
                              }
                              NavigationLink { AboutView().environmentObject(state) } label: { Text("About") }
                          } header: {
                              Label("App", systemImage: "exclamationmark.circle")
                          }

                          Section {
                              Toggle(isOn: $keep_alive_audio) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Silent Audio")
                                      Text("Keeps the app running in the background.").font(.caption).foregroundStyle(.secondary)
                                  }
                              }
                              Toggle(isOn: $keep_alive_location) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Background Location")
                                      Text("Low-accuracy location keeps the app alive.").font(.caption).foregroundStyle(.secondary)
                                  }
                              }
                          } header: {
                              Label("Background Keep-Alive", systemImage: "moon.stars")
                          }

                          Section {
                              Toggle("Auto Run on Launch", isOn: $auto_run)
                              Toggle("Verbose Output", isOn: $verbose)
                          } header: {
                              Label("Options", systemImage: "slider.horizontal.3")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.large)
                  }
              }
          }
          SWIFT

      - name: Update necp.c NOTE
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys
          P = "natsuk1/Exploit/necp.c"
          with open(P) as f:
              s = f.read()
          if "natsuk1-realcopy-v26" in s:
              print("already patched")
              sys.exit(0)

          s = s.replace("natsuk1-realcopy-v25", "natsuk1-realcopy-v26")

          old_block = (
              '    LI("NOTE", "copy_result real addr = 0xFFFFFFF00A4EC264");\n'
              '    LI("NOTE", "0xFFFFFFF00A4EAC7C = necp_client_copy_interface (wrong)");\n'
              '    LI("NOTE", "necp_client_flow = kalloc_type (own zone)");\n'
              '    LI("NOTE", "generic sprays cannot reclaim it");\n'
          )
          new_block = (
              '    LI("NOTE", "necp_client_copy_result: not yet located");\n'
              '    LI("NOTE", "0xA4EC264 = necp_client_copy_update");\n'
              '    LI("NOTE", "0xA4EAC7C = necp_client_copy_interface");\n'
              '    LI("NOTE", "necp_client_flow = kalloc_type (own zone)");\n'
              '    LI("NOTE", "spray from userspace cannot reach this zone");\n'
          )
          if old_block not in s:
              lines = s.split("\n")
              out = []
              for l in lines:
                  if 'LI("NOTE"' in l:
                      continue
                  out.append(l)
              s = "\n".join(out)
              s = s.replace('              LI("INIT", "NCF_ASN',
                            '\n'.join(new_block) + '              LI("INIT", "NCF_ASN', 1)
          else:
              s = s.replace(old_block, new_block)

          if "natsuk1-realcopy-v26" not in s:
              print("FAIL: marker not updated")
              sys.exit(1)
          with open(P, "w") as f:
              f.write(s)
          print("necp.c NOTE updated")
          PYEOF

      - name: Verify
        run: |
          set +e
          FAIL=0
          S=natsuk1/Views/SettingsView.swift
          F=natsuk1/Exploit/necp.c
          chk() {
            if eval "$2" >/dev/null 2>&1; then echo "  OK   $1"; else echo "  FAIL $1"; FAIL=1; fi
          }

          echo "--- SettingsView ---"
          chk "App exclamationmark.circle" "grep -q -e 'Label(\"App\", systemImage: \"exclamationmark.circle\")' $S"
          chk "KeepAlive moon.stars"        "grep -q -e 'Label(\"Background Keep-Alive\", systemImage: \"moon.stars\")' $S"
          chk "Options slider"              "grep -q -e 'Label(\"Options\", systemImage: \"slider.horizontal.3\")' $S"

          echo "--- necp.c ---"
          chk "marker v26"                  "grep -q -e 'natsuk1-realcopy-v26' $F"
          chk "copy_update note"            "grep -q -e 'necp_client_copy_update' $F"
          chk "copy_interface note"         "grep -q -e 'necp_client_copy_interface' $F"
          chk "kalloc_type note"            "grep -q -e 'kalloc_type' $F"

          echo "--- no NEXTHINT ---"
          chk "no NEXTHINT.txt"             "! test -f NEXTHINT.txt"

          echo "--- syntax ---"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
              -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$F" 2>&1; then
            echo "  OK   clang necp.c"
          else
            echo "  FAIL clang necp.c"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then echo "VERIFY FAILED"; exit 1; fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi

          REPO="${{ github.repository }}"
          IPA_URL="https://github.com/${REPO}/releases/download/development/natsuk1.ipa"
          ALTSTORE_URL="altstore://install?url=${IPA_URL}"
          SCARLET_URL="scarlet://install?url=${IPA_URL}"
          ESign_URL="esign://install?url=${IPA_URL}"

          NOTES="$(cat <<EOF
          ### natsuk1 — iOS 27.0 (24A437)

          **IPA direct link** (для Sideloadly / ESign / Scarlet / AltStore / TrollStore)

          \`\`\`
          ${IPA_URL}
          \`\`\`

          **AltStore deep link**

          \`\`\`
          ${ALTSTORE_URL}
          \`\`\`

          **Scarlet deep link**

          \`\`\`
          ${SCARLET_URL}
          \`\`\`

          **ESign deep link**

          \`\`\`
          ${ESign_URL}
          \`\`\`

          Recent commits:
          $(git log -5 --pretty=format:'- %h %s')
          EOF
          )"

          gh release create development natsuk1.ipa \
            --target "${{ github.sha }}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "$NOTES"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Settings icons + cleanup + sideload links [skip ci]"
          git push