name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Write offsets JSON
        run: |
          mkdir -p natsuk1/Offsets
          cat > natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json <<'JSON'
          {
            "groups": [
              {
                "title": "Kernel",
                "items": [
                  "off_kernel_base",
                  "off_mach_trap_table"
                ]
              },
              {
                "title": "Globals",
                "items": [
                  "off_g_allproc",
                  "off_g_kernproc",
                  "off_g_kernel_task",
                  "off_g_task_list",
                  "off_g_kernel_map",
                  "off_g_zone_map"
                ]
              },
              {
                "title": "proc / task / thread",
                "items": [
                  "off_proc_p_pid",
                  "off_proc_ro_p_ucred",
                  "off_task_map",
                  "off_task_bsd_info",
                  "off_task_itk_space",
                  "off_thread_task_threads_next"
                ]
              },
              {
                "title": "NECP",
                "items": [
                  "off_necp_open",
                  "off_necp_client_add_flow",
                  "off_necp_client_remove_flow"
                ]
              },
              {
                "title": "Primitives",
                "items": [
                  "off_fn_copyin",
                  "off_fn_copyout",
                  "off_fn_kalloc_ext",
                  "off_fn_kfree_ext"
                ]
              }
            ],
            "defaults": {
              "off_kernel_base": "0xFFFFFFF007004000",
              "off_mach_trap_table": "0xFFFFFFF007BE8018",
              "off_g_allproc": "0xFFFFFFF007BBF048",
              "off_g_kernproc": "0xFFFFFFF007BBF040",
              "off_g_kernel_task": "0xFFFFFFF00700DC70",
              "off_g_task_list": "0xFFFFFFF0080D93F0",
              "off_g_kernel_map": "0xFFFFFFF007BBE228",
              "off_g_zone_map": "0xFFFFFFF00AD6A800",
              "off_proc_p_pid": "0x74",
              "off_proc_ro_p_ucred": "0xB8",
              "off_task_map": "0x28",
              "off_task_bsd_info": "0x3A0",
              "off_task_itk_space": "0x320",
              "off_thread_task_threads_next": "0x50",
              "off_necp_open": "0xFFFFFFF00A4E411C",
              "off_necp_client_add_flow": "0xFFFFFFF00A4E843C",
              "off_necp_client_remove_flow": "0xFFFFFFF00A4E93C4",
              "off_fn_copyin": "0xFFFFFFF00A7B9570",
              "off_fn_copyout": "0xFFFFFFF00A2C6C28",
              "off_fn_kalloc_ext": "0xFFFFFFF00A200DCC",
              "off_fn_kfree_ext": "0xFFFFFFF00A201000"
            }
          }
          JSON

      - name: Write offsets index
        run: |
          cat > natsuk1/Offsets/index.json <<'JSON'
          {
            "versions": [
              {
                "file": "iPhone14,5_iOS27.0_24A437.json",
                "device": "iPhone14,5",
                "deviceName": "iPhone 13",
                "chip": "A15 Bionic",
                "ios": "27.0",
                "build": "24A437",
                "verified": false
              }
            ]
          }
          JSON

      - name: Verify
        run: |
          set -euo pipefail
          grep -q 'off_necp_open' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: no necp_open"; exit 1; }
          grep -q '0xFFFFFFF00A4E411C' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: necp_open offset"; exit 1; }
          grep -q '0xFFFFFFF00A4E843C' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: add_flow offset"; exit 1; }
          grep -q '0xFFFFFFF00A4E93C4' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: remove_flow offset"; exit 1; }
          grep -q 'off_proc_ro_p_ucred' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: proc_ro_p_ucred"; exit 1; }
          grep -q '0xFFFFFFF007BBF048' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: allproc"; exit 1; }
          grep -q '0xFFFFFFF0080D93F0' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: task_list"; exit 1; }
          grep -q '0xFFFFFFF00AD6A800' natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json || { echo "FAIL: zone_map"; exit 1; }
          python3 -c "import json; json.load(open('natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json')); json.load(open('natsuk1/Offsets/index.json'))"
          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false --notes "Offsets refresh"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Offsets/ .github/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Offsets refresh [skip ci]"
          git push
