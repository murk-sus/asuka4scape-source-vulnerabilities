name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"
  CACHE_SALT: v10

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Fetch AirliftFFI from AirCard-iOS
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard

          mkdir -p natsuk1/External
          rm -rf natsuk1/External/AirliftFFI.xcframework
          cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/

          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/

          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/

          echo "---- AirliftFFI xcframework ----"
          find natsuk1/External/AirliftFFI.xcframework -type f | sort

      - name: Patch PairingController
        run: |
          python3 <<'PYEOF'
          import re
          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()
          s = s.replace('private let hostName = "AirCard-iOS"', 'private let hostName = "natsuk1"')
          s = s.replace('"Settings › Privacy & Security › Developer Mode › Pair with AirCard-iOS"',
                        '"Settings › Privacy & Security › Developer Mode › Pair with natsuk1"')
          s = s.replace('"Settings › Privacy & Security › Developer Mode"',
                        '"Settings › Privacy & Security › Developer Mode"')
          s = s.replace('Settings › AirCard-iOS › Local Network', 'Settings › natsuk1 › Local Network')
          open(p, "w").write(s)
          PYEOF

      - name: Write AirliftBridge.swift
        run: |
          cat > natsuk1/Helpers/AirliftBridge.swift <<'SWIFTEOF'
          import Foundation
          import AirliftFFI

          @MainActor
          final class AirliftBridge: ObservableObject {
              static let shared = AirliftBridge()

              enum State: Equatable {
                  case idle
                  case pairing
                  case ready(pairingPath: String)
                  case running
                  case done(ok: Bool, message: String)
              }

              @Published private(set) var state: State = .idle
              @Published private(set) var pairPIN: String? = nil
              @Published private(set) var pairingStatus: String = ""
              @Published private(set) var exploitLog: [String] = []
              @Published var target: String = "/var/mobile/Library/SpringBoard"

              private var loggedLines: [String] = []

              private init() {
                  al_log_init({ _, msg in
                      guard let msg = msg else { return }
                      let line = String(cString: msg)
                      DispatchQueue.main.async {
                          AirliftBridge.shared.appendLog(line)
                      }
                  }, nil)
              }

              nonisolated private func appendLog(_ s: String) {
                  DispatchQueue.main.async {
                      self.loggedLines.append(s)
                      if self.loggedLines.count > 500 {
                          self.loggedLines.removeFirst(self.loggedLines.count - 400)
                      }
                      self.exploitLog = self.loggedLines
                  }
              }

              func clearLog() {
                  loggedLines.removeAll()
                  exploitLog = []
              }

              func pairingFilePath() -> String {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  return docs.appendingPathComponent("natsuk1_pairing.plist").path
              }

              func hasPairing() -> Bool {
                  let p = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: p) else { return false }
                  let size = (try? FileManager.default.attributesOfItem(atPath: p)[.size] as? Int) ?? 0
                  return size > 0
              }

              func runPairing() {
                  guard !hasPairing() else {
                      state = .ready(pairingPath: pairingFilePath())
                      return
                  }

                  state = .pairing
                  pairingStatus = "Starting host…"
                  pairPIN = nil

                  let ctrl = PairingController.shared
                  Task {
                      do {
                          let path = try await ctrl.startAndWait()
                          self.state = .ready(pairingPath: path)
                          self.pairingStatus = "Paired ✅"
                          self.pairPIN = nil
                      } catch is CancellationError {
                          self.state = .idle
                          self.pairingStatus = "Cancelled"
                      } catch {
                          self.state = .idle
                          self.pairingStatus = "Failed: \(error.localizedDescription)"
                      }
                  }
                  Task {
                      while case .pairing = self.state {
                          try? await Task.sleep(nanoseconds: 200_000_000)
                          self.pairingStatus = ctrl.pairingStatus
                          self.pairPIN = ctrl.pairingPIN
                      }
                  }
              }

              func cancelPairing() {
                  PairingController.shared.softCancel()
                  state = .idle
                  pairingStatus = ""
                  pairPIN = nil
              }

              func deletePairing() {
                  try? FileManager.default.removeItem(atPath: pairingFilePath())
                  PairingController.customPairingFilePath = nil
                  state = .idle
                  pairingStatus = ""
              }

              func runExploit() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      state = .done(ok: false, message: "No pairing file")
                      return
                  }

                  state = .running
                  loggedLines.removeAll()
                  exploitLog = []
                  let targetDir = target

                  Task.detached {
                      var outJson: UnsafeMutablePointer<CChar>? = nil
                      var outError: UnsafeMutablePointer<CChar>? = nil

                      let rc: Int32 = pairingPath.withCString { pc in
                          targetDir.withCString { tc in
                              al_exploit_run(pc, tc, nil, nil, &outJson, &outError)
                          }
                      }

                      let jsonStr = outJson.flatMap { p -> String? in
                          let s = String(cString: p); al_string_free(p); return s
                      }
                      let errStr = outError.flatMap { p -> String? in
                          let s = String(cString: p); al_string_free(p); return s
                      }

                      await MainActor.run {
                          if rc == 0 {
                              let msg = jsonStr ?? "Canary write confirmed"
                              self.state = .done(ok: true, message: msg)
                          } else {
                              let msg = errStr ?? "rc=\(rc)"
                              self.state = .done(ok: false, message: msg)
                          }
                      }
                  }
              }

              func respring() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else { return }
                  Task.detached {
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      _ = pairingPath.withCString { pc in
                          al_device_respring(pc, nil, nil, &outError)
                      }
                      if let p = outError { al_string_free(p) }
                  }
              }

              func findContainer(bundleID: String) async -> String? {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else { return nil }

                  return await withCheckedContinuation { cont in
                      DispatchQueue.global(qos: .userInitiated).async {
                          var outContainer: UnsafeMutablePointer<CChar>? = nil
                          var outError: UnsafeMutablePointer<CChar>? = nil

                          let rc: Int32 = pairingPath.withCString { pc in
                              bundleID.withCString { bc in
                                  al_find_app_container(pc, bc, nil, nil, &outContainer, &outError)
                              }
                          }

                          let containerStr = outContainer.flatMap { p -> String? in
                              let s = String(cString: p); al_string_free(p); return s
                          }
                          if let p = outError { al_string_free(p) }

                          if rc == 0, let c = containerStr {
                              cont.resume(returning: c)
                          } else {
                              cont.resume(returning: nil)
                          }
                      }
                  }
              }
          }
          SWIFTEOF

      - name: Write AirliftView.swift
        run: |
          cat > natsuk1/Views/AirliftView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge

              var body: some View {
                  List {
                      switch airlift.state {
                      case .idle, .pairing:
                          pairingSection
                      case .ready, .running, .done:
                          exploitSection
                      }

                      if !airlift.exploitLog.isEmpty {
                          Section {
                              AirliftLogView(lines: airlift.exploitLog, onClear: { airlift.clearLog() })
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label("Log", systemImage: "apple.terminal")
                          }
                      }
                  }
                  .listStyle(.insetGrouped)
                  .scrollContentBackground(.hidden)
                  .background(Color(UIColor.systemGroupedBackground))
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
              }

              @ViewBuilder
              private var pairingSection: some View {
                  Section {
                      VStack(alignment: .leading, spacing: 6) {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.shield.fill")
                                  .foregroundStyle(airlift.hasPairing() ? .green : .orange)
                              Text(airlift.hasPairing() ? "Paired" : "Not paired")
                                  .font(.subheadline.bold())
                          }
                          Text("Advertises natsuk1 as a local pairing host. Approve in Settings → Privacy & Security → Developer Mode → Pair with natsuk1.")
                              .font(.caption)
                              .foregroundColor(.secondary)
                      }
                      .padding(.vertical, 4)

                      if case .pairing = airlift.state {
                          HStack(spacing: 8) {
                              ProgressView().scaleEffect(0.85)
                              Text(airlift.pairingStatus.isEmpty ? "Starting…" : airlift.pairingStatus)
                                  .font(.subheadline)
                                  .foregroundColor(.secondary)
                          }
                      }

                      if let pin = airlift.pairPIN {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("ENTER THIS PIN")
                                  .font(.caption2.bold())
                                  .foregroundStyle(.secondary)
                              Text(pin)
                                  .font(.system(size: 36, weight: .black, design: .monospaced))
                                  .foregroundStyle(.orange)
                              Button {
                                  if let url = URL(string: UIApplication.openSettingsURLString) {
                                      UIApplication.shared.open(url)
                                  }
                              } label: {
                                  Label("Open Settings", systemImage: "arrow.up.forward.app")
                                      .frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent)
                              .tint(.orange)
                          }
                          .padding(12)
                          .background(Color.orange.opacity(0.12))
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                      }
                  } header: {
                      Label("Pairing", systemImage: "antenna.radiowaves.left.and.right")
                  }

                  Section {
                      if case .pairing = airlift.state {
                          Button(role: .destructive) {
                              airlift.cancelPairing()
                          } label: {
                              Text("Cancel Pairing")
                                  .frame(maxWidth: .infinity)
                          }
                      } else if airlift.hasPairing() {
                          Button(role: .destructive) {
                              airlift.deletePairing()
                          } label: {
                              Text("Delete Pairing")
                                  .frame(maxWidth: .infinity)
                          }
                      } else {
                          Button {
                              airlift.runPairing()
                          } label: {
                              HStack {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                  Text("Start Pairing")
                                  Spacer()
                              }
                          }
                      }
                  }
              }

              @ViewBuilder
              private var exploitSection: some View {
                  Section {
                      HStack {
                          Text("Status")
                          Spacer()
                          switch airlift.state {
                          case .ready:
                              Text("Ready").foregroundColor(.green).font(.subheadline.bold())
                          case .running:
                              HStack(spacing: 6) {
                                  ProgressView().scaleEffect(0.7)
                                  Text("Running").foregroundColor(.orange)
                              }
                          case .done(let ok, _):
                              Text(ok ? "Success" : "Failed")
                                  .foregroundColor(ok ? .green : .red)
                                  .font(.subheadline.bold())
                          default:
                              EmptyView()
                          }
                      }

                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target },
                              set: { airlift.target = $0 }
                          ))
                          .font(.system(size: 12, design: .monospaced))
                          .multilineTextAlignment(.trailing)
                          .autocorrectionDisabled()
                          .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Exploit", systemImage: "bolt.shield")
                  }

                  Section {
                      Button {
                          airlift.runExploit()
                      } label: {
                          HStack {
                              Image(systemName: "bolt.fill")
                              Text("Run Airlift")
                              Spacer()
                          }
                      }
                      .disabled(airlift.state == .running)

                      Button {
                          airlift.respring()
                      } label: {
                          HStack {
                              Image(systemName: "arrow.clockwise")
                              Text("Respring (device)")
                              Spacer()
                          }
                      }
                      .disabled(airlift.state == .running)
                  }
              }
          }

          struct AirliftLogView: View {
              let lines: [String]
              let onClear: () -> Void
              @State private var copied = false

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(lines.isEmpty ? "No output yet." : lines.joined(separator: "\n"))
                              .font(.system(size: 9, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(lines.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .frame(maxHeight: 260)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
                      .onChange(of: lines.count) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
                  .contextMenu {
                      Button {
                          UIPasteboard.general.string = lines.joined(separator: "\n")
                      } label: {
                          Label("Copy All", systemImage: "doc.on.doc")
                      }
                      Button(role: .destructive) {
                          onClear()
                      } label: {
                          Label("Clear", systemImage: "trash")
                      }
                  }
              }
          }
          SWIFTEOF

      - name: Write ContentView
        run: |
          cat > natsuk1/Views/ContentView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState
              @EnvironmentObject var airlift: AirliftBridge

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              NavigationLink {
                                  AirliftView().environmentObject(airlift)
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "airplane")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Airlift", "Airlift"))
                                      Spacer(minLength: 8)
                                      Text(airlift.hasPairing() ? "Ready" : "Setup")
                                          .font(.system(size: 12, design: .monospaced))
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label(state.t("Sandbox Escape", "Побег из песочницы"), systemImage: "bolt.shield")
                          } footer: {
                              Text(state.t("On-device AirTraffic sandbox escape. Requires Developer Mode pairing.",
                                           "On-device побег из песочницы через AirTraffic. Требует Developer Mode pairing."))
                          }

                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "bolt.fill")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Run Offsets", "Показать оффсеты"))
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Kernel Offsets", "Оффсеты ядра"), systemImage: "cpu")
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                              }
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }

                          Section {
                              Button {
                                  state.clear()
                              } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label(state.t("Log Actions", "Действия с логом"), systemImage: "doc.on.doc")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                              .font(.system(size: 10, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .onChange(of: state.log) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          SWIFTEOF

      - name: Patch natsuk1.swift
        run: |
          python3 <<'PYEOF'
          import re
          p = "natsuk1/natsuk1.swift"
          s = open(p).read()

          # add AirliftBridge state object
          if "AirliftBridge.shared" not in s:
              s = s.replace(
                  '    @StateObject private var offsets = OffsetsStore.shared\n',
                  '    @StateObject private var offsets = OffsetsStore.shared\n    @StateObject private var airlift = AirliftBridge.shared\n'
              )
              s = s.replace(
                  '                              .environmentObject(offsets)\n',
                  '                              .environmentObject(offsets)\n                              .environmentObject(airlift)\n'
              )

          open(p, "w").write(s)
          PYEOF

      - name: Patch bridging.h
        run: |
          python3 <<'PYEOF'
          p = "natsuk1/bridging.h"
          s = open(p).read()
          if "AirliftFFI" not in s:
              s = s.replace(
                  '#include "Exploit/nk_api.h"',
                  '#include "Exploit/nk_api.h"\n#import <AirliftFFI/airlift.h>'
              )
              s = s.replace(
                  '#endif',
                  '#import "Exploit/GrappaHelper.h"\n\n#endif'
              )
          open(p, "w").write(s)
          PYEOF

      - name: Patch Info.plist
        run: |
          python3 <<'PYEOF'
          import re
          p = "natsuk1/Resources/Info.plist"
          s = open(p).read()

          if "NSBonjourServices" not in s:
              insert = (
                  "    <key>NSBonjourServices</key>\n"
                  "    <array>\n"
                  "        <string>_remotepairing-pairable-host._tcp</string>\n"
                  "    </array>\n"
                  "    <key>NSLocalNetworkUsageDescription</key>\n"
                  "    <string>natsuk1 advertises a local pairing service so this device can pair with itself.</string>\n"
              )
              s = s.replace("</dict>\n</plist>", insert + "</dict>\n</plist>")

          if "UIBackgroundModes" in s:
              # ensure audio is present (needed for pairing keep-alive)
              pass
          else:
              insert = (
                  "    <key>UIBackgroundModes</key>\n"
                  "    <array>\n"
                  "        <string>audio</string>\n"
                  "    </array>\n"
              )
              s = s.replace("</dict>\n</plist>", insert + "</dict>\n</plist>")

          open(p, "w").write(s)
          PYEOF

      - name: Patch project.yml
        run: |
          python3 <<'PYEOF'
          import re
          p = "project.yml"
          s = open(p).read()

          # add xcframework as dependency
          if "AirliftFFI.xcframework" not in s:
              if "    dependencies:" in s:
                  s = s.replace(
                      "    dependencies:\n",
                      "    dependencies:\n      - framework: natsuk1/External/AirliftFFI.xcframework\n        embed: false\n",
                      1
                  )

          # add libc++ linking + C++ standard
          if "-lc++" not in s:
              s = re.sub(
                  r'^(\s*OTHER_LDFLAGS:\s*)(.*)$',
                  r'\1\2 -lc++',
                  s, flags=re.M
              )

          # add Exploit sources
          if "- path: natsuk1/External\n" not in s:
              marker = "      - path: natsuk1/Exploit\n"
              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "      - path: natsuk1/External\n        excludes:\n          - \"**/*.xcframework/**\"\n"
                  )

          open(p, "w").write(s)
          print("---- project.yml ----")
          print(s)
          PYEOF

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install xcodegen ldid
          brew link --overwrite xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            build/SDKStatCaches.noindex
          key: dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-${{ hashFiles('natsuk1/**/*.swift', 'natsuk1/**/*.c', 'natsuk1/**/*.h', 'project.yml') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build
        id: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package app for handoff
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          APP_DIR="$(dirname "$APP_PATH")"
          APP_NAME="$(basename "$APP_PATH")"
          COPYFILE_DISABLE=1 tar -czf natsuk1-app.tar.gz -C "$APP_DIR" "$APP_NAME"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app tarball
        uses: actions/upload-artifact@v6
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Commit fixes if any
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate AirliftFFI: on-device AirTraffic sandbox escape [skip ci]"
          git push
