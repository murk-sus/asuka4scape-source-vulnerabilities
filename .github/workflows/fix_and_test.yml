name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Fetch fresh sources
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/Helpers natsuk1/Exploit natsuk1/External
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/
          if [ ! -d natsuk1/External/AirliftFFI.xcframework ]; then
            cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/
          fi

      - name: Write patcher
        run: |
          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re, os

          def clean(s):
              s = re.sub(r"nonisolated\(unsafe\)\s+", "", s)
              s = re.sub(r"\bnonisolated\s+(?![\(])", "", s)
              return s

          # --- PairingController ---
          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()

          s = s.replace("import AirliftFFI\n", "")
          s = re.sub(r"@MainActor\s*\n", "", s)
          s = re.sub(r"@Published\s+", "", s)

          s = s.replace(
              "final class PairingController: ObservableObject, @unchecked Sendable {",
              "final class PairingController: @unchecked Sendable {")
          s = s.replace(
              "final class PairingController: ObservableObject {",
              "final class PairingController: @unchecked Sendable {")

          s = clean(s)

          s = s.replace(
              "static var customPairingFilePath: String? = nil",
              "nonisolated(unsafe) static var customPairingFilePath: String? = nil")

          s = s.replace(
              "private let pairReadyCallback: ALPairReadyCb",
              "nonisolated(unsafe) private let pairReadyCallback: ALPairReadyCb")
          s = s.replace(
              "private let pairPinCallback: ALPairPinCb",
              "nonisolated(unsafe) private let pairPinCallback: ALPairPinCb")

          s = s.replace("AirCard-iOS", "natsuk1")

          s = s.replace(
              "Unmanaged<PairingController>.fromOpaque(ctx).release()",
              "Unmanaged<PairingController>.fromOpaque(box.ptr).release()")

          if "final class RawPtrBox" not in s:
              s = s + (
                  "\n"
                  "final class RawPtrBox: @unchecked Sendable {\n"
                  "    let ptr: UnsafeMutableRawPointer\n"
                  "    init(_ ptr: UnsafeMutableRawPointer) { self.ptr = ptr }\n"
                  "}\n")

          s = s.replace(
              "            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()",
              "            let box = RawPtrBox(ctx)\n            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()")

          open(p, "w").write(s)
          print("patched PairingController")

          # --- NetworkStatus ---
          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()
          s = s.replace(
              "return String(cString: host)",
              "let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)")
          open(p, "w").write(s)
          print("patched NetworkStatus")

          # --- KeepAlive ---
          p = "natsuk1/Helpers/KeepAlive.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = re.sub(r"@MainActor\s*\n", "", s)
              s = re.sub(r"@Published\s+", "", s)
              s = s.replace(
                  "final class KeepAlive: NSObject, ObservableObject, @unchecked Sendable {",
                  "final class KeepAlive: NSObject, @unchecked Sendable {")
              s = s.replace(
                  "final class KeepAlive: NSObject, ObservableObject {",
                  "final class KeepAlive: NSObject, @unchecked Sendable {")
              s = clean(s)
              open(p, "w").write(s)
              print("patched KeepAlive")
          ENDSCRIPT

      - name: Apply patch
        run: python3 /tmp/patch.py

      - name: Verify
        run: |
          set -euo pipefail
          cd natsuk1/Helpers

          fail() { echo "FAIL: $1"; exit 1; }

          echo "===== altIRKKey ====="
          grep -n "altIRKKey" PairingController.swift || true
          echo "===== callbacks ====="
          grep -n "pairReadyCallback\|pairPinCallback" PairingController.swift || true
          echo "===== class decl ====="
          grep -n "class PairingController" PairingController.swift || true
          echo "===== shared ====="
          grep -n "static let shared" KeepAlive.swift || true
          echo "===== cString ====="
          grep -n "String(cString: host)" NetworkStatus.swift || true
          echo "===== RawPtrBox ====="
          grep -n "RawPtrBox" PairingController.swift || true

          if grep -q "final class PairingController.*ObservableObject" PairingController.swift; then fail "PairingController still ObservableObject"; fi
          if grep -q "final class KeepAlive.*ObservableObject" KeepAlive.swift; then fail "KeepAlive still ObservableObject"; fi
          if grep -q "String(cString: host)" NetworkStatus.swift; then fail "NetworkStatus still String(cString:)"; fi
          if grep -q "nonisolated(unsafe) nonisolated(unsafe)" PairingController.swift; then fail "duplicate in PairingController"; fi
          if grep -q "nonisolated(unsafe) nonisolated(unsafe)" KeepAlive.swift; then fail "duplicate in KeepAlive"; fi
          grep -q "final class RawPtrBox" PairingController.swift || fail "RawPtrBox not declared"
          grep -q "fromOpaque(box.ptr).release()" PairingController.swift || fail "release not patched"

          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Swift 6.2 sendable fix"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/ .github/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "RawPtrBox for ctx, drop redundant nonisolated(unsafe) [skip ci]"
          git push
