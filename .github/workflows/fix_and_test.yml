name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"
  CACHE_SALT: v9

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'CEOF'
          #ifndef NK_API_H
          #define NK_API_H

          #include <stdint.h>
          #include <stddef.h>

          void nk_set_log(void (*fn)(const char *));
          void nk_logx(const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);

          int nk_run(void);
          int nk_full_exploit(void);

          #define NK_INFO(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_WARN(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)  nk_logx(tag, __VA_ARGS__)

          #endif
          CEOF

      - name: Write nk_api.c
        run: |
          cat > natsuk1/Exploit/nk_api.c <<'CEOF'
          #include "nk_api.h"
          #include "nk_offsets.h"
          #include <stdarg.h>
          #include <stdio.h>

          static void (*g_fn)(const char *) = NULL;

          void nk_set_log(void (*fn)(const char *)) {
              g_fn = fn;
          }

          void nk_logx(const char *tag, const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "[%s] %s", tag, body);
              g_fn(out);
          }

          void nk_log(const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "[MAIN] %s", body);
              g_fn(out);
          }

          void nk_rule(void) { nk_log("----"); }

          int nk_run(void) {
              NK_INFO("BASE", "kernel %llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent %llX (%d)",
                      (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              NK_INFO("BASE", "mach_trap %llX", (unsigned long long)NK_MACH_TRAP_TABLE);
              nk_rule();

              NK_INFO("PRIM", "copyin %llX", (unsigned long long)NK_FN_COPYIN);
              NK_INFO("PRIM", "copyout %llX", (unsigned long long)NK_FN_COPYOUT);
              NK_INFO("PRIM", "kalloc %llX", (unsigned long long)NK_FN_KALLOC_EXT);
              NK_INFO("PRIM", "kfree %llX", (unsigned long long)NK_FN_KFREE_EXT);
              nk_rule();

              NK_INFO("STRC", "proc_pid %X", NK_OFF_PROC_PID);
              NK_INFO("STRC", "proc_ucred %X", NK_OFF_PROC_UCRED);
              NK_INFO("STRC", "task_thread %X", NK_OFF_TASK_THREAD);
              nk_rule();

              NK_WARN("STAT", "No kernel R/W primitive.");
              NK_WARN("STAT", "Reference data only.");
              nk_rule();

              return 0;
          }

          int nk_full_exploit(void) { return nk_run(); }
          CEOF

      - name: Write ContentView
        run: |
          cat > natsuk1/Views/ContentView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false
              @State private var copied: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "bolt.fill")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Actions", "Действия"), systemImage: "play.circle")
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                              }
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Text(copied
                                       ? state.t("Copied!", "Скопировано!")
                                       : state.t("Copy All", "Копировать всё"))
                              }

                              Button(role: .destructive) {
                                  state.clear()
                              } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label(state.t("Log Actions", "Действия с логом"), systemImage: "doc.on.doc")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(.horizontal, showsIndicators: false) {
                          ScrollView(.vertical, showsIndicators: false) {
                              Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                                  .font(.system(size: 9, design: .monospaced))
                                  .multilineTextAlignment(.leading)
                                  .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                                  .fixedSize(horizontal: true, vertical: false)
                                  .frame(maxWidth: .infinity, alignment: .leading)

                              Spacer(minLength: 0)
                                  .id(0)
                          }
                      }
                      .onChange(of: state.log) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          SWIFTEOF

      - name: Write SettingsView
        run: |
          cat > natsuk1/Views/SettingsView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct SettingsView: View {
              @Environment(\.dismiss) private var dismiss
              @EnvironmentObject var state: AppState
              @EnvironmentObject var offsets: OffsetsStore

              @AppStorage("auto_run")   private var auto_run: Bool = false
              @AppStorage("verbose")    private var verbose: Bool = true
              @AppStorage("keep_alive_audio")    private var keep_alive_audio: Bool = false
              @AppStorage("keep_alive_location") private var keep_alive_location: Bool = false

              private var appName: String {
                  Bundle.main.infoDictionary?["CFBundleDisplayName"] as? String
                      ?? Bundle.main.infoDictionary?["CFBundleName"] as? String
                      ?? "natsuk1"
              }

              private var version: String {
                  Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
              }

              private var appIcon: UIImage? {
                  if let icons = Bundle.main.infoDictionary?["CFBundleIcons"] as? [String: Any],
                     let primary = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = primary["CFBundleIconFiles"] as? [String],
                     let last = files.last {
                      return UIImage(named: last)
                  }
                  return UIImage(named: "AppIcon")
              }

              private var activeVersionLabel: String {
                  guard let v = OffsetsStore.activeVersion else { return "unknown" }
                  return "\(v.device) / iOS \(v.ios) (\(v.build))"
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              HStack(spacing: 14) {
                                  Group {
                                      if let icon = appIcon {
                                          Image(uiImage: icon)
                                              .resizable()
                                              .aspectRatio(contentMode: .fill)
                                      } else {
                                          ZStack {
                                              LinearGradient(
                                                  colors: [
                                                      Color(red: 0.65, green: 0.30, blue: 0.90),
                                                      Color(red: 0.30, green: 0.65, blue: 0.95)
                                                  ],
                                                  startPoint: .topLeading,
                                                  endPoint: .bottomTrailing
                                              )
                                              Image(systemName: "bolt.fill")
                                                  .font(.system(size: 26, weight: .semibold))
                                                  .foregroundStyle(.white)
                                          }
                                      }
                                  }
                                  .frame(width: 56, height: 56)
                                  .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))

                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(appName)
                                          .font(.title3)
                                          .fontWeight(.semibold)
                                      Text("Version \(version)")
                                          .font(.subheadline)
                                          .foregroundColor(.secondary)
                                  }
                                  Spacer(minLength: 8)
                              }
                              .padding(.vertical, 4)

                              NavigationLink {
                                  AboutView().environmentObject(state)
                              } label: {
                                  HStack(spacing: 12) {
                                      Text("Credits")
                                      Spacer(minLength: 8)
                                  }
                              }
                          } header: {
                              Label("About", systemImage: "info.circle")
                          }

                          Section {
                              HStack(spacing: 12) {
                                  Image(systemName: "cpu")
                                      .frame(width: 22, alignment: .center)
                                      .foregroundStyle(.secondary)
                                  Text("Offsets")
                                      .foregroundStyle(.secondary)
                                  Spacer(minLength: 8)
                                  Text(activeVersionLabel)
                                      .font(.system(size: 12, design: .monospaced))
                                      .foregroundColor(.secondary)
                                      .lineLimit(1)
                                      .truncationMode(.middle)
                              }
                              .padding(.vertical, 2)

                              NavigationLink {
                                  OffsetsView().environmentObject(offsets)
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "list.number")
                                          .frame(width: 22, alignment: .center)
                                      Text("Modify Offsets")
                                      Spacer(minLength: 8)
                                      Text("\(offsets.filledCount())/\(offsets.totalCount())")
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label("Exploit", systemImage: "cpu")
                          }

                          Section {
                              Toggle(isOn: $keep_alive_audio) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Silent Audio")
                                      Text("Plays inaudible audio so iOS keeps the app running.")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                              }

                              Toggle(isOn: $keep_alive_location) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Background Location")
                                      Text("Uses low-accuracy location to stay alive when an activity needs it.")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label("Background Keep-Alive", systemImage: "waveform.circle")
                          }

                          Section {
                              Toggle("Auto Run on Launch", isOn: $auto_run)
                              Toggle("Verbose Output", isOn: $verbose)
                          } header: {
                              Label("Options", systemImage: "gearshape")
                          }

                          Section {
                              Button {
                                  state.respring()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "arrow.clockwise")
                                          .frame(width: 22, alignment: .center)
                                      Text("Respring")
                                      Spacer(minLength: 8)
                                  }
                              }
                          } header: {
                              Label("Tools", systemImage: "wrench.and.screwdriver")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { dismiss() }
                                  .fontWeight(.semibold)
                          }
                      }
                  }
              }
          }
          SWIFTEOF

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install xcodegen ldid
          brew link --overwrite xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            build/SDKStatCaches.noindex
          key: dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-${{ hashFiles('natsuk1/**/*.swift', 'natsuk1/**/*.c', 'natsuk1/**/*.h', 'project.yml') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build
        id: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package app for handoff
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          APP_DIR="$(dirname "$APP_PATH")"
          APP_NAME="$(basename "$APP_PATH")"

          COPYFILE_DISABLE=1 tar -czf natsuk1-app.tar.gz -C "$APP_DIR" "$APP_NAME"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app tarball
        uses: actions/upload-artifact@v6
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Commit fixes if any
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean logs, no Credits icon, horizontal scroll fallback [skip ci]"
          git push
