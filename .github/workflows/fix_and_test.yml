name: 2 · Crash Log + Runtime

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crashlog-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.5"

jobs:
  patch:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Write CrashLog.swift
        run: |
          cat > natsuk1/Helpers/CrashLog.swift <<'SWIFT'
          import Foundation
          import UIKit

          /// Persistent crash-safe logger.
          ///  - Writes every line to Documents/natsuk1-live.log (survives crash)
          ///  - Installs NSException + BSD signal handlers
          ///  - On next launch recoverPreviousSession() returns the previous session
          ///    text if the last line was not [SHUTDOWN]
          final class CrashLog: @unchecked Sendable {
              nonisolated(unsafe) static let shared = CrashLog()

              private let queue = DispatchQueue(label: "natsuk1.crashlog")
              private var handle: FileHandle?
              private var currentSize: Int = 0
              private let maxBytes: Int = 1024 * 1024
              private var installed = false
              private let shutdownMarker = "[SHUTDOWN]"

              private var docsDir: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
              }
              private var liveURL: URL { docsDir.appendingPathComponent("natsuk1-live.log") }
              private var crashURL: URL { docsDir.appendingPathComponent("natsuk1-crash.log") }

              private init() {}

              func install() {
                  queue.sync {
                      guard !installed else { return }
                      installed = true
                      _detectPrevCrash()
                      _open()
                      _installHandlers()
                  }
              }

              private func _detectPrevCrash() {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: liveURL.path) else { return }
                  let data = (try? Data(contentsOf: liveURL)) ?? Data()
                  guard !data.isEmpty else { return }
                  let s = String(data: data, encoding: .utf8) ?? ""
                  let tail = s.split(separator: "\n").suffix(3).joined(separator: "\n")
                  if !tail.contains(shutdownMarker) {
                      try? fm.removeItem(at: crashURL)
                      try? fm.copyItem(at: liveURL, to: crashURL)
                  }
              }

              private func _open() {
                  let fm = FileManager.default
                  try? fm.removeItem(at: liveURL)
                  fm.createFile(atPath: liveURL.path, contents: nil)
                  handle = try? FileHandle(forWritingTo: liveURL)
                  currentSize = 0
                  let stamp = ISO8601DateFormatter().string(from: Date())
                  _write("[BOOT] \(stamp)\n")
              }

              private func _installHandlers() {
                  NSSetUncaughtExceptionHandler { ex in
                      let head = "[FATAL] NSException \(ex.name.rawValue): \(ex.reason ?? "")\n"
                      let stk = ex.callStackSymbols.joined(separator: "\n") + "\n"
                      CrashLog.shared._write(head + stk)
                      CrashLog.shared._flush()
                  }
                  for sig in [SIGSEGV, SIGABRT, SIGBUS, SIGILL, SIGTRAP, SIGFPE] {
                      signal(sig, { s in
                          CrashLog.shared._write("[FATAL] signal \(s)\n")
                          CrashLog.shared._flush()
                          signal(s, SIG_DFL)
                          raise(s)
                      })
                  }
              }

              func writeLine(_ s: String) {
                  queue.async { [weak self] in
                      self?._write(s + "\n")
                  }
              }

              /// Mark the current session as cleanly finished.
              /// Called when scenePhase goes to .background so that
              /// next launch will NOT be treated as a crash.
              func markCleanShutdown() {
                  queue.async { [weak self] in
                      guard let self else { return }
                      if self.handle == nil { return }
                      self._write(self.shutdownMarker + "\n")
                      self._flush()
                  }
              }

              private func _write(_ s: String) {
                  NSLog("%@", s.trimmingCharacters(in: .newlines))
                  guard let h = handle, let d = s.data(using: .utf8) else { return }
                  _ = try? h.write(contentsOf: d)
                  currentSize += d.count
                  if currentSize > maxBytes { _rotate() }
              }

              private func _rotate() {
                  _ = try? handle?.close()
                  handle = nil
                  let fm = FileManager.default
                  try? fm.removeItem(at: liveURL)
                  fm.createFile(atPath: liveURL.path, contents: nil)
                  handle = try? FileHandle(forWritingTo: liveURL)
                  currentSize = 0
                  _write("[ROTATE]\n")
              }

              private func _flush() {
                  try? handle?.synchronize()
              }

              func recoverPreviousSession() -> String? {
                  let fm = FileManager.default
                  guard fm.fileExists(atPath: crashURL.path) else { return nil }
                  guard let data = try? Data(contentsOf: crashURL) else { return nil }
                  return String(data: data, encoding: .utf8)
              }

              func clearPreviousCrash() {
                  try? FileManager.default.removeItem(at: crashURL)
              }
          }
          SWIFT

      - name: Write RuntimeView.swift
        run: |
          cat > natsuk1/Views/RuntimeView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct RuntimeView: View {
              @EnvironmentObject var state: AppState

              private var osShort: String {
                  let v = ProcessInfo.processInfo.operatingSystemVersion
                  return "\(v.majorVersion).\(v.minorVersion)"
              }
              private var deviceLine: String {
                  "\(DeviceName.friendly()) · iOS \(osShort)"
              }

              var body: some View {
                  Section {
                      row("Slide", state.slide, hot: state.slide != "—")
                      row("Base",  state.base,  hot: state.base  != "—")
                      HStack {
                          Text("Status")
                          Spacer()
                          StatusDot(status: state.status)
                      }
                      HStack {
                          Text("Device")
                          Spacer()
                          Text(deviceLine)
                              .font(.system(size: 12, design: .monospaced))
                              .foregroundStyle(.secondary)
                              .lineLimit(1)
                              .truncationMode(.middle)
                      }
                  } header: {
                      Label("Runtime", systemImage: "waveform.path.ecg")
                  } footer: {
                      Group {
                          if let crash = state.previousCrash, !crash.isEmpty {
                              Button {
                                  state.showCrashLog = true
                              } label: {
                                  HStack(spacing: 6) {
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .foregroundStyle(.orange)
                                      Text("Previous session crashed — tap to view")
                                          .font(.footnote)
                                      Spacer()
                                      Image(systemName: "chevron.right")
                                          .font(.caption)
                                          .foregroundStyle(.tertiary)
                                  }
                              }
                          }
                      }
                  }
              }

              private func row(_ k: String, _ v: String, hot: Bool) -> some View {
                  HStack {
                      Text(k)
                      Spacer()
                      Text(v)
                          .font(.system(size: 13, design: .monospaced))
                          .foregroundStyle(hot ? Color.green : Color.secondary)
                          .lineLimit(1)
                          .truncationMode(.middle)
                  }
              }
          }
          SWIFT

      - name: Write CrashLogView.swift
        run: |
          cat > natsuk1/Views/CrashLogView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct CrashLogView: View {
              @EnvironmentObject var state: AppState
              @Environment(\.dismiss) private var dismiss
              @State private var copied = false

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          Text(state.previousCrash ?? "(empty)")
                              .font(.system(size: 11, design: .monospaced))
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .padding()
                              .textSelection(.enabled)
                      }
                      .navigationTitle("Previous crash")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  UIPasteboard.general.string = state.previousCrash ?? ""
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Image(systemName: copied ? "checkmark" : "doc.on.doc")
                              }
                          }
                      }
                  }
              }
          }
          SWIFT

      - name: Patch natsuk1.swift
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys

          P = "natsuk1/natsuk1.swift"
          with open(P) as f:
              s = f.read()

          if "natsuk1-crashlog-v1" in s:
              print("already patched")
              sys.exit(0)

          orig = s

          # 1. cCallback: mirror to CrashLog + parse slide/base
          old_cb = 'LockedBuffer.shared.append(String(decoding: bytes, as: UTF8.self))'
          new_cb = ('let _line = String(decoding: bytes, as: UTF8.self)\n'
                    '    LockedBuffer.shared.append(_line)\n'
                    '    CrashLog.shared.writeLine(_line)\n'
                    '    AppState.shared.parseLogLine(_line) /* natsuk1-crashlog-v1 */')
          if old_cb not in s:
              print("ERROR: cCallback marker not found")
              sys.exit(1)
          s = s.replace(old_cb, new_cb, 1)

          # 2. AppState: add @Published + parseLogLine
          state_marker = 'final class AppState: ObservableObject, @unchecked Sendable {'
          if state_marker not in s:
              print("ERROR: AppState marker not found")
              sys.exit(1)

          add_fields = '''

              @Published var slide: String = "—"
              @Published var base: String = "—"
              @Published var previousCrash: String? = nil
              @Published var showCrashLog: Bool = false

              func parseLogLine(_ line: String) {
                  if let v = Self.extractHex(line, keys: ["slide=0x", "SLIDE = 0x", "slide = 0x"]) {
                      if self.slide != v {
                          DispatchQueue.main.async { self.slide = v }
                      }
                  }
                  if let v = Self.extractHex(line, keys: ["base=0x", "BASE = 0x", "base = 0x"]) {
                      if self.base != v {
                          DispatchQueue.main.async { self.base = v }
                      }
                  }
              }

              private static func extractHex(_ s: String, keys: [String]) -> String? {
                  for k in keys {
                      if let r = s.range(of: k) {
                          var hex = ""
                          for c in s[r.upperBound...] {
                              if c.isHexDigit { hex.append(c) } else { break }
                          }
                          if !hex.isEmpty { return "0x" + hex }
                      }
                  }
                  return nil
              }
          '''
          s = s.replace(state_marker, state_marker + add_fields, 1)

          # 3. onAppear: install CrashLog + recover
          hook = '.onAppear {\n                        nk_set_log(cCallback)'
          if hook not in s:
              print("ERROR: onAppear hook not found")
              sys.exit(1)
          new_hook = ('.onAppear {\n'
                      '                        CrashLog.shared.install()\n'
                      '                        if let prev = CrashLog.shared.recoverPreviousSession(),\n'
                      '                           !prev.isEmpty {\n'
                      '                            AppState.shared.previousCrash = prev\n'
                      '                        }\n'
                      '                        nk_set_log(cCallback)')
          s = s.replace(hook, new_hook, 1)

          # 4. .sheet for CrashLogView — attach right after .overlay {}
          overlay_old = ('.overlay {\n'
                         '                        if state.show_respring {\n'
                         '                            RespringView().brightness(-1.0).ignoresSafeArea()\n'
                         '                        }\n'
                         '                    }')
          overlay_new = overlay_old + ('\n'
                         '                    .sheet(isPresented: $state.showCrashLog) {\n'
                         '                        CrashLogView().environmentObject(state)\n'
                         '                    }\n'
                         '                    .onChange(of: scenePhase) { _, phase in\n'
                         '                        if phase == .background {\n'
                         '                            CrashLog.shared.markCleanShutdown()\n'
                         '                        }\n'
                         '                    }')
          if overlay_old not in s:
              print("ERROR: overlay marker not found")
              sys.exit(1)
          s = s.replace(overlay_old, overlay_new, 1)

          # 5. scenePhase env
          phase_marker = '@Environment(\\.scenePhase) private var scenePhase'
          if phase_marker not in s:
              # Inject into RootView
              root_marker = 'struct RootView: View {'
              if root_marker not in s:
                  print("ERROR: RootView marker not found")
                  sys.exit(1)
              s = s.replace(root_marker,
                            root_marker + '\n    @Environment(\\.scenePhase) private var scenePhase',
                            1)

          if s == orig:
              print("ERROR: no changes to natsuk1.swift")
              sys.exit(1)
          if "natsuk1-crashlog-v1" not in s:
              print("ERROR: marker missing")
              sys.exit(1)

          for want in [
              "CrashLog.shared.install()",
              "CrashLog.shared.recoverPreviousSession()",
              "CrashLog.shared.writeLine(_line)",
              "CrashLog.shared.markCleanShutdown()",
              "parseLogLine(_line)",
              "previousCrash: String?",
              "showCrashLog: Bool",
              "private var scenePhase",
          ]:
              if want not in s:
                  print("ERROR: missing %s" % want)
                  sys.exit(1)

          with open(P, "w") as f:
              f.write(s)
          print("natsuk1.swift patched")
          PYEOF

      - name: Patch OverviewView.swift
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys

          P = "natsuk1/Views/OverviewView.swift"
          with open(P) as f:
              s = f.read()

          if "natsuk1-crashlog-v1" in s:
              print("already patched")
              sys.exit(0)

          orig = s
          lm = s.find("List {")
          if lm < 0:
              print("ERROR: List { not found in OverviewView")
              sys.exit(1)
          ins = lm + len("List {") + 1
          insert = ('\n                RuntimeView()'
                    ' /* natsuk1-crashlog-v1 */'
                    '\n                    .environmentObject(state)\n')
          s = s[:ins] + insert + s[ins:]

          if s == orig:
              print("ERROR: no changes to OverviewView.swift")
              sys.exit(1)
          if s.count("natsuk1-crashlog-v1") != 1:
              print("ERROR: marker count != 1")
              sys.exit(1)
          if "RuntimeView()" not in s:
              print("ERROR: RuntimeView not inserted")
              sys.exit(1)

          with open(P, "w") as f:
              f.write(s)
          print("OverviewView.swift patched")
          PYEOF

      - name: Verify
        run: |
          set -euo pipefail
          test -f natsuk1/Helpers/CrashLog.swift
          test -f natsuk1/Views/RuntimeView.swift
          test -f natsuk1/Views/CrashLogView.swift
          test "$(grep -c 'natsuk1-crashlog-v1' natsuk1/natsuk1.swift)" = "1"
          test "$(grep -c 'natsuk1-crashlog-v1' natsuk1/Views/OverviewView.swift)" = "1"
          grep -q 'CrashLog.shared.install()' natsuk1/natsuk1.swift
          grep -q 'recoverPreviousSession' natsuk1/natsuk1.swift
          grep -q 'markCleanShutdown' natsuk1/natsuk1.swift
          grep -q 'parseLogLine' natsuk1/natsuk1.swift
          grep -q 'RuntimeView()' natsuk1/Views/OverviewView.swift
          grep -q 'CrashLogView' natsuk1/Views/CrashLogView.swift
          grep -q 'NSSetUncaughtExceptionHandler' natsuk1/Helpers/CrashLog.swift
          grep -q 'signal(SIGSEGV' natsuk1/Helpers/CrashLog.swift
          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "crash-log + runtime view"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            natsuk1/Helpers/CrashLog.swift \
            natsuk1/Views/RuntimeView.swift \
            natsuk1/Views/CrashLogView.swift \
            natsuk1/natsuk1.swift \
            natsuk1/Views/OverviewView.swift
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "crash-log + runtime view [skip ci]"
          git push
