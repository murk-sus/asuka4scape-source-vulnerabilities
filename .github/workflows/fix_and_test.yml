name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Write patch script
        run: |
          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re, os, sys

          HELPERS = "natsuk1/Helpers"

          def read(p):
              if not os.path.exists(p):
                  return None
              return open(p).read()

          def write(p, s):
              open(p, "w").write(s)

          def clean_swift(s):
              s = re.sub(r"^\s*@MainActor\s*\n", "", s, flags=re.M)
              s = re.sub(r"^\s*@MainActor\s+(?=final\s+class)", "", s, flags=re.M)
              s = re.sub(r"^\s*@Published\s+", "", s, flags=re.M)
              s = re.sub(r"\bnonisolated\s+(?!\()", "", s)
              s = re.sub(r"final\s+class\s+PairingController\s*:\s*ObservableObject[^{]*\{",
                         "final class PairingController: @unchecked Sendable {", s)
              s = re.sub(r"final\s+class\s+KeepAlive\s*:\s*NSObject\s*,\s*ObservableObject[^{]*\{",
                         "final class KeepAlive: NSObject, @unchecked Sendable {", s)
              s = re.sub(r"\nfinal\s+class\s+UnmanagedBox\b[^\n]*\n(?:[^\n]*\n|\}\n)*", "\n", s)
              return s

          pc = os.path.join(HELPERS, "PairingController.swift")
          s = read(pc)
          if s:
              s = clean_swift(s)
              s = re.sub(r"^(\s*)private\s+static\s+let\s+altIRKKey\b",
                         r"\1nonisolated private static let altIRKKey", s, flags=re.M)
              s = re.sub(r"^(\s*)static\s+var\s+customPairingFilePath\b",
                         r"\1nonisolated(unsafe) static var customPairingFilePath", s, flags=re.M)
              s = re.sub(r"^(\s*)private\s+let\s+pairReadyCallback\b",
                         r"\1nonisolated(unsafe) private let pairReadyCallback", s, flags=re.M)
              s = re.sub(r"^(\s*)private\s+let\s+pairPinCallback\b",
                         r"\1nonisolated(unsafe) private let pairPinCallback", s, flags=re.M)
              write(pc, s)
              print("patched PairingController")

          ka = os.path.join(HELPERS, "KeepAlive.swift")
          s = read(ka)
          if s:
              s = clean_swift(s)
              write(ka, s)
              print("patched KeepAlive")

          ns = os.path.join(HELPERS, "NetworkStatus.swift")
          s = read(ns)
          if s:
              s = s.replace(
                  "return String(cString: host)",
                  "let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)")
              write(ns, s)
              print("patched NetworkStatus")

          pc2 = read(pc) or ""
          problems = []
          for m in re.finditer(r"final\s+class\s+PairingController[^\n]*", pc2):
              if "ObservableObject" in m.group(0):
                  problems.append("PairingController still ObservableObject: " + m.group(0))
          if "@MainActor" in pc2:
              problems.append("PairingController still has @MainActor")
          if "ObservableObject" in (read(ka) or ""):
              for m in re.finditer(r"final\s+class\s+KeepAlive[^\n]*", read(ka) or ""):
                  if "ObservableObject" in m.group(0):
                      problems.append("KeepAlive still ObservableObject: " + m.group(0))
          if problems:
              for x in problems:
                  print("FAIL: " + x)
              sys.exit(1)
          print("verify OK")
          ENDSCRIPT

      - name: Run patch
        run: python3 /tmp/patch.py

      - name: Verify patch
        run: |
          echo "===== PairingController head ====="
          sed -n '1,45p' natsuk1/Helpers/PairingController.swift
          echo "===== class decls ====="
          grep -n "final class" natsuk1/Helpers/PairingController.swift || true
          grep -n "final class" natsuk1/Helpers/KeepAlive.swift || true
          echo "===== altIRKKey line ====="
          grep -n "altIRKKey" natsuk1/Helpers/PairingController.swift || true
          echo "===== NetworkStatus cString check ====="
          if grep -q "String(cString: host)" natsuk1/Helpers/NetworkStatus.swift; then
            echo "NOT FIXED"
            exit 1
          fi
          echo "OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Fix MainActor isolation"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Fix MainActor isolation [skip ci]"
          git push
