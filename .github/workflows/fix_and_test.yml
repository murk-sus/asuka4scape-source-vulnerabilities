          grep -q '"document.on.document"' natsuk1/Views/OverviewView.swift || fail "OverviewView missing document.on.document"
          grep -q '"ellipsis.circle"' natsuk1/Views/OverviewView.swift || fail "OverviewView missing ellipsis.circle"
          grep -q '"cross.case.fill"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing cross.case.fill"
          grep -q '"wand.and.rays"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing wand.and.rays"
          grep -q '"wand.and.stars"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing wand.and.stars"
          grep -q '"ipad.and.iphone"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing ipad.and.iphone"
          grep -q '"iphone.gen3"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing iphone.gen3"
          grep -q '"arrow.clockwise.circle"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing arrow.clockwise.circle"
          grep -q '"stethoscope"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing stethoscope"
          grep -q '"folder.badge.gearshape"' natsuk1/Views/ToolsView.swift || fail "ToolsView missing folder.badge.gearshape"
          grep -q '"person.crop.square"' natsuk1/Views/SettingsView.swift || fail "SettingsView missing person.crop.square"
          grep -q '"moon.stars.fill"' natsuk1/Views/SettingsView.swift || fail "SettingsView missing moon.stars.fill"
          grep -q '"slider.horizontal.3"' natsuk1/Views/SettingsView.swift || fail "SettingsView missing slider.horizontal.3"
          grep -q '"scope"' natsuk1/Views/AirliftView.swift || fail "AirliftView missing scope"
          grep -q '"play.fill"' natsuk1/Views/AirliftView.swift || fail "AirliftView missing play.fill"
          grep -q '"restart"' natsuk1/Views/AirliftView.swift || fail "AirliftView missing restart"
          grep -q '"terminal"' natsuk1/Views/AirliftView.swift || fail "AirliftView missing terminal"
          grep -q '"dot.radiowaves.left.and.right"' natsuk1/Views/AirliftView.swift || fail "AirliftView missing dot.radiowaves.left.and.right"
          grep -q '"checkmark.seal.fill"' natsuk1/Views/MobileGestaltView.swift || fail "MobileGestaltView missing checkmark.seal.fill"
          grep -q '"key.fill"' natsuk1/Views/MobileGestaltView.swift || fail "MobileGestaltView missing key.fill"
          grep -q '"chart.bar.xaxis"' natsuk1/Views/PathAccessView.swift || fail "PathAccessView missing chart.bar.xaxis"
          grep -q '"books.vertical"' natsuk1/Views/PathAccessView.swift || fail "PathAccessView missing books.vertical"
          grep -q '"square.and.arrow.up"' natsuk1/Views/PathAccessView.swift || fail "PathAccessView missing square.and.arrow.up"
          grep -q '"link.circle"' natsuk1/Views/AboutView.swift || fail "AboutView missing link.circle"

          grep -q 'SWIFT_VERSION: "5.0"' project.yml || fail "project.yml not in Swift 5 mode"
          if grep -q "SWIFT_DEFAULT_ACTOR_ISOLATION" project.yml ; then
            fail "project.yml has SWIFT_DEFAULT_ACTOR_ISOLATION"
          fi
          if grep -q "default-isolation" project.yml ; then
            fail "project.yml has default-isolation flag"
          fi
          grep -q "disable-dynamic-actor-isolation" project.yml || fail "missing disable-dynamic-actor-isolation"

          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app"
            exit 1
          fi
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Fix Identifiable conformance, dedup SF Symbols, DeviceInfo as push"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/ .github/ project.yml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Fix Identifiable, dedup SF Symbols, DeviceInfo as push [skip ci]"
          git push
