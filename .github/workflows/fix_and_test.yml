                  Key(name: "ActivationStateAcknowledged", kind: .bool),
                  Key(name: "RegulatoryModelNumber", kind: .string),
                  Key(name: "ReleaseType", kind: .string),
                  Key(name: "SigningFuse", kind: .bool),
                  Key(name: "SupportsExternalAccessory", kind: .bool),
