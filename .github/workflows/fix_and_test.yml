          import SwiftUI
          import UIKit

          struct DeviceInfoView: View {
              @Environment(\.dismiss) private var dismiss

              var body: some View {
                  NavigationStack {
                      List {
                          row("Model", DeviceName.friendly())
                          row("Identifier", machineID())
                          row("Chip", DeviceName.chip())
                          row("iOS", sysctlString("kern.osproductversion"))
                          row("Build", sysctlString("kern.osversion"))
                          row("RAM", ram())
                          row("Architecture", arch())
                          row("Locale", localeShort())
                          row("Region", regionShort())
                          row("Uptime", uptime())
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("Device")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { dismiss() }
                          }
                      }
                  }
              }

              private func row(_ key: String, _ value: String) -> some View {
                  HStack {
                      Text(key)
                      Spacer()
                      Text(value)
                          .font(.system(.body, design: .monospaced))
                          .foregroundColor(.secondary)
                          .lineLimit(1)
                          .truncationMode(.middle)
                  }
              }

              private func machineID() -> String {
                  var sysinfo = utsname()
                  uname(&sysinfo)
                  return Mirror(reflecting: sysinfo.machine).children.reduce("") { id, el in
                      guard let v = el.value as? Int8, v != 0 else { return id }
                      return id + String(UnicodeScalar(UInt8(v)))
                  }
              }

              private func sysctlString(_ name: String) -> String {
                  var size = 0
                  sysctlbyname(name, nil, &size, nil, 0)
                  var buf = [CChar](repeating: 0, count: size)
                  sysctlbyname(name, &buf, &size, nil, 0)
                  let bytes = buf.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }
                  return String(decoding: bytes, as: UTF8.self)
              }

              private func ram() -> String {
                  var size: UInt64 = 0
                  var len = MemoryLayout<UInt64>.size
                  if sysctlbyname("hw.memsize", &size, &len, nil, 0) != 0 { return "unknown" }
                  return ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .memory)
              }

              private func arch() -> String {
                  #if arch(arm64)
                  return "arm64"
                  #else
                  return "unknown"
                  #endif
              }

              private func localeShort() -> String {
                  Locale.current.identifier
                      .split(separator: "_")
                      .first
                      .map(String.init)?
                      .uppercased() ?? "—"
              }

              private func regionShort() -> String {
                  let region = Locale.current.region?.identifier ?? ""
                  return region.isEmpty ? "—" : region.uppercased()
              }

              private func uptime() -> String {
                  let t = ProcessInfo.processInfo.systemUptime
                  let h = Int(t) / 3600
                  let m = (Int(t) % 3600) / 60
                  return "\(h)h \(m)m"
              }
          }
          EOF

      - name: Write OffsetsView
        run: |
          cat > natsuk1/Views/OffsetsView.swift <<'EOF'
          import SwiftUI
          import UIKit

          struct OffsetsView: View {
              @EnvironmentObject var store: OffsetsStore
              @State private var query = ""
              @State private var editing: String? = nil
              @State private var showResetAll = false
              @State private var showExport = false

              var body: some View {
                  List {
                      Section {
                          HStack {
                              Text("Filled")
                              Spacer()
                              Text("\(store.filledCount()) / \(store.totalCount())")
                                  .font(.system(.body, design: .monospaced))
                                  .foregroundColor(.secondary)
                          }
                      }

                      ForEach(filteredGroups, id: \.title) { group in
                          Section {
                              ForEach(group.items, id: \.self) { name in
                                  Button {
                                      editing = name
                                  } label: {
                                      OffsetRow(name: name, value: store.value(for: name))
                                  }
                                  .buttonStyle(.plain)
                              }
                          } header: {
                              Text(group.title)
                          }
                      }
                  }
                  .listStyle(.insetGrouped)
                  .scrollContentBackground(.hidden)
                  .background(Color(UIColor.systemGroupedBackground))
                  .searchable(text: $query, placement: .navigationBarDrawer(displayMode: .always))
                  .navigationTitle("Modify Offsets")
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .navigationBarTrailing) {
                          Menu {
                              Button { showExport = true } label: {
                                  Label("Export JSON", systemImage: "square.and.arrow.up")
                              }
                              Button(role: .destructive) { showResetAll = true } label: {
                                  Label("Reset All", systemImage: "arrow.uturn.backward")
                              }
                          } label: {
                              Image(systemName: "ellipsis.circle")
                                  .foregroundStyle(Color(UIColor.tertiaryLabel))
                          }
                      }
                  }
                  .sheet(item: Binding(
                      get: { editing.map { EditTarget(name: $0) } },
                      set: { editing = $0?.name }
                  )) { target in
                      EditOffsetView(name: target.name)
                          .environmentObject(store)
                  }
                  .sheet(isPresented: $showExport) {
                      ExportOffsetsView()
                          .environmentObject(store)
                  }
                  .alert("Reset All Offsets?", isPresented: $showResetAll) {
                      Button("Cancel", role: .cancel) {}
                      Button("Reset", role: .destructive) { store.reset() }
                  } message: {
                      Text("All offsets will be set to built-in defaults.")
                  }
              }

              private var filteredGroups: [OffsetsStore.Group] {
                  if query.isEmpty { return OffsetsStore.groups }
                  let q = query.lowercased()
                  return OffsetsStore.groups.compactMap { g in
                      let items = g.items.filter { $0.lowercased().contains(q) }
                      if items.isEmpty { return nil }
                      return OffsetsStore.Group(title: g.title, items: items)
                  }
              }
          }

          struct EditTarget: Identifiable {
              let name: String
              var id: String { name }
          }

          struct OffsetRow: View {
              let name: String
              let value: String

              private var valueColor: Color {
                  value == "0x0" ? Color.secondary : Color.green
              }

              var body: some View {
                  HStack(alignment: .firstTextBaseline, spacing: 8) {
                      Text(name)
                          .foregroundStyle(Color.primary)
                          .font(.system(size: 13, design: .monospaced))
                          .lineLimit(2)
                          .multilineTextAlignment(.leading)
                      Spacer(minLength: 8)
                      Text(value)
                          .font(.system(size: 13, design: .monospaced))
                          .foregroundColor(valueColor)
                  }
                  .padding(.vertical, 4)
                  .contentShape(Rectangle())
              }
          }

          struct EditOffsetView: View {
              @EnvironmentObject var store: OffsetsStore
              @Environment(\.dismiss) private var dismiss
              let name: String

              @State private var text: String = ""
              @State private var showError = false
              @State private var errorMsg = ""

              var body: some View {
                  NavigationStack {
                      Form {
                          Section {
                              Text(name)
                                  .font(.system(size: 12, design: .monospaced))
                                  .foregroundStyle(.secondary)
                          } header: {
                              Text("Offset")
                          }

                          Section {
                              TextField("Value", text: $text)
                                  .font(.system(size: 14, design: .monospaced))
                                  .autocorrectionDisabled()
                                  .textInputAutocapitalization(.never)
                                  .keyboardType(.asciiCapable)
                          } header: {
                              Text("Value")
                          } footer: {
                              Text("Hex (0x...) or decimal. Default: \(OffsetsStore.defaults[name] ?? "0x0")")
                          }

                          Section {
                              Button {
                                  store.resetOne(name)
                                  dismiss()
                              } label: {
                                  HStack {
                                      Image(systemName: "arrow.uturn.backward")
                                      Text("Restore Default")
                                  }
                              }
                          }
                      }
                      .scrollContentBackground(.hidden)
                      .navigationTitle("Edit")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Cancel") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Save") { save() }.fontWeight(.semibold)
                          }
                      }
                      .alert("Invalid Value", isPresented: $showError) {
                          Button("OK", role: .cancel) {}
                      } message: {
                          Text(errorMsg)
                      }
                      .onAppear { text = store.value(for: name) }
                  }
              }

              private func save() {
                  let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  if trimmed.isEmpty {
                      errorMsg = "Value cannot be empty."; showError = true; return
                  }
                  if trimmed.hasPrefix("0x") || trimmed.hasPrefix("0X") {
                      let hexPart = String(trimmed.dropFirst(2))
                      if UInt64(hexPart, radix: 16) == nil {
                          errorMsg = "Invalid hex value."; showError = true; return
                      }
                  } else if UInt64(trimmed) == nil {
                      errorMsg = "Invalid numeric value."; showError = true; return
                  }
                  store.update(name, value: trimmed)
                  dismiss()
              }
          }

          struct ExportOffsetsView: View {
              @EnvironmentObject var store: OffsetsStore
              @Environment(\.dismiss) private var dismiss
              @State private var copied = false

              private var json: String {
                  let sorted = store.values.sorted { $0.key < $1.key }
                  let dict = Dictionary(uniqueKeysWithValues: sorted)
                  if let data = try? JSONSerialization.data(
                      withJSONObject: dict,
                      options: [.prettyPrinted, .sortedKeys]
                  ), let str = String(data: data, encoding: .utf8) {
                      return str
                  }
                  return "{}"
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          Text(json)
                              .font(.system(size: 11, design: .monospaced))
                              .padding()
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .textSelection(.enabled)
                      }
                      .navigationTitle("Export")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  UIPasteboard.general.string = json
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Image(systemName: copied ? "checkmark" : "doc.on.doc")
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'EOF'
          import SwiftUI
          import UIKit
          import Foundation

          final class LockedBuffer: @unchecked Sendable {
              static let shared = LockedBuffer()
              private let lock = NSLock()
              private var value: String = ""

              private init() {}

              func append(_ s: String) {
                  lock.lock()
                  value += s
                  value += "\n"
                  if value.count > 10000 {
                      value = String(value.suffix(6000))
                  }
                  lock.unlock()
              }

              func drain() -> String {
                  lock.lock()
                  let v = value
                  value = ""
                  lock.unlock()
                  return v
              }

              func clear() {
                  lock.lock()
                  value = ""
                  lock.unlock()
              }
          }

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              var bytes: [UInt8] = []
              var p = line
              while p.pointee != 0 {
                  bytes.append(UInt8(bitPattern: p.pointee))
                  p = p.advanced(by: 1)
              }
              LockedBuffer.shared.append(String(decoding: bytes, as: UTF8.self))
          }

          private func osVersionString() -> String {
              let v = ProcessInfo.processInfo.operatingSystemVersion
              return "\(v.majorVersion).\(v.minorVersion)"
          }

          private func appVersionString() -> String {
              Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
          }

          private var isSupportedIOS: Bool {
              ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 27
          }

          @main
          struct natsuk1App: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                  }
              }
          }

          struct RootView: View {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @StateObject private var airlift = AirliftBridge.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive_audio") private var keep_alive_audio = false
              @AppStorage("keep_alive_location") private var keep_alive_location = false

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false,
                      "keep_alive_audio": false,
                      "keep_alive_location": false,
                      "lang": "en",
                  ])
              }

              var body: some View {
                  Group {
                      if isSupportedIOS {
                          ContentView()
                              .environmentObject(state)
                              .environmentObject(offsets)
                              .environmentObject(airlift)
                              .onAppear {
                                  nk_set_log(cCallback)
                                  if state.log.isEmpty {
                                      state.append("[*] natsuk1 v\(appVersionString())")
                                      state.append("[*] iOS \(osVersionString()) / arm64e")
                                      if let version = OffsetsStore.activeVersion {
                                          state.append("[*] offsets: \(version.device) / iOS \(version.ios) (\(version.build))")
                                      }
                                      state.append("")
                                  }
                                  if keep_alive_audio { KeepAlive.shared.startAudio() }
                                  if keep_alive_location { KeepAlive.shared.startLocation() }
                                  if auto_run {
                                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                                          state.run()
                                      }
                                  }
                              }
                              .onChange(of: keep_alive_audio) { _, value in
                                  if value { KeepAlive.shared.startAudio() } else { KeepAlive.shared.stopAudio() }
                              }
                              .onChange(of: keep_alive_location) { _, value in
                                  if value { KeepAlive.shared.startLocation() } else { KeepAlive.shared.stopLocation() }
                              }
                              .overlay {
                                  if state.show_respring {
                                      RespringView()
                                          .brightness(-1.0)
                                          .ignoresSafeArea()
                                  }
                              }
                      } else {
                          NotSupportedView(version: osVersionString())
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }

          struct NotSupportedView: View {
              let version: String

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "exclamationmark.triangle.fill")
                          .font(.system(size: 56))
                          .foregroundStyle(.orange)
                      Text("Not supported for iOS \(version)")
                          .font(.title3)
                          .fontWeight(.semibold)
                          .multilineTextAlignment(.center)
                      Text("natsuk1 runs on iOS 27 only.")
                          .font(.subheadline)
                          .foregroundColor(.secondary)
                          .multilineTextAlignment(.center)
                  }
                  .padding(40)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color(UIColor.systemGroupedBackground).ignoresSafeArea())
              }
          }

          @MainActor
          final class AppState: ObservableObject {
              static let shared = AppState()

              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle:    return .secondary
                      case .running: return .orange
                      case .ok:      return .green
                      case .failed:  return .red
                      }
                  }
              }

              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false

              @Published var lang: String {
                  didSet { UserDefaults.standard.set(lang, forKey: "lang") }
              }

              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }

              func t(_ en: String, _ ru: String) -> String {
                  lang == "ru" ? ru : en
              }

              private func startFlusher() {
                  Task { @MainActor [weak self] in
                      while !Task.isCancelled {
                          try? await Task.sleep(for: .milliseconds(300))
                          guard let self else { return }
                          let chunk = LockedBuffer.shared.drain()
                          guard !chunk.isEmpty else { continue }
                          var newLog = self.log
                          newLog += chunk
                          if newLog.count > 30000 {
                              newLog = String(newLog.suffix(20000))
                          }
                          self.log = newLog
                      }
                  }
              }

              func append(_ s: String) {
                  LockedBuffer.shared.append(s)
              }

              func run() {
                  if running { return }
                  running = true
                  status = .running

                  Task.detached {
                      _ = nk_full_exploit()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }

              func respring() {
                  show_respring = true
              }

              func clear() {
                  LockedBuffer.shared.clear()
                  log = ""
              }
          }
          EOF

      - name: Patch Info.plist
        run: |
          python3 <<'PYEOF'
          import re
          p = "natsuk1/Resources/Info.plist"
          s = open(p).read()

          if "NSBonjourServices" not in s:
              insert = (
                  "    <key>NSBonjourServices</key>\n"
                  "    <array>\n"
                  "        <string>_remotepairing-pairable-host._tcp</string>\n"
                  "    </array>\n"
                  "    <key>NSLocalNetworkUsageDescription</key>\n"
                  "    <string>natsuk1 advertises a local pairing service so this device can pair with itself.</string>\n"
              )
              s = s.replace("</dict>\n</plist>", insert + "</dict>\n</plist>")

          if "UIBackgroundModes" not in s:
              insert = (
                  "    <key>UIBackgroundModes</key>\n"
                  "    <array>\n"
                  "        <string>audio</string>\n"
                  "    </array>\n"
              )
              s = s.replace("</dict>\n</plist>", insert + "</dict>\n</plist>")

          open(p, "w").write(s)
          print("info.plist patched")
          PYEOF

      - name: Patch project.yml
        run: |
          python3 <<'PYEOF'
          import re
          p = "project.yml"
          s = open(p).read()

          s = re.sub(
              r'^\s*- framework: natsuk1/External/AirliftFFI\.xcframework\n\s*embed: false\n',
              '',
              s, flags=re.M,
          )
          s = re.sub(
              r'^\s*- path: natsuk1/External\n\s*excludes:\n\s*- "\*\*/\*\.xcframework/\*\*"\n',
              '',
              s, flags=re.M,
          )

          hdr = '        HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/Headers $(SRCROOT)/natsuk1/Exploit"'
          if "HEADER_SEARCH_PATHS" in s:
              s = re.sub(r'^\s*HEADER_SEARCH_PATHS:.*\n', hdr + '\n', s, flags=re.M)
          else:
              s = re.sub(
                  r'(^\s*OTHER_LDFLAGS:.*\n)',
                  r'\1' + hdr + '\n',
                  s, flags=re.M,
              )

          lib = '$(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a'
          if lib not in s:
              s = re.sub(
                  r'^(\s*OTHER_LDFLAGS:\s*)(.*)$',
                  r'\1\2 ' + lib + ' -lc++',
                  s, flags=re.M,
              )
          elif "-lc++" not in s:
              s = re.sub(
                  r'^(\s*OTHER_LDFLAGS:\s*)(.*)$',
                  r'\1\2 -lc++',
                  s, flags=re.M,
              )

          open(p, "w").write(s)
          print("---- project.yml ----")
          print(s)
          PYEOF

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install xcodegen ldid
          brew link --overwrite xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            build/SDKStatCaches.noindex
          key: dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-${{ hashFiles('natsuk1/**/*.swift', 'natsuk1/**/*.c', 'natsuk1/**/*.h', 'project.yml') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build
        id: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Package app for handoff
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          APP_DIR="$(dirname "$APP_PATH")"
          APP_NAME="$(basename "$APP_PATH")"
          COPYFILE_DISABLE=1 tar -czf natsuk1-app.tar.gz -C "$APP_DIR" "$APP_NAME"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app tarball
        uses: actions/upload-artifact@v6
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Commit fixes if any
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Airlift: direct .a linking, HEADER_SEARCH_PATHS, no xcframework dep [skip ci]"
          git push
