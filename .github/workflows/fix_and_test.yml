                              Label("Device", systemImage: "iphone.gen3")
                          }

                          Section {
                              NavigationLink { PathAccessView() } label: { Text("Path Access") }
                          } header: {
                              Label("Diagnostics", systemImage: "waveform.path.ecg.rectangle")
