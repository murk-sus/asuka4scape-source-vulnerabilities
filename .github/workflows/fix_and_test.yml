      - name: Write DeviceInfoView.swift
        run: |
          cat > natsuk1/Views/DeviceInfoView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct DeviceInfoView: View {
              var body: some View {
                  List {
                      Section {
                          row("Model", DeviceName.friendly())
                          row("Identifier", machineID())
                          row("Chip", DeviceName.chip())
                      } header: {
                          Label("Hardware", systemImage: "cpu")
                      }

                      Section {
                          row("iOS", sysctlString("kern.osproductversion"))
                          row("Build", sysctlString("kern.osversion"))
                          row("Architecture", arch())
                      } header: {
                          Label("Software", systemImage: "gear")
                      }

                      Section {
                          row("RAM", ram())
                          row("Uptime", uptime())
                      } header: {
                          Label("Resources", systemImage: "memorychip")
                      }

                      Section {
                          row("Locale", localeShort())
                          row("Region", regionShort())
                      } header: {
                          Label("Locale", systemImage: "globe")
                      }
                  }
                  .listStyle(.insetGrouped)
                  .scrollContentBackground(.hidden)
                  .background(Color(UIColor.systemGroupedBackground))
                  .navigationTitle("Device")
                  .navigationBarTitleDisplayMode(.inline)
              }

              private func row(_ key: String, _ value: String) -> some View {
                  HStack {
                      Text(key)
                      Spacer()
                      Text(value)
                          .font(.system(.body, design: .monospaced))
                          .foregroundColor(.secondary)
                          .lineLimit(1)
                          .truncationMode(.middle)
                  }
              }

              private func machineID() -> String {
                  var sysinfo = utsname()
                  uname(&sysinfo)
                  return Mirror(reflecting: sysinfo.machine).children.reduce("") { id, el in
                      guard let v = el.value as? Int8, v != 0 else { return id }
                      return id + String(UnicodeScalar(UInt8(v)))
                  }
              }

              private func sysctlString(_ name: String) -> String {
                  var size = 0
                  sysctlbyname(name, nil, &size, nil, 0)
                  var buf = [CChar](repeating: 0, count: size)
                  sysctlbyname(name, &buf, &size, nil, 0)
                  let bytes = buf.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }
                  return String(decoding: bytes, as: UTF8.self)
              }

              private func ram() -> String {
                  var size: UInt64 = 0
                  var len = MemoryLayout<UInt64>.size
                  if sysctlbyname("hw.memsize", &size, &len, nil, 0) != 0 { return "unknown" }
                  return ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .memory)
              }

              private func arch() -> String {
                  #if arch(arm64)
                  return "arm64"
                  #else
                  return "unknown"
                  #endif
              }

              private func localeShort() -> String {
                  Locale.current.identifier
                      .split(separator: "_")
                      .first
                      .map(String.init)?
                      .uppercased() ?? "—"
              }

              private func regionShort() -> String {
                  let region = Locale.current.region?.identifier ?? ""
                  return region.isEmpty ? "—" : region.uppercased()
              }

              private func uptime() -> String {
                  let t = ProcessInfo.processInfo.systemUptime
                  let h = Int(t) / 3600
                  let m = (Int(t) % 3600) / 60
                  return "\(h)h \(m)m"
              }
          }
          SWIFT
          echo "wrote DeviceInfoView.swift"

      - name: Write project.yml
        run: |
          cat > project.yml <<'YAML'
          name: natsuk1
          options:
            bundleIdPrefix: com.natsuk1
            deploymentTarget:
              iOS: "26.0"
            createIntermediateGroups: true
            groupSortPosition: top
            projectFormat: xcode15_0
            generateEmptyDirectories: false

          configs:
            Debug: debug
            Release: release

          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              IPHONEOS_DEPLOYMENT_TARGET: "26.0"
              CLANG_ENABLE_MODULES: YES
              CLANG_MODULES_AUTOLINK: NO
              CLANG_ENABLE_OBJC_ARC: YES
              ENABLE_BITCODE: NO
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGNING_ALLOWED: NO
              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              CLANG_WARN_DOCUMENTATION_COMMENTS: NO
              CLANG_WARN_UNREACHABLE_CODE: NO
              CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
              GCC_WARN_UNINITIALIZED_AUTOS: NO
              GCC_WARN_UNDECLARED_SELECTOR: NO
              GCC_WARN_UNUSED_FUNCTION: NO
              GCC_WARN_UNUSED_VARIABLE: NO
              ENABLE_STRICT_OBJC_MSGSEND: NO
              MTL_ENABLE_DEBUG_INFO: NO
              MTL_FAST_MATH: YES
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO

            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "DEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES

              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
