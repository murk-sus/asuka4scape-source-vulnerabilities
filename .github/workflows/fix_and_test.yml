                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -lc++ -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/Headers $(SRCROOT)/natsuk1/Exploit"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          YAML
          echo "wrote project.yml"

      - name: Verify
        run: |
          set -euo pipefail

          fail() { echo "FAIL: $1"; exit 1; }

          SRC_PATHS="natsuk1/Helpers natsuk1/Views natsuk1/Exploit natsuk1/Resources natsuk1/Offsets natsuk1/natsuk1.swift natsuk1/bridging.h"

          if grep -rqi "aircard" $SRC_PATHS ; then
            grep -rni "aircard" $SRC_PATHS || true
            fail "aircard still present"
          fi
          if grep -rqi "airlift_pairing" $SRC_PATHS ; then
            grep -rni "airlift_pairing" $SRC_PATHS || true
            fail "airlift_pairing still present"
          fi
          if grep -rq "@MainActor" $SRC_PATHS ; then
            grep -rn "@MainActor" $SRC_PATHS || true
            fail "@MainActor still present"
          fi
          if grep -rq "@preconcurrency" $SRC_PATHS ; then
            grep -rn "@preconcurrency" $SRC_PATHS || true
            fail "@preconcurrency still present"
          fi
          if grep -rnE "(^|[^)] )static (let|var) shared(Instance)?\b" $SRC_PATHS ; then
            grep -rnE "(^|[^)] )static (let|var) shared(Instance)?\b" $SRC_PATHS || true
            fail "static shared without nonisolated(unsafe)"
          fi

          grep -q 'natsuk1_pairing.plist' natsuk1/Helpers/PairingController.swift || fail "PairingController missing natsuk1_pairing.plist"
          grep -q 'natsuk1PairingHostAltIRK' natsuk1/Helpers/PairingController.swift || fail "PairingController missing altIRK key"
          grep -q 'removeItem(atPath: sourcePath)' natsuk1/Helpers/PairingController.swift || fail "sync does not sweep"
          grep -q 'PairingController.pairingFilePath()' natsuk1/Helpers/AirliftBridge.swift || fail "AirliftBridge wrong path"
          grep -q 'logAccessibleFolders' natsuk1/Helpers/AirliftBridge.swift || fail "logAccessibleFolders missing"
          grep -q 'al_device_respring' natsuk1/Helpers/AirliftBridge.swift || fail "respring not wired"

          grep -q '_natsuk1probe._tcp' natsuk1/Helpers/LocalNetworkAuthorization.swift || fail "LocalNetworkAuthorization missing probe"
          grep -q '_natsuk1probe._tcp' natsuk1/Resources/Info.plist || fail "Info.plist missing probe"

          grep -q 'TabView' natsuk1/Views/ContentView.swift || fail "ContentView missing TabView"
          grep -q 'OverviewView' natsuk1/Views/ContentView.swift || fail "ContentView missing OverviewView"
          grep -q 'ToolsView' natsuk1/Views/ContentView.swift || fail "ContentView missing ToolsView"
          grep -q 'SettingsView' natsuk1/Views/ContentView.swift || fail "ContentView missing SettingsView"

          grep -q 'Run Exploit' natsuk1/Views/OverviewView.swift || fail "OverviewView missing Run Exploit"
          grep -q 'OverviewLogView' natsuk1/Views/OverviewView.swift || fail "OverviewView missing log view"

          grep -q 'Path Access' natsuk1/Views/ToolsView.swift || fail "ToolsView missing Path Access"
          grep -q 'AirliftView' natsuk1/Views/ToolsView.swift || fail "ToolsView missing Airlift"
          grep -q 'OffsetsView' natsuk1/Views/ToolsView.swift || fail "ToolsView missing Offsets"
          grep -q 'DeviceInfoView' natsuk1/Views/ToolsView.swift || fail "ToolsView missing DeviceInfo"
          grep -q 'respring' natsuk1/Views/ToolsView.swift || fail "ToolsView missing respring"

          grep -qi 'MobileGestalt' natsuk1/Views/PathAccessView.swift || fail "PathAccessView missing MobileGestalt"
          grep -q 'isReadableFile' natsuk1/Views/PathAccessView.swift || fail "PathAccessView missing read check"
          grep -q 'isWritableFile' natsuk1/Views/PathAccessView.swift || fail "PathAccessView missing write check"

          if grep -q '"Done"' natsuk1/Views/SettingsView.swift; then
            fail "SettingsView still has Done button"
          fi

          if grep -q 'Credits' natsuk1/Views/AboutView.swift; then
            fail "AboutView still has Credits"
          fi
          if grep -q '0xjohnnydev' natsuk1/Views/AboutView.swift; then
            fail "AboutView still has Airlift credit"
          fi
          if grep -qi 'AirCard' natsuk1/Views/AboutView.swift; then
            fail "AboutView still has AirCard credit"
          fi

          grep -q 'SWIFT_VERSION: "5.0"' project.yml || fail "project.yml not in Swift 5 mode"
          if grep -q "SWIFT_DEFAULT_ACTOR_ISOLATION" project.yml ; then
            fail "project.yml has SWIFT_DEFAULT_ACTOR_ISOLATION"
          fi
          if grep -q "default-isolation" project.yml ; then
            fail "project.yml has default-isolation flag"
          fi
          grep -q "disable-dynamic-actor-isolation" project.yml || fail "missing disable-dynamic-actor-isolation"

          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "no .app"
            exit 1
          fi
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "TabView Overview/Tools/Settings + Path Access"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/ .github/ project.yml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "TabView + Tools + Path Access diagnostics [skip ci]"
          git push
