name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Remove competing workflow
        run: |
          rm -f .github/workflows/natsuk1.yml
          rm -f .github/workflows/main.yml

      - name: Fetch fresh sources
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/Helpers natsuk1/Exploit natsuk1/External
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/
          if [ ! -d natsuk1/External/AirliftFFI.xcframework ]; then
            cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/
          fi

      - name: Write patcher
        run: |
          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re, os

          def clean(s):
              s = re.sub(r"nonisolated\(unsafe\)\s+", "", s)
              s = re.sub(r"\bnonisolated\s+(?![\(])", "", s)
              s = re.sub(r"@MainActor\s*", "", s)
              s = re.sub(r"@Published\s+", "", s)
              return s

          def mark_sendable(s, name):
              if ("class " + name) in s and ("@unchecked Sendable" in s.split("class " + name, 1)[1].split("{", 1)[0]):
                  return s
              patterns = [
                  ("final class " + name + ": ObservableObject, @unchecked Sendable {",
                   "final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": ObservableObject {",
                   "final class " + name + ": @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject, @unchecked Sendable {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, ObservableObject {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": NSObject, @unchecked Sendable {",
                   "final class " + name + ": NSObject, @unchecked Sendable {"),
                  ("final class " + name + ": @unchecked Sendable {",
                   "final class " + name + ": @unchecked Sendable {"),
              ]
              for pat, repl in patterns:
                  if pat in s:
                      return s.replace(pat, repl, 1)
              return s

          def protect_shared(s):
              for name in ("static let shared", "static var shared",
                           "static let sharedInstance", "static var sharedInstance"):
                  s = re.sub(
                      r"(?<!nonisolated\(unsafe\) )\b" + re.escape(name) + r"\b",
                      "nonisolated(unsafe) " + name, s)
              return s

          def add_sendable(s):
              out = []
              for line in s.split("\n"):
                  stripped = line.strip()
                  if ("ObservableObject" in stripped or "NSObject" in stripped) and (
                      stripped.startswith("final class ")
                      or stripped.startswith("class ")):
                      if stripped.endswith(" {"):
                          new_line = line
                          if "@unchecked Sendable" not in new_line:
                              new_line = new_line[:-2].rstrip().rstrip(",") + ", @unchecked Sendable {"
                          out.append(new_line)
                          continue
                  out.append(line)
              return "\n".join(out)

          # --------- PairingController ---------
          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()

          s = s.replace("@preconcurrency import AirliftFFI\n", "import AirliftFFI\n")
          s = clean(s)

          s = re.sub(
              r"static func syncCanonicalPairingFile\(from sourcePath: String\) -> String \{.*?\n    \}",
              '''static func syncCanonicalPairingFile(from sourcePath: String) -> String {
                  let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let canonicalURL = dir.appendingPathComponent("natsuk1_pairing.plist")

                  if let data = try? Data(contentsOf: URL(fileURLWithPath: sourcePath)), !data.isEmpty {
                      if sourcePath != canonicalURL.path {
                          try? data.write(to: canonicalURL, options: .atomic)
                      }
                      customPairingFilePath = canonicalURL.path
                      return canonicalURL.path
                  }
                  return sourcePath
              }''',
              s, count=1, flags=re.S)

          s = re.sub(
              r"static func pairingFilePath\(\) -> String \{.*?\n    \}",
              '''static func pairingFilePath() -> String {
                  let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  let canonical = dir.appendingPathComponent("natsuk1_pairing.plist").path
                  if FileManager.default.fileExists(atPath: canonical) {
                      let size = (try? FileManager.default.attributesOfItem(atPath: canonical)[.size] as? Int) ?? 0
                      if size > 0 { return canonical }
                  }
                  if let custom = customPairingFilePath, FileManager.default.fileExists(atPath: custom) {
                      let size = (try? FileManager.default.attributesOfItem(atPath: custom)[.size] as? Int) ?? 0
                      if size > 0 {
                          _ = syncCanonicalPairingFile(from: custom)
                          return canonical
                      }
                  }
                  if let files = try? FileManager.default.contentsOfDirectory(atPath: dir.path) {
                      for candidate in files {
                          guard candidate.hasSuffix(".plist")
                             || candidate.hasSuffix(".mobiledevicepairing")
                             || candidate.hasSuffix(".mobilepair") else { continue }
                          let candidatePath = dir.appendingPathComponent(candidate).path
                          let size = (try? FileManager.default.attributesOfItem(atPath: candidatePath)[.size] as? Int) ?? 0
                          if size > 0 {
                              _ = syncCanonicalPairingFile(from: candidatePath)
                              return canonical
                          }
                      }
                  }
                  return canonical
              }''',
              s, count=1, flags=re.S)

          s = s.replace(
              "/// Ensures the given pairing file is mirrored to canonical aircard_pairing.plist and airlift_pairing.plist.",
              "/// Ensures the given pairing file is mirrored to canonical natsuk1_pairing.plist.")
          s = s.replace(
              "/// Checks for canonical aircard_pairing.plist, custom path, or any plist in Documents,",
              "/// Checks for canonical natsuk1_pairing.plist, custom path, or any plist in Documents,")

          s = s.replace("AirCard-iOS", "natsuk1")
          s = s.replace('"aircardPairingHostAltIRK"', '"natsuk1PairingHostAltIRK"')
          s = s.replace("aircardPairingHostAltIRK", "natsuk1PairingHostAltIRK")

          s = s.replace(
              "static var customPairingFilePath: String? = nil",
              "nonisolated(unsafe) static var customPairingFilePath: String? = nil")
          s = s.replace(
              "private let pairReadyCallback: ALPairReadyCb",
              "nonisolated(unsafe) private let pairReadyCallback: ALPairReadyCb")
          s = s.replace(
              "private let pairPinCallback: ALPairPinCb",
              "nonisolated(unsafe) private let pairPinCallback: ALPairPinCb")
          s = s.replace(
              "Unmanaged<PairingController>.fromOpaque(ctx).release()",
              "Unmanaged<PairingController>.fromOpaque(box.ptr).release()")

          if "final class RawPtrBox" not in s:
              s = s + (
                  "\n"
                  "final class RawPtrBox: @unchecked Sendable {\n"
                  "    let ptr: UnsafeMutableRawPointer\n"
                  "    init(_ ptr: UnsafeMutableRawPointer) { self.ptr = ptr }\n"
                  "}\n")

          s = s.replace(
              "            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()",
              "            let box = RawPtrBox(ctx)\n            DispatchQueue.main.async {\n                Unmanaged<PairingController>.fromOpaque(box.ptr).release()")

          open(p, "w").write(s)
          print("patched PairingController")

          # --------- NetworkStatus ---------
          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()
          s = re.sub(
              r"return String\(cString: host\)",
              "let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)",
              s)
          s = protect_shared(s)
          open(p, "w").write(s)
          print("patched NetworkStatus")

          # --------- KeepAlive ---------
          p = "natsuk1/Helpers/KeepAlive.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = clean(s)
              s = mark_sendable(s, "KeepAlive")
              s = protect_shared(s)
              open(p, "w").write(s)
              print("patched KeepAlive")

          # --------- aircard -> natsuk1 in LocalNetworkAuthorization ---------
          p = "natsuk1/Helpers/LocalNetworkAuthorization.swift"
          if os.path.exists(p):
              s = open(p).read()
              s = s.replace("_aircardprobe._tcp", "_natsuk1probe._tcp")
              s = s.replace("AirCard-iOS", "natsuk1")
              s = s.replace("aircard", "natsuk1")
              open(p, "w").write(s)
              print("patched LocalNetworkAuthorization")

          # --------- aircard -> natsuk1 in Info.plist ---------
          p = "natsuk1/Resources/Info.plist"
          if os.path.exists(p):
              s = open(p).read()
              s = s.replace("_aircardprobe._tcp", "_natsuk1probe._tcp")
              s = s.replace("aircard", "natsuk1")
              open(p, "w").write(s)
              print("patched Info.plist")

          # --------- global pass on remaining swift ---------
          def handle(fp):
              src = open(fp).read()
              new = re.sub(r"@MainActor\s*", "", src)
              new = new.replace("@preconcurrency import AirliftFFI\n", "import AirliftFFI\n")
              new = new.replace("@preconcurrency import ", "import ")
              new = new.replace("@preconcurrency\n", "")
              new = protect_shared(new)
              new = add_sendable(new)
              if new != src:
                  open(fp, "w").write(new)
                  print("cleaned " + fp)

          for root, dirs, files in os.walk("natsuk1"):
              for f in files:
                  if not f.endswith(".swift"):
                      continue
                  handle(os.path.join(root, f))
          ENDSCRIPT

      - name: Apply patch
        run: python3 /tmp/patch.py

      - name: Rewrite AirliftBridge.swift
        run: |
          cat > natsuk1/Helpers/AirliftBridge.swift <<'SWIFT'
          import Foundation
          import Combine

          final class AirliftBridge: ObservableObject, @unchecked Sendable {
              nonisolated(unsafe) static let shared = AirliftBridge()

              enum State: Equatable {
                  case idle
                  case pairing
                  case ready(pairingPath: String)
                  case running
                  case done(ok: Bool, message: String)
              }

              @Published private(set) var state: State = .idle
              @Published private(set) var pairPIN: String? = nil
              @Published private(set) var pairingStatus: String = ""
              @Published private(set) var exploitLog: [String] = []
              @Published var target: String = "/var/mobile/Library/SpringBoard"

              private var loggedLines: [String] = []

              private init() {
                  al_log_init({ _, msg in
                      guard let msg = msg else { return }
                      let line = String(cString: msg)
                      DispatchQueue.main.async {
                          AirliftBridge.shared.appendLog(line)
                      }
                  }, nil)
              }

              nonisolated private func appendLog(_ s: String) {
                  DispatchQueue.main.async {
                      self.loggedLines.append(s)
                      if self.loggedLines.count > 800 {
                          self.loggedLines.removeFirst(self.loggedLines.count - 600)
                      }
                      self.exploitLog = self.loggedLines
                  }
              }

              func logAccessibleFolders() {
                  let fm = FileManager.default
                  var lines: [String] = []
                  lines.append("[paths] home: \(NSHomeDirectory())")
                  lines.append("[paths] bundle: \(Bundle.main.bundlePath)")

                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0].path
                  lines.append("[paths] documents: \(docs)")

                  if let lib = fm.urls(for: .libraryDirectory, in: .userDomainMask).first?.path {
                      lines.append("[paths] library: \(lib)")
                  }
                  lines.append("[paths] tmp: \(NSTemporaryDirectory())")

                  if let items = try? fm.contentsOfDirectory(atPath: docs) {
                      lines.append("[docs] \(items.count) entries:")
                      for f in items.prefix(80) {
                          lines.append("[docs]   \(f)")
                      }
                  } else {
                      lines.append("[docs] cannot list")
                  }

                  let probes = [
                      "/var/mobile",
                      "/var/mobile/Library",
                      "/private/var/mobile",
                      "/private/var/mobile/Library",
                      "/var/containers/Bundle/Application",
                      "/private/var/containers/Bundle/Application",
                      "/var/mobile/Containers/Data/Application",
                      "/private/var/mobile/Containers/Data/Application",
                      "/System/Library/PrivateFrameworks",
                      "/var/jb",
                  ]
                  for p in probes {
                      var isDir: ObjCBool = false
                      let ok = fm.fileExists(atPath: p, isDirectory: &isDir)
                      lines.append("[probe] \(p) exists=\(ok) dir=\(isDir.boolValue)")
                  }

                  for l in lines { appendLog(l) }
              }

              func clearLog() {
                  loggedLines.removeAll()
                  exploitLog = []
              }

              func pairingFilePath() -> String {
                  return PairingController.pairingFilePath()
              }

              func hasPairing() -> Bool {
                  let p = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: p) else { return false }
                  let size = (try? FileManager.default.attributesOfItem(atPath: p)[.size] as? Int) ?? 0
                  return size > 0
              }

              func runPairing() {
                  guard !hasPairing() else {
                      state = .ready(pairingPath: pairingFilePath())
                      return
                  }

                  state = .pairing
                  pairingStatus = "Starting host..."
                  pairPIN = nil

                  let ctrl = PairingController.shared
                  Task {
                      do {
                          let path = try await ctrl.startAndWait()
                          self.state = .ready(pairingPath: path)
                          self.pairingStatus = "Paired"
                          self.pairPIN = nil
                      } catch is CancellationError {
                          self.state = .idle
                          self.pairingStatus = "Cancelled"
                      } catch {
                          self.state = .idle
                          self.pairingStatus = "Failed: \(error.localizedDescription)"
                      }
                  }
                  Task {
                      while case .pairing = self.state {
                          try? await Task.sleep(nanoseconds: 200_000_000)
                          self.pairingStatus = ctrl.pairingStatus
                          self.pairPIN = ctrl.pairingPIN
                      }
                  }
              }

              func cancelPairing() {
                  PairingController.shared.softCancel()
                  state = .idle
                  pairingStatus = ""
                  pairPIN = nil
              }

              func deletePairing() {
                  let fm = FileManager.default
                  let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  var removed: [String] = []

                  let names: Set<String> = [
                      "natsuk1_pairing.plist",
                      "aircard_pairing.plist",
                      "airlift_pairing.plist",
                  ]
                  for name in names {
                      let url = docs.appendingPathComponent(name)
                      if fm.fileExists(atPath: url.path) {
                          try? fm.removeItem(at: url)
                          removed.append(name)
                      }
                  }

                  if let custom = PairingController.customPairingFilePath {
                      if fm.fileExists(atPath: custom) {
                          try? fm.removeItem(atPath: custom)
                          removed.append((custom as NSString).lastPathComponent)
                      }
                  }
                  PairingController.customPairingFilePath = nil

                  if let files = try? fm.contentsOfDirectory(atPath: docs.path) {
                      for f in files {
                          guard f.hasSuffix(".plist")
                             || f.hasSuffix(".mobilepairing")
                             || f.hasSuffix(".mobilepair") else { continue }
                          try? fm.removeItem(at: docs.appendingPathComponent(f))
                          removed.append(f)
                      }
                  }

                  UserDefaults.standard.removeObject(forKey: "natsuk1PairingHostAltIRK")
                  UserDefaults.standard.removeObject(forKey: "aircardPairingHostAltIRK")

                  state = .idle
                  pairingStatus = ""
                  pairPIN = nil

                  appendLog("[delete] removed: \(removed.isEmpty ? "none" : removed.joined(separator: ", "))")
                  appendLog("[delete] hasPairing now: \(hasPairing())")
              }

              func runExploit() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      state = .done(ok: false, message: "No pairing file")
                      return
                  }

                  state = .running
                  loggedLines.removeAll()
                  exploitLog = []
                  appendLog("[exploit] start path=\(pairingPath) target=\(target)")
                  let targetDir = target

                  Task.detached {
                      var outJson: UnsafeMutablePointer<CChar>? = nil
                      var outError: UnsafeMutablePointer<CChar>? = nil

                      let rc: Int32 = pairingPath.withCString { pc in
                          targetDir.withCString { tc in
                              al_exploit_run(pc, tc, nil, nil, &outJson, &outError)
                          }
                      }

                      let jsonStr = outJson.flatMap { p -> String? in
                          let s = String(cString: p); al_string_free(p); return s
                      }
                      let errStr = outError.flatMap { p -> String? in
                          let s = String(cString: p); al_string_free(p); return s
                      }

                      await MainActor.run {
                          if rc == 0 {
                              let msg = jsonStr ?? "Canary write confirmed"
                              self.appendLog("[exploit] ok: \(msg)")
                              self.state = .done(ok: true, message: msg)
                          } else {
                              let msg = errStr ?? "rc=\(rc)"
                              self.appendLog("[exploit] fail rc=\(rc): \(msg)")
                              self.state = .done(ok: false, message: msg)
                          }
                      }
                  }
              }

              func respring() {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else {
                      appendLog("[respring] no pairing file at \(pairingPath)")
                      return
                  }
                  appendLog("[respring] invoking with \(pairingPath)")
                  Task.detached { [weak self] in
                      var outError: UnsafeMutablePointer<CChar>? = nil
                      let rc: Int32 = pairingPath.withCString { pc in
                          al_device_respring(pc, nil, nil, &outError)
                      }
                      let errStr = outError.flatMap { p -> String? in
                          let s = String(cString: p); al_string_free(p); return s
                      }
                      await MainActor.run {
                          if rc == 0 {
                              self?.appendLog("[respring] ok")
                          } else {
                              self?.appendLog("[respring] rc=\(rc) \(errStr ?? "")")
                          }
                      }
                  }
              }

              func findContainer(bundleID: String) async -> String? {
                  let pairingPath = pairingFilePath()
                  guard FileManager.default.fileExists(atPath: pairingPath) else { return nil }

                  return await withCheckedContinuation { cont in
                      DispatchQueue.global(qos: .userInitiated).async {
                          var outContainer: UnsafeMutablePointer<CChar>? = nil
                          var outError: UnsafeMutablePointer<CChar>? = nil

                          let rc: Int32 = pairingPath.withCString { pc in
                              bundleID.withCString { bc in
                                  al_find_app_container(pc, bc, nil, nil, &outContainer, &outError)
                              }
                          }

                          let containerStr = outContainer.flatMap { p -> String? in
                              let s = String(cString: p); al_string_free(p); return s
                          }
                          if let p = outError { al_string_free(p) }

                          if rc == 0, let c = containerStr {
                              cont.resume(returning: c)
                          } else {
                              cont.resume(returning: nil)
                          }
                      }
                  }
              }
          }
          SWIFT
          echo "wrote AirliftBridge.swift"

      - name: Rewrite ContentView.swift
        run: |
          cat > natsuk1/Views/ContentView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState
              @EnvironmentObject var airlift: AirliftBridge

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              NavigationLink {
                                  AirliftView().environmentObject(airlift)
                              } label: {
                                  Text(state.t("Airlift", "Airlift"))
                              }
                          } header: {
                              Label(state.t("Sandbox Escape", "Побег из песочницы"), systemImage: "bolt.shield")
                          }

                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "bolt.fill")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Exploit", "Эксплойт"), systemImage: "cpu")
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                          .foregroundColor(.primary)
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                              }
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                              } label: {
                                  Text(state.t("Copy All", "Копировать всё"))
                              }
                              .disabled(state.log.isEmpty)

                              Button(role: .destructive) {
                                  state.clear()
                              } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label(state.t("Log Actions", "Действия с логом"), systemImage: "doc.on.doc")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                              .font(.system(size: 10, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .onChange(of: state.log) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          SWIFT
          echo "wrote ContentView.swift"

      - name: Rewrite AirliftView.swift
        run: |
          cat > natsuk1/Views/AirliftView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct AirliftView: View {
              @EnvironmentObject var airlift: AirliftBridge
              @State private var didLogPaths = false

              private var localDevVPNUp: Bool {
                  NetworkStatus.interfaces().contains {
                      NetworkStatus.isTunnelInterface($0.name)
                  }
              }

              var body: some View {
                  List {
                      if !localDevVPNUp {
                          Section {
                              HStack(spacing: 10) {
                                  Image(systemName: "exclamationmark.triangle.fill")
                                      .foregroundStyle(.orange)
                                  Text("LocalDevVPN is not active. Enable it before running Airlift.")
                                      .font(.subheadline)
                                      .foregroundColor(.secondary)
                              }
                          }
                      }

                      switch airlift.state {
                      case .idle, .pairing:
                          pairingSection
                      case .ready, .running, .done:
                          exploitSection
                      }

                      Section {
                          AirliftLogView(lines: airlift.exploitLog, onClear: { airlift.clearLog() })
                              .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                      } header: {
                          Label("Log", systemImage: "apple.terminal")
                      }
                  }
                  .listStyle(.insetGrouped)
                  .scrollContentBackground(.hidden)
                  .background(Color(UIColor.systemGroupedBackground))
                  .navigationTitle("Airlift")
                  .navigationBarTitleDisplayMode(.inline)
                  .onAppear {
                      if !didLogPaths {
                          didLogPaths = true
                          airlift.logAccessibleFolders()
                      }
                  }
              }

              @ViewBuilder
              private var pairingSection: some View {
                  Section {
                      VStack(alignment: .leading, spacing: 6) {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.shield.fill")
                                  .foregroundStyle(airlift.hasPairing() ? .green : .orange)
                              Text(airlift.hasPairing() ? "Paired" : "Not paired")
                                  .font(.subheadline.bold())
                          }
                      }
                      .padding(.vertical, 4)

                      if case .pairing = airlift.state {
                          HStack(spacing: 8) {
                              ProgressView().scaleEffect(0.85)
                              Text(airlift.pairingStatus.isEmpty ? "Starting..." : airlift.pairingStatus)
                                  .font(.subheadline)
                                  .foregroundColor(.secondary)
                          }
                      }

                      if let pin = airlift.pairPIN {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("ENTER THIS PIN")
                                  .font(.caption2.bold())
                                  .foregroundStyle(.secondary)
                              Text(pin)
                                  .font(.system(size: 36, weight: .black, design: .monospaced))
                                  .foregroundStyle(.orange)
                              Button {
                                  if let url = URL(string: UIApplication.openSettingsURLString) {
                                      UIApplication.shared.open(url)
                                  }
                              } label: {
                                  Label("Open Settings", systemImage: "arrow.up.forward.app")
                                      .frame(maxWidth: .infinity)
                              }
                              .buttonStyle(.borderedProminent)
                              .tint(.orange)
                          }
                          .padding(12)
                          .background(Color.orange.opacity(0.12))
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                      }
                  } header: {
                      Label("Pairing", systemImage: "antenna.radiowaves.left.and.right")
                  }

                  Section {
                      if case .pairing = airlift.state {
                          Button(role: .destructive) {
                              airlift.cancelPairing()
                          } label: {
                              Text("Cancel Pairing")
                                  .frame(maxWidth: .infinity)
                          }
                      } else if airlift.hasPairing() {
                          Button(role: .destructive) {
                              airlift.deletePairing()
                          } label: {
                              Text("Delete Pairing")
                                  .frame(maxWidth: .infinity)
                          }
                      } else {
                          Button {
                              airlift.runPairing()
                          } label: {
                              HStack {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                  Text("Start Pairing")
                                  Spacer()
                              }
                          }
                      }
                  }
              }

              @ViewBuilder
              private var exploitSection: some View {
                  Section {
                      HStack {
                          Text("Target")
                          Spacer()
                          TextField("/var/mobile/Library/SpringBoard", text: Binding(
                              get: { airlift.target },
                              set: { airlift.target = $0 }
                          ))
                          .font(.system(size: 12, design: .monospaced))
                          .multilineTextAlignment(.trailing)
                          .autocorrectionDisabled()
                          .textInputAutocapitalization(.never)
                      }
                  } header: {
                      Label("Exploit", systemImage: "bolt.shield")
                  }

                  Section {
                      Button {
                          airlift.runExploit()
                      } label: {
                          HStack {
                              Image(systemName: "bolt.fill")
                              Text("Run Exploit")
                              Spacer()
                          }
                      }
                      .disabled(airlift.state == .running || !localDevVPNUp)

                      Button {
                          airlift.respring()
                      } label: {
                          HStack {
                              Image(systemName: "arrow.clockwise")
                              Text("Respring (device)")
                              Spacer()
                          }
                      }
                      .disabled(airlift.state == .running)

                      Button(role: .destructive) {
                          airlift.deletePairing()
                      } label: {
                          Text("Delete Pairing")
                              .frame(maxWidth: .infinity)
                      }
                      .disabled(airlift.state == .running)
                  }
              }
          }

          struct AirliftLogView: View {
              let lines: [String]
              let onClear: () -> Void
              @State private var copied = false

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(lines.isEmpty ? "No output yet." : lines.joined(separator: "\n"))
                              .font(.system(size: 9, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(lines.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .frame(maxHeight: 260)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
                      .onChange(of: lines.count) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
                  .contextMenu {
                      Button {
                          UIPasteboard.general.string = lines.joined(separator: "\n")
                      } label: {
                          Label("Copy All", systemImage: "doc.on.doc")
                      }
                      Button(role: .destructive) {
                          onClear()
                      } label: {
                          Label("Clear", systemImage: "trash")
                      }
                  }
              }
          }
          SWIFT
          echo "wrote AirliftView.swift"

      - name: Rewrite AboutView.swift
        run: |
          cat > natsuk1/Views/AboutView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          struct AboutView: View {
              @Environment(\.openURL) private var openURL
