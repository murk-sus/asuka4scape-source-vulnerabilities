name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"
  CACHE_SALT: v7

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Write nk_api.c
        run: |
          cat > natsuk1/Exploit/nk_api.c <<'CEOF'
          #include "nk_api.h"
          #include "nk_offsets.h"
          #include <stdarg.h>
          #include <stdio.h>
          #include <time.h>

          static void (*g_fn)(const char *) = NULL;
          static double g_t0 = 0.0;
          static nk_log_level_t g_lvl = NK_LOG_INFO;

          static double nk_now_ms(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (double)ts.tv_sec * 1000.0 + (double)ts.tv_nsec / 1e6;
          }

          void nk_set_log(void (*fn)(const char *)) {
              g_fn = fn;
              if (g_t0 == 0.0) g_t0 = nk_now_ms();
          }

          void nk_set_log_level(nk_log_level_t lvl) { g_lvl = lvl; }
          nk_log_level_t nk_get_log_level(void) { return g_lvl; }

          static const char *lvl_str(nk_log_level_t l) {
              switch (l) {
                  case NK_LOG_TRACE: return "TRC";
                  case NK_LOG_DEBUG: return "DBG";
                  case NK_LOG_INFO:  return "INF";
                  case NK_LOG_WARN:  return "WRN";
                  case NK_LOG_ERROR: return "ERR";
              }
              return "???";
          }

          void nk_logx(nk_log_level_t lvl, const char *tag, const char *fmt, ...) {
              if (lvl < g_lvl || !g_fn) return;
              char body[512];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[640];
              double t = nk_now_ms() - g_t0;
              snprintf(out, sizeof(out), "[%6.1f][%s][%-6s] %s", t, lvl_str(lvl), tag, body);
              g_fn(out);
          }

          void nk_log(const char *fmt, ...) {
              if (!g_fn) return;
              char body[512];
              va_list ap; va_start(ap, fmt);
              vsnprintf(body, sizeof(body), fmt, ap);
              va_end(ap);
              char out[640];
              double t = nk_now_ms() - g_t0;
              snprintf(out, sizeof(out), "[%6.1f][INF][MAIN  ] %s", t, body);
              g_fn(out);
          }

          void nk_rule(void) { nk_log("----"); }

          int nk_run(void) {
              NK_INFO("BASE", "kernel          %016llX", (unsigned long long)NK_KERNEL_BASE);
              NK_INFO("BASE", "sysent          %016llX (%d)",
                      (unsigned long long)NK_SYSENT_BASE, NK_SYSENT_COUNT);
              NK_INFO("BASE", "mach_trap_table %016llX", (unsigned long long)NK_MACH_TRAP_TABLE);
              nk_rule();

              NK_INFO("PRIM", "copyin   %016llX", (unsigned long long)NK_FN_COPYIN);
              NK_INFO("PRIM", "copyout  %016llX", (unsigned long long)NK_FN_COPYOUT);
              NK_INFO("PRIM", "kalloc   %016llX", (unsigned long long)NK_FN_KALLOC_EXT);
              NK_INFO("PRIM", "kfree    %016llX", (unsigned long long)NK_FN_KFREE_EXT);
              nk_rule();

              NK_INFO("STRUCT", "proc_pid    %X", NK_OFF_PROC_PID);
              NK_INFO("STRUCT", "proc_ucred  %X", NK_OFF_PROC_UCRED);
              NK_INFO("STRUCT", "task_thread %X", NK_OFF_TASK_THREAD);
              nk_rule();

              NK_WARN("STATE", "No kernel R/W primitive.");
              NK_WARN("STATE", "Reference data only.");
              nk_rule();

              return 0;
          }

          int nk_full_exploit(void) { return nk_run(); }

          uint64_t nk_get_kernel_base(void)     { return NK_KERNEL_BASE; }
          uint64_t nk_get_sysent_base(void)     { return NK_SYSENT_BASE; }
          uint64_t nk_get_mach_trap_table(void) { return NK_MACH_TRAP_TABLE; }
          CEOF

      - name: Write natsuk1.swift
        run: |
          cat > natsuk1/natsuk1.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit
          import Foundation

          final class LockedBuffer: @unchecked Sendable {
              static let shared = LockedBuffer()
              private let lock = NSLock()
              private var value: String = ""

              private init() {}

              func append(_ s: String) {
                  lock.lock()
                  value += s
                  value += "\n"
                  if value.count > 10000 {
                      value = String(value.suffix(6000))
                  }
                  lock.unlock()
              }

              func drain() -> String {
                  lock.lock()
                  let v = value
                  value = ""
                  lock.unlock()
                  return v
              }

              func clear() {
                  lock.lock()
                  value = ""
                  lock.unlock()
              }
          }

          private let cCallback: @convention(c) (UnsafePointer<CChar>?) -> Void = { line in
              guard let line = line else { return }
              var bytes: [UInt8] = []
              var p = line
              while p.pointee != 0 {
                  bytes.append(UInt8(bitPattern: p.pointee))
                  p = p.advanced(by: 1)
              }
              LockedBuffer.shared.append(String(decoding: bytes, as: UTF8.self))
          }

          private func osVersionString() -> String {
              let v = ProcessInfo.processInfo.operatingSystemVersion
              return "\(v.majorVersion).\(v.minorVersion)"
          }

          private func appVersionString() -> String {
              Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
          }

          private var isSupportedIOS: Bool {
              ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 27
          }

          @main
          struct natsuk1App: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                  }
              }
          }

          struct RootView: View {
              @StateObject private var state = AppState.shared
              @StateObject private var offsets = OffsetsStore.shared
              @AppStorage("auto_run") private var auto_run = false
              @AppStorage("keep_alive_audio") private var keep_alive_audio = false
              @AppStorage("keep_alive_location") private var keep_alive_location = false

              init() {
                  UserDefaults.standard.register(defaults: [
                      "auto_run": false,
                      "keep_alive_audio": false,
                      "keep_alive_location": false,
                      "lang": "en",
                  ])
              }

              var body: some View {
                  Group {
                      if isSupportedIOS {
                          ContentView()
                              .environmentObject(state)
                              .environmentObject(offsets)
                              .onAppear {
                                  nk_set_log(cCallback)
                                  if state.log.isEmpty {
                                      state.append("[*] natsuk1 v\(appVersionString())")
                                      state.append("[*] iOS \(osVersionString()) / arm64e")
                                      if let version = OffsetsStore.activeVersion {
                                          state.append("[*] offsets: \(version.device) / iOS \(version.ios) (\(version.build))")
                                      }
                                      state.append("")
                                  }
                                  if keep_alive_audio { KeepAlive.shared.startAudio() }
                                  if keep_alive_location { KeepAlive.shared.startLocation() }
                                  if auto_run {
                                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                                          state.run()
                                      }
                                  }
                              }
                              .onChange(of: keep_alive_audio) { _, value in
                                  if value { KeepAlive.shared.startAudio() } else { KeepAlive.shared.stopAudio() }
                              }
                              .onChange(of: keep_alive_location) { _, value in
                                  if value { KeepAlive.shared.startLocation() } else { KeepAlive.shared.stopLocation() }
                              }
                              .overlay {
                                  if state.show_respring {
                                      RespringView()
                                          .brightness(-1.0)
                                          .ignoresSafeArea()
                                  }
                              }
                      } else {
                          NotSupportedView(version: osVersionString())
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }

          struct NotSupportedView: View {
              let version: String

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "exclamationmark.triangle.fill")
                          .font(.system(size: 56))
                          .foregroundStyle(.orange)
                      Text("Not supported for iOS \(version)")
                          .font(.title3)
                          .fontWeight(.semibold)
                          .multilineTextAlignment(.center)
                      Text("natsuk1 runs on iOS 27 only.")
                          .font(.subheadline)
                          .foregroundColor(.secondary)
                          .multilineTextAlignment(.center)
                  }
                  .padding(40)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color(UIColor.systemGroupedBackground).ignoresSafeArea())
              }
          }

          @MainActor
          final class AppState: ObservableObject {
              static let shared = AppState()

              enum Status {
                  case idle, running, ok, failed
                  var color: Color {
                      switch self {
                      case .idle:    return .secondary
                      case .running: return .orange
                      case .ok:      return .green
                      case .failed:  return .red
                      }
                  }
              }

              @Published var log: String = ""
              @Published var status: Status = .idle
              @Published var running: Bool = false
              @Published var show_respring: Bool = false

              @Published var lang: String {
                  didSet { UserDefaults.standard.set(lang, forKey: "lang") }
              }

              private init() {
                  self.lang = UserDefaults.standard.string(forKey: "lang") ?? "en"
                  startFlusher()
              }

              func t(_ en: String, _ ru: String) -> String {
                  lang == "ru" ? ru : en
              }

              private func startFlusher() {
                  Task { @MainActor [weak self] in
                      while !Task.isCancelled {
                          try? await Task.sleep(for: .milliseconds(300))
                          guard let self else { return }
                          let chunk = LockedBuffer.shared.drain()
                          guard !chunk.isEmpty else { continue }
                          var newLog = self.log
                          newLog += chunk
                          if newLog.count > 30000 {
                              newLog = String(newLog.suffix(20000))
                          }
                          self.log = newLog
                      }
                  }
              }

              func append(_ s: String) {
                  LockedBuffer.shared.append(s)
              }

              func run() {
                  if running { return }
                  running = true
                  status = .running

                  Task.detached {
                      _ = nk_full_exploit()
                      await MainActor.run {
                          AppState.shared.running = false
                          AppState.shared.status = .ok
                      }
                  }
              }

              func respring() {
                  show_respring = true
              }

              func clear() {
                  LockedBuffer.shared.clear()
                  log = ""
              }
          }
          SWIFTEOF

      - name: Write ContentView
        run: |
          cat > natsuk1/Views/ContentView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var state: AppState

              @State private var show_settings: Bool = false
              @State private var show_device: Bool = false
              @State private var copied: Bool = false

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              Button {
                                  state.run()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "bolt.fill")
                                          .frame(width: 22, alignment: .center)
                                      Text(state.t("Run Exploit", "Запустить эксплойт"))
                                      Spacer(minLength: 8)
                                      if state.running {
                                          ProgressView().scaleEffect(0.8)
                                      }
                                  }
                              }
                              .disabled(state.running)
                          } header: {
                              Label(state.t("Actions", "Действия"), systemImage: "play.circle")
                          }

                          Section {
                              HStack {
                                  Text(state.t("Status", "Статус"))
                                  Spacer()
                                  Circle()
                                      .fill(state.status.color)
                                      .frame(width: 8, height: 8)
                                      .shadow(color: state.status.color.opacity(0.7), radius: 3)
                              }

                              Button {
                                  show_device = true
                              } label: {
                                  HStack(spacing: 8) {
                                      Text(state.t("Device", "Устройство"))
                                      Spacer(minLength: 8)
                                      Text(DeviceName.full())
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                          .lineLimit(1)
                                          .minimumScaleFactor(0.7)
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 13, weight: .semibold))
                                          .foregroundStyle(Color(UIColor.tertiaryLabel))
                                  }
                              }
                          } header: {
                              Label(state.t("Runtime", "Состояние"), systemImage: "waveform.path.ecg")
                          }

                          Section {
                              LogView()
                                  .environmentObject(state)
                                  .terminalPlatter()
                                  .listRowInsets(EdgeInsets(top: 0, leading: 16, bottom: 0, trailing: 16))
                          } header: {
                              Label(state.t("Logs", "Логи"), systemImage: "apple.terminal")
                          }

                          Section {
                              Button {
                                  UIPasteboard.general.string = state.log
                                  copied = true
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                      copied = false
                                  }
                              } label: {
                                  Text(copied
                                       ? state.t("Copied!", "Скопировано!")
                                       : state.t("Copy All", "Копировать всё"))
                              }

                              Button(role: .destructive) {
                                  state.clear()
                              } label: {
                                  Text(state.t("Clear", "Очистить"))
                              }
                              .disabled(state.log.isEmpty)
                          } header: {
                              Label(state.t("Log Actions", "Действия с логом"), systemImage: "doc.on.doc")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .scrollEdgeEffectHidden(true, for: .top)
                      .navigationTitle("natsuk1")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbarBackground(.visible, for: .navigationBar)
                      .toolbarBackground(Color(UIColor.systemGroupedBackground), for: .navigationBar)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button {
                                  show_settings = true
                              } label: {
                                  Image(systemName: "gear")
                                      .foregroundStyle(Color(UIColor.tertiaryLabel))
                              }
                          }
                      }
                      .sheet(isPresented: $show_settings) {
                          SettingsView()
                              .environmentObject(state)
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                      .sheet(isPresented: $show_device) {
                          DeviceInfoView()
                              .presentationBackground(Color(UIColor.systemGroupedBackground))
                      }
                  }
              }
          }

          struct LogView: View {
              @EnvironmentObject var state: AppState

              var body: some View {
                  ScrollViewReader { proxy in
                      ScrollView(showsIndicators: false) {
                          Text(state.log.isEmpty ? "Awaiting execution." : state.log)
                              .font(.system(size: 10, design: .monospaced))
                              .multilineTextAlignment(.leading)
                              .foregroundColor(state.log.isEmpty ? .secondary : .primary)
                              .frame(maxWidth: .infinity, alignment: .leading)

                          Spacer(minLength: 0)
                              .id(0)
                      }
                      .onChange(of: state.log) { _, _ in
                          withAnimation(.linear(duration: 0.05)) {
                              proxy.scrollTo(0, anchor: .bottom)
                          }
                      }
                  }
              }
          }

          private extension View {
              func terminalPlatter() -> some View {
                  self
                      .frame(maxWidth: .infinity)
                      .frame(minHeight: 180, idealHeight: 260, maxHeight: 400)
                      .padding(10)
                      .background(Color(UIColor.secondarySystemGroupedBackground))
                      .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
              }
          }
          SWIFTEOF

      - name: Write SettingsView
        run: |
          cat > natsuk1/Views/SettingsView.swift <<'SWIFTEOF'
          import SwiftUI
          import UIKit

          struct SettingsView: View {
              @Environment(\.dismiss) private var dismiss
              @EnvironmentObject var state: AppState
              @EnvironmentObject var offsets: OffsetsStore

              @AppStorage("auto_run")   private var auto_run: Bool = false
              @AppStorage("verbose")    private var verbose: Bool = true
              @AppStorage("keep_alive_audio")    private var keep_alive_audio: Bool = false
              @AppStorage("keep_alive_location") private var keep_alive_location: Bool = false

              private var appName: String {
                  Bundle.main.infoDictionary?["CFBundleDisplayName"] as? String
                      ?? Bundle.main.infoDictionary?["CFBundleName"] as? String
                      ?? "natsuk1"
              }

              private var version: String {
                  Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String ?? "1.0.0"
              }

              private var appIcon: UIImage? {
                  if let icons = Bundle.main.infoDictionary?["CFBundleIcons"] as? [String: Any],
                     let primary = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = primary["CFBundleIconFiles"] as? [String],
                     let last = files.last {
                      return UIImage(named: last)
                  }
                  return UIImage(named: "AppIcon")
              }

              private var activeVersionLabel: String {
                  guard let v = OffsetsStore.activeVersion else { return "unknown" }
                  return "\(v.device) / iOS \(v.ios) (\(v.build))"
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
                              HStack(spacing: 14) {
                                  Group {
                                      if let icon = appIcon {
                                          Image(uiImage: icon)
                                              .resizable()
                                              .aspectRatio(contentMode: .fill)
                                      } else {
                                          ZStack {
                                              LinearGradient(
                                                  colors: [
                                                      Color(red: 0.65, green: 0.30, blue: 0.90),
                                                      Color(red: 0.30, green: 0.65, blue: 0.95)
                                                  ],
                                                  startPoint: .topLeading,
                                                  endPoint: .bottomTrailing
                                              )
                                              Image(systemName: "bolt.fill")
                                                  .font(.system(size: 26, weight: .semibold))
                                                  .foregroundStyle(.white)
                                          }
                                      }
                                  }
                                  .frame(width: 56, height: 56)
                                  .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))

                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(appName)
                                          .font(.title3)
                                          .fontWeight(.semibold)
                                      Text("Version \(version)")
                                          .font(.subheadline)
                                          .foregroundColor(.secondary)
                                  }
                                  Spacer(minLength: 8)
                              }
                              .padding(.vertical, 4)

                              NavigationLink {
                                  AboutView().environmentObject(state)
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "info.circle")
                                          .frame(width: 22, alignment: .center)
                                      Text("Credits")
                                      Spacer(minLength: 8)
                                  }
                              }
                          } header: {
                              Label("About", systemImage: "info.circle")
                          }

                          Section {
                              HStack(spacing: 12) {
                                  Image(systemName: "cpu")
                                      .frame(width: 22, alignment: .center)
                                      .foregroundStyle(.secondary)
                                  Text("Offsets")
                                      .foregroundStyle(.secondary)
                                  Spacer(minLength: 8)
                                  Text(activeVersionLabel)
                                      .font(.system(size: 12, design: .monospaced))
                                      .foregroundColor(.secondary)
                                      .lineLimit(1)
                                      .truncationMode(.middle)
                              }
                              .padding(.vertical, 2)

                              NavigationLink {
                                  OffsetsView().environmentObject(offsets)
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "list.number")
                                          .frame(width: 22, alignment: .center)
                                      Text("Modify Offsets")
                                      Spacer(minLength: 8)
                                      Text("\(offsets.filledCount())/\(offsets.totalCount())")
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label("Exploit", systemImage: "cpu")
                          }

                          Section {
                              Toggle(isOn: $keep_alive_audio) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Silent Audio")
                                      Text("Plays inaudible audio so iOS keeps the app running.")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                              }

                              Toggle(isOn: $keep_alive_location) {
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Background Location")
                                      Text("Uses low-accuracy location to stay alive when an activity needs it.")
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                              }
                          } header: {
                              Label("Background Keep-Alive", systemImage: "waveform.circle")
                          }

                          Section {
                              Toggle("Auto Run on Launch", isOn: $auto_run)
                              Toggle("Verbose Output", isOn: $verbose)
                          } header: {
                              Label("Options", systemImage: "gearshape")
                          }

                          Section {
                              Button {
                                  state.respring()
                              } label: {
                                  HStack(spacing: 12) {
                                      Image(systemName: "arrow.clockwise")
                                          .frame(width: 22, alignment: .center)
                                      Text("Respring")
                                      Spacer(minLength: 8)
                                  }
                              }
                          } header: {
                              Label("Tools", systemImage: "wrench.and.screwdriver")
                          }
                      }
                      .listStyle(.insetGrouped)
                      .scrollContentBackground(.hidden)
                      .background(Color(UIColor.systemGroupedBackground))
                      .scrollEdgeEffectHidden(true, for: .top)
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.large)
                      .toolbarBackground(.visible, for: .navigationBar)
                      .toolbarBackground(Color(UIColor.systemGroupedBackground), for: .navigationBar)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { dismiss() }
                                  .fontWeight(.semibold)
                          }
                      }
                  }
              }
          }
          SWIFTEOF

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install xcodegen ldid
          brew link --overwrite xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
            build/SDKStatCaches.noindex
          key: dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-${{ hashFiles('natsuk1/**/*.swift', 'natsuk1/**/*.c', 'natsuk1/**/*.h', 'project.yml') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.CACHE_SALT }}-
            dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build
        id: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package app for handoff
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          APP_DIR="$(dirname "$APP_PATH")"
          APP_NAME="$(basename "$APP_PATH")"

          COPYFILE_DISABLE=1 tar -czf natsuk1-app.tar.gz -C "$APP_DIR" "$APP_NAME"
          ls -lh natsuk1-app.tar.gz

      - name: Upload app tarball
        uses: actions/upload-artifact@v6
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Commit fixes if any
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "UI polish: tinted icons, solid nav bar, cleaner logs [skip ci]"
          git push
