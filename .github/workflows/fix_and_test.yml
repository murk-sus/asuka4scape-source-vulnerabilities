name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Fetch fresh sources from AirCard
        run: |
          set -euo pipefail
          rm -rf /tmp/aircard
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/aircard
          mkdir -p natsuk1/Helpers natsuk1/Exploit natsuk1/External
          cp /tmp/aircard/ios-app/PairingController.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/NetworkStatus.swift natsuk1/Helpers/
          cp /tmp/aircard/ios-app/GrappaHelper.h natsuk1/Exploit/
          cp /tmp/aircard/ios-app/GrappaHelper.m natsuk1/Exploit/
          if [ ! -d natsuk1/External/AirliftFFI.xcframework ]; then
            cp -R /tmp/aircard/AirliftFFI.xcframework natsuk1/External/
          fi

      - name: Write patcher
        run: |
          cat > /tmp/patch.py <<'ENDSCRIPT'
          import re

          p = "natsuk1/Helpers/PairingController.swift"
          s = open(p).read()

          s = s.replace("import AirliftFFI\n", "")

          s = re.sub(r"^@MainActor\s*\n", "", s, flags=re.M)
          s = re.sub(r"^(\s*)@Published\s+", r"\1", s, flags=re.M)

          s = s.replace(
              "final class PairingController: ObservableObject {",
              "final class PairingController: @unchecked Sendable {")
          s = s.replace(
              "final class PairingController: ObservableObject, @unchecked Sendable {",
              "final class PairingController: @unchecked Sendable {")

          s = re.sub(
              r"^(\s*)private static let altIRKKey",
              r"\1nonisolated(unsafe) private static let altIRKKey",
              s, flags=re.M)

          s = re.sub(
              r"^(\s*)static var customPairingFilePath",
              r"\1nonisolated(unsafe) static var customPairingFilePath",
              s, flags=re.M)

          s = s.replace(
              "nonisolated private static var storedAltIRK",
              "nonisolated(unsafe) private static var storedAltIRK")
          s = s.replace(
              "nonisolated(unsafe) private static var storedAltIRK",
              "nonisolated(unsafe) private static var storedAltIRK")

          s = re.sub(
              r"^private let pairReadyCallback",
              "nonisolated(unsafe) private let pairReadyCallback",
              s, flags=re.M)
          s = re.sub(
              r"^private let pairPinCallback",
              "nonisolated(unsafe) private let pairPinCallback",
              s, flags=re.M)

          s = s.replace('private let hostName = "AirCard-iOS"',
                        'private let hostName = "natsuk1"')
          s = s.replace('Pair with AirCard-iOS', 'Pair with natsuk1')
          s = s.replace('Settings › AirCard-iOS › Local Network',
                        'Settings › natsuk1 › Local Network')

          open(p, "w").write(s)
          print("patched PairingController")

          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()
          s = s.replace(
              "        return String(cString: host)",
              "        let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)")
          open(p, "w").write(s)
          print("patched NetworkStatus")
          ENDSCRIPT

      - name: Apply patch
        run: python3 /tmp/patch.py

      - name: Patch KeepAlive
        run: |
          set -euo pipefail
          cd natsuk1/Helpers
          if [ -f KeepAlive.swift ]; then
            python3 <<'ENDSCRIPT'
          import re
          p = "KeepAlive.swift"
          s = open(p).read()
          s = re.sub(r"^@MainActor\s*\n", "", s, flags=re.M)
          s = re.sub(r"^(\s*)@Published\s+", r"\1", s, flags=re.M)
          s = s.replace(
              "final class KeepAlive: NSObject, ObservableObject, @unchecked Sendable {",
              "final class KeepAlive: NSObject, @unchecked Sendable {")
          s = s.replace(
              "final class KeepAlive: NSObject, ObservableObject {",
              "final class KeepAlive: NSObject, @unchecked Sendable {")
          s = re.sub(r"^(\s*)static let shared = KeepAlive\(\)",
                     r"\1nonisolated(unsafe) static let shared = KeepAlive()",
                     s, flags=re.M)
          open(p, "w").write(s)
          print("patched KeepAlive")
          ENDSCRIPT
          fi

      - name: Verify
        run: |
          set -euo pipefail
          cd natsuk1/Helpers

          echo "===== altIRKKey ====="
          grep -n "altIRKKey" PairingController.swift || true
          echo "===== callbacks ====="
          grep -n "pairReadyCallback\|pairPinCallback" PairingController.swift || true
          echo "===== class decl ====="
          grep -n "class PairingController" PairingController.swift || true
          echo "===== class KeepAlive ====="
          grep -n "class KeepAlive" KeepAlive.swift || true
          echo "===== cString ====="
          grep -n "String(cString: host)" NetworkStatus.swift || true

          fail() { echo "FAIL: $1"; exit 1; }

          grep -q "nonisolated(unsafe) private static let altIRKKey" PairingController.swift || fail "altIRKKey"
          grep -q "nonisolated(unsafe) private let pairReadyCallback" PairingController.swift || fail "pairReadyCallback"
          grep -q "nonisolated(unsafe) private let pairPinCallback" PairingController.swift || fail "pairPinCallback"
          grep -q "nonisolated(unsafe) static let shared = KeepAlive()" KeepAlive.swift || fail "KeepAlive.shared"

          if grep -q "final class PairingController.*ObservableObject" PairingController.swift; then fail "PairingController ObservableObject"; fi
          if grep -q "final class KeepAlive.*ObservableObject" KeepAlive.swift; then fail "KeepAlive ObservableObject"; fi
          if grep -q "String(cString: host)" NetworkStatus.swift; then fail "String(cString:)"; fi

          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Swift 6.2 isolation fix"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Fresh PairingController + KeepAlive with nonisolated(unsafe) [skip ci]"
          git push
