name: 1 · Fix and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'natsuk1.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Fix Swift 6.2 isolation
        run: |
          set -euo pipefail
          cd natsuk1/Helpers

          # PairingController: nonisolated static property + nonisolated callbacks
          sed -i '' 's/^    private static let altIRKKey/    nonisolated(unsafe) private static let altIRKKey/' PairingController.swift
          sed -i '' 's/^    static var customPairingFilePath/    nonisolated(unsafe) static var customPairingFilePath/' PairingController.swift
          sed -i '' 's/^private let pairReadyCallback/nonisolated(unsafe) private let pairReadyCallback/' PairingController.swift
          sed -i '' 's/^private let pairPinCallback/nonisolated(unsafe) private let pairPinCallback/' PairingController.swift
          sed -i '' 's/final class PairingController: ObservableObject, @unchecked Sendable/final class PairingController: @unchecked Sendable/' PairingController.swift
          sed -i '' 's/final class PairingController: ObservableObject/final class PairingController: @unchecked Sendable/' PairingController.swift
          sed -i '' '/^@MainActor$/d' PairingController.swift
          sed -i '' 's/^@Published //' PairingController.swift

          # KeepAlive: nonisolated static property + remove ObservableObject
          sed -i '' 's/^    static let shared = KeepAlive()/    nonisolated(unsafe) static let shared = KeepAlive()/' KeepAlive.swift
          sed -i '' 's/final class KeepAlive: NSObject, ObservableObject, @unchecked Sendable/final class KeepAlive: NSObject, @unchecked Sendable/' KeepAlive.swift
          sed -i '' 's/final class KeepAlive: NSObject, ObservableObject/final class KeepAlive: NSObject, @unchecked Sendable/' KeepAlive.swift
          sed -i '' '/^@MainActor$/d' KeepAlive.swift
          sed -i '' 's/^@Published //' KeepAlive.swift

          # NetworkStatus: fix deprecated String(cString:)
          sed -i '' 's/return String(cString: host)/let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n        return String(decoding: bytes, as: UTF8.self)/' NetworkStatus.swift

          echo "===== altIRKKey line ====="
          grep -n "altIRKKey" PairingController.swift || true
          echo "===== class decls ====="
          grep -n "class PairingController" PairingController.swift || true
          grep -n "class KeepAlive" KeepAlive.swift || true
          echo "===== cString check ====="
          grep -n "String(cString: host)" NetworkStatus.swift && echo "NOT FIXED" || echo "fixed"

      - name: Verify
        run: |
          set -euo pipefail
          grep -q "nonisolated(unsafe) private static let altIRKKey" natsuk1/Helpers/PairingController.swift
          grep -q "nonisolated(unsafe) private let pairReadyCallback" natsuk1/Helpers/PairingController.swift
          grep -q "nonisolated(unsafe) private let pairPinCallback" natsuk1/Helpers/PairingController.swift
          grep -q "nonisolated(unsafe) static let shared = KeepAlive()" natsuk1/Helpers/KeepAlive.swift
          ! grep -q "final class PairingController.*ObservableObject" natsuk1/Helpers/PairingController.swift
          ! grep -q "final class KeepAlive.*ObservableObject" natsuk1/Helpers/KeepAlive.swift
          ! grep -q "String(cString: host)" natsuk1/Helpers/NetworkStatus.swift
          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          ls -lh natsuk1.ipa
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes --cleanup-tag
          fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" \
            --title "Development" \
            --prerelease \
            --latest=false \
            --notes "Swift 6.2 isolation fix"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Swift 6.2 nonisolated(unsafe) for static properties [skip ci]"
          git push
