              ENABLE_USER_SCRIPT_SANDBOXING: NO
              ENABLE_MODULE_VERIFIER: NO
              VALIDATE_PRODUCT: NO
              ALWAYS_SEARCH_USER_PATHS: NO
              CLANG_WARN_DOCUMENTATION_COMMENTS: NO
              CLANG_WARN_UNREACHABLE_CODE: NO
              CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
              GCC_WARN_UNINITIALIZED_AUTOS: NO
              GCC_WARN_UNDECLARED_SELECTOR: NO
              GCC_WARN_UNUSED_FUNCTION: NO
              GCC_WARN_UNUSED_VARIABLE: NO
              ENABLE_STRICT_OBJC_MSGSEND: NO
              MTL_ENABLE_DEBUG_INFO: NO
              MTL_FAST_MATH: YES
              GCC_NO_COMMON_BLOCKS: YES
              CLANG_LTO: NO
              LLVM_LTO: NO
            configs:
              Debug:
                SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                SWIFT_COMPILATION_MODE: singlefile
                GCC_OPTIMIZATION_LEVEL: "0"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "DEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: YES
                DEBUG_INFORMATION_FORMAT: dwarf
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
                ENABLE_TESTABILITY: YES
              Release:
                SWIFT_OPTIMIZATION_LEVEL: "-Osize"
                SWIFT_COMPILATION_MODE: wholemodule
                SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
                GCC_OPTIMIZATION_LEVEL: "s"
                GCC_PREPROCESSOR_DEFINITIONS:
                  - "NDEBUG=1"
                  - "$(inherited)"
                ONLY_ACTIVE_ARCH: NO
                DEBUG_INFORMATION_FORMAT: dwarf
                ENABLE_NS_ASSERTIONS: NO
                ENABLE_TESTABILITY: NO
                MTL_FAST_MATH: YES
                GCC_INLINES_ARE_PRIVATE_EXTERN: YES
                GCC_SYMBOLS_PRIVATE_EXTERN: YES
                DEAD_CODE_STRIPPING: YES
                DEPLOYMENT_POSTPROCESSING: YES
                STRIP_INSTALLED_PRODUCT: YES
                STRIP_STYLE: all
                STRIPFLAGS: "-S -x"
                COPY_PHASE_STRIP: YES
                LLVM_LTO: YES
                LLVM_LTO_MODE: thin

          targets:
            natsuk1:
              type: application
              platform: iOS
              sources:
                - path: natsuk1/natsuk1.swift
                - path: natsuk1/bridging.h
                - path: natsuk1/Helpers
                - path: natsuk1/Views
                - path: natsuk1/Exploit
                - path: natsuk1/Resources/Assets.xcassets
                  buildPhase: resources
                - path: natsuk1/Offsets
                  type: folder
                  buildPhase: resources
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: WebKit.framework
                - sdk: AVFoundation.framework
                - sdk: CoreLocation.framework
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.natsuk1.exploit
                  PRODUCT_NAME: natsuk1
                  INFOPLIST_FILE: natsuk1/Resources/Info.plist
                  CODE_SIGN_ENTITLEMENTS: natsuk1/Resources/natsuk1.entitlements
                  SWIFT_OBJC_BRIDGING_HEADER: natsuk1/bridging.h
                  SWIFT_OBJC_INTERFACE_HEADER_NAME: natsuk1-Swift.h
                  OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks"
                  OTHER_CFLAGS: -fno-autolink -std=c17 -Oz -Wno-everything -fno-objc-arc-exceptions -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fomit-frame-pointer
                  OTHER_LDFLAGS: -Wl,-dead_strip -Wl,-dead_strip_dylibs -Wl,-x -Wl,-S -fobjc-arc -lz $(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a -lc++ -ObjC
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/natsuk1/External/AirliftFFI.xcframework/ios-arm64/Headers $(SRCROOT)/natsuk1/Exploit"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  ASSETCATALOG_COMPILER_OPTIMIZATION: space
                  ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO
                  ENABLE_ONLY_ACTIVE_RESOURCES: YES
          YAML

      - name: Verify
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1"; exit 1; }
          SRC_PATHS="natsuk1/Helpers natsuk1/Views natsuk1/Exploit natsuk1/Resources natsuk1/Offsets natsuk1/natsuk1.swift natsuk1/bridging.h"

          grep -rqi "aircard" $SRC_PATHS && fail "aircard present"
          grep -rqi "airlift_pairing" $SRC_PATHS && fail "airlift_pairing present"
          grep -rq "@MainActor" $SRC_PATHS && fail "@MainActor present"
          grep -rq "@preconcurrency" $SRC_PATHS && fail "@preconcurrency present"
          grep -rnE "(^|[^)] )static (let|var) shared(Instance)?\b" $SRC_PATHS && fail "shared without nonisolated(unsafe)"

          grep -q 'natsuk1_pairing.plist' natsuk1/Helpers/PairingController.swift || fail "no pairing path"
          grep -q 'al_device_respring' natsuk1/Helpers/AirliftBridge.swift || fail "no respring"

          grep -q 'TabView' natsuk1/Views/ContentView.swift || fail "no TabView"
          grep -q '"bolt.fill"' natsuk1/Views/ContentView.swift || fail "no bolt tab"
          grep -q '"wrench.and.screwdriver.fill"' natsuk1/Views/ContentView.swift || fail "no wrench tab"
          grep -q '"gearshape.fill"' natsuk1/Views/ContentView.swift || fail "no gear tab"

          if grep -q 'MobileGestalt' natsuk1/Views/ToolsView.swift; then fail "Spoof present"; fi
          if grep -q 'Spoof' natsuk1/Views/ToolsView.swift; then fail "Spoof section present"; fi

          grep -q 'Run Exploit' natsuk1/Views/OverviewView.swift || fail "no run exploit"
          grep -q 'LogTerminal' natsuk1/Views/OverviewView.swift || fail "no LogTerminal"

          grep -q 'PathAccessView' natsuk1/Views/ToolsView.swift || fail "no PathAccess"

          grep -q 'SWIFT_VERSION: "5.0"' project.yml || fail "not Swift 5"
          grep -q "SWIFT_DEFAULT_ACTOR_ISOLATION" project.yml && fail "has default actor isolation"
          grep -q "default-isolation" project.yml && fail "has default-isolation flag"

          echo "verify OK"

      - name: Install tools
        run: brew install xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj -scheme natsuk1 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-dynamic-actor-isolation -Xfrontend -disable-actor-data-race-checks" \
            -UseModernBuildSystem=YES build -quiet

      - name: Package app tarball
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          [ -z "$APP_PATH" ] && { echo "no .app"; exit 1; }
          tar -czf natsuk1-app.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: natsuk1-app-tar
          path: natsuk1-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          ldid -Snatsuk1/Resources/natsuk1.entitlements "$APP_PATH/natsuk1"
          rm -rf Payload natsuk1.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          COPYFILE_DISABLE=1 zip -qry natsuk1.ipa Payload
          rm -rf Payload
          if gh release view development >/dev/null 2>&1; then gh release delete development --yes --cleanup-tag; fi
          gh release create development natsuk1.ipa \
            --target "${GITHUB_SHA}" --title "Development" \
            --prerelease --latest=false --notes "Clean redesign"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/ .github/ project.yml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Clean redesign [skip ci]"
          git push
