name: Fix KeepAlive stopAll

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Patch KeepAlive and NetworkStatus
        run: |
          cat > /tmp/fix.py <<'PYEOF'
          import re

          p = "natsuk1/Helpers/KeepAlive.swift"
          s = open(p).read()

          if "func stopAll()" not in s:
              marker = "    func stopAudio() {"
              block = (
                  "    func stopAll() {\n"
                  "        stopAudio()\n"
                  "        stopLocation()\n"
                  "    }\n\n"
              )
              s = s.replace(marker, block + marker, 1)
              open(p, "w").write(s)
              print("added stopAll to KeepAlive")

          p = "natsuk1/Helpers/NetworkStatus.swift"
          s = open(p).read()

          old = "        return String(cString: host)\n"
          new = (
              "        let bytes = host.prefix { $0 != 0 }.map { UInt8(bitPattern: $0) }\n"
              "        return String(decoding: bytes, as: UTF8.self)\n"
          )
          if old in s:
              s = s.replace(old, new)
              open(p, "w").write(s)
              print("fixed deprecated String(cString:) in NetworkStatus")
          PYEOF
          python3 /tmp/fix.py

      - name: Install tools
        run: |
          brew install xcodegen ldid || true
          brew link --overwrite xcodegen ldid || true

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Build
        id: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project natsuk1.xcodeproj \
            -scheme natsuk1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            -UseModernBuildSystem=YES \
            build -quiet

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          echo "built: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add natsuk1/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Add KeepAlive.stopAll() and fix deprecated String(cString:) [skip ci]"
          git push
